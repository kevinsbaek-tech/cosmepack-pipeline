function SourcingEditModal({ item, onClose, onSave }) {
  const [image, setImage] = useState(item.image || "");
  const [name, setName] = useState(item.name || "");
  const [rmbCost, setRmbCost] = useState(item.rmbCost || 0);
  const [quantity, setQuantity] = useState(item.quantity || 0);
  const [totalShippingRmb, setTotalShippingRmb] = useState(item.totalShippingRmb || 0);
  const [factory, setFactory] = useState(item.factory || "");
  const [factoryContact, setFactoryContact] = useState(item.factoryContact || "");
  const [wechatGroup, setWechatGroup] = useState(item.wechatGroup || "");
  const [link, setLink] = useState(item.link || "");
  const [factoryLink, setFactoryLink] = useState(item.factoryLink || "");
  const [spec, setSpec] = useState(item.spec || "");

  const save = () => {
    if (!name.trim()) return;
    const qty = Number(quantity) || 0;
    onSave(item.id, {
      image, name, rmbCost: Number(rmbCost) || 0, quantity: qty,
      totalShippingRmb: Number(totalShippingRmb) || 0,
      unitShippingRmb: qty > 0 ? (Number(totalShippingRmb) || 0) / qty : 0,
      factory, factoryContact, wechatGroup, link, factoryLink, spec,
    });
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-2xl overflow-hidden flex flex-col" style={{ maxHeight: "85vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">✏️ 가격조사 항목 수정</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          <Field label="제품 사진"><ImageUpload value={image} onChange={setImage} /></Field>
          <div className="grid grid-cols-2 gap-4 mt-4">
            <Field label="품명" span={2}><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} /></Field>
            <Field label="위안화 원가" hint="RMB/개"><input type="number" className={inputCls} value={rmbCost} onChange={(e) => setRmbCost(e.target.value)} /></Field>
            <Field label="수량" hint="개"><input type="number" className={inputCls} value={quantity} onChange={(e) => setQuantity(e.target.value)} /></Field>
            <Field label="중국 내 운송료" hint="총 RMB"><input type="number" className={inputCls} value={totalShippingRmb} onChange={(e) => setTotalShippingRmb(e.target.value)} /></Field>
            <Field label="위챗 단체방명"><input className={inputCls} value={wechatGroup} onChange={(e) => setWechatGroup(e.target.value)} /></Field>
            <Field label="공장명"><input className={inputCls} value={factory} onChange={(e) => setFactory(e.target.value)} /></Field>
            <Field label="공장 연락처"><input className={inputCls} value={factoryContact} onChange={(e) => setFactoryContact(e.target.value)} /></Field>
            <Field label="1688 링크" span={2}><input className={inputCls} value={link} onChange={(e) => setLink(e.target.value)} /></Field>
            <Field label="공장 홈페이지 링크" span={2}><input className={inputCls} value={factoryLink} onChange={(e) => setFactoryLink(e.target.value)} /></Field>
            <Field label="상세 스펙 / 비고" span={2}><AutoResizeTextarea value={spec} onChange={setSpec} minRows={3} /></Field>
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">✓ 수정 반영</button>
        </div>
      </div>
    </div>
  );
}

        <button onClick={() => onDelete(item)} className="text-xs px-3 py-1.5 rounded-lg border border-red-100 text-red-500 hover:bg-red-50 whitespace-nowrap">🗑️ 삭제</button>

function SourcingStage({ items, onAdd, onUpdateItem, onDeleteItem, onSend, onSendBulk, products, pickedProduct, onConsumePicked, currentUserName }) {
  const [sourcingFilter, setSourcingFilter] = useState("mine"); // mine=내 조사건(기본) | others=직원 조사건 | all=전체 조사건
  const [editingSourcingItem, setEditingSourcingItem] = useState(null);
  const [image, setImage] = useState("");
  const [name, setName] = useState("");
  const [rmbCost, setRmbCost] = useState("");
  const [quantity, setQuantity] = useState("");
  const [totalShippingRmb, setTotalShippingRmb] = useState("");
  const [inspectionRmb, setInspectionRmb] = useState(""); // 검품비용(RMB) 총액 — "기존 데이터에서 선택" 팝업 및 2단계 제안가계산으로 자동 연동됨
  const [factory, setFactory] = useState("");
  const [factoryContact, setFactoryContact] = useState("");
  const [wechatGroup, setWechatGroup] = useState("");
  const [link, setLink] = useState("");
  const [factoryLink, setFactoryLink] = useState("");
  const [spec, setSpec] = useState("");
  const [category, setCategory] = useState(""); // 기존 제품 DB에서 불러온 제품의 카테고리(제안가 계산 화면으로 넘어갈 때 그대로 반영됨)
  const [selected, setSelected] = useState([]);
  const [productSearch, setProductSearch] = useState("");
  const [showProductPicker, setShowProductPicker] = useState(false);
  const [showRmbPicker, setShowRmbPicker] = useState(false);
  const [rmbPickerPos, setRmbPickerPos] = useState({ top: 0, left: 0 });
  const rmbInputRef = useRef(null);
  const openRmbPicker = () => {
    if (rmbInputRef.current) {
      const rect = rmbInputRef.current.getBoundingClientRect();
      setRmbPickerPos({ top: rect.bottom + 4, left: rect.left });
    }
    setShowRmbPicker(true);
  };

  const rmbPickerRows = (products || [])
    .filter((p) => name.trim() && (p.name || "").toLowerCase().includes(name.trim().toLowerCase()))
    .flatMap((p) => {
      const tiers = (p.priceTiers && p.priceTiers.length > 0) ? p.priceTiers : [{ qty: "", cbm: "", shippingRmb: "", factoryPriceRmb: p.rmbCost || "" }];
      return tiers.map((tier) => ({
        product: p,
        qty: tier.qty,
        cbm: tier.cbm,
        rmbCost: tier.factoryPriceRmb,
        shippingRmb: tier.shippingRmb,
        inspectionRmb: tier.inspectionRmb || 0,
        factory: p.factory || "",
        wechatGroup: p.wechatGroup || "",
      }));
    })
    .filter((r) => r.rmbCost !== "" && r.rmbCost !== undefined);

  const pickFromRmbPicker = (row) => {
    pickProduct(row.product);
    if (row.qty) setQuantity(row.qty);
    if (row.rmbCost) setRmbCost(row.rmbCost);
    if (row.shippingRmb) setTotalShippingRmb(row.shippingRmb);
    if (row.inspectionRmb) setInspectionRmb(row.inspectionRmb);
    if (row.cbm) setSpec((prev) => (prev ? prev + `\n예상 CBM: ${row.cbm}` : `예상 CBM: ${row.cbm}`));
    setShowRmbPicker(false);
  };

  const productMatches = smartProductSearch(products, productSearch);

  const pickProduct = (p) => {
    setName(p.name || "");
    setImage(p.image || "");
    setSpec([p.specSize ? `사이즈: ${p.specSize}` : "", p.material ? `재질: ${p.material}` : ""].filter(Boolean).join("\n"));
    setCategory(p.category || ""); // 불러온 제품의 카테고리를 그대로 캡처 — 나중에 제안가 계산 화면으로 넘어갈 때 자동 반영됨
    setFactory(p.factory || "");
    setWechatGroup(p.wechatGroup || "");
    setFactoryLink(p.factoryLink || "");
    if (p.rmbCost) setRmbCost(p.rmbCost);
    if (p.totalShippingRmb) setTotalShippingRmb(p.totalShippingRmb);
    if (p.moqQuantity) setQuantity(p.moqQuantity); // 박스히어로 "(K)최소제작수량" 파싱값을 수량 기본값으로 자동 반영
    setShowProductPicker(false);
    setProductSearch("");
  };

  useEffect(() => {
    if (pickedProduct) {
      pickProduct(pickedProduct);
      if (onConsumePicked) onConsumePicked();
    }
  }, [pickedProduct]);

  const unitShippingPreview = Number(quantity) > 0 ? Number(totalShippingRmb || 0) / Number(quantity) : 0;
  const unitInspectionPreview = Number(quantity) > 0 ? Number(inspectionRmb || 0) / Number(quantity) : 0;

  const submit = () => {
    if (!name.trim() || !rmbCost) return;
    const qty = Number(quantity) || 0;
    onAdd({
      id: Date.now(), image, name, rmbCost: Number(rmbCost), quantity: qty,
      totalShippingRmb: Number(totalShippingRmb) || 0,
      unitShippingRmb: qty > 0 ? (Number(totalShippingRmb) || 0) / qty : 0,
      inspectionRmb: Number(inspectionRmb) || 0,
      factory, factoryContact, wechatGroup, link, factoryLink, spec, category,
    });
    setImage(""); setName(""); setRmbCost(""); setQuantity(""); setTotalShippingRmb(""); setInspectionRmb("");
    setFactory(""); setFactoryContact(""); setWechatGroup(""); setLink(""); setFactoryLink(""); setSpec(""); setCategory("");
  };

  const toggle = (id) => setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  const filteredItems = useMemo(() => items.filter((it) => {
    if (sourcingFilter === "mine") return it.createdBy === currentUserName;
    if (sourcingFilter === "others") return it.createdBy && it.createdBy !== currentUserName;
    return true;
  }), [items, sourcingFilter, currentUserName]);
  const allChecked = filteredItems.length > 0 && selected.length === filteredItems.length;
  const toggleAll = () => setSelected(allChecked ? [] : filteredItems.map((i) => i.id));
  const sendSelected = () => {
    const chosen = filteredItems.filter((i) => selected.includes(i.id));
    if (chosen.length === 0) return;
    onSendBulk(chosen);
    setSelected([]);
  };
  useEffect(() => { setSelected([]); }, [sourcingFilter]);

  return (
    <main className="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
      {editingSourcingItem && (
        <SourcingEditModal item={editingSourcingItem} onClose={() => setEditingSourcingItem(null)}
          onSave={(id, patch) => { onUpdateItem(id, patch); setEditingSourcingItem(null); }} />
      )}
      <div className="space-y-6">
        <div className="text-xs font-semibold text-slate-400 tracking-wide px-1">1단계 · 가격조사 등록</div>
        <Card title="신규 가격조사 건 등록">
          <div className="mb-4 pb-4 border-b border-dashed border-slate-200">
            <button
              type="button" onClick={() => setShowProductPicker((v) => !v)}
              className="w-full flex items-center justify-between px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50"
            >
              <span>🔍 기존 제품 DB에서 불러오기</span>
              <span className="text-xs text-slate-400">{showProductPicker ? "닫기 ▲" : "열기 ▼"}</span>
            </button>
            {showProductPicker && (
              <div className="mt-2">
                <input
                  autoFocus value={productSearch} onChange={(e) => setProductSearch(e.target.value)}
                  placeholder="예: 튜브, 40, 원터치 (쉼표/공백으로 여러 키워드 검색)"
                  className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A] mb-2"
                />
                <div className="max-h-52 overflow-y-auto space-y-1">
                  {productMatches.length === 0 && <p className="text-xs text-slate-400 py-2 text-center">일치하는 제품이 없습니다.</p>}
                  {productMatches.map((p) => (
                    <button key={p.id} type="button" onClick={() => pickProduct(p)}
                      className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 text-left">
                      <div className="w-9 h-9 rounded bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
                        {p.image ? <img src={p.image} loading="lazy" className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[8px]">사진</span>}
                      </div>
                      <div className="min-w-0">
                        <div className="text-xs font-medium text-slate-700 truncate">{p.name}</div>
                        <div className="text-[10px] text-slate-400 truncate">{p.factory || "공장정보 없음"}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
          <Field label="제품 사진"><ImageUpload value={image} onChange={setImage} /></Field>
          <Field label="품명" hint="예: 40ml 유리 스포이드 용기"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="위안화 원가" hint="RMB/개 · 클릭하면 기존 데이터 불러오기">
              <div className="relative">
                <input ref={rmbInputRef} type="number" className={inputCls} value={rmbCost} onChange={(e) => setRmbCost(e.target.value)} onFocus={openRmbPicker} />
                {showRmbPicker && (
                  <>
                    <div className="fixed inset-0 z-10" onClick={() => setShowRmbPicker(false)} />
                    <div className="fixed z-20 bg-white border border-slate-300 rounded-lg shadow-xl max-h-[420px] overflow-y-auto" style={{ width: "760px", maxWidth: "92vw", top: rmbPickerPos.top, left: rmbPickerPos.left }}>
                    <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100 sticky top-0 bg-white">
                      <span className="text-sm font-semibold text-slate-600">"{name || "(품명 미입력)"}" 기존 데이터에서 선택</span>
                      <button onClick={() => setShowRmbPicker(false)} className="text-slate-300 hover:text-slate-500 text-lg leading-none">✕</button>
                    </div>
                    {!name.trim() ? (
                      <p className="text-sm text-slate-400 text-center py-8 px-4">먼저 위의 "품명"을 입력해주세요. 입력한 품명과 일치하는 제품의 기존 데이터만 여기에 표시됩니다.</p>
                    ) : rmbPickerRows.length === 0 ? (
                      <p className="text-sm text-slate-400 text-center py-8 px-4">"{name}"과(와) 일치하는 기존 데이터가 없습니다.</p>
                    ) : (
                      <table className="w-full text-sm">
                        <thead><tr className="text-slate-500 border-b border-slate-100 bg-slate-50">
                          <th className="text-left px-3 py-2 font-medium">제품명</th>

                          <th className="text-right px-3 py-2 font-medium">단가(RMB)</th>
                          <th className="text-right px-3 py-2 font-medium">운송료</th>
                          <th className="text-right px-3 py-2 font-medium">검품비용</th>
                          <th className="text-left px-3 py-2 font-medium">공장명</th>
                          <th className="text-left px-3 py-2 font-medium">위챗 단체방명</th>
                          <th></th>
                        </tr></thead>
                        <tbody>
                          {rmbPickerRows.map((row, i) => (
                            <tr key={i} className="border-b border-slate-50 hover:bg-slate-50">

                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                  </>
                )}
              </div>

            <Field label="수량" hint="개"><input type="number" className={inputCls} value={quantity} onChange={(e) => setQuantity(e.target.value)} /></Field>

              <input type="number" className={inputCls} value={inspectionRmb} onChange={(e) => setInspectionRmb(e.target.value)} placeholder="예: 200 (총액, RMB)" />
            </Field>

          <div className="grid grid-cols-2 gap-4">

          </div>
          <Field label="공장 연락처" hint="전화 / 위챗ID 등"><input className={inputCls} value={factoryContact} onChange={(e) => setFactoryContact(e.target.value)} placeholder="예: 138-xxxx-xxxx" /></Field>

function ProposalEditStage({ draftItems, setDraftItems, removeDraftItem, clientInfo, setClientInfo, onBack, onSave, onPrint, readOnly, isEditingExisting, historyRecord, isAdmin }) {

    if (readOnly) return;
    setDraftItems((prev) => prev.map((it) => {
      if (it.id !== id) return it;
      const next = { ...it, [field]: value };
      if (field === "quantity" || field === "unitPrice") {
        const q = field === "quantity" ? Number(value) || 0 : it.quantity;
        const p = field === "unitPrice" ? Number(value) || 0 : it.unitPrice;
        next.quantity = q; next.unitPrice = p; next.totalPrice = q * p;
      }
      return next;
    }));
  };

  const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
  const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);

  return (

          {!readOnly && isEditingExisting && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 font-medium">✏️ 수정 중</span>}

      </div>

      <Card title="고객 정보">
        <Field label="제안서 제목" hint="예: 300ml/500ml PE 샴푸 용기 공급제안">
          <input disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.proposalTitle} onChange={(e) => setClientInfo({ ...clientInfo, proposalTitle: e.target.value })} placeholder="제안서 제목을 입력해주세요" />
        </Field>
        <div className="grid grid-cols-2 gap-4">

          <Field label="담당자명"><input disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.contact} onChange={(e) => setClientInfo({ ...clientInfo, contact: e.target.value })} placeholder="예: 홍길동" /></Field>
          <Field label="문의 채널">
            <select disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.channel} onChange={(e) => setClientInfo({ ...clientInfo, channel: e.target.value })}><option>카카오채널</option><option>이메일</option><option>전화</option></select>

        </div>

      <div className="h-6" />

        {draftItems.length === 0 ? (
          <p className="text-xs text-slate-400 py-6 text-center">담긴 품목이 없습니다. 이전 단계에서 품목을 추가해주세요.</p>
        ) : (
          <div className="space-y-4">
            {draftItems.map((it) => (
              <div key={it.id} className="border border-slate-200 rounded-xl p-4 flex gap-4">

              </div>
            ))}
            <div className="flex justify-end gap-6 pt-3 border-t border-slate-100 text-xs">
              <span className="text-slate-500">총 CBM <b className="text-slate-700">{totalCbm}</b></span>
              <span className="text-slate-500">총 제안금액 <b className="text-[#1E3A8A] text-sm">{won(totalAmount)}</b></span>
            </div>
          </div>
        )}
      </Card>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-2px_8px_rgba(0,0,0,0.04)] no-print">
        <div className="max-w-5xl mx-auto px-6 py-4 flex justify-end gap-3">

          {/* 기존 제안서를 수정 중일 때만 노출 — 미리보기를 거치지 않고 폼에서 바로 저장하고 목록으로 돌아간다.
              (PDF 미리보기 모달 상단의 [💾 제안서 저장]은 그대로 유지되며 서로 독립적으로 동작) */}
          {!readOnly && isEditingExisting && (
            <button onClick={() => onSave({ returnToList: true })} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-sm flex items-center gap-1.5 text-sm transition-all">
              💾 수정 후 저장
            </button>
          )}
          <button onClick={onPrint} className="px-5 py-2.5 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 transition-opacity">
            {isEditingExisting ? "📄 PDF 미리보기" : "🖨 PDF 미리보기 / 인쇄"}
          </button>
        </div>
      </div>
    </main>
  );
}

function ExcelArchiveView({ archive, onBack, onUpload, onUploadZip, onApplyAll, onDelete, onApply, onResetExcelData, onDeleteAllUploaded, onDedupe, onBulkDelete }) {
  const [busy, setBusy] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);
  const [page, setPage] = useState(1);
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const PAGE_SIZE = 20;

  const sortedArchive = useMemo(() => sortByKey(archive, sortKey, (a) => a.fileName, (a) => a.uploadedAt), [archive, sortKey]);
  const totalPages = Math.max(1, Math.ceil(sortedArchive.length / PAGE_SIZE));
  const pagedArchive = sortedArchive.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { if (page > totalPages) setPage(totalPages); }, [totalPages]);
  useEffect(() => { setSelectedIds([]); }, [page, sortKey]);
  const allPagedSelected = pagedArchive.length > 0 && pagedArchive.every((a) => selectedIds.includes(a.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : pagedArchive.map((a) => a.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  const processFile = async (file) => {
    if (!file) return;
    setBusy(true);
    try {
      if (/\.zip$/i.test(file.name)) await onUploadZip(file);
      else await onUpload(file);
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  };

  const handleFile = async (e) => { await processFile(e.target.files && e.target.files[0]); };
  const handleDrop = async (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    await processFile(file);
  };

  const download = (item) => {
    if (!item.fileData) { alert("이 파일은 용량이 커서 원본이 보관되지 않았습니다. (자동 분석된 데이터는 정상적으로 반영되어 있습니다)"); return; }
    const a = document.createElement("a");
    a.href = item.fileData;
    a.download = item.fileName;
    a.click();
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">📂 엑셀 보관함 (데이터룸)</h2>
        <div className="flex gap-2 items-center flex-wrap">
          <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]">
            {SORT_OPTIONS_COMMON.map(([k, label]) => <option key={k} value={k}>정렬: {label}</option>)}
          </select>
          {onApplyAll && <button onClick={onApplyAll} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">🔗 전체 파이프라인 적용</button>}
          {onDedupe && <button onClick={onDedupe} title="파일명이 같은 중복 항목을 찾아 파일명당 1건(적용완료/최신 우선)만 남기고 정리합니다" className="px-4 py-2 rounded-lg border border-amber-200 text-amber-700 bg-amber-50 text-sm font-medium hover:bg-amber-100 whitespace-nowrap">🧹 중복 파일 정리</button>}
          {onBulkDelete && (
            <React.Fragment>
              <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer whitespace-nowrap">
                <input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /> 전체 선택
              </label>
              <button
                onClick={async () => { await onBulkDelete(selectedIds); setSelectedIds([]); }}
                disabled={selectedIds.length === 0}
                className="text-xs px-3 py-2 rounded-lg border border-red-200 text-red-600 font-medium hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
              >
                🗑️ 선택 삭제 ({selectedIds.length}개)
              </button>
            </React.Fragment>
          )}
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={handleDrop}
        className={"bg-white border shadow-sm rounded-xl p-4 mb-6 transition-colors " + (dragOver ? "border-[#1E3A8A] bg-[#1E3A8A]/5" : "border-slate-300")}
      >
        <p className="text-xs text-slate-500 mb-3">
          견적 엑셀 파일(.xlsx) 또는 여러 엑셀을 묶은 ZIP 압축파일을 업로드(또는 이 영역에 드래그앤드롭)하면 '가격조사'/'제안가격'/'제안서(원화)' 시트를 자동으로 분석해서
          업체·공장·제품·제안서 목록에 <b>업로드 시 1회만</b> 자동 등록됩니다. ZIP 안에 PDF 등 다른 파일이 섞여 있어도 .xlsx만 골라서 처리합니다. "🔗 파이프라인 적용"을 처음 누르면 공장 홈페이지링크·제품 수량별 단가 등도 함께 심층 반영되고, 이후에는 데이터를 3단계로 다시 불러오기만 합니다.
        </p>
        <button onClick={() => fileRef.current && fileRef.current.click()} disabled={busy} className="text-sm px-4 py-2 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 disabled:opacity-50 whitespace-nowrap">
          {busy ? "분석 중..." : "📥 견적 엑셀/ZIP 업로드 (.xlsx, .zip)"}
        </button>
        <span className="text-xs text-slate-400 ml-2">또는 이 영역에 파일을 끌어다 놓으세요</span>
        <input ref={fileRef} type="file" accept=".xlsx,.zip" className="hidden" onChange={handleFile} />
      </div>

      {archive.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">아직 보관된 엑셀 파일이 없습니다.</div>
      ) : (
        <div className="bg-white border border-slate-300 shadow-sm rounded-xl overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              {onBulkDelete && <th className="text-center px-2 py-3 font-medium"><input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /></th>}
              <th className="text-left px-4 py-3 font-medium">파일명</th>
              <th className="text-left px-4 py-3 font-medium">업로드 일시</th>
              <th className="text-left px-4 py-3 font-medium">거래처명</th>
              <th className="text-right px-4 py-3 font-medium">총 금액</th>
              <th className="text-right px-4 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {pagedArchive.map((item, idx) => (
                <tr key={item.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  {onBulkDelete && <td className="px-2 py-3 text-center"><input type="checkbox" checked={selectedIds.includes(item.id)} onChange={() => toggleSelectOne(item.id)} /></td>}
                  <td className="px-4 py-3 font-medium" style={{ color: "#111827" }}>
                    {item.fileName}
                    <div className="text-xs text-slate-400 font-normal mt-0.5">품목 {item.itemCount || 0}건</div>
                  </td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{item.uploadedAt}</td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{item.clientName}</td>
                  <td className="px-4 py-3 text-right font-semibold whitespace-nowrap" style={{ color: "#1E293B" }}>{won(item.totalAmount)}</td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <div className="flex gap-1.5 justify-end">
                      <button onClick={() => onApply(item)} className={"text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap font-medium " + (item.pipelineApplied ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-[#1E3A8A] text-white hover:opacity-90")}>
                        {item.pipelineApplied ? "✅ 적용 완료" : "🔗 파이프라인 적용"}
                      </button>
                      <button onClick={() => download(item)} className="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 whitespace-nowrap">⬇ 다운로드</button>
                      <button onClick={() => onDelete(item)} className="text-xs px-2.5 py-1.5 rounded-lg border border-red-100 text-red-500 hover:bg-red-50">🗑️ 삭제</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={sortedArchive.length} />
    </main>
  );
}

// 업체 문의경로 — 기존 "채널" 라벨에서 명칭 변경. 옛 저장값(전화 등)도 그대로 표시되도록 옵션에 없으면 앞에 덧붙인다
const CLIENT_INQUIRY_ROUTES = ["카카오채널", "유선전화", "이메일", "지인소개", "웹사이트", "기타"];

function ClientFormModal({ client, onClose, onSave }) {
  const isEdit = !!(client && client.id);
  const [name, setName] = useState((client && client.name) || "");
  const [ceoName, setCeoName] = useState((client && client.ceoName) || "");
  const [address, setAddress] = useState((client && client.address) || "");
  const [contact, setContact] = useState((client && client.contact) || "");
  const [managerPhone, setManagerPhone] = useState((client && client.managerPhone) || "");
  const [channel, setChannel] = useState((client && client.channel) || "카카오채널");
  const [difficulty, setDifficulty] = useState((client && client.difficulty) || "표준");
  const [tags, setTags] = useState(getClientTags(client)); // 옛 clientTier/isKeyClient 데이터도 자동으로 배열로 잡힌다
  const toggleTag = (k) => setTags((prev) => (prev.includes(k) ? prev.filter((x) => x !== k) : [...prev, k]));
  const [note, setNote] = useState((client && client.note) || "");
  const [attachments, setAttachments] = useState((client && client.attachments) || []);
  const fileRef = useRef(null);
  // 옛 데이터의 채널값("전화" 등)이 옵션에 없으면 맨 앞에 끼워넣어 선택이 풀리지 않게 한다
  const routeOptions = CLIENT_INQUIRY_ROUTES.includes(channel) ? CLIENT_INQUIRY_ROUTES : [channel, ...CLIENT_INQUIRY_ROUTES];

  /* 📎 명함·사업자등록증 첨부 — Firestore 문서에 dataURL로 직접 저장한다(이 시스템은 Storage 미사용).
     ⚠️ 문서 1건 1MB 제한이 있어 파일당 약 700KB로 막고, 이미지는 압축을 시도한다. */
  const MAX_FILE_BYTES = 700 * 1024;
  const addFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    for (const f of files) {
      try {
        let dataUrl = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => rej(new Error("read fail"));
          r.readAsDataURL(f);
        });
        const isImage = (f.type || "").startsWith("image/");
        if (isImage && typeof compressBase64Image === "function" && dataUrl.length > MAX_FILE_BYTES) {
          try { dataUrl = await compressBase64Image(dataUrl, MAX_FILE_BYTES); } catch (e) { console.error(e); }
        }
        if (dataUrl.length > MAX_FILE_BYTES * 1.4) {
          window.alert(`"${f.name}" 파일이 너무 큽니다(약 ${Math.round(dataUrl.length / 1024)}KB).\n700KB 이하로 줄여서 다시 올려주세요.`);
          continue;
        }
        setAttachments((prev) => [...prev, { id: Date.now() + Math.random(), name: f.name, type: f.type || "", size: f.size, dataUrl, uploadedAt: nowDateTimeStr() }]);
      } catch (e) { console.error(e); }
    }
    if (fileRef.current) fileRef.current.value = ""; // 같은 파일 재선택이 가능하도록 초기화
  };
  const removeAttachment = (id) => setAttachments((prev) => prev.filter((a) => a.id !== id));

  const save = () => {
    if (!name.trim()) return;
    const payload = { name, ceoName, address, contact, managerPhone, channel, difficulty, note, attachments, ...buildClientTagPatch(tags) };
    if (isEdit) onSave(client.id, payload);
    else onSave(null, { id: Date.now(), ...payload });
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden flex flex-col" style={{ maxHeight: "90vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">{isEdit ? "✏️ 업체 정보 수정" : "➕ 신규 업체 등록"}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 grid grid-cols-2 gap-4 overflow-y-auto flex-1">
          <Field label="업체명" span={2}><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 주식회사 닥터스칼프" /></Field>
          <Field label="대표자명" span={2}><input type="text" className={inputCls} value={ceoName} onChange={(e) => setCeoName(e.target.value)} placeholder="예: 홍길동" /></Field>
          <Field label="사업장 주소" span={2}><input type="text" className={inputCls} value={address} onChange={(e) => setAddress(e.target.value)} placeholder="예: 경기도 고양시 일산동구..." /></Field>
          <p className="col-span-2 -mt-2 text-[11px] text-indigo-600 bg-indigo-50 border border-indigo-100 rounded-lg px-3 py-2">
            ※ 업체명, 대표자명, 주소는 5단계 표준계약서 서식에 자동 연동됩니다.
          </p>

          <Field label="담당자"><input className={inputCls} value={contact} onChange={(e) => setContact(e.target.value)} placeholder="담당자명" /></Field>
          <Field label="담당자 연락처"><input type="text" className={inputCls} value={managerPhone} onChange={(e) => setManagerPhone(e.target.value)} placeholder="예: 010-1234-5678" /></Field>

          <Field label="문의경로">
            <select className={inputCls} value={channel} onChange={(e) => setChannel(e.target.value)}>
              {routeOptions.map((o) => <option key={o} value={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="작업 난이도">
            <select className={inputCls} value={difficulty} onChange={(e) => setDifficulty(e.target.value)}>
              {CLIENT_DIFFICULTY_LEVELS.map((l) => <option key={l} value={l}>{l}</option>)}
            </select>
          </Field>
          <div className="col-span-2">
            <label className="block text-xs font-semibold text-slate-700 mb-1">업체 분류 <span className="font-normal text-slate-400">(여러 개 선택 가능)</span></label>
            <div className="flex flex-wrap gap-2">
              {CLIENT_TIERS.map((t) => {
                const on = tags.includes(t.key);
                return (
                  <button key={t.key} type="button" onClick={() => toggleTag(t.key)}
                    className={"text-xs px-3 py-1.5 rounded-lg border font-semibold whitespace-nowrap transition " + (on ? t.onCls : "bg-white text-slate-400 border-slate-200 hover:bg-slate-50")}>
                    {t.label}
                  </button>
                );
              })}
            </div>
            {tags.length === 0 && <p className="text-xs text-slate-400 mt-1">선택하지 않으면 일반 업체로 저장됩니다.</p>}
          </div>

          <Field label="특이사항" span={2}><AutoResizeTextarea value={note} onChange={setNote} minRows={2} placeholder="업체별 특징, 주의사항 등 자유 메모" /></Field>

          <div className="col-span-2">
            <div className="text-xs font-semibold text-slate-600 mb-1.5">📎 파일 업로드 <span className="font-normal text-slate-400">(명함 / 사업자등록증 등)</span></div>
            <input ref={fileRef} type="file" accept="image/*,.pdf" multiple onChange={(e) => addFiles(e.target.files)}
              className="w-full text-xs text-slate-600 file:mr-3 file:px-3 file:py-1.5 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-700 file:text-xs file:font-semibold hover:file:bg-slate-200 cursor-pointer" />
            {attachments.length > 0 && (
              <div className="mt-2 space-y-1.5">
                {attachments.map((a) => (
                  <div key={a.id} className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg p-2">
                    {(a.type || "").startsWith("image/") ? (
                      <img src={a.dataUrl} alt={a.name} className="w-10 h-10 object-cover rounded border border-slate-200 shrink-0" />
                    ) : (
                      <span className="w-10 h-10 flex items-center justify-center rounded border border-slate-200 bg-white text-lg shrink-0">📄</span>
                    )}
                    <div className="min-w-0 flex-1">
                      <a href={a.dataUrl} target="_blank" rel="noreferrer" className="block text-xs text-slate-700 truncate hover:text-[#1E3A8A] hover:underline" title={a.name}>{a.name}</a>
                      <div className="text-[10px] text-slate-400">{a.size ? `${Math.round(a.size / 1024)}KB` : ""}{a.uploadedAt ? ` · ${a.uploadedAt}` : ""}</div>
                    </div>
                    <button onClick={() => removeAttachment(a.id)} title="첨부 삭제" className="text-slate-400 hover:text-rose-500 text-sm shrink-0">✕</button>
                  </div>
                ))}
              </div>
            )}
            <p className="text-[11px] text-slate-400 mt-1.5">이미지·PDF 첨부 가능 (파일당 700KB 이하 권장). 저장 버튼을 눌러야 최종 반영됩니다.</p>
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">{isEdit ? "✓ 수정 반영" : "＋ 업체 등록"}</button>
        </div>
      </div>
    </div>
  );
}

// 범용 "선택 항목 병합" 모달 — 공장병합(FactoryMergeModal)과 동일한 패턴을 제품/업체에도 재사용
// 인보이스 발행 전 편집 단계 — 제안서 품목별로 수량/단가를 다시 확인하고, 카테고리별 후가공 옵션을 체크박스로 다시 선택할 수 있다.
// (2단계 계산화면의 전체 원가계산 엔진까지는 재사용하지 않고, "후가공 재선택 + 수량/단가 조정"에 집중한 경량 편집 단계)
function InvoiceEditModal({ proposal, finishingOptions, onCancel, onConfirm }) {
  const [items, setItems] = useState(() => (proposal.items || []).map((it) => ({ ...it, id: it.id || Date.now() + Math.random(), selectedFinishingIds: [] })));

  const updateItem = (id, patch) => setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
  const removeItem = (id) => setItems((prev) => prev.filter((it) => it.id !== id));
  // "품목 추가" — 제안서에 없던 항목도 인보이스에서만 자유롭게 새로 넣을 수 있다(원본 제안서는 절대 안 건드림)
  const addItem = () => setItems((prev) => [...prev, {
    id: Date.now() + Math.random(), image: "", productName: "", specSize: "", material: "", category: "",
    quantity: 0, unitPrice: 0, totalPrice: 0, notes: "", selectedFinishingIds: [],
  }]);

  // 체크/해제할 때마다 해당 항목의 "비고"란 맨 앞부분에 선택된 후가공 목록을 다시 구성해 넣는다(기존 비고의 나머지 문구는 보존)
  const toggleFinishing = (item, opt) => {
    const already = item.selectedFinishingIds.includes(opt.id);
    const nextIds = already ? item.selectedFinishingIds.filter((id) => id !== opt.id) : [...item.selectedFinishingIds, opt.id];
    const options = finishingOptions[item.category] || [];
    const chosen = options.filter((o) => nextIds.includes(o.id));
    const finishingLines = chosen.map((o) => `${o.name}: ${(o.krwPrice || 0).toLocaleString("ko-KR")}원${o.unitLabel ? `/${o.unitLabel}` : ""}`);
    const restNotes = (item.notes || "").split("\n").filter((line) => !options.some((o) => line.startsWith(`${o.name}:`))).join("\n");
    const nextNotes = [...finishingLines, restNotes].filter(Boolean).join("\n");
    updateItem(item.id, { selectedFinishingIds: nextIds, notes: nextNotes });
  };

  /* 차감/할인 — 샘플비를 본품 대금에서 빼주는 등의 처리.
     공급가액 자체를 줄이므로 부가세도 차감 후 금액 기준으로 계산된다(세금계산서와 일치시키기 위함). */
  const [discountReason, setDiscountReason] = useState(proposal.discountReason || "샘플비용 차감");
  const [discountPreset, setDiscountPreset] = useState(() => {
    const r = proposal.discountReason || "샘플비용 차감";
    return r === "샘플비용 차감" ? "sample" : (r === "기타 차감" ? "etc" : "custom");
  });
  const [discountAmount, setDiscountAmount] = useState(Number(proposal.discountAmount) || 0);

  // 인보이스 화면에서도 부가세·계약금(30%)·중도금(60%)·잔금(10%)이 실시간으로 어떻게 나올지 바로 보여준다(최종 미리보기와 동일한 계산식)
  const subtotal = items.reduce((s, it) => s + (Number(it.totalPrice) || 0), 0); // 품목 금액 합계(차감 전)
  const discountValue = Math.min(Math.max(Number(discountAmount) || 0, 0), subtotal); // 음수·합계 초과 방지
  const totalAmount = subtotal - discountValue; // 공급가액 = 품목합계 - 차감
  const vat = Math.floor(totalAmount * 0.1);
  const grandTotal = totalAmount + vat;
  // 3단계 분할 청구(계약금30% / 중도금60% / 잔금10%) — 잔금은 반올림 오차가 생기지 않도록 총액에서 앞의 둘을 뺀 나머지로 계산
  const depositAmount = Math.round(grandTotal * 0.3);
  const interimAmount = Math.round(grandTotal * 0.6);
  const balanceAmount = grandTotal - depositAmount - interimAmount;

  return (
    <div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4">
      <div className="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col">
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-base font-bold text-slate-800">📄 인보이스 작성 — {proposal.clientName}</h2>
            <p className="text-xs text-slate-400 mt-0.5">여기서 아무리 수정해도 3단계 원본 제안서는 전혀 바뀌지 않습니다(완전히 독립된 사본입니다).</p>
          </div>
          <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1 space-y-4">
          {items.map((it) => {
            const options = finishingOptions[it.category] || [];
            return (
              <div key={it.id} className="border border-slate-200 rounded-xl p-4">
                <div className="flex items-start gap-3 mb-3">
                  <div className="shrink-0">
                    <div className="text-[10px] text-slate-400 mb-1">실물 사진 교체</div>
                    <ImageUpload value={it.image} onChange={(v) => updateItem(it.id, { image: v })} />
                  </div>
                  <div className="min-w-0 flex-1 grid grid-cols-3 gap-2">
                    <Field label="제품명" span={3}><input className={inputCls} value={it.productName} onChange={(e) => updateItem(it.id, { productName: e.target.value })} /></Field>
                    <Field label="사이즈"><input className={inputCls} value={it.specSize || ""} onChange={(e) => updateItem(it.id, { specSize: e.target.value })} /></Field>
                    <Field label="재질"><input className={inputCls} value={it.material || ""} onChange={(e) => updateItem(it.id, { material: e.target.value })} /></Field>
                    <Field label="카테고리(후가공 목록 기준)">
                      <select className={inputCls} value={it.category || ""} onChange={(e) => updateItem(it.id, { category: e.target.value })}>
                        <option value="">선택 안 함</option>
                        {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </Field>
                  </div>
                  <button onClick={() => removeItem(it.id)} title="이 품목 삭제" className="shrink-0 w-8 h-8 rounded-lg border border-red-100 text-red-500 hover:bg-red-50 text-sm">🗑️</button>
                </div>
                <div className="grid grid-cols-3 gap-3 mb-3">
                  <Field label="수량"><input type="number" className={inputCls} value={it.quantity} onChange={(e) => { const q = Number(e.target.value) || 0; updateItem(it.id, { quantity: q, totalPrice: q * (Number(it.unitPrice) || 0) }); }} /></Field>
                  <Field label="단가(개당)"><input type="number" className={inputCls} value={it.unitPrice} onChange={(e) => { const u = Number(e.target.value) || 0; updateItem(it.id, { unitPrice: u, totalPrice: (Number(it.quantity) || 0) * u }); }} /></Field>
                  <Field label="금액(합계)"><input disabled className={inputCls + " bg-slate-50 text-slate-500"} value={Math.round(it.totalPrice || 0).toLocaleString("ko-KR")} /></Field>
                </div>
                {options.length > 0 ? (
                  <div>

/* ===================== 업체별 공급계약서 체결 상태 =====================
   계약은 체결일로부터 1년 유효(계약서 제2조)이므로, 만료된 계약은 "미체결"과 동일하게 취급해
   재발송을 유도한다. 옛 레코드 호환을 위해 contractSignedDate(구필드)도 함께 읽는다. */
const CONTRACT_VALID_DAYS = 365;
/* 🏢 업체 분류 4종 — 아이콘 없이 순수 텍스트 배지.
   ⚠️ 기존 isKeyClient(⭐주거래) 불리언 데이터와의 하위호환이 핵심:
      tags 배열이 정식이며, 옛 clientTier 문자열/isKeyClient 불리언도 getClientTags가 함께 읽는다.
      지정 저장시에도 isKeyClient를 함께 맞춰줘 다른 화면(주거래 정렬 등)이 깨지지 않게 한다. */
const CLIENT_TIERS = [
  // cls = 배지용, onCls = 행 토글 버튼이 켜졌을 때(테두리 포함)
  { key: "MAIN", label: "주거래", cls: "bg-amber-100 text-amber-800 font-bold", onCls: "bg-amber-100 text-amber-800 border-amber-300" },
  { key: "CLIENT", label: "고객사", cls: "bg-blue-100 text-blue-800 font-bold", onCls: "bg-blue-100 text-blue-800 border-blue-300" },
  { key: "VIP", label: "대형사", cls: "bg-purple-100 text-purple-800 font-bold", onCls: "bg-purple-100 text-purple-800 border-purple-300" },
  { key: "RISK", label: "주의", cls: "bg-rose-100 text-rose-800 font-bold", onCls: "bg-rose-100 text-rose-800 border-rose-300" },
];
const CLIENT_TIER_MAP = CLIENT_TIERS.reduce((m, t) => { m[t.key] = t; return m; }, {});
/* 업체 태그 판정 — 한 업체가 여러 태그를 동시에 가질 수 있다(주거래이면서 대형사 등).
   ⚠️ 데이터 3세대를 모두 읽어야 한다:
      ① 현행 tags 배열  ② 그 전 clientTier 단일 문자열  ③ 가장 옛 isKeyClient 불리언
   반환은 항상 유효한 key만 담긴 배열이라, 호출부는 includes()로 단순 비교하면 된다. */
function getClientTags(c) {
  if (!c) return [];
  const raw = Array.isArray(c.tags) ? c.tags
    : (c.clientTier ? [c.clientTier] : (c.isKeyClient ? ["MAIN"] : []));
  const seen = new Set();
  return raw.filter((k) => CLIENT_TIER_MAP[k] && !seen.has(k) && seen.add(k)); // 알 수 없는 값·중복 제거
}
// 태그 배열을 저장 payload로 변환 — 옛 필드도 함께 맞춰 다른 화면·정렬이 어긋나지 않게 한다
function buildClientTagPatch(tags) {
  const list = (tags || []).filter((k) => CLIENT_TIER_MAP[k]);
  return { tags: list, clientTier: list[0] || "", isKeyClient: list.includes("MAIN") };
}

/* 🏭 공장 분류 5종 — 업체 분류(CLIENT_TIERS)와 동일 패턴, 아이콘 없이 순수 텍스트.
   ⚠️ 옛 isKeyFactory(⭐주거래공장) 불리언과 하위호환: category가 없고 isKeyFactory만 true면 "MAIN"으로 본다. */
const FACTORY_TIERS = [
  // cls = 배지용, onCls = 토글 칩이 켜졌을 때(테두리 포함)
  { key: "MAIN", label: "주거래", cls: "bg-amber-100 text-amber-800 font-bold", onCls: "bg-amber-100 text-amber-800 border-amber-300" },
  { key: "ACTIVE", label: "거래공장", cls: "bg-blue-100 text-blue-800 font-bold", onCls: "bg-blue-100 text-blue-800 border-blue-300" },
  { key: "QUALITY", label: "고품질", cls: "bg-emerald-100 text-emerald-800 font-bold", onCls: "bg-emerald-100 text-emerald-800 border-emerald-300" },
  { key: "VISITED", label: "방문공장", cls: "bg-teal-100 text-teal-800 font-bold", onCls: "bg-teal-100 text-teal-800 border-teal-300" },
  { key: "LARGE", label: "대형공장", cls: "bg-purple-100 text-purple-800 font-bold", onCls: "bg-purple-100 text-purple-800 border-purple-300" },
  { key: "RISK", label: "주의", cls: "bg-rose-100 text-rose-800 font-bold", onCls: "bg-rose-100 text-rose-800 border-rose-300" },
];
const FACTORY_TIER_MAP = FACTORY_TIERS.reduce((m, t) => { m[t.key] = t; return m; }, {});
/* 공장 태그 판정 — 업체(getClientTags)와 완전히 동일한 3세대 호환 구조.
   ① 현행 tags 배열  ② 그 전 category 단일 문자열  ③ 가장 옛 isKeyFactory 불리언 */
function getFactoryTags(f) {
  if (!f) return [];
  const raw = Array.isArray(f.tags) ? f.tags
    : (f.category ? [f.category] : (f.isKeyFactory ? ["MAIN"] : []));
  const seen = new Set();
  return raw.filter((k) => FACTORY_TIER_MAP[k] && !seen.has(k) && seen.add(k)); // 알 수 없는 값·중복 제거
}
// 저장 payload로 변환 — 옛 필드(category/isKeyFactory)도 함께 맞춰 다른 화면과 어긋나지 않게 한다
function buildFactoryTagPatch(tags) {
  const list = (tags || []).filter((k) => FACTORY_TIER_MAP[k]);
  return { tags: list, category: list[0] || "", isKeyFactory: list.includes("MAIN") };
}

/* 계약 서명일시 표기 — 저장값은 nowDateTimeStr()이라 "2026-08-15 16:05:00"(초 포함) 형태다.
   배지에는 초까지 필요 없어 YYYY-MM-DD HH:mm 까지만 자른다.
   ⚠️ 옛 레코드(contractSignedDate)는 날짜만("2026-08-15") 저장돼 시간이 없으므로 날짜만 그대로 반환한다. */
function formatContractSignedAt(v) {
  const s = String(v || "").trim();
  if (!s) return "-";
  return s.length >= 16 ? s.slice(0, 16) : s.slice(0, 10);
}

function getClientContractState(c) {
  const signedAt = (c && (c.contractSignedAt || c.contractSignedDate)) || "";
  const expireAt = (c && c.contractExpireAt) || (signedAt ? addDaysFrom(signedAt.slice(0, 10), CONTRACT_VALID_DAYS) : "");
  const today = todayDisplay();
  const expired = !!(expireAt && expireAt < today); // YYYY-MM-DD 문자열은 사전순 비교가 곧 날짜순 비교
  const valid = !!(c && c.hasValidContract && signedAt && !expired);
  // signImage는 contractSignImage(정식) → contractSignData(구버전) 순으로 읽어 옛 레코드도 그대로 보인다
  return { signedAt, expireAt, expired, valid, signName: (c && c.contractSignerName) || "", signImage: (c && (c.contractSignImage || c.contractSignData)) || "" };
}
// 고객에게 보낼 링크 — 인보이스 없이 계약서만 단독 서명받는 경로
function buildContractSignLink(clientId) {
  // 고객에게 보내는 정식 주소 형식. /agree 경로는 vercel.json 리라이트로 index.html에 연결되어야 하며,
  // 리라이트 전이라도 열리도록 라우터가 쿼리스트링(?type=contract&clientId=)과 옛 해시 링크를 모두 인식한다.
  return `${window.location.origin}/agree?type=contract&clientId=${clientId}`;
}

// 업체 카드에서 여는 "체결 완료된 공급계약서" 열람·인쇄 모달

  const [copied, setCopied] = useState("");
  const copy = (text, label) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => { setCopied(label); setTimeout(() => setCopied(""), 2000); });
    } else {
      window.prompt("아래 내용을 복사해 주세요.", text);
    }
  };
  // managerPhone(업체 모달의 "담당자 연락처")을 최우선으로 — 안 넣으면 새로 입력한 번호로 문자 발송이 안 열림
  const phone = (client.managerPhone || client.phone || client.tel || client.contactPhone || "").replace(/[^0-9]/g, "");
  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden flex flex-col" style={{ maxHeight: "88vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">📲 공급계약서 전자서명 발송</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3 overflow-y-auto flex-1">
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3 text-xs space-y-1">
            <div className="flex justify-between"><span className="text-slate-500">수신 업체</span><span className="font-semibold text-slate-800">{client.name}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">담당자</span><span>{client.contact || "-"}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">연락처</span><span>{client.phone || client.tel || client.contactPhone || "미등록"}</span></div>
          </div>

          <Field label="서명 링크">
            <div className="flex gap-2">
              <input readOnly value={link} className={inputCls + " flex-1"} onFocus={(e) => e.target.select()} />
              <button onClick={() => copy(link, "link")} className="px-3 py-2 rounded-lg bg-[#1E3A8A] text-white text-xs font-semibold whitespace-nowrap">{copied === "link" ? "✅ 복사됨" : "링크 복사"}</button>
            </div>
          </Field>

          <Field label="안내 문구 (카톡·문자 붙여넣기용)">
            <textarea readOnly rows={16} value={message} className="w-full text-xs p-2.5 border border-slate-200 rounded-lg resize-y bg-slate-50" onFocus={(e) => e.target.select()} />
          </Field>

          <div className="flex gap-2">
            <button onClick={() => copy(message, "msg")} className="flex-1 px-3 py-2.5 rounded-lg bg-amber-400 text-slate-900 text-sm font-bold">{copied === "msg" ? "✅ 복사되었습니다" : "💬 안내 문구 전체 복사"}</button>
            {phone && (
              <a href={`sms:${phone}?body=${encodeURIComponent(message)}`} className="px-3 py-2.5 rounded-lg bg-emerald-600 text-white text-sm font-bold whitespace-nowrap">📩 문자 앱으로</a>
            )}
          </div>
          <p className="text-[11px] text-slate-400">
            복사한 문구를 카카오톡·문자에 붙여넣어 보내주세요. 고객이 서명을 마치면 이 업체 카드가 자동으로 <b>📜 표준계약서 서명완료</b>로 바뀝니다.
          </p>
        </div>
      </div>
    </div>
  );
}

function ClientsView({ clients, proposals, onBack, onAdd, onUpdate, onDelete, onOpenProposal, onBulkDelete, onMergeClients, isAdmin }) {

  useHashPageSync("업체관리", page);
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const [tierFilter, setTierFilter] = useState(""); // ""=전체, 그 외엔 CLIENT_TIERS의 key
  const [showClientMergeModal, setShowClientMergeModal] = useState(false);
  const [contractViewClient, setContractViewClient] = useState(null); // 📜 계약서 보기
  const [contractSendClient, setContractSendClient] = useState(null); // 📲 계약서 발송
  const PAGE_SIZE = 20;

  // 업체명이 동일한 중복 레코드를 하나로 병합 — 대표 카드는 먼저 등록된 값을 기준으로 하되 비어있는 필드는 나중 레코드 값으로 보강,
  // _mergedIds에 병합된 모든 원본 id를 모아두어 견적이력 합산·일괄삭제에 사용
  const mergedClients = useMemo(() => {
    const map = new Map();
    // clients가 null이거나 배열에 null이 섞여도 화면이 죽지 않게 방어
    (Array.isArray(clients) ? clients : []).filter(Boolean).forEach((c) => {
      const key = ((c && c.name) || "").trim();
      if (!key) { map.set("__unnamed_" + c.id, { ...c, _mergedIds: [c.id] }); return; }
      const existing = map.get(key);
      if (!existing) {
        map.set(key, { ...c, _mergedIds: [c.id] });
      } else {
        map.set(key, {
          ...existing,
          contact: existing.contact || c.contact,
          // 계약서 연동 필드도 비어있으면 뒤 레코드 값으로 보강(안 넣으면 중복 업체 병합시 대표자명·주소가 유실됨)
          ceoName: existing.ceoName || c.ceoName,
          address: existing.address || c.address,
          managerPhone: existing.managerPhone || c.managerPhone,
          attachments: (existing.attachments && existing.attachments.length) ? existing.attachments : (c.attachments || existing.attachments),
          channel: existing.channel || c.channel,
          difficulty: existing.difficulty || c.difficulty,
          note: existing.note || c.note,
          source: existing.source || c.source,
          isKeyClient: existing.isKeyClient || c.isKeyClient,
          // 중복 업체 병합시 태그는 합집합으로(한쪽에만 있던 태그가 유실되지 않게)
          tags: [...new Set([...getClientTags(existing), ...getClientTags(c)])],
          clientTier: existing.clientTier || c.clientTier,
          _mergedIds: [...existing._mergedIds, c.id],
        });
      }
    });
    return Array.from(map.values());
  }, [clients]);

  const filtered = useMemo(() => {
    const base = mergedClients.filter((c) => {
      if (tierFilter && !getClientTags(c).includes(tierFilter)) return false; // 중복 지정 업체도 각 탭에 노출
      return !search.trim() || (c.name || "").toLowerCase().includes(search.trim().toLowerCase()) || (c.contact || "").toLowerCase().includes(search.trim().toLowerCase());
    });
    return sortByKey(base, sortKey, (c) => c.name, (c) => c.createdAt);

                </div>

              </div>
              {openClient === c.id && (
                <div className="border-t border-slate-100 px-5 py-3">

                      <thead><tr className="text-slate-400 border-b border-slate-100"><th className="text-left py-1.5">제안번호</th><th className="text-left py-1.5">발송일시</th><th className="text-left py-1.5">품목</th><th className="text-right py-1.5">금액</th><th className="text-left py-1.5">상태</th></tr></thead>
                      <tbody>
                        {history.map((p) => (
                          <tr key={p.id} className="border-b border-slate-50">
                            <td className="py-1.5">
                              <button onClick={() => onOpenProposal(p)} className="text-[#1D4ED8] hover:underline font-medium" title="클릭하면 제안서 상세 내역을 조회 전용으로 확인할 수 있습니다">{p.code}</button>

                            <td className="py-1.5 text-right font-medium">{won(p.totalAmount)}</td>
                            <td className="py-1.5"><span className={"text-[10px] px-1.5 py-0.5 rounded-full " + (STATUS_COLORS[p.status] || "bg-slate-100")}>{p.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}

              )}
            </div>
          );
        })}
      </div>
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );

/* ===================== 공장(OEM) 관리 ===================== */

function Pagination({ page, totalPages, onChange, totalItems }) {
  if (totalPages <= 1 && !totalItems) return null;
  const BLOCK_SIZE = 10; // 한 블록에 보여줄 페이지 번호 개수(기존 5개 → 10개로 확대)
  const blockStart = Math.floor((page - 1) / BLOCK_SIZE) * BLOCK_SIZE + 1;
  const blockEnd = Math.min(totalPages, blockStart + BLOCK_SIZE - 1);
  const pages = [];
  for (let i = blockStart; i <= blockEnd; i++) pages.push(i);
  return (
    <div className="flex flex-wrap items-center justify-between gap-3 bg-blue-50 rounded-xl px-4 py-3 mt-2">
      <span className="text-sm font-medium" style={{ color: "#1E293B" }}>
        총 <b style={{ color: "#111827" }}>{(totalItems || 0).toLocaleString("ko-KR")}</b>건 · {page}/{totalPages} 페이지
      </span>
      <div className="flex items-center gap-1.5">
        <button onClick={() => onChange(1)} disabled={page === 1} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }} title="맨 처음으로">⏮️ 맨 처음으로</button>
        {/* "← 이전"/"다음 →"은 한 칸씩이 아니라 블록(10페이지) 단위로 이동 — 이전 블록 마지막 페이지 / 다음 블록 첫 페이지로 점프 */}
        <button onClick={() => onChange(Math.max(1, blockStart - 1))} disabled={blockStart === 1} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }}>← 이전</button>
        {blockStart > 1 && <span className="px-1 text-slate-400">…</span>}
        {pages.map((p) => (
          <button key={p} onClick={() => onChange(p)} className={"w-9 h-9 rounded-lg text-sm font-semibold " + (p === page ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-300 hover:bg-slate-50")} style={p === page ? {} : { color: "#1E293B" }}>{p}</button>
        ))}
        {blockEnd < totalPages && <span className="px-1 text-slate-400">…</span>}
        <button onClick={() => onChange(Math.min(totalPages, blockEnd + 1))} disabled={blockEnd === totalPages} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }}>다음 →</button>
      </div>
    </div>
  );
}

function FactoryFormModal({ factory, onClose, onSave }) {
  const [name, setName] = useState(factory.name || "");
  const [tags, setTags] = useState(getFactoryTags(factory)); // 옛 category/isKeyFactory 데이터도 자동으로 배열로 잡힌다
  const toggleTag = (k) => setTags((prev) => (prev.includes(k) ? prev.filter((x) => x !== k) : [...prev, k]));
  const [wechatGroup, setWechatGroup] = useState(factory.wechatGroup || "");
  const [contact, setContact] = useState(factory.contact || "");
  const [mainProducts, setMainProducts] = useState(factory.mainProducts || "");
  const [websiteUrl, setWebsiteUrl] = useState(factory.websiteUrl || "");
  const [memo, setMemo] = useState(factory.memo || "");

  const save = () => {
    if (!name.trim()) return;
    onSave(factory.id, { name: name.replace(/\s+/g, ""), ...buildFactoryTagPatch(tags), wechatGroup, contact, mainProducts, websiteUrl, memo });
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden">
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">{factory.id ? "✏️ 공장 정보 수정" : "➕ 신규 공장 등록"}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6">
          <div className="grid grid-cols-2 gap-4">
            <Field label="공장명" span={2} hint="띄어쓰기는 저장시 자동으로 붙습니다"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 广州潮迪塑料制品有限公司" /></Field>
            <div className="col-span-2">
              <label className="block text-xs font-semibold text-slate-700 mb-1">공장 분류 <span className="font-normal text-slate-400">(여러 개 선택 가능)</span></label>
              <div className="flex flex-wrap gap-2">
                {FACTORY_TIERS.map((t) => {
                  const on = tags.includes(t.key);
                  return (
                    <button key={t.key} type="button" onClick={() => toggleTag(t.key)}
                      className={"text-xs px-3 py-1.5 rounded-lg border font-semibold whitespace-nowrap transition " + (on ? t.onCls : "bg-white text-slate-400 border-slate-200 hover:bg-slate-50")}>
                      {t.label}
                    </button>
                  );
                })}
              </div>
              {tags.length === 0 && <p className="text-xs text-slate-400 mt-1">선택하지 않으면 일반 공장으로 저장됩니다.</p>}
            </div>
            <Field label="위챗 그룹방"><input className={inputCls} value={wechatGroup} onChange={(e) => setWechatGroup(e.target.value)} placeholder="위챗 단체방명" /></Field>
            <Field label="연락처"><input className={inputCls} value={contact} onChange={(e) => setContact(e.target.value)} placeholder="전화 / 위챗ID" /></Field>
            <Field label="공장 홈페이지 / 1688 URL" span={2}><input className={inputCls} value={websiteUrl} onChange={(e) => setWebsiteUrl(e.target.value)} placeholder="https://..." /></Field>
            <Field label="주요 생산 품목" span={2}><input className={inputCls} value={mainProducts} onChange={(e) => setMainProducts(e.target.value)} placeholder="예: PE튜브, 펌프" /></Field>
            <Field label="비고/메모" span={2}><AutoResizeTextarea value={memo} onChange={setMemo} minRows={2} placeholder="특이사항, 거래조건 등 자유 메모" /></Field>
          </div>
          {factory.id && <p className="text-xs text-amber-600 mt-1">⚠️ 공장명을 바꾸면 이 공장과 연동된 모든 제품의 공장명도 자동으로 함께 갱신됩니다.</p>}
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">{factory.id ? "✓ 수정 반영" : "＋ 공장 등록"}</button>
        </div>
      </div>
    </div>
  );
}

  const [primaryId, setPrimaryId] = useState(selectedFactories[0] && selectedFactories[0].id);

    if (!window.confirm(`선택한 ${selectedFactories.length}개 공장을 대표 공장 1개로 병합할까요? 나머지 공장은 삭제되고, 연동된 제품들은 전부 대표 공장으로 이전됩니다.`)) return;

  return (

            {selectedFactories.map((f) => (

                  <div className="text-sm font-medium text-slate-800">{f.name}</div>

function FactoriesView({ factories, products, onBack, onAdd, onUpdate, onDelete, onImportFromProducts, onOpenProduct, onBulkDelete, onToggleKeyFactory, onMergeFactories, isAdmin }) {
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(() => (parseKoreanHash().view === "공장관리" ? parseKoreanHash().page : 1));
  useHashPageSync("공장관리", page);
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const [tierFilter, setTierFilter] = useState(""); // ""=전체, 그 외엔 FACTORY_TIERS의 key
  const PAGE_SIZE = 20;
  const [formFactory, setFormFactory] = useState(null); // null=닫힘, {}=신규, {id,...}=수정
  const [showMergeModal, setShowMergeModal] = useState(false);
  const [viewingFactory, setViewingFactory] = useState(null);
  const [viewingFactoryDetail, setViewingFactoryDetail] = useState(null);

  const filtered = useMemo(() => {
    // factories가 null이거나 배열에 null이 섞여도 화면이 죽지 않게 방어
    const base = (Array.isArray(factories) ? factories : []).filter(Boolean).filter((f) => {
      if (tierFilter && !getFactoryTags(f).includes(tierFilter)) return false; // 중복 지정 공장도 각 탭에 노출
      if (!search.trim()) return true;
      const q = search.trim().toLowerCase();
      return (f.name || "").toLowerCase().includes(q) || (f.mainProducts || "").toLowerCase().includes(q);
    });
    return sortByKey(base, sortKey, (f) => f.name, (f) => f.createdAt);
  }, [factories, search, sortKey, tierFilter]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const paged = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { setPage(1); }, [search, sortKey, tierFilter]);
  useEffect(() => { setSelectedIds([]); }, [page, search, sortKey, tierFilter]);
  const allPagedSelected = paged.length > 0 && paged.every((f) => selectedIds.includes(f.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : paged.map((f) => f.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  const handleSave = (id, patch) => {
    if (id) onUpdate(id, patch); else onAdd({ id: Date.now(), ...patch });
    setFormFactory(null);
  };

  const countFor = (f) => products.filter((p) => p.factory === f.name).length;
  // 공장에 연결된 제품들의 카테고리 출현빈도를 집계해 가장 많이 매칭된 카테고리(주력 카테고리)를 찾는다.
  // products/factories가 바뀔 때마다(부모 state 변경 → 리렌더) 매번 새로 계산되므로 별도 캐시 없이 항상 최신값을 보여준다.
  const dominantCategoryFor = (f) => {
    const matched = products.filter((p) => p.factory === f.name);
    if (matched.length === 0) return null;
    const freq = {};
    matched.forEach((p) => { const c = p.category || "미분류"; freq[c] = (freq[c] || 0) + 1; });
    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
    const [topCategory, topCount] = sorted[0];
    return { topCategory, topCount, totalProducts: matched.length, distinctCategories: sorted.length };
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      {formFactory !== null && <FactoryFormModal factory={formFactory} onClose={() => setFormFactory(null)} onSave={handleSave} />}
      {viewingFactory && (
        <FactoryProductsModal factory={viewingFactory} products={products} onClose={() => setViewingFactory(null)}
          onOpenProduct={(p) => { setViewingFactory(null); onOpenProduct(p); }} />
      )}
      {viewingFactoryDetail && <FactoryDetailModal factory={viewingFactoryDetail} onClose={() => setViewingFactoryDetail(null)} />}
      {showMergeModal && onMergeFactories && (
        <FactoryMergeModal
          selectedFactories={factories.filter((f) => selectedIds.includes(f.id))}
          onRun={async (selected, primaryId) => { await onMergeFactories(selected, primaryId); setSelectedIds([]); }}
          onClose={() => setShowMergeModal(false)}
        />
      )}
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">🏭 공장(OEM) 관리</h2>
        <div className="flex gap-2 items-center flex-wrap">
          <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]">
            {SORT_OPTIONS_COMMON.map(([k, label]) => <option key={k} value={k}>정렬: {label}</option>)}
          </select>
          {onBulkDelete && (
            <React.Fragment>
              <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer whitespace-nowrap">
                <input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /> 전체 선택
              </label>
              <button
                onClick={async () => { await onBulkDelete(selectedIds); setSelectedIds([]); }}
                disabled={selectedIds.length === 0}
                className="text-xs px-3 py-2 rounded-lg border border-red-200 text-red-600 font-medium hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
              >
                🗑️ 선택 삭제 ({selectedIds.length}개)
              </button>
              {onMergeFactories && (
                <button
                  onClick={() => setShowMergeModal(true)}
                  disabled={selectedIds.length < 2}
                  title={selectedIds.length < 2 ? "병합하려면 공장을 2개 이상 선택해주세요" : ""}
                  className="text-xs px-3 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] font-medium hover:bg-[#1E3A8A]/5 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
                >
                  🔗 선택 공장 병합 ({selectedIds.length}개)
                </button>
              )}
            </React.Fragment>
          )}
          {onImportFromProducts && (
            <button onClick={onImportFromProducts} className="px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] text-sm font-medium hover:bg-[#1E3A8A]/5 whitespace-nowrap">📥 제품 DB에서 공장 자동 등록</button>
          )}
          <button onClick={() => setFormFactory({})} className="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">➕ 신규 공장 등록</button>
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div className="flex gap-1.5 mb-3">
        <button onClick={() => setTierFilter("")} className={"text-xs px-3 py-1.5 rounded-full font-medium " + (!tierFilter ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>
          전체 공장 <span className={"ml-1 " + (!tierFilter ? "text-white/70" : "text-slate-400")}>{(factories || []).length}</span>
        </button>
        {FACTORY_TIERS.map((t) => {
          const cnt = (factories || []).filter((f) => getFactoryTags(f).includes(t.key)).length;
          return (
            <button key={t.key} onClick={() => setTierFilter(t.key)}
              className={"text-xs px-3 py-1.5 rounded-full font-medium " + (tierFilter === t.key ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>
              {t.label} <span className={"ml-1 " + (tierFilter === t.key ? "text-white/70" : "text-slate-400")}>{cnt}</span>
            </button>
          );
        })}
      </div>
      <input
        value={search} onChange={(e) => setSearch(e.target.value)}
        placeholder="🔍 공장명 또는 주요 품목으로 검색"
        className="w-full mb-4 px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
      />

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">
          {(factories || []).length === 0 ? "등록된 공장이 없습니다." : "검색 결과가 없습니다."}
        </div>
      ) : (
        <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              {onBulkDelete && <th className="text-center px-2 py-3 font-medium w-10"><input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /></th>}
              <th className="text-left px-4 py-3 font-medium w-64">중국 공장명</th>
              <th className="text-left px-4 py-3 font-medium w-72">위챗 그룹방</th>

                  <td className="px-4 py-3 whitespace-nowrap" style={{ color: "#1E293B" }}>{f.wechatGroup || <span className="text-slate-400">-</span>}</td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{f.contact || <span className="text-slate-400">-</span>}</td>
                  <td className="px-4 py-3">
                    <div className="text-left" style={{ color: "#1E293B" }}>{f.mainProducts || <span className="text-slate-400">-</span>}</div>
                    {(() => {
                      const info = dominantCategoryFor(f);
                      if (!info) return <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 mt-1 inline-block">연결 제품 없음</span>;
                      const label = info.distinctCategories > 1
                        ? `${info.topCategory} (${info.topCount}개) · 외 ${info.distinctCategories - 1}개 카테고리 (총 ${info.totalProducts}개 제품)`
                        : `${info.topCategory} (${info.totalProducts}개)`;
                      return <span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-[#1D4ED8] mt-1 inline-block whitespace-normal text-left">{label}</span>;
                    })()}
                  </td>
                  <td className="px-4 py-3">
                    <button onClick={() => setViewingFactory(f)} className="text-xs px-2.5 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 whitespace-nowrap">
                      {countFor(f)}개 제품 보기

                  </td>
                  {/* 작업 영역 — 분류 배지는 여기에만 표시.
                      배지 개수가 행마다 달라도 수정·삭제 버튼이 밀리지 않도록 배지 묶음은 flex-1 안에서 우측 정렬하고
                      버튼 2개는 shrink-0으로 고정 폭을 지킨다. */}
                  <td className="px-4 py-3">
                    <div className="flex items-center justify-end gap-2.5 min-w-[240px]">
                      <div className="flex items-center justify-end gap-1.5 flex-wrap flex-1">
                        {getFactoryTags(f).length > 0
                          ? getFactoryTags(f).map((k) => (
                              <span key={k} className={"px-2 py-0.5 text-xs font-semibold rounded-md whitespace-nowrap " + FACTORY_TIER_MAP[k].cls}>{FACTORY_TIER_MAP[k].label}</span>
                            ))
                          : <span className="text-xs text-slate-300 whitespace-nowrap">미지정</span>}
                      </div>
                      <button onClick={() => setFormFactory(f)} className="flex items-center gap-1 text-slate-600 hover:text-indigo-600 text-xs font-medium whitespace-nowrap shrink-0">✏️ 수정</button>
                      {isAdmin && <button onClick={() => onDelete(f)} className="flex items-center gap-1 text-slate-400 hover:text-rose-600 text-xs font-medium whitespace-nowrap shrink-0">🗑️ 삭제</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );
}
