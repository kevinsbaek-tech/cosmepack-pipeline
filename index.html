function FactoryDetailModal({ factory, onClose }) {
  const rows = [
    ["위챗 그룹방", factory.wechatGroup],
    ["연락처", factory.contact],
    ["주요 생산 품목", factory.mainProducts],
    ["비고/메모", factory.memo],
  ];
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden">
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">🏭 {factory.name}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6">
          <table className="w-full text-sm">
            <tbody>
              {rows.map(([label, value]) => (
                <tr key={label} className="border-t border-slate-100">
                  <td className="py-2 pr-3 text-slate-500 whitespace-nowrap align-top w-32">{label}</td>
                  <td className="py-2 text-slate-800 pre-line break-words">{value || <span className="text-slate-300">-</span>}</td>
                </tr>
              ))}
              <tr className="border-t border-slate-100">
                <td className="py-2 pr-3 text-slate-500 whitespace-nowrap align-top w-32">홈페이지 / 1688</td>
                <td className="py-2 break-words">
                  {factory.websiteUrl ? <a href={factory.websiteUrl} target="_blank" rel="noreferrer" className="text-[#1D4ED8] hover:underline">{factory.websiteUrl}</a> : <span className="text-slate-300">-</span>}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">닫기</button>
        </div>
      </div>
    </div>
  );
}

function FactoryMergeModal({ selectedFactories, onRun, onClose }) {
  const [primaryId, setPrimaryId] = useState(selectedFactories[0] && selectedFactories[0].id);
  const run = () => {
    if (!primaryId) return;
    if (!window.confirm(`선택한 ${selectedFactories.length}개 공장을 대표 공장 1개로 병합할까요? 나머지 공장은 삭제되고, 연동된 제품들은 전부 대표 공장으로 이전됩니다.`)) return;
    onRun(selectedFactories, primaryId);
    onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-md overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">🔗 선택 공장 병합</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3">
          <p className="text-xs text-slate-500">대표 공장으로 사용할 1개를 선택해주세요. 나머지 공장은 삭제되고, 그 공장에 연동돼있던 제품들은 전부 대표 공장으로 옮겨집니다.</p>
          <div className="space-y-2">
            {selectedFactories.map((f) => (
              <label key={f.id} className={"flex items-center gap-2.5 px-3 py-2.5 rounded-lg border cursor-pointer " + (primaryId === f.id ? "border-[#1E3A8A] bg-[#1E3A8A]/5" : "border-slate-200")}>
                <input type="radio" name="primaryFactory" checked={primaryId === f.id} onChange={() => setPrimaryId(f.id)} />
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-800">{f.name}</div>
                  <div className="text-xs text-slate-400 truncate">{f.mainProducts || "주요 생산 품목 미등록"}</div>
                </div>
              </label>
            ))}
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={run} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">병합 실행</button>
        </div>
      </div>
    </div>
  );
}

function FactoriesView({ factories, products, onBack, onAdd, onUpdate, onDelete, onImportFromProducts, onOpenProduct, onBulkDelete, onToggleKeyFactory, onMergeFactories, isAdmin }) {
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(() => (parseKoreanHash().view === "공장관리" ? parseKoreanHash().page : 1));
  useHashPageSync("공장관리", page);
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const [keyFactoryFilter, setKeyFactoryFilter] = useState(false); // true면 ⭐주거래공장만 모아보기
  const PAGE_SIZE = 20;
  const [formFactory, setFormFactory] = useState(null); // null=닫힘, {}=신규, {id,...}=수정
  const [showMergeModal, setShowMergeModal] = useState(false);
  const [viewingFactory, setViewingFactory] = useState(null);
  const [viewingFactoryDetail, setViewingFactoryDetail] = useState(null);

  const filtered = useMemo(() => {
    const base = factories.filter((f) => {
      if (keyFactoryFilter && !f.isKeyFactory) return false;
      if (!search.trim()) return true;
      const q = search.trim().toLowerCase();
      return (f.name || "").toLowerCase().includes(q) || (f.mainProducts || "").toLowerCase().includes(q);
    });
    return sortByKey(base, sortKey, (f) => f.name, (f) => f.createdAt);
  }, [factories, search, sortKey, keyFactoryFilter]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const paged = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { setPage(1); }, [search, sortKey, keyFactoryFilter]);
  useEffect(() => { setSelectedIds([]); }, [page, search, sortKey, keyFactoryFilter]);
  const allPagedSelected = paged.length > 0 && paged.every((f) => selectedIds.includes(f.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : paged.map((f) => f.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  const handleSave = (id, patch) => {
    if (id) onUpdate(id, patch); else onAdd({ id: Date.now(), ...patch });
    setFormFactory(null);
  };

  const countFor = (f) => products.filter((p) => p.factory === f.name).length;
  // 공장에 연결된 제품들의 카테고리 출현빈도를 집계해 가장 많이 매칭된 카테고리(주력 카테고리)를 찾는다.
  // products/factories가 바뀔 때마다(부모 state 변경 → 리렌더) 매번 새로 계산되므로 별도 캐시 없이 항상 최신값을 보여준다.
  const dominantCategoryFor = (f) => {
    const matched = products.filter((p) => p.factory === f.name);
    if (matched.length === 0) return null;
    const freq = {};
    matched.forEach((p) => { const c = p.category || "미분류"; freq[c] = (freq[c] || 0) + 1; });
    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
    const [topCategory, topCount] = sorted[0];
    return { topCategory, topCount, totalProducts: matched.length, distinctCategories: sorted.length };
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      {formFactory !== null && <FactoryFormModal factory={formFactory} onClose={() => setFormFactory(null)} onSave={handleSave} />}
      {viewingFactory && (
        <FactoryProductsModal factory={viewingFactory} products={products} onClose={() => setViewingFactory(null)}
          onOpenProduct={(p) => { setViewingFactory(null); onOpenProduct(p); }} />
      )}
      {viewingFactoryDetail && <FactoryDetailModal factory={viewingFactoryDetail} onClose={() => setViewingFactoryDetail(null)} />}
      {showMergeModal && onMergeFactories && (
        <FactoryMergeModal
          selectedFactories={factories.filter((f) => selectedIds.includes(f.id))}
          onRun={async (selected, primaryId) => { await onMergeFactories(selected, primaryId); setSelectedIds([]); }}
          onClose={() => setShowMergeModal(false)}
        />
      )}
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">🏭 공장(OEM) 관리</h2>
        <div className="flex gap-2 items-center flex-wrap">
          <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]">
            {SORT_OPTIONS_COMMON.map(([k, label]) => <option key={k} value={k}>정렬: {label}</option>)}
          </select>
          {onBulkDelete && (
            <React.Fragment>
              <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer whitespace-nowrap">
                <input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /> 전체 선택
              </label>
              <button
                onClick={async () => { await onBulkDelete(selectedIds); setSelectedIds([]); }}
                disabled={selectedIds.length === 0}
                className="text-xs px-3 py-2 rounded-lg border border-red-200 text-red-600 font-medium hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
              >
                🗑️ 선택 삭제 ({selectedIds.length}개)
              </button>
              {onMergeFactories && (
                <button
                  onClick={() => setShowMergeModal(true)}
                  disabled={selectedIds.length < 2}
                  title={selectedIds.length < 2 ? "병합하려면 공장을 2개 이상 선택해주세요" : ""}
                  className="text-xs px-3 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] font-medium hover:bg-[#1E3A8A]/5 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
                >
                  🔗 선택 공장 병합 ({selectedIds.length}개)
                </button>
              )}
            </React.Fragment>
          )}
          {onImportFromProducts && (
            <button onClick={onImportFromProducts} className="px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] text-sm font-medium hover:bg-[#1E3A8A]/5 whitespace-nowrap">📥 제품 DB에서 공장 자동 등록</button>
          )}
          <button onClick={() => setFormFactory({})} className="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">➕ 신규 공장 등록</button>
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div className="flex gap-1.5 mb-3">
        <button onClick={() => setKeyFactoryFilter(false)} className={"text-xs px-3 py-1.5 rounded-full font-medium " + (!keyFactoryFilter ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>전체 공장</button>
        <button onClick={() => setKeyFactoryFilter(true)} className={"text-xs px-3 py-1.5 rounded-full font-medium " + (keyFactoryFilter ? "bg-amber-400 text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>⭐ 주거래공장</button>
      </div>
      <input
        value={search} onChange={(e) => setSearch(e.target.value)}
        placeholder="🔍 공장명 또는 주요 품목으로 검색"
        className="w-full mb-4 px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
      />

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">
          {factories.length === 0 ? "등록된 공장이 없습니다." : "검색 결과가 없습니다."}
        </div>
      ) : (
        <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              {onBulkDelete && <th className="text-center px-2 py-3 font-medium w-10"><input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /></th>}
              <th className="text-left px-4 py-3 font-medium w-64">중국 공장명</th>
              <th className="text-left px-4 py-3 font-medium w-72">위챗 그룹방</th>
              <th className="text-left px-4 py-3 font-medium w-40">연락처</th>
              <th className="text-left px-4 py-3 font-medium w-36">주요 생산 품목</th>
              <th className="text-left px-4 py-3 font-medium w-24">생산 제품 (연동)</th>
              <th className="text-right px-4 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {paged.map((f, idx) => (
                <tr key={f.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  {onBulkDelete && <td className="px-2 py-3 text-center"><input type="checkbox" checked={selectedIds.includes(f.id)} onChange={() => toggleSelectOne(f.id)} /></td>}
                  <td className="px-4 py-3 whitespace-nowrap">
                    <div className="flex items-center gap-1.5">
                      <button onClick={() => setViewingFactoryDetail(f)} className="font-semibold hover:text-[#1E3A8A] hover:underline text-left" style={{ color: "#111827" }}>{f.name}</button>
                      {f.isKeyFactory && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700 shrink-0">⭐ 주거래</span>}
                    </div>
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap" style={{ color: "#1E293B" }}>{f.wechatGroup || <span className="text-slate-400">-</span>}</td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{f.contact || <span className="text-slate-400">-</span>}</td>
                  <td className="px-4 py-3">
                    <div className="text-left" style={{ color: "#1E293B" }}>{f.mainProducts || <span className="text-slate-400">-</span>}</div>
                    {(() => {
                      const info = dominantCategoryFor(f);
                      if (!info) return <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 mt-1 inline-block">연결 제품 없음</span>;
                      const label = info.distinctCategories > 1
                        ? `${info.topCategory} (${info.topCount}개) · 외 ${info.distinctCategories - 1}개 카테고리 (총 ${info.totalProducts}개 제품)`
                        : `${info.topCategory} (${info.totalProducts}개)`;
                      return <span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-[#1D4ED8] mt-1 inline-block whitespace-normal text-left">{label}</span>;
                    })()}
                  </td>
                  <td className="px-4 py-3">
                    <button onClick={() => setViewingFactory(f)} className="text-xs px-2.5 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 whitespace-nowrap">
                      {countFor(f)}개 제품 보기
                    </button>
                  </td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    {onToggleKeyFactory && (
                      <button onClick={() => onToggleKeyFactory(f)} title={f.isKeyFactory ? "주거래공장 해제" : "주거래공장으로 지정"} className={"text-xs px-2 py-1 mr-2 " + (f.isKeyFactory ? "text-amber-500 hover:text-amber-600" : "text-slate-300 hover:text-amber-400")}>{f.isKeyFactory ? "⭐ 주거래" : "☆ 주거래지정"}</button>
                    )}
                    <button onClick={() => setFormFactory(f)} className="text-xs px-2 py-1 text-slate-500 hover:text-[#1E3A8A] mr-2">✏️ 수정</button>
                    {isAdmin && <button onClick={() => onDelete(f)} className="text-xs px-2 py-1 text-red-400 hover:text-red-600">🗑️ 삭제</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );
}

// 동일 그룹(기본 용량+용기형태)의 유사 제품들을 모아 기본형 단가 vs 옵션 적용 단가를 비교하는 모달
function SimilarProductsModal({ product, allProducts, onClose }) {
  const attrs = deriveProductAttributes(product);
  const groupKey = attrs.baseGroupKey;
  const groupItems = allProducts
    .map((p) => ({ ...p, _attrs: deriveProductAttributes(p) }))
    .filter((p) => p._attrs.baseGroupKey && p._attrs.baseGroupKey === groupKey);

  const basePriceItem = groupItems.length > 0
    ? groupItems.reduce((min, p) => (Number(p.lastUnitPrice) || 0) < (Number(min.lastUnitPrice) || Infinity) ? p : min, groupItems[0])
    : null;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "1200px", height: "85vh", maxHeight: "85vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-base font-bold text-slate-800">🔍 유사/옵션 제품 분석</h2>
            <p className="text-xs text-slate-500 mt-0.5">{groupKey ? `그룹: ${groupKey}` : "이름/규격에서 용량·용기형태를 인식하지 못해 그룹을 특정할 수 없습니다."}</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          {!groupKey ? (
            <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
              "{product.name}"의 이름/규격에서 용량(예: 100g, 50ml)과 용기 형태(예: 크림용기, 펌프용기)를 자동으로 인식하지 못했습니다.
            </div>
          ) : groupItems.length <= 1 ? (
            <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
              같은 그룹({groupKey})으로 묶이는 다른 제품이 아직 없습니다.
            </div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-xs border border-slate-200 rounded-lg overflow-hidden">
                <thead><tr className="bg-slate-50 text-slate-500">
                  <th className="text-left px-3 py-2 font-medium">제품명</th>
                  <th className="text-left px-3 py-2 font-medium">재질</th>
                  <th className="text-left px-3 py-2 font-medium">캡/타입</th>
                  <th className="text-left px-3 py-2 font-medium">후가공/옵션</th>
                  <th className="text-right px-3 py-2 font-medium">단가</th>
                  <th className="text-right px-3 py-2 font-medium">옵션 추가금(추정)</th>
                  <th className="text-right px-3 py-2 font-medium">기준가 대비 차액</th>
                </tr></thead>
                <tbody>
                  {groupItems
                    .sort((a, b) => (Number(a.lastUnitPrice) || 0) - (Number(b.lastUnitPrice) || 0))
                    .map((p) => {
                      const isBase = basePriceItem && p.id === basePriceItem.id;
                      const surcharge = productOptionSurcharge(p);
                      const diff = (Number(p.lastUnitPrice) || 0) - (Number(basePriceItem && basePriceItem.lastUnitPrice) || 0);
                      return (
                        <tr key={p.id} className={"border-t border-slate-100 " + (p.id === product.id ? "bg-blue-50/50" : "")}>
                          <td className="px-3 py-2 font-medium text-slate-800">
                            {p.name}
                            {isBase && <span className="ml-1.5 text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">기본형</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.materials.length > 0 ? p._attrs.materials.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.capTypes.length > 0 ? p._attrs.capTypes.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-blue-50 text-[#1D4ED8]">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.finishes.length > 0 ? p._attrs.finishes.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-700">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2 text-right font-semibold text-[#1E3A8A]">{won(p.lastUnitPrice || 0)}</td>
                          <td className="px-3 py-2 text-right text-slate-500">{surcharge > 0 ? won(surcharge) : "-"}</td>
                          <td className={"px-3 py-2 text-right font-medium " + (diff > 0 ? "text-red-500" : diff < 0 ? "text-emerald-600" : "text-slate-400")}>
                            {isBase ? "-" : `${diff > 0 ? "+" : ""}${won(diff)}`}
                          </td>
                        </tr>
                      );
                    })}
                </tbody>
              </table>
              <p className="text-[11px] text-slate-400 mt-3">
                * "기본형"은 그룹 내 단가(lastUnitPrice)가 가장 낮은 제품을 자동 기준으로 삼은 것입니다. "옵션 추가금"은 용기/캡 인쇄·후가공 단가(K스펙) 합계를 참고용으로 보여줍니다.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

      kc("용기 후가공가격", product.containerFinishPriceK, product.containerFinishPriceC),
      kc("캡/뚜껑 인쇄가격", product.capPrintPriceK, product.capPrintPriceC),
      kc("캡/뚜껑 후가공가격", product.capFinishPriceK, product.capFinishPriceC),
      kc("기타 후가공가격", product.otherFinishPriceK, product.otherFinishPriceC),

                <thead><tr className="bg-slate-50 text-slate-500">
                  <th className="text-left px-3 py-2 font-medium">기준수량</th><th className="text-left px-3 py-2 font-medium">CBM</th>
                  <th className="text-left px-3 py-2 font-medium">중국내운송료(RMB)</th><th className="text-left px-3 py-2 font-medium">공장단가(RMB)</th>

                  <div key={i} className="w-24">

function TextField({ label, value, onChange, hint, mono, rows, span }) {
  return (
    <Field label={label} hint={hint} span={span}>
      {rows ? (
        <AutoResizeTextarea value={value} onChange={onChange} minRows={rows} />
      ) : (
        <input className={inputCls + (mono ? " font-mono text-xs" : "")} value={value} onChange={(e) => onChange(e.target.value)} />
      )}

  );
}

function PriceTierTable({ tiers, onChange }) {
  const update = (idx, field, value) => {
    const next = tiers.map((t, i) => (i === idx ? { ...t, [field]: value } : t));
    onChange(next);
  };
  const addTier = () => onChange([...tiers, { qty: "", cbm: "", shippingRmb: "", factoryPriceRmb: "" }]);
  const removeTier = (idx) => onChange(tiers.filter((_, i) => i !== idx));

  return (
    <div>
      <div className="grid grid-cols-5 gap-2 text-xs font-medium text-slate-500 mb-1.5 px-1">
        <div>기준수량 (개)</div><div>제품예상부피 CBM</div><div>중국내운송료 RMB</div><div>공장단가 RMB</div><div></div>
      </div>
      <div className="space-y-2">
        {tiers.map((t, i) => (
          <div key={i} className="grid grid-cols-5 gap-2 items-center">
            <input className={inputCls} value={t.qty} onChange={(e) => update(i, "qty", e.target.value)} placeholder="예: 5000" />
            <input className={inputCls} value={t.cbm} onChange={(e) => update(i, "cbm", e.target.value)} placeholder="예: 1.2" />
            <input className={inputCls} value={t.shippingRmb} onChange={(e) => update(i, "shippingRmb", e.target.value)} placeholder="예: 300" />
            <input className={inputCls} value={t.factoryPriceRmb} onChange={(e) => update(i, "factoryPriceRmb", e.target.value)} placeholder="예: 1.21" />
            <button type="button" onClick={() => removeTier(i)} title="삭제" className="w-8 h-8 flex items-center justify-center rounded-lg border border-red-200 text-red-500 hover:bg-red-50 shrink-0">🗑️</button>
          </div>
        ))}
      </div>
      <button type="button" onClick={addTier} className="mt-2 text-xs px-3 py-1.5 rounded-lg border border-dashed border-slate-300 text-slate-500 hover:border-[#1E3A8A] hover:text-[#1E3A8A]">
        ➕ 수량 구간 추가
      </button>
      {tiers.length === 0 && <p className="text-xs text-slate-400 mt-2">아직 등록된 수량 구간이 없습니다. "수량 구간 추가"로 시작해주세요.</p>}
    </div>
  );
}

function FileNoteUpload({ label, hint, file, note, onFileChange, onNoteChange }) {
  const ref = useRef(null);
  const [busy, setBusy] = useState(false);
  const handleFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setBusy(true);
    try {
      const isImage = f.type.startsWith("image/");
      const data = isImage ? await compressImageFile(f, 120 * 1024) : await readFileAsDataUrl(f);
      onFileChange(data, f.name);
    } catch (err) {
      console.error(err);
    } finally {
      setBusy(false);
    }
  };
  return (
    <Field label={label} hint={hint}>
      <div className="border border-slate-200 rounded-lg p-3 space-y-2">
        <div className="flex items-center gap-3">
          {file && file.startsWith("data:image") ? (
            <ZoomableImage src={file} className="w-14 h-14 object-cover rounded-lg border border-slate-200" />
          ) : file ? (
            <div className="w-14 h-14 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center text-slate-400 text-xs">파일</div>
          ) : null}
          <button type="button" onClick={() => ref.current && ref.current.click()} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">
            {busy ? "업로드 중..." : file ? "파일 교체" : "📁 파일 선택"}
          </button>
          {file && <button type="button" onClick={() => onFileChange("", "")} className="text-xs text-red-400 hover:text-red-600">제거</button>}
          <input ref={ref} type="file" className="hidden" onChange={handleFile} />
        </div>
        <input className={inputCls} value={note} onChange={(e) => onNoteChange(e.target.value)} placeholder="파일 설명 / 특이사항 입력" />
      </div>
    </Field>
  );
}

function ProductEditModal({ product, factories, onClose, onSave }) {
  const [tab, setTab] = useState("basic"); // basic | factory | files

  const [name, setName] = useState(product.name || "");
  const [image, setImage] = useState(product.image || "");
  const [compressing, setCompressing] = useState(false);
  const fileRef = useRef(null);

  const [sku, setSku] = useState(product.sku || "");
  const [category, setCategory] = useState(product.category || "");
  const [fillMethod, setFillMethod] = useState(product.fillMethod || "");
  const [capacity, setCapacity] = useState(product.capacity || "");
  const [specSize, setSpecSize] = useState(product.specSize || "");
  const [composition, setComposition] = useState(product.composition || "");
  const [material, setMaterial] = useState(product.material || "");
  const [moqText, setMoqText] = useState(product.moqText || "");
  const [leadTimeText, setLeadTimeText] = useState(product.leadTimeText || "");
  const [proposalPriceBasis, setProposalPriceBasis] = useState(product.proposalPriceBasis || "");
  const [lastUnitPrice, setLastUnitPrice] = useState(product.lastUnitPrice || 0);
  const [containerPrintPriceK, setContainerPrintPriceK] = useState(product.containerPrintPriceK || "");
  const [containerFinishPriceK, setContainerFinishPriceK] = useState(product.containerFinishPriceK || "");
  const [capPrintPriceK, setCapPrintPriceK] = useState(product.capPrintPriceK || "");
  const [capFinishPriceK, setCapFinishPriceK] = useState(product.capFinishPriceK || "");
  const [otherFinishPriceK, setOtherFinishPriceK] = useState(product.otherFinishPriceK || "");
  const [otherOptionK, setOtherOptionK] = useState(product.otherOptionK || "");
  const [proposalNotesK, setProposalNotesK] = useState(product.proposalNotesK || "");
  const [ctSamplePriceK, setCtSamplePriceK] = useState(product.ctSamplePriceK || "");
  const [premoldCode, setPremoldCode] = useState(product.premoldCode || "");
  const [cosmepackCode, setCosmepackCode] = useState(product.cosmepackCode || "");

  const [factory, setFactory] = useState(product.factory || "");
  const [factoryLink, setFactoryLink] = useState(product.factoryLink || "");
  const [wechatGroup, setWechatGroup] = useState(product.wechatGroup || "");
  const [showFactorySuggest, setShowFactorySuggest] = useState(false);
  const [showWechatSuggest, setShowWechatSuggest] = useState(false);
  // 공장명/위챗방명/제품URL 3개 필드는 어느 쪽에서 골라도 나머지가 함께 채워지는 양방향 연동 — DB에 없는 값은 그대로 직접입력 유지(유연성 보존)
  const applyFactory = (f) => {
    setFactory(f.name || "");
    if (f.wechatGroup) setWechatGroup(f.wechatGroup);
    if (f.websiteUrl) setFactoryLink(f.websiteUrl);
    setShowFactorySuggest(false);
    setShowWechatSuggest(false);
  };
  const [factoryPriceNote, setFactoryPriceNote] = useState(product.factoryPriceNote || "");
  const [containerPrintPriceC, setContainerPrintPriceC] = useState(product.containerPrintPriceC || "");
  const [containerFinishPriceC, setContainerFinishPriceC] = useState(product.containerFinishPriceC || "");
  const [capPrintPriceC, setCapPrintPriceC] = useState(product.capPrintPriceC || "");
  const [capFinishPriceC, setCapFinishPriceC] = useState(product.capFinishPriceC || "");
  const [otherFinishPriceC, setOtherFinishPriceC] = useState(product.otherFinishPriceC || "");
  const [otherOptionC, setOtherOptionC] = useState(product.otherOptionC || "");
  const [productionNotesC, setProductionNotesC] = useState(product.productionNotesC || "");
  const [ctSampleC, setCtSampleC] = useState(product.ctSampleC || "");
  const [priceTiers, setPriceTiers] = useState(() => {
    if (product.priceTiers && product.priceTiers.length) return product.priceTiers;
    if (product.rmbCost || product.cbmText || product.shippingText) {
      return [{ qty: product.moqText || "", cbm: product.cbmText || "", shippingRmb: product.shippingText || "", factoryPriceRmb: product.rmbCost || "" }];
    }
    return [];
  });

  const normalizeRefs = (refs) => (refs || []).map((r) => (typeof r === "string" ? { image: r, note: "" } : r));
  const [referenceItems, setReferenceItems] = useState(normalizeRefs(product.referenceImages));
  const [containerDieline, setContainerDieline] = useState(product.containerDieline && typeof product.containerDieline === "object" ? product.containerDieline : { file: product.containerDieline || "", note: "" });
  const [boxDieline, setBoxDieline] = useState(product.boxDieline && typeof product.boxDieline === "object" ? product.boxDieline : { file: product.boxDieline || "", note: "" });
  const [otherFile, setOtherFile] = useState(product.otherFile && typeof product.otherFile === "object" ? product.otherFile : { file: product.otherFile || "", note: "" });

  const handleImageFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setCompressing(true);
    try { setImage(await compressImageFile(file, 120 * 1024)); }

    finally { setCompressing(false); }

  const addReferenceItem = () => setReferenceItems((prev) => [...prev, { image: "", note: "" }]);

  const save = () => {
    if (!name.trim()) return;
    onSave(product.id, {
      name, image, sku, category,
      fillMethod, capacity, specSize, composition, material,
      moqText, leadTimeText, proposalPriceBasis, lastUnitPrice: Number(lastUnitPrice) || 0,
      containerPrintPriceK, containerFinishPriceK, capPrintPriceK, capFinishPriceK,
      otherFinishPriceK, otherOptionK, proposalNotesK, ctSamplePriceK, premoldCode, cosmepackCode,
      factory, factoryLink, wechatGroup,
      factoryPriceNote, containerPrintPriceC, containerFinishPriceC, capPrintPriceC, capFinishPriceC,

function ProductsView({ products, factories, proposals, onBack, onDelete, onAdd, onAddDuplicate, onBulkAdd, onUseInSourcing, onUpdate, onDedupe, onAutoAssignCategories, onStripBrandPrefix, onOpenProposal, onSyncFactories, onUploadZip, onDeleteAllProducts, onDeleteAllUploaded, onSyncProposalLinks, onAutoMergeBoxHero, onBulkDelete, onBulkUpdateFactoryInfo, onMergeProducts, isAdmin, initialViewProduct, onConsumeInitialView }) {
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const [viewMode, setViewMode] = useState("list"); // list | card
  const [editingProduct, setEditingProduct] = useState(null);
  const [isDuplicateFlow, setIsDuplicateFlow] = useState(false); // 지금 열려있는 편집모달이 "제품 복사"로 열린 것인지 추적(저장시 토스트 문구 분기용)
  const [showBatchFactoryUpdate, setShowBatchFactoryUpdate] = useState(false);
  const [showProductMergeModal, setShowProductMergeModal] = useState(false);
  const [viewingProduct, setViewingProduct] = useState(null);
  const [viewingProductProposals, setViewingProductProposals] = useState(null);
  const [viewingSimilarProduct, setViewingSimilarProduct] = useState(null);

  useEffect(() => {
    if (initialViewProduct) {
      setViewingProduct(initialViewProduct);
      if (onConsumeInitialView) onConsumeInitialView();
    }
  }, [initialViewProduct]);
  const [uploadBusy, setUploadBusy] = useState(false);
  const [zipBusy, setZipBusy] = useState(false);
  const zipRef = useRef(null);
  const uploadRef = useRef(null);
  const [categoryFilter, setCategoryFilter] = useState("전체");
  const [page, setPage] = useState(() => (parseKoreanHash().view === "제품관리" ? parseKoreanHash().page : 1));
  useHashPageSync("제품관리", page);
  const PAGE_SIZE = 20;

  const filtered = useMemo(() => {
    const categoryScoped = categoryFilter !== "전체" ? products.filter((p) => p.category === categoryFilter) : products;
    const base = search.trim() ? smartProductSearch(categoryScoped, search) : categoryScoped;
    return sortByKey(base, sortKey, (p) => p.name, (p) => p.createdAt, (p) => getLinkedProposals(p, proposals).length);
  }, [products, categoryFilter, search, sortKey, proposals]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedFiltered = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  useEffect(() => { setPage(1); }, [search, categoryFilter]);
  useEffect(() => { setSelectedIds([]); }, [page, search, categoryFilter, sortKey]);
  const allPagedSelected = pagedFiltered.length > 0 && pagedFiltered.every((p) => selectedIds.includes(p.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : pagedFiltered.map((p) => p.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  // 신규 등록/수정 모두 동일한 대형 모달(ProductEditModal)을 사용 — id 유무로 등록/수정 분기
  const handleSaveProduct = (id, patch) => {
    if (id) {
      onUpdate(id, patch);
    } else if (isDuplicateFlow && onAddDuplicate) {
      onAddDuplicate({ id: Date.now() + Math.random(), ...patch }); // 복사플로우는 전용 토스트("복사되어 등록되었습니다")를 띄우는 별도 저장함수로
    } else {
      onAdd({ id: Date.now() + Math.random(), ...patch });
    }
    setEditingProduct(null);
    setIsDuplicateFlow(false);
  };

  // "📋 제품 복사": 원본의 이미지/카테고리/규격/재질/연동공장/가격정보를 그대로 복제한 채 편집모달을 바로 연다.
  // 제품명엔 "(복사본)"을 붙이고, SKU는 중복방지를 위해 새 랜덤값으로 새로 발급하며, id/생성일/제안서연결이력(이 복사본과는 무관)은 제외한다.
  const duplicateProduct = (p) => {
    const { id, createdAt, proposalIds, proposalCount, ...rest } = p;
    const newSku = "SKU-" + Math.random().toString(36).slice(2, 10).toUpperCase();
    setIsDuplicateFlow(true);
    setEditingProduct({ ...rest, name: `${p.name} (복사본)`, sku: newSku });
  };

  // SKU-XXXXXXXX 토큰 추출은 전역 extractSkuToken() 재사용 (App레벨 ZIP 업로드와 동일 로직 공유)

  // 박스히어로 데이터 통합 업로드: 파일 하나(또는 여러 개)를 한번에 올리면 확장자/타입으로 자동 구분해서 처리한다.
  // .csv / .xlsx·.xls / .html·.htm → 제품 데이터 파싱 후 SKU(없으면 제품명+규격) 기준 1:1 병합(bulkAddProducts)
  // 이미지 파일(jpg/png 등, 파일명에 SKU-XXXXXXXX 포함) → 사진(image)만 SKU 매칭으로 복구, 다른 필드는 건드리지 않음
  const handleBoxHeroUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setUploadBusy(true);
    try {
      const records = [];
      const skuToImage = new Map(); // 이미지 단독 파일에서 수집한 SKU -> base64

      for (const file of files) {
        const lower = file.name.toLowerCase();
        if (lower.endsWith(".csv")) {
          const text = await file.text();
          const rows = parseCsv(text);
          rows.forEach((row) => {
            const name = pickField(row, ["제품명", "name", "product name", "품명"]);
            if (!name) return;
            records.push({
              name,
              sku: pickField(row, ["sku", "바코드", "barcode", "코드", "품목코드"]),
              specSize: pickField(row, ["규격", "spec", "사이즈", "size"]),
              material: pickField(row, ["재질", "material"]),
              lastUnitPrice: Number((pickField(row, ["단가", "price", "기본단가", "cost", "원가", "판매가"]) || "0").replace(/[^0-9.]/g, "")) || 0,
              image: "", factory: "", wechatGroup: "",
            });
          });
        } else if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
          try {
            const buf = await readFileAsArrayBuffer(file);
            const workbook = XLSX.read(buf, { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
            records.push(...boxHeroRowsToProducts(rawRows));
          } catch (err) {
            console.error(`"${file.name}" 엑셀 분석 실패:`, err);
          }
        } else if (lower.endsWith(".html") || lower.endsWith(".htm")) {
          try {
            const text = await file.text();
            const rawRows = parseBoxHeroHtml(text);
            records.push(...boxHeroRowsToProducts(rawRows));
          } catch (err) {
            console.error(`"${file.name}" HTML 분석 실패:`, err);
          }
        } else if (/^image\//i.test(file.type) || /\.(jpe?g|png|gif|webp)$/i.test(file.name)) {
          const sku = extractSkuToken(file.name);
          if (!sku) continue; // 파일명에 SKU가 없으면 어느 제품인지 알 수 없어 건너뜀
          try {
            const compressed = await compressImageFile(file, 120 * 1024);
            skuToImage.set(sku, compressed);
          } catch (err) {
            console.error(`"${file.name}" 이미지 압축 실패:`, err);
          }
        }
      }

      if (records.length === 0 && skuToImage.size === 0) {
        alert("인식된 데이터가 없습니다. .xlsx/.csv/.html 제품 데이터 파일이거나, 파일명에 SKU-XXXXXXXX가 포함된 이미지 파일인지 확인해주세요.");
        return;
      }

      if (records.length > 0) {
        if (!window.confirm(`${records.length}개 제품 데이터를 SKU 기준으로 병합할까요? (SKU가 같으면 기존 정보 갱신, 없으면 신규 등록)`)) return;
        await onBulkAdd(records);
        if (onSyncFactories) await onSyncFactories(records);
      }

      let restored = 0, unmatched = 0;
      for (const [sku, image] of skuToImage.entries()) {
        const target = products.find((p) => (p.sku || "").trim().toUpperCase() === sku);
        if (target) {
          await onUpdate(target.id, { image }); // image 필드만 갱신 — 다른 스펙 데이터는 그대로 유지
          restored++;
        } else {
          unmatched++;
        }
      }

      let summary;
      if (records.length > 0 && restored > 0) {
        summary = `제품 데이터 ${records.length}건 처리 및 이미지 ${restored}건 복구가 완료되었습니다.`;
      } else if (restored > 0) {
        summary = `총 ${restored}개 제품의 이미지가 SKU 기준으로 성공적으로 복구되었습니다.`;
      } else if (records.length > 0) {
        summary = `제품 데이터 ${records.length}건 처리가 완료되었습니다.`;
      } else {
        summary = "처리가 완료되었습니다.";
      }
      alert(summary + (unmatched > 0 ? `\n(SKU가 DB와 일치하지 않아 건너뛴 이미지 ${unmatched}건)` : ""));
    } catch (err) {
      console.error(err);
      alert("파일 처리 중 오류가 발생했습니다.");
    } finally {
      setUploadBusy(false);
      if (uploadRef.current) uploadRef.current.value = "";
    }
  };

  // ZIP 일괄 업로드 — 견적엑셀(.xlsx)+제품사진+HTML이 섞인 압축파일을 통째로 올리면
  // App 레벨의 uploadZipToArchive()가 엑셀 파싱(가격조사/제안서/제안가격 시트)과 SKU기준 이미지 매핑을 한번에 처리하고
  // 업체·공장·제품·제안서 DB에 자동 반영한다.
  const handleZipUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file || !onUploadZip) return;
    setZipBusy(true);
    try {
      await onUploadZip(file);
    } finally {
      setZipBusy(false);
      if (zipRef.current) zipRef.current.value = "";
    }
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      {viewingProduct && <ProductDetailModal product={viewingProduct} onClose={() => setViewingProduct(null)} onOpenSimilar={(p) => { setViewingProduct(null); setViewingSimilarProduct(p); }} />}
      {viewingSimilarProduct && <SimilarProductsModal product={viewingSimilarProduct} allProducts={products} onClose={() => setViewingSimilarProduct(null)} />}
      {viewingProductProposals && (
        <ProductProposalsModal product={viewingProductProposals} proposals={proposals} onClose={() => setViewingProductProposals(null)}
          onOpenProposal={(p) => { setViewingProductProposals(null); onOpenProposal(p); }} />
      )}
      {editingProduct !== null && (
        <ProductEditModal
          product={editingProduct} factories={factories}
          onClose={() => { setEditingProduct(null); setIsDuplicateFlow(false); }}
          onSave={handleSaveProduct}
        />
      )}
      {showBatchFactoryUpdate && (
        <BatchFactoryUpdateModal products={products} onRun={onBulkUpdateFactoryInfo} onClose={() => setShowBatchFactoryUpdate(false)} />
      )}
      {showProductMergeModal && onMergeProducts && (
        <GenericMergeModal
          title="🔗 선택 제품 병합"
          items={products.filter((p) => selectedIds.includes(p.id))}
          getLabel={(p) => p.name}
          getSubLabel={(p) => `${p.category || "카테고리 미지정"} · 연결 제안서 ${getLinkedProposals(p, proposals).length}건`}
          confirmText={`선택한 ${selectedIds.length}개 제품을 대표 제품 1개로 병합할까요? 나머지 제품은 삭제되고, 연결된 제안서/샘플 데이터는 전부 대표 제품으로 이전됩니다.`}
          onRun={async (items, primaryId) => { await onMergeProducts(items, primaryId); setSelectedIds([]); }}
          onClose={() => setShowProductMergeModal(false)}
        />
      )}
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">📦 제품(아이템) 관리</h2>
        <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
      </div>

      <div className="bg-white border border-slate-300 shadow-sm rounded-xl p-4 mb-4">
        {onUploadZip && (
          <div className="flex flex-wrap gap-2 items-center mb-3 pb-3 border-b border-slate-100">
            <button onClick={() => zipRef.current && zipRef.current.click()} disabled={zipBusy} title="견적엑셀(.xlsx)+제품사진+HTML이 함께 들어있는 ZIP 압축파일을 올리면, 엑셀 파싱과 SKU 기준 이미지 매핑을 한번에 처리하고 업체·공장·제품·제안서 DB에 자동 반영합니다." className="text-sm px-5 py-2.5 rounded-lg border-2 border-[#1E3A8A]/30 text-[#1E3A8A] bg-[#1E3A8A]/5 font-semibold hover:bg-[#1E3A8A]/10 disabled:opacity-50 whitespace-nowrap">
              {zipBusy ? "처리 중..." : "📦 ZIP/엑셀 파일 일괄 업로드"}
            </button>
            <input ref={zipRef} type="file" accept=".zip" className="hidden" onChange={handleZipUpload} />
            <span className="text-xs text-slate-400">ZIP 안에 엑셀+사진+HTML을 함께 넣어 올리면 한번에 처리됩니다.</span>
          </div>
        )}
        <div className="flex flex-wrap gap-2 items-center mb-3">
          <input
            value={search} onChange={(e) => setSearch(e.target.value)}
            placeholder="🔍 제품명 또는 공장명으로 검색"
            className="flex-1 min-w-[220px] px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
          />
          <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="text-sm px-3 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]">
            {SORT_OPTIONS_COMMON.map(([k, label]) => <option key={k} value={k}>정렬: {label}</option>)}
            <option value="proposal_desc">정렬: 제안서 갯수 많은순</option>
            <option value="proposal_asc">정렬: 제안서 갯수 적은순</option>
          </select>
          <div className="flex rounded-lg border border-slate-200 bg-white p-0.5">
            <button onClick={() => setViewMode("list")} title="리스트 뷰" className={"px-3 py-1.5 rounded-md text-sm " + (viewMode === "list" ? "bg-[#1E3A8A] text-white" : "text-slate-500 hover:bg-slate-50")}>📋</button>
            <button onClick={() => setViewMode("card")} title="카드 뷰" className={"px-3 py-1.5 rounded-md text-sm " + (viewMode === "card" ? "bg-[#1E3A8A] text-white" : "text-slate-500 hover:bg-slate-50")}>🎴</button>
          </div>
          <button onClick={() => { setEditingProduct({}); setIsDuplicateFlow(false); }} className="text-sm px-4 py-2 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 whitespace-nowrap">➕ 신규 제품 직접 등록</button>
          <input ref={uploadRef} type="file" accept=".xlsx,.xls,.csv,.html,.htm,image/*" multiple className="hidden" onChange={handleBoxHeroUpload} />
          {onDedupe && <button onClick={onDedupe} className="text-sm px-4 py-2 rounded-lg border border-amber-200 text-amber-700 font-medium hover:bg-amber-50 whitespace-nowrap">🧹 중복 정리</button>}
          <button
            onClick={() => setShowProductMergeModal(true)}
            disabled={selectedIds.length < 2}
            title={selectedIds.length < 2 ? "병합하려면 제품을 2개 이상 선택해주세요" : ""}
            className="text-sm px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] font-medium hover:bg-[#1E3A8A]/5 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
          >
            🔗 선택 제품 병합 ({selectedIds.length}개)
          </button>
          {isAdmin && onAutoMergeBoxHero && <button onClick={onAutoMergeBoxHero} title="SKU/바코드가 없는 엑셀 유입 제품을 박스히어로 제품과 자동으로(안되면 수동으로) 병합합니다" className="text-sm px-4 py-2 rounded-lg border border-emerald-200 text-emerald-700 font-medium hover:bg-emerald-50 whitespace-nowrap">🔗 박스히어로 제품 병합</button>}
          {false && isAdmin && onBulkUpdateFactoryInfo && <button onClick={() => setShowBatchFactoryUpdate(true)} className="text-sm px-4 py-2 rounded-lg border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 whitespace-nowrap">⚙️ 공장/위챗 정보 일괄 변경</button>}
        </div>
        {onBulkDelete && (
          <div className="flex items-center gap-3 mb-3 pb-3 border-b border-slate-100">
            <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
              <input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /> 전체 선택
            </label>
            <button
              onClick={async () => { await onBulkDelete(selectedIds); setSelectedIds([]); }}
              disabled={selectedIds.length === 0}
              className="text-xs px-3 py-1.5 rounded-lg border border-red-200 text-red-600 font-medium hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
            >
              🗑️ 선택 삭제 ({selectedIds.length}개)
            </button>
          </div>
        )}
        <div className="flex flex-wrap gap-1.5">
          {["전체", ...CATEGORIES].map((c) => (
            <button
              key={c} onClick={() => setCategoryFilter(c)}
              className={"text-xs px-3 py-1.5 rounded-full font-semibold whitespace-nowrap transition-colors border " + (categoryFilter === c ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "bg-white border-slate-300 hover:bg-slate-50")}
              style={categoryFilter === c ? {} : { color: "#334155" }}
            >
              {c}
            </button>
          ))}
        </div>
      </div>

      <p className="text-xs text-slate-400 mb-4">제안서 작성 중 품목을 추가해도 이 DB에 자동으로 저장/갱신됩니다. · 총 {filtered.length}개{categoryFilter !== "전체" ? ` (${categoryFilter})` : ""}</p>

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">등록된 제품이 없습니다.</div>
      ) : viewMode === "list" ? (
        <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full text-sm" style={{ tableLayout: "fixed" }}>
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              {onBulkDelete && <th className="text-center px-2 py-3 font-medium" style={{ width: "4%" }}><input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /></th>}
              <th className="text-left px-4 py-3 font-medium" style={{ width: "8%" }}>사진</th>
              <th className="text-left px-4 py-3 font-medium" style={{ width: "22%" }}>제품명 / SKU</th>
              <th className="text-left px-4 py-3 font-medium" style={{ width: "10%" }}>카테고리</th>
              <th className="text-left px-4 py-3 font-medium" style={{ width: "18%" }}>규격 / 재질</th>
              <th className="text-left px-4 py-3 font-medium" style={{ width: "16%" }}>연동 공장 / 위챗</th>
              <th className="text-right px-4 py-3 font-medium" style={{ width: "22%" }}>작업</th>
            </tr></thead>
            <tbody>
              {pagedFiltered.map((p, idx) => (
                <tr key={p.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  {onBulkDelete && <td className="px-2 py-3 text-center"><input type="checkbox" checked={selectedIds.includes(p.id)} onChange={() => toggleSelectOne(p.id)} /></td>}
                  <td className="px-4 py-3">
                    <div className="w-12 h-12 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden flex items-center justify-center">
                      {p.image ? <ZoomableImage src={p.image} className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[9px]">사진</span>}
                    </div>
                  </td>
                  <td className="px-4 py-3">
                    <button onClick={() => setViewingProduct(p)} className="font-semibold hover:text-[#1E3A8A] hover:underline text-left" style={{ color: "#1e293b" }}>{p.name}</button>
                    {p.sku && <div className="text-xs mt-0.5" style={{ color: "#1e293b" }}>{p.sku}</div>}
                  </td>
                  <td className="px-4 py-3">
                    {p.category ? <span className="text-[10px] leading-tight px-1.5 py-1 rounded bg-[#1E3A8A]/10 text-[#1E3A8A] font-medium inline-block break-words">{p.category}</span> : <span className="text-slate-300 text-xs">-</span>}
                  </td>
                  <td className="px-4 py-3" style={{ color: "#1e293b" }}>
                    <div className="pre-line">{p.specSize}</div>
                    {p.material && <div>{p.material}</div>}
                    {(() => {
                      const attrs = deriveProductAttributes(p);
                      const tags = [...attrs.materials, ...attrs.capTypes, ...attrs.finishes];
                      return tags.length > 0 ? (
                        <div className="mt-1 flex flex-wrap gap-1">
                          {tags.slice(0, 4).map((t) => <span key={t} className="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">{t}</span>)}
                        </div>
                      ) : null;
                    })()}
                  </td>
                  <td className="px-4 py-3" style={{ color: "#1e293b" }}>
                    {p.factory && <div>🏭 {p.factory}</div>}
                    {p.wechatGroup && <div>💬 {p.wechatGroup}</div>}
                    {!p.factory && !p.wechatGroup && <span className="text-slate-300">-</span>}
                  </td>
                  <td className="px-4 py-3 text-right">
                    <div className="flex flex-col gap-1 items-stretch">
                      <div className="grid grid-cols-3 gap-1">
                        <button onClick={() => { setEditingProduct(p); setIsDuplicateFlow(false); }} className="text-[11px] leading-tight px-2 py-1 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-center">✏️ 수정</button>
                        <button onClick={() => duplicateProduct(p)} className="text-[11px] leading-tight px-2 py-1 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 text-center">📋 복사</button>
                        <button onClick={() => onDelete(p)} className="text-[11px] leading-tight px-2 py-1 rounded-lg border border-red-100 text-red-500 hover:bg-red-50 text-center">🗑️ 삭제</button>
                      </div>
                      <div className="grid grid-cols-2 gap-1">
                        {proposals && (
                          <button onClick={() => setViewingProductProposals(p)} className="text-[11px] leading-tight px-2 py-1 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-center">
                            {getLinkedProposals(p, proposals).length}개 제안서
                          </button>
                        )}
                        {onUseInSourcing && (
                          <button onClick={() => onUseInSourcing(p)} className="text-[11px] leading-tight px-2 py-1 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 text-center">
                            가격조사 사용
                          </button>
                        )}
                      </div>
                      <button onClick={() => setViewingSimilarProduct(p)} className="text-[11px] leading-tight px-2 py-1 rounded-lg border border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100 text-center whitespace-nowrap">
                        🔍 유사/옵션분석
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {pagedFiltered.map((p) => (
            <div key={p.id} className="bg-white border border-slate-200 rounded-xl p-4 flex gap-3">
              <div className="w-14 h-14 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
                {p.image ? <ZoomableImage src={p.image} className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[10px]">사진</span>}
              </div>
              <div className="flex-1 min-w-0">
                <div className="font-semibold text-sm truncate cursor-pointer hover:text-[#1E3A8A] hover:underline" style={{ color: "#1e293b" }} onClick={() => setViewingProduct(p)}>{p.name}{p.sku ? <span className="font-normal" style={{ color: "#1e293b" }}> · {p.sku}</span> : ""}</div>
                <div className="text-xs mt-0.5" style={{ color: "#1e293b" }}>{p.specSize}{p.material ? ` / ${p.material}` : ""}</div>
                {p.factory && <div className="text-xs mt-0.5" style={{ color: "#1e293b" }}>🏭 {p.factory}{p.wechatGroup ? ` · 💬 ${p.wechatGroup}` : ""}</div>}
              </div>
              <div className="flex flex-col gap-1 shrink-0">
                <button onClick={() => { setEditingProduct(p); setIsDuplicateFlow(false); }} className="text-xs text-slate-500 hover:underline whitespace-nowrap">✏️ 수정</button>
                <button onClick={() => duplicateProduct(p)} className="text-xs text-[#1E3A8A] hover:underline whitespace-nowrap">📋 복사</button>
                {onUseInSourcing && <button onClick={() => onUseInSourcing(p)} className="text-xs text-[#1E3A8A] hover:underline whitespace-nowrap">🔍 사용</button>}
                <button onClick={() => setViewingSimilarProduct(p)} className="text-xs text-amber-700 hover:underline whitespace-nowrap">🔍 옵션분석</button>
                <button onClick={() => onDelete(p)} className="text-xs text-red-400 hover:text-red-600">삭제</button>
              </div>
            </div>
          ))}
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );
}

/* ===================== 업무 지시 & 소통방 ===================== */
function TaskCreateModal({ accounts, currentUserName, onClose, onSave }) {
  const staffOptions = (accounts || []).filter((a) => a.role !== "admin");
  const [requestedBy, setRequestedBy] = useState(currentUserName || "백상선"); // 요청 직원명 — 기본값은 로그인한 사용자, 필요시 수정 가능
  const [clientName, setClientName] = useState("");
  const [assignee, setAssignee] = useState((staffOptions[0] && staffOptions[0].name) || "");
  const [content, setContent] = useState("");
  const [channel, setChannel] = useState(TASK_CHANNEL_OPTIONS[0]);
  const [dueDate, setDueDate] = useState("");
  const [instructionDate, setInstructionDate] = useState(todayStr()); // 지시 일자(기본값 당일)
  const [images, setImages] = useState([]); // 참고 이미지 다중첨부(base64 압축본 배열)
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);
  const canSave = clientName.trim() && assignee && content.trim();

  const handleFiles = async (fileList) => {
    const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
    for (const f of files) {
      try {
        const compressed = await compressImageFile(f, 120 * 1024);
        setImages((prev) => [...prev, compressed]);
      } catch (e) { console.error(e); }
    }
  };
  const removeImage = (idx) => setImages((prev) => prev.filter((_, i) => i !== idx));

  const save = () => {
    if (!canSave) return;
    onSave({
      requestedBy: requestedBy.trim() || currentUserName || "백상선",
      clientName: clientName.trim(), assignee, content: content.trim(), channel, dueDate, instructionDate,
      status: "요청", comments: [], images, linkedProposalCode: "", linkedProposalClient: "",
    });
    onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">📋 신규 업무 지시</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3 max-h-[70vh] overflow-y-auto">
          <Field label="요청 직원명" hint="기본값: 로그인한 사용자">
            <select className={inputCls} value={requestedBy} onChange={(e) => setRequestedBy(e.target.value)}>
              {!accounts.some((a) => a.name === requestedBy) && requestedBy && <option value={requestedBy}>{requestedBy}</option>}
              {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
            </select>
          </Field>
          <Field label="고객사명"><input className={inputCls} value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="예: 비저블유스" /></Field>
          <Field label="담당 직원">
            <select className={inputCls} value={assignee} onChange={(e) => setAssignee(e.target.value)}>
              {staffOptions.length === 0 && <option value="">등록된 직원 계정이 없습니다</option>}
              {staffOptions.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
            </select>
          </Field>
          <Field label="요청 제품 및 조사 내용"><textarea className={inputCls} rows={6} style={{ minHeight: "120px" }} value={content} onChange={(e) => setContent(e.target.value)} placeholder="예: OO브랜드 크림용기 50g 견적 조사, 원터치캡 옵션 포함" /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="문의 채널">
              <select className={inputCls} value={channel} onChange={(e) => setChannel(e.target.value)}>
                {TASK_CHANNEL_OPTIONS.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="지시 일자"><input type="date" className={inputCls} value={instructionDate} onChange={(e) => setInstructionDate(e.target.value)} /></Field>
          </div>
          <Field label="마감 희망일"><input type="date" className={inputCls} value={dueDate} onChange={(e) => setDueDate(e.target.value)} /></Field>

          <Field label="🖼️ 참고 이미지 첨부 (여러 장 가능)">
            <div
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}
              onClick={() => fileRef.current && fileRef.current.click()}
              className={"border-2 border-dashed rounded-lg p-4 text-center cursor-pointer transition-colors " + (dragOver ? "border-[#1E3A8A] bg-[#1E3A8A]/5" : "border-slate-200 hover:bg-slate-50")}
            >
              <p className="text-xs text-slate-400">클릭하거나 이미지를 이 영역에 끌어다 놓으세요 (여러 장 동시 첨부 가능)</p>
              <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
            </div>
            {images.length > 0 && (
              <div className="grid grid-cols-4 gap-2 mt-2">
                {images.map((img, i) => (
                  <div key={i} className="relative group">
                    <img src={img} loading="lazy" className="w-full h-16 object-cover rounded-lg border border-slate-200" />
                    <button onClick={() => removeImage(i)} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-500 text-white text-xs leading-5 opacity-90 hover:opacity-100">✕</button>
                  </div>
                ))}
              </div>
            )}
          </Field>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} disabled={!canSave} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed">지시 등록</button>
        </div>
      </div>
    </div>
  );
}

function TaskCard({ task, isAdmin, currentUserName, accounts, proposals, onUpdate, onAddComment, onLinkProposal, onDelete }) {
  const [commentText, setCommentText] = useState("");
  const [linking, setLinking] = useState(false);
  const submitComment = () => {
    if (!commentText.trim()) return;
    onAddComment(task, commentText.trim());
    setCommentText("");
  };
  // ===== 샘플 진행과 동일한 단계바 + [단계|진행일|확인직원|확인] 테이블 로직 =====
  const stepIndex = TASK_STATUS_OPTIONS.indexOf(task.status || "요청");
  const setTaskStatus = (status) => {
    const dateField = TASK_STATUS_DATE_FIELD[status];
    const patch = { status };
    if (dateField && !task[dateField]) patch[dateField] = todayStr();
    onUpdate(task, patch);
  };
  const [pendingDates, setPendingDates] = useState({});
  const [pendingConfirmers, setPendingConfirmers] = useState({});
  const getDate = (field) => (pendingDates[field] != null ? pendingDates[field] : (task[field] || ""));
  const getConfirmer = (field) => (pendingConfirmers[field] != null ? pendingConfirmers[field] : (task[field] || currentUserName || "백상선"));
  const confirmTaskStep = (status) => {
    const dateField = TASK_STATUS_DATE_FIELD[status];
    const confirmerField = TASK_STATUS_CONFIRMER_FIELD[status];
    const dateValue = getDate(dateField) || todayStr();
    const confirmerValue = getConfirmer(confirmerField) || currentUserName || "백상선";
    onUpdate(task, { status, [dateField]: dateValue, [confirmerField]: confirmerValue });
  };
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="min-w-0">
          <div className="text-sm font-bold text-slate-800 truncate">{task.clientName}</div>
          <div className="text-xs text-slate-400 mt-0.5">
            {task.requestedBy ? `요청자: ${task.requestedBy} ➔ 담당자: ${task.assignee}` : `👤 담당: ${task.assignee}`} · 📞 {task.channel}
            {task.instructionDate ? ` · 📅 지시일 ${task.instructionDate}` : ""}
            {task.dueDate ? ` · ⏰ 마감 ${task.dueDate}` : ""}
          </div>
        </div>
      </div>
      <p className="text-xs text-slate-600 mb-3 pb-3 border-b border-slate-100" style={{ whiteSpace: "pre-wrap", wordBreak: "break-all", height: "auto", minHeight: "auto" }}>{task.content}</p>

      {/* 3단계 진행바 — 샘플 진행 카드와 동일한 구조, 클릭시 즉시 이동 */}
      <div className="flex items-center gap-1 mb-2">
        {TASK_STATUS_OPTIONS.map((s, i) => (
          <React.Fragment key={s}>
            <button onClick={() => setTaskStatus(s)} title={TASK_STATUS_LABELS[s]} className={"flex-1 text-[11px] px-1 py-2 rounded-lg font-bold text-center whitespace-nowrap " + (i <= stepIndex ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-400")}>
              {TASK_STATUS_LABELS[s]}
            </button>
            {i < TASK_STATUS_OPTIONS.length - 1 && <div className={"w-1.5 h-0.5 shrink-0 " + (i < stepIndex ? "bg-[#1E3A8A]" : "bg-slate-200")} />}
          </React.Fragment>
        ))}
      </div>
      <div className="text-[11px] text-center text-slate-500 mb-2">현재 단계: <b className="text-[#1E3A8A]">{TASK_STATUS_LABELS[task.status] || task.status}</b></div>

      {/* 단계별 [단계|진행일|확인직원|확인] 테이블 — 샘플 진행과 동일 구조. 확인완료된 단계는 확인직원이 🔒로 잠기고 수정 불가 */}
      <div className="border border-slate-200 rounded-lg overflow-hidden mb-3">
        <table className="w-full text-[11px]">
          <thead><tr className="bg-slate-50 text-slate-400">
            <th className="text-left px-2 py-1.5 font-medium">단계</th>
            <th className="text-left px-2 py-1.5 font-medium">진행일</th>
            <th className="text-left px-2 py-1.5 font-medium">확인직원</th>
            <th className="px-2 py-1.5 w-14"></th>
          </tr></thead>
          <tbody>
            {TASK_STATUS_OPTIONS.map((s) => {
              const dateField = TASK_STATUS_DATE_FIELD[s];
              const confirmerField = TASK_STATUS_CONFIRMER_FIELD[s];
              const isCurrent = task.status === s;
              const isDone = task[confirmerField];
              return (
                <tr key={s} className={"border-t border-slate-100 " + (isCurrent ? "bg-[#1E3A8A]/5" : "")}>
                  <td className="px-2 py-1.5 whitespace-nowrap">
                    {isDone && <span className="text-emerald-500 mr-1">✓</span>}
                    {TASK_STATUS_LABELS[s]}
                    {isCurrent && <span className="ml-1 text-[9px] px-1.5 py-0.5 rounded-full bg-[#1E3A8A] text-white">현재</span>}
                  </td>
                  <td className="px-2 py-1.5">
                    <input type="date" value={getDate(dateField)} onChange={(e) => setPendingDates((prev) => ({ ...prev, [dateField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" />
                  </td>
                  <td className="px-2 py-1.5">
                    {isDone ? (
                      <span className="inline-flex items-center gap-1 w-full px-1.5 py-1 rounded border border-slate-100 bg-slate-50 text-slate-600" title="확인 완료 — 이후 변경 불가">
                        🔒 {task[confirmerField]}
                      </span>
                    ) : (
                      <select value={getConfirmer(confirmerField)} onChange={(e) => setPendingConfirmers((prev) => ({ ...prev, [confirmerField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]">
                        <option value="">미지정</option>
                        {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
                      </select>
                    )}
                  </td>
                  <td className="px-2 py-1.5 text-center">
                    <button onClick={() => confirmTaskStep(s)} className="text-[10px] px-2 py-1 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 whitespace-nowrap">확인</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {(task.images || []).length > 0 && (
        <div className="grid grid-cols-4 gap-1.5 mb-3">
          {task.images.map((img, i) => (
            <ZoomableImage key={i} src={img} alt={`참고이미지 ${i + 1}`} className="w-full h-14 object-cover rounded-lg border border-slate-200" />
          ))}
        </div>
      )}

      <div className="mb-3">
        {task.linkedProposalCode ? (
          <div className="text-xs px-2.5 py-1.5 rounded-lg bg-[#1E3A8A]/5 text-[#1E3A8A] flex items-center justify-between">
            <span>📄 연결된 제안서: [{task.linkedProposalCode}] {task.linkedProposalClient}{task.linkedProposalProduct ? ` — ${task.linkedProposalProduct}` : ""}</span>
            <button onClick={() => setLinking(true)} className="underline text-[11px] shrink-0 ml-2">변경</button>
          </div>
        ) : (
          <button onClick={() => setLinking(true)} className="text-xs px-2.5 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5">📄 제안서 연결</button>
        )}
        {linking && (
          <select
            autoFocus
            defaultValue=""
            onChange={(e) => { const p = (proposals || []).find((pr) => String(pr.id) === e.target.value); if (p) onLinkProposal(task, p); setLinking(false); }}
            onBlur={() => setLinking(false)}
            className="mt-2 w-full text-xs px-2 py-1.5 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]"
          >
            <option value="">제안서 선택...</option>
            {(proposals || []).slice(0, 100).map((p) => <option key={p.id} value={p.id}>{proposalOptionLabel(p)}</option>)}
          </select>
        )}
      </div>

      <div className="text-[11px] font-semibold text-slate-500 mb-1.5">💬 업무 소통 & 채팅</div>
      <div className="space-y-1.5 mb-2 max-h-48 overflow-y-auto pr-0.5">
        {(task.comments || []).length === 0 && <p className="text-[11px] text-slate-300">아직 대화가 없습니다. 첫 메시지를 남겨보세요.</p>}
        {(task.comments || []).map((c) => {
          const mine = c.author === currentUserName;
          return (
            <div key={c.id} className={"flex " + (mine ? "justify-end" : "justify-start")}>
              <div className={"max-w-[80%] rounded-2xl px-3 py-1.5 text-[11px] " + (mine ? "bg-[#1E3A8A] text-white rounded-br-sm" : "bg-slate-100 text-slate-700 rounded-bl-sm")}>
                <div className={"font-semibold mb-0.5 " + (mine ? "text-white/80" : "text-slate-500")}>{c.author} <span className="font-normal opacity-70">· {c.createdAt}</span></div>
                <div className="whitespace-pre-line">{c.text}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex gap-1.5">
        <input value={commentText} onChange={(e) => setCommentText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitComment()} placeholder="예: 내일까지 완료하겠습니다 / 공장 견적 확인 필요..." className="flex-1 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]" />
        <button onClick={submitComment} className="text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-white hover:opacity-90 whitespace-nowrap">전송</button>
      </div>
      {isAdmin && (
        <div className="text-right mt-2">
          <button onClick={() => onDelete(task)} className="text-[11px] text-red-400 hover:text-red-600">🗑️ 지시 삭제</button>
        </div>
      )}
    </div>
  );
}

                  <td className="px-3 py-3 text-center whitespace-nowrap">
                    <span className={"inline-block text-[10px] px-2 py-1 rounded-full font-semibold border " + (TASK_STATUS_COLORS[t.status] || "bg-slate-50 text-slate-500 border-slate-200")}>{TASK_STATUS_LABELS[t.status] || t.status}</span>
                  </td>
                  <td className="px-3 py-3 text-center whitespace-nowrap">
                    {isAdmin && <button onClick={(e) => handleDeleteRow(e, t)} title="삭제" className="text-red-400 hover:text-red-600">🗑️</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}

      {showCreate && <TaskCreateModal accounts={accounts} currentUserName={currentUserName} onClose={() => setShowCreate(false)} onSave={onCreate} />}
      {detailTask && (
        <SampleDetailModal onClose={() => setDetailTask(null)}>
          <TaskCard task={detailTask} isAdmin={isAdmin} currentUserName={currentUserName} accounts={accounts} proposals={proposals}
            onUpdate={onUpdate} onAddComment={onAddComment} onLinkProposal={onLinkProposal} onDelete={(t) => { onDelete(t); setDetailTask(null); }} />
        </SampleDetailModal>
      )}
    </main>
  );
}

// 인보이스 참고사항에 쓰는 "YYYY년 M월 D일" 포맷 변환(<input type="date">의 YYYY-MM-DD를 받아 변환)
function formatKoreanDate(dateStr) {
  if (!dateStr) return "";
  const [y, m, d] = dateStr.split("-");
  if (!y || !m || !d) return dateStr;
  return `${y}년 ${Number(m)}월 ${Number(d)}일`;
}

  set("B15", "No"); set("C15", "제품사진"); set("E15", "제품명"); set("G15", "재원"); set("I15", "주문     수량"); set("K15", "단가(ea)"); set("L15", "금액(\\)"); set("M15", "비고");
  set("B16", 1); set("C16", data.productImage ? "(사진 별도 첨부)" : ""); set("E16", data.productName || ""); set("G16", data.spec || ""); set("I16", Number(data.qty) || 0); set("K16", Number(data.unitPrice) || 0); set("L16", { f: "I16*K16" }); set("M16", "당사부담");
  set("B17", 2); set("E17", "중국내 운송료"); set("I17", data.shippingRmbFee ? 1 : 0); set("K17", Number(data.shippingRmbFee) || 0); set("L17", { f: "I17*K17" }); set("M17", "당사부담");
  const feesForXlsx = data.shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES;

  set("B19", 3); set("E19", "항공택배비"); set("G19", "1KG 미만"); set("I19", data.domesticMethod === "항공" ? 1 : 0); set("K19", feesForXlsx["항공"]); set("L19", { f: "I19*K19" }); set("M19", data.domesticMethod === "항공" ? (data.domesticRemark || "") : "");

// SheetJS(XLSX.full.min.js)로 실제 .xlsx 파일 생성+다운로드. 병합/수식/열너비는 원본서식과 동일하게 재현되지만,
// 커뮤니티 버전 SheetJS는 셀 테두리·색상 등 세부 서식과 이미지 삽입을 안정적으로 지원하지 않아 그 부분은 생략됨(다운로드 버튼 옆 안내문구로 고지).
function downloadSampleInvoiceXlsx(data) {
  const cellsData = buildSampleInvoiceSheetData(data);
  const ws = {};
  Object.entries(cellsData).forEach(([addr, v]) => {
    if (v && typeof v === "object" && "f" in v) ws[addr] = { t: "n", f: v.f };
    else if (typeof v === "number") ws[addr] = { t: "n", v };
    else ws[addr] = { t: "s", v: String(v) };
  });
  ws["!ref"] = "B1:N33";
  ws["!merges"] = SAMPLE_INVOICE_MERGES.map((m) => XLSX.utils.decode_range(m));
  ws["!cols"] = SAMPLE_INVOICE_COL_WIDTHS;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "샘플비 인보이스");
  const fname = `샘플비인보이스_${(data.clientName || "고객사").replace(/[\\/:*?"<>|]/g, "")}_${data.writeDate || todayStr()}.xlsx`;
  XLSX.writeFile(wb, fname);
}

function SampleCreateModal({ accounts, proposals, sampleStock, initialProposalId, onClose, onSave }) {
  const assigneeOptions = accounts || [];
  const [linkedProposalId, setLinkedProposalId] = useState(initialProposalId || "");
  const [clientName, setClientName] = useState("");
  const [productName, setProductName] = useState("");
  const [itemOptions, setItemOptions] = useState([]); // 선택한 제안서에 포함된 품목명 목록
  const [stockLocation, setStockLocation] = useState("korea");
  const [assignee, setAssignee] = useState((assigneeOptions[0] && assigneeOptions[0].name) || "");
  const [requestDate, setRequestDate] = useState(todayStr());
  const [pickedStock, setPickedStock] = useState(null); // 한국재고에서 선택한 항목(있으면 등록시 신청수량만큼 차감)
  const [stockQty, setStockQty] = useState(1); // 본사 재고에서 출고할 신청 수량
  const [showStockPicker, setShowStockPicker] = useState(false);

  // 제안서를 선택하면 고객사명/요청제품(품목목록)/담당직원을 자동으로 채워준다.
  const applyProposal = (proposalId) => {
    setLinkedProposalId(proposalId);
    const p = (proposals || []).find((pr) => String(pr.id) === proposalId);
    if (!p) { setItemOptions([]); return; }
    setClientName(p.clientName || "");
    const names = [...new Set((p.items || []).map((it) => it.productName).filter(Boolean))];
    setItemOptions(names);
    setProductName(names[0] || "");
    if (p.employee && p.employee !== "(엑셀자동등록)") setAssignee(p.employee);
  };

  const canSave = clientName.trim() && productName.trim();
  // "🧪 샘플요청 등록" 버튼(발송완료된 제안서 → 4단계로 선택 전환)으로 열렸을 때, 그 제안서를 자동으로 적용
  useEffect(() => {
    if (initialProposalId) applyProposal(String(initialProposalId));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  const save = async () => {
    if (!canSave) return;
    if (stockLocation === "korea" && !pickedStock) {
      alert("한국 본사 재고에서 출고할 샘플 제품을 선택해 주세요.");
      return;
    }
    if (pickedStock && (Number(stockQty) || 0) > (Number(pickedStock.quantity) || 0)) {
      alert(`현재 보유 재고(${pickedStock.quantity}개)를 초과하여 신청할 수 없습니다.`);
      return;
    }
    await onSave({
      clientName: clientName.trim(), productName: productName.trim(), stockLocation, assignee,
      status: "요청", requestDate, orderDate: "", stockInDate: "", dispatchDate: "", shippingMethod: "", notes: "",
      linkedProposalId: linkedProposalId || "",
      stockItemId: pickedStock ? pickedStock.id : null, // App의 addSample이 이 값을 보고 재고를 신청수량만큼 차감
      stockQty: pickedStock ? (Number(stockQty) || 1) : null,
      ...(pickedStock ? { invoiceQty: Number(stockQty) || 1 } : {}), // 샘플비 인보이스 기본 수량에도 동일하게 반영(Firestore엔 undefined를 못 넣으므로 조건부로만 포함)
    });
    onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
