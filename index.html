  const [ctNotes, setCtNotes] = useState("");
  const [itemOptions, setItemOptions] = useState([]); // 선택한 제안서에 포함된 품목명 목록
  const [itemImageMap, setItemImageMap] = useState({}); // 품목명 → 사진(image) 매핑 — 제품명을 바꿔도 그 사진으로 함께 전환
  const [stockLocation, setStockLocation] = useState(preset.sampleType === "ct" ? "china" : "korea");
  const [assignee, setAssignee] = useState(preset.assignee || (assigneeOptions[0] && assigneeOptions[0].name) || "");
  const [requestDate, setRequestDate] = useState(todayStr());
  const [pickedStock, setPickedStock] = useState(null); // 한국재고에서 선택한 항목(있으면 등록시 신청수량만큼 차감)
  const [stockQty, setStockQty] = useState(1); // 본사 재고에서 출고할 신청 수량
  const [showStockPicker, setShowStockPicker] = useState(false);

  // 제안서를 선택하면 고객사명/요청제품(품목목록)/담당직원을 자동으로 채워준다.
  const applyProposal = (proposalId) => {
    setLinkedProposalId(proposalId);
    const p = (proposals || []).find((pr) => String(pr.id) === proposalId);
    if (!p) { setItemOptions([]); setItemImageMap({}); return; }
    setClientName(p.clientName || "");
    const names = [...new Set((p.items || []).map((it) => it.productName).filter(Boolean))];
    setItemOptions(names);
    // 품목명 → 사진 매핑을 함께 만들어둔다 — 이미지 필드명이 소스에 따라 다를 수 있어(image/imageUrl/productImg/photo) 전부 순차 탐색해 누락 없이 매핑
    const imageMap = {};
    (p.items || []).forEach((it) => {
      const img = it && (it.image || it.imageUrl || it.productImg || it.photo);
      if (it.productName && img && !imageMap[it.productName]) imageMap[it.productName] = img;
    });
    setItemImageMap(imageMap);
    setProductName(names[0] || "");
    setProductImage(imageMap[names[0]] || (p.image || p.imageUrl || p.photo || ""));
    if (p.employee && p.employee !== "(엑셀자동등록)") setAssignee(p.employee);
  };

  const canSave = clientName.trim() && productName.trim();
  // "🧪 샘플요청 등록" 버튼(발송완료된 제안서 → 4단계로 선택 전환)으로 열렸을 때, 그 제안서를 자동으로 적용
  useEffect(() => {
    if (initialProposalId) applyProposal(String(initialProposalId));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  const save = async () => {
    if (!canSave) return;
    const isCt = sampleType === "ct";
    // CT맞춤제작은 중국 공장에서 새로 제작하는 건이라 한국 본사 재고 차감 개념이 없다 → 재고 선택 검증도 건너뛴다
    if (!isCt && stockLocation === "korea" && !pickedStock) {
      alert("한국 본사 재고에서 출고할 샘플 제품을 선택해 주세요.");
      return;
    }
    if (!isCt && pickedStock && (Number(stockQty) || 0) > (Number(pickedStock.quantity) || 0)) {
      alert(`현재 보유 재고(${pickedStock.quantity}개)를 초과하여 신청할 수 없습니다.`);
      return;
    }
    const usePicked = !isCt && pickedStock;
    await onSave({
      sampleType, // "general" | "ct" — 목록 필터/배지의 기준
      clientName: clientName.trim(), productName: productName.trim(), image: productImage || "", stockLocation: isCt ? "china" : stockLocation, assignee,
      // CT 맞춤샘플은 항공 특송 발송이 원칙이라 등록·CT전환 시점에 배송방식을 "항공"으로 자동 지정한다(목록엔 "항공특송"으로 표기됨)
      status: "요청", requestDate, orderDate: "", stockInDate: "", dispatchDate: "", shippingMethod: isCt ? "항공" : "", notes: "",
      linkedProposalId: linkedProposalId || "",
      ...(isCt ? {
        ctBodyPantone: ctBodyPantone.trim(), ctCapPantone: ctCapPantone.trim(),
        ctPrintSpec: ctPrintSpec.trim(), ctSizeSpec: ctSizeSpec.trim(),
        ctProductionCost: Number(ctProductionCost) || 0, ctExpressCost: Number(ctExpressCost) || 0,
        ctNotes: ctNotes.trim(),
        convertedFromSampleId: preset.convertedFromSampleId || "", // 일반샘플에서 🧪전환으로 만들어진 경우 원본 추적용
      } : {}),
      stockItemId: usePicked ? pickedStock.id : null, // App의 addSample이 이 값을 보고 재고를 신청수량만큼 차감
      stockQty: usePicked ? (Number(stockQty) || 1) : null,
      ...(usePicked ? { invoiceQty: Number(stockQty) || 1 } : {}), // 샘플비 인보이스 기본 수량에도 동일하게 반영(Firestore엔 undefined를 못 넣으므로 조건부로만 포함)
    });
    onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden flex flex-col" style={{ maxHeight: "88vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">🧪 신규 샘플 발송 등록</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3 overflow-y-auto flex-1">
          <Field label="샘플 유형" hint="어떤 단계의 샘플인지 먼저 선택해주세요">
            <div className="flex gap-2">
              {SAMPLE_TYPE_OPTIONS.map((t) => (
                <button
                  key={t} type="button"
                  onClick={() => { setSampleType(t); if (t === "ct") { setStockLocation("china"); setPickedStock(null); } }}
                  className={"flex-1 text-xs px-3 py-2 rounded-lg font-medium border flex items-center justify-center gap-1.5 " +
                    (sampleType === t
                      ? (t === "ct" ? "bg-purple-600 text-white border-purple-600" : "bg-[#1E3A8A] text-white border-[#1E3A8A]")
                      : "border-slate-200 text-slate-600 hover:bg-slate-50")}
                >
                  <span>{sampleType === t ? "●" : "○"}</span>{t === "ct" ? "2차 CT맞춤제작 샘플" : "1차 일반확인 샘플"}
                </button>
              ))}
            </div>
            <p className="text-[11px] text-slate-400 mt-1.5">
              {sampleType === "ct"
                ? "중국 공장에서 새로 제작하는 맞춤 샘플입니다. 한국 본사 재고 차감 없이 중국 발주로 자동 처리됩니다."
                : "이미 보유 중인 규격품을 고객사에 확인용으로 발송하는 건입니다."}
            </p>
          </Field>
          <Field label="📄 발송된 제안서 선택" hint="선택하면 고객사명/요청제품/담당직원이 자동으로 채워집니다">
            <select className={inputCls} value={linkedProposalId} onChange={(e) => applyProposal(e.target.value)}>
              <option value="">(선택 안 함 — 직접 입력)</option>
              {(proposals || []).slice(0, 200).map((p) => <option key={p.id} value={p.id}>{proposalOptionLabel(p)}</option>)}
            </select>
          </Field>
          <Field label="고객사명"><input className={inputCls} value={clientName} onChange={(e) => setClientName(e.target.value)} /></Field>
          <Field label="요청 제품">
            {itemOptions.length > 0 ? (
              <select className={inputCls} value={productName} onChange={(e) => { setProductName(e.target.value); setProductImage(itemImageMap[e.target.value] || ""); }}>
                {itemOptions.map((n) => <option key={n} value={n}>{n}</option>)}
              </select>
            ) : (
              <input className={inputCls} value={productName} onChange={(e) => setProductName(e.target.value)} placeholder="예: 크림용기 50g 화이트" />
            )}
          </Field>
          {sampleType === "general" ? (
            <Field label="재고 위치">
              <div className="flex gap-2">
                <button type="button" onClick={() => setStockLocation("korea")} className={"flex-1 text-xs px-3 py-2 rounded-lg font-medium border " + (stockLocation === "korea" ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "border-slate-200 text-slate-600")}>🇰🇷 한국 본사 재고 있음</button>
                <button type="button" onClick={() => setStockLocation("china")} className={"flex-1 text-xs px-3 py-2 rounded-lg font-medium border " + (stockLocation === "china" ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "border-slate-200 text-slate-600")}>🇨🇳 재고 없음(중국 발주)</button>
              </div>
            </Field>
          ) : (
            <div className="rounded-lg border border-purple-200 bg-purple-50/50 p-4 space-y-3">
              <div className="text-xs font-semibold text-purple-700">🧪 CT 맞춤제작 사양</div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="바디 조색 (팬톤)"><input className={inputCls} value={ctBodyPantone} onChange={(e) => setCtBodyPantone(e.target.value)} placeholder="예: PANTONE 7541 C" /></Field>
                <Field label="캡 조색 (팬톤)"><input className={inputCls} value={ctCapPantone} onChange={(e) => setCtCapPantone(e.target.value)} placeholder="예: PANTONE Black C" /></Field>
              </div>
              <Field label="인쇄 사양" hint="실크 / 박 / 증착 등">
                <input className={inputCls} value={ctPrintSpec} onChange={(e) => setCtPrintSpec(e.target.value)} placeholder="예: 실크 2도(무광 화이트) + 금박 로고" />
              </Field>
              <Field label="맞춤 규격 / 길이">
                <input className={inputCls} value={ctSizeSpec} onChange={(e) => setCtSizeSpec(e.target.value)} placeholder="예: 40파이 × 150ml, 튜브 길이 135mm" />
              </Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="CT 제작 실비 (₩)"><input type="number" className={inputCls} value={ctProductionCost} onChange={(e) => setCtProductionCost(e.target.value)} placeholder="0" /></Field>
                <Field label="특송비 (₩)"><input type="number" className={inputCls} value={ctExpressCost} onChange={(e) => setCtExpressCost(e.target.value)} placeholder="0" /></Field>
              </div>
              {(Number(ctProductionCost) || Number(ctExpressCost)) ? (
                <div className="text-xs text-purple-700 font-semibold">예상 청구 합계: {won((Number(ctProductionCost) || 0) + (Number(ctExpressCost) || 0))}</div>
              ) : null}
              <Field label="기타 요청사항">
                <textarea className={inputCls} rows={2} value={ctNotes} onChange={(e) => setCtNotes(e.target.value)} placeholder="공장 전달용 특이사항을 자유롭게 적어주세요" />
              </Field>
            </div>
          )}
          {sampleType === "general" && stockLocation === "korea" && (
            <div className="space-y-2">
              <div className="flex items-center gap-2">
                <button type="button" onClick={() => setShowStockPicker(true)} className="text-xs px-3 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 font-medium whitespace-nowrap">📦 한국 샘플 재고 현황 보기/선택</button>
                {!pickedStock && <span className="text-xs text-red-500">* 필수 — 출고할 재고를 선택해주세요</span>}
              </div>
              {pickedStock && (
                <div className="flex items-center gap-2">
                  <span className="text-xs text-emerald-600 flex-1">✅ "{pickedStock.productName}" 선택됨 (보유 {pickedStock.quantity}개) — 등록시 재고 차감</span>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 shrink-0">
                    수량
                    <input
                      type="number" min="1" max={pickedStock.quantity} value={stockQty}
                      onChange={(e) => {
                        const v = Number(e.target.value) || 1;
                        if (v > pickedStock.quantity) {
                          alert(`현재 보유 재고(${pickedStock.quantity}개)를 초과하여 신청할 수 없습니다.`);
                          setStockQty(pickedStock.quantity);
                        } else {
                          setStockQty(v < 1 ? 1 : v);
                        }
                      }}
                      className="w-16 px-2 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]"
                    />
                  </label>
                </div>
              )}
            </div>
          )}
          <div className="grid grid-cols-2 gap-3">
            <Field label="담당 직원">
              <select className={inputCls} value={assignee} onChange={(e) => setAssignee(e.target.value)}>
                {assigneeOptions.length === 0 && <option value="">등록된 계정이 없습니다</option>}
                {assigneeOptions.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
              </select>
            </Field>
            <Field label="요청일"><input type="date" className={inputCls} value={requestDate} onChange={(e) => setRequestDate(e.target.value)} /></Field>
          </div>
        </div>
        {showStockPicker && (
          <StockPickerModal stock={sampleStock} productName={productName} onClose={() => setShowStockPicker(false)} onPick={(s, qty) => { setPickedStock(s); setProductName(s.productName); setStockQty(qty); setShowStockPicker(false); }} />
        )}
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} disabled={!canSave} className={"px-5 py-2 rounded-lg text-white text-sm font-medium hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed " + (sampleType === "ct" ? "bg-purple-600" : "bg-[#1E3A8A]")}>{sampleType === "ct" ? "CT샘플 등록" : "등록"}</button>
        </div>
      </div>
    </div>
  );
}

/* 샘플 인보이스(일반/CT 공용) 고객 승인링크 발송 모달
   kind: "sample"(1차 일반샘플) | "ct"(2차 CT 맞춤제작) — 두 안내문은 취지가 완전히 달라 분기한다.
   금액·수량은 모달을 여는 쪽에서 실시간 계산값을 그대로 넘겨받는다(저장 전 값도 문구에 반영). */
function SampleApprovalSendModal({ sample, kind, qty, grandTotal, supplyTotal, expectedDate, onClose }) {
  const isCt = kind === "ct";
  const link = `${window.location.origin}/agree?type=${isCt ? "ct" : "sample"}&id=${sample.id}`;
  const clientName = sample.clientName || "고객사";
  const productName = sample.productName || (isCt ? "CT 샘플 품목" : "요청 샘플 품목");
  /* 청구 금액은 "부가세 별도" 표기에 맞춰 공급가액(supplyTotal)을 쓴다 —
     부가세 포함액(grandTotal)을 넣으면 표기와 금액이 어긋나 고객이 오해한다.
     구버전 호출부가 supplyTotal을 안 넘기면 grandTotal로 폴백. */
  const amount = Number(supplyTotal != null ? supplyTotal : grandTotal) || 0;
  // ⚠️ count는 발송 문구가 아니라 이 모달의 "수량" 요약 표에서 사용한다 — 지우면 렌더 중 ReferenceError로 화면 전체가 빈다
  const count = Number(qty) || 1;

  /* 고객사에 그대로 나가는 표준 문구(대기업 B2B 서식) — 임의로 줄이거나 표현을 바꾸지 말 것.
     ⚠️ 본문의 정식 URL(https://~)은 반드시 "열람 링크 1개"만 유지할 것.
        2개 이상이면 카카오톡이 미리보기 카드(OG 박스)를 만들지 않는다.
        그래서 공식 홈페이지 줄(OFFICIAL_SITE_BLOCK)은 이 템플릿에 넣지 않는다. */
  const message = fitMessageForKakao(
    isCt
    ? `[코스메팩] CT 샘플(맞춤제작) 인보이스 도착 안내\n\n` +
      `안녕하세요, ${clientName} 담당자님.\n` +
      `화장품 용기 제조·공급 파트너 코스메팩입니다.\n\n` +
      `요청하신 CT 맞춤 샘플 제작 인보이스가 발행되었습니다.\n` +
      `아래 전용 링크에서 커스텀 사양과 제작 비용을 확인하실 수 있습니다.\n\n` +
      `─── CT샘플 인보이스 요약 ───\n` +
      `• 제작 품목 : ${shortenForMessage(productName)}\n` +
      `• 청구 금액 : ₩${amount.toLocaleString()} (부가세 별도)\n` +
      `• 열람 기한 : 발행일로부터 30일\n` +
      `──────────────────\n\n` +
      `🔗 CT샘플 인보이스 확인하기:\n${link}\n\n` +
      `※ 확인해 주시면 즉시 현지 제작 공정에 착수합니다.\n\n` +
      `(주)비케이브로 코스메팩 드림`
    : `[코스메팩] 일반 샘플 공급 인보이스 도착 안내\n\n` +
      `안녕하세요, ${clientName} 담당자님.\n` +
      `화장품 용기 제조·공급 파트너 코스메팩입니다.\n\n` +
      `요청하신 일반 샘플 공급 인보이스가 발행되었습니다.\n` +
      `아래 전용 링크에서 샘플 품목과 배송 일정을 확인하실 수 있습니다.\n\n` +
      `─── 샘플 인보이스 요약 ───\n` +
      `• 샘플 품목 : ${shortenForMessage(productName)}\n` +
      `• 청구 금액 : ₩${amount.toLocaleString()} (부가세 별도)\n` +
      `• 열람 기한 : 발행일로부터 30일\n` +
      `──────────────────\n\n` +
      `🔗 샘플 인보이스 확인하기:\n${link}\n\n` +
      `※ 확인 후 링크 화면에서 바로 승인하실 수 있습니다.\n\n` +
      `(주)비케이브로 코스메팩 드림`
  );

  const [copied, setCopied] = useState("");
  const copy = (text, label) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => { setCopied(label); setTimeout(() => setCopied(""), 2000); });
    } else {
      window.prompt("아래 내용을 복사해 주세요.", text);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden flex flex-col" style={{ maxHeight: "88vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">📲 {isCt ? "CT 맞춤샘플" : "일반 샘플"} 인보이스 승인요청 발송</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3 overflow-y-auto flex-1">
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3 text-xs space-y-1">
            <div className="flex justify-between"><span className="text-slate-500">수신 고객사</span><span className="font-semibold text-slate-800">{clientName}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">품목</span><span className="text-right">{productName}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">수량</span><span>{count.toLocaleString()}개</span></div>
            <div className="flex justify-between border-t border-slate-200 pt-1 mt-1"><span className="font-semibold text-slate-700">청구금액</span><span className="font-bold text-[#1E3A8A]">{won(amount)} <span className="font-normal text-slate-400">(부가세 포함)</span></span></div>
          </div>

          <Field label="승인 링크">
            <div className="flex gap-2">
              <input readOnly value={link} className={inputCls + " flex-1"} onFocus={(e) => e.target.select()} />
              <button onClick={() => copy(link, "link")} className="px-3 py-2 rounded-lg bg-[#1E3A8A] text-white text-xs font-semibold whitespace-nowrap">{copied === "link" ? "✅ 복사됨" : "링크 복사"}</button>
            </div>
          </Field>

          <Field label="안내 문구 (카톡·문자 붙여넣기용)">
            <textarea readOnly rows={16} value={message} className="w-full text-xs p-2.5 border border-slate-200 rounded-lg resize-y bg-slate-50" onFocus={(e) => e.target.select()} />
          </Field>

          <button onClick={() => copy(message, "msg")} className="w-full px-3 py-2.5 rounded-lg bg-amber-400 text-slate-900 text-sm font-bold">{copied === "msg" ? "✅ 복사되었습니다" : "💬 안내 문구 전체 복사"}</button>
          <p className="text-[11px] text-slate-400">복사한 문구를 카카오톡·문자에 붙여넣어 보내주세요.</p>
        </div>
      </div>
    </div>
  );
}

function SampleInvoiceModal({ sample, products, proposals, sampleStock, onDecrementStock, supplierLogo, shippingFees, shippingFeeNotes, onUpdate, onClose, readOnly, publicView }) {
  /* publicView = 고객용 승인 페이지에서 띄운 경우. 모달 오버레이·관리자 툴바·좌측 편집폼을 전부 걷어내고
     A4 인보이스 용지만 단독으로 렌더링한다(고객에게 편집 UI가 노출되면 안 되기 때문). */
  const fees = shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES;
  const matchedProduct = (products || []).find((p) => p.name === sample.productName);
  // 제품DB에 사진이 없으면, 이 샘플에 연결된 제안서의 품목 사진을 대신 끌어온다(제안서에 실제로 첨부됐던 사진이라 더 정확한 경우가 많음)
  const linkedProposal = (proposals || []).find((p) => String(p.id) === String(sample.linkedProposalId));
  const proposalItem = linkedProposal && (linkedProposal.items || []).find((it) => it.productName === sample.productName);
  const proposalFirstItem = linkedProposal && (linkedProposal.items || [])[0];
  // 이미지가 저장된 필드명이 데이터 소스에 따라 다를 수 있어(image/imageUrl/productImg/photo 등) 전부 순차 탐색한다.
  const pickImg = (obj) => (obj && (obj.image || obj.imageUrl || obj.productImg || obj.photo)) || "";
  const fallbackImage = pickImg(sample) || pickImg(matchedProduct) || pickImg(proposalItem) || pickImg(proposalFirstItem) || pickImg(linkedProposal);
  // 예전에 "💾 수정후 저장"으로 저장해둔 내용(invoiceDraft)이 있으면 그걸 최우선으로 복원 — 다시 열었을 때 수정한 그대로 이어서 볼 수 있다.
  const draft = sample.invoiceDraft || {};
  const [clientName, setClientName] = useState(draft.clientName || sample.clientName || "");
  const [writeDate, setWriteDate] = useState(draft.writeDate || todayStr());
  const [productImage, setProductImage] = useState(draft.productImage || fallbackImage);
  // 모달이 열린 시점엔 제안서 목록이 아직 로딩 전이었거나, 처음엔 사진이 없다가 뒤늦게 원본 제안서 사진을 찾게 되는 경우까지 대비해
  // productImage가 여전히 비어있는 동안은 계속 폴백 탐색 결과를 반영한다(사용자가 직접 사진을 지우거나 새로 올리면 그 순간부터는 더 이상 덮어쓰지 않음).
  useEffect(() => {
    if (!productImage && fallbackImage) {
      setProductImage(fallbackImage);
      if (onUpdate && !sample.image) onUpdate(sample, { image: fallbackImage }); // 근본 복원: 다음부턴 이 탐색 없이도 sample.image로 바로 뜨도록 원본에 저장해둔다
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fallbackImage]);
  const [productName, setProductName] = useState(draft.productName || sample.productName || "");
  const [spec, setSpec] = useState(draft.spec || (matchedProduct && matchedProduct.specSize) || (proposalItem && proposalItem.specSize) || "");
  const [qty, setQty] = useState(draft.qty || sample.invoiceQty || 1);
  const [unitPrice, setUnitPrice] = useState(draft.unitPrice != null ? draft.unitPrice : (matchedProduct && matchedProduct.lastUnitPrice) || 0);
  const [shippingRmbFee, setShippingRmbFee] = useState(draft.shippingRmbFee || 0);
  const [domesticMethod, setDomesticMethod] = useState(draft.domesticMethod || sample.shippingMethod || "일반");
  const [receiveAddress, setReceiveAddress] = useState(draft.receiveAddress || sample.receiveAddress || "");
  const [dispatchDate, setDispatchDate] = useState(draft.dispatchDate || sample.dispatchDate || ""); // <input type="date"> 값(YYYY-MM-DD)
  const [receiveDate, setReceiveDate] = useState(draft.receiveDate || "");
  const feeNotes = shippingFeeNotes || DEFAULT_SAMPLE_SHIPPING_FEE_NOTES;
  // No.3 배송비 항목의 "비고" — 배송방식(일반/항공)에 설정된 안내문구가 기본값으로 자동 채워지고, 직접 수정도 가능
  const [domesticRemark, setDomesticRemark] = useState(draft.domesticRemark != null ? draft.domesticRemark : (feeNotes[draft.domesticMethod || sample.shippingMethod || "일반"] || ""));
  const changeDomesticMethod = (m) => { setDomesticMethod(m); setDomesticRemark(feeNotes[m] || ""); };
  // 발송 출처(한국재고 / 중국공장) — 한국재고 발송이면 중국 내 운송료가 발생하지 않으므로 0원 처리하고, 안내 문구도 국내 택배 수령 조건으로 바꿔준다.
  const [shipSource, setShipSource] = useState(draft.shipSource || sample.stockLocation || "china");
  const SHIP_SOURCE_NOTICE = {
    china: "◎ 귀사가 요청하신 샘플비 및 운송료에 대하여, 다음과 같이 제품 인보이스를 보내드립니다.",
    korea: "◎ 한국 본사 재고에서 즉시 발송되는 건으로, 별도의 중국 내 운송료 없이 국내 택배로 바로 수령하실 수 있습니다.",
  };
  const changeShipSource = (src) => {
    setShipSource(src);
    if (src === "korea") setShippingRmbFee(0);
    setGreetingLines((prev) => prev.map((line, i) => (i === 1 ? SHIP_SOURCE_NOTICE[src] : line)));
  };
  // 우측 미리보기의 인사말/하단 안내문구는 클릭해서 직접 수정 가능(contentEditable) — 수정한 내용이 엑셀 다운로드에도 그대로 반영됨
  const [greetingLines, setGreetingLines] = useState(draft.greetingLines || [
    "◎ 귀사의 무궁한 발전을 진심으로 기원합니다.",
    "◎ 귀사가 요청하신 샘플비 및 운송료에 대하여, 다음과 같이 제품 인보이스를 보내드립니다.",
    "◎ 샘플준비는 비용과 시간이 소요됩니다. \n    하지만, 최근 실제 주문과는 무관하게 단순하게 제품비교 및 단순 보유를 위해서 샘플만 요청하시는 사례가 발생하고 있습니다. \n    이로 인해 정작 샘플이 꼭 필요하고 받아야하는 고객분들께서 제 때 샘플을 받아보지 못하여 피해를 보는 사례가 생기고 있어, \n    이런 이유로 부득이하게, 샘플비용과 중국 내 운송료 및 택배비는 고객님께서 부담드리는 점 너그러이 양해 부탁드립니다. \n    청구된 샘플비용은 주문시에 차감하여드립니다.",
    "◎ 사업자등록증 사본과 이메일주소를 보내주시면, 세금계산서 발행을 하여드립니다.",
    "◎ 입금을 확인한 후에 샘플이 발송되며, 택배번호는 발송일 다음날 나옵니다. 번호 나오면 보내드립니다.",
  ]);
  const [footerExtraLines, setFooterExtraLines] = useState(draft.footerExtraLines || [
    "4. 당사에 의뢰하여 주시면, 최선을 다하겠습니다.",
    "5. 사업자등록증 사본과 이메일 주소를 보내주시면 세금계산서를 발행하여 드립니다.",
  ]);
  const updateGreeting = (i, text) => setGreetingLines((prev) => prev.map((v, idx) => (idx === i ? text : v)));
  const updateFooter = (i, text) => setFooterExtraLines((prev) => prev.map((v, idx) => (idx === i ? text : v)));

  const dispatchDateText = formatKoreanDate(dispatchDate);
  const receiveDateText = formatKoreanDate(receiveDate);
  const domesticFee = fees[domesticMethod] || fees["일반"];
  const productAmt = (Number(qty) || 0) * (Number(unitPrice) || 0);
  const shippingAmt = Number(shippingRmbFee) || 0;
  const supplyTotal = productAmt + shippingAmt + domesticFee;
  const vat = Math.round(supplyTotal * 0.1);
  const grandTotal = supplyTotal + vat;

  const data = { clientName, writeDate, productImage, productName, spec, qty, unitPrice, shippingRmbFee, domesticMethod, domesticRemark, receiveAddress, dispatchDateText, receiveDateText, greetingLines, footerExtraLines, shippingFees: fees };

  // 좌측 입력값 + 미리보기에서 직접 고친 문구(인사말/하단안내)까지 전부 샘플 레코드에 저장 — 인쇄/PDF 저장이나 엑셀 다운로드를 누를 때 자동으로 함께 저장되며,
  // 다음에 다시 열거나 엑셀/PDF로 출력할 때도 이 수정본이 그대로 반영된다. 청구금액/수령주소/수량은 목록 리스트 컬럼에도 바로 쓰인다.
  const persistToSample = () => {
    if (!onUpdate || readOnly) return; // 조회 전용 모드에서는 어떤 저장도 발생하지 않는다
    const invoiceDraft = { clientName, writeDate, productImage, productName, spec, qty: Number(qty) || 0, unitPrice: Number(unitPrice) || 0, shippingRmbFee: Number(shippingRmbFee) || 0, domesticMethod, domesticRemark, receiveAddress, dispatchDate, receiveDate, greetingLines, footerExtraLines, shipSource };
    onUpdate(sample, { invoiceAmount: grandTotal, receiveAddress, invoiceQty: Number(qty) || 0, invoiceDraft, stockLocation: shipSource });
  };
  const [savedFlash, setSavedFlash] = useState(false);
  const handleSaveClick = () => {
    persistToSample();
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 2000);

  const [showApprovalSend, setShowApprovalSend] = useState(false); // 📲 고객 승인링크 발송 모달
  const [showSendModal, setShowSendModal] = useState(false);
  const sendComplete = (channel) => {
    // 발송완료 처리시 고객확인 자동체크 + 진행단계도 "발송"으로 전환하며 담당자·일시를 statusLogs에 기록
    if (onUpdate) onUpdate(sample, { ...buildSampleStatusPatch(sample, "발송", sample.assignee || ""), sentBy: sample.assignee || "", sentAt: nowDateTimeStr(), sentChannel: channel, customerConfirmed: true });

  const [showStockPicker, setShowStockPicker] = useState(false);
  // 재고에서 실제로 출고 선택한 항목(안내 표시용) — 이 인보이스 건에 이미 저장돼있는 배정 이력(allocatedStockId)이 있으면 그 재고항목을 찾아 복원한다.
  const [stockPicked, setStockPicked] = useState(() => (sample.allocatedStockId && sampleStock ? (sampleStock.find((s) => s.id === sample.allocatedStockId) || null) : null));
  // 재고를 다시 선택/수정할 때마다: ①이 인보이스 건이 예전에 차감해둔 수량(allocatedStockQty)이 있으면 먼저 그만큼 재고를 원상복구(롤백)하고,
  // ②그 다음 이번에 새로 고른 수량만 딱 1번 차감한다 — 그래야 "2개→3개로 수정" 같은 재수정 시 5개가 아니라 3개만 차감된 상태로 유지된다.
  const pickStockForInvoice = (s, pickedQty) => {
    const prevStockId = sample.allocatedStockId;
    const prevQty = Number(sample.allocatedStockQty) || 0;
    if (onDecrementStock && prevStockId && prevQty > 0) {
      onDecrementStock(prevStockId, -prevQty); // 롤백: 이전 배정분을 원래 재고 수량으로 되돌림(음수 차감 = 복원)
    }
    if (onDecrementStock) onDecrementStock(s.id, pickedQty); // 복원된 실제 재고를 기준으로 이번 수량만 1회 차감
    setQty(pickedQty); // 주문수량(및 인보이스 본문 수량 셀)에 즉시 반영 — supplyTotal/vat/grandTotal이 qty에 의존하므로 총 청구금액도 자동 재계산됨
    setStockPicked(s);
    setShowStockPicker(false);
    if (onUpdate) onUpdate(sample, { allocatedStockId: s.id, allocatedStockQty: pickedQty }); // 다음 재선택시 롤백 기준으로 쓸 배정 이력을 이 인보이스 건에 영구 저장
  };

  return (

      <div className={"no-print items-center justify-between gap-2 mb-3 mx-auto " + (publicView ? "hidden" : "flex")} style={{ width: "97vw", maxWidth: "1420px" }} onClick={(e) => e.stopPropagation()}>

          {sample.sentBy ? (
            <span className="bg-emerald-600 text-white text-xs px-3 py-1 rounded-md font-semibold whitespace-nowrap" title={`발송 채널: ${sample.sentChannel || "-"}`}>

          ) : (

              ✅ 고객승인 ({getSampleApproval(sample).at || "승인일시"})
            </span>
          )}
          <button onClick={onClose} className="px-4 py-2 rounded-lg bg-white text-slate-600 text-sm font-medium hover:bg-slate-50">닫기</button>
          {onUpdate && !readOnly && (
            <button onClick={handleSaveClick} className="px-4 py-2 rounded-lg bg-white border border-emerald-300 text-emerald-700 text-sm font-medium hover:bg-emerald-50 whitespace-nowrap">{savedFlash ? "✅ 저장되었습니다" : "💾 저장"}</button>
          )}
          <button onClick={() => setShowApprovalSend(true)} className="px-4 py-2 rounded-lg bg-teal-600 text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">📲 고객 승인링크</button>

        </div>
      </div>

      )}
      {showSendModal && (
        <SendCompleteModal onClose={() => setShowSendModal(false)} onConfirm={sendComplete} />
      )}
      {showApprovalSend && (
        <SampleApprovalSendModal sample={sample} kind="sample" qty={qty} grandTotal={grandTotal} supplyTotal={supplyTotal} onClose={() => setShowApprovalSend(false)} />
      )}
      {showStockPicker && (
        <StockPickerModal stock={sampleStock} productName={productName} onClose={() => setShowStockPicker(false)} onPick={pickStockForInvoice} />
      )}
      <div className={"bg-white overflow-hidden flex flex-col mx-auto " + (publicView ? "w-full" : "rounded-xl w-full")}
        style={publicView ? undefined : { width: "97vw", maxWidth: "1420px", height: "88vh" }} onClick={(e) => e.stopPropagation()}>
        <div className={publicView ? "" : "flex-1 overflow-y-auto grid grid-cols-1 lg:grid-cols-[320px_1fr]"}>
          {/* 좌측: 편집 폼 — 고객용(publicView)에서는 통째로 렌더링하지 않는다 */}
          {!publicView && (
          <fieldset disabled={readOnly} className="p-5 border-r border-slate-100 space-y-2.5 overflow-y-auto" style={{ border: 0 }}>
            <Field label="진행상태">

              </select>
            </Field>
            <Field label="발송 출처">
              <div className="flex gap-2">
                <button type="button" onClick={() => changeShipSource("korea")} className={"flex-1 text-xs px-2 py-2 rounded-lg font-medium border " + (shipSource === "korea" ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "border-slate-200 text-slate-600")}>🇰🇷 한국재고 발송</button>
                <button type="button" onClick={() => changeShipSource("china")} className={"flex-1 text-xs px-2 py-2 rounded-lg font-medium border " + (shipSource === "china" ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "border-slate-200 text-slate-600")}>🇨🇳 중국공장 발송</button>

/* ===================== CT 맞춤샘플 전용 인보이스 (CT CUSTOM SAMPLE INVOICE) =====================
   sampleType === "ct" 인 건에서만 열린다. 일반 SAMPLE INVOICE(SampleInvoiceModal)와는
   상단 안내문(페이백 혜택 고지)·품목표 컬럼(규격 및 사양)·하단 참고사항(CT 필수 테스트 고지)이 모두 다르므로
   같은 컴포넌트에 분기를 넣지 않고 별도 컴포넌트로 분리했다. 인쇄는 기존과 동일하게
   #sample-invoice-print id를 그대로 재사용하므로 @media print 규칙을 새로 추가할 필요가 없다. */
const CT_GREETING_LINES = [
  "◎ 귀사의 무궁한 발전을 진심으로 기원합니다.",
  "◎ 귀사가 요청하신 본품 양산 대비용 '맞춤형 CT(내용물 적합성 테스트) 샘플' 제작에 대한 인보이스를 보내드립니다.",
  "◎ [CT 샘플 제작 안내 및 페이백(Pay-back) 혜택]",
  // ↑제목줄과 분리된 본문 — "◎"로 시작하지 않는 줄은 렌더링시 자동으로 pl-5 들여쓰기가 적용된다
  "본 CT 샘플은 단순 기성품 발송이 아니며, 완벽한 본품 양산을 위해 중국 현지 공장에서 본품과 100% 동일한 원료 비율 및 후가공(조색/인쇄 등) 맞춤 스펙으로 별도 생산 투입됩니다. 이에 따라 초기 맞춤 제작 실비가 청구됩니다.\n단, 결제하신 CT 샘플 제작비용은 향후 해당 품목의 '본품 양산 발주(기본 MOQ 이상)' 진행 시, 총 발주 대금에서 100% 전액 차감(페이백) 처리되어 결과적으로 무상 제공됩니다.",
  "◎ 사업자등록증 사본과 이메일주소를 보내주시면, 세금계산서 발행을 하여드립니다.",
  "◎ 입금 확인 후 즉시 중국 현지 공장에 샘플 제작이 발주(투입)됩니다.",
];
const CT_FOOTER_LINES = [
  "1. 예상 제작 일정 : 입금 확인 및 최종 사양(조색 팬톤 번호, 인쇄 AI 파일) 확정일로부터 약 15일 소요됩니다.",
  "2. 배송 소요 기간 : 제작 완료 및 현지 개별 전수 검품(QC) 완료 직후 항공 특송 발송 (약 2~3일 소요)",
  "3. 내용물 적합성(CT) 필수 테스트 고지:\n    - 샘플 수령 후 실제 내용물 충진을 통한 누유, 토출감, 제형 화학 반응 여부를 반드시 자체 테스트해 주시기 바랍니다.\n    - 사전 적합성 테스트 미진행 또는 임의 승인으로 인해 양산 후 발생하는 제형 반응 문제에 대해서는 당사의 귀책 사유로 인정되지 않습니다.",
  "4. 본 인보이스의 유효기간은 발행일로부터 30일입니다.",
  "5. 당사에 의뢰하여 주시면, 최고의 품질과 서비스로 최선을 다하겠습니다.",
];

// CT 사양 필드들(팬톤/인쇄/규격)을 인보이스 "규격 및 사양" 칸에 들어갈 한 덩어리 문구로 조립
function buildCtSpecText(s) {
  if (!s) return "";
  const parts = [];
  if (s.ctSizeSpec) parts.push(s.ctSizeSpec);
  if (s.ctBodyPantone) parts.push(`바디 조색: ${s.ctBodyPantone}`);
  if (s.ctCapPantone) parts.push(`캡 조색: ${s.ctCapPantone}`);
  if (s.ctPrintSpec) parts.push(`인쇄: ${s.ctPrintSpec}`);
  return parts.join("\n");
}

function CtSampleInvoiceModal({ sample, products, proposals, supplierLogo, onUpdate, onClose, readOnly, publicView }) {
  // publicView: 고객용 승인 페이지 전용 — 오버레이/툴바/좌측 편집폼 없이 A4 용지만 단독 렌더링

  const matchedProduct = (products || []).find((p) => p.name === sample.productName);
  const linkedProposal = (proposals || []).find((p) => String(p.id) === String(sample.linkedProposalId));
  const proposalItem = linkedProposal && (linkedProposal.items || []).find((it) => it.productName === sample.productName);
  const pickImg = (obj) => (obj && (obj.image || obj.imageUrl || obj.productImg || obj.photo)) || "";
  const fallbackImage = pickImg(sample) || pickImg(matchedProduct) || pickImg(proposalItem) || pickImg(linkedProposal);
  const draft = sample.ctInvoiceDraft || {}; // 일반 인보이스(invoiceDraft)와 저장 키를 분리 — 서로 덮어쓰지 않게

  const [clientName, setClientName] = useState(draft.clientName || sample.clientName || "");
  // todayStr()은 "20260815"처럼 대시가 없어 <input type="date">가 값을 못 읽는다 → 대시 형식(todayDisplay)을 써야 달력에 정상 표시됨
  const [writeDate, setWriteDate] = useState(draft.writeDate || todayDisplay());
  // 예상 제작완료일자 — 작성일자 +15일이 기본값(하단 참고사항의 "약 15일 소요"와 동일 기준), 달력으로 직접 수정 가능
  const [completionDate, setCompletionDate] = useState(draft.completionDate || addDaysFrom(draft.writeDate || todayDisplay(), 15));
  const [completionTouched, setCompletionTouched] = useState(!!draft.completionDate); // 직접 고친 적 있으면 작성일자 변경시 자동 재계산하지 않음
  // 작성일자를 바꾸면 완료일자도 따라 +15일로 재계산(단, 사용자가 완료일자를 직접 건드렸으면 그 값을 그대로 존중)
  const changeWriteDate = (v) => {
    setWriteDate(v);
    if (!completionTouched) setCompletionDate(addDaysFrom(v, 15));
  };
  const [productImage, setProductImage] = useState(draft.productImage || fallbackImage);
  const [productName, setProductName] = useState(draft.productName || sample.productName || "");
  const [spec, setSpec] = useState(draft.spec != null ? draft.spec : buildCtSpecText(sample));
  const [qty, setQty] = useState(draft.qty || sample.invoiceQty || 1);
  // CT 제작 실비 / 항공 특송비 — 등록 모달에서 입력한 값이 기본으로 채워지고 여기서 다시 조정 가능
  const [unitPrice, setUnitPrice] = useState(draft.unitPrice != null ? draft.unitPrice : (Number(sample.ctProductionCost) || 0));
  const [expressFee, setExpressFee] = useState(draft.expressFee != null ? draft.expressFee : (Number(sample.ctExpressCost) || 0));
  // 제품 행의 "비고"는 더 이상 자유입력이 아니라 예상 제작완료일자에서 자동 생성된다(날짜 미지정시 안내문구로 폴백)
  // CT는 수량에 비례하는 단가 개념이 아니라 "건당 맞춤 제작 실비(고정 총액)"로 청구된다 → 곱셈 없이 입력값을 그대로 금액으로 사용
  const [customNote, setCustomNote] = useState(draft.customNote != null ? draft.customNote : ""); // 좌측 폼의 자유 메모 — 비고 셀 윗줄에 노출
  const expectedText = completionDate ? `예상완료: ${completionDate}` : "예상완료: 입금 후 약 15일";
  const [expressRemark, setExpressRemark] = useState(draft.expressRemark != null ? draft.expressRemark : "항공 특송");
  const [greetingLines, setGreetingLines] = useState(draft.greetingLines || CT_GREETING_LINES);
  const [footerLines, setFooterLines] = useState(draft.footerLines || CT_FOOTER_LINES);
  const [savedFlash, setSavedFlash] = useState(false);

  // 모달이 열린 뒤 뒤늦게 제안서/제품 사진을 찾은 경우까지 반영(사용자가 직접 지우면 더 이상 덮어쓰지 않음)
  useEffect(() => {
    if (!productImage && fallbackImage) setProductImage(fallbackImage);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fallbackImage]);

  const productAmt = Number(unitPrice) || 0; // ⚠️ 수량을 곱하지 않는다(맞춤 제작 실비 총액 그대로)
  // "단가(ea)" 칸에는 총액을 수량으로 나눈 환산 단가를 참고용으로 표기(수량 0/1이면 의미 없으므로 "-")
  const unitConverted = (Number(qty) || 0) > 1 ? productAmt / Number(qty) : null;
  const supplyTotal = productAmt + (Number(expressFee) || 0);
  const vat = Math.round(supplyTotal * 0.1);
  const grandTotal = supplyTotal + vat;

  const updateGreeting = (i, text) => setGreetingLines((prev) => prev.map((v, idx) => (idx === i ? text : v)));
  const updateFooter = (i, text) => setFooterLines((prev) => prev.map((v, idx) => (idx === i ? text : v)));

  // 좌측 입력값 + 미리보기에서 고친 문구를 전부 샘플 레코드에 저장 — 인쇄/저장시 자동 호출
  const persistToSample = () => {
    if (!onUpdate || readOnly) return;
    onUpdate(sample, {
      invoiceQty: Number(qty) || 1,
      invoiceAmount: grandTotal, // 목록의 "청구금액" 열에 그대로 반영됨
      ctInvoiceDraft: {
        clientName, writeDate, productImage, productName, spec,
        qty: Number(qty) || 1, unitPrice: Number(unitPrice) || 0, expressFee: Number(expressFee) || 0,
        completionDate, customNote, expressRemark, greetingLines, footerLines,
      },
    });
  };
  const handleSaveClick = () => {
    persistToSample();
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 2000);
  };
  // 🚀 발송완료 — 일반 인보이스(SampleInvoiceModal)의 sendComplete와 같은 패치에 진행단계(status)까지 함께 갱신한다.
  // SAMPLE_STATUS_LABELS["발송"]이 곧 "발송완료"이므로, 진행단계 값으로는 "발송"을 넣는 것이 이 시스템의 정식 표기다.
  const [showApprovalSend, setShowApprovalSend] = useState(false); // 📲 고객 승인링크 발송 모달
  const [showSendModal, setShowSendModal] = useState(false);
  const sendComplete = (channel) => {
    if (onUpdate) onUpdate(sample, {
      ...buildSampleStatusPatch(sample, "발송", sample.assignee || ""), // status + statusLogs(담당자·일시) 동시 기록
      sentBy: sample.assignee || "",
      sentAt: nowDateTimeStr(),
      sentChannel: channel,
      customerConfirmed: true, // 발송완료시 목록의 "고객확인"도 자동 체크(일반 인보이스와 동일 동작)
    });
    setShowSendModal(false);
  };

  return (
    <div className={publicView ? "w-full" : "fixed inset-0 bg-black/50 z-50 overflow-y-auto py-8 px-4"} onClick={publicView ? undefined : onClose}>
      {/* 상단 툴바 — 일반 인보이스/제안서 미리보기와 동일 구조: 좌측 조회·편집 배너, 우측 [상태배지][닫기][저장][인쇄][발송완료] */}
      <div className={"no-print items-center justify-between gap-2 mb-3 mx-auto " + (publicView ? "hidden" : "flex")} style={{ width: "97vw", maxWidth: "1420px" }} onClick={(e) => e.stopPropagation()}>
        <span className="text-xs text-white/90 bg-black/30 px-3 py-1.5 rounded-lg">
          {readOnly ? "🔒 조회 전용 — 수정할 수 없습니다" : "✏️ CT 맞춤샘플 인보이스 — 텍스트를 클릭하면 바로 수정할 수 있습니다"}
        </span>
        <div className="flex items-center gap-2">
          {sample.sentBy ? (
            <span className="bg-emerald-600 text-white text-xs px-3 py-1 rounded-md font-semibold whitespace-nowrap" title={`발송 채널: ${sample.sentChannel || "-"}`}>
              🚀 발송완료 ({sample.sentAt || "일자"})
            </span>
          ) : (
            <span className="text-xs px-3 py-1 rounded-md bg-slate-100 text-slate-500 font-semibold whitespace-nowrap">[미발송]</span>
          )}
          {/* 고객이 승인링크에서 최종 승인하면 발송 배지 옆에 승인일시가 함께 뜬다 */}
          {getSampleApproval(sample).approved && (
            <span className="bg-blue-600 text-white text-xs px-3 py-1 rounded-md font-semibold whitespace-nowrap">
              ✅ 고객승인 ({getSampleApproval(sample).at || "승인일시"})
            </span>
          )}
          <button onClick={onClose} className="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">닫기</button>
          {onUpdate && !readOnly && (
            <button onClick={handleSaveClick} className="bg-white hover:bg-slate-50 text-indigo-700 border border-indigo-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">{savedFlash ? "✅ 저장되었습니다" : "💾 저장"}</button>
          )}
          <button onClick={() => setShowApprovalSend(true)} className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 whitespace-nowrap">📲 고객 승인링크</button>
          <button onClick={() => { persistToSample(); window.print(); }} className="bg-blue-900 hover:bg-blue-950 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 whitespace-nowrap">🖨️ 인쇄 / PDF로 저장</button>
          {onUpdate && (
            <button onClick={() => setShowSendModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 whitespace-nowrap">🚀 발송완료</button>
          )}
        </div>
      </div>
      {showSendModal && (
        <SendCompleteModal onClose={() => setShowSendModal(false)} onConfirm={sendComplete} />
      )}
      {showApprovalSend && (
        <SampleApprovalSendModal sample={sample} kind="ct" qty={qty} grandTotal={grandTotal} supplyTotal={supplyTotal} expectedDate={completionDate} onClose={() => setShowApprovalSend(false)} />
      )}
      {savedFlash && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[80] bg-emerald-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg shadow-lg no-print">✅ 성공적으로 저장되었습니다.</div>
      )}

      <div className={"bg-white mx-auto overflow-hidden " + (publicView ? "w-full" : "rounded-xl")}
        style={publicView ? undefined : { width: "97vw", maxWidth: "1420px" }} onClick={(e) => e.stopPropagation()}>
        <div className={publicView ? "" : "grid items-start"} style={publicView ? undefined : { gridTemplateColumns: "340px 1fr" }}>
          {/* 좌측: 입력폼 — 고객용(publicView)에서는 렌더링하지 않는다 */}
          {!publicView && (
          <fieldset disabled={readOnly} className="p-5 border-r border-slate-200 overflow-y-auto max-h-[calc(100vh-120px)] pr-2 no-print" style={{ minHeight: 0 }}>
            <div className="text-sm font-bold text-slate-800 mb-3">🧪 CT 샘플 인보이스 입력</div>
            <Field label="고객사명"><input className={inputCls} value={clientName} onChange={(e) => setClientName(e.target.value)} /></Field>
            <Field label="작성일자"><input type="date" className={inputCls} value={writeDate} onChange={(e) => changeWriteDate(e.target.value)} /></Field>
            <Field label="예상 제작완료일자" hint="작성일자 +15일이 기본값입니다">
              <input type="date" className={inputCls} value={completionDate} onChange={(e) => { setCompletionDate(e.target.value); setCompletionTouched(true); }} />
            </Field>
            <Field label="📷 제품 사진"><ImageUpload value={productImage} onChange={setProductImage} /></Field>
            <Field label="제품명"><input className={inputCls} value={productName} onChange={(e) => setProductName(e.target.value)} /></Field>
            <Field label="규격 및 사양" hint="CT 등록시 입력한 팬톤·인쇄·규격이 자동으로 채워집니다">
              <textarea className={inputCls} rows={4} value={spec} onChange={(e) => setSpec(e.target.value)} />
            </Field>
            <Field label="비고 (추가 메모)" hint="인보이스 테이블의 비고란(예상완료일자 위)에 표기됩니다">
              <textarea rows="2" className={inputCls} value={customNote} onChange={(e) => setCustomNote(e.target.value)} placeholder="예: 조색 확정 후 제작 착수" />
            </Field>
            <div className="grid grid-cols-2 gap-2">
              <Field label="주문수량"><input type="number" min="1" className={inputCls} value={qty} onChange={(e) => setQty(Number(e.target.value) || 1)} /></Field>
              <Field label="CT 제작 실비(총액)" hint="수량을 곱하지 않고 그대로 청구됩니다">
                <input type="number" className={inputCls} value={unitPrice} onChange={(e) => setUnitPrice(Number(e.target.value) || 0)} />
              </Field>
            </div>
            <Field label="항공 특송비"><input type="number" className={inputCls} value={expressFee} onChange={(e) => setExpressFee(Number(e.target.value) || 0)} /></Field>
            <Field label="특송비 비고"><input className={inputCls} value={expressRemark} onChange={(e) => setExpressRemark(e.target.value)} /></Field>
            <div className="rounded-lg bg-purple-50 border border-purple-200 p-3 text-xs space-y-1">
              <div className="flex justify-between"><span className="text-slate-500">공급가액</span><span className="font-semibold">{won(supplyTotal)}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">부가가치세(10%)</span><span>{won(vat)}</span></div>
              <div className="flex justify-between border-t border-purple-200 pt-1 mt-1"><span className="font-semibold text-purple-700">총 합계금액</span><span className="font-bold text-purple-700">{won(grandTotal)}</span></div>
            </div>
            <p className="text-[11px] text-slate-400 pt-2">💡 우측 미리보기의 인사말·참고사항은 텍스트를 클릭하면 직접 고쳐 쓸 수 있습니다.</p>
          </fieldset>
          )}

          {/* 우측: 엑셀 표준서식과 동일한 레이아웃의 미리보기(화면 표시 + 인쇄시 그대로 출력) */}
          <div className={publicView ? "flex justify-center" : "p-5 overflow-y-auto max-h-[calc(100vh-120px)] pr-2 bg-slate-50"}
            style={publicView ? undefined : { minHeight: 0 }}>
            {/* publicView(고객 승인화면)에서는 좌측 컬럼 폭에 맞춰 용지가 줄어들 수 있어야 한다.
                210mm(≈794px) 고정이면 좁은 화면·2열 구도에서 오른쪽이 잘린다. 인쇄시엔 @page가 A4를 잡아준다. */}
            <div id="sample-invoice-print" className={"bg-white mx-auto p-7 text-[12px] " + (publicView ? "shadow-lg border border-slate-200" : "")}
              style={publicView
                ? { width: "100%", maxWidth: "210mm", minHeight: "297mm", color: "#111827", lineHeight: 1.7 }
                : { width: "210mm", minHeight: "297mm", color: "#111827", lineHeight: 1.7 }}>
              <div className="grid grid-cols-2 gap-4 mb-4">
                <div>
                  <div className="text-xl font-bold tracking-wider mb-3">CT CUSTOM SAMPLE INVOICE</div>
                  <div className="mb-1.5">{clientName} <span className="ml-1">貴下</span></div>
                  <div className="mb-1.5">청구금액 : <b>{won(grandTotal)}</b> <span className="text-slate-400">(부가세 포함)</span></div>
                  <div>작성일자 : {writeDate} <span className="text-slate-400">(유효기간:30일)</span></div>
                  {sample.sentAt && <div>발송일자 : {sample.sentAt}</div>}
                  {/* 고객이 승인한 건만 인쇄물에도 승인일자가 함께 찍힌다 */}
                  {getSampleApproval(sample).approved && (
                    <div className="font-semibold" style={{ color: "#1D4ED8" }}>고객승인일자 : {getSampleApproval(sample).at || "-"}</div>
                  )}
                </div>
                <div>
                  <div className="flex justify-end mb-2"><img src={supplierLogo || DEFAULT_LOGO} className="h-10 object-contain" alt="㈜비케이브로" /></div>
                  <table className="border border-slate-300 text-[11px] w-full" style={{ borderCollapse: "collapse" }}>
                    <tbody>
                      <tr><td className="border border-slate-300 px-2 py-1.5 bg-slate-50 font-semibold" rowSpan={6}>공급자</td><td className="border border-slate-300 px-2 py-1.5 bg-slate-50">사업자NO</td><td className="border border-slate-300 px-2 py-1.5" colSpan={2}>452-81-02979</td></tr>
                      <tr><td className="border border-slate-300 px-2 py-1.5 bg-slate-50">업체명</td><td className="border border-slate-300 px-2 py-1.5">㈜ 비케이브로</td><td className="border border-slate-300 px-1 py-1.5 bg-slate-50">대표 백상선 (인)</td></tr>
                      <tr><td className="border border-slate-300 px-2 py-1.5 bg-slate-50">주소</td><td className="border border-slate-300 px-2 py-1.5" colSpan={2}>경기도 고양시 일산동구 문봉길 44-75</td></tr>
                      <tr><td className="border border-slate-300 px-2 py-1.5 bg-slate-50">업태</td><td className="border border-slate-300 px-2 py-1.5">도매업</td><td className="border border-slate-300 px-1 py-1.5 bg-slate-50">종목 기타무역</td></tr>
                      <tr><td className="border border-slate-300 px-2 py-1.5 bg-slate-50">전화</td><td className="border border-slate-300 px-2 py-1.5">031.977.7322</td><td className="border border-slate-300 px-1 py-1.5 bg-slate-50">팩스 031.977.6322</td></tr>
                      <tr><td className="border border-slate-300 px-2 py-1.5 bg-slate-50">입금계좌</td><td className="border border-slate-300 px-2 py-1.5" colSpan={2}>국민은행 024837-04-007281 ㈜비케이브로</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>

              {greetingLines.map((line, i) => (
                <p key={i} contentEditable={!readOnly} suppressContentEditableWarning onBlur={(e) => updateGreeting(i, e.currentTarget.textContent)}
                  className={"mb-2 whitespace-pre-line rounded px-1 -mx-1 hover:bg-amber-50 focus:bg-amber-50 outline-none " + (String(line).trim().startsWith("◎") ? "" : "pl-5")}
                  style={{ lineHeight: 1.8 }}>{line}</p>
              ))}

              <table className="w-full border-collapse border border-slate-400 text-[11px] mb-4 mt-2">
                <thead><tr className="bg-slate-100">
                  <th className="border border-slate-400 px-2 py-2.5 w-8">No</th>
                  <th className="border border-slate-400 px-2 py-2.5 w-16">제품사진</th>
                  <th className="border border-slate-400 px-2 py-2.5">제품명</th>
                  <th className="border border-slate-400 px-2 py-2.5">규격 및 사양</th>
                  <th className="border border-slate-400 px-2 py-2.5 w-14">주문수량</th>
                  <th className="border border-slate-400 px-2 py-2.5 w-20">단가(ea)</th>
                  <th className="border border-slate-400 px-2 py-2.5 w-24">금액(₩)</th>
                  <th className="border border-slate-400 px-2 py-2.5 w-40 min-w-[145px]">비고</th>
                </tr></thead>
                <tbody>
                  <tr>{/* 높이 고정 없음 — 규격·비고가 길어지면 행이 자동으로 늘어난다 */}
                    <td className="border border-slate-400 text-center align-top py-2">1</td>
                    <td className="border border-slate-400 text-center align-top p-1.5">{productImage ? <img src={productImage} loading="lazy" className="w-12 h-12 object-contain mx-auto" /> : "-"}</td>
                    <td className="border border-slate-400 px-2 py-2 align-top break-words">{productName}</td>
                    <td className="border border-slate-400 py-2 px-2 text-left align-top whitespace-pre-wrap break-words text-xs leading-relaxed">{spec}</td>
                    <td className="border border-slate-400 text-center align-top py-2">{qty}</td>
                    <td className="border border-slate-400 text-right align-top py-2 px-2">{unitConverted != null ? won(unitConverted) : "-"}</td>
                    <td className="border border-slate-400 text-right align-top py-2 px-2">{won(productAmt)}</td>
                    <td className="border border-slate-400 py-2 px-2 text-center align-top whitespace-pre-wrap text-xs leading-relaxed">
                      {customNote ? <div className="mb-1 break-words">{customNote}</div> : null}
                      <div className="font-medium text-slate-700 whitespace-nowrap">{expectedText}</div>
                    </td>
                  </tr>
                  <tr style={{ height: "42px" }}>
                    <td className="border border-slate-400 text-center">2</td>
                    <td className="border border-slate-400"></td>
                    <td className="border border-slate-400 px-2">특송비</td>
                    <td className="border border-slate-400 px-2 text-[10px]">1KG 미만</td>
                    <td className="border border-slate-400 text-center">{expressFee ? 1 : 0}</td>
                    <td className="border border-slate-400 text-right px-2">{won(expressFee)}</td>
                    <td className="border border-slate-400 text-right px-2">{won(expressFee)}</td>
                    <td className="border border-slate-400 text-center text-[10px]">{expressRemark}</td>
                  </tr>
                  <tr style={{ height: "36px" }}><td className="border border-slate-400 text-center font-semibold" colSpan={6}>합　계</td><td className="border border-slate-400 text-right px-2 font-semibold">{won(supplyTotal)}</td><td className="border border-slate-400"></td></tr>
                  <tr style={{ height: "36px" }}><td className="border border-slate-400 text-center font-semibold" colSpan={6}>부가가치세</td><td className="border border-slate-400 text-right px-2">{won(vat)}</td><td className="border border-slate-400"></td></tr>
                  <tr style={{ height: "36px" }}><td className="border border-slate-400 text-center font-bold" colSpan={6}>합계금액</td><td className="border border-slate-400 text-right px-2 font-bold">{won(grandTotal)}</td><td className="border border-slate-400"></td></tr>
                </tbody>
              </table>

              <div className="font-semibold mb-1.5">◎ 참고사항</div>
              {footerLines.map((line, i) => (
                <p key={i} contentEditable={!readOnly} suppressContentEditableWarning onBlur={(e) => updateFooter(i, e.currentTarget.textContent)}
                  className="mb-1.5 whitespace-pre-line rounded px-1 -mx-1 hover:bg-amber-50 focus:bg-amber-50 outline-none">{line}</p>
              ))}
              <div className="text-right pr-4 mt-6 font-semibold">㈜ 비케이브로</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ShippingFeeSettingsModal({ shippingFees, shippingFeeNotes, onSave, onClose }) {
  const [normalFee, setNormalFee] = useState((shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES)["일반"]);
  const [airFee, setAirFee] = useState((shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES)["항공"]);
  const [normalNote, setNormalNote] = useState((shippingFeeNotes || DEFAULT_SAMPLE_SHIPPING_FEE_NOTES)["일반"]);
  const [airNote, setAirNote] = useState((shippingFeeNotes || DEFAULT_SAMPLE_SHIPPING_FEE_NOTES)["항공"]);
  const save = () => {
    onSave({ "일반": Number(normalFee) || 0, "항공": Number(airFee) || 0 }, { "일반": normalNote, "항공": airNote });
    onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[70] p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-md overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">⚙️ 배송비 설정</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
          <p className="text-xs text-slate-500">여기서 설정한 금액이 샘플 카드의 배송방식 드롭다운, 고객 안내문, 샘플비 인보이스 단가에 모두 동일하게 반영됩니다. 비고 안내문구는 인보이스 품목 No 3(배송비)의 비고 칸에 자동으로 채워집니다.</p>
          <div className="p-3 rounded-lg bg-slate-50 space-y-2">
            <div className="text-xs font-semibold text-slate-600">일반 택배</div>
            <Field label="기본 금액(원)"><input type="number" className={inputCls} value={normalFee} onChange={(e) => setNormalFee(e.target.value)} /></Field>
            <Field label="비고 안내문구"><input className={inputCls} value={normalNote} onChange={(e) => setNormalNote(e.target.value)} placeholder="예: 일반 국내택배비 2,500원, 입금확인 후 7일 소요" /></Field>
          </div>
          <div className="p-3 rounded-lg bg-slate-50 space-y-2">
            <div className="text-xs font-semibold text-slate-600">항공 특송</div>
            <Field label="기본 금액(원)"><input type="number" className={inputCls} value={airFee} onChange={(e) => setAirFee(e.target.value)} /></Field>
            <Field label="비고 안내문구"><input className={inputCls} value={airNote} onChange={(e) => setAirNote(e.target.value)} placeholder="예: 항공특송료 15,000원, 급송 (2~3일 소요)" /></Field>
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">저장</button>
        </div>
      </div>
    </div>
  );
}

function SampleCard({ sample, accounts, products, proposals, sampleStock, onDecrementStock, supplierLogo, shippingFees, shippingFeeNotes, onSaveShippingFees, currentUserName, isAdmin, onUpdate, onDelete, onAddMemo, onDeleteMemo }) {
  const [showInvoice, setShowInvoice] = useState(false);
  const [showAnnounce, setShowAnnounce] = useState(false);

  const [memoText, setMemoText] = useState("");
  const submitMemo = () => {
    if (!memoText.trim() || !onAddMemo) return;
    onAddMemo(sample, memoText.trim());
    setMemoText("");
  };
  const fees = shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES;
  const stepIndex = SAMPLE_STATUS_OPTIONS.indexOf(sample.status);
  // 단계 버튼 클릭 → 상태 전환 + 처리일시/담당직원(로그인 사용자) 자동 기록
  const setStatus = (status) => {
    onUpdate(sample, buildSampleStatusPatch(sample, status, currentUserName));
  };
  // 각 단계의 기록(일시·담당자)을 statusLogs에서 꺼내되, 없으면 기존 날짜/확인직원 필드로 폴백(옛 데이터 호환)
  /* 스텝 바 캡션 — {date, worker}로 분리해 반환한다.
     예전엔 "2026-08-15 14:20:00 · 백상선" 한 줄로 합쳐 반환해서 좁은 스텝 칸을 넘치며 겹쳤다.
     날짜는 YYYY-MM-DD까지만(시각 절삭) 쓰고 담당자는 아랫줄에 따로 표시한다. */
  const stepLog = (s) => {
    const logKey = SAMPLE_STATUS_LOG_KEY[s];
    const log = (sample.statusLogs && logKey && sample.statusLogs[logKey]) || null;
    const rawDate = (log && log.date) || sample[SAMPLE_STATUS_DATE_FIELD[s]] || "";
    const worker = (log && log.worker) || sample[SAMPLE_STATUS_CONFIRMER_FIELD[s]] || "";
    if (!rawDate && !worker) return null;
    return { date: String(rawDate).slice(0, 10), worker };
  };
  // 단계별 행(진행일/확인직원)의 입력값 — 아직 [확인]을 안 누른 값은 여기서만 임시로 들고 있다가 확인버튼 클릭시 한번에 반영
  const [pendingDates, setPendingDates] = useState({});
  const [pendingConfirmers, setPendingConfirmers] = useState({});
  const getDate = (field) => (pendingDates[field] != null ? pendingDates[field] : (sample[field] || ""));
  const getConfirmer = (field) => (pendingConfirmers[field] != null ? pendingConfirmers[field] : (sample[field] || currentUserName || "백상선"));
  // [확인] 버튼: 그 단계의 진행일+확인직원을 한번에 저장하고, 진행상태(status)도 그 단계로 동기화 → 상단 진행바도 함께 활성화됨
  const confirmStep = (status) => {
    const dateField = SAMPLE_STATUS_DATE_FIELD[status];
    const confirmerField = SAMPLE_STATUS_CONFIRMER_FIELD[status];
    const dateValue = getDate(dateField) || todayDisplay(); // ⚠️ todayStr()은 "20260815"라 date input이 못 읽는다
    const confirmerValue = getConfirmer(confirmerField) || currentUserName || "백상선";
    onUpdate(sample, { ...buildSampleStatusPatch(sample, status, confirmerValue), [dateField]: dateValue, [confirmerField]: confirmerValue });
  };
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="min-w-0">
          <div className="text-sm font-bold text-slate-800 truncate">{sample.clientName}</div>
          <div className="text-xs text-slate-500 truncate mt-0.5">{sample.productName}</div>
        </div>
        <div className="flex gap-1 shrink-0">
          <button onClick={() => onUpdate(sample, { stockLocation: "korea" })} className={"text-[10px] px-2 py-1 rounded-full font-medium " + (sample.stockLocation === "korea" ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-500")}>🇰🇷 국내</button>
          <button onClick={() => onUpdate(sample, { stockLocation: "china" })} className={"text-[10px] px-2 py-1 rounded-full font-medium " + (sample.stockLocation === "china" ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-500")}>🇨🇳 중국발주</button>
        </div>
      </div>

      {/* 5단계 서브 파이프라인 타임라인 — ⚠️ 읽기 전용.
          단계 변경은 아래 [단계|진행일|확인직원|확인] 표의 [확인] 버튼으로만 이뤄진다.
          예전엔 이 배너를 클릭하면 즉시 단계가 바뀌어, 진행일·확인직원이 빈 채로 단계만 앞서가는 일이 있었다. */}
      <div className="whitespace-nowrap flex items-start justify-between gap-1.5 w-full mb-3">
        {SAMPLE_STATUS_OPTIONS.map((s, i) => {
          const caption = stepLog(s);
          const isCurrent = sample.status === s;
          return (
            <React.Fragment key={s}>
              <div className="flex-1 min-w-0">
                <div title={`${SAMPLE_STATUS_LABELS[s]} — 단계 변경은 아래 표의 [확인] 버튼으로만 가능합니다`}
                  className={"px-2.5 py-1.5 text-xs font-semibold rounded-lg text-center transition whitespace-nowrap select-none overflow-hidden text-ellipsis " +
                    (isCurrent ? "bg-indigo-600 text-white shadow-sm font-bold" : "bg-slate-100 text-slate-500")}
                  style={{ paddingLeft: "0.35rem", paddingRight: "0.35rem" }}>
                  {SAMPLE_STATUS_LABELS_PLAIN[s]}
                </div>
                {/* 진행일·담당자 캡션 — 뱃지 아래 중앙 정렬. 날짜/담당자를 두 줄로 나눠 좁은 칸에서도 안 겹친다 */}
                <div className={"text-center mt-1.5 leading-tight " + (caption ? (isCurrent ? "text-indigo-600" : "text-slate-400") : "text-transparent")}>
                  <div className="text-[10px] whitespace-nowrap font-medium">{caption ? caption.date || "-" : "-"}</div>
                  {caption && caption.worker && <div className="text-[10px] truncate" title={caption.worker}>{caption.worker}</div>}
                </div>
              </div>
              {i < SAMPLE_STATUS_OPTIONS.length - 1 && (
                <div className={"shrink-0 text-[11px] leading-none mt-2 select-none " + (i < stepIndex ? "text-indigo-500" : "text-slate-300")}>›</div>
              )}
            </React.Fragment>
          );
        })}
      </div>
      <div className="text-[11px] text-center text-slate-500 mb-3">현재 단계: <b className="text-[#1E3A8A]">{SAMPLE_STATUS_LABELS[sample.status]}</b></div>

      <div className="border border-slate-200 rounded-lg overflow-hidden mb-3">
        <table className="w-full text-[11px]">
          <thead><tr className="bg-slate-50 text-slate-400">
            <th className="text-left px-2 py-1.5 font-medium">단계</th>
            <th className="text-left px-2 py-1.5 font-medium">진행일</th>
            <th className="text-left px-2 py-1.5 font-medium">확인직원</th>
            <th className="px-2 py-1.5 w-14"></th>
          </tr></thead>
          <tbody>
            {SAMPLE_STATUS_OPTIONS.map((s) => {
              const dateField = SAMPLE_STATUS_DATE_FIELD[s];
              const confirmerField = SAMPLE_STATUS_CONFIRMER_FIELD[s];
              const isCurrent = sample.status === s;
              const isDone = sample[confirmerField]; // 이 단계에서 [확인]을 한번이라도 눌렀는지
              return (
                <tr key={s} className={"border-t border-slate-100 " + (isCurrent ? "bg-[#1E3A8A]/5" : "")}>
                  <td className="px-2 py-1.5 whitespace-nowrap">
                    {isDone && <span className="text-emerald-500 mr-1">✓</span>}
                    {SAMPLE_STATUS_LABELS[s]}
                    {isCurrent && <span className="ml-1 text-[9px] px-1.5 py-0.5 rounded-full bg-[#1E3A8A] text-white">현재</span>}
                  </td>
                  <td className="px-2 py-1.5">
                    <input type="date" value={getDate(dateField)} onChange={(e) => setPendingDates((prev) => ({ ...prev, [dateField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" />
                  </td>
                  <td className="px-2 py-1.5">
                    {isDone ? (
                      <span className="inline-flex items-center gap-1 w-full px-1.5 py-1 rounded border border-slate-100 bg-slate-50 text-slate-600" title="확인 완료 — 이후 변경 불가">
                        🔒 {sample[confirmerField]}
                      </span>
                    ) : (
                      <select value={getConfirmer(confirmerField)} onChange={(e) => setPendingConfirmers((prev) => ({ ...prev, [confirmerField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]">
                        <option value="">미지정</option>
                        {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
                      </select>
                    )}
                  </td>
                  <td className="px-2 py-1.5 text-center whitespace-nowrap">
                    {sample.status === s && <span className="text-[10px] px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold mr-1">현재</span>}
                    <button onClick={() => confirmStep(s)} className="text-[10px] px-2 py-1 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 whitespace-nowrap">확인</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="grid grid-cols-2 gap-2 mb-3">
        <Field label="담당 직원">
          <select className="w-full px-2 py-1.5 text-xs rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={sample.assignee || ""} onChange={(e) => onUpdate(sample, { assignee: e.target.value })}>
            <option value="">미지정</option>
            {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
        </Field>
        <Field label="배송방식(참고)">
          <select className="w-full px-2 py-1.5 text-xs rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={sample.shippingMethod || ""} onChange={(e) => onUpdate(sample, { shippingMethod: e.target.value })}>
            <option value="">미선택</option>
            <option value="일반">일반배송({fees["일반"].toLocaleString("ko-KR")}원)</option>
            <option value="항공">항공특송({fees["항공"].toLocaleString("ko-KR")}원)</option>
          </select>
        </Field>
      </div>

      <div className="flex gap-2">
        <button onClick={() => setShowInvoice(true)} className="flex-1 text-xs px-3 py-1.5 rounded-lg border border-emerald-300 text-emerald-700 hover:bg-emerald-50 font-medium">📄 샘플비 인보이스 자동 생성</button>
        <button onClick={() => setShowAnnounce(true)} className="flex-1 text-xs px-3 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 font-medium">💬 고객 안내문 생성</button>
        {(sample.status === "발송" || sample.status === "수령") && !sample.orderConverted && (
          <button
            onClick={() => {
              if (!window.confirm(`"${sample.clientName}" 건을 실제로 본품 계약·발주가 확정되어 5단계로 전환하시겠습니까?\n(파이프라인이 종결(Completed) 처리됩니다)`)) return;
              onUpdate(sample, { orderConverted: true, orderConvertedAt: nowDateTimeStr(), orderConvertedBy: currentUserName || "알 수 없음" });
            }}
            className="flex-1 text-xs px-3 py-1.5 rounded-lg border border-purple-300 text-purple-700 hover:bg-purple-50 font-medium"
          >
            📜 본품계약 전환
          </button>
        )}
        {isAdmin && <button onClick={() => onDelete(sample)} className="text-xs px-2 text-red-400 hover:text-red-600">🗑️</button>}
      </div>
      {sample.orderConverted && (
        <div className="mt-2 text-xs px-3 py-2 rounded-lg bg-purple-50 text-purple-700 font-medium">
          🎉 본품계약 전환 완료 — 파이프라인 종결됨 ({sample.orderConvertedBy}, {sample.orderConvertedAt})
        </div>
      )}

      {/* 💬 업무 특이사항 및 소통 메모 — 작성자/작성일시 자동기록되는 타임라인.
          ⚠️ 이 목록이 갱신되려면 상위(SampleStageView)가 sample을 id로 최신 조회해 넘겨야 한다(객체 스냅샷이면 안 바뀜) */}
      <div className="space-y-3 mt-4 pt-3 border-t border-slate-100">
        <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">💬 업무 특이사항 및 소통 메모</label>
        <div className="flex gap-2">
          <input
            type="text"
            value={memoText}
            onChange={(e) => setMemoText(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submitMemo(); }}
            placeholder="직원들과 공유할 특이사항을 입력하세요 (예: 현지 공장 발주 확인)"
            className="flex-1 text-xs border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-1 focus:ring-slate-900"
          />
          <button onClick={submitMemo} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-lg whitespace-nowrap">등록</button>
        </div>
        <div className="space-y-2 max-h-40 overflow-y-auto">
          {(sample.memos || []).length > 0 ? (
            (sample.memos || []).slice().reverse().map((m) => (
              <div key={m.id} className="bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex justify-between items-start text-xs">
                <div className="min-w-0">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="font-bold text-slate-800">{m.author}</span>
                    <span className="text-[10px] text-slate-400">{m.createdAt}</span>
                  </div>
                  <p className="text-slate-700 leading-relaxed whitespace-pre-line break-words">{m.content || m.text}</p>
                </div>
                {onDeleteMemo && <button onClick={() => onDeleteMemo(sample, m.id)} className="text-slate-400 hover:text-rose-500 text-xs ml-2 shrink-0" title="삭제">✕</button>}
              </div>
            ))
          ) : (
            <p className="text-xs text-slate-400 py-1">등록된 특이사항이 없습니다.</p>
          )}
        </div>
      </div>

      {showAnnounce && <SampleAnnounceModal shippingFees={fees} onClose={() => setShowAnnounce(false)} />}
      {showInvoice && (
        getSampleType(sample) === "ct" ? (
          <CtSampleInvoiceModal sample={sample} products={products} proposals={proposals} supplierLogo={supplierLogo} onUpdate={onUpdate} onClose={() => setShowInvoice(false)} />
        ) : (
          <SampleInvoiceModal sample={sample} products={products} proposals={proposals} sampleStock={sampleStock} onDecrementStock={onDecrementStock} supplierLogo={supplierLogo} shippingFees={fees} shippingFeeNotes={shippingFeeNotes || DEFAULT_SAMPLE_SHIPPING_FEE_NOTES} onUpdate={onUpdate} onClose={() => setShowInvoice(false)} />
        )
      )}

    </div>
  );
}

function SampleStockModal({ stock, products, isAdmin, onAdd, onUpdate, onSaveEdits, onDelete, onClose }) {
