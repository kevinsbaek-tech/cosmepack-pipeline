function FactoriesView({ factories, products, onBack, onAdd, onUpdate, onDelete, onImportFromProducts, onOpenProduct, isAdmin }) {
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;
  const [formFactory, setFormFactory] = useState(null); // null=닫힘, {}=신규, {id,...}=수정
  const [viewingFactory, setViewingFactory] = useState(null);
  const [viewingFactoryDetail, setViewingFactoryDetail] = useState(null);

  const filtered = factories.filter((f) => {
    if (!search.trim()) return true;
    const q = search.trim().toLowerCase();
    return (f.name || "").toLowerCase().includes(q) || (f.mainProducts || "").toLowerCase().includes(q);
  });
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const paged = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { setPage(1); }, [search]);

  const handleSave = (id, patch) => {
    if (id) onUpdate(id, patch); else onAdd({ id: Date.now(), ...patch });
    setFormFactory(null);
  };

  const countFor = (f) => products.filter((p) => p.factory === f.name).length;

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      {formFactory !== null && <FactoryFormModal factory={formFactory} onClose={() => setFormFactory(null)} onSave={handleSave} />}
      {viewingFactory && (
        <FactoryProductsModal factory={viewingFactory} products={products} onClose={() => setViewingFactory(null)}
          onOpenProduct={(p) => { setViewingFactory(null); onOpenProduct(p); }} />
      )}
      {viewingFactoryDetail && <FactoryDetailModal factory={viewingFactoryDetail} onClose={() => setViewingFactoryDetail(null)} />}
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">🏭 공장(OEM) 관리</h2>
        <div className="flex gap-2">
          {onImportFromProducts && (
            <button onClick={onImportFromProducts} className="px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] text-sm font-medium hover:bg-[#1E3A8A]/5 whitespace-nowrap">📥 제품 DB에서 공장 자동 등록</button>
          )}
          <button onClick={() => setFormFactory({})} className="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">➕ 신규 공장 등록</button>
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <input
        value={search} onChange={(e) => setSearch(e.target.value)}
        placeholder="🔍 공장명 또는 주요 품목으로 검색"
        className="w-full mb-4 px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
      />

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">
          {factories.length === 0 ? "등록된 공장이 없습니다." : "검색 결과가 없습니다."}
        </div>
      ) : (
        <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              <th className="text-left px-4 py-3 font-medium w-64">중국 공장명</th>
              <th className="text-left px-4 py-3 font-medium w-28">위챗 그룹방</th>
              <th className="text-left px-4 py-3 font-medium w-40">연락처</th>
              <th className="text-left px-4 py-3 font-medium w-56">주요 생산 품목</th>
              <th className="text-left px-4 py-3 font-medium w-24">생산 제품 (연동)</th>
              <th className="text-right px-4 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {paged.map((f, idx) => (
                <tr key={f.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  <td className="px-4 py-3 whitespace-nowrap">
                    <button onClick={() => setViewingFactoryDetail(f)} className="font-semibold hover:text-[#1E3A8A] hover:underline text-left" style={{ color: "#111827" }}>{f.name}</button>
                  </td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{f.wechatGroup || <span className="text-slate-400">-</span>}</td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{f.contact || <span className="text-slate-400">-</span>}</td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{f.mainProducts || <span className="text-slate-400">-</span>}</td>
                  <td className="px-4 py-3">
                    <button onClick={() => setViewingFactory(f)} className="text-xs px-2.5 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 whitespace-nowrap">
                      {countFor(f)}개 제품 보기
                    </button>
                  </td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <button onClick={() => setFormFactory(f)} className="text-xs px-2 py-1 text-slate-500 hover:text-[#1E3A8A] mr-2">✏️ 수정</button>
                    {isAdmin && <button onClick={() => onDelete(f)} className="text-xs px-2 py-1 text-red-400 hover:text-red-600">🗑️ 삭제</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );
}

  containerDieline: "용기칼선", boxDieline: "단상자칼선", otherFile: "기타파일",
};

// 동일 그룹(기본 용량+용기형태)의 유사 제품들을 모아 기본형 단가 vs 옵션 적용 단가를 비교하는 모달
function SimilarProductsModal({ product, allProducts, onClose }) {
  const attrs = deriveProductAttributes(product);
  const groupKey = attrs.baseGroupKey;
  const groupItems = allProducts
    .map((p) => ({ ...p, _attrs: deriveProductAttributes(p) }))
    .filter((p) => p._attrs.baseGroupKey && p._attrs.baseGroupKey === groupKey);

  const basePriceItem = groupItems.length > 0
    ? groupItems.reduce((min, p) => (Number(p.lastUnitPrice) || 0) < (Number(min.lastUnitPrice) || Infinity) ? p : min, groupItems[0])
    : null;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "1200px", height: "85vh", maxHeight: "85vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-base font-bold text-slate-800">🔍 유사/옵션 제품 분석</h2>
            <p className="text-xs text-slate-500 mt-0.5">{groupKey ? `그룹: ${groupKey}` : "이름/규격에서 용량·용기형태를 인식하지 못해 그룹을 특정할 수 없습니다."}</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          {!groupKey ? (
            <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
              "{product.name}"의 이름/규격에서 용량(예: 100g, 50ml)과 용기 형태(예: 크림용기, 펌프용기)를 자동으로 인식하지 못했습니다.
            </div>
          ) : groupItems.length <= 1 ? (
            <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
              같은 그룹({groupKey})으로 묶이는 다른 제품이 아직 없습니다.
            </div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-xs border border-slate-200 rounded-lg overflow-hidden">
                <thead><tr className="bg-slate-50 text-slate-500">
                  <th className="text-left px-3 py-2 font-medium">제품명</th>
                  <th className="text-left px-3 py-2 font-medium">재질</th>
                  <th className="text-left px-3 py-2 font-medium">캡/타입</th>
                  <th className="text-left px-3 py-2 font-medium">후가공/옵션</th>
                  <th className="text-right px-3 py-2 font-medium">단가</th>
                  <th className="text-right px-3 py-2 font-medium">옵션 추가금(추정)</th>
                  <th className="text-right px-3 py-2 font-medium">기준가 대비 차액</th>
                </tr></thead>
                <tbody>
                  {groupItems
                    .sort((a, b) => (Number(a.lastUnitPrice) || 0) - (Number(b.lastUnitPrice) || 0))
                    .map((p) => {
                      const isBase = basePriceItem && p.id === basePriceItem.id;
                      const surcharge = productOptionSurcharge(p);
                      const diff = (Number(p.lastUnitPrice) || 0) - (Number(basePriceItem && basePriceItem.lastUnitPrice) || 0);
                      return (
                        <tr key={p.id} className={"border-t border-slate-100 " + (p.id === product.id ? "bg-blue-50/50" : "")}>
                          <td className="px-3 py-2 font-medium text-slate-800">
                            {p.name}
                            {isBase && <span className="ml-1.5 text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">기본형</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.materials.length > 0 ? p._attrs.materials.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.capTypes.length > 0 ? p._attrs.capTypes.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-blue-50 text-[#1D4ED8]">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.finishes.length > 0 ? p._attrs.finishes.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-700">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2 text-right font-semibold text-[#1E3A8A]">{won(p.lastUnitPrice || 0)}</td>
                          <td className="px-3 py-2 text-right text-slate-500">{surcharge > 0 ? won(surcharge) : "-"}</td>
                          <td className={"px-3 py-2 text-right font-medium " + (diff > 0 ? "text-red-500" : diff < 0 ? "text-emerald-600" : "text-slate-400")}>
                            {isBase ? "-" : `${diff > 0 ? "+" : ""}${won(diff)}`}
                          </td>
                        </tr>
                      );
                    })}
                </tbody>
              </table>
              <p className="text-[11px] text-slate-400 mt-3">
                * "기본형"은 그룹 내 단가(lastUnitPrice)가 가장 낮은 제품을 자동 기준으로 삼은 것입니다. "옵션 추가금"은 용기/캡 인쇄·후가공 단가(K스펙) 합계를 참고용으로 보여줍니다.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

      kc("용기 후가공가격", product.containerFinishPriceK, product.containerFinishPriceC),
      kc("캡/뚜껑 인쇄가격", product.capPrintPriceK, product.capPrintPriceC),
      kc("캡/뚜껑 후가공가격", product.capFinishPriceK, product.capFinishPriceC),
      kc("기타 후가공가격", product.otherFinishPriceK, product.otherFinishPriceC),
      kc("기타옵션", product.otherOptionK, product.otherOptionC),
    ].filter(Boolean) },
    { title: "CT 샘플 비용", entries: [["CT생산샘플가격(K)", product.ctSamplePriceK], ["CT생산샘플(C)", product.ctSampleC]] },

  ].map((g) => ({ ...g, entries: g.entries.filter(([, v]) => v !== undefined && v !== "" && v !== 0) })).filter((g) => g.entries.length > 0);
  const hasDetailData = detailGroups.length > 0;

  return (

        <div className="p-6 overflow-y-auto flex-1">

            {hasDetailData && (

                {detailGroups.map((g) => (
                  <div key={g.title} className="bg-slate-50 rounded-lg p-3">

                    <table className="w-full text-xs">

function TextField({ label, value, onChange, hint, mono, rows, span }) {
  return (
    <Field label={label} hint={hint} span={span}>
      {rows ? (
        <AutoResizeTextarea value={value} onChange={onChange} minRows={rows} />
      ) : (
        <input className={inputCls + (mono ? " font-mono text-xs" : "")} value={value} onChange={(e) => onChange(e.target.value)} />
      )}
    </Field>
  );
}

function PriceTierTable({ tiers, onChange }) {
  const update = (idx, field, value) => {
    const next = tiers.map((t, i) => (i === idx ? { ...t, [field]: value } : t));
    onChange(next);
  };
  const addTier = () => onChange([...tiers, { qty: "", cbm: "", shippingRmb: "", factoryPriceRmb: "" }]);
  const removeTier = (idx) => onChange(tiers.filter((_, i) => i !== idx));

  return (
    <div>
      <div className="grid grid-cols-5 gap-2 text-xs font-medium text-slate-500 mb-1.5 px-1">
        <div>기준수량 (개)</div><div>제품예상부피 CBM</div><div>중국내운송료 RMB</div><div>공장단가 RMB</div><div></div>
      </div>
      <div className="space-y-2">
        {tiers.map((t, i) => (
          <div key={i} className="grid grid-cols-5 gap-2 items-center">
            <input className={inputCls} value={t.qty} onChange={(e) => update(i, "qty", e.target.value)} placeholder="예: 5000" />
            <input className={inputCls} value={t.cbm} onChange={(e) => update(i, "cbm", e.target.value)} placeholder="예: 1.2" />
            <input className={inputCls} value={t.shippingRmb} onChange={(e) => update(i, "shippingRmb", e.target.value)} placeholder="예: 300" />
            <input className={inputCls} value={t.factoryPriceRmb} onChange={(e) => update(i, "factoryPriceRmb", e.target.value)} placeholder="예: 1.21" />
            <button type="button" onClick={() => removeTier(i)} title="삭제" className="w-8 h-8 flex items-center justify-center rounded-lg border border-red-200 text-red-500 hover:bg-red-50 shrink-0">🗑️</button>
          </div>
        ))}
      </div>
      <button type="button" onClick={addTier} className="mt-2 text-xs px-3 py-1.5 rounded-lg border border-dashed border-slate-300 text-slate-500 hover:border-[#1E3A8A] hover:text-[#1E3A8A]">
        ➕ 수량 구간 추가
      </button>
      {tiers.length === 0 && <p className="text-xs text-slate-400 mt-2">아직 등록된 수량 구간이 없습니다. "수량 구간 추가"로 시작해주세요.</p>}
    </div>
  );
}

function FileNoteUpload({ label, hint, file, note, onFileChange, onNoteChange }) {
  const ref = useRef(null);
  const [busy, setBusy] = useState(false);
  const handleFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setBusy(true);
    try {
      const isImage = f.type.startsWith("image/");
      const data = isImage ? await compressImageFile(f, 300 * 1024) : await readFileAsDataUrl(f);
      onFileChange(data, f.name);
    } catch (err) {
      console.error(err);
    } finally {
      setBusy(false);
    }
  };
  return (
    <Field label={label} hint={hint}>
      <div className="border border-slate-200 rounded-lg p-3 space-y-2">
        <div className="flex items-center gap-3">
          {file && file.startsWith("data:image") ? (
            <ZoomableImage src={file} className="w-14 h-14 object-cover rounded-lg border border-slate-200" />
          ) : file ? (
            <div className="w-14 h-14 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center text-slate-400 text-xs">파일</div>
          ) : null}
          <button type="button" onClick={() => ref.current && ref.current.click()} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">
            {busy ? "업로드 중..." : file ? "파일 교체" : "📁 파일 선택"}
          </button>
          {file && <button type="button" onClick={() => onFileChange("", "")} className="text-xs text-red-400 hover:text-red-600">제거</button>}
          <input ref={ref} type="file" className="hidden" onChange={handleFile} />
        </div>
        <input className={inputCls} value={note} onChange={(e) => onNoteChange(e.target.value)} placeholder="파일 설명 / 특이사항 입력" />
      </div>
    </Field>
  );
}

  const [cosmepackCode, setCosmepackCode] = useState(product.cosmepackCode || "");

  const [factory, setFactory] = useState(product.factory || "");
  const [factoryLink, setFactoryLink] = useState(product.factoryLink || "");
  const [wechatGroup, setWechatGroup] = useState(product.wechatGroup || "");
  const [factoryPriceNote, setFactoryPriceNote] = useState(product.factoryPriceNote || "");
  const [containerPrintPriceC, setContainerPrintPriceC] = useState(product.containerPrintPriceC || "");
  const [containerFinishPriceC, setContainerFinishPriceC] = useState(product.containerFinishPriceC || "");
  const [capPrintPriceC, setCapPrintPriceC] = useState(product.capPrintPriceC || "");
  const [capFinishPriceC, setCapFinishPriceC] = useState(product.capFinishPriceC || "");
  const [otherFinishPriceC, setOtherFinishPriceC] = useState(product.otherFinishPriceC || "");
  const [otherOptionC, setOtherOptionC] = useState(product.otherOptionC || "");
  const [productionNotesC, setProductionNotesC] = useState(product.productionNotesC || "");
  const [ctSampleC, setCtSampleC] = useState(product.ctSampleC || "");
  const [priceTiers, setPriceTiers] = useState(() => {
    if (product.priceTiers && product.priceTiers.length) return product.priceTiers;
    if (product.rmbCost || product.cbmText || product.shippingText) {
      return [{ qty: product.moqText || "", cbm: product.cbmText || "", shippingRmb: product.shippingText || "", factoryPriceRmb: product.rmbCost || "" }];
    }
    return [];
  });

  const normalizeRefs = (refs) => (refs || []).map((r) => (typeof r === "string" ? { image: r, note: "" } : r));
  const [referenceItems, setReferenceItems] = useState(normalizeRefs(product.referenceImages));
  const [containerDieline, setContainerDieline] = useState(product.containerDieline && typeof product.containerDieline === "object" ? product.containerDieline : { file: product.containerDieline || "", note: "" });
  const [boxDieline, setBoxDieline] = useState(product.boxDieline && typeof product.boxDieline === "object" ? product.boxDieline : { file: product.boxDieline || "", note: "" });
  const [otherFile, setOtherFile] = useState(product.otherFile && typeof product.otherFile === "object" ? product.otherFile : { file: product.otherFile || "", note: "" });

  const handleImageFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setCompressing(true);
    try { setImage(await compressImageFile(file, 300 * 1024)); }
    catch (err) { console.error(err); }
    finally { setCompressing(false); }
  };

  const addReferenceItem = () => setReferenceItems((prev) => [...prev, { image: "", note: "" }]);
  const updateReferenceItem = (idx, patch) => setReferenceItems((prev) => prev.map((r, i) => (i === idx ? { ...r, ...patch } : r)));
  const removeReferenceItem = (idx) => setReferenceItems((prev) => prev.filter((_, i) => i !== idx));

  const save = () => {
    if (!name.trim()) return;
    onSave(product.id, {
      name, image, sku, category,
      fillMethod, capacity, specSize, composition, material,
      moqText, leadTimeText, proposalPriceBasis, lastUnitPrice: Number(lastUnitPrice) || 0,
      containerPrintPriceK, containerFinishPriceK, capPrintPriceK, capFinishPriceK,
      otherFinishPriceK, otherOptionK, proposalNotesK, ctSamplePriceK, premoldCode, cosmepackCode,
      factory, factoryLink, wechatGroup,
      factoryPriceNote, containerPrintPriceC, containerFinishPriceC, capPrintPriceC, capFinishPriceC,
      otherFinishPriceC, otherOptionC, productionNotesC, ctSampleC,
      priceTiers,
      rmbCost: priceTiers.length ? priceTiers[0].factoryPriceRmb : product.rmbCost, // 하위호환용 대표값
      referenceImages: referenceItems, containerDieline, boxDieline, otherFile,
    });
  };

  const TABS = [["basic", "1. 기본/한국(K) 스펙"], ["factory", "2. 중국(C) 공장 스펙"], ["files", "3. 참조 이미지 & 칼선 파일"]];

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "1400px", height: "90vh", maxHeight: "90vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">{product.id ? `✏️ 제품 정보 수정 — ${product.name}` : "➕ 신규 제품 직접 등록"}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>

        <div className="px-6 pt-3 flex gap-2 border-b border-slate-200 shrink-0">
          {TABS.map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)}
              className={"px-4 py-2 text-sm font-medium rounded-t-lg -mb-px border-b-2 " + (tab === key ? "border-[#1E3A8A] text-[#1E3A8A]" : "border-transparent text-slate-400 hover:text-slate-600")}>
              {label}
            </button>
          ))}
        </div>

        <div className="p-6 overflow-y-auto flex-1">
          <Field label="대표 제품 사진" span={2}>
            <div className="flex items-center gap-3">
              <div className="w-16 h-16 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center overflow-hidden shrink-0">
                {image ? <ZoomableImage src={image} className="w-full h-full object-cover" /> : <span className="text-slate-300 text-xs">{compressing ? "압축중" : "사진"}</span>}
              </div>
              <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">이미지 변경 (자동 300KB 이하 압축)</button>
              <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleImageFile} />
            </div>
          </Field>
          <TextField label="제품명" value={name} onChange={setName} />

          {tab === "basic" && (
            <div className="grid grid-cols-3 gap-4 mt-4">
              <TextField label="SKU" value={sku} onChange={setSku} />
              <Field label="카테고리">
                <select className={inputCls} value={category} onChange={(e) => setCategory(e.target.value)}>
                  <option value="">선택 안 함</option>
                  {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </Field>
              <TextField label="충진방식" value={fillMethod} onChange={setFillMethod} />
              <TextField label="제품용량" value={capacity} onChange={setCapacity} />
              <TextField label="제품사이즈" value={specSize} onChange={setSpecSize} />
              <TextField label="제품구성" value={composition} onChange={setComposition} />
              <TextField label="제품재질" value={material} onChange={setMaterial} />
              <TextField label="최소제작수량" value={moqText} onChange={setMoqText} />
              <TextField label="예상제작기간" value={leadTimeText} onChange={setLeadTimeText} />
              <TextField label="제안가격기준" value={proposalPriceBasis} onChange={setProposalPriceBasis} />
              <Field label="제안가격" hint="원"><input type="number" className={inputCls} value={lastUnitPrice} onChange={(e) => setLastUnitPrice(e.target.value)} /></Field>
              <TextField label="용기인쇄가격" value={containerPrintPriceK} onChange={setContainerPrintPriceK} />
              <TextField label="용기후가공가격" value={containerFinishPriceK} onChange={setContainerFinishPriceK} />
              <TextField label="캡인쇄가격" value={capPrintPriceK} onChange={setCapPrintPriceK} />
              <TextField label="캡후가공가격" value={capFinishPriceK} onChange={setCapFinishPriceK} />
              <TextField label="기타후가공가격" value={otherFinishPriceK} onChange={setOtherFinishPriceK} />
              <TextField label="기타옵션" value={otherOptionK} onChange={setOtherOptionK} />
              <TextField label="CT생산샘플가격/제작기간" value={ctSamplePriceK} onChange={setCtSamplePriceK} />
              <TextField label="프리몰드품번" value={premoldCode} onChange={setPremoldCode} />
              <TextField label="코스메팩품번" value={cosmepackCode} onChange={setCosmepackCode} />
              <TextField label="제안기타사항" value={proposalNotesK} onChange={setProposalNotesK} rows={3} span={3} />
            </div>
          )}

          {tab === "factory" && (
            <div className="mt-4 space-y-5">
              <div className="grid grid-cols-3 gap-4">
                <Field label="중국공장명" hint="공장 관리 DB와 연동">
                  <input className={inputCls} list="factory-name-options" value={factory} onChange={(e) => setFactory(e.target.value)} placeholder="공장 목록에서 선택 또는 직접 입력" />
                  <datalist id="factory-name-options">
                    {factories.map((f) => <option key={f.id} value={f.name} />)}
                  </datalist>
                </Field>
                <TextField label="위쳇단체방이름" value={wechatGroup} onChange={setWechatGroup} />
                <TextField label="제품URL (1688 등)" value={factoryLink} onChange={setFactoryLink} mono />
              </div>

              <div>
                <div className="text-xs font-medium text-slate-600 mb-2">수량별 CBM / 운송료 / 공장단가</div>
                <PriceTierTable tiers={priceTiers} onChange={setPriceTiers} />
              </div>

              <div className="grid grid-cols-3 gap-4">
                <TextField label="용기인쇄단가" value={containerPrintPriceC} onChange={setContainerPrintPriceC} />
                <TextField label="용기후가공단가" value={containerFinishPriceC} onChange={setContainerFinishPriceC} />
                <TextField label="캡인쇄단가" value={capPrintPriceC} onChange={setCapPrintPriceC} />
                <TextField label="캡후가공단가" value={capFinishPriceC} onChange={setCapFinishPriceC} />
                <TextField label="기타후가공단가" value={otherFinishPriceC} onChange={setOtherFinishPriceC} />
                <TextField label="기타옵션" value={otherOptionC} onChange={setOtherOptionC} />
                <TextField label="CT생산샘플제작비/기간" value={ctSampleC} onChange={setCtSampleC} />
                <TextField label="공장단가설명" value={factoryPriceNote} onChange={setFactoryPriceNote} rows={2} span={2} />
                <TextField label="제작기타사항" value={productionNotesC} onChange={setProductionNotesC} rows={2} span={3} />
              </div>
            </div>
          )}

          {tab === "files" && (
            <div className="mt-4 space-y-5">
              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-xs font-medium text-slate-600">(C)제품참조이미지 & 참조파일</label>
                  <button type="button" onClick={addReferenceItem} className="text-xs px-3 py-1.5 rounded-lg border border-dashed border-slate-300 text-slate-500 hover:border-[#1E3A8A] hover:text-[#1E3A8A]">➕ 참조 이미지/파일 추가</button>
                </div>
                <div className="space-y-2">
                  {referenceItems.map((item, i) => (
                    <FileNoteUpload key={i} label={`참조 항목 ${i + 1}`} file={item.image} note={item.note}
                      onFileChange={(data) => updateReferenceItem(i, { image: data })}
                      onNoteChange={(v) => updateReferenceItem(i, { note: v })} />
                  ))}
                  {referenceItems.length === 0 && <p className="text-xs text-slate-400">등록된 참조 이미지/파일이 없습니다.</p>}
                </div>
                {referenceItems.length > 0 && (
                  <div className="flex flex-wrap gap-2 mt-1">
                    {referenceItems.map((item, i) => (
                      <button key={i} type="button" onClick={() => removeReferenceItem(i)} className="text-[10px] text-red-400 hover:text-red-600">참조 {i + 1} 삭제</button>
                    ))}
                  </div>
                )}
              </div>
              <FileNoteUpload label="(C)용기칼선" file={containerDieline.file} note={containerDieline.note}
                onFileChange={(data) => setContainerDieline((p) => ({ ...p, file: data }))}
                onNoteChange={(v) => setContainerDieline((p) => ({ ...p, note: v }))} />
              <FileNoteUpload label="(C)단상자칼선" file={boxDieline.file} note={boxDieline.note}
                onFileChange={(data) => setBoxDieline((p) => ({ ...p, file: data }))}
                onNoteChange={(v) => setBoxDieline((p) => ({ ...p, note: v }))} />
              <FileNoteUpload label="(C)기타파일" file={otherFile.file} note={otherFile.note}
                onFileChange={(data) => setOtherFile((p) => ({ ...p, file: data }))}
                onNoteChange={(v) => setOtherFile((p) => ({ ...p, note: v }))} />
            </div>
          )}
        </div>

        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">{product.id ? "저장/업데이트" : "＋ 제품 등록"}</button>
        </div>
      </div>
    </div>
  );
}

function ProductProposalsModal({ product, proposals, onClose, onOpenProposal }) {
  const matched = (proposals || []).filter((p) => (p.items || []).some((it) => it.productName === product.name));
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-2xl overflow-hidden flex flex-col" style={{ maxHeight: "80vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">📦 {product.name} — 포함된 제안서 ({matched.length}건)</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-4 overflow-y-auto flex-1">
          {matched.length === 0 ? (
            <p className="text-xs text-slate-400 text-center py-10">이 제품이 포함된 제안서가 없습니다.</p>
          ) : (
            <div className="space-y-2">
              {matched.map((p) => (
                <button key={p.id} onClick={() => onOpenProposal(p)} className="w-full flex items-center justify-between gap-3 p-2.5 rounded-lg hover:bg-slate-50 text-left">
                  <div className="min-w-0">
                    <div className="text-sm font-medium text-slate-800 truncate">{p.proposalTitle || p.itemSummary}</div>
                    <div className="text-xs text-slate-500 truncate">{p.clientName} · {p.code} · {formatCreatedAt(p.createdAt)}</div>
                  </div>
                  <span className="text-xs text-[#1D4ED8] shrink-0">PDF 보기 →</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ProductsView({ products, factories, proposals, onBack, onDelete, onAdd, onBulkAdd, onUseInSourcing, onUpdate, onDedupe, onAutoAssignCategories, onStripBrandPrefix, onOpenProposal, onSyncFactories, onUploadZip, onDeleteAllProducts, onDeleteAllUploaded, isAdmin, initialViewProduct, onConsumeInitialView }) {
  const [search, setSearch] = useState("");
  const [viewMode, setViewMode] = useState("list"); // list | card
  const [editingProduct, setEditingProduct] = useState(null);
  const [viewingProduct, setViewingProduct] = useState(null);
  const [viewingProductProposals, setViewingProductProposals] = useState(null);
  const [viewingSimilarProduct, setViewingSimilarProduct] = useState(null);

  useEffect(() => {
    if (initialViewProduct) {
      setViewingProduct(initialViewProduct);
      if (onConsumeInitialView) onConsumeInitialView();
    }
  }, [initialViewProduct]);
  const [uploadBusy, setUploadBusy] = useState(false);
  const [zipBusy, setZipBusy] = useState(false);
  const zipRef = useRef(null);
  const uploadRef = useRef(null);
  const [categoryFilter, setCategoryFilter] = useState("전체");
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;

  const filtered = useMemo(() => products.filter((p) => {
    if (categoryFilter !== "전체" && p.category !== categoryFilter) return false;
    if (!search.trim()) return true;
    const q = search.trim().toLowerCase();
    return (p.name || "").toLowerCase().includes(q) || (p.factory || "").toLowerCase().includes(q);
  }).sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko")), [products, categoryFilter, search]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedFiltered = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  useEffect(() => { setPage(1); }, [search, categoryFilter]);

  // 신규 등록/수정 모두 동일한 대형 모달(ProductEditModal)을 사용 — id 유무로 등록/수정 분기
  const handleSaveProduct = (id, patch) => {
    if (id) { onUpdate(id, patch); } else { onAdd({ id: Date.now() + Math.random(), ...patch }); }
    setEditingProduct(null);
  };

  // SKU-XXXXXXXX 토큰 추출은 전역 extractSkuToken() 재사용 (App레벨 ZIP 업로드와 동일 로직 공유)

  // 박스히어로 데이터 통합 업로드: 파일 하나(또는 여러 개)를 한번에 올리면 확장자/타입으로 자동 구분해서 처리한다.
  // .csv / .xlsx·.xls / .html·.htm → 제품 데이터 파싱 후 SKU(없으면 제품명+규격) 기준 1:1 병합(bulkAddProducts)
  // 이미지 파일(jpg/png 등, 파일명에 SKU-XXXXXXXX 포함) → 사진(image)만 SKU 매칭으로 복구, 다른 필드는 건드리지 않음
  const handleBoxHeroUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setUploadBusy(true);
    try {
      const records = [];
      const skuToImage = new Map(); // 이미지 단독 파일에서 수집한 SKU -> base64

      for (const file of files) {
        const lower = file.name.toLowerCase();
        if (lower.endsWith(".csv")) {
          const text = await file.text();
          const rows = parseCsv(text);
          rows.forEach((row) => {
            const name = pickField(row, ["제품명", "name", "product name", "품명"]);
            if (!name) return;
            records.push({
              name,
              sku: pickField(row, ["sku", "바코드", "barcode", "코드", "품목코드"]),
              specSize: pickField(row, ["규격", "spec", "사이즈", "size"]),
              material: pickField(row, ["재질", "material"]),
              lastUnitPrice: Number((pickField(row, ["단가", "price", "기본단가", "cost", "원가", "판매가"]) || "0").replace(/[^0-9.]/g, "")) || 0,
              image: "", factory: "", wechatGroup: "",
            });
          });
        } else if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
          try {
            const buf = await readFileAsArrayBuffer(file);
            const workbook = XLSX.read(buf, { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
            records.push(...boxHeroRowsToProducts(rawRows));
          } catch (err) {
            console.error(`"${file.name}" 엑셀 분석 실패:`, err);
          }
        } else if (lower.endsWith(".html") || lower.endsWith(".htm")) {
          try {
            const text = await file.text();
            const rawRows = parseBoxHeroHtml(text);
            records.push(...boxHeroRowsToProducts(rawRows));
          } catch (err) {
            console.error(`"${file.name}" HTML 분석 실패:`, err);
          }
        } else if (/^image\//i.test(file.type) || /\.(jpe?g|png|gif|webp)$/i.test(file.name)) {
          const sku = extractSkuToken(file.name);
          if (!sku) continue; // 파일명에 SKU가 없으면 어느 제품인지 알 수 없어 건너뜀
          try {
            const compressed = await compressImageFile(file, 300 * 1024);
            skuToImage.set(sku, compressed);
          } catch (err) {
            console.error(`"${file.name}" 이미지 압축 실패:`, err);
          }
        }
      }

      if (records.length === 0 && skuToImage.size === 0) {
        alert("인식된 데이터가 없습니다. .xlsx/.csv/.html 제품 데이터 파일이거나, 파일명에 SKU-XXXXXXXX가 포함된 이미지 파일인지 확인해주세요.");
        return;
      }

      if (records.length > 0) {
        if (!window.confirm(`${records.length}개 제품 데이터를 SKU 기준으로 병합할까요? (SKU가 같으면 기존 정보 갱신, 없으면 신규 등록)`)) return;
        await onBulkAdd(records);
        if (onSyncFactories) await onSyncFactories(records);
      }

      let restored = 0, unmatched = 0;
      for (const [sku, image] of skuToImage.entries()) {
        const target = products.find((p) => (p.sku || "").trim().toUpperCase() === sku);
        if (target) {
          await onUpdate(target.id, { image }); // image 필드만 갱신 — 다른 스펙 데이터는 그대로 유지
          restored++;
        } else {
          unmatched++;
        }
      }

      let summary;
      if (records.length > 0 && restored > 0) {
        summary = `제품 데이터 ${records.length}건 처리 및 이미지 ${restored}건 복구가 완료되었습니다.`;
      } else if (restored > 0) {
        summary = `총 ${restored}개 제품의 이미지가 SKU 기준으로 성공적으로 복구되었습니다.`;
      } else if (records.length > 0) {
        summary = `제품 데이터 ${records.length}건 처리가 완료되었습니다.`;
      } else {
        summary = "처리가 완료되었습니다.";
      }
      alert(summary + (unmatched > 0 ? `\n(SKU가 DB와 일치하지 않아 건너뛴 이미지 ${unmatched}건)` : ""));
    } catch (err) {
      console.error(err);

    } finally {

                        {proposals && (

                          </button>
                        )}
                        {onUseInSourcing && (
                          <button onClick={() => onUseInSourcing(p)} className="text-[11px] leading-tight px-2 py-1 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 text-center">

      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {pagedFiltered.map((p) => (
            <div key={p.id} className="bg-white border border-slate-200 rounded-xl p-4 flex gap-3">
              <div className="w-14 h-14 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">

              </div>

                {p.factory && <div className="text-xs mt-0.5" style={{ color: "#1e293b" }}>🏭 {p.factory}{p.wechatGroup ? ` · 💬 ${p.wechatGroup}` : ""}</div>}
              </div>
              <div className="flex flex-col gap-1 shrink-0">
                <button onClick={() => setEditingProduct(p)} className="text-xs text-slate-500 hover:underline whitespace-nowrap">✏️ 수정</button>
                {onUseInSourcing && <button onClick={() => onUseInSourcing(p)} className="text-xs text-[#1E3A8A] hover:underline whitespace-nowrap">🔍 사용</button>}
                <button onClick={() => setViewingSimilarProduct(p)} className="text-xs text-amber-700 hover:underline whitespace-nowrap">🔍 옵션분석</button>
                <button onClick={() => onDelete(p)} className="text-xs text-red-400 hover:text-red-600">삭제</button>
              </div>
            </div>
          ))}
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );
}

function App({ currentUser, onLogout, roleUser, accounts, onSaveAccount, onDeleteAccount }) {
  const isAdmin = !roleUser || roleUser.role === "admin"; // roleUser 없는 로컬/과거 세션은 관리자로 간주(하위호환)
  const [accountModalOpen, setAccountModalOpen] = useState(false);
  const [activeStep, setActiveStep] = useState(1);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [exSettingsOpen, setExSettingsOpen] = useState(false); // 상단 유틸리티바의 "환율 상세설정" 팝업 토글
  const [logistics, setLogistics] = useState(DEFAULT_LOGISTICS);
  const [marginTable, setMarginTable] = useState(DEFAULT_MARGIN_TABLE);
  const [customsRates, setCustomsRates] = useState(DEFAULT_CUSTOMS_RATES);
  const [difficultyMargins, setDifficultyMargins] = useState(DEFAULT_DIFFICULTY_MARGINS);
  const [clientsList, setClientsList] = useState([]);
  const [exRate, setExRate] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(EXRATE_SAVED_KEY) || "null");
      if (saved && saved.rmbToKrw) return { rmbToKrw: saved.rmbToKrw, rmbToUsd: saved.rmbToUsd, usdToKrw: saved.usdToKrw };
    } catch (e) { console.error(e); }
    return { rmbToKrw: DEFAULT_EXRATE.rmbToKrw.toFixed(2), rmbToUsd: DEFAULT_EXRATE.rmbToUsd.toFixed(2), usdToKrw: DEFAULT_EXRATE.usdToKrw.toFixed(2) };
  });
  const [exRateSavedAt, setExRateSavedAt] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(EXRATE_SAVED_KEY) || "null");
      return (saved && saved.savedAt) || null;
    } catch (e) { return null; }
  });
  const [exRateSuggestion, setExRateSuggestion] = useState(null); // API로 받아온 오늘의 추천 환율(안내문구+원클릭적용용, exRate 자체는 건드리지 않음)

  // 환율 입력창 하나가 포커스를 벗어날 때(onBlur) 소수점 둘째자리 ".00" 형식으로 강제 정돈
  const formatExRateField = (field) => {
    setExRate((prev) => ({ ...prev, [field]: (Number(prev[field]) || 0).toFixed(2) }));
  };
  // "💾 적용/저장" 버튼 — 3개 환율값을 전부 .toFixed(2)로 정돈하고 localStorage에 저장, 저장일시를 즉시 갱신.
  // exRate state 자체를 갱신하므로 제안가 계산식(useMemo가 exRate를 의존성으로 갖고 있음)에도 즉시 재계산 반영됨.
  const saveExRate = () => {
    const formatted = {
      rmbToKrw: (Number(exRate.rmbToKrw) || 0).toFixed(2),
      rmbToUsd: (Number(exRate.rmbToUsd) || 0).toFixed(2),
      usdToKrw: (Number(exRate.usdToKrw) || 0).toFixed(2),
    };
    const savedAt = nowDateTimeStr(); // "YYYY-MM-DD HH:mm:ss"
    setExRate(formatted);
    setExRateSavedAt(savedAt);
    try { localStorage.setItem(EXRATE_SAVED_KEY, JSON.stringify({ ...formatted, savedAt })); } catch (e) { console.error(e); }
    setToast("환율을 저장했습니다. (제안가 계산에 즉시 반영됩니다)");
  };

  // 페이지 로드시 캐시된 환율을 즉시 보여주고, 오늘 아직 갱신 안 됐으면 API를 호출해 하루 1회만 자동 갱신
  useEffect(() => {
    try {
      const cached = JSON.parse(localStorage.getItem(EXRATE_CACHE_KEY) || "null");
      if (cached) setExRateSuggestion(cached);
      if (cached && cached.fetchedDate === todayStr()) return; // 오늘 이미 갱신됨
    } catch (e) { console.error(e); }
    fetchTodayExchangeRates().then((rates) => { if (rates) setExRateSuggestion(rates); });
  }, []);

  // "🔄 오늘 환율 적용" 버튼 — API로 받아온 추천 환율을 입력창(exRate)에 즉시 반영해 제안가 계산식에 바로 연동
  const applyTodayExchangeRates = () => {
    if (!exRateSuggestion) { setToast("아직 환율 정보를 불러오지 못했습니다. 인터넷 연결을 확인해주세요."); return; }
    setExRate({
      rmbToKrw: Number(exRateSuggestion.rmbToKrw).toFixed(2),
      rmbToUsd: Number(exRateSuggestion.rmbToUsd).toFixed(2),
      usdToKrw: Number(exRateSuggestion.usdToKrw).toFixed(2),
    });
    setToast("오늘 기준 환율을 적용했습니다. (하단 '💾 적용/저장' 버튼을 눌러야 다음 접속에도 유지됩니다)");
  };
  const [supplierLogo, setSupplierLogo] = useState("");

  // 1단계: 가격조사 저장소
  const [sourcingItems, setSourcingItems] = useState([]);
  const [pendingQueue, setPendingQueue] = useState([]);

  // 2단계: 현재 입력 중인 품목
  const [productImage, setProductImage] = useState("");
  const [productName, setProductName] = useState("");
  const [specSize, setSpecSize] = useState("");
  const [material, setMaterial] = useState("");
  const [itemFactory, setItemFactory] = useState("");
  const [itemWechatGroup, setItemWechatGroup] = useState("");
  const [category, setCategory] = useState(CATEGORIES[0]);
  const [quantity, setQuantity] = useState(3000);
  const [cbm, setCbm] = useState(1);
  const [customsRate, setCustomsRate] = useState(DEFAULT_CUSTOMS_RATES[CATEGORIES[0]]);
  const [rmbBase, setRmbBase] = useState(2.95);
  const [rmbBox, setRmbBox] = useState(0);
  const [rmbInspect, setRmbInspect] = useState(0);
  const [rmbShip, setRmbShip] = useState(0);
  const [costLocked, setCostLocked] = useState(true);
  const [spec, setSpec] = useState("화이트 용기 / 화이트 캡 기본 사양");
  const [printPrice, setPrintPrice] = useState(20);
  const [finishing, setFinishing] = useState("별도 견적");
  const [leadTime, setLeadTime] = useState(30);
  const [extraOptions, setExtraOptions] = useState([]);
  const [marginOverride, setMarginOverride] = useState(null);
  const [marginClientName, setMarginClientName] = useState("");

  useEffect(() => { setCustomsRate(customsRates[category] ?? 0); }, [category]);
  useEffect(() => { setMarginOverride(null); }, [category]);

  const calc = useMemo(() => {
    const qty = Number(quantity) || 0;
    const boxPerUnit = qty > 0 ? (Number(rmbBox) || 0) / qty : 0;
    const inspectPerUnit = qty > 0 ? (Number(rmbInspect) || 0) / qty : 0;
    const shipPerUnit = qty > 0 ? (Number(rmbShip) || 0) / qty : 0;
    const unitRmb = (Number(rmbBase) || 0) + boxPerUnit + inspectPerUnit + shipPerUnit;
    const totalRmbPayment = unitRmb * qty;
    const autoMarginRate = getMarginRate(marginTable, category, totalRmbPayment);
    const clientDifficulty = (clientsList.find((c) => c.name === marginClientName) || {}).difficulty || "표준";
    const difficultyAdjust = (difficultyMargins[clientDifficulty] || 0) / 100;
    const marginRate = (marginOverride != null ? marginOverride : autoMarginRate) + difficultyAdjust;
    const unitCostKrw = unitRmb * exRate.rmbToKrw;
    const pureFactoryCostKrw = (Number(rmbBase) || 0) * exRate.rmbToKrw;
    const logisticsTotal = (Number(cbm) || 0) * logistics.cbmRate + logistics.blFee + logistics.originFee + logistics.brokerFee;
    const logisticsPerUnit = qty > 0 ? logisticsTotal / qty : 0;
    const customsPerUnit = (unitCostKrw + logisticsPerUnit) * ((Number(customsRate) || 0) / 100);
    const totalCostPerUnit = unitCostKrw + logisticsPerUnit + customsPerUnit;
    const overheadPerUnit = (unitCostKrw - pureFactoryCostKrw) + logisticsPerUnit + customsPerUnit;
    const rawPrice = marginRate < 1 ? totalCostPerUnit / (1 - marginRate) : 0;
    const proposedPrice = Math.ceil(rawPrice / 10) * 10;
    const profitPerUnit = proposedPrice - totalCostPerUnit;
    const profitRate = proposedPrice > 0 ? (profitPerUnit / proposedPrice) * 100 : 0;
    return {
      unitRmb, boxPerUnit, inspectPerUnit, shipPerUnit, totalRmbPayment, marginRate, autoMarginRate,
      unitCostKrw, pureFactoryCostKrw, overheadPerUnit, logisticsPerUnit, customsPerUnit, totalCostPerUnit,
      proposedPrice, profitPerUnit, profitRate, totalProfit: profitPerUnit * qty, totalProposal: proposedPrice * qty,
      totalFactoryCost: pureFactoryCostKrw * qty, totalOverhead: overheadPerUnit * qty,
    };
  }, [category, quantity, cbm, customsRate, rmbBase, rmbBox, rmbInspect, rmbShip, marginTable, logistics, exRate, marginOverride, clientsList, difficultyMargins, marginClientName]);

  const [draftItems, setDraftItems] = useState([]);
  const [clientInfo, setClientInfo] = useState({ clientName: "", contact: "", channel: "카카오채널", employee: "", proposalTitle: "" });
  const [proposalList, setProposalList] = useState([]);
  const [factoriesList, setFactoriesList] = useState([]);
  const [productsList, setProductsList] = useState([]);
  const [excelArchiveList, setExcelArchiveList] = useState([]);
  const [productToPick, setProductToPick] = useState(null);
  const [productToView, setProductToView] = useState(null);
  // 날짜별(YYYYMMDD) 제안번호 순번 카운터. useState가 아닌 ref를 쓰는 이유:
  // ZIP/일괄 업로드 루프 안에서 여러 파일을 연속 처리할 때 setState는 비동기라 같은 렌더 안에서는
  // proposalList가 갱신되지 않아 매번 같은 -001이 나오는 버그가 있었음. ref는 즉시 반영되므로
  // 같은 배치 내에서도 -001,-002,-003... 순서대로 증가한다.
  const proposalSeqCounterRef = useRef({});

  // Firestore 연결 시 실시간 구독 — 미연결이면 로컬 state만 사용
  useEffect(() => {
    const unsub1 = fsSubscribe(COLLECTIONS.sourcing, (list) => setSourcingItems(list));
    const unsub2 = fsSubscribe(COLLECTIONS.proposals, (list) => setProposalList(list));
    const unsub3 = fsSubscribe(COLLECTIONS.clients, (list) => setClientsList(list));
    const unsub4 = fsSubscribe(COLLECTIONS.factories, (list) => setFactoriesList(list));
    const unsub5 = fsSubscribe(COLLECTIONS.products, (list) => setProductsList(list));
    const unsub6 = fsSubscribe(COLLECTIONS.excelArchive, (list) => setExcelArchiveList(list));
    return () => { unsub1(); unsub2(); unsub3(); unsub4(); unsub5(); unsub6(); };
  }, []);
  const [clientModal, setClientModal] = useState({ open: false, mode: "save" });
  const [view, setView] = useState("pipeline"); // pipeline | proposals | clients | factories | products | excel
  const [pdfData, setPdfData] = useState(null);
  const [toast, setToast] = useState("");

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2200); return () => clearTimeout(t); }, [toast]);

  const resetItemForm = () => {
    setProductImage(""); setProductName(""); setSpecSize(""); setMaterial("");
    setItemFactory(""); setItemWechatGroup("");
    setSpec("화이트 용기 / 화이트 캡 기본 사양"); setPrintPrice(20); setFinishing("별도 견적"); setLeadTime(30);
    setExtraOptions([]);
    setMarginOverride(null);
  };

  // 1→2단계 데이터 연동 (단건)
  const loadSourcingIntoForm = (sourcingItem) => {
    setProductImage(sourcingItem.image || "");
    setProductName(sourcingItem.name || "");
    const specLines = (sourcingItem.spec || "").split("\n");
    const sizeLine = specLines.find((l) => l.includes("사이즈")) || specLines[0] || "";
    const materialLine = specLines.find((l) => l.includes("재질")) || "";
    setSpecSize(sizeLine.replace(/사이즈[:\s]*/, "").trim());
    setMaterial(materialLine.replace(/재질[:\s]*/, "").trim());
    setQuantity(sourcingItem.quantity || 3000);
    setRmbBase(sourcingItem.rmbCost || 0);
    setRmbBox(0); setRmbInspect(0);
    setRmbShip(Number((sourcingItem.totalShippingRmb || 0).toFixed(4)));
    setItemFactory(sourcingItem.factory || "");
    setItemWechatGroup(sourcingItem.wechatGroup || "");
  };

  const sendToProposal = (sourcingItem) => {
    loadSourcingIntoForm(sourcingItem);
    setEditingProposalId(null);
    setProposalReadOnly(false);
    setEditingProposalHistory(null);
    setActiveStep(2);
    setToast("가격조사 데이터가 제안서 작성으로 전달되었습니다.");
  };

  const sendBulkToProposal = (sourcingList) => {
    if (sourcingList.length === 0) return;
    const [first, ...rest] = sourcingList;
    loadSourcingIntoForm(first);
    setPendingQueue(rest);
    setEditingProposalId(null);
    setProposalReadOnly(false);
    setEditingProposalHistory(null);
    setActiveStep(2);
    setToast(`${sourcingList.length}개 품목이 통합 제안서 작성 대기열에 담겼습니다.`);
