function parseKoreanHash() {
  try {
    const raw = decodeURIComponent(window.location.hash || "").replace(/^#/, "");
    if (!raw) return { view: "", page: 1 };
    const [viewPart, queryPart] = raw.split("?");
    let page = 1;
    if (queryPart) {
      const params = new URLSearchParams(queryPart);
      const p = parseInt(params.get("페이지"), 10);
      if (p > 0) page = p;
    }
    return { view: viewPart, page };
  } catch (e) {
    return { view: "", page: 1 };
  }
}
// 특정 리스트 화면(제품관리 등) 안에서 페이지 번호가 바뀔 때마다 주소창 해시를 "#제품관리?페이지=N"으로 갱신.

/* 카카오톡은 메시지가 "전체보기"로 접힐 만큼 길면 링크 미리보기 카드(OG 박스)를 만들지 않는다.

const MSG_PRODUCT_MAX = 30;
const shortenForMessage = (text, max) => {
  const t = String(text || "").replace(/\s+/g, " ").trim();
  const limit = max || MSG_PRODUCT_MAX;
  return t.length > limit ? t.slice(0, limit) + "…" : t;
};

/* ── 카카오 카드 안전장치 ─────────────────────────────────────────────
   완성된 발송 문구가 상한을 넘으면 자동으로 줄여 카드가 사라지지 않게 한다.
   품목명은 위 shortenForMessage가 이미 30자로 자르지만, 고객사명·문서번호가 길거나
   나중에 안내 문장을 추가하면 총량이 다시 넘칠 수 있어 마지막 방어선을 둔다.
   축소 순서(중요도가 낮은 것부터):
     1) 요약 블록 `• 라벨 : 값` 중 가장 긴 값을 잘라냄 (최소 12자는 남김)
     2) 그래도 넘치면 맨 아래 `※` 안내 문단을 통째로 제거
   ⚠️ 열람 링크·제목·서명줄은 어떤 경우에도 건드리지 않는다. */
const KAKAO_MSG_LIMIT = 470;
const SUMMARY_LINE_RE = /^(•\s[^:]+:\s)(.+)$/;
const fitMessageForKakao = (raw) => {
  let msg = String(raw || "");
  for (let guard = 0; guard < 30 && msg.length > KAKAO_MSG_LIMIT; guard++) {
    const lines = msg.split("\n");
    let target = -1, longest = 0;
    lines.forEach((ln, i) => {
      const m = SUMMARY_LINE_RE.exec(ln);
      const val = m ? m[2].replace(/…$/, "") : "";
      if (m && val.length > longest && val.length > 12) { longest = val.length; target = i; }
    });
    if (target < 0) break; // 더 줄일 요약 항목이 없음
    const m = SUMMARY_LINE_RE.exec(lines[target]);
    const val = m[2].replace(/…$/, "");
    const over = msg.length - KAKAO_MSG_LIMIT;
    const cut = Math.max(12, val.length - Math.max(over, 4));
    lines[target] = m[1] + val.slice(0, cut) + "…";
    const next = lines.join("\n");
    if (next.length >= msg.length) break; // 진전이 없으면 중단(무한루프 방지)
    msg = next;
  }
  // 요약을 최소치까지 줄여도 넘치면 ※ 안내 문단을 덜어낸다(링크 다음 문단)
  if (msg.length > KAKAO_MSG_LIMIT) msg = msg.replace(/\n\n※[^\n]*/, "");
  /* 그래도 넘치면 마지막 수단 — 본문에서 가장 긴 줄(예: 고객사명이 비정상적으로 긴 인사말)을 잘라낸다.
     링크줄·제목줄·서명줄·구분선은 후보에서 제외해 문서의 뼈대는 항상 보존한다. */
  for (let guard = 0; guard < 20 && msg.length > KAKAO_MSG_LIMIT; guard++) {
    const lines = msg.split("\n");
    let target = -1, longest = 0;
    lines.forEach((ln, i) => {
      if (i === 0) return;                              // 제목줄
      if (ln.indexOf("://") >= 0) return;               // 열람 링크
      if (/^[─—-]{3,}/.test(ln)) return;                // 구분선
      if (ln.indexOf("(주)비케이브로") === 0) return;    // 서명줄
      const val = ln.replace(/…$/, "");
      if (val.length > longest && val.length > 24) { longest = val.length; target = i; }
    });
    if (target < 0) break;
    const val = lines[target].replace(/…$/, "");
    const over = msg.length - KAKAO_MSG_LIMIT;
    const cut = Math.max(24, val.length - Math.max(over, 4));
    lines[target] = val.slice(0, cut) + "…";
    const next = lines.join("\n");
    if (next.length >= msg.length) break;
    msg = next;
  }
  return msg;
};

async function fsAdd(collectionName, data) {
  if (!db) return { id: "local-" + Date.now(), local: true };
  const payload = { ...data };
  if (!payload.createdAt) payload.createdAt = new Date().toISOString(); // orderBy 대상 필드는 항상 보장
  payload._serverCreatedAt = firebase.firestore.FieldValue.serverTimestamp();
  const ref = await db.collection(collectionName).add(payload);
  return { id: ref.id };
}
async function fsUpdate(collectionName, id, data) {
  if (!db) return;
  await db.collection(collectionName).doc(id).set(data, { merge: true });
}
async function fsDelete(collectionName, id) {
  if (!db) return;
  await db.collection(collectionName).doc(id).delete();
}
// 실시간 구독: onSnapshot으로 목록을 항상 최신 상태로 유지 (연결 안 됐으면 아무 것도 안 함 → 로컬 state만 사용)
// orderBy를 서버 쿼리에 걸지 않음(createdAt 필드가 없는 기존 문서가 결과에서 통째로 제외되는 것을 방지) — 대신 받은 뒤 클라이언트에서 정렬
function fsSubscribe(collectionName, onData, onError) {
  if (!db) return () => {};
  return db.collection(collectionName).onSnapshot(
    (snap) => {
      const list = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
      list.sort((a, b) => {
        const da = parseCreatedAt(a.createdAt) || new Date(0);
        const db_ = parseCreatedAt(b.createdAt) || new Date(0);
        return db_ - da;
      });
      onData(list);
    },
    (err) => {
      console.error(`${collectionName} 구독 오류:`, err);
      if (onError) onError(collectionName, err);
    }
  );
}

/* ===================== 구글 드라이브 썸네일 변환 ===================== */
// 구글 드라이브 공유 링크(파일 ID 포함)를 바로 <img>로 렌더 가능한 썸네일 URL로 변환
function driveLinkToThumbnail(url) {
  if (!url) return "";
  const m = url.match(/[-\w]{25,}/); // 구글 드라이브 파일 ID 추출 (25자 이상의 영숫자/-/_ 토큰)
  if (!m) return url; // 드라이브 링크가 아니면 원본 그대로 사용 (base64 등)
  return `https://drive.google.com/thumbnail?id=${m[0]}&sz=w400`;
}

/* ===================== 이미지 압축 (Storage 절약, 300KB 이하로 리사이즈) ===================== */
function compressDataUrl(dataUrl, maxBytes) {
  maxBytes = maxBytes || 250 * 1024;
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(dataUrl);
    img.onload = () => {
      let maxDim = 700;
      const attempt = (dim, quality) => {
        const scale = Math.min(1, dim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL("image/jpeg", quality);
      };
      let quality = 0.82;
      let out = attempt(maxDim, quality);
      let guard = 0;
      while (out.length * 0.75 > maxBytes && guard < 8) {
        if (quality > 0.4) quality -= 0.1; else maxDim = Math.round(maxDim * 0.8);
        out = attempt(maxDim, quality);
        guard++;
      }
      resolve(out);
    };
    img.src = dataUrl;
  });
}

// 제품 사진을 압축해서 Firestore 문서 안에 base64로 저장한다. 목록/카드에서는 대부분 작은 썸네일로만 보이므로
// 압축 목표치를 낮게(기본 120KB, 최대 640px) 잡아서 문서 크기와 전체 로딩 페이로드를 줄인다.
// (Firestore 실시간 구독은 컬렉션 전체를 가져오는 구조라, 문서 하나하나의 크기가 곧 전체 로딩 속도에 직결됨)
function compressImageFile(file, maxBytes) {
  maxBytes = maxBytes || 120 * 1024;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let maxDim = 640;
        const attempt = (dim, quality) => {
          const scale = Math.min(1, dim / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          return canvas.toDataURL("image/jpeg", quality);
        };
        let quality = 0.85;
        let dataUrl = attempt(maxDim, quality);
        let guard = 0;
        while (dataUrl.length * 0.75 > maxBytes && guard < 8) {
          if (quality > 0.4) quality -= 0.1; else maxDim = Math.round(maxDim * 0.8);
          dataUrl = attempt(maxDim, quality);
          guard++;
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// 이미 base64로 저장돼있는 사진(파일 선택 없이)을 그대로 재압축한다 — 오래된 제품/제안서 사진을 일괄로 줄일 때 사용.
// compressImageFile과 같은 캔버스 축소 로직을 재사용하되, 입력이 File이 아니라 이미 dataURL 문자열이라는 점만 다르다.
function compressBase64Image(dataUrl, maxBytes) {
  maxBytes = maxBytes || 120 * 1024;
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      let maxDim = 640;
      const attempt = (dim, quality) => {
        const scale = Math.min(1, dim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL("image/jpeg", quality);
      };
      let quality = 0.85;
      let out = attempt(maxDim, quality);
      let guard = 0;
      while (out.length * 0.75 > maxBytes && guard < 8) {
        if (quality > 0.4) quality -= 0.1; else maxDim = Math.round(maxDim * 0.8);
        out = attempt(maxDim, quality);
        guard++;
      }
      resolve(out);
    };
    img.src = dataUrl;
  });
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ===================== 견적 엑셀 통합 파서 (SheetJS 기반) ===================== */
function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function findHeaderRowIndex(rows, keywords) {
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (row.some((c) => typeof c === "string" && keywords.some((k) => c.includes(k)))) return i;
  }
  return -1;
}

// 예비용 범용 추출기 (제안서/가격조사 전용 파서가 실패했을 때의 폴백)
function extractItemsFromRows(rows) {
  const headerIdx = findHeaderRowIndex(rows, ["품명", "제품명", "단가", "규격"]);
  if (headerIdx < 0) return [];
  const header = rows[headerIdx].map((c) => String(c || "").trim());
  const colIndex = (keywords) => header.findIndex((h) => keywords.some((k) => h.includes(k)));
  const nameIdx = colIndex(["품명", "제품명"]);
  const priceIdx = colIndex(["단가", "RMB", "위안"]);
  const qtyIdx = colIndex(["수량"]);
  const specIdx = colIndex(["규격", "사이즈", "재원"]);
  const materialIdx = colIndex(["재질"]);
  const cbmIdx = colIndex(["CBM", "부피"]);
  const linkIdx = colIndex(["링크", "1688", "URL"]);
  const factoryIdx = colIndex(["공장", "회사명"]);
  const noteIdx = colIndex(["비고"]);
  if (nameIdx < 0) return [];
  const items = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[nameIdx];
    if (!name || String(name).trim() === "") continue;
    items.push({
      name: String(name).trim(),
      rmbCost: priceIdx >= 0 ? Number(String(row[priceIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      quantity: qtyIdx >= 0 ? Number(String(row[qtyIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      specSize: specIdx >= 0 ? String(row[specIdx] || "").trim() : "",
      material: materialIdx >= 0 ? String(row[materialIdx] || "").trim() : "",
      cbm: cbmIdx >= 0 ? Number(String(row[cbmIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      factoryLink: linkIdx >= 0 ? String(row[linkIdx] || "").trim() : "",
      factory: factoryIdx >= 0 ? String(row[factoryIdx] || "").trim() : "",
      note: noteIdx >= 0 ? String(row[noteIdx] || "").trim() : "",
      unitPrice: 0, totalPrice: 0,
    });
  }
  return items;
}

// "제안서(원화)" 시트: No/제품사진/제품명/재원/주문수량/단가(ea)/금액/비고 — 실제 최종 견적 품목의 1차 출처
function extractProposalItems(rows, imageMap) {
  const headerIdx = findHeaderRowIndex(rows, ["제품명"]);
  if (headerIdx < 0) return [];
  const header = rows[headerIdx].map((c) => String(c || "").trim());
  const colIndex = (keywords) => header.findIndex((h) => keywords.some((k) => h.includes(k)));
  const nameIdx = colIndex(["제품명", "품명"]);
  const specIdx = colIndex(["재원", "규격"]);
  const qtyIdx = colIndex(["주문", "수량"]);
  const priceIdx = colIndex(["단가"]);
  const amountIdx = colIndex(["금액"]);
  const noteIdx = colIndex(["비고"]);
  if (nameIdx < 0) return [];
  const items = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[nameIdx];
    if (!name || String(name).trim() === "") continue;
    const specRaw = specIdx >= 0 ? String(row[specIdx] || "") : "";
    const sizeMatch = specRaw.match(/사이즈\s*[:：]?\s*([^\n]+?)(?=\s*재질|$)/);
    const materialMatch = specRaw.match(/재질\s*[:：]?\s*([^\n]+)/);
    const noteRaw = noteIdx >= 0 ? String(row[noteIdx] || "").trim() : "";
    const noteSpec = extractSpecFromNote(noteRaw);
    items.push({
      name: String(name).replace(/\r?\n+/g, " ").trim(), // 2줄 이상 작성된 제품명도 줄바꿈만 공백으로 바꿔 잘림 없이 100% 보존
      specRaw, // 재원 컬럼 원본 전체(제품명 자동조합 알고리즘에서 캡/재질 등 부가정보까지 참고하기 위해 보존)
      specSize: sizeMatch ? sizeMatch[1].trim() : specRaw.split("\n")[0] || "",
      material: materialMatch ? materialMatch[1].trim() : "",
      quantity: qtyIdx >= 0 ? Number(String(row[qtyIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      unitPrice: priceIdx >= 0 ? Number(String(row[priceIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      totalPrice: amountIdx >= 0 ? Number(String(row[amountIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      notes: noteRaw, leadTimeDays: noteSpec.leadTimeDays, printFinishNote: noteSpec.printFinishNote,
      rmbCost: 0, factory: "", factoryLink: "", cbm: 0,
      image: (imageMap && (imageMap[i] || imageMap[i - 1] || imageMap[i + 1] || imageMap[i - 2] || imageMap[i + 2])) || "",
    });
  }
  return items;
}

// "가격조사" 시트: 품명/단가(위안화)/수량/운송비/비고/제품링크/회사명(공장)/연락처 — 원가·공장 보강용
// 자유텍스트(비고 등)에서 CBM/사이즈/재질을 최대한 뽑아내는 보조 파서
function extractSpecFromNote(note) {
  if (!note) return { cbm: 0, specSize: "", material: "", leadTimeDays: null, printFinishNote: "" };
  const text = String(note);
  const cbmMatch = text.match(/예상\s*부피\s*[:：]?\s*([\d.]+)\s*CBM/i) || text.match(/([\d.]+)\s*CBM/i);
  // 다음 라벨(사이즈/재질/예상/인쇄/후가공) 앞까지만 값으로 인식 — 뒤에 이어지는 다른 항목을 잘못 삼키지 않도록
  const stopAhead = "(?=\\s*(사이즈|재질|예상|인쇄|후가공)\\s*[:：]|\\n|$)";
  const sizeMatch = text.match(new RegExp(`사이즈\\s*[:：]?\\s*([^\\n]+?)${stopAhead}`));
  const materialMatch = text.match(new RegExp(`재질\\s*[:：]?\\s*([^\\n]+?)${stopAhead}`));
  const leadTimeMatch = text.match(/예상\s*(?:생산|제작)\s*기간\s*[:：]?\s*(?:약\s*)?(\d+(?:\.\d+)?)\s*일/);
  const printFinishMatch = text.match(new RegExp(`(?:인쇄|후가공)\\s*[:：]?\\s*([^\\n]+?)${stopAhead}`));
  return {
    cbm: cbmMatch ? Number(cbmMatch[1]) || 0 : 0,
    specSize: sizeMatch ? sizeMatch[1].trim() : "",
    material: materialMatch ? materialMatch[1].trim() : "",
    leadTimeDays: leadTimeMatch ? Math.round(parseFloat(leadTimeMatch[1])) : null,
    printFinishNote: printFinishMatch ? printFinishMatch[1].trim() : "",
  };
}

function extractSourcingMap(rows, imageMap) {
  const map = {};
  const headerIdx = findHeaderRowIndex(rows, ["품명", "단가"]);
  if (headerIdx < 0) return map;
  const header = rows[headerIdx].map((c) => String(c || "").trim());
  const colIndex = (keywords) => header.findIndex((h) => keywords.some((k) => h.includes(k)));
  const nameIdx = colIndex(["품명"]);
  const priceIdx = colIndex(["단가"]);
  const qtyIdx = colIndex(["수량"]);
  const noteIdx = colIndex(["비고"]);
  const linkIdx = colIndex(["제품링크"]);
  const homepageIdx = colIndex(["회사홈페이지링크", "홈페이지링크", "홈페이지"]);
  const factoryIdx = colIndex(["회사명", "공장"]);
  const contactIdx = colIndex(["연락처", "연럭처"]);
  const shipIdx = colIndex(["운송비", "운송료"]);
  if (nameIdx < 0) return map;
  let lastFactory = "", lastLink = "", lastHomepage = "", lastContact = "";
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[nameIdx];
    if (!name || String(name).trim() === "") continue;
    // 병합 셀 대응: 공장명/링크/연락처가 빈 값이면 직전 행 값을 그대로 이어받음
    const factoryVal = factoryIdx >= 0 ? String(row[factoryIdx] || "").trim() : "";
    const linkVal = linkIdx >= 0 ? String(row[linkIdx] || "").trim() : "";
    const homepageVal = homepageIdx >= 0 ? String(row[homepageIdx] || "").trim() : "";
    const contactVal = contactIdx >= 0 ? String(row[contactIdx] || "").trim() : "";
    if (factoryVal) lastFactory = factoryVal;
    if (linkVal) lastLink = linkVal;
    if (homepageVal) lastHomepage = homepageVal;
    if (contactVal) lastContact = contactVal;
    const note = noteIdx >= 0 ? String(row[noteIdx] || "").trim() : "";
    const noteSpec = extractSpecFromNote(note);
    const normalizedName = String(name).replace(/\r?\n+/g, " ").trim(); // 2줄 이상 작성된 품명도 줄바꿈만 공백으로 바꿔 잘림 없이 보존
    map[normalizedName] = {
      image: (imageMap && (imageMap[i] || imageMap[i - 1] || imageMap[i + 1] || imageMap[i - 2] || imageMap[i + 2])) || "",
      rmbCost: priceIdx >= 0 ? extractPriceOutsideParens(row[priceIdx]) : 0, // D열 단가/单价(위안)
      quantity: qtyIdx >= 0 ? extractNumber(row[qtyIdx]) : 0, // E열 수량/数量 (=MOQ)
      cbm: noteSpec.cbm, specSize: noteSpec.specSize, material: noteSpec.material, note,
      leadTimeDays: noteSpec.leadTimeDays, printFinishNote: noteSpec.printFinishNote,
      factoryLink: linkVal || lastLink,
      companyHomepageLink: homepageVal || lastHomepage,
      factory: factoryVal || lastFactory,
      contact: contactVal || lastContact,
      shippingRmb: shipIdx >= 0 ? extractPriceOutsideParens(row[shipIdx]) : 0, // F열 운송비/运费
    };
  }
  return map;
}

// "제안가격" 시트에서 품명별 "제안가" 컬럼값을 추출 (제안서(원화) 시트에 단가가 비어있을 때의 보강 출처)
function extractProposalPriceMap(rows) {
  const map = {};
  const headerIdx = findHeaderRowIndex(rows, ["품명", "제안가"]);
  if (headerIdx < 0) return map;
  const header = rows[headerIdx].map((c) => String(c || "").trim());
  const colIndex = (keywords) => header.findIndex((h) => keywords.some((k) => h.includes(k)));
  const nameIdx = colIndex(["품명"]);
  const priceIdx = colIndex(["제안가"]);
  if (nameIdx < 0 || priceIdx < 0) return map;
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[nameIdx];
    if (!name || String(name).trim() === "") continue;
    const normalizedName = String(name).replace(/\r?\n+/g, " ").trim();
    const price = extractPriceOutsideParens(row[priceIdx]);
    if (price) map[normalizedName] = price;
  }
  return map;
}

// "제안가격" 시트: 헤더가 여러줄로 병합돼있어 정확한 표 구조를 잡기 어려우므로,
// 환율/관세율/CBM당물류비/마진율 라벨을 스캔해 바로 아래 행의 값을 최선노력으로 추출
function extractPricingSummary(rows) {
  const summary = {};
  const wanted = [
    ["exchangeRate", ["환율"]],
    ["customsRate", ["관세율"]],
    ["cbmRate", ["CBM당"]],
    ["marginRate", ["이익율", "마진율"]],
  ];
  for (const [key, keywords] of wanted) {
    outer: for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const cell = row[c];
        if (typeof cell === "string" && keywords.some((k) => cell.includes(k))) {
          // 바로 아래 행, 같은 열의 값을 데이터로 간주
          for (let rr = r + 1; rr < Math.min(rows.length, r + 4); rr++) {
            const v = rows[rr] && rows[rr][c];
            if (typeof v === "number" && v !== 0) { summary[key] = v; break outer; }
          }
        }
      }
    }
  }
  return summary;
}



// "貴下"(귀하) 셀 기준 — 같은 행에서 그 앞쪽의 첫 텍스트 셀을 고객사명으로 인식
function extractClientFromDuiXia(rows) {
  for (const row of rows) {
    const idx = row.findIndex((c) => typeof c === "string" && (c.includes("貴下") || c.includes("귀하")));
    if (idx >= 0) {
      for (let j = idx - 1; j >= 0; j--) {
        const v = row[j];
        if (typeof v === "string" && v.trim() && !v.includes("貴下") && !v.includes("귀하")) return v.trim();
      }
    }
  }
  return "";
}
// "제안서(원화)" 시트의 고정 위치(C3=고객사명, D6=작성일자)를 우선 시도하고, 없으면 기존 유연 탐색(貴下 기준)으로 폴백
function extractClientFromFixedCell(rows) {
  const v = rows[2] && rows[2][2]; // C3 (0-indexed: row 2, col 2)
  if (typeof v === "string" && v.trim()) return v.trim();
  return "";
}
function extractProposalDateFromFixedCell(rows) {
  const v = rows[5] && rows[5][3]; // D6 (0-indexed: row 5, col 3)
  if (!v) return null;
  if (v instanceof Date && !isNaN(v.getTime())) {
    const p = (n) => String(n).padStart(2, "0");
    return `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())} 00:00:00`;
  }
  const s = String(v).trim();
  const m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")} 00:00:00`;
  return null;
}

// 엑셀(.xlsx = zip) 안의 그림 개체를 zip 구조에서 직접 추출해 "몇 번째 행에 있는 그림인지" 매핑
async function extractSheetImages(zip, workbook, sheetName) {
  const result = {};
  if (!zip || !sheetName) return result;
  try {
    const escapedName = sheetName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const workbookXml = await zip.file("xl/workbook.xml").async("string");
    const sheetTagMatch = workbookXml.match(new RegExp(`<sheet[^>]*name="${escapedName}"[^>]*/>`));
    if (!sheetTagMatch) return result;
    const ridMatch = sheetTagMatch[0].match(/r:id="(rId\d+)"/);
    if (!ridMatch) return result;

    const workbookRelsXml = await zip.file("xl/_rels/workbook.xml.rels").async("string");
    const relMatch = workbookRelsXml.match(new RegExp(`<Relationship[^>]*Id="${ridMatch[1]}"[^>]*Target="([^"]+)"`));
    if (!relMatch) return result;
    const sheetPath = "xl/" + relMatch[1].replace(/^\/?/, "");
    const sheetFileName = sheetPath.split("/").pop();
    const sheetRelsPath = sheetPath.replace(/worksheets\/[^/]+$/, `worksheets/_rels/${sheetFileName}.rels`);
    const sheetRelsFile = zip.file(sheetRelsPath);
    if (!sheetRelsFile) return result;

    const sheetRelsXml = await sheetRelsFile.async("string");
    const drawingRelMatch = sheetRelsXml.match(/<Relationship[^>]*Target="([^"]*drawing[^"]*)"/);
    if (!drawingRelMatch) return result;
    const drawingFileName = drawingRelMatch[1].split("/").pop();
    const drawingPath = "xl/drawings/" + drawingFileName;
    const drawingFile = zip.file(drawingPath);
    if (!drawingFile) return result;
    const drawingXml = await drawingFile.async("string");

    const drawingRelsPath = `xl/drawings/_rels/${drawingFileName}.rels`;
    const drawingRelsFile = zip.file(drawingRelsPath);
    const drawingRelsXml = drawingRelsFile ? await drawingRelsFile.async("string") : "";
    const ridToMedia = {};
    const relRe = /<Relationship[^>]*Id="(rId\d+)"[^>]*Target="([^"]+)"/g;
    let relM;
    while ((relM = relRe.exec(drawingRelsXml))) {
      ridToMedia[relM[1]] = "xl/media/" + relM[2].split("/").pop();
    }

    const anchorRe = /<[\w]*:?(?:two|one)CellAnchor[\s\S]*?<\/[\w]*:?(?:two|one)CellAnchor>/g;
    let anchorMatch;
    while ((anchorMatch = anchorRe.exec(drawingXml))) {
      const block = anchorMatch[0];
      const rowMatch = block.match(/<[\w]*:?from>[\s\S]*?<[\w]*:?row>(\d+)<\/[\w]*:?row>/) || block.match(/<[\w]*:?row>(\d+)<\/[\w]*:?row>/);
      const embedMatch = block.match(/r:embed="(rId\d+)"/) || block.match(/[\w]*:embed="(rId\d+)"/);
      if (!rowMatch || !embedMatch) continue;
      const rowIdx = Number(rowMatch[1]);
      const mediaPath = ridToMedia[embedMatch[1]];
      if (!mediaPath || !zip.file(mediaPath)) continue;
      const ext = mediaPath.split(".").pop().toLowerCase();
      const mime = ext === "jpg" ? "jpeg" : ext;
      if (!["png", "jpeg", "gif", "bmp"].includes(mime)) continue;
      const base64 = await zip.file(mediaPath).async("base64");
      const rawDataUrl = `data:image/${mime};base64,${base64}`;
      result[rowIdx] = await compressDataUrl(rawDataUrl, 250 * 1024);
    }
  } catch (e) {
    console.error("엑셀 내 이미지 추출 실패:", e);
  }
  return result;
}

async function parseQuoteWorkbook(workbook, zip) {
  const sheetNames = workbook.SheetNames;
  const findSheet = (...keywords) => sheetNames.find((n) => keywords.some((k) => n.includes(k)));
  const proposalSheetName = findSheet("제안서(원화)", "제안서", "원화");
  const sourcingSheetName = findSheet("가격조사");
  const pricingSheetName = findSheet("제안가격");

  const toRows = (name) => {
    if (!name) return [];
    const ws = workbook.Sheets[name];
    return XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
  };

  const proposalRows = toRows(proposalSheetName);
  const sourcingRows = toRows(sourcingSheetName);
  const pricingRows = toRows(pricingSheetName);

  const clientName = extractClientFromFixedCell(proposalRows) || extractClientFromDuiXia(proposalRows);
  const proposalDate = extractProposalDateFromFixedCell(proposalRows);
  const pricingSummary = extractPricingSummary(pricingRows);

  const proposalImageMap = zip ? await extractSheetImages(zip, workbook, proposalSheetName) : {};
  const sourcingImageMap = zip ? await extractSheetImages(zip, workbook, sourcingSheetName) : {};
  let items = extractProposalItems(proposalRows, proposalImageMap);
  const sourcingMap = extractSourcingMap(sourcingRows, sourcingImageMap);
  const proposalPriceMap = extractProposalPriceMap(pricingRows);
  if (items.length > 0) {
    // 품명 정확일치 실패에 대비한 견고한 매칭: 1) 정확일치 -> 2) 공백/기호 제거 정규화 일치 ->
    // 3) 품목이 1건이고 가격조사 행도 1건뿐이면(단일 제품 견적서에서 흔함) 무조건 그 1건을 매칭
    const normKey = (s) => String(s || "").replace(/\s+/g, "").replace(/[()（）\-_/]/g, "");
    const sourcingKeys = Object.keys(sourcingMap);
    const normalizedSourcingMap = {};
    sourcingKeys.forEach((k) => { normalizedSourcingMap[normKey(k)] = sourcingMap[k]; });
    const normalizedPriceMap = {};
    Object.keys(proposalPriceMap).forEach((k) => { normalizedPriceMap[normKey(k)] = proposalPriceMap[k]; });
    const findSrc = (name) => {
      if (sourcingMap[name]) return sourcingMap[name];
      const byNorm = normalizedSourcingMap[normKey(name)];
      if (byNorm) return byNorm;
      if (items.length === 1 && sourcingKeys.length === 1) return sourcingMap[sourcingKeys[0]];
      return null;
    };
    const findProposalPrice = (name) => proposalPriceMap[name] || normalizedPriceMap[normKey(name)] || 0;
    items = items.map((it) => {
      const src = findSrc(it.name);
      const merged = !src ? { ...it } : {
        ...it,
        rmbCost: src.rmbCost || it.rmbCost, factory: src.factory, factoryLink: src.factoryLink,
        companyHomepageLink: src.companyHomepageLink || "",
        quantity: it.quantity || src.quantity || 0, // "제안서" 시트에 수량이 없으면 "가격조사" 시트 수량(MOQ)으로 보강
        shippingRmb: src.shippingRmb || 0,
        cbm: it.cbm || src.cbm || 0,
        specSize: it.specSize || src.specSize || "", material: it.material || src.material || "",
        image: it.image || src.image || "",
        leadTimeDays: it.leadTimeDays || src.leadTimeDays || null,
        printFinishNote: it.printFinishNote || src.printFinishNote || "",
        sourcingNote: src.note || "", // "가격조사" 시트 비고란 전체 원문(줄바꿈 포함) — 제품DB의 "제작기타사항(C)"에 그대로 저장하기 위함
      };
      if (!merged.unitPrice) merged.unitPrice = findProposalPrice(it.name); // 제안서 시트에 단가가 비어있으면 "제안가격" 시트 M열로 보강
      return merged;
    });
  } else {
    // 제안서 시트 인식 실패시 가격조사 시트 자체를 폴백 품목 출처로 사용
    items = extractItemsFromRows(sourcingRows);
  }

  const totalAmount = items.reduce((s, it) => s + (it.totalPrice || 0), 0);
  const factories = Array.from(new Set(items.map((i) => i.factory).filter(Boolean)));
  const factoryLinks = {};
  const factoryHomepages = {};
  items.forEach((i) => {
    if (i.factory && i.factoryLink) factoryLinks[i.factory] = i.factoryLink;
    if (i.factory && i.companyHomepageLink) factoryHomepages[i.factory] = i.companyHomepageLink;
  });

  return { clientName, proposalDate, totalAmount, items, factories, factoryLinks, factoryHomepages, pricingSummary, sheetNames };
}



function parseCsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim() !== "");
  if (lines.length === 0) return [];
  const parseLine = (line) => {
    const cells = [];
    let cur = "", inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === "," && !inQuotes) { cells.push(cur); cur = ""; }
      else { cur += ch; }
    }
    cells.push(cur);
    return cells.map((c) => c.trim());
  };
  const header = parseLine(lines[0]);
  return lines.slice(1).map((line) => {
    const cells = parseLine(line);
    const row = {};
    header.forEach((h, i) => { row[h] = cells[i] || ""; });
    return row;
  });
}
function pickField(row, aliases) {
  const keys = Object.keys(row);
  for (const alias of aliases) {
    const found = keys.find((k) => k.toLowerCase().replace(/\s/g, "") === alias.toLowerCase().replace(/\s/g, ""));
    if (found) return row[found];
  }
  return "";
}

/* ===================== 박스히어로(BoxHero) HTML 일괄 다운로드 파서 ===================== */
function parseBoxHeroHtml(htmlText) {
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  const table = doc.querySelector("table");
  if (!table) return [];
  const headerCells = Array.from(table.querySelectorAll("thead th"));
  const headers = headerCells.map((th) => th.textContent.replace(/\s+/g, " ").trim());
  const rows = Array.from(table.querySelectorAll("tbody tr"));
  return rows.map((tr) => {
    const cells = Array.from(tr.querySelectorAll("td"));
    const row = {};
    headers.forEach((h, i) => {
      const cell = cells[i];
      if (!cell) { row[h] = ""; return; }
      const img = cell.querySelector("img");
      row[h] = img ? (img.getAttribute("src") || "") : cell.textContent.replace(/\s+/g, " ").trim();
    });
    return row;
  });
}
function extractNumber(str) {
  if (!str) return 0;
  const m = String(str).match(/\d+(\.\d+)?/);
  return m ? Number(m[0]) : 0;
}
// "3천개", "1만개", "500개", "3,000개" 등 한글 단위가 섞인 수량 텍스트에서 실제 개수를 숫자로 추출
// "(1만개기준)", "(5겹은 원단을...)" 같은 괄호 안 부연설명 때문에 숫자를 잘못 집어내는 문제를 막기 위해
// 괄호(반각/전각 모두) 안의 텍스트를 먼저 제거한 뒤 숫자를 찾는다.
function stripParens(text) {
  return String(text || "").replace(/[\(（][^\)）]*[\)）]/g, " ");
}
function extractKoreanQuantity(text) {
  if (!text) return null;
  const t = stripParens(text).replace(/,/g, "");
  let m = t.match(/(\d+(?:\.\d+)?)\s*만/);
  if (m) return Math.round(parseFloat(m[1]) * 10000);
  m = t.match(/(\d+(?:\.\d+)?)\s*천/);
  if (m) return Math.round(parseFloat(m[1]) * 1000);
  m = t.match(/(\d+(?:\.\d+)?)/);
  return m ? Math.round(parseFloat(m[1])) : null;
}
// "약 10일", "10 days" 등에서 리드타임 일수만 숫자로 추출
function extractLeadTimeDays(text) {
  if (!text) return null;
  const m = String(text).match(/(\d+(?:\.\d+)?)\s*(일|days?)/i);
  return m ? Math.round(parseFloat(m[1])) : null;
}
// 박스히어로 가격/운송료 필드는 "(1만개기준) 1.21 위안"처럼 수량 설명이 괄호로 앞에 붙는 경우가 많아
// 그냥 첫 숫자를 뽑으면 "1만개"의 "1"을 잘못 집어낸다. 괄호 안 텍스트를 먼저 제거한 뒤 숫자를 찾는다.
// (여러 구간이 "/"로 나열된 경우엔 첫 번째 구간 값을 대표값으로 사용 — 전체 원문은 별도 필드에 그대로 보존됨)
function extractPriceOutsideParens(text) {
  if (!text) return 0;
  const stripped = stripParens(text);
  const m = stripped.match(/\d+(\.\d+)?/);
  if (m) return Number(m[0]);
  return extractNumber(text);
}
// SKU-XXXXXXXX 형태의 토큰을 텍스트(파일명 등)에서 추출 (박스히어로 업로드, ZIP 일괄업로드 공용)
function extractSkuToken(text) {
  const m = String(text || "").match(/SKU-[A-Za-z0-9]+/i);
  return m ? m[0].toUpperCase() : null;
}
// 세그먼트 텍스트의 괄호 "안" 내용에서 수량을 추출 — 예: "(5천개기준) 약 1 CBM"에서 "5천개기준"만 뽑아 "천" 단위를 정확히 인식.
// (괄호를 통째로 제거해버리면 "5천개기준" 자체가 사라져서 수량을 못 뽑는 실수를 방지하기 위한 전용 함수)
function extractQtyFromSegment(segment) {
  const m = String(segment || "").match(/[\(（]([^\)）]*)[\)）]/);
  const inside = m ? m[1] : segment;
  return extractKoreanQuantity(inside);
}
// (C)제품예상부피/(C)중국내운송료/(C)공장단가 텍스트에 "/"로 구분된 여러 수량 구간이 있으면
// (예: "(5천개기준) 약 1 CBM / (1만개기준) 약 2 CBM") 구간별로 각각 파싱해서 별도 행(tier)을 생성.
// 세 필드 중 어느 하나라도 "/"가 있으면 다중구간으로 보고, 같은 순번끼리 짝지어 매핑한다(필드별 구간개수가 다르면 그 필드의 마지막 구간값을 재사용).
function buildMultiTierPriceRows(cbmRaw, shippingRaw, priceRaw, fallbackQty) {
  const splitSeg = (raw) => String(raw || "").split("/").map((s) => s.trim()).filter(Boolean);
  const cbmSegs = splitSeg(cbmRaw);
  const shipSegs = splitSeg(shippingRaw);
  const priceSegs = splitSeg(priceRaw);
  const maxLen = Math.max(cbmSegs.length, shipSegs.length, priceSegs.length);
  if (maxLen <= 1) return null; // 다중 구간이 아니면 null 반환(호출부에서 기존 단일구간 로직 사용)
  const pick = (segs, i) => segs[i] || segs[segs.length - 1] || "";
  const rows = [];
  for (let i = 0; i < maxLen; i++) {
    const cbmSeg = pick(cbmSegs, i), shipSeg = pick(shipSegs, i), priceSeg = pick(priceSegs, i);
    const qty = extractQtyFromSegment(cbmSeg) || extractQtyFromSegment(shipSeg) || extractQtyFromSegment(priceSeg) || fallbackQty || "";
    rows.push({
      qty,
      cbm: extractPriceOutsideParens(cbmSeg) || "",
      shippingRmb: extractPriceOutsideParens(shipSeg) || "",
      factoryPriceRmb: extractPriceOutsideParens(priceSeg) || "",
    });
  }
  return rows;
}

function boxHeroRowsToProducts(rows) {
  return rows.map((row) => {
    const name = pickField(row, ["제품명"]);
    if (!name) return null;
    const moqText = pickField(row, ["(K)최소제작수량"]);
    const leadTimeText = pickField(row, ["(K)예상제작기간"]);
    const cbmText = pickField(row, ["(C)제품예상부피"]);
    const cbmNumber = extractPriceOutsideParens(cbmText); // "(1만개기준) 약 1 CBM" 같은 텍스트에서도 순수 숫자(1)만 정확히 추출
    const shippingRaw = pickField(row, ["(C)중국내운송료"]);
    const priceRaw = pickField(row, ["(C)공장단가"]);
    const totalShippingRmb = extractPriceOutsideParens(shippingRaw);
    const rmbCost = extractPriceOutsideParens(priceRaw);
    const moqQuantity = extractKoreanQuantity(moqText);
    const leadTimeDays = extractLeadTimeDays(leadTimeText);
    const rec = {
      name,
      sku: pickField(row, ["SKU"]),
      barcode: pickField(row, ["바코드"]),
      stockQuantity: pickField(row, ["재고수량", "재고", "Stock", "stock"]),
      specSize: pickField(row, ["(K)제품사이즈"]),
      material: pickField(row, ["(K)제품재질"]),
      image: pickField(row, ["사진"]),
      // (K) 고객 제안용 항목
      fillMethod: pickField(row, ["(K)충진방식"]),
      capacity: pickField(row, ["(K)제품용량"]),
      composition: pickField(row, ["(K)제품구성"]),
      moqText, moqQuantity, // moqQuantity: 텍스트에서 추출한 숫자(예: "3천개" -> 3000) — 1단계 수량 기본값/수량별단가에 사용
      leadTimeText, leadTimeDays, // leadTimeDays: "약 10일" -> 10
      proposalPriceBasis: pickField(row, ["(K)제안가격기준"]),
      containerPrintPriceK: pickField(row, ["(K)용기인쇄가격"]),
      containerFinishPriceK: pickField(row, ["(K)용기후가공가격"]),
      capPrintPriceK: pickField(row, ["(K)캡 /뚜껑인쇄가격", "(K)캡/뚜껑인쇄가격"]),
      capFinishPriceK: pickField(row, ["(K)캡 /뚜껑후가공가격", "(K)캡/뚜껑후가공가격"]),
      otherFinishPriceK: pickField(row, ["(K)기타후가공가격"]),
      otherOptionK: pickField(row, ["(K)기타옵션"]),
      proposalNotesK: pickField(row, ["(K)제안기타사항"]),
      ctSamplePriceK: pickField(row, ["(K)CT생산샘플가격"]),
      premoldCode: pickField(row, ["(K)프리몰드품번"]),
      cosmepackCode: pickField(row, ["(K)코스메팩품번"]),
      // (C) 중국 공장/원가 항목
      factory: pickField(row, ["(C)중국공장명"]),
      factoryLink: pickField(row, ["(C)제품URL"]),
      wechatGroup: pickField(row, ["(C)위쳇단체방이름"]),
      availableVolumeC: pickField(row, ["(C)제품제공가능용량"]),
      cbmText,
      totalShippingRmb,
      shippingText: shippingRaw,
      rmbCost,
      factoryPriceNote: pickField(row, ["(C)공장단가설명"]),
      containerPrintPriceC: pickField(row, ["(C)용기인쇄단가"]),
      containerFinishPriceC: pickField(row, ["(C)용기후가공단가"]),
      capPrintPriceC: pickField(row, ["(C)캡/뚜껑인쇄단가"]),
      capFinishPriceC: pickField(row, ["(C)캡/뚜껑후가공단가"]),
      otherFinishPriceC: pickField(row, ["(C)기타후가공단가"]),
      otherOptionC: pickField(row, ["(C)기타옵션"]),
      productionNotesC: pickField(row, ["(C)제작기타사항"]),
      ctSampleC: pickField(row, ["(C)CT생산샘플"]),
      lastUnitPrice: extractNumber(pickField(row, ["(K)제안가격"])) || 0,
      // 원본 전체 (테이블 헤더 그대로) — 화면에 없는 항목까지 전부 보존
      raw: row,
    };
    // "/"로 구분된 다중 수량구간이 있으면 구간별로 여러 행을 생성, 없으면 기존처럼 MOQ+공장단가 기준 단일 구간 하나만 생성
    const multiTiers = buildMultiTierPriceRows(cbmText, shippingRaw, priceRaw, moqQuantity);
    if (multiTiers) {
      rec.priceTiers = multiTiers;
    } else if (moqQuantity && rmbCost) {
      rec.priceTiers = [{ qty: moqQuantity, cbm: cbmNumber || "", shippingRmb: totalShippingRmb || "", factoryPriceRmb: rmbCost }];
    }
    return rec;
  }).filter(Boolean);
}

const CATEGORIES = [
  "PE튜브(2겹)", "PE튜브(5겹)", "라미튜브", "드로퍼튜브", "기능성튜브",

  "용기소포자재", "단상자", "싸바리", "쇼핑백", "기타자재",
];

// 제품명 "[코스메팩] 유리용기 / 크림용기 / ..." 형태에서 대괄호 뒤 첫 " / " 구간을 카테고리로 우선 매칭.
// 그래도 못 찾으면(엑셀 품명/비고에 카테고리명이 그냥 섞여 들어간 경우 등) extraText까지 합쳐서
// 전체 텍스트 어디에든 카테고리명이 포함돼 있는지 폴백으로 검사한다.
function guessCategoryFromName(name, extraText) {
  if (!name) return "";
  const withoutBracket = name.replace(/^\s*\[[^\]]*\]\s*/, ""); // 맨앞 [코스메팩] 등 제거
  const firstSegment = withoutBracket.split("/")[0].trim();
  const norm = (s) => s.replace(/\s/g, "");
  if (firstSegment) {
    // 1) 완전일치
    const exact = CATEGORIES.find((c) => c === firstSegment);
    if (exact) return exact;
    // 2) 포함관계(양방향) — 공백 제거 후 비교하여 표기 차이 허용
    const nSeg = norm(firstSegment);
    const partial = CATEGORIES.find((c) => norm(c) === nSeg || nSeg.includes(norm(c)) || norm(c).includes(nSeg));
    if (partial) return partial;
  }
  // 3) 폴백: 품명 전체 + 비고(extraText) 어디에든 카테고리명이 그대로 포함돼 있으면 그걸로 인식
  const fullText = norm(`${name} ${extraText || ""}`);
  const contained = CATEGORIES.find((c) => fullText.includes(norm(c)));
  return contained || "";
}

const FINISH_KEYWORDS = ["실크 1도", "실크1도", "실크 2도", "실크2도", "유광", "무광", "조색", "금박", "은박", "핫스탬핑", "UV코팅"];

// ===== 후가공 단가 분석 리포트 =====
// 1) 기준정보에 등록된 후가공 마스터데이터를 카테고리+후가공명 기준으로 집계(중복 등록/누락 점검용)
function buildFinishingMasterReport(finishingOptions) {
  const groups = {};
  Object.entries(finishingOptions || {}).forEach(([category, list]) => {
    (list || []).forEach((f) => {
      const key = `${category}__${f.name || "(이름없음)"}`;
      if (!groups[key]) groups[key] = { category, name: f.name || "(이름없음)", rmbList: [], krwList: [], optionType: f.optionType, unitLabel: f.unitLabel };
      groups[key].rmbList.push(Number(f.rmbPrice) || 0);
      groups[key].krwList.push(Number(f.krwPrice) || 0);
    });
  });
  const avg = (arr) => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
  return Object.values(groups).map((g) => ({
    category: g.category, name: g.name, count: g.rmbList.length,
    avgRmb: avg(g.rmbList), avgKrw: avg(g.krwList),
    note: (g.optionType === "variable" ? `가변(${g.unitLabel || "단위없음"})` : "고정단가") + (g.rmbList.length > 1 ? " · 중복등록 확인필요" : ""),
  })).sort((a, b) => a.category.localeCompare(b.category, "ko") || a.name.localeCompare(b.name, "ko"));
}
// 2) 제품 비고 텍스트(otherOptionK/otherOptionC/productionNotesC/proposalNotesK)에서 후가공 키워드+인접 가격을 최선추정으로 추출(부정확할 수 있음)
const FINISHING_TEXT_SCAN_KEYWORDS = ["실크인쇄", "핫스탬핑", "무광 코팅", "무광코팅", "유광", "조색", "금박", "은박", "UV코팅", "라벨", "코팅", "인쇄"];
function extractFinishingMentionsFromText(text) {
  const found = [];
  if (!text) return found;
  FINISHING_TEXT_SCAN_KEYWORDS.forEach((kw) => {
    const idx = text.indexOf(kw);
    if (idx < 0) return;
    const window = text.slice(Math.max(0, idx - 10), idx + 50);
    const rmbMatch = window.match(/(\d+(?:\.\d+)?)\s*위안/);
    const krwMatch = window.match(/(\d+(?:\.\d+)?)\s*원/);
    found.push({ name: kw, rmbPrice: rmbMatch ? Number(rmbMatch[1]) : null, krwPrice: krwMatch ? Number(krwMatch[1]) : null });
  });
  return found;
}
function buildFinishingTextReport(products) {
  const groups = {};
  (products || []).forEach((p) => {
    const category = p.category || "(카테고리 미지정)";
    const text = [p.otherOptionK, p.otherOptionC, p.productionNotesC, p.proposalNotesK].filter(Boolean).join(" ");
    extractFinishingMentionsFromText(text).forEach((m) => {
      const key = `${category}__${m.name}`;
      if (!groups[key]) groups[key] = { category, name: m.name, rmbList: [], krwList: [], count: 0 };
      groups[key].count++;
      if (m.rmbPrice != null) groups[key].rmbList.push(m.rmbPrice);
      if (m.krwPrice != null) groups[key].krwList.push(m.krwPrice);
    });
  });
  const avg = (arr) => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
  return Object.values(groups).map((g) => ({
    category: g.category, name: g.name, count: g.count,
    avgRmb: avg(g.rmbList), avgKrw: avg(g.krwList),
    note: g.rmbList.length === 0 && g.krwList.length === 0 ? "언급만 있고 단가 텍스트는 못 찾음" : "제품 비고 텍스트 추출(부정확할 수 있음)",
  })).sort((a, b) => b.count - a.count);
}

// 병합 비교용 제품 카드 — 📦제품관리 카드뷰와 동일한 포맷(썸네일/제품명/카테고리배지/규격·재질/태그)으로 좌우 나란히 비교할 수 있게 렌더링

function ManualMergeModal({ items, products, factories, onMerge, onUpdateProduct, onClose }) {
  const [picks, setPicks] = useState({}); // { excelProductId: 선택된 boxHeroProductId }
  const boxHeroCandidates = (products || []).filter((p) => p.source !== "excel");
  const [remaining, setRemaining] = useState(items || []);
  const [expandedId, setExpandedId] = useState(null); // 제품명 클릭시 1:1 상세비교카드가 펼쳐진 행
  const [editingProduct, setEditingProduct] = useState(null); // 왼쪽 원본 카드 클릭시 여는 제품수정 팝업
  const doMerge = async (excelId) => {
    const boxId = picks[excelId];
    if (!boxId) return;
    await onMerge(excelId, boxId);
    setRemaining((prev) => prev.filter((p) => p.id !== excelId));
  };
  // 원본 제품을 수정하고 저장하면 — 그 즉시 이 제품은 정리가 끝난 것으로 보고 수동병합 대기 목록에서 빼준다(모달은 닫지 않고 계속 이어서 작업 가능).
  const handleSaveOriginalProduct = async (id, patch) => {
    await onUpdateProduct(id, patch);
    setRemaining((prev) => prev.filter((p) => p.id !== id));
    setEditingProduct(null);
    setExpandedId(null);
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "900px", height: "85vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">🔗 박스히어로 제품 수동 병합 ({remaining.length}건 남음)</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-5 overflow-y-auto flex-1">
          <p className="text-xs text-slate-500 mb-4">SKU/바코드도 없고 제품명+규격이 정확히 일치하는 박스히어로 제품도 못 찾은 항목들입니다. 아래에서 직접 매칭할 박스히어로 제품을 골라 병합해주세요. 제품명을 클릭하면 1:1 상세 비교 카드가 펼쳐지고, 왼쪽 원본 카드를 클릭하면 제품 정보를 바로 수정할 수 있습니다.</p>
          {remaining.length === 0 ? (
            <p className="text-xs text-slate-400 text-center py-10">남은 항목이 없습니다. 🎉</p>
          ) : (
            <div className="space-y-2">
              {remaining.map((p) => {
                const pickedCandidate = boxHeroCandidates.find((b) => b.id === picks[p.id]);
                const isExpanded = expandedId === p.id;
                return (
                  <div key={p.id} className="border border-slate-200 rounded-lg overflow-hidden">
                    <div className="flex items-center gap-2 p-3">
                      <div className="flex-1 min-w-0">
                        <button onClick={() => setExpandedId(isExpanded ? null : p.id)} className="text-sm font-medium text-slate-800 hover:text-[#1E3A8A] hover:underline truncate text-left">
                          {p.name} <span className="text-slate-300 text-xs">{isExpanded ? "▲" : "▼"}</span>
                        </button>
                        <div className="text-xs text-slate-400 truncate">{p.specSize || "규격 미상"}</div>
                      </div>
                      <select
                        value={picks[p.id] || ""}
                        onChange={(e) => setPicks((prev) => ({ ...prev, [p.id]: e.target.value }))}
                        className="text-xs px-2 py-1.5 rounded border border-slate-200 outline-none focus:border-[#1E3A8A] max-w-[260px]"
                      >
                        <option value="">박스히어로 제품 선택...</option>
                        {boxHeroCandidates.map((b) => <option key={b.id} value={b.id}>{b.name} {b.sku ? `(${b.sku})` : ""}</option>)}
                      </select>
                      <MergeCandidateThumb product={pickedCandidate} />
                      <button onClick={() => doMerge(p.id)} disabled={!picks[p.id]} className="text-xs px-3 py-1.5 rounded-lg bg-[#1E3A8A] text-white font-medium disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap">병합</button>
                    </div>
                    {isExpanded && (
                      <div className="grid grid-cols-2 gap-3 p-3 pt-0 bg-slate-50/50">
                        <div onClick={() => onUpdateProduct && setEditingProduct(p)} className={onUpdateProduct ? "cursor-pointer" : ""} title={onUpdateProduct ? "클릭하면 이 제품 정보를 바로 수정할 수 있습니다" : ""}>
                          <ProductCompareCard product={p} label="📋 원본 제품 (엑셀/제품 DB) — 클릭해서 수정" accent="border-slate-200 bg-white hover:border-[#1E3A8A]/50 transition-colors" />
                        </div>
                        <ProductCompareCard product={pickedCandidate} label="📦 박스히어로 후보" accent="border-[#1E3A8A]/30 bg-white" />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
      {editingProduct && (
        <ProductEditModal
          product={editingProduct} factories={factories}
          onClose={() => setEditingProduct(null)}
          onSave={handleSaveOriginalProduct}
        />
      )}
    </div>
  );
}

// "[코스메팩] 재질/용기종류 / 노즐·인서트형태(있으면) / 캡형태(있으면) / 사이즈·규격(있으면) / 용량·중량(있으면) / 후가공·특이사항(있으면)" 순서로 재조합
// 출처: "제안서(원화)" 시트의 [제품명] + [재원] + [비고] 텍스트를 모두 합쳐서 파싱한다.

// 1) 재질/용기종류 — "크림용기"/"로션용기"처럼 이미 완성된 합성어가 있으면 그대로 쓰고,
// 없으면 재질명(PE/라미/AS 등) 단독 추출 후 문맥(튜브/용기/ABL/PBL)으로 용기 형태를 추론해서 합성한다.
const DISPLAY_MATERIAL_KEYWORDS = ["PETG", "PET", "PP", "PE", "PS", "AS", "라미", "유리", "아크릴", "에어리스"];
const TUBE_TYPE_HINT_WORDS = ["ABL", "PBL"]; // 재질명은 아니지만 "튜브" 형태를 암시하는 기술용어
function parseMaterialAndType(text) {
  // 이미 완성된 용기종류 합성어(크림용기, 로션용기 등)가 있으면 재질 추론 없이 그대로 사용
  const compound = extractFirstKeyword(text, CONTAINER_TYPE_KEYWORDS.filter((k) => k !== "튜브"));
  if (compound) return compound;
  const material = extractFirstKeyword(text, DISPLAY_MATERIAL_KEYWORDS);
  if (!material) return "";
  if (material === "에어리스") return "에어리스용기"; // 이미 그 자체로 완결된 용기 종류
  let type;
  if (text.includes("튜브")) type = "튜브";
  else if (text.includes("용기")) type = "용기";
  else if (TUBE_TYPE_HINT_WORDS.some((w) => text.includes(w))) type = "튜브";
  else type = (material === "라미" || material === "PE") ? "튜브" : "용기"; // 라미/PE는 튜브가 더 흔한 기본값
  return `${material}${type}`;
}

// 2) 노즐/인서트/기능 — "노즐: 단노즐(선크림)형"처럼 라벨+상세문구가 있으면 그 문구를 통째로 살리고,
// 라벨이 없으면 단노즐/드로퍼/펌프/스파출라/에어리스 같은 단독 키워드로 대체
function parseNozzleOrInsert(text) {
  let m = text.match(/노즐\s*[:：]\s*([^\n/]+)/);
  if (m) return m[1].trim();
  m = text.match(/인서트\s*[:：]\s*([^\n/]+)/);
  if (m) return m[1].trim();
  return extractFirstKeyword(text, ["단노즐", "이중노즐", "드로퍼", "펌프", "스파출라", "에어리스", "오리피스"]) || "";
}

// 3) 캡 형태 — "타원형캡"/"원통형캡"/"탈부착캡"처럼 완성된 캡 명칭을 우선 찾고,
// 없으면 "캡: ABS" 같은 라벨+재질 패턴을 "ABS캡" 형태로 조합
const CAP_SHAPE_KEYWORDS = ["타원형캡", "원통형캡", "탈부착캡", "원터치캡", "스크류캡", "플립캡", "디스크캡"];
function parseCapShape(text) {
  const compound = extractFirstKeyword(text, CAP_SHAPE_KEYWORDS);
  if (compound) return compound;
  const m = text.match(/캡\s*[:：]\s*([A-Za-z0-9가-힣]+)/);
  if (!m) return "";
  return m[1].endsWith("캡") ? m[1] : `${m[1]}캡`;
}

// 4) 사이즈/규격 — "19파이"/"25파이" 같은 파이 표기, "64*53.5mm"처럼 가로*세로 mm 표기, 단일 mm 표기를 순서대로 시도
function parseSizeSpec(text) {
  let m = text.match(/(\d+(?:\.\d+)?\s*[*×xX]\s*\d+(?:\.\d+)?\s*mm)/i);
  if (m) return m[1].replace(/\s+/g, "");
  m = text.match(/(\d+(?:\.\d+)?)\s*파이/);
  if (m) return `${m[1]}파이`;
  m = text.match(/(\d+(?:\.\d+)?)\s*mm\b/i);
  if (m) return `${m[1]}mm`;
  return "";
}

// 5) 후가공/특이사항 — "후가공: 은박용기 은박캡"처럼 라벨+상세문구가 있으면 그대로 살리고,
// 없으면 무광/유광/실크인쇄/은박/금박/사출 등 키워드를 모아 공백으로 이어붙임
const FINISH_NOTE_KEYWORDS = ["무광 코팅", "무광코팅", "실크 인쇄", "실크인쇄", "은박", "금박", "사출", "유광", "조색", "핫스탬핑", "UV코팅"];
function parseFinishNote(text) {
  const m = text.match(/후가공\s*[:：]\s*([^\n/]+)/);
  if (m) return m[1].trim();
  const found = extractAllKeywords(text, FINISH_NOTE_KEYWORDS);
  return found.length > 0 ? found.join(" ") : "";
}

// "제안서(원화)" 시트의 [제품명]+[재원]+[비고]를 모두 합쳐서 파싱하고 코스메팩 표준 형식으로 재조합.
// 재질/용기종류를 전혀 인식하지 못하면(정보가 너무 부족하면) "[코스메팩] 50g"처럼 껍데기만 남는 걸 막기 위해 원본 품명을 그대로 유지한다.
function buildStandardProductName(rawName, specText, noteText) {
  const text = `${rawName || ""} ${specText || ""} ${noteText || ""}`;
  const material = parseMaterialAndType(text);
  if (!material) return (rawName || "").trim(); // 재질/용기종류를 못 찾으면 원본 품명 그대로(안전장치)
  const nozzle = parseNozzleOrInsert(text);
  const cap = parseCapShape(text);
  const size = parseSizeSpec(text);
  const capacity = extractCapacityToken(text) || "";
  const finish = parseFinishNote(text);
  const parts = [material, nozzle, cap, size, capacity, finish].filter(Boolean); // 빈 항목은 자동으로 걸러져 슬래시 중복/공백이 남지 않음
  return parts.join(" / ");
}

// 텍스트에서 용량(숫자+단위: ml/g/kg/L)을 추출 — 첫 매치만 사용
function extractCapacityToken(text) {
  const m = (text || "").match(/(\d+(?:\.\d+)?)\s*(ml|mL|ML|g|kg|KG|L|l)\b/);
  if (!m) return null;
  return `${m[1]}${m[2].toLowerCase()}`;
}
function extractFirstKeyword(text, list) {
  const hay = text || "";
  for (const k of list) { if (hay.includes(k)) return k; }
  return null;
}
function extractAllKeywords(text, list) {
  const hay = text || "";
  return list.filter((k) => hay.includes(k));
}

// 제품 하나에서 [기본 그룹키(용량+용기형태)] + [재질/캡타입/후가공 태그]를 파싱.
// 이름/규격/재질/기타옵션 필드를 모두 훑어서 최대한 폭넓게 인식(저장 시점이 아니라 조회 시점에 매번 파싱하므로
// 기존에 저장된 제품에도 별도 마이그레이션 없이 즉시 적용됨).
function deriveProductAttributes(p) {
  const text = [p.name, p.specSize, p.composition, p.material, p.otherOptionK, p.otherOptionC, p.proposalNotesK, p.productionNotesC].filter(Boolean).join(" ");
  const capacity = extractCapacityToken(text);
  const containerType = extractFirstKeyword(text, CONTAINER_TYPE_KEYWORDS);
  const baseGroupKey = capacity && containerType ? `${capacity} ${containerType}` : (containerType || capacity || null);
  return {
    baseGroupKey,
    capacity,
    containerType,
    materials: extractAllKeywords(text, MATERIAL_KEYWORDS),
    capTypes: extractAllKeywords(text, CAP_TYPE_KEYWORDS),
    finishes: extractAllKeywords(text, FINISH_KEYWORDS),
  };
}

// 옵션(후가공/인쇄) 관련 숫자 필드를 합산해 "기본단가 대비 옵션 추가금"을 근사 계산
function productOptionSurcharge(p) {
  const fields = ["containerPrintPriceK", "containerFinishPriceK", "capPrintPriceK", "capFinishPriceK", "otherFinishPriceK"];
  return fields.reduce((sum, f) => sum + (Number(p[f]) || 0), 0);
}

// 제품 목록 전체를 baseGroupKey 기준으로 그룹핑(2건 이상 묶인 그룹만 "유사군"으로 의미있음)
// 제품에 연결된 제안서 개수 계산 — proposalIds(정확한 ID기준, 신규 엑셀업로드부터 자동 연결됨)가 있으면 그걸 쓰고,
// 없는 옛날 제품(소급 동기화 전)은 기존처럼 제품명 매칭으로 폴백해서 0으로 잘못 보이지 않게 한다.
const SORT_OPTIONS_COMMON = [
  ["name_asc", "가나다순"], ["name_desc", "가나다 역순"], ["date_desc", "최신 등록순"], ["date_asc", "오래된순"],
];
// getName/getDate/getProposalCount는 각 뷰에서 자기 데이터 구조에 맞게 넘겨주는 콜백
function sortByKey(list, sortKey, getName, getDate, getProposalCount) {
  const arr = [...list];
  if (sortKey === "name_asc") arr.sort((a, b) => (getName(a) || "").localeCompare(getName(b) || "", "ko"));
  else if (sortKey === "name_desc") arr.sort((a, b) => (getName(b) || "").localeCompare(getName(a) || "", "ko"));
  else if (sortKey === "date_desc") arr.sort((a, b) => String(getDate(b) || "").localeCompare(String(getDate(a) || "")));
  else if (sortKey === "date_asc") arr.sort((a, b) => String(getDate(a) || "").localeCompare(String(getDate(b) || "")));
  else if (sortKey === "proposal_desc" && getProposalCount) arr.sort((a, b) => getProposalCount(b) - getProposalCount(a));
  else if (sortKey === "proposal_asc" && getProposalCount) arr.sort((a, b) => getProposalCount(a) - getProposalCount(b));
  return arr;
}

// "가격조사 > 기존 제품 DB에서 불러오기" 검색 — 쉼표/공백으로 구분된 여러 키워드를 모두 만족(AND)하는 제품만 추리고,
// 제품명 앞부분에 가까이 일치할수록/더 많은 필드에서 일치할수록 높은 점수를 매겨 유사도순으로 정렬한다.
// 검색어/제품명 양쪽에서 대괄호([ ])를 제거해 정규화 — "[코스메팩] 라미튜브..." 같은 접두어가 붙은 제품명도
// "코스메팩", "튜브" 같은 키워드로 정상 검색되도록 하기 위함(대괄호가 부분일치를 방해하는 케이스 방지)
// 검색어/제품명 양쪽에서 대괄호·소괄호·슬래시·하이픈을 제거해 정규화 — "[코스메팩]", "(선크림)", "PE/PP" 같은
// 특수문자가 섞인 제품명도 "코스메팩", "선크림", "PE" 같은 키워드로 정상 검색되도록 하기 위함
const stripBrackets = (s) => String(s || "").replace(/[\[\]\(\)\/-]/g, "");
function smartProductSearch(products, query) {
  const keywords = stripBrackets(query).split(/[,\s]+/).map((k) => k.trim().toLowerCase()).filter(Boolean);
  if (keywords.length === 0) return (products || []).slice(0, 8);
  const scored = [];
  (products || []).forEach((p) => {
    const name = stripBrackets(p.name || "").toLowerCase();
    // 검색범위: 제품명 + 카테고리 + 재질/규격 + 공장명 + SKU + 비고/사양(K/C 양쪽)까지 전부 포함(전부 대괄호 정규화된 상태로 비교)
    const haystack = stripBrackets([p.name, p.category, p.specSize, p.material, p.factory, p.sku, p.notes, p.proposalNotesK, p.productionNotesC, p.otherOptionK]
      .filter(Boolean).join(" ")).toLowerCase();
    const allMatch = keywords.every((k) => haystack.includes(k)); // AND 조건 — 키워드 전부 포함돼야 결과에 노출
    if (!allMatch) return;
    let score = 0;
    keywords.forEach((k) => {
      const idx = name.indexOf(k);
      if (idx === 0) score += 100; // 제품명 맨 앞에서 일치 = 가장 높은 점수
      else if (idx > 0) score += Math.max(10, 50 - idx); // 제품명 앞쪽에 가까울수록 가산
      else score += 10; // 제품명엔 없고 규격/SKU/비고 등 다른 필드에서만 일치
    });
    scored.push({ p, score });
  });
  scored.sort((a, b) => b.score - a.score); // 유사도(점수) 높은 순으로 정렬
  return scored.map((s) => s.p);
}

// ===== 엑셀 유입 제품(SKU/바코드 누락) ↔ 박스히어로 제품 병합 매칭 =====
const normalizeMatchKey = (s) => String(s || "").replace(/\s+/g, "").toLowerCase();
// 우선순위: 1) SKU/바코드 일치 → 2) 제품명+규격 완전일치(공백정제) → 없으면 null(수동매칭 대상)
function findBoxHeroMatch(excelProduct, allProducts) {
  const candidates = (allProducts || []).filter((p) => p.id !== excelProduct.id && p.source !== "excel");
  if (excelProduct.sku) {
    const bySku = candidates.find((p) => p.sku && normalizeMatchKey(p.sku) === normalizeMatchKey(excelProduct.sku));
    if (bySku) return bySku;
  }
  if (excelProduct.barcode) {
    const byBarcode = candidates.find((p) => p.barcode && normalizeMatchKey(p.barcode) === normalizeMatchKey(excelProduct.barcode));
    if (byBarcode) return byBarcode;
  }
  const nameKey = normalizeMatchKey(excelProduct.name) + "|" + normalizeMatchKey(excelProduct.specSize);
  const byName = candidates.find((p) => (normalizeMatchKey(p.name) + "|" + normalizeMatchKey(p.specSize)) === nameKey);
  return byName || null;
}

// 제안서 연결 드롭다운/라벨 공통 포맷: "[제안번호] 업체명 — 주요제품명 (재원/규격)"
function proposalOptionLabel(p) {
  const item = (p.items || [])[0];
  const productPart = item ? `${item.productName || ""}${item.specSize ? ` (${item.specSize})` : ""}`.trim() : "";
  return `[${p.code}] ${p.clientName}` + (productPart ? ` — ${productPart}` : "");
}

function getLinkedProposals(product, proposals) {
  if (product.proposalIds && product.proposalIds.length > 0) {
    const idSet = new Set(product.proposalIds);
    return (proposals || []).filter((p) => idSet.has(p.id));
  }
  return (proposals || []).filter((p) => (p.items || []).some((it) => it.productName === product.name));
}

function buildProductGroups(products) {
  const map = new Map();
  products.forEach((p) => {
    const attrs = deriveProductAttributes(p);
    const key = attrs.baseGroupKey;
    if (!key) return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push({ ...p, _attrs: attrs });
  });
  return map;
}

const EXRATE_CACHE_KEY = "cosmepack_exrate_cache";
const EXRATE_SAVED_KEY = "cosmepack_exrate_saved"; // 사용자가 직접 저장한 환율 + 저장일시
const PRICING_SETTINGS_KEY = "cosmepack_pricing_settings"; // 기준정보(물류비/마진율표/관세율/난이도차등율/로고) 저장용
// 기준정보 localStorage 캐시 — 최초 1회만 읽고 파싱해서 메모리 변수(_pricingSettingsCacheMemo)에 저장해두고,
// 이후 호출은 전부 그 메모리 값을 즉시 반환한다(반복적인 localStorage.getItem+JSON.parse 방지, 초기 렌더링 시 8곳에서 중복 파싱하던 문제 해결).
let _pricingSettingsCacheMemo;
function loadPricingSettingsCache() {
  if (_pricingSettingsCacheMemo !== undefined) return _pricingSettingsCacheMemo;
  try { _pricingSettingsCacheMemo = JSON.parse(localStorage.getItem(PRICING_SETTINGS_KEY) || "null"); } catch (e) { _pricingSettingsCacheMemo = null; }
  return _pricingSettingsCacheMemo;
}
// 저장(save) 시에는 반드시 이 함수로 메모리 캐시도 함께 갱신해야 한다 — 그렇지 않으면 저장 직후에도
// loadPricingSettingsCache()가 예전 값을 계속 돌려주게 된다.
function invalidatePricingSettingsCache(nextValue) {
  _pricingSettingsCacheMemo = nextValue;
}
// 무료 환율 API(open.er-api.com, CORS 제한 없음)로 CNY->KRW, CNY->USD, USD->KRW 중간환율을 가져와
// 은행 송금(전신환매도율) 기준 근사 우대환율을 계산한다. 실제 은행 고시환율과는 소폭 차이가 있을 수 있는 "추천값"이다.
async function fetchTodayExchangeRates() {
  const BANK_SPREAD = 0.015; // 전신환매도율 근사 스프레드(중간환율 대비 약 1.5% 차감) — 실제 우대율은 은행/시점마다 다름
  try {
    const [cnyRes, usdRes] = await Promise.all([
      fetch("https://open.er-api.com/v6/latest/CNY"),
      fetch("https://open.er-api.com/v6/latest/USD"),
    ]);
    const cnyData = await cnyRes.json();
    const usdData = await usdRes.json();
    if (cnyData.result !== "success" || usdData.result !== "success") throw new Error("환율 API 응답 오류");
    // API가 실제로 고시한 기준시각(time_last_update_unix)을 그대로 사용 — 없으면 지금 시각으로 폴백
    const unix = cnyData.time_last_update_unix || usdData.time_last_update_unix;
    const apiDate = unix ? new Date(unix * 1000) : new Date();
    const p = (n) => String(n).padStart(2, "0");
    const apiUpdatedAt = `${apiDate.getFullYear()}년 ${p(apiDate.getMonth() + 1)}월 ${p(apiDate.getDate())}일 ${p(apiDate.getHours())}:${p(apiDate.getMinutes())} 기준`;
    const rates = {
      rmbToKrw: Number((cnyData.rates.KRW * (1 - BANK_SPREAD)).toFixed(2)),
      rmbToUsd: Number(cnyData.rates.USD.toFixed(2)),
      usdToKrw: Number((usdData.rates.KRW * (1 - BANK_SPREAD)).toFixed(2)),
      updatedAt: todayDisplay(),
      apiUpdatedAt,
      fetchedDate: todayStr(),
    };
    try { localStorage.setItem(EXRATE_CACHE_KEY, JSON.stringify(rates)); } catch (e) { console.error(e); }
    return rates;
  } catch (e) {
    console.error("환율 API 조회 실패, 캐시된 마지막 환율로 대체:", e);
    try {
      const cached = JSON.parse(localStorage.getItem(EXRATE_CACHE_KEY) || "null");
      return cached;
    } catch (e2) { return null; }
  }
}
// 환율 값을 "천단위 콤마 + 소수점 둘째자리 고정" 형식으로 표기
function fmtRate(n) {
  return (Number(n) || 0).toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function todayStr() { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`; }

// 엑셀 파일명 맨 앞의 8자리 숫자(YYYYMMDD)를 날짜로 추출. 없거나 유효하지 않으면 null 반환 (호출부에서 오늘 날짜로 폴백)
function extractDateFromFileName(fileName) {
  const base = (fileName || "").trim();
  const m = base.match(/^(\d{8})/);
  if (!m) return null;
  const y = Number(m[1].slice(0, 4)), mo = Number(m[1].slice(4, 6)), d = Number(m[1].slice(6, 8));
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo - 1, d);
  if (isNaN(dt.getTime())) return null;
  return m[1];
}
function addDays(days) { const d = new Date(); d.setDate(d.getDate() + days); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
// 기준일(YYYY-MM-DD 문자열)로부터 N일 뒤를 같은 형식으로 반환 — 오늘이 아니라 "작성일자" 등 임의 기준일에서 계산할 때 사용
function addDaysFrom(baseDateStr, days) {
  const base = baseDateStr ? new Date(baseDateStr) : new Date();
  if (isNaN(base.getTime())) return addDays(days);
  base.setDate(base.getDate() + days);
  const p = (n) => String(n).padStart(2, "0");
  return `${base.getFullYear()}-${p(base.getMonth() + 1)}-${p(base.getDate())}`;
}
function nowDateTimeStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function todayDisplay() { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }

const won = (n) => "₩" + Math.round(n || 0).toLocaleString("ko-KR");
const rmb = (n) => "¥" + (n || 0).toLocaleString("ko-KR", { maximumFractionDigits: 2 });
const pct = (n) => (n || 0).toFixed(1) + "%";

function getMarginRate(marginTable, category, totalRmbAmount) {
  const rates = marginTable[category] || marginTable[CATEGORIES[0]];
  let idx = 0;
  for (let i = 0; i < MARGIN_TIER_BOUNDS.length; i++) { if (totalRmbAmount >= MARGIN_TIER_BOUNDS[i]) idx = i; }
  return rates[idx];
}

// 가변 수량/도수형 후가공을 선택 수량과 함께 자연스러운 문구로 변환.
// unitLabel(단위 명칭, 예: "도"/"개"/"회")이 등록돼 있으면 "이름 3도 포함" 형태로 바로 조합하고,
// 옛날 데이터라 unitLabel이 비어있으면 "OO 1도당" 같은 이름 속 패턴을 최선추정으로 찾아 대체한다.
// 후가공 이름에 이미 "포함"/"1도당"/"NN원 추가" 같은 문구가 섞여 들어있으면 제거해서 순수 명칭만 남긴다.
// (관리자가 옛 방식으로 "실크인쇄 1도당 30원 추가"처럼 등록해둔 이름이 있으면, 여기서 안 지우고 뒤에 " 3도 포함"을 또 붙이면
//  "실크인쇄 1도당 30원 추가 3도 포함"처럼 문구가 겹쳐버리는 버그가 있었음 — 이를 방지하기 위한 정제 단계)
function cleanFinishingBaseName(name) {
  let base = String(name || "").trim();
  base = base.replace(/\s*포함\s*$/g, ""); // 끝에 이미 붙어있는 "포함" 제거
  base = base.replace(/\d+(?:\.\d+)?\s*(?:도|개|회|장|겹)\s*당/g, ""); // "1도당" 같은 단위구간 표기 제거
  base = base.replace(/\d+(?:\.\d+)?\s*(?:원|위안)\s*(?:추가)?/g, ""); // "30원 추가" 같은 가격문구 제거
  return base.replace(/\s{2,}/g, " ").trim();
}

function describeFinishingSelection(f, qty) {
  const base = cleanFinishingBaseName(f.name);
  if (f.optionType === "variable") {
    const q = qty || 1;
    if (f.unitLabel) return `${base} ${q}${f.unitLabel} 포함`;
    // 단위명칭이 등록 안 된 옛 데이터 폴백: 이름 속 "OO 1도당" 패턴에서 단위를 추정
    const m = (f.name || "").match(/^(.*?)\s*1\s*(도|개|회|장|겹)\s*당(.*)$/);
    if (m) {
      const b2 = cleanFinishingBaseName(m[1] + m[3]);
      return `${b2} ${q}${m[2]} 포함`;
    }
    return `${base} ${q}회 포함`; // 단위명칭도 이름속 패턴도 없으면 "회"로 기본 표기(수량은 항상 노출)
  }
  return `${base} 포함`; // 고정 단가형: 수량 개념 없이 이름 그대로 + "포함"
}

// 미선택/별도안내 모드의 기본 안내문구 자동 생성: "{후가공명} 추가 선택 시 {단위당 단가} 가산"
function defaultFinishingGuideText(f) {
  if (f.guideText && f.guideText.trim()) return f.guideText.trim(); // 기준정보에 미리 등록해둔 안내문구가 있으면 그대로 사용
  const base = cleanFinishingBaseName(f.name);
  const priceText = `${won(f.krwPrice)}(${rmb(f.rmbPrice)})`;
  if (f.optionType === "variable" && f.unitLabel) {
    return `${base} 추가 선택 시 1${f.unitLabel}당 ${priceText} 가산`;
  }
  return `${base} 추가 선택 시 ${priceText} 가산`;
}

function composeNotes({ spec, finishing, leadTime, cbm, extraOptions, selectedFinishingItems, finishingApplyMode, guideFinishingTexts }) {
  const lines = [];
  if (spec) lines.push(spec);
  if (finishingApplyMode === "apply" && selectedFinishingItems && selectedFinishingItems.length > 0) {
    // 여러 후가공을 한 줄에 쉼표로 이어붙이지 않고, 각각 독립된 줄로 push — 나중에 lines.join("\n")될 때 항목별로 줄바꿈됨
    selectedFinishingItems.forEach((f) => lines.push(describeFinishingSelection(f, f.qty)));
  } else if (finishingApplyMode !== "guide" && finishing) {
    lines.push(`기타 후가공: ${finishing}`);
  }
  lines.push(`예상 생산기간: 주문 확정 및 최종 사양 확인 후 약 ${leadTime || 30}일`);
  if (cbm) lines.push(`예상 부피: 약 ${cbm}CBM`);
  (extraOptions || []).forEach((opt) => { if (opt && opt.trim()) lines.push(`• ${opt.trim()}`); });
  // "미선택/별도안내" 문구는 가격에 영향 없는 참고사항이므로 다른 기본 사양/후가공 설명들보다 항상 맨 마지막에 배치
  if (finishingApplyMode === "guide" && guideFinishingTexts && guideFinishingTexts.length > 0) {
    guideFinishingTexts.forEach((t) => { if (t && t.trim()) lines.push(`📝 ${t.trim()}`); });
  }
  return lines.join("\n");
}

function ImageUpload({ value, onChange }) {
  const fileRef = useRef(null);
  const [mode, setMode] = useState("upload"); // upload | drive
  const [driveUrl, setDriveUrl] = useState("");

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const compressed = await compressImageFile(file, 120 * 1024);
      onChange(compressed);
    } catch (err) {
      console.error(err);
      const reader = new FileReader();
      reader.onload = () => onChange(reader.result);
      reader.readAsDataURL(file);
    }
  };

  const applyDriveLink = (url) => {
    setDriveUrl(url);
    onChange(driveLinkToThumbnail(url));
  };

  return (
    <div>
      <div className="flex gap-1 mb-2">
        <button type="button" onClick={() => setMode("upload")} className={"text-[11px] px-2 py-1 rounded-md " + (mode === "upload" ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-500")}>파일 업로드</button>

        </div>
        {mode === "upload" ? (
          <div className="flex flex-col gap-1">
            <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 w-fit">이미지 선택</button>
            {value && <button type="button" onClick={() => onChange("")} className="text-xs text-slate-400 hover:text-red-500 w-fit">제거</button>}

function AutoResizeTextarea({ value, onChange, placeholder, minRows, readOnly }) {
  const ref = useRef(null);
  const resize = (el) => {
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  };
  useEffect(() => { resize(ref.current); }, [value]);
  return (
    <textarea
      ref={ref}
      value={value}
      onChange={(e) => { if (readOnly) return; onChange(e.target.value); resize(e.target); }}
      placeholder={placeholder}
      rows={minRows || 3}
      readOnly={readOnly}
      style={{ overflow: "hidden", resize: "none" }}
      className={inputCls + (readOnly ? " bg-slate-50 text-slate-500 cursor-default" : "")}
    />
  );
}

/* ===================== 기준정보 설정 모달 ===================== */

function SettingsModal({ open, onClose, onSave, logistics, setLogistics, marginTable, setMarginTable, customsRates, setCustomsRates, difficultyMargins, setDifficultyMargins, supplierLogo, setSupplierLogo, finishingOptions, setFinishingOptions, onShowAnalysis }) {
  const [tab, setTab] = useState("logistics");
  const [saving, setSaving] = useState(false);
  const [finishingCategory, setFinishingCategory] = useState(CATEGORIES[0]); // 후가공 관리 탭에서 지금 편집중인 카테고리
  if (!open) return null;
  const updateMargin = (cat, idx, value) => setMarginTable((prev) => { const next = { ...prev, [cat]: [...prev[cat]] }; next[cat][idx] = Number(value) / 100; return next; });
  // 후가공 항목 추가/수정/삭제 — 카테고리별 배열로 관리
  const finishingList = finishingOptions[finishingCategory] || [];
  const addFinishingItem = () => {
    const next = [...finishingList, { id: Date.now() + Math.random(), name: "", rmbPrice: 0, krwPrice: 0, optionType: "fixed", unitLabel: "", guideText: "" }];
    setFinishingOptions({ ...finishingOptions, [finishingCategory]: next });
  };
  const FINISHING_TEXT_FIELDS = ["name", "optionType", "unitLabel", "guideText"];
  const updateFinishingItem = (id, field, value) => {
    const next = finishingList.map((f) => (f.id === id ? { ...f, [field]: FINISHING_TEXT_FIELDS.includes(field) ? value : Number(value) } : f));
    setFinishingOptions({ ...finishingOptions, [finishingCategory]: next });
  };
  const deleteFinishingItem = (id) => {
    setFinishingOptions({ ...finishingOptions, [finishingCategory]: finishingList.filter((f) => f.id !== id) });
  };
  // 저장 버튼 — DB(Firestore)+localStorage에 기준정보를 저장하고, 완료 안내 후 모달을 자동으로 닫는다.
  const handleSaveAndClose = async () => {
    setSaving(true);
    try {
      await onSave();
      alert("기준정보 설정이 성공적으로 저장되었습니다.");
      onClose();
    } catch (e) {
      console.error(e);
      alert("저장 중 오류가 발생했습니다. 다시 시도해주세요.");
    } finally {
      setSaving(false);
    }

  return (

        </div>
        <div className="px-6 pt-4 flex gap-2 border-b border-slate-200">
          {[["logistics", "A. 물류 부대비용"], ["margin", "B. 카테고리별 이익율표"], ["customs", "C. 카테고리별 관세율"], ["finishing", "F. 카테고리별 후가공 내역"], ["difficulty", "E. 업체 난이도별 마진 차등율"], ["logo", "D. 공급자 로고"]].map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)} className={"px-4 py-2 text-sm font-medium rounded-t-lg -mb-px border-b-2 " + (tab === key ? "border-[#1E3A8A] text-[#1E3A8A]" : "border-transparent text-slate-400 hover:text-slate-600")}>{label}</button>
          ))}
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          {tab === "logistics" && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <Field label="CBM당 운송비" hint="원"><input type="number" className={inputCls} value={logistics.cbmRate} onChange={(e) => setLogistics({ ...logistics, cbmRate: Number(e.target.value) })} /></Field>
              <Field label="BL 비용" hint="원"><input type="number" className={inputCls} value={logistics.blFee} onChange={(e) => setLogistics({ ...logistics, blFee: Number(e.target.value) })} /></Field>
              <Field label="원산지 비용" hint="원"><input type="number" className={inputCls} value={logistics.originFee} onChange={(e) => setLogistics({ ...logistics, originFee: Number(e.target.value) })} /></Field>

            </div>

          {tab === "customs" && (
            <div className="grid grid-cols-2 md:grid-cols-3 gap-3">

          {tab === "finishing" && (
            <div>

              {onShowAnalysis && (
                <button onClick={onShowAnalysis} className="mb-4 text-xs px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] font-medium hover:bg-[#1E3A8A]/5">📊 카테고리별 후가공 단가 분석 리포트 보기</button>

              <div className="flex flex-wrap gap-1.5 mb-4">

                ))}
              </div>
              <div className="border border-slate-200 rounded-lg overflow-hidden">
                <table className="w-full text-xs">
                  <thead><tr className="bg-slate-50 text-slate-500">

                    <th className="text-left px-3 py-2 font-medium w-36">옵션 유형</th>
                    <th className="text-left px-3 py-2 font-medium w-24">단위 명칭</th>
                    <th className="text-left px-3 py-2 font-medium w-32">위안화 단가(RMB)</th>
                    <th className="text-left px-3 py-2 font-medium w-32">원화 단가(KRW)</th>
                    <th className="text-left px-3 py-2 font-medium w-56">미선택 안내 문구</th>

                  </tr></thead>
                  <tbody>
                    {finishingList.length === 0 && (
                      <tr><td colSpan={7} className="text-center text-slate-400 py-6">등록된 후가공 항목이 없습니다. 아래 버튼으로 추가해주세요.</td></tr>
                    )}
                    {finishingList.map((f) => (
                      <tr key={f.id} className="border-t border-slate-100">

                        <td className="px-3 py-1.5">
                          <select className="w-full px-2 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={f.optionType || "fixed"} onChange={(e) => updateFinishingItem(f.id, "optionType", e.target.value)}>
                            <option value="fixed">고정 단가형(1회)</option>
                            <option value="variable">가변 수량/도수형</option>
                          </select>
                        </td>
                        <td className="px-3 py-1.5"><input className="w-full px-2 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={f.unitLabel || ""} onChange={(e) => updateFinishingItem(f.id, "unitLabel", e.target.value)} placeholder="도/개/회" disabled={f.optionType !== "variable"} /></td>
                        <td className="px-3 py-1.5"><input type="number" step="0.01" className="w-full px-2 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={f.rmbPrice} onChange={(e) => updateFinishingItem(f.id, "rmbPrice", e.target.value)} /></td>
                        <td className="px-3 py-1.5"><input type="number" className="w-full px-2 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={f.krwPrice} onChange={(e) => updateFinishingItem(f.id, "krwPrice", e.target.value)} /></td>
                        <td className="px-3 py-1.5"><input className="w-full px-2 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={f.guideText || ""} onChange={(e) => updateFinishingItem(f.id, "guideText", e.target.value)} placeholder="예: 실크인쇄 추가 선택 시 1도당 ₩30(¥0.1) 가산" /></td>
                        <td className="px-3 py-1.5 text-center"><button onClick={() => deleteFinishingItem(f.id)} className="text-red-400 hover:text-red-600">🗑️</button></td>

                </table>
              </div>
              <button onClick={addFinishingItem} className="mt-3 text-xs px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] font-medium hover:bg-[#1E3A8A]/5">➕ 후가공 항목 추가</button>
            </div>
          )}
          {tab === "difficulty" && (
            <div className="max-w-xl">
              <p className="text-xs text-slate-500 mb-4">업체 등급별로 기준 마진율에 가감할 차등율(%)입니다. 음수는 마진 인하(가격 경쟁력↑), 양수는 마진 인상을 뜻합니다.</p>
              <div className="space-y-2">
                {CLIENT_DIFFICULTY_LEVELS.map((level) => (
                  <div key={level} className="flex items-center justify-between gap-3 border border-slate-200 rounded-lg px-4 py-2.5">
                    <span className={"text-xs px-2.5 py-1 rounded-full font-medium " + DIFFICULTY_BADGE_STYLE[level]}>{level}</span>
                    <div className="flex items-center gap-1">
                      <input type="number" step="0.5" className="w-20 px-2 py-1.5 rounded border border-slate-200 text-center text-sm outline-none focus:border-[#1E3A8A]" value={difficultyMargins[level]} onChange={(e) => setDifficultyMargins({ ...difficultyMargins, [level]: Number(e.target.value) })} />
                      <span className="text-xs text-slate-400">%p</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {tab === "logo" && (
            <div>
              <p className="text-xs text-slate-500 mb-4">업로드하면 PDF 제안서 우측 상단에 표시됩니다. 업로드하지 않으면 기본 워드마크가 대신 표시됩니다.</p>
              <ImageUpload value={supplierLogo} onChange={setSupplierLogo} />
            </div>
          )}
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end">
          <button onClick={handleSaveAndClose} disabled={saving} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 disabled:opacity-60">{saving ? "저장 중..." : "저장하고 닫기"}</button>
        </div>
      </div>
    </div>
  );
}

/* ===================== 고객정보 입력 모달 ===================== */

function ClientInfoModal({ open, mode, initial, itemCount, onClose, onSubmit }) {
  const [clientName, setClientName] = useState(initial.clientName || "");
  const [contact, setContact] = useState(initial.contact || "");
  const [channel, setChannel] = useState(initial.channel || "카카오채널");
  const [employee, setEmployee] = useState(initial.employee || "");

  useEffect(() => {
    if (open) { setClientName(initial.clientName || ""); setContact(initial.contact || ""); setChannel(initial.channel || "카카오채널"); setEmployee(initial.employee || ""); }
  }, [open]);

  if (!open) return null;
  const canSubmit = clientName.trim() && employee.trim();

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-md overflow-hidden">
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">{mode === "save" ? "💾 제안서 저장" : "📄 제안서 생성"}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6">
          <p className="text-xs text-slate-500 mb-4">현재 담긴 품목 <b className="text-slate-700">{itemCount}건</b>으로 제안서를 {mode === "save" ? "저장" : "생성"}합니다.</p>
          <Field label="고객사명" hint="필수"><input className={inputCls} placeholder="예: 주식회사 닥터스칼프" value={clientName} onChange={(e) => setClientName(e.target.value)} /></Field>
          <Field label="담당자명"><input className={inputCls} placeholder="예: 홍길동" value={contact} onChange={(e) => setContact(e.target.value)} /></Field>
          <Field label="문의 채널">
            <select className={inputCls} value={channel} onChange={(e) => setChannel(e.target.value)}><option>카카오채널</option><option>이메일</option><option>전화</option></select>
          </Field>
          <Field label="담당 직원명" hint="필수"><input className={inputCls} placeholder="예: 김직원" value={employee} onChange={(e) => setEmployee(e.target.value)} /></Field>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button disabled={!canSubmit} onClick={() => onSubmit({ clientName, contact, channel, employee })} className={"px-5 py-2 rounded-lg text-sm font-medium text-white " + (canSubmit ? "bg-[#1E3A8A] hover:opacity-90" : "bg-slate-300 cursor-not-allowed")}>{mode === "save" ? "저장하기" : "제안서 생성"}</button>
        </div>
      </div>
    </div>
  );
}

const SAMPLE_STATUS_LABELS = { "요청": "고객요청", "발주": "주문발주", "입고": "입고완료", "발송": "발송완료", "수령": "고객수령" };
// 좁은 스텝바 전용으로 만들었던 별칭 — 이제 본 라벨과 동일하지만 기존 참조를 살리기 위해 유지
const SAMPLE_STATUS_LABELS_PLAIN = SAMPLE_STATUS_LABELS;
const SAMPLE_STATUS_COLORS = {

  "발주": "bg-amber-100 text-amber-800 border-amber-200",  // 주문발주 — 연주황

  "수령": "bg-slate-100 text-slate-600 border-slate-200",  // 고객수령 — 연회색
};
const SAMPLE_STATUS_DATE_FIELD = { "요청": "requestDate", "발주": "orderDate", "입고": "stockInDate", "발송": "dispatchDate", "수령": "deliveredDate" };
const SAMPLE_STATUS_CONFIRMER_FIELD = { "요청": "requestConfirmedBy", "발주": "orderConfirmedBy", "입고": "stockInConfirmedBy", "발송": "dispatchConfirmedBy", "수령": "deliveredConfirmedBy" };
// statusLogs 객체의 키 — 한글 상태값을 영문 키로 매핑해 저장한다(요청받은 데이터 모델 그대로)
const SAMPLE_STATUS_LOG_KEY = { "요청": "request", "발주": "order", "입고": "received", "발송": "shipped", "수령": "delivered" };

/* 단계 전환시 항상 이 헬퍼로 patch를 만든다 — 어느 화면(목록 select / 상세모달 타임라인 / 인보이스 발송완료)에서
   바꾸든 담당직원+처리일시가 동일한 규칙으로 statusLogs에 남도록 한 곳에 모아둔 것.
   기존 단계별 날짜/확인직원 필드(requestDate·orderConfirmedBy 등)도 비어있을 때만 함께 채워 하위호환을 유지한다. */
function buildSampleStatusPatch(sample, status, worker) {
  const now = nowDateTimeStr();
  const name = worker || "";
  const logKey = SAMPLE_STATUS_LOG_KEY[status];
  const logs = { ...((sample && sample.statusLogs) || {}) };
  if (logKey) logs[logKey] = { date: now, worker: name };
  const patch = { status, statusLogs: logs, lastStatusAt: now, lastStatusBy: name };
  const dateField = SAMPLE_STATUS_DATE_FIELD[status];
  if (dateField && sample && !sample[dateField]) patch[dateField] = todayDisplay();
  const confirmerField = SAMPLE_STATUS_CONFIRMER_FIELD[status];
  if (confirmerField && sample && !sample[confirmerField] && name) patch[confirmerField] = name;
  return patch;
}
// 목록 배지 툴팁용 — 마지막 단계 변경 일시/담당자를 "최종 변경: ... (담당자)" 문구로 만들어 반환
function sampleLastStatusText(s) {
  if (!s) return "";
  const logKey = SAMPLE_STATUS_LOG_KEY[s.status];
  const log = (s.statusLogs && logKey && s.statusLogs[logKey]) || null;
  const date = s.lastStatusAt || (log && log.date) || "";
  const worker = s.lastStatusBy || (log && log.worker) || "";
  if (!date && !worker) return "단계 변경 이력이 아직 없습니다";
  return `최종 변경: ${date || "-"}${worker ? ` (${worker})` : ""}`;
}
const DEFAULT_SAMPLE_SHIPPING_FEES = { "일반": 2500, "항공": 15000 }; // 배송비 설정 모달에서 수정 가능한 기본값

/* ===================== 샘플 유형(1차 일반 / 2차 CT맞춤제작) =====================
   sampleType 필드가 없는 기존 데이터는 전부 "general"(1차 일반샘플)로 간주한다 —
   별도 마이그레이션 없이 옛 레코드도 그대로 목록/필터에 정상 노출되게 하기 위함. */
const SAMPLE_TYPE_OPTIONS = ["general", "ct"];
const SAMPLE_TYPE_LABELS = { general: "1차 일반샘플", ct: "2차 CT샘플" }; // 4단계 상단 유형 탭 — 이모지 없이 텍스트만
