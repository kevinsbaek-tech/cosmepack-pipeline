// 동일 그룹(기본 용량+용기형태)의 유사 제품들을 모아 기본형 단가 vs 옵션 적용 단가를 비교하는 모달
function SimilarProductsModal({ product, allProducts, onClose }) {
  const attrs = deriveProductAttributes(product);
  const groupKey = attrs.baseGroupKey;
  const groupItems = allProducts
    .map((p) => ({ ...p, _attrs: deriveProductAttributes(p) }))
    .filter((p) => p._attrs.baseGroupKey && p._attrs.baseGroupKey === groupKey);

  const basePriceItem = groupItems.length > 0
    ? groupItems.reduce((min, p) => (Number(p.lastUnitPrice) || 0) < (Number(min.lastUnitPrice) || Infinity) ? p : min, groupItems[0])
    : null;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "1200px", height: "85vh", maxHeight: "85vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-base font-bold text-slate-800">🔍 유사/옵션 제품 분석</h2>
            <p className="text-xs text-slate-500 mt-0.5">{groupKey ? `그룹: ${groupKey}` : "이름/규격에서 용량·용기형태를 인식하지 못해 그룹을 특정할 수 없습니다."}</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          {!groupKey ? (
            <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
              "{product.name}"의 이름/규격에서 용량(예: 100g, 50ml)과 용기 형태(예: 크림용기, 펌프용기)를 자동으로 인식하지 못했습니다.
            </div>
          ) : groupItems.length <= 1 ? (
            <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm">
              같은 그룹({groupKey})으로 묶이는 다른 제품이 아직 없습니다.
            </div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-xs border border-slate-200 rounded-lg overflow-hidden">
                <thead><tr className="bg-slate-50 text-slate-500">
                  <th className="text-left px-3 py-2 font-medium">제품명</th>
                  <th className="text-left px-3 py-2 font-medium">재질</th>
                  <th className="text-left px-3 py-2 font-medium">캡/타입</th>
                  <th className="text-left px-3 py-2 font-medium">후가공/옵션</th>
                  <th className="text-right px-3 py-2 font-medium">단가</th>
                  <th className="text-right px-3 py-2 font-medium">옵션 추가금(추정)</th>
                  <th className="text-right px-3 py-2 font-medium">기준가 대비 차액</th>
                </tr></thead>
                <tbody>
                  {groupItems
                    .sort((a, b) => (Number(a.lastUnitPrice) || 0) - (Number(b.lastUnitPrice) || 0))
                    .map((p) => {
                      const isBase = basePriceItem && p.id === basePriceItem.id;
                      const surcharge = productOptionSurcharge(p);
                      const diff = (Number(p.lastUnitPrice) || 0) - (Number(basePriceItem && basePriceItem.lastUnitPrice) || 0);
                      return (
                        <tr key={p.id} className={"border-t border-slate-100 " + (p.id === product.id ? "bg-blue-50/50" : "")}>
                          <td className="px-3 py-2 font-medium text-slate-800">
                            {p.name}
                            {isBase && <span className="ml-1.5 text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">기본형</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.materials.length > 0 ? p._attrs.materials.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.capTypes.length > 0 ? p._attrs.capTypes.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-blue-50 text-[#1D4ED8]">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2">
                            {p._attrs.finishes.length > 0 ? p._attrs.finishes.map((m) => <span key={m} className="inline-block mr-1 mb-1 text-[10px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-700">{m}</span>) : <span className="text-slate-300">-</span>}
                          </td>
                          <td className="px-3 py-2 text-right font-semibold text-[#1E3A8A]">{won(p.lastUnitPrice || 0)}</td>
                          <td className="px-3 py-2 text-right text-slate-500">{surcharge > 0 ? won(surcharge) : "-"}</td>
                          <td className={"px-3 py-2 text-right font-medium " + (diff > 0 ? "text-red-500" : diff < 0 ? "text-emerald-600" : "text-slate-400")}>
                            {isBase ? "-" : `${diff > 0 ? "+" : ""}${won(diff)}`}
                          </td>
                        </tr>
                      );
                    })}
                </tbody>
              </table>
              <p className="text-[11px] text-slate-400 mt-3">
                * "기본형"은 그룹 내 단가(lastUnitPrice)가 가장 낮은 제품을 자동 기준으로 삼은 것입니다. "옵션 추가금"은 용기/캡 인쇄·후가공 단가(K스펙) 합계를 참고용으로 보여줍니다.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ProductDetailModal({ product, onClose, onOpenSimilar }) {
  const tiers = product.priceTiers || [];
  const refItems = (product.referenceImages || []).map((r) => (typeof r === "string" ? { image: r, note: "" } : r)).filter((r) => r.image);
  const fileFields = [["containerDieline", "용기칼선"], ["boxDieline", "단상자칼선"], ["otherFile", "기타파일"]]
    .map(([k, label]) => [label, product[k]]).filter(([, v]) => v && (typeof v === "string" ? v : v.file));

  // 제품 상세정보를 하나의 정돈된 뷰로 통합(기본정보/재질·스펙/MOQ·리드타임·제안가/인쇄·후가공단가/CT샘플비/공장정보/CBM·물류비).
  // 값이 없는 항목/그룹은 자동으로 숨기고, 직접 입력한 제품(박스히어로 데이터 없음)이면 이 섹션 전체가 숨겨진다.
  const fmt = (v) => (v === undefined || v === "" || v === 0 ? "-" : v);
  const kc = (label, kVal, cVal) => (kVal || cVal) ? [label, `K ${fmt(kVal)}  /  C ${fmt(cVal)}`] : null;
  const detailGroups = [
    { title: "기본 정보", entries: [["SKU", product.sku], ["바코드", product.barcode], ["카테고리", product.category], ["프리몰드품번", product.premoldCode], ["프리코스품번", product.freeCosCode], ["코스메팩품번", product.cosmepackCode]] },
    { title: "재질/스펙", entries: [["재질", product.material], ["재원(사이즈)", product.specSize], ["제품용량", product.capacity], ["제품구성", product.composition], ["충진방식", product.fillMethod]] },
    { title: "MOQ · 리드타임 · 제안가", entries: [
      ["최소제작수량(MOQ)", product.moqQuantity ? `${product.moqText || ""}${product.moqText ? " " : ""}(${product.moqQuantity.toLocaleString("ko-KR")}개)` : product.moqText],
      ["예상제작기간", product.leadTimeDays ? `${product.leadTimeText || ""}${product.leadTimeText ? " " : ""}(${product.leadTimeDays}일)` : product.leadTimeText],
      ["제안가격기준", product.proposalPriceBasis],
      ["제안단가", product.lastUnitPrice ? won(product.lastUnitPrice) : ""],
    ] },
    { title: "인쇄·후가공 단가 (K:제안용 / C:원가용)", entries: [
      kc("용기 인쇄가격", product.containerPrintPriceK, product.containerPrintPriceC),
      kc("용기 후가공가격", product.containerFinishPriceK, product.containerFinishPriceC),
      kc("캡/뚜껑 인쇄가격", product.capPrintPriceK, product.capPrintPriceC),
      kc("캡/뚜껑 후가공가격", product.capFinishPriceK, product.capFinishPriceC),
      kc("기타 후가공가격", product.otherFinishPriceK, product.otherFinishPriceC),
      kc("기타옵션", product.otherOptionK, product.otherOptionC),
    ].filter(Boolean) },
    { title: "CT 샘플 비용", entries: [["CT생산샘플가격(K)", product.ctSamplePriceK], ["CT생산샘플(C)", product.ctSampleC]] },
    { title: "공장 정보", entries: [["중국공장명", product.factory], ["위챗단체방", product.wechatGroup], ["제품URL(1688)", product.factoryLink], ["공장단가설명", product.factoryPriceNote]] },
    { title: "CBM · 물류비", entries: [["제품예상부피(CBM)", product.cbmText], ["제품제공가능용량", product.availableVolumeC], ["중국내운송료", product.shippingText], ["공장단가(RMB)", product.rmbCost]] },
  ].map((g) => ({ ...g, entries: g.entries.filter(([, v]) => v !== undefined && v !== "" && v !== 0) })).filter((g) => g.entries.length > 0);
  const hasDetailData = detailGroups.length > 0;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "1400px", height: "90vh", maxHeight: "90vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">🔎 {product.name}</h2>
          <div className="flex items-center gap-2">
            {onOpenSimilar && <button onClick={() => onOpenSimilar(product)} className="text-xs px-3 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 whitespace-nowrap">🔍 유사/옵션 제품 분석</button>}
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
          </div>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          <div className="flex gap-6 mb-5">
            {product.image && (
              <ZoomableImage src={product.image} className="w-32 h-32 object-cover rounded-lg border border-slate-200 shrink-0" />
            )}
            {hasDetailData && (
              <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                {detailGroups.map((g) => (
                  <div key={g.title} className="bg-slate-50 rounded-lg p-3">
                    <div className="text-[11px] font-semibold text-[#1E3A8A] mb-1.5">{g.title}</div>
                    <table className="w-full text-xs">
                      <tbody>
                        {g.entries.map(([label, value], i) => (
                          <tr key={label + i} className="border-t border-slate-200 first:border-t-0">
                            <td className="py-1 pr-3 text-slate-500 whitespace-nowrap align-top w-36">{label}</td>
                            <td className="py-1 pre-line break-words text-slate-800 font-medium">
                              {label === "제품URL(1688)" ? (
                                <a href={value} target="_blank" rel="noopener noreferrer" className="text-[#1D4ED8] underline break-all">{value}</a>
                              ) : value}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ))}
              </div>
            )}
          </div>

          {tiers.length > 0 && (
            <div className="mb-5">
              <div className="text-xs font-semibold text-slate-600 mb-2 pt-3 border-t border-slate-100">수량별 CBM / 운송료 / 검품비용 / 공장단가</div>
              <table className="w-full text-xs border border-slate-200 rounded-lg overflow-hidden">
                <thead><tr className="bg-slate-50 text-slate-500">
                  <th className="text-left px-3 py-2 font-medium">기준수량</th><th className="text-left px-3 py-2 font-medium">CBM</th>
                  <th className="text-left px-3 py-2 font-medium">중국내운송료(RMB)</th><th className="text-left px-3 py-2 font-medium">검품비용(RMB)</th><th className="text-left px-3 py-2 font-medium">공장단가(RMB)</th>
                </tr></thead>
                <tbody>
                  {tiers.map((t, i) => (
                    <tr key={i} className="border-t border-slate-100">
                      <td className="px-3 py-1.5">{t.qty}</td><td className="px-3 py-1.5">{t.cbm}</td>
                      <td className="px-3 py-1.5">{t.shippingRmb}</td><td className="px-3 py-1.5">{t.inspectionRmb || "-"}</td><td className="px-3 py-1.5">{t.factoryPriceRmb}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {(refItems.length > 0 || fileFields.length > 0) && (
            <div className="mb-5 pt-3 border-t border-slate-100">
              <div className="text-xs font-semibold text-slate-600 mb-2">참조 이미지 & 칼선 파일</div>
              <div className="flex flex-wrap gap-3">
                {refItems.map((item, i) => (
                  <div key={i} className="w-24">
                    <ZoomableImage src={item.image} className="w-24 h-24 object-cover rounded-lg border border-slate-200" />
                    {item.note && <div className="text-[10px] text-slate-500 mt-1 pre-line break-words">{item.note}</div>}
                  </div>
                ))}
                {fileFields.map(([label, v]) => {
                  const fileData = typeof v === "string" ? v : v.file;
                  const note = typeof v === "string" ? "" : v.note;
                  return (
                    <div key={label} className="w-24">
                      {fileData && fileData.startsWith("data:image") ? (
                        <ZoomableImage src={fileData} className="w-24 h-24 object-cover rounded-lg border border-slate-200" />
                      ) : (
                        <div className="w-24 h-24 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center text-slate-400 text-[10px] text-center px-1">{label}</div>
                      )}
                      <div className="text-[10px] text-slate-500 mt-1">{label}{note ? ` · ${note}` : ""}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {!hasDetailData && refItems.length === 0 && fileFields.length === 0 && (
            <p className="text-xs text-slate-400 text-center py-6">직접 등록한 제품이라 추가 상세정보가 없습니다.</p>

}

function TextField({ label, value, onChange, hint, mono, rows, span }) {
  return (
    <Field label={label} hint={hint} span={span}>
      {rows ? (
        <AutoResizeTextarea value={value} onChange={onChange} minRows={rows} />
      ) : (
        <input className={inputCls + (mono ? " font-mono text-xs" : "")} value={value} onChange={(e) => onChange(e.target.value)} />
      )}
    </Field>
  );
}

function PriceTierTable({ tiers, onChange }) {
  const update = (idx, field, value) => {
    const next = tiers.map((t, i) => {
      if (i !== idx) return t;
      const patched = { ...t, [field]: value };
      // 기준수량이 5,000개/10,000개면 검품비용을 정해진 금액(270/540)으로 자동완성 — 그 외 수량은 사용자가 직접 입력하도록 비워둔다.
      if (field === "qty") {
        const qtyNum = Number(value);
        if (qtyNum === 5000) patched.inspectionRmb = 270;
        else if (qtyNum === 10000) patched.inspectionRmb = 540;
      }
      return patched;
    });
    onChange(next);
  };
  const addTier = () => onChange([...tiers, { qty: "", cbm: "", shippingRmb: "", inspectionRmb: "", factoryPriceRmb: "" }]);
  const removeTier = (idx) => onChange(tiers.filter((_, i) => i !== idx));

  return (
    <div>
      <div className="grid grid-cols-6 gap-2 text-xs font-medium text-slate-500 mb-1.5 px-1">
        <div>기준수량 (개)</div><div>제품예상부피 CBM</div><div>중국내운송료 RMB</div><div>검품비용 RMB(총액)</div><div>공장단가 RMB</div><div></div>
      </div>
      <div className="space-y-2">
        {tiers.map((t, i) => (
          <div key={i} className="grid grid-cols-6 gap-2 items-center">
            <input className={inputCls} value={t.qty} onChange={(e) => update(i, "qty", e.target.value)} placeholder="예: 5000" />
            <input className={inputCls} value={t.cbm} onChange={(e) => update(i, "cbm", e.target.value)} placeholder="예: 1.2" />
            <input className={inputCls} value={t.shippingRmb} onChange={(e) => update(i, "shippingRmb", e.target.value)} placeholder="예: 300" />
            <input className={inputCls} value={t.inspectionRmb || ""} onChange={(e) => update(i, "inspectionRmb", e.target.value)} placeholder="예: 200" />
            <input className={inputCls} value={t.factoryPriceRmb} onChange={(e) => update(i, "factoryPriceRmb", e.target.value)} placeholder="예: 1.21" />
            <button type="button" onClick={() => removeTier(i)} title="삭제" className="w-8 h-8 flex items-center justify-center rounded-lg border border-red-200 text-red-500 hover:bg-red-50 shrink-0">🗑️</button>
          </div>
        ))}
      </div>
      <button type="button" onClick={addTier} className="mt-2 text-xs px-3 py-1.5 rounded-lg border border-dashed border-slate-300 text-slate-500 hover:border-[#1E3A8A] hover:text-[#1E3A8A]">
        ➕ 수량 구간 추가
      </button>
      {tiers.length === 0 && <p className="text-xs text-slate-400 mt-2">아직 등록된 수량 구간이 없습니다. "수량 구간 추가"로 시작해주세요.</p>}
    </div>
  );
}

function FileNoteUpload({ label, hint, file, note, onFileChange, onNoteChange }) {
  const ref = useRef(null);
  const [busy, setBusy] = useState(false);
  const handleFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setBusy(true);
    try {
      const isImage = f.type.startsWith("image/");
      const data = isImage ? await compressImageFile(f, 120 * 1024) : await readFileAsDataUrl(f);
      onFileChange(data, f.name);
    } catch (err) {
      console.error(err);
    } finally {
      setBusy(false);
    }
  };
  return (
    <Field label={label} hint={hint}>
      <div className="border border-slate-200 rounded-lg p-3 space-y-2">
        <div className="flex items-center gap-3">
          {file && file.startsWith("data:image") ? (
            <ZoomableImage src={file} className="w-14 h-14 object-cover rounded-lg border border-slate-200" />
          ) : file ? (
            <div className="w-14 h-14 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center text-slate-400 text-xs">파일</div>
          ) : null}
          <button type="button" onClick={() => ref.current && ref.current.click()} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">
            {busy ? "업로드 중..." : file ? "파일 교체" : "📁 파일 선택"}
          </button>
          {file && <button type="button" onClick={() => onFileChange("", "")} className="text-xs text-red-400 hover:text-red-600">제거</button>}
          <input ref={ref} type="file" className="hidden" onChange={handleFile} />
        </div>
        <input className={inputCls} value={note} onChange={(e) => onNoteChange(e.target.value)} placeholder="파일 설명 / 특이사항 입력" />
      </div>
    </Field>
  );
}

              <FileNoteUpload label="(C)기타파일" file={otherFile.file} note={otherFile.note}

}

        <div className="p-6 space-y-4">

          <p className="text-xs text-slate-500">선택된 카테고리에 해당하는 제품 <b className="text-[#1E3A8A]">{targetCount}개</b>가 변경 대상입니다.</p>

        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">

function ProductsView({ products, factories, proposals, onBack, onDelete, onAdd, onAddDuplicate, onBulkAdd, onUseInSourcing, onUpdate, onDedupe, onAutoAssignCategories, onStripBrandPrefix, onOpenProposal, onSyncFactories, onUploadZip, onDeleteAllProducts, onDeleteAllUploaded, onSyncProposalLinks, onAutoMergeBoxHero, onBulkDelete, onBulkUpdateFactoryInfo, onMergeProducts, isAdmin, initialViewProduct, onConsumeInitialView, onBulkCompressImages, bulkCompressProgress, onBulkMigrateInspection }) {
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const [viewMode, setViewMode] = useState("list"); // list | card
  const [editingProduct, setEditingProduct] = useState(null);
  const [isDuplicateFlow, setIsDuplicateFlow] = useState(false); // 지금 열려있는 편집모달이 "제품 복사"로 열린 것인지 추적(저장시 토스트 문구 분기용)
  const [showBatchFactoryUpdate, setShowBatchFactoryUpdate] = useState(false);
  const [showProductMergeModal, setShowProductMergeModal] = useState(false);
  const [viewingProduct, setViewingProduct] = useState(null);
  const [viewingProductProposals, setViewingProductProposals] = useState(null);
  const [viewingSimilarProduct, setViewingSimilarProduct] = useState(null);

  useEffect(() => {
    if (initialViewProduct) {
      setViewingProduct(initialViewProduct);
      if (onConsumeInitialView) onConsumeInitialView();
    }
  }, [initialViewProduct]);
  const [uploadBusy, setUploadBusy] = useState(false);
  const [zipBusy, setZipBusy] = useState(false);
  const zipRef = useRef(null);
  const uploadRef = useRef(null);
  const [categoryFilter, setCategoryFilter] = useState("전체");
  const [siteFilter, setSiteFilter] = useState("전체"); // "전체" | "프리몰드" | "프리코스" | "코스메팩"
  const [page, setPage] = useState(() => (parseKoreanHash().view === "제품관리" ? parseKoreanHash().page : 1));
  useHashPageSync("제품관리", page);
  const PAGE_SIZE = 20;
  const SITE_FIELD_MAP = { "프리몰드": "premoldCode", "프리코스": "freeCosCode", "코스메팩": "cosmepackCode" };

  const filtered = useMemo(() => {
    const categoryScoped = categoryFilter !== "전체" ? products.filter((p) => p.category === categoryFilter) : products;
    const siteScoped = siteFilter !== "전체" ? categoryScoped.filter((p) => !!p[SITE_FIELD_MAP[siteFilter]]) : categoryScoped;
    const base = search.trim() ? smartProductSearch(siteScoped, search) : siteScoped;
    return sortByKey(base, sortKey, (p) => p.name, (p) => p.createdAt, (p) => getLinkedProposals(p, proposals).length);
  }, [products, categoryFilter, siteFilter, search, sortKey, proposals]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedFiltered = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  useEffect(() => { setPage(1); }, [search, categoryFilter, siteFilter]);
  useEffect(() => { setSelectedIds([]); }, [page, search, categoryFilter, siteFilter, sortKey]);
  const allPagedSelected = pagedFiltered.length > 0 && pagedFiltered.every((p) => selectedIds.includes(p.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : pagedFiltered.map((p) => p.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  // 신규 등록/수정 모두 동일한 대형 모달(ProductEditModal)을 사용 — id 유무로 등록/수정 분기
  const handleSaveProduct = (id, patch) => {
    if (id) {
      onUpdate(id, patch);
    } else if (isDuplicateFlow && onAddDuplicate) {
      onAddDuplicate({ id: Date.now() + Math.random(), ...patch }); // 복사플로우는 전용 토스트("복사되어 등록되었습니다")를 띄우는 별도 저장함수로
    } else {
      onAdd({ id: Date.now() + Math.random(), ...patch });
    }
    setEditingProduct(null);
    setIsDuplicateFlow(false);
  };

  // "📋 제품 복사": 원본의 이미지/카테고리/규격/재질/연동공장/가격정보를 그대로 복제한 채 편집모달을 바로 연다.
  // 제품명엔 "(복사본)"을 붙이고, SKU는 중복방지를 위해 새 랜덤값으로 새로 발급하며, id/생성일/제안서연결이력(이 복사본과는 무관)은 제외한다.
  const duplicateProduct = (p) => {
    const { id, createdAt, proposalIds, proposalCount, ...rest } = p;
    const newSku = "SKU-" + Math.random().toString(36).slice(2, 10).toUpperCase();
    setIsDuplicateFlow(true);
    setEditingProduct({ ...rest, name: `${p.name} (복사본)`, sku: newSku });
  };

  // SKU-XXXXXXXX 토큰 추출은 전역 extractSkuToken() 재사용 (App레벨 ZIP 업로드와 동일 로직 공유)

  // 박스히어로 데이터 통합 업로드: 파일 하나(또는 여러 개)를 한번에 올리면 확장자/타입으로 자동 구분해서 처리한다.
  // .csv / .xlsx·.xls / .html·.htm → 제품 데이터 파싱 후 SKU(없으면 제품명+규격) 기준 1:1 병합(bulkAddProducts)
  // 이미지 파일(jpg/png 등, 파일명에 SKU-XXXXXXXX 포함) → 사진(image)만 SKU 매칭으로 복구, 다른 필드는 건드리지 않음
  const handleBoxHeroUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setUploadBusy(true);
    try {
      const records = [];
      const skuToImage = new Map(); // 이미지 단독 파일에서 수집한 SKU -> base64

      for (const file of files) {
        const lower = file.name.toLowerCase();
        if (lower.endsWith(".csv")) {
          const text = await file.text();
          const rows = parseCsv(text);
          rows.forEach((row) => {
            const name = pickField(row, ["제품명", "name", "product name", "품명"]);
            if (!name) return;
            records.push({
              name,
              sku: pickField(row, ["sku", "바코드", "barcode", "코드", "품목코드"]),
              specSize: pickField(row, ["규격", "spec", "사이즈", "size"]),
              material: pickField(row, ["재질", "material"]),
              lastUnitPrice: Number((pickField(row, ["단가", "price", "기본단가", "cost", "원가", "판매가"]) || "0").replace(/[^0-9.]/g, "")) || 0,
              image: "", factory: "", wechatGroup: "",
            });
          });
        } else if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
          try {
            const buf = await readFileAsArrayBuffer(file);
            const workbook = XLSX.read(buf, { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
            records.push(...boxHeroRowsToProducts(rawRows));
          } catch (err) {
            console.error(`"${file.name}" 엑셀 분석 실패:`, err);
          }
        } else if (lower.endsWith(".html") || lower.endsWith(".htm")) {
          try {
            const text = await file.text();
            const rawRows = parseBoxHeroHtml(text);
            records.push(...boxHeroRowsToProducts(rawRows));
          } catch (err) {
            console.error(`"${file.name}" HTML 분석 실패:`, err);
          }
        } else if (/^image\//i.test(file.type) || /\.(jpe?g|png|gif|webp)$/i.test(file.name)) {
          const sku = extractSkuToken(file.name);
          if (!sku) continue; // 파일명에 SKU가 없으면 어느 제품인지 알 수 없어 건너뜀
          try {
            const compressed = await compressImageFile(file, 120 * 1024);
            skuToImage.set(sku, compressed);
          } catch (err) {
            console.error(`"${file.name}" 이미지 압축 실패:`, err);
          }
        }
      }

      if (records.length === 0 && skuToImage.size === 0) {
        alert("인식된 데이터가 없습니다. .xlsx/.csv/.html 제품 데이터 파일이거나, 파일명에 SKU-XXXXXXXX가 포함된 이미지 파일인지 확인해주세요.");
        return;
      }

      if (records.length > 0) {
        if (!window.confirm(`${records.length}개 제품 데이터를 SKU 기준으로 병합할까요? (SKU가 같으면 기존 정보 갱신, 없으면 신규 등록)`)) return;
        await onBulkAdd(records);
        if (onSyncFactories) await onSyncFactories(records);
      }

      let restored = 0, unmatched = 0;
      for (const [sku, image] of skuToImage.entries()) {
        const target = products.find((p) => (p.sku || "").trim().toUpperCase() === sku);
        if (target) {
          await onUpdate(target.id, { image }); // image 필드만 갱신 — 다른 스펙 데이터는 그대로 유지
          restored++;
        } else {
          unmatched++;
        }
      }

      let summary;
      if (records.length > 0 && restored > 0) {
        summary = `제품 데이터 ${records.length}건 처리 및 이미지 ${restored}건 복구가 완료되었습니다.`;
      } else if (restored > 0) {
        summary = `총 ${restored}개 제품의 이미지가 SKU 기준으로 성공적으로 복구되었습니다.`;
      } else if (records.length > 0) {
        summary = `제품 데이터 ${records.length}건 처리가 완료되었습니다.`;
      } else {
        summary = "처리가 완료되었습니다.";
      }
      alert(summary + (unmatched > 0 ? `\n(SKU가 DB와 일치하지 않아 건너뛴 이미지 ${unmatched}건)` : ""));
    } catch (err) {
      console.error(err);
      alert("파일 처리 중 오류가 발생했습니다.");
    } finally {
      setUploadBusy(false);
      if (uploadRef.current) uploadRef.current.value = "";
    }
  };

  // ZIP 일괄 업로드 — 견적엑셀(.xlsx)+제품사진+HTML이 섞인 압축파일을 통째로 올리면
  // App 레벨의 uploadZipToArchive()가 엑셀 파싱(가격조사/제안서/제안가격 시트)과 SKU기준 이미지 매핑을 한번에 처리하고
  // 업체·공장·제품·제안서 DB에 자동 반영한다.
  const handleZipUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file || !onUploadZip) return;
    setZipBusy(true);
    try {
      await onUploadZip(file);
    } finally {
      setZipBusy(false);
      if (zipRef.current) zipRef.current.value = "";
    }
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      {viewingProduct && <ProductDetailModal product={viewingProduct} onClose={() => setViewingProduct(null)} onOpenSimilar={(p) => { setViewingProduct(null); setViewingSimilarProduct(p); }} />}
      {viewingSimilarProduct && <SimilarProductsModal product={viewingSimilarProduct} allProducts={products} onClose={() => setViewingSimilarProduct(null)} />}
      {viewingProductProposals && (
        <ProductProposalsModal product={viewingProductProposals} proposals={proposals} onClose={() => setViewingProductProposals(null)}
          onOpenProposal={(p) => { setViewingProductProposals(null); onOpenProposal(p); }} />
      )}
      {editingProduct !== null && (
        <ProductEditModal
          product={editingProduct} factories={factories}
          onClose={() => { setEditingProduct(null); setIsDuplicateFlow(false); }}
          onSave={handleSaveProduct}
        />
      )}
      {showBatchFactoryUpdate && (
        <BatchFactoryUpdateModal products={products} onRun={onBulkUpdateFactoryInfo} onClose={() => setShowBatchFactoryUpdate(false)} />
      )}
      {showProductMergeModal && onMergeProducts && (
        <GenericMergeModal
          title="🔗 선택 제품 병합"
          items={products.filter((p) => selectedIds.includes(p.id))}
          getLabel={(p) => p.name}
          getSubLabel={(p) => `${p.category || "카테고리 미지정"} · 연결 제안서 ${getLinkedProposals(p, proposals).length}건`}
          confirmText={`선택한 ${selectedIds.length}개 제품을 대표 제품 1개로 병합할까요? 나머지 제품은 삭제되고, 연결된 제안서/샘플 데이터는 전부 대표 제품으로 이전됩니다.`}
          onRun={async (items, primaryId) => { await onMergeProducts(items, primaryId); setSelectedIds([]); }}
          onClose={() => setShowProductMergeModal(false)}
        />
      )}
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">📦 제품(아이템) 관리</h2>
        <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
      </div>

      <div className="bg-white border border-slate-300 shadow-sm rounded-xl p-4 mb-4">
        {onUploadZip && (
          <div className="flex flex-wrap gap-2 items-center mb-3 pb-3 border-b border-slate-100">
            <button onClick={() => zipRef.current && zipRef.current.click()} disabled={zipBusy} title="견적엑셀(.xlsx)+제품사진+HTML이 함께 들어있는 ZIP 압축파일을 올리면, 엑셀 파싱과 SKU 기준 이미지 매핑을 한번에 처리하고 업체·공장·제품·제안서 DB에 자동 반영합니다." className="text-sm px-5 py-2.5 rounded-lg border-2 border-[#1E3A8A]/30 text-[#1E3A8A] bg-[#1E3A8A]/5 font-semibold hover:bg-[#1E3A8A]/10 disabled:opacity-50 whitespace-nowrap">
              {zipBusy ? "처리 중..." : "📦 ZIP/엑셀 파일 일괄 업로드"}
            </button>
            <input ref={zipRef} type="file" accept=".zip" className="hidden" onChange={handleZipUpload} />
            <span className="text-xs text-slate-400">ZIP 안에 엑셀+사진+HTML을 함께 넣어 올리면 한번에 처리됩니다.</span>
          </div>
        )}
        {/* 1행 — 검색 & 주요 등록 */}
        <div className="flex flex-wrap gap-2.5 items-center mb-3">
          <input
            value={search} onChange={(e) => setSearch(e.target.value)}

      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />

}

/* ===================== 업무 지시 & 소통방 ===================== */
function TaskCreateModal({ accounts, currentUserName, onClose, onSave }) {
  const staffOptions = (accounts || []).filter((a) => a.role !== "admin");
  const [requestedBy, setRequestedBy] = useState(currentUserName || "백상선"); // 요청 직원명 — 기본값은 로그인한 사용자, 필요시 수정 가능
  const [clientName, setClientName] = useState("");
  const [assignee, setAssignee] = useState((staffOptions[0] && staffOptions[0].name) || "");
  const [content, setContent] = useState("");
  const [channel, setChannel] = useState(TASK_CHANNEL_OPTIONS[0]);
  const [dueDate, setDueDate] = useState("");
  const [instructionDate, setInstructionDate] = useState(todayStr()); // 지시 일자(기본값 당일)
  const [images, setImages] = useState([]); // 참고 이미지 다중첨부(base64 압축본 배열)
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);
  const canSave = clientName.trim() && assignee && content.trim();

  const handleFiles = async (fileList) => {
    const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
    for (const f of files) {
      try {
        const compressed = await compressImageFile(f, 120 * 1024);
        setImages((prev) => [...prev, compressed]);
      } catch (e) { console.error(e); }
    }
  };
  const removeImage = (idx) => setImages((prev) => prev.filter((_, i) => i !== idx));

  const save = () => {
    if (!canSave) return;
    onSave({
      requestedBy: requestedBy.trim() || currentUserName || "백상선",
      clientName: clientName.trim(), assignee, content: content.trim(), channel, dueDate, instructionDate,
      status: "요청", comments: [], images, linkedProposalCode: "", linkedProposalClient: "",
    });
    onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">📋 신규 업무 지시</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3 max-h-[70vh] overflow-y-auto">
          <Field label="요청 직원명" hint="기본값: 로그인한 사용자">
            <select className={inputCls} value={requestedBy} onChange={(e) => setRequestedBy(e.target.value)}>
              {!accounts.some((a) => a.name === requestedBy) && requestedBy && <option value={requestedBy}>{requestedBy}</option>}
              {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
            </select>
          </Field>
          <Field label="고객사명"><input className={inputCls} value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="예: 비저블유스" /></Field>
          <Field label="담당 직원">
            <select className={inputCls} value={assignee} onChange={(e) => setAssignee(e.target.value)}>
              {staffOptions.length === 0 && <option value="">등록된 직원 계정이 없습니다</option>}
              {staffOptions.map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
            </select>
          </Field>
          <Field label="요청 제품 및 조사 내용"><textarea className={inputCls} rows={6} style={{ minHeight: "120px" }} value={content} onChange={(e) => setContent(e.target.value)} placeholder="예: OO브랜드 크림용기 50g 견적 조사, 원터치캡 옵션 포함" /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="문의 채널">
              <select className={inputCls} value={channel} onChange={(e) => setChannel(e.target.value)}>
                {TASK_CHANNEL_OPTIONS.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="지시 일자"><input type="date" className={inputCls} value={instructionDate} onChange={(e) => setInstructionDate(e.target.value)} /></Field>
          </div>
          <Field label="마감 희망일"><input type="date" className={inputCls} value={dueDate} onChange={(e) => setDueDate(e.target.value)} /></Field>

          <Field label="🖼️ 참고 이미지 첨부 (여러 장 가능)">
            <div
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}
              onClick={() => fileRef.current && fileRef.current.click()}
              className={"border-2 border-dashed rounded-lg p-4 text-center cursor-pointer transition-colors " + (dragOver ? "border-[#1E3A8A] bg-[#1E3A8A]/5" : "border-slate-200 hover:bg-slate-50")}
            >
              <p className="text-xs text-slate-400">클릭하거나 이미지를 이 영역에 끌어다 놓으세요 (여러 장 동시 첨부 가능)</p>
              <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
            </div>
            {images.length > 0 && (
              <div className="grid grid-cols-4 gap-2 mt-2">
                {images.map((img, i) => (
                  <div key={i} className="relative group">
                    <img src={img} loading="lazy" className="w-full h-16 object-cover rounded-lg border border-slate-200" />
                    <button onClick={() => removeImage(i)} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-500 text-white text-xs leading-5 opacity-90 hover:opacity-100">✕</button>
                  </div>
                ))}
              </div>
            )}
          </Field>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} disabled={!canSave} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed">지시 등록</button>
        </div>
      </div>
    </div>
  );
}

function TaskCard({ task, isAdmin, currentUserName, accounts, proposals, onUpdate, onAddComment, onLinkProposal, onDelete }) {
  const [commentText, setCommentText] = useState("");
  const [linking, setLinking] = useState(false);
  const submitComment = () => {
    if (!commentText.trim()) return;
    onAddComment(task, commentText.trim());
    setCommentText("");
  };
  // ===== 샘플 진행과 동일한 단계바 + [단계|진행일|확인직원|확인] 테이블 로직 =====
  const stepIndex = TASK_STATUS_OPTIONS.indexOf(task.status || "요청");
  const setTaskStatus = (status) => {
    const dateField = TASK_STATUS_DATE_FIELD[status];
    const patch = { status };
    if (dateField && !task[dateField]) patch[dateField] = todayStr();
    onUpdate(task, patch);
  };
  const [pendingDates, setPendingDates] = useState({});
  const [pendingConfirmers, setPendingConfirmers] = useState({});
  const getDate = (field) => (pendingDates[field] != null ? pendingDates[field] : (task[field] || ""));
  const getConfirmer = (field) => (pendingConfirmers[field] != null ? pendingConfirmers[field] : (task[field] || currentUserName || "백상선"));
  const confirmTaskStep = (status) => {
    const dateField = TASK_STATUS_DATE_FIELD[status];
    const confirmerField = TASK_STATUS_CONFIRMER_FIELD[status];
    const dateValue = getDate(dateField) || todayStr();
    const confirmerValue = getConfirmer(confirmerField) || currentUserName || "백상선";
    onUpdate(task, { status, [dateField]: dateValue, [confirmerField]: confirmerValue });
  };
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="min-w-0">
          <div className="text-sm font-bold text-slate-800 truncate">{task.clientName}</div>
          <div className="text-xs text-slate-400 mt-0.5">
            {task.requestedBy ? `요청자: ${task.requestedBy} ➔ 담당자: ${task.assignee}` : `👤 담당: ${task.assignee}`} · 📞 {task.channel}
            {task.instructionDate ? ` · 📅 지시일 ${task.instructionDate}` : ""}
            {task.dueDate ? ` · ⏰ 마감 ${task.dueDate}` : ""}
          </div>
        </div>
      </div>
      <p className="text-xs text-slate-600 mb-3 pb-3 border-b border-slate-100" style={{ whiteSpace: "pre-wrap", wordBreak: "break-all", height: "auto", minHeight: "auto" }}>{task.content}</p>

      {/* 3단계 진행바 — 샘플 진행 카드와 동일한 구조, 클릭시 즉시 이동 */}
      <div className="flex items-center gap-1 mb-2">
        {TASK_STATUS_OPTIONS.map((s, i) => (
          <React.Fragment key={s}>
            <button onClick={() => setTaskStatus(s)} title={TASK_STATUS_LABELS[s]} className={"flex-1 text-[11px] px-1 py-2 rounded-lg font-bold text-center whitespace-nowrap " + (i <= stepIndex ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-400")}>
              {TASK_STATUS_LABELS[s]}
            </button>
            {i < TASK_STATUS_OPTIONS.length - 1 && <div className={"w-1.5 h-0.5 shrink-0 " + (i < stepIndex ? "bg-[#1E3A8A]" : "bg-slate-200")} />}
          </React.Fragment>
        ))}
      </div>
      <div className="text-[11px] text-center text-slate-500 mb-2">현재 단계: <b className="text-[#1E3A8A]">{TASK_STATUS_LABELS[task.status] || task.status}</b></div>

      {/* 단계별 [단계|진행일|확인직원|확인] 테이블 — 샘플 진행과 동일 구조. 확인완료된 단계는 확인직원이 🔒로 잠기고 수정 불가 */}
      <div className="border border-slate-200 rounded-lg overflow-hidden mb-3">
        <table className="w-full text-[11px]">
          <thead><tr className="bg-slate-50 text-slate-400">
            <th className="text-left px-2 py-1.5 font-medium">단계</th>
            <th className="text-left px-2 py-1.5 font-medium">진행일</th>
            <th className="text-left px-2 py-1.5 font-medium">확인직원</th>
            <th className="px-2 py-1.5 w-14"></th>
          </tr></thead>
          <tbody>
            {TASK_STATUS_OPTIONS.map((s) => {
              const dateField = TASK_STATUS_DATE_FIELD[s];
              const confirmerField = TASK_STATUS_CONFIRMER_FIELD[s];
              const isCurrent = task.status === s;
              const isDone = task[confirmerField];
              return (
                <tr key={s} className={"border-t border-slate-100 " + (isCurrent ? "bg-[#1E3A8A]/5" : "")}>
                  <td className="px-2 py-1.5 whitespace-nowrap">
                    {isDone && <span className="text-emerald-500 mr-1">✓</span>}
                    {TASK_STATUS_LABELS[s]}
                    {isCurrent && <span className="ml-1 text-[9px] px-1.5 py-0.5 rounded-full bg-[#1E3A8A] text-white">현재</span>}
                  </td>
                  <td className="px-2 py-1.5">
                    <input type="date" value={getDate(dateField)} onChange={(e) => setPendingDates((prev) => ({ ...prev, [dateField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" />
                  </td>
                  <td className="px-2 py-1.5">
                    {isDone ? (
                      <span className="inline-flex items-center gap-1 w-full px-1.5 py-1 rounded border border-slate-100 bg-slate-50 text-slate-600" title="확인 완료 — 이후 변경 불가">
                        🔒 {task[confirmerField]}
                      </span>
                    ) : (
                      <select value={getConfirmer(confirmerField)} onChange={(e) => setPendingConfirmers((prev) => ({ ...prev, [confirmerField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]">
                        <option value="">미지정</option>
                        {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
                      </select>
                    )}
                  </td>
                  <td className="px-2 py-1.5 text-center">
                    <button onClick={() => confirmTaskStep(s)} className="text-[10px] px-2 py-1 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 whitespace-nowrap">확인</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {(task.images || []).length > 0 && (
        <div className="grid grid-cols-4 gap-1.5 mb-3">
          {task.images.map((img, i) => (
            <ZoomableImage key={i} src={img} alt={`참고이미지 ${i + 1}`} className="w-full h-14 object-cover rounded-lg border border-slate-200" />
          ))}
        </div>
      )}

      <div className="mb-3">
        {task.linkedProposalCode ? (
          <div className="text-xs px-2.5 py-1.5 rounded-lg bg-[#1E3A8A]/5 text-[#1E3A8A] flex items-center justify-between">
            <span>📄 연결된 제안서: [{task.linkedProposalCode}] {task.linkedProposalClient}{task.linkedProposalProduct ? ` — ${task.linkedProposalProduct}` : ""}</span>
            <button onClick={() => setLinking(true)} className="underline text-[11px] shrink-0 ml-2">변경</button>
          </div>
        ) : (
          <button onClick={() => setLinking(true)} className="text-xs px-2.5 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5">📄 제안서 연결</button>
        )}
        {linking && (
          <select
            autoFocus
            defaultValue=""
            onChange={(e) => { const p = (proposals || []).find((pr) => String(pr.id) === e.target.value); if (p) onLinkProposal(task, p); setLinking(false); }}
            onBlur={() => setLinking(false)}
            className="mt-2 w-full text-xs px-2 py-1.5 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]"
          >
            <option value="">제안서 선택...</option>
            {(proposals || []).slice(0, 100).map((p) => <option key={p.id} value={p.id}>{proposalOptionLabel(p)}</option>)}
          </select>
        )}
      </div>

      <div className="text-[11px] font-semibold text-slate-500 mb-1.5">💬 업무 소통 & 채팅</div>
      <div className="space-y-1.5 mb-2 max-h-48 overflow-y-auto pr-0.5">
        {(task.comments || []).length === 0 && <p className="text-[11px] text-slate-300">아직 대화가 없습니다. 첫 메시지를 남겨보세요.</p>}
        {(task.comments || []).map((c) => {
          const mine = c.author === currentUserName;
          return (
            <div key={c.id} className={"flex " + (mine ? "justify-end" : "justify-start")}>
              <div className={"max-w-[80%] rounded-2xl px-3 py-1.5 text-[11px] " + (mine ? "bg-[#1E3A8A] text-white rounded-br-sm" : "bg-slate-100 text-slate-700 rounded-bl-sm")}>
                <div className={"font-semibold mb-0.5 " + (mine ? "text-white/80" : "text-slate-500")}>{c.author} <span className="font-normal opacity-70">· {c.createdAt}</span></div>
                <div className="whitespace-pre-line">{c.text}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex gap-1.5">
        <input value={commentText} onChange={(e) => setCommentText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitComment()} placeholder="예: 내일까지 완료하겠습니다 / 공장 견적 확인 필요..." className="flex-1 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]" />
        <button onClick={submitComment} className="text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-white hover:opacity-90 whitespace-nowrap">전송</button>
      </div>
      {isAdmin && (
        <div className="text-right mt-2">
          <button onClick={() => onDelete(task)} className="text-[11px] text-red-400 hover:text-red-600">🗑️ 지시 삭제</button>
        </div>
      )}
    </div>
  );
}

function TaskAssignmentView({ tasks, accounts, proposals, isAdmin, currentUserName, onBack, onCreate, onUpdate, onAddComment, onLinkProposal, onDelete }) {
  const [showCreate, setShowCreate] = useState(false);
  const [filter, setFilter] = useState("전체"); // 전체 | 요청 | 진행중 | 완료

  const [detailTask, setDetailTask] = useState(null); // 행 클릭시 상세(단계관리+이미지+채팅) 모달을 보여줄 업무건
  const filtered = (tasks || []).filter((t) => filter === "전체" || t.status === filter);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedFiltered = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div className="flex gap-1.5 mb-5">
        {["전체", ...TASK_STATUS_OPTIONS].map((f) => (
          <button key={f} onClick={() => setFilter(f)} className={"text-xs px-3 py-1.5 rounded-full font-medium " + (filter === f ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>{f === "전체" ? "전체" : TASK_STATUS_LABELS[f]}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">해당하는 업무 지시가 없습니다.</div>
      ) : (
        <div className="bg-white border border-slate-300 shadow-sm rounded-xl overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              <th className="text-left px-3 py-3 font-medium">지시일자</th>
              <th className="text-left px-3 py-3 font-medium">고객사명</th>
              <th className="text-left px-3 py-3 font-medium">요청자</th>
              <th className="text-left px-3 py-3 font-medium">담당자</th>
              <th className="text-left px-3 py-3 font-medium">요청 제품 및 조사 내용</th>
              <th className="text-left px-3 py-3 font-medium">마감 희망일</th>
              <th className="text-center px-3 py-3 font-medium">진행 단계</th>
              <th className="text-center px-3 py-3 font-medium">관리</th>
            </tr></thead>
            <tbody>
              {pagedFiltered.map((t, idx) => (
                <tr key={t.id} onClick={() => setDetailTask(t)} className={"border-t border-slate-100 cursor-pointer hover:bg-[#1E3A8A]/5 align-top " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  <td className="px-3 py-3 whitespace-nowrap text-xs text-slate-500">{t.instructionDate || "-"}</td>
                  <td className="px-3 py-3 font-medium whitespace-nowrap" style={{ color: "#111827" }}>{t.clientName}</td>
                  <td className="px-3 py-3 text-xs text-slate-500 whitespace-nowrap">{t.requestedBy || "-"}</td>
                  <td className="px-3 py-3 text-xs text-slate-500 whitespace-nowrap">{t.assignee}</td>
                  <td className="px-3 py-3 text-slate-600 min-w-[240px]" style={{ whiteSpace: "pre-wrap", wordBreak: "break-all" }}>{t.content}</td>
                  <td className="px-3 py-3 whitespace-nowrap text-xs text-slate-500">{t.dueDate || "-"}</td>
                  <td className="px-3 py-3 text-center whitespace-nowrap">
                    <span className={"inline-block text-[10px] px-2 py-1 rounded-full font-semibold border " + (TASK_STATUS_COLORS[t.status] || "bg-slate-50 text-slate-500 border-slate-200")}>{TASK_STATUS_LABELS[t.status] || t.status}</span>
                  </td>
                  <td className="px-3 py-3 text-center whitespace-nowrap">
                    {isAdmin && <button onClick={(e) => handleDeleteRow(e, t)} title="삭제" className="text-red-400 hover:text-red-600">🗑️</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}

      {showCreate && <TaskCreateModal accounts={accounts} currentUserName={currentUserName} onClose={() => setShowCreate(false)} onSave={onCreate} />}
      {detailTask && (
        <SampleDetailModal onClose={() => setDetailTask(null)}>
          <TaskCard task={detailTask} isAdmin={isAdmin} currentUserName={currentUserName} accounts={accounts} proposals={proposals}
            onUpdate={onUpdate} onAddComment={onAddComment} onLinkProposal={onLinkProposal} onDelete={(t) => { onDelete(t); setDetailTask(null); }} />
        </SampleDetailModal>
      )}
    </main>
  );
}

// 인보이스 참고사항에 쓰는 "YYYY년 M월 D일" 포맷 변환(<input type="date">의 YYYY-MM-DD를 받아 변환)
function formatKoreanDate(dateStr) {
  if (!dateStr) return "";
  const [y, m, d] = dateStr.split("-");
  if (!y || !m || !d) return dateStr;
  return `${y}년 ${Number(m)}월 ${Number(d)}일`;
}

  set("B19", 3); set("E19", "항공택배비"); set("G19", "1KG 미만"); set("I19", data.domesticMethod === "항공" ? 1 : 0); set("K19", feesForXlsx["항공"]); set("L19", { f: "I19*K19" }); set("M19", data.domesticMethod === "항공" ? (data.domesticRemark || "") : "");

// SheetJS(XLSX.full.min.js)로 실제 .xlsx 파일 생성+다운로드. 병합/수식/열너비는 원본서식과 동일하게 재현되지만,
// 커뮤니티 버전 SheetJS는 셀 테두리·색상 등 세부 서식과 이미지 삽입을 안정적으로 지원하지 않아 그 부분은 생략됨(다운로드 버튼 옆 안내문구로 고지).
function downloadSampleInvoiceXlsx(data) {
  const cellsData = buildSampleInvoiceSheetData(data);
  const ws = {};
  Object.entries(cellsData).forEach(([addr, v]) => {
    if (v && typeof v === "object" && "f" in v) ws[addr] = { t: "n", f: v.f };
    else if (typeof v === "number") ws[addr] = { t: "n", v };
    else ws[addr] = { t: "s", v: String(v) };
  });
  ws["!ref"] = "B1:N33";
  ws["!merges"] = SAMPLE_INVOICE_MERGES.map((m) => XLSX.utils.decode_range(m));
  ws["!cols"] = SAMPLE_INVOICE_COL_WIDTHS;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "샘플비 인보이스");
  const fname = `샘플비인보이스_${(data.clientName || "고객사").replace(/[\\/:*?"<>|]/g, "")}_${data.writeDate || todayStr()}.xlsx`;
  XLSX.writeFile(wb, fname);
}

/* 고객 안내문 생성 모달
   - 기본 안내문 3종(재고없음/배송방식/계좌입금)은 코드에 내장. 배송방식·계좌입금 문구는 배송비 설정값을 실시간 반영한다.
   - 사용자가 [+ 안내문 추가]로 자기 템플릿을 무제한 추가/수정/삭제할 수 있고, localStorage에 영구 저장된다.
   - 본문 textarea는 자유 편집 가능하며, [원클릭 복사]는 "화면에 보이는 현재 텍스트"를 그대로 복사한다. */
const ANNOUNCE_STORAGE_KEY = "cosmepack_announce_templates_v1";
const ANNOUNCE_HIDDEN_KEY = "cosmepack_announce_hidden_v1"; // 숨긴 기본 안내문 key 목록

function loadAnnounceCustom() {
  try { const v = JSON.parse(localStorage.getItem(ANNOUNCE_STORAGE_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function saveAnnounceCustom(list) {
  try { localStorage.setItem(ANNOUNCE_STORAGE_KEY, JSON.stringify(list)); } catch (e) { console.error(e); }
}
function loadAnnounceHidden() {
  try { const v = JSON.parse(localStorage.getItem(ANNOUNCE_HIDDEN_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function saveAnnounceHidden(list) {
  try { localStorage.setItem(ANNOUNCE_HIDDEN_KEY, JSON.stringify(list)); } catch (e) { console.error(e); }
}

function SampleAnnounceModal({ shippingFees, onClose }) {
  const fees = shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES;
  const [shipMethod, setShipMethod] = useState("일반");
  const [copied, setCopied] = useState(false);
  const [custom, setCustom] = useState(() => loadAnnounceCustom());
  const [hidden, setHidden] = useState(() => loadAnnounceHidden());
  const [adding, setAdding] = useState(false);
  const [newLabel, setNewLabel] = useState("");
  const [newBody, setNewBody] = useState("");
  const [drafts, setDrafts] = useState({}); // 탭별로 사용자가 수정한 본문(키: 탭 key)

  const text1 = "안녕하세요, 고객님. 요청하신 제품 샘플 발송 관련하여 안내드립니다. 통상적으로 많이 찾으시는 범용 샘플은 한국 본사에 재고를 보유하고 있으나, 고객님께서 요청하신 모델은 특수 규격 제품으로 현재 중국 지사에서 공장 발주를 통해 수급해야 하는 상황입니다. 이에 따라 현지 공장에서 지사로 입고된 후 한국으로 발송되는 과정이 추가되어, 일반 샘플보다 준비 기간이 다소 소요되는 점 양해 부탁드립니다.";
  const text2 = `안녕하세요, 고객님. 요청하신 제품의 샘플 발송에 대해 안내드립니다. 저희는 고객님의 부담을 덜어드리고자 샘플비와 중국 현지 내 운송료 전액을 당사에서 지원해 드리고 있습니다. 다만, 샘플은 아이템당 1개로 제한되며, 한국까지의 배송비는 수령 방식에 따라 아래와 같이 운영되오니 확인 후 선택 부탁드립니다.\n\n1. 일반 배송 (경제적 선택)\n- 방식: 매주 월요일 중국에서 한국 본사로 일괄 발송 → 국내 택배로 재발송\n- 배송비: ${fees["일반"].toLocaleString("ko-KR")}원 / 소요 기간: 약 10일\n\n2. 항공 특송 (빠른 수령)\n- 방식: 중국 지사에서 고객님 주소지로 항공 직배송\n- 배송비: ${fees["항공"].toLocaleString("ko-KR")}원 / 소요 기간: 약 4~5일\n\n원하시는 배송 방법을 알려주시면 입금 계좌 안내와 함께 신속히 발송 준비를 도와드리겠습니다. 감사합니다.\n(주)비케이브로 백상선 올림`;
  const shipFee = fees[shipMethod];
  const vat = Math.round(shipFee * 0.1);
  const total = shipFee + vat;
  const text3 = `입금 계좌 (선입금 확인 후 발송)\n- 국민은행 : 024837-04-007281\n- 예금주 : (주)비케이브로\n- 입금요청금액 : ${shipFee.toLocaleString("ko-KR")}원 + ${vat.toLocaleString("ko-KR")}원(부가가치세) = ${total.toLocaleString("ko-KR")}원\n\n세금계산서 발행을 위하여, 사업자등록증 사본과 이메일 주소 부탁드립니다. 입금 후 회신 주시면 신속히 준비하여 발송해 드리겠습니다.`;

  const builtins = [
    { key: "stock", label: "국내 재고 없음 안내", body: text1 },
    { key: "ship", label: "배송방식 선택 안내", body: text2 },
    { key: "bank", label: "계좌입금·VAT 안내", body: text3, hasShipToggle: true },
  ].filter((t) => !hidden.includes(t.key));
  const customTabs = custom.map((c) => ({ key: c.id, label: c.label, body: c.body, custom: true }));
  const tabs = [...builtins, ...customTabs];

  const [tabKey, setTabKey] = useState(tabs[0] ? tabs[0].key : "");
  const active = tabs.find((t) => t.key === tabKey) || tabs[0];
  // 사용자가 수정한 내용이 있으면 그것을, 없으면 템플릿 원본을 보여준다
  const currentText = active ? (drafts[active.key] != null ? drafts[active.key] : active.body) : "";

  const onEdit = (v) => {
    if (!active) return;
    setDrafts((prev) => ({ ...prev, [active.key]: v }));
    // 사용자 추가 템플릿은 수정 내용을 그대로 영구 저장(다음에 열어도 유지)
    if (active.custom) {
      const next = custom.map((c) => (c.id === active.key ? { ...c, body: v } : c));
      setCustom(next); saveAnnounceCustom(next);
    }
  };
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(currentText); // ⚠️ 템플릿 원본이 아니라 "지금 편집 중인 본문"을 복사
      setCopied(true); setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      window.prompt("아래 내용을 복사해 주세요.", currentText);
    }
  };
  const addTemplate = () => {
    const label = newLabel.trim();
    if (!label) { alert("안내문 이름을 입력해 주세요."); return; }
    const item = { id: "c" + Date.now(), label, body: newBody };
    const next = [...custom, item];
    setCustom(next); saveAnnounceCustom(next);
    setTabKey(item.id); setAdding(false); setNewLabel(""); setNewBody("");
  };
  const removeTab = (e, t) => {
    e.stopPropagation();
    if (!window.confirm(`"${t.label}" 안내문을 목록에서 삭제할까요?`)) return;
    if (t.custom) {
      const next = custom.filter((c) => c.id !== t.key);
      setCustom(next); saveAnnounceCustom(next);
    } else {
      const next = [...hidden, t.key]; // 기본 안내문은 숨김 처리(아래 복원 버튼으로 되살릴 수 있음)
      setHidden(next); saveAnnounceHidden(next);
    }
    const rest = tabs.filter((x) => x.key !== t.key);
    setTabKey(rest[0] ? rest[0].key : "");
  };
  const restoreBuiltins = () => { setHidden([]); saveAnnounceHidden([]); };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-xl overflow-hidden flex flex-col" style={{ maxHeight: "88vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">💬 고객 안내문 생성</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>

        {/* 탭 + 안내문 추가 */}
        <div className="flex flex-wrap items-center gap-1.5 px-6 pt-4">
          {tabs.map((t) => (
            <span key={t.key} onClick={() => setTabKey(t.key)}
              className={"group relative inline-flex items-center gap-1 text-xs pl-3 pr-2 py-1.5 rounded-full font-medium whitespace-nowrap cursor-pointer " + (active && active.key === t.key ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>
              {t.label}
              <button onClick={(e) => removeTab(e, t)} title="이 안내문 삭제"
                className={"opacity-0 group-hover:opacity-100 transition text-[11px] leading-none rounded-full w-4 h-4 flex items-center justify-center " + (active && active.key === t.key ? "hover:bg-white/20" : "hover:bg-slate-300")}>✕</button>
            </span>
          ))}
          <button onClick={() => setAdding((v) => !v)} className="text-xs px-3 py-1.5 rounded-full font-semibold border border-dashed border-[#1E3A8A]/40 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 whitespace-nowrap">＋ 안내문 추가</button>
          {hidden.length > 0 && (
            <button onClick={restoreBuiltins} className="text-[11px] px-2 py-1 rounded-full text-slate-400 hover:text-slate-600 underline whitespace-nowrap">기본 안내문 복원</button>
          )}
        </div>

        {adding && (
          <div className="mx-6 mt-3 p-3 rounded-lg border border-slate-200 bg-slate-50 space-y-2">
            <input value={newLabel} onChange={(e) => setNewLabel(e.target.value)} placeholder="안내문 이름 (예: 제작기간 안내)"
              className="w-full text-xs px-3 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]" />
            <textarea value={newBody} onChange={(e) => setNewBody(e.target.value)} rows={4} placeholder="안내문 내용을 입력하세요"
              className="w-full text-xs p-2.5 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A] resize-y" />
            <div className="flex justify-end gap-2">
              <button onClick={() => { setAdding(false); setNewLabel(""); setNewBody(""); }} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600">취소</button>
              <button onClick={addTemplate} className="text-xs px-3 py-1.5 rounded-lg bg-[#1E3A8A] text-white font-semibold">추가</button>
            </div>
          </div>
        )}

        {active && active.hasShipToggle && (
          <div className="flex items-center gap-2 px-6 pt-3">
            <span className="text-xs text-slate-500">배송방식:</span>
            {["일반", "항공"].map((m) => (
              <button key={m} onClick={() => { setShipMethod(m); setDrafts((prev) => { const n = { ...prev }; delete n[active.key]; return n; }); }}
                className={"text-xs px-2.5 py-1 rounded-full font-medium " + (shipMethod === m ? "bg-amber-500 text-white" : "border border-slate-200 text-slate-600")}>
                {m} ({fees[m].toLocaleString("ko-KR")}원)
              </button>
            ))}
            <span className="text-[11px] text-slate-400">금액이 본문에 자동 반영됩니다</span>
          </div>
        )}

        <div className="p-6 overflow-y-auto flex-1">
          {tabs.length === 0 ? (
            <div className="text-center text-xs text-slate-400 py-8">안내문이 없습니다. [＋ 안내문 추가]로 새로 만들어 주세요.</div>
          ) : (
            <>
              <textarea value={currentText} onChange={(e) => onEdit(e.target.value)} rows="8"
                className="w-full p-4 border rounded-xl text-sm leading-relaxed border-slate-200 outline-none focus:border-[#1E3A8A] resize-y" />
              <p className="text-[11px] text-slate-400 mt-2">✏️ 본문을 직접 수정할 수 있고, 복사 버튼은 지금 화면의 내용을 그대로 복사합니다.</p>
            </>
          )}
        </div>

        <div className="px-6 py-4 border-t border-slate-200 flex justify-end shrink-0">
          <button onClick={copy} disabled={!active} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 disabled:opacity-40">{copied ? "✅ 복사됨!" : "📋 원클릭 복사"}</button>
        </div>
      </div>
    </div>
  );
}

function StockPickerModal({ stock, productName, onClose, onPick }) {
  // 상단에서 선택된 "요청 제품"과 정확히 이름이 일치하는 재고만 보여준다(다른 제품 재고는 아예 안 보이게 필터링)
  const matched = (stock || []).filter((s) => s.productName === productName);
  const available = matched.filter((s) => (Number(s.quantity) || 0) > 0);
  const totalQty = available.reduce((sum, s) => sum + (Number(s.quantity) || 0), 0);
  const [selected, setSelected] = useState(null); // 클릭해서 고른 재고 항목(출고수량을 정하기 전 단계)
  const [outQty, setOutQty] = useState(1); // 사용자가 직접 입력/수정하는 출고 요청 수량
  const maxQty = selected ? Number(selected.quantity) || 0 : 0;
  const overLimit = selected && Number(outQty) > maxQty;

  const selectRow = (s) => { setSelected(s); setOutQty(1); };
  const confirmPick = () => {
    if (!selected) return;
    if (overLimit) return; // 초과 입력 상태에서는 확정 불가(아래 경고문구로 이미 안내됨)
    onPick(selected, Math.max(1, Number(outQty) || 1));
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-md overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-5 py-3 border-b border-slate-200 flex items-center justify-between">
          <h3 className="text-sm font-bold text-slate-800">📦 한국 샘플 재고 현황 — {productName || "(제품 미선택)"}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg leading-none">✕</button>
        </div>
        <div className="max-h-96 overflow-y-auto">
          {available.length === 0 ? (
            <div className="px-5 py-8 text-center">
              <p className="text-xs text-amber-700 bg-amber-50 rounded-lg px-4 py-3 leading-relaxed">
                ⚠️ 현재 선택하신 제품의 한국 샘플 재고가 없습니다.<br />
                (재고 위치를 '중국 발송'으로 변경하거나 한국 재고 입고 후 진행해주세요.)
              </p>
            </div>
          ) : (
            <>
              <div className="px-5 py-2 text-xs text-[#1E3A8A] bg-[#1E3A8A]/5 font-semibold">현재 한국 재고: {totalQty.toLocaleString("ko-KR")}개</div>
              {available.map((s) => (
                <button
                  key={s.id} onClick={() => selectRow(s)}
                  className={"w-full flex items-center justify-between px-5 py-2.5 text-left border-b border-slate-50 " + (selected && selected.id === s.id ? "bg-[#1E3A8A]/5" : "hover:bg-slate-50")}
                >
                  <div>
                    <div className="text-sm font-medium text-slate-800">{s.productName}</div>
                    <div className="text-xs text-slate-400">{s.location || "본사 창고"}</div>
                  </div>
                  <span className="text-xs px-2 py-1 rounded-full bg-[#1E3A8A]/10 text-[#1E3A8A] font-semibold shrink-0">보유 {s.quantity}개</span>
                </button>
              ))}
              {selected && (
                <div className="px-5 py-3 bg-slate-50 border-t border-slate-100">
                  <div className="flex items-center gap-3">
                    <span className="text-xs text-slate-500 whitespace-nowrap">현재 보유 {maxQty}개 중</span>
                    <input
                      type="number" min="1" max={maxQty} value={outQty}
                      onChange={(e) => setOutQty(e.target.value)}
                      className={"w-20 px-2 py-1.5 rounded-lg border text-sm outline-none " + (overLimit ? "border-red-400 text-red-600" : "border-slate-200")}
                    />
                    <span className="text-xs text-slate-500 whitespace-nowrap">개 출고</span>
                  </div>
                  {overLimit && <p className="text-[11px] text-red-500 mt-1.5">보유 재고({maxQty}개)보다 많은 수량을 입력할 수 없습니다.</p>}
                  <button
                    onClick={confirmPick} disabled={overLimit}
                    className={"w-full mt-2 text-xs px-3 py-2 rounded-lg font-medium " + (overLimit ? "bg-slate-200 text-slate-400 cursor-not-allowed" : "bg-[#1E3A8A] text-white hover:opacity-90")}
                  >
                    선택 완료
                  </button>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}
