      {view === "pipeline" && activeStep === 3 && (
        <ProposalEditStage
          draftItems={draftItems} setDraftItems={setDraftItems} removeDraftItem={removeDraftItem}
          clientInfo={clientInfo} setClientInfo={setClientInfo}
          supplierLogo={supplierLogo} isAdmin={isAdmin}
          readOnly={proposalReadOnly} isEditingExisting={!!editingProposalId} historyRecord={editingProposalHistory}
          onBack={() => setActiveStep(2)}
          onSave={async (opts) => {
            const returnToList = !!(opts && opts.returnToList); // 하단 [💾 수정 후 저장]에서만 true
            if (draftItems.length === 0) { setToast("먼저 품목을 추가해주세요."); return; }
            if (!clientInfo.clientName.trim() || !clientInfo.employee.trim()) { setToast("고객사명과 담당 직원명을 입력해주세요."); return; }
            // 직원도 승인완료/발송완료 제안서를 자유롭게 저장할 수 있도록 잠금 가드를 제거함(요청에 따름)
            const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
            const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);
            const itemSummary = draftItems.length > 1 ? `${draftItems[0].productName} 외 ${draftItems.length - 1}건` : draftItems[0].productName;
            const proposalTitle = clientInfo.proposalTitle.trim() || itemSummary;
            const actorName = (roleUser && roleUser.displayName) || "알 수 없음";
            const nextReviewStatus = isAdmin ? "승인완료" : "검토대기";

            if (editingProposalId) {
              // 기존 제안서 수정 저장 — 새로 만들지 않고 덮어쓰기.
              // ⚠️ 저장 실행은 미리보기 [💾 저장]과 완전히 같은 savePreviewEdits를 통과한다(경로 단일화).
              //    다만 patch에는 이 폼이 실제로 들고 있는 값만 담는다 — greeting/terms/supplier는
              //    미리보기에서만 편집하는 값이라 여기서 넘기면 undefined로 덮어써 문구가 날아간다.
              const patch = {
                clientName: clientInfo.clientName, contact: clientInfo.contact, channel: clientInfo.channel, employee: clientInfo.employee,
                proposalTitle, itemSummary, totalAmount, totalCbm, items: draftItems,
                reviewStatus: nextReviewStatus,
              };
              const saved = await savePreviewEdits(editingProposalId, patch, "proposal", {
                toast: returnToList ? "제안서가 성공적으로 수정되었습니다." : (isAdmin ? "최종 승인되어 저장되었습니다. (같은 제안번호로 갱신됨)" : "수정사항이 저장되어 대표님 검토 요청되었습니다."),
              });
              setEditingProposalHistory((prev) => ({ ...(prev || {}), updatedAt: saved.updatedAt, updatedBy: saved.updatedBy }));
              // 하단 [💾 수정 후 저장]으로 저장한 경우에만 편집 상태를 정리하고 제안서 관리 목록으로 복귀한다.
              // (미리보기 모달의 저장 버튼은 그 자리에 머무르는 기존 동작을 유지)
              if (returnToList) {
                setEditingProposalId(null);
                setProposalReadOnly(false);
                setEditingProposalHistory(null);
                setView("proposals");
              }
              return;
            }

            const code = `PROP-${todayStr()}-${String(proposalList.length + 1).padStart(3, "0")}`;
            const record = {
              code, status: "견적제출", reviewStatus: nextReviewStatus, createdAt: nowDateTimeStr(), createdBy: actorName,
              clientName: clientInfo.clientName, contact: clientInfo.contact, channel: clientInfo.channel, employee: clientInfo.employee,
              proposalTitle, itemSummary, totalAmount, totalCbm,
              items: draftItems, validUntil: addDays(30),
            };
            setProposalList((prev) => [{ id: Date.now(), ...record }, ...prev]); // 즉시 화면 반영 (로컬 캐시)
            upsertClientRecord(clientInfo);
            try {
              await fsAdd(COLLECTIONS.proposals, record);
              setToast(isAdmin ? "제안서가 최종 승인되어 저장되었습니다." : "제안서가 저장되어 대표님 검토 요청되었습니다.");
            } catch (e) {
              console.error(e);
              setToast("Firestore 저장 중 오류가 발생했습니다. (로컬에는 반영됨)");
            }
            setDraftItems([]);
            setClientInfo({ clientName: "", contact: "", channel: "카카오채널", employee: (roleUser && roleUser.displayName) || "", proposalTitle: "" });
          }}
          onPrint={() => {
            if (draftItems.length === 0) { setToast("먼저 품목을 추가해주세요."); return; }
            if (!clientInfo.clientName.trim()) { setToast("고객사명을 입력해주세요."); return; }
            const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
            const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);
            // 이미 저장된 제안서를 수정하는 중이면(editingProposalId 있음) 그 원본 레코드의 id·코드·발송상태 등도 함께 실어준다 —
            // 그래야 이 미리보기에서도 "💾 저장" 버튼이 정상적으로 뜨고 실제 저장이 그 제안서에 반영된다.
            // 수정 모드에서 열 때는 minimalHeader를 켜서 [닫기]/[💾 제안서 저장] 2개만 남기고 발송상태배지·발송완료·인쇄 버튼은 숨긴다.
            const original = editingProposalId ? proposalList.find((p) => p.id === editingProposalId) : null;
            setPdfData({ ...(original || {}), ...clientInfo, items: draftItems, totalAmount, totalCbm, validUntil: (original && original.validUntil) || addDays(30), readOnly: proposalReadOnly, minimalHeader: !!editingProposalId });
          }}
        />
      )}

      {view === "pipeline" && activeStep === 4 && (
        <SampleStageView samples={sampleList} accounts={accounts} proposals={proposalList} products={productsList} sampleStock={sampleStockList} onDecrementStock={decrementSampleStock} supplierLogo={supplierLogo} shippingFees={shippingFees} shippingFeeNotes={shippingFeeNotes} onSaveShippingFees={saveShippingFees} currentUserName={(roleUser && roleUser.displayName) || ""} isAdmin={isAdmin} onAddMemo={addSampleMemo} onDeleteMemo={deleteSampleMemo}
          onCreate={addSample} onUpdate={updateSample} onDelete={deleteSample}
          onAddStock={addSampleStock} onUpdateStock={updateSampleStock} onSaveStockEdits={saveSampleStockEdits} onDeleteStock={deleteSampleStock}
          initialProposalId={sampleInitProposalId} onConsumeInitialProposal={() => setSampleInitProposalId(null)} />
      )}

      {view === "pipeline" && activeStep === 5 && (
        <OrderStageListView
          orders={sampleList.filter((s) => s.orderConverted)}
          proposalList={proposalList}
          invoiceList={invoiceList}
          onOpenProposal={(p) => setPdfData({ ...p, readOnly: true })}
          onOpenInvoice={(iv, mode) => setInvoiceData({ ...iv, readOnly: mode === "view" })} // 👁️=조회전용 / ✏️=편집
          onDuplicate={duplicateInvoice}
        />
      )}
    </div>
  );
}

/* ===================== 고객용 전자서명 · 동의 페이지 =====================
   고객은 로그인 없이 링크(#고객동의?건=<인보이스ID>)로 접속한다. Firebase 익명인증은
   Root에서 이미 끝나 있으므로 문서 조회/서명 저장이 그대로 동작한다.
   문서(인보이스/계약서) 마크업은 PdfPreview를 그대로 재사용한다 — 별도 사본을 만들면
   서식을 고칠 때마다 두 곳을 맞춰야 해서 반드시 어긋나기 때문. */

/* 고객이 서명을 마치면 clients 컬렉션의 해당 업체 레코드도 같이 갱신한다.
   업체 관리 화면은 이 필드들만 보고 계약 배지를 그리므로, 이 동기화가 빠지면
   서명은 됐는데 업체 카드는 계속 "미체결"로 남는다. 업체명이 같은 중복 레코드가
   있을 수 있어 where 결과 전체를 갱신한다. */
async function syncClientContractByName(clientName, signature, signerName) {
  const name = (clientName || "").trim();
  if (!name || !FIREBASE_ENABLED || !db) return;
  const signedAt = nowDateTimeStr();
  const patch = {
    hasValidContract: true,
    contractSignedAt: signedAt,
    contractSignerName: signerName || "",
    contractSignImage: signature || "", // 정식 키
    contractSignData: signature || "",  // 구버전 키도 함께 기록해 예전 코드와 호환
    contractExpireAt: addDaysFrom(signedAt.slice(0, 10), CONTRACT_VALID_DAYS), // 계약서 제2조: 체결일로부터 1년
  };
  try {
    const snap = await db.collection(COLLECTIONS.clients).where("name", "==", name).get();
    await Promise.all(snap.docs.map((d) => d.ref.update(patch)));
  } catch (e) {
    console.error("업체 계약상태 동기화 실패", e);
  }
}

// 서명 패드 — PC 마우스 드래그 + 모바일 터치 + 도장 업로드 + 텍스트 직인 3방식
function SignaturePad({ onChange }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const [tab, setTab] = useState("draw"); // draw | upload | text
  const [typedName, setTypedName] = useState("");
  const [uploaded, setUploaded] = useState("");
  const [hasDrawn, setHasDrawn] = useState(false);

  // 캔버스를 실제 화면 크기 × devicePixelRatio로 맞춰야 선이 흐려지지 않는다
  const setupCanvas = () => {
    const cv = canvasRef.current;
    if (!cv) return;
    const rect = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(rect.width * dpr));
    cv.height = Math.max(1, Math.round(rect.height * dpr));
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#111827";
  };
  useEffect(() => {
    if (tab !== "draw") return;
    setupCanvas();
    const onResize = () => { setupCanvas(); setHasDrawn(false); };
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tab]);

  const posOf = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const src = e.touches && e.touches.length ? e.touches[0] : e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  };
  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const p = posOf(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault(); // 모바일에서 서명 중 화면이 스크롤되는 것을 막는다
    const ctx = canvasRef.current.getContext("2d");
    const p = posOf(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    if (!hasDrawn) setHasDrawn(true);
  };
  const end = () => {
    if (!drawing.current) return;
    drawing.current = false;
    if (onChange) onChange(canvasRef.current.toDataURL("image/png"));
  };
  const clearCanvas = () => {
    const cv = canvasRef.current;
    cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
    setHasDrawn(false);
    if (onChange) onChange("");
  };

  // 이름을 붉은 원형 직인 스탬프 이미지로 변환
  const makeTextStamp = (name) => {
    const text = (name || "").trim();
    if (!text) return "";
    const size = 220;
    const cv = document.createElement("canvas");
    cv.width = size; cv.height = size;
    const ctx = cv.getContext("2d");
    ctx.strokeStyle = "#C0392B"; ctx.fillStyle = "#C0392B";
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2 - 8, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2 - 22, 0, Math.PI * 2); ctx.stroke();
    const chars = text.slice(0, 4);
    const fontSize = chars.length <= 2 ? 74 : chars.length === 3 ? 60 : 52;
    ctx.font = `bold ${fontSize}px "Malgun Gothic", "Apple SD Gothic Neo", serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (chars.length <= 2) {
      ctx.fillText(chars, size / 2, size / 2 + 2);
    } else {
      // 3~4자는 2줄로 나눠 도장처럼 배치
      const half = Math.ceil(chars.length / 2);
      ctx.fillText(chars.slice(0, half), size / 2, size / 2 - fontSize * 0.45);
      ctx.fillText(chars.slice(half), size / 2, size / 2 + fontSize * 0.45);
    }
    return cv.toDataURL("image/png");
  };
  const applyTextStamp = (v) => {
    setTypedName(v);
    if (onChange) onChange(makeTextStamp(v));
  };
  const onUpload = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setUploaded(reader.result); if (onChange) onChange(reader.result); };
    reader.readAsDataURL(file);
  };

  const tabCls = (k) => "flex-1 text-xs px-2 py-2 rounded-lg font-semibold border " +
    (tab === k ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "bg-white border-slate-200 text-slate-600");

  return (
    <div>
      <div className="flex gap-1.5 mb-2">
        <button type="button" onClick={() => { setTab("draw"); if (onChange) onChange(""); }} className={tabCls("draw")}>✍️ 직접 그리기</button>
        <button type="button" onClick={() => { setTab("upload"); if (onChange) onChange(uploaded || ""); }} className={tabCls("upload")}>🖼️ 도장 업로드</button>
        <button type="button" onClick={() => { setTab("text"); if (onChange) onChange(makeTextStamp(typedName)); }} className={tabCls("text")}>⌨️ 텍스트 서명</button>
      </div>

      {tab === "draw" && (
        <div>
          <canvas
            ref={canvasRef}
            className="w-full bg-white border-2 border-dashed border-slate-300 rounded-lg"
            style={{ height: "160px", touchAction: "none", cursor: "crosshair" }}
            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
            onTouchStart={start} onTouchMove={move} onTouchEnd={end}
          />
          <div className="flex items-center justify-between mt-1.5">
            <span className="text-[11px] text-slate-400">{hasDrawn ? "서명이 입력되었습니다" : "이 영역에 마우스 또는 손가락으로 서명해 주세요"}</span>
            <button type="button" onClick={clearCanvas} className="text-[11px] text-slate-500 border border-slate-200 rounded px-2 py-1 hover:bg-slate-50">지우기</button>
          </div>
        </div>
      )}

      {tab === "upload" && (
        <div>
          <input type="file" accept="image/*" onChange={(e) => onUpload(e.target.files && e.target.files[0])}
            className="w-full text-xs border border-slate-200 rounded-lg p-2" />
          {uploaded && <div className="mt-2 flex justify-center bg-white border border-slate-200 rounded-lg p-2"><img src={uploaded} alt="업로드한 도장" className="h-20 object-contain" /></div>}
          <p className="text-[11px] text-slate-400 mt-1.5">회사 직인·서명 이미지(png, jpg)를 올려주세요.</p>
        </div>
      )}

      {tab === "text" && (
        <div>
          <input value={typedName} onChange={(e) => applyTextStamp(e.target.value)} placeholder="대표자 성함 (예: 홍길동)"
            className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 outline-none focus:border-[#1E3A8A]" />
          {typedName.trim() && (
            <div className="mt-2 flex justify-center bg-white border border-slate-200 rounded-lg p-2">
              <img src={makeTextStamp(typedName)} alt="텍스트 직인" className="h-20 object-contain" />
            </div>
          )}
          <p className="text-[11px] text-slate-400 mt-1.5">입력한 성함이 붉은 원형 직인으로 자동 변환됩니다.</p>
        </div>
      )}
    </div>
  );
}

/* 고객 열람 페이지(제안서·인보이스·계약서·샘플) 공용 하단 푸터 — 공식 홈페이지 안내.
   인쇄물에는 나오지 않도록 no-print. 주소 변경은 OFFICIAL_SITE_URL 한 곳만 고치면 된다. */

function CustomerConsentPage({ invoiceId }) {
  const [invoice, setInvoice] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [agreeInvoice, setAgreeInvoice] = useState(false);
  const [signerName, setSignerName] = useState("");
  const [signature, setSignature] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (!FIREBASE_ENABLED || !db) { setError("문서 저장소에 연결할 수 없습니다."); setLoading(false); return; }
        const snap = await db.collection(COLLECTIONS.invoices).doc(invoiceId).get();
        if (!alive) return;
        if (!snap.exists) { setError("요청하신 문서를 찾을 수 없습니다. 링크를 다시 확인해 주세요."); setLoading(false); return; }
        const rec = { id: snap.id, ...snap.data() };
        setInvoice(rec);
        setSignerName(rec.clientCeo || "");
        if (rec.consentStatus === "승인완료" || rec.consentStatus === "동의완료") setDone(true); // 구버전 값도 인정
        setLoading(false);
      } catch (e) {
        console.error(e);
        if (alive) { setError("문서를 불러오는 중 오류가 발생했습니다."); setLoading(false); }
      }
    })();
    return () => { alive = false; };
  }, [invoiceId]);

  const canSubmit = agreeInvoice && !!signature && signerName.trim() && !submitting;

  const submit = async () => {
    if (!canSubmit) return;
    setSubmitting(true);
    const patch = {
      consentStatus: "승인완료",
      consentAt: nowDateTimeStr(),
      consentSignerName: signerName.trim(),
      consentSignature: signature, // 계약서 (갑) 서명란에 그대로 합성된다
      reviewStatus: "고객승인완료",
    };
    try {
      await fsUpdate(COLLECTIONS.invoices, invoiceId, patch);
      setInvoice((prev) => ({ ...prev, ...patch })); // 관리자 화면은 fsSubscribe가 실시간으로 받아감
      setDone(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      console.error(e);
      alert("서명 저장에 실패했습니다. 통신 상태를 확인한 뒤 다시 시도해 주세요.");
    }
    setSubmitting(false);
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">문서를 불러오는 중입니다...</div>;
  if (error) return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
      <div className="bg-white border border-slate-200 rounded-xl p-6 max-w-md text-sm text-slate-600 text-center">{error}</div>
    </div>
  );

  // PdfPreview를 그대로 재사용하되 readOnly + consentView로 툴바/편집폼 없이 문서만 렌더링
  const docData = { ...invoice, readOnly: true, consentView: true };
  const bothDocs = { ...docData, docTabOverride: "invoice" }; // 계약서는 업체관리 단독 링크가 전담

  return (
    <div className="min-h-screen bg-slate-100">
      <div className="no-print bg-[#1E3A8A] text-white px-4 py-3 sticky top-0 z-40 shadow">
        <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
          <div className="min-w-0">
            <div className="text-sm font-bold truncate">㈜비케이브로 · 본품 양산 인보이스 발주 승인</div>
            <div className="text-[11px] text-white/70 truncate">{invoice.clientName || ""} 貴中</div>
          </div>
          {done && <span className="text-[11px] bg-emerald-500 px-2.5 py-1 rounded-full whitespace-nowrap shrink-0">✅ 승인 완료</span>}
        </div>
      </div>

      {done && (
        <div className="no-print max-w-7xl mx-auto px-4 pt-4">
          <div className="bg-white border-2 border-emerald-500 rounded-xl p-5 text-center">
            <div className="text-lg font-bold text-emerald-700 mb-1">본품 발주 최종 승인이 정상 완료되었습니다.</div>
            <div className="text-xs text-slate-500 mb-1">승인 일시 : {invoice.consentAt || "-"} · 승인자 : {invoice.consentSignerName || "-"}</div>
            <div className="text-xs text-slate-500 mb-3">확인 즉시 현지 원자재 투입 및 양산 발주(착공)가 개시됩니다.</div>
            <button onClick={() => window.print()} className="bg-[#1E3A8A] text-white text-sm font-semibold px-5 py-2.5 rounded-lg hover:opacity-90">📄 PDF 다운로드 / 인쇄</button>
          </div>
        </div>
      )}

      <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col lg:flex-row gap-6 items-start">
        {/* 좌측(PC) / 상단(모바일): 문서 뷰 */}
        <div className="flex-1 min-w-0 w-full overflow-x-auto">
          <PdfPreview open data={bothDocs} mode="invoice" onClose={() => {}} />
        </div>

        {/* 우측(PC 고정) / 하단(모바일 고정): 동의 + 서명 */}
        {!done && (
          <aside className="no-print w-full lg:w-96 shrink-0 lg:sticky lg:top-20">
            <div className="bg-white rounded-xl shadow-lg border border-slate-200 p-5">
              <div className="text-sm font-bold text-slate-800 mb-3">🚀 본품 발주 최종 승인</div>

              <label className="flex items-start gap-2 mb-2 cursor-pointer">
                <input type="checkbox" className="mt-0.5" checked={agreeInvoice} onChange={(e) => setAgreeInvoice(e.target.checked)} />
                <span className="text-xs text-slate-700">본품 발주 내역(<b>수량, 금액, 납기 조건</b>)을 확인하였으며 최종 발주를 승인합니다.</span>
              </label>

              <Field label="승인자 성함 (대표자/담당자)">
                <input className={inputCls} value={signerName} onChange={(e) => setSignerName(e.target.value)} placeholder="예: 홍길동" />
              </Field>

              <div className="text-xs font-semibold text-slate-500 mt-3 mb-1.5">서명 방식 선택</div>
              <SignaturePad onChange={setSignature} />

              <button onClick={submit} disabled={!canSubmit}
                className="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-3 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed">
                {submitting ? "승인 처리 중..." : "🚀 본품 발주 최종 승인 완료"}
              </button>
              {!canSubmit && !submitting && (
                <p className="text-[11px] text-slate-400 mt-2 text-center">승인 체크 · 성함 입력 · 서명이 모두 완료되면 승인할 수 있습니다.</p>
              )}
            </div>
          </aside>
        )}
      </div>
      <CustomerFooter />
    </div>
  );
}

/* 계약서 단독 전자서명 페이지 — 인보이스 없이 업체와 계약서만 체결할 때 쓰는 경로
   (#계약서서명?업체=<clientId>). 서명 UI/제출 흐름은 인보이스 동의 페이지와 동일한 규칙. */
function ContractOnlySignPage({ clientId }) {
  const [client, setClient] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [agree, setAgree] = useState(false);
  const [signerName, setSignerName] = useState("");
  const [signature, setSignature] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (!FIREBASE_ENABLED || !db) { setError("문서 저장소에 연결할 수 없습니다."); setLoading(false); return; }
        const snap = await db.collection(COLLECTIONS.clients).doc(clientId).get();
        if (!alive) return;
        if (!snap.exists) { setError("요청하신 업체 정보를 찾을 수 없습니다. 링크를 다시 확인해 주세요."); setLoading(false); return; }
        const rec = { id: snap.id, ...snap.data() };
        setClient(rec);
        setSignerName(rec.contractSignerName || rec.ceo || "");
        if (getClientContractState(rec).valid) setDone(true);
        setLoading(false);
      } catch (e) {
        console.error(e);
        if (alive) { setError("정보를 불러오는 중 오류가 발생했습니다."); setLoading(false); }
      }
    })();
    return () => { alive = false; };
  }, [clientId]);

  const submit = async () => {
    if (!(agree && signature && signerName.trim()) || submitting) return;
    setSubmitting(true);
    try {
      await syncClientContractByName(client.name, signature, signerName.trim());
      const fresh = await db.collection(COLLECTIONS.clients).doc(clientId).get();
      setClient({ id: fresh.id, ...fresh.data() });
      setDone(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      console.error(e);
      alert("서명 저장에 실패했습니다. 통신 상태를 확인한 뒤 다시 시도해 주세요.");
    }
    setSubmitting(false);
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">계약서를 불러오는 중입니다...</div>;
  if (error) return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
      <div className="bg-white border border-slate-200 rounded-xl p-6 max-w-md text-sm text-slate-600 text-center">{error}</div>
    </div>
  );

  const st = getClientContractState(client);
  const docData = {
    readOnly: true, consentView: true, docTabOverride: "contract",
    clientName: client.name || "", clientCeo: signerName, clientAddress: client.address || "",
    contractDate: (st.signedAt || todayDisplay()).slice(0, 10),
    consentSignature: done ? st.signImage : "", consentSignerName: done ? st.signName : "", consentAt: done ? st.signedAt : "",
    items: [],
  };

  return (
    <div className="min-h-screen bg-slate-100">
      <div className="no-print bg-[#1E3A8A] text-white px-4 py-3 sticky top-0 z-40 shadow">
        <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
          <div className="min-w-0">
            <div className="text-sm font-bold truncate">㈜비케이브로 · 화장품 용기 공급계약서</div>
            <div className="text-[11px] text-white/70 truncate">{client.name} 貴中</div>
          </div>
          {done && <span className="text-[11px] bg-emerald-500 px-2.5 py-1 rounded-full whitespace-nowrap shrink-0">✅ 체결 완료</span>}
        </div>
      </div>

      {done && (
        <div className="no-print max-w-7xl mx-auto px-4 pt-4">
          <div className="bg-white border-2 border-emerald-500 rounded-xl p-5 text-center">
            <div className="text-lg font-bold text-emerald-700 mb-1">공급계약서 체결이 정상 완료되었습니다.</div>
            <div className="text-xs text-slate-500 mb-3">체결 일시 : {st.signedAt || "-"} · 서명자 : {st.signName || "-"} · 유효기간 ~{st.expireAt || "-"}</div>
            <button onClick={() => window.print()} className="bg-[#1E3A8A] text-white text-sm font-semibold px-5 py-2.5 rounded-lg hover:opacity-90">📄 PDF 다운로드 / 인쇄</button>
          </div>
        </div>
      )}

      <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col lg:flex-row gap-6 items-start">
        <div className="flex-1 min-w-0 w-full overflow-x-auto">
          <PdfPreview open data={docData} mode="invoice" onClose={() => {}} />
        </div>

        {!done && (
          <aside className="no-print w-full lg:w-96 shrink-0 lg:sticky lg:top-20">
            <div className="bg-white rounded-xl shadow-lg border border-slate-200 p-5">
              <div className="text-sm font-bold text-slate-800 mb-3">✍️ 전자서명 및 계약 체결</div>
              <label className="flex items-start gap-2 mb-3 cursor-pointer">
                <input type="checkbox" className="mt-0.5" checked={agree} onChange={(e) => setAgree(e.target.checked)} />
                <span className="text-xs text-slate-700"><b>화장품 용기 공급계약서</b> 제1조~제12조 전문을 확인하였으며 계약 체결에 동의합니다. (유효기간: 체결일로부터 1년)</span>
              </label>
              <Field label="서명자 성함 (대표자)">
                <input className={inputCls} value={signerName} onChange={(e) => setSignerName(e.target.value)} placeholder="예: 홍길동" />
              </Field>
              <div className="text-xs font-semibold text-slate-500 mt-3 mb-1.5">서명 방식 선택</div>
              <SignaturePad onChange={setSignature} />
              <button onClick={submit} disabled={!(agree && signature && signerName.trim()) || submitting}
                className="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-3 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed">
                {submitting ? "제출 중..." : "동의 및 서명 제출"}
              </button>
            </div>
          </aside>
        )}
      </div>
      <CustomerFooter />
    </div>
  );
}

// #고객동의?건=<id> 해시에서 인보이스 ID를 뽑아낸다(고객이 받는 링크)
/* 고객용 샘플 인보이스 열람·승인 페이지 (일반/CT 공용)
   링크: /agree?type=sample&id=<샘플ID> · /agree?type=ct&id=<샘플ID>
   ⚠️ 샘플 인보이스 서식(SampleInvoiceModal/CtSampleInvoiceModal)은 좌측 편집폼이 붙은 관리자 모달이라
   그대로 재사용하면 고객에게 편집 UI가 노출된다. 그래서 여기서는 readOnly로 띄우고
   onUpdate를 넘기지 않아(=저장 불가) 조회 전용으로만 동작시킨다. */
function SampleApprovalPage({ sampleId, kind }) {
  const [sample, setSample] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [agree, setAgree] = useState(false);
  const [signerName, setSignerName] = useState("");
  const [signature, setSignature] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);
  const isCt = kind === "ct";

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (!FIREBASE_ENABLED || !db) { setError("문서 저장소에 연결할 수 없습니다."); setLoading(false); return; }
        const snap = await db.collection(COLLECTIONS.samples).doc(sampleId).get();
        if (!alive) return;
        if (!snap.exists) { setError("요청하신 문서를 찾을 수 없습니다. 링크를 다시 확인해 주세요."); setLoading(false); return; }
        const rec = { id: snap.id, ...snap.data() };
        setSample(rec);
        setSignerName(rec.clientCeo || "");
        if (rec.consentStatus === "승인완료") setDone(true);
        setLoading(false);
      } catch (e) {
        console.error(e);
        if (alive) { setError("문서를 불러오는 중 오류가 발생했습니다."); setLoading(false); }
      }
    })();
    return () => { alive = false; };
  }, [sampleId]);

  const canSubmit = agree && !!signature && signerName.trim() && !submitting;
  const submit = async () => {
    if (!canSubmit) return;
    setSubmitting(true);
    const patch = {
      consentStatus: "승인완료",
      consentAt: nowDateTimeStr(),
      consentSignerName: signerName.trim(),
      consentSignature: signature,
      // 4단계 목록의 "고객승인" 배지가 읽는 정식 필드 — 둘 다 기록해 어느 화면에서든 동일하게 인식된다
      isApproved: true,
      approvedAt: nowDateTimeStr(),
    };
    try {
      await fsUpdate(COLLECTIONS.samples, sampleId, patch);
      setSample((prev) => ({ ...prev, ...patch })); // 관리자 목록은 fsSubscribe로 실시간 갱신
      setDone(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      console.error(e);
      alert("승인 저장에 실패했습니다. 통신 상태를 확인한 뒤 다시 시도해 주세요.");
    }
    setSubmitting(false);
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">문서를 불러오는 중입니다...</div>;
  if (error) return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
      <div className="bg-white border border-slate-200 rounded-xl p-6 max-w-md text-sm text-slate-600 text-center">{error}</div>
    </div>
  );

  /* 본품 인보이스 고객 승인화면과 동일한 2열 구도:
     좌측 = A4 인보이스 용지 / 우측 = 승인·서명 사이드바(lg 이상에서 sticky) */
  const typeTitle = isCt ? "CT 맞춤샘플" : "일반 샘플";
  return (
    <div className="min-h-screen bg-slate-100 pb-10">
      {/* 상단 헤더 바 */}
      <div className="no-print sticky top-0 z-50 bg-slate-900 text-white px-8 py-3.5 flex items-center justify-between gap-3 shadow">
        <div className="min-w-0">
          <div className="text-sm font-bold truncate">㈜비케이브로 · {typeTitle} 인보이스 승인</div>
          <div className="text-[11px] text-white/60 truncate">{sample.clientName || ""} 貴中</div>
        </div>
        {done
          ? <span className="text-[11px] bg-emerald-500 px-2.5 py-1 rounded-full whitespace-nowrap shrink-0">✅ 승인 완료</span>
          : <span className="text-[11px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-full whitespace-nowrap shrink-0">⏳ 승인 대기</span>}
      </div>

      <div className="max-w-7xl mx-auto p-6 flex flex-col lg:flex-row gap-8 items-start justify-center">
        {/* 좌측: A4 인보이스 서식 */}
        <div className="flex-1 max-w-4xl w-full min-w-0">
          {isCt
            ? <CtSampleInvoiceModal sample={sample} products={[]} proposals={[]} supplierLogo="" onClose={() => {}} readOnly publicView />
            : <SampleInvoiceModal sample={sample} products={[]} proposals={[]} sampleStock={[]} supplierLogo="" onClose={() => {}} readOnly publicView />}
        </div>

        {/* 우측: 승인·서명 사이드바 */}
        <aside className="no-print w-full lg:w-96 shrink-0 lg:sticky lg:top-20">
          {done ? (
            <div className="bg-white rounded-xl shadow-lg border-2 border-emerald-500 p-5 text-center">
              <div className="text-base font-bold text-emerald-700 mb-2">✅ 정상 승인 완료</div>
              <div className="text-xs text-slate-500 mb-1">승인 일시 : {sample.consentAt || "-"}</div>
              <div className="text-xs text-slate-500 mb-2">서명자 : {sample.consentSignerName || "-"}</div>
              {sample.consentSignature && (
                <div className="flex justify-center mb-3"><img src={sample.consentSignature} alt="서명" className="h-16 object-contain" /></div>
              )}
              <div className="text-[11px] text-slate-500 mb-3">
                {isCt ? "입금 확인 즉시 현지 공장에 맞춤 제작이 투입됩니다." : "입금 확인 후 즉시 출고가 진행됩니다."}
              </div>
              <button onClick={() => window.print()} className="w-full bg-[#1E3A8A] hover:opacity-90 text-white text-sm font-semibold py-3 rounded-xl">🖨️ PDF 다운로드 / 인쇄</button>
            </div>
          ) : (
            <div className="bg-white rounded-xl shadow-lg border border-slate-200 p-5">
              <div className="text-sm font-bold text-slate-800 mb-3">🚀 {typeTitle} 최종 승인</div>

              <label className="flex items-start gap-2 mb-3 cursor-pointer">
                <input type="checkbox" className="mt-0.5" checked={agree} onChange={(e) => setAgree(e.target.checked)} />
                <span className="text-xs text-slate-700">요청 내역(<b>수량, 금액, {isCt ? "제작 조건" : "발송 조건"}</b>)을 확인하였으며 최종 승인합니다.</span>
              </label>

              <Field label="승인자 성함 (대표자/담당자)">
                <input className={inputCls} value={signerName} onChange={(e) => setSignerName(e.target.value)} placeholder="예: 홍길동" />
              </Field>

              <div className="text-xs font-semibold text-slate-500 mt-3 mb-1.5">서명 방식 선택</div>
              <SignaturePad onChange={setSignature} />

              <button onClick={submit} disabled={!canSubmit}
                className="w-full mt-4 py-3.5 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-600 text-white disabled:opacity-40 disabled:cursor-not-allowed">
                {submitting ? "승인 처리 중..." : `🚀 ${typeTitle} 최종 승인 완료`}
              </button>
              {!canSubmit && !submitting && (
                <p className="text-[11px] text-slate-400 mt-2 text-center">승인 체크 · 성함 입력 · 서명이 모두 완료되면 승인할 수 있습니다.</p>
              )}
            </div>
          )}
        </aside>
      </div>
      <CustomerFooter />
    </div>
  );
}

/* 제안서 고객 열람링크 발송 모달 — 인보이스/계약서 발송 모달과 동일 형식 */
function ProposalSendModal({ proposal, onClose, onSent }) {
  const link = `${window.location.origin}/agree?type=proposal&id=${proposal.id}`;
  const items = proposal.items || [];
  const first = items[0] || {};
  const productLabel = (first.productName || "제안 품목") + (items.length > 1 ? ` 외 ${items.length - 1}건` : "");
  const totalAmount = items.reduce((s, it) => s + (Number(it.totalPrice) || 0), 0);

  /* 고객사에 그대로 나가는 표준 문구(대기업 B2B 서식) — 임의로 줄이거나 표현을 바꾸지 말 것.
     ⚠️ 본문의 정식 URL(https://~)은 반드시 "열람 링크 1개"만 유지할 것.
        2개 이상이면 카카오톡이 미리보기 카드(OG 박스)를 만들지 않는다.

  const [copied, setCopied] = useState("");

/* 고객용 제안서 열람 페이지 (/agree?type=proposal&id=...) — 편집 UI 없이 A4 제안서만 렌더링 */
function ProposalViewPage({ proposalId }) {
  const [proposal, setProposal] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);
  const [requestText, setRequestText] = useState(""); // 고객이 남기는 요청사항
  const [requestSent, setRequestSent] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (!FIREBASE_ENABLED || !db) { setError("문서 저장소에 연결할 수 없습니다."); setLoading(false); return; }
        const snap = await db.collection(COLLECTIONS.proposals).doc(proposalId).get();
        if (!alive) return;
        if (!snap.exists) { setError("요청하신 제안서를 찾을 수 없습니다. 링크를 다시 확인해 주세요."); setLoading(false); return; }
        const rec = { id: snap.id, ...snap.data() };
        setProposal(rec);
        if (rec.customerCheckedAt) setDone(true);
        setLoading(false);
      } catch (e) {
        console.error(e);
        if (alive) { setError("제안서를 불러오는 중 오류가 발생했습니다."); setLoading(false); }
      }
    })();
    return () => { alive = false; };
  }, [proposalId]);

  const confirmRead = async () => {
    if (submitting) return;
    setSubmitting(true);
    const patch = { customerCheckedAt: nowDateTimeStr(), reviewStatus: "고객확인", status: "고객확인" };
    // 요청사항을 함께 적었으면 같이 저장 — 관리자 목록의 💬 고객요청 배지가 이 필드를 본다
    if (requestText.trim()) {
      patch.customerRequest = requestText.trim();
      patch.customerRequestAt = nowDateTimeStr();
    }
    try {
      await fsUpdate(COLLECTIONS.proposals, proposalId, patch);
      setProposal((prev) => ({ ...prev, ...patch })); // 관리자 목록은 fsSubscribe로 실시간 갱신
      setDone(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      console.error(e);
      alert("확인 처리에 실패했습니다. 통신 상태를 확인한 뒤 다시 시도해 주세요.");
    }
    setSubmitting(false);
  };

  // 확인을 마친 뒤에도 추가 요청사항을 보낼 수 있다(기존 요청에 이어붙임)
  const sendRequest = async () => {
    const text = requestText.trim();
    if (!text || submitting) return;
    setSubmitting(true);
    const merged = proposal.customerRequest ? `${proposal.customerRequest}\n\n---\n${text}` : text;
    const patch = { customerRequest: merged, customerRequestAt: nowDateTimeStr() };
    try {
      await fsUpdate(COLLECTIONS.proposals, proposalId, patch);
      setProposal((prev) => ({ ...prev, ...patch }));
      setRequestText(""); setRequestSent(true);
      setTimeout(() => setRequestSent(false), 2500);
    } catch (e) {
      console.error(e);
      alert("요청사항 전송에 실패했습니다. 다시 시도해 주세요.");
    }
    setSubmitting(false);
  };

  if (loading) return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">제안서를 불러오는 중입니다...</div>;
  if (error) return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
      <div className="bg-white border border-slate-200 rounded-xl p-6 max-w-md text-sm text-slate-600 text-center">{error}</div>
    </div>
  );

  const docData = { ...proposal, readOnly: true, consentView: true };
  return (
    <div className="min-h-screen bg-slate-100 pb-10">
      <div className="no-print sticky top-0 z-50 bg-slate-900 text-white px-8 py-3.5 flex items-center justify-between gap-3 shadow">
        <div className="min-w-0">
          <div className="text-sm font-bold truncate">㈜비케이브로 · 제품공급제안서</div>
          <div className="text-[11px] text-white/60 truncate">{proposal.clientName || ""} 貴中</div>
        </div>
        {done
          ? <span className="text-[11px] bg-emerald-500 px-2.5 py-1 rounded-full whitespace-nowrap shrink-0">✅ 확인 완료</span>
          : <span className="text-[11px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-full whitespace-nowrap shrink-0">⏳ 확인 대기</span>}
      </div>

      <div className="max-w-7xl mx-auto p-6 flex flex-col lg:flex-row gap-8 items-start justify-center">
        <div className="flex-1 max-w-4xl w-full min-w-0">
          <PdfPreview open data={docData} mode="proposal" onClose={() => {}} />
        </div>

        <aside className="no-print w-full lg:w-96 shrink-0 lg:sticky lg:top-20">
          {done ? (
            <div className="space-y-3">
              <div className="bg-emerald-50 border border-emerald-400 text-emerald-800 p-4 rounded-xl font-bold text-sm">
                ✅ 제안서 확인이 완료되었습니다. (확인일시: {proposal.customerCheckedAt || "-"})
              </div>
              <button onClick={() => window.print()} className="w-full bg-[#1E3A8A] hover:opacity-90 text-white text-sm font-semibold py-3 rounded-xl">🖨️ PDF 다운로드 / 인쇄</button>

              {/* 확인 후에도 추가 요청은 계속 보낼 수 있다 */}
              <div className="bg-white rounded-xl shadow border border-slate-200 p-4">
                <div className="text-xs font-bold text-slate-700 mb-2">💬 담당자에게 요청사항 남기기</div>
                {proposal.customerRequest && (
                  <div className="text-[11px] bg-slate-50 border border-slate-200 rounded-lg p-2.5 mb-2 whitespace-pre-line text-slate-600 max-h-32 overflow-y-auto">
                    {proposal.customerRequest}
                  </div>
                )}
                <textarea value={requestText} onChange={(e) => setRequestText(e.target.value)} rows={3}
                  placeholder="예: 수량 5,000개 기준 단가 재검토 요청드립니다"
                  className="w-full text-xs p-2.5 border border-slate-200 rounded-lg resize-y outline-none focus:border-indigo-500" />
                <button onClick={sendRequest} disabled={!requestText.trim() || submitting}
                  className="w-full mt-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-lg disabled:opacity-40">
                  {requestSent ? "✅ 전달되었습니다" : "요청사항 전송"}
                </button>
              </div>
            </div>
          ) : (
            <div className="bg-white rounded-xl shadow-lg border border-slate-200 p-5">
              <p className="text-xs text-slate-600 leading-relaxed mb-4 text-center">
                제안서 내용을 확인하셨습니까?<br />아래 버튼을 눌러주시면 담당자에게 확인 내용이 전달됩니다.
              </p>

              {/* 요청사항(선택) — 확인 완료와 함께 담당자에게 전달된다 */}
              <div className="mb-4">
                <div className="text-xs font-bold text-slate-700 mb-1.5">💬 요청사항 <span className="font-normal text-slate-400">(선택)</span></div>
                <textarea value={requestText} onChange={(e) => setRequestText(e.target.value)} rows={3}
                  placeholder="예: 수량 5,000개 기준 단가 재검토 요청드립니다"
                  className="w-full text-xs p-2.5 border border-slate-200 rounded-lg resize-y outline-none focus:border-indigo-500" />
              </div>

              <button onClick={confirmRead} disabled={submitting}
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-md disabled:opacity-40">
                {submitting ? "처리 중..." : "👁️ 제안서 확인 완료"}
              </button>
            </div>
          )}
        </aside>
      </div>
      <CustomerFooter />
    </div>
  );
}

/* 고객용 링크 라우팅 — 두 가지 형식을 모두 인식한다.
   ① 정식: /agree?type=contract&clientId=XXX  또는 ?type=invoice&invoiceId=XXX
   ② 구버전 해시: #계약서서명?업체=XXX / #고객동의?건=XXX (이미 발송한 링크 호환) */
function parseCustomerRoute() {
  try {
    const q = new URLSearchParams(window.location.search || "");
    const type = (q.get("type") || "").toLowerCase();
    // 계약서는 clientId가 정식 파라미터지만, id로 만든 링크도 열리도록 폴백을 둔다
    // (발송 문구를 바꾸는 과정에서 형식이 섞여도 고객 링크가 죽지 않게 하기 위함)
    if (type === "contract" && (q.get("clientId") || q.get("id"))) return { kind: "contract", id: q.get("clientId") || q.get("id") };
    if (type === "invoice" && (q.get("invoiceId") || q.get("id"))) return { kind: "invoice", id: q.get("invoiceId") || q.get("id") };
    // 샘플/CT 샘플 인보이스 승인. sample_invoice·ct_invoice 형식으로 만든 링크도 열리도록 별칭을 둔다
    if ((type === "sample" || type === "ct" || type === "sample_invoice" || type === "ct_invoice") && q.get("id")) {
      return { kind: (type === "ct" || type === "ct_invoice") ? "ct" : "sample", id: q.get("id") };
    }
    if (type === "proposal" && (q.get("id") || q.get("proposalId"))) return { kind: "proposal", id: q.get("id") || q.get("proposalId") }; // 제안서 고객 열람
  } catch (e) { /* URLSearchParams 미지원 환경은 해시로 폴백 */ }
  const raw = decodeURIComponent(window.location.hash || "").trim();
  const mc = /^#계약서서명\?업체=(.+)$/.exec(raw);
  if (mc) return { kind: "contract", id: mc[1] };
  const mi = /^#고객동의\?건=(.+)$/.exec(raw);
  if (mi) return { kind: "invoice", id: mi[1] };
  return { kind: "", id: "" };
}

function AccountManageModal({ accounts, onSave, onDelete, onClose }) {
  const [editingId, setEditingId] = useState(null);
  const [name, setName] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [role, setRole] = useState("staff");

  const resetForm = () => { setEditingId(null); setName(""); setUsername(""); setPassword(""); setRole("staff"); };

  const startEdit = (acc) => {
    setEditingId(acc.id); setName(acc.name); setUsername(acc.username); setPassword(acc.password); setRole(acc.role);
  };

  const submit = () => {
    if (!name.trim() || !username.trim() || !password.trim()) return;
    if (!editingId && accounts.some((a) => a.username === username.trim())) { alert("이미 사용 중인 아이디입니다."); return; }
    onSave({ id: editingId || ("acc-" + Date.now()), name: name.trim(), username: username.trim(), password: password.trim(), role });

  };

  const handleDelete = (acc) => {
    if (accounts.length <= 1) { alert("최소 1개의 계정은 남아있어야 합니다."); return; }
    if (!window.confirm(`"${acc.name}(${acc.username})" 계정을 삭제할까요?`)) return;

    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">

        <div className="p-6 overflow-y-auto flex-1">
          <Card title={editingId ? "계정 정보 수정" : "신규 계정 추가"}>
            <div className="grid grid-cols-2 gap-4">
              <Field label="이름"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 홍길동" /></Field>
              <Field label="아이디"><input className={inputCls} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="로그인 아이디" disabled={!!editingId} /></Field>
              <Field label="비밀번호"><input className={inputCls} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="비밀번호" /></Field>
              <Field label="권한">
                <select className={inputCls} value={role} onChange={(e) => setRole(e.target.value)}>
                  <option value="admin">관리자</option>
                  <option value="staff">직원</option>
                </select>
              </Field>
            </div>
            <div className="flex gap-2">
              <button onClick={submit} className="mt-1 py-2.5 px-5 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">{editingId ? "✓ 수정 반영" : "＋ 계정 추가"}</button>
              {editingId && <button onClick={resetForm} className="mt-1 py-2.5 px-5 rounded-lg border border-slate-200 text-slate-500 text-sm hover:bg-slate-50">취소</button>}
            </div>
          </Card>

          <div className="h-5" />

          <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm">
            <table className="w-full text-sm">
              <thead><tr className="bg-slate-50 text-xs font-semibold text-slate-600">
                <th className="text-left px-4 py-2.5">이름</th>
                <th className="text-left px-4 py-2.5">아이디</th>
                <th className="text-left px-4 py-2.5">비밀번호</th>
                <th className="text-left px-4 py-2.5">권한</th>
                <th className="text-right px-4 py-2.5">작업</th>
              </tr></thead>
              <tbody>
                {accounts.map((acc, idx) => (
                  <tr key={acc.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                    <td className="px-4 py-2.5 font-medium text-slate-800">{acc.name}</td>
                    <td className="px-4 py-2.5 text-slate-600">{acc.username}</td>
                    <td className="px-4 py-2.5 text-slate-400 font-mono text-xs">{acc.password}</td>
                    <td className="px-4 py-2.5">
                      <span className={"text-[10px] px-2 py-0.5 rounded-full font-medium " + (acc.role === "admin" ? "bg-amber-100 text-amber-800" : "bg-blue-100 text-blue-700")}>
                        {acc.role === "admin" ? "관리자" : "직원"}
                      </span>
                    </td>
                    <td className="px-4 py-2.5 text-right whitespace-nowrap">
                      <button onClick={() => startEdit(acc)} className="text-xs px-2 py-1 text-slate-500 hover:text-[#1E3A8A] mr-2">✏️ 수정</button>
                      <button onClick={() => handleDelete(acc)} className="text-xs px-2 py-1 text-red-400 hover:text-red-600">🗑️ 삭제</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onLoggedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email, password);
      onLoggedIn();
    } catch (err) {
      const map = {
        "auth/invalid-email": "이메일 형식이 올바르지 않습니다.",
        "auth/user-not-found": "등록되지 않은 계정입니다. (Firebase 콘솔 → Authentication에서 계정을 먼저 만들어주세요)",
        "auth/wrong-password": "비밀번호가 올바르지 않습니다.",
        "auth/invalid-credential": "이메일 또는 비밀번호가 올바르지 않습니다.",
        "auth/too-many-requests": "시도 횟수가 많아 잠시 후 다시 시도해주세요.",
      };
      setError(map[err.code] || ("로그인 오류: " + err.message));
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-[#F5F7FA]">
      <form onSubmit={handleLogin} className="bg-white border border-slate-200 rounded-xl p-8 w-full max-w-sm">
        <div className="flex items-center gap-2 mb-1">
          <div className="w-9 h-9 rounded-lg bg-[#1E3A8A] flex items-center justify-center text-lg">🧭</div>
          <h1 className="text-lg font-bold text-slate-800">CosmePack 로그인</h1>
        </div>
        <p className="text-xs text-slate-500 mb-6">직원 계정으로 로그인해주세요.</p>

        <label className="block text-xs font-medium text-slate-600 mb-1.5">이메일</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required
          className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A] mb-4" placeholder="you@cosmepack.com" />

        <label className="block text-xs font-medium text-slate-600 mb-1.5">비밀번호</label>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required
          className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A] mb-4" placeholder="••••••••" />

        {error && <div className="text-xs text-red-600 bg-red-50 rounded-lg px-3 py-2 mb-4">{error}</div>}

        <button type="submit" disabled={loading} className="w-full py-2.5 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 disabled:opacity-50">
          {loading ? "로그인 중..." : "로그인"}
        </button>

        <p className="text-[11px] text-slate-400 mt-4 leading-relaxed">
          계정이 없으신가요? Firebase 콘솔 → Authentication → Users 탭에서 관리자가 이메일/비밀번호 계정을 추가해드릴 수 있습니다.
        </p>
      </form>
    </div>
  );
}

function Root() {
  const [customerRoute, setCustomerRoute] = useState(parseCustomerRoute());
  useEffect(() => {
    const onNav = () => setCustomerRoute(parseCustomerRoute());
    window.addEventListener("hashchange", onNav);
    window.addEventListener("popstate", onNav);
    return () => { window.removeEventListener("hashchange", onNav); window.removeEventListener("popstate", onNav); };
  }, []);
  // 라우트가 바뀔 때마다 탭 타이틀 갱신 — 고객 링크는 문서 종류별 이름, 내부 관리화면은 브랜드명으로 되돌린다.
  // (인쇄/PDF 저장 시 handlePrint가 document.title을 잠깐 파일명으로 바꿨다가 원복하는 로직과는 서로 간섭하지 않음)
  useEffect(() => {
    document.title = CUSTOMER_PAGE_TITLES[customerRoute.kind] || BRAND_TITLE;
  }, [customerRoute.kind]);
  const [checking, setChecking] = useState(FIREBASE_ENABLED);
  const [user, setUser] = useState(null);
  const [authError, setAuthError] = useState("");
  const [roleUser, setRoleUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(ROLE_STORAGE_KEY)); } catch (e) { return null; }
  });
  const [accounts, setAccounts] = useState(loadAccounts);

  useEffect(() => {
    // 계정 목록(아이디/비번)을 이 브라우저의 localStorage에만 두면 다른 컴퓨터에서 로그인할 때 안 보이는 문제가 있어
    // Firestore로 실시간 공유한다. Firestore에 계정이 하나도 없으면(최초 1회) 이 브라우저의 기존 계정
    // (관리자가 이미 만들어둔 커스텀 계정 포함, 없으면 기본계정)을 그대로 업로드해서 이관한다.
    if (!FIREBASE_ENABLED || !db) return;
    const unsub = db.collection(COLLECTIONS.accounts).onSnapshot(
      (snap) => {
        if (snap.empty) {
          const seed = loadAccounts();
          seed.forEach((acc) => { db.collection(COLLECTIONS.accounts).doc(acc.id).set(acc).catch((e) => console.error(e)); });
          setAccounts(seed);
        } else {
          setAccounts(snap.docs.map((d) => ({ ...d.data(), id: d.id })));
        }
      },
      (err) => console.error("accounts 구독 오류:", err)
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!FIREBASE_ENABLED) return; // 로컬 모드에서는 로그인 없이 바로 진입
    const unsub = auth.onAuthStateChanged((u) => {
      if (u) {
        setUser(u);
        setChecking(false);
      } else {
        // 사용자에게는 이메일 로그인 화면을 보여주지 않고, Firestore 접근용으로만 백그라운드에서 익명 인증
        auth.signInAnonymously().catch((e) => {
          console.error(e);
          setAuthError(e.code === "auth/operation-not-allowed"
            ? "Firebase 콘솔 → Authentication → Sign-in method에서 '익명(Anonymous)' 로그인을 한 번만 켜주세요."
            : "Firebase 연결 오류: " + e.message);
          setChecking(false);
        });
      }
    });
    return () => unsub();
  }, []);

  const handleRoleLogin = (ru) => {
    try { localStorage.setItem(ROLE_STORAGE_KEY, JSON.stringify(ru)); } catch (e) { console.error(e); }
    setRoleUser(ru);
  };
  const handleFullLogout = () => {
    try { localStorage.removeItem(ROLE_STORAGE_KEY); } catch (e) { console.error(e); }
    setRoleUser(null);
  };
  const saveAccount = async (acc) => {
    setAccounts((prev) => {
      const exists = prev.some((a) => a.id === acc.id);
      const next = exists ? prev.map((a) => (a.id === acc.id ? acc : a)) : [...prev, acc];
      if (!FIREBASE_ENABLED) saveAccounts(next); // 로컬(오프라인) 모드 폴백
      return next;
    });
    if (FIREBASE_ENABLED && db) {
      try { await db.collection(COLLECTIONS.accounts).doc(acc.id).set(acc); } catch (e) { console.error(e); }
    }
  };
  const deleteAccount = async (id) => {
    setAccounts((prev) => {
      const next = prev.filter((a) => a.id !== id);
      if (!FIREBASE_ENABLED) saveAccounts(next);
      return next;
    });
    if (FIREBASE_ENABLED && db) {
      try { await db.collection(COLLECTIONS.accounts).doc(id).delete(); } catch (e) { console.error(e); }
    }
  };

  if (checking) {
    return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">불러오는 중...</div>;
  }
  /* 고객용 동의 링크(#고객동의?건=<인보이스ID>)는 로그인 없이 열려야 하므로
     RoleLoginScreen 게이트보다 먼저 분기한다. Firebase 익명인증은 위 checking 단계에서 끝난 상태. */
  if (customerRoute.kind === "invoice") {
    return <CustomerConsentPage invoiceId={customerRoute.id} />;
  }
  if (customerRoute.kind === "contract") {
    return <ContractOnlySignPage clientId={customerRoute.id} />;
  }
  if (customerRoute.kind === "sample" || customerRoute.kind === "ct") {
    return <SampleApprovalPage sampleId={customerRoute.id} kind={customerRoute.kind} />;
  }
  if (customerRoute.kind === "proposal") {
    return <ProposalViewPage proposalId={customerRoute.id} />;
  }
  if (FIREBASE_ENABLED && authError) {
    return <div className="min-h-screen flex items-center justify-center bg-[#F5F7FA] p-6"><div className="bg-white border border-red-200 rounded-xl p-6 max-w-md text-sm text-red-600">{authError}</div></div>;
  }
  if (!roleUser) {
    return <RoleLoginScreen accounts={accounts} onLogin={handleRoleLogin} />;
  }
  return <App currentUser={user} onLogout={handleFullLogout} roleUser={roleUser} accounts={accounts} onSaveAccount={saveAccount} onDeleteAccount={deleteAccount} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
