function SampleCard({ sample, accounts, products, proposals, supplierLogo, shippingFees, shippingFeeNotes, onSaveShippingFees, currentUserName, isAdmin, onUpdate, onDelete, onAddMemo, onDeleteMemo }) {
  const [showInvoice, setShowInvoice] = useState(false);
  const [showAnnounce, setShowAnnounce] = useState(false);

  const [memoText, setMemoText] = useState("");
  const submitMemo = () => {
    if (!memoText.trim() || !onAddMemo) return;
    onAddMemo(sample, memoText.trim());
    setMemoText("");
  };
  const fees = shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES;
  const stepIndex = SAMPLE_STATUS_OPTIONS.indexOf(sample.status);
  const setStatus = (status) => {
    const dateField = SAMPLE_STATUS_DATE_FIELD[status];
    const patch = { status };
    if (dateField && !sample[dateField]) patch[dateField] = todayStr(); // 그 단계로 처음 넘어갈 때 오늘 날짜를 자동으로 채워줌(이후 수정 가능)
    onUpdate(sample, patch);
  };
  // 단계별 행(진행일/확인직원)의 입력값 — 아직 [확인]을 안 누른 값은 여기서만 임시로 들고 있다가 확인버튼 클릭시 한번에 반영
  const [pendingDates, setPendingDates] = useState({});
  const [pendingConfirmers, setPendingConfirmers] = useState({});
  const getDate = (field) => (pendingDates[field] != null ? pendingDates[field] : (sample[field] || ""));
  const getConfirmer = (field) => (pendingConfirmers[field] != null ? pendingConfirmers[field] : (sample[field] || currentUserName || "백상선"));
  // [확인] 버튼: 그 단계의 진행일+확인직원을 한번에 저장하고, 진행상태(status)도 그 단계로 동기화 → 상단 진행바도 함께 활성화됨
  const confirmStep = (status) => {
    const dateField = SAMPLE_STATUS_DATE_FIELD[status];
    const confirmerField = SAMPLE_STATUS_CONFIRMER_FIELD[status];
    const dateValue = getDate(dateField) || todayStr();
    const confirmerValue = getConfirmer(confirmerField) || currentUserName || "백상선";
    onUpdate(sample, { status, [dateField]: dateValue, [confirmerField]: confirmerValue });
  };
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="min-w-0">
          <div className="text-sm font-bold text-slate-800 truncate">{sample.clientName}</div>
          <div className="text-xs text-slate-500 truncate mt-0.5">{sample.productName}</div>
        </div>
        <div className="flex gap-1 shrink-0">
          <button onClick={() => onUpdate(sample, { stockLocation: "korea" })} className={"text-[10px] px-2 py-1 rounded-full font-medium " + (sample.stockLocation === "korea" ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-500")}>🇰🇷 국내</button>
          <button onClick={() => onUpdate(sample, { stockLocation: "china" })} className={"text-[10px] px-2 py-1 rounded-full font-medium " + (sample.stockLocation === "china" ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-500")}>🇨🇳 중국발주</button>
        </div>
      </div>

      {/* 4단계 서브 파이프라인 진행바 */}
      <div className="flex items-center gap-1 mb-3">
        {SAMPLE_STATUS_OPTIONS.map((s, i) => (
          <React.Fragment key={s}>
            <button onClick={() => setStatus(s)} title={SAMPLE_STATUS_LABELS[s]} className={"flex-1 text-[11px] px-1 py-2 rounded-lg font-bold text-center whitespace-nowrap " + (i <= stepIndex ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-400")}>
              {SAMPLE_STATUS_LABELS[s]}
            </button>
            {i < SAMPLE_STATUS_OPTIONS.length - 1 && <div className={"w-1.5 h-0.5 shrink-0 " + (i < stepIndex ? "bg-[#1E3A8A]" : "bg-slate-200")} />}
          </React.Fragment>
        ))}
      </div>
      <div className="text-[11px] text-center text-slate-500 mb-3">현재 단계: <b className="text-[#1E3A8A]">{SAMPLE_STATUS_LABELS[sample.status]}</b></div>

      <div className="border border-slate-200 rounded-lg overflow-hidden mb-3">
        <table className="w-full text-[11px]">
          <thead><tr className="bg-slate-50 text-slate-400">
            <th className="text-left px-2 py-1.5 font-medium">단계</th>
            <th className="text-left px-2 py-1.5 font-medium">진행일</th>
            <th className="text-left px-2 py-1.5 font-medium">확인직원</th>
            <th className="px-2 py-1.5 w-14"></th>
          </tr></thead>
          <tbody>
            {SAMPLE_STATUS_OPTIONS.map((s) => {
              const dateField = SAMPLE_STATUS_DATE_FIELD[s];
              const confirmerField = SAMPLE_STATUS_CONFIRMER_FIELD[s];
              const isCurrent = sample.status === s;
              const isDone = sample[confirmerField]; // 이 단계에서 [확인]을 한번이라도 눌렀는지
              return (
                <tr key={s} className={"border-t border-slate-100 " + (isCurrent ? "bg-[#1E3A8A]/5" : "")}>
                  <td className="px-2 py-1.5 whitespace-nowrap">
                    {isDone && <span className="text-emerald-500 mr-1">✓</span>}
                    {SAMPLE_STATUS_LABELS[s]}
                    {isCurrent && <span className="ml-1 text-[9px] px-1.5 py-0.5 rounded-full bg-[#1E3A8A] text-white">현재</span>}
                  </td>
                  <td className="px-2 py-1.5">
                    <input type="date" value={getDate(dateField)} onChange={(e) => setPendingDates((prev) => ({ ...prev, [dateField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" />
                  </td>
                  <td className="px-2 py-1.5">
                    {isDone ? (
                      <span className="inline-flex items-center gap-1 w-full px-1.5 py-1 rounded border border-slate-100 bg-slate-50 text-slate-600" title="확인 완료 — 이후 변경 불가">
                        🔒 {sample[confirmerField]}
                      </span>
                    ) : (
                      <select value={getConfirmer(confirmerField)} onChange={(e) => setPendingConfirmers((prev) => ({ ...prev, [confirmerField]: e.target.value }))} className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]">
                        <option value="">미지정</option>
                        {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
                      </select>
                    )}
                  </td>
                  <td className="px-2 py-1.5 text-center">
                    <button onClick={() => confirmStep(s)} className="text-[10px] px-2 py-1 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 whitespace-nowrap">확인</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="grid grid-cols-2 gap-2 mb-3">
        <Field label="담당 직원">
          <select className="w-full px-2 py-1.5 text-xs rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={sample.assignee || ""} onChange={(e) => onUpdate(sample, { assignee: e.target.value })}>
            <option value="">미지정</option>
            {(accounts || []).map((a) => <option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
        </Field>
        <Field label="배송방식(참고)">
          <select className="w-full px-2 py-1.5 text-xs rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={sample.shippingMethod || ""} onChange={(e) => onUpdate(sample, { shippingMethod: e.target.value })}>
            <option value="">미선택</option>
            <option value="일반">일반배송({fees["일반"].toLocaleString("ko-KR")}원)</option>
            <option value="항공">항공특송({fees["항공"].toLocaleString("ko-KR")}원)</option>
          </select>
        </Field>
      </div>

      <div className="flex gap-2">
        <button onClick={() => setShowInvoice(true)} className="flex-1 text-xs px-3 py-1.5 rounded-lg border border-emerald-300 text-emerald-700 hover:bg-emerald-50 font-medium">📄 샘플비 인보이스 자동 생성</button>
        <button onClick={() => setShowAnnounce(true)} className="flex-1 text-xs px-3 py-1.5 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] hover:bg-[#1E3A8A]/5 font-medium">💬 고객 안내문 생성</button>
        {sample.status === "발송" && !sample.orderConverted && (
          <button
            onClick={() => {
              if (!window.confirm(`"${sample.clientName}" 건을 실제로 본품 계약·발주가 확정되어 5단계로 전환하시겠습니까?\n(파이프라인이 종결(Completed) 처리됩니다)`)) return;
              onUpdate(sample, { orderConverted: true, orderConvertedAt: nowDateTimeStr(), orderConvertedBy: currentUserName || "알 수 없음" });
            }}
            className="flex-1 text-xs px-3 py-1.5 rounded-lg border border-purple-300 text-purple-700 hover:bg-purple-50 font-medium"
          >
            📜 본품계약 전환
          </button>
        )}
        {isAdmin && <button onClick={() => onDelete(sample)} className="text-xs px-2 text-red-400 hover:text-red-600">🗑️</button>}
      </div>
      {sample.orderConverted && (
        <div className="mt-2 text-xs px-3 py-2 rounded-lg bg-purple-50 text-purple-700 font-medium">
          🎉 본품계약 전환 완료 — 파이프라인 종결됨 ({sample.orderConvertedBy}, {sample.orderConvertedAt})

      {/* 💬 업무 특이사항 및 소통 메모 — 작성자/작성일시 자동기록되는 타임라인 */}
      <div className="mt-4 pt-3 border-t border-slate-100">
        <div className="text-[11px] font-semibold text-slate-500 mb-1.5">💬 업무 특이사항 및 소통 메모</div>
        <div className="flex gap-1.5 mb-2">
          <input
            value={memoText}
            onChange={(e) => setMemoText(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submitMemo()}
            placeholder="직원들과 공유할 특이사항을 입력하세요 (예: 현지 공장 발주 완료, 항공 운송장번호 입력 등)"
            className="flex-1 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]"
          />
          <button onClick={submitMemo} className="text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-white hover:opacity-90 whitespace-nowrap">등록</button>
        </div>
        <div className="space-y-1.5 max-h-40 overflow-y-auto">
          {(sample.memos || []).length === 0 && <p className="text-[11px] text-slate-300">등록된 특이사항이 없습니다.</p>}
          {(sample.memos || []).slice().reverse().map((m) => (
            <div key={m.id} className="flex items-start justify-between gap-2 text-[11px] bg-slate-50 rounded-lg px-2.5 py-1.5">
              <div>

                <div className="text-slate-700 whitespace-pre-line">{m.text}</div>
              </div>
              {onDeleteMemo && <button onClick={() => onDeleteMemo(sample, m.id)} className="text-slate-300 hover:text-red-500 shrink-0" title="삭제">✕</button>}
            </div>
          ))}
        </div>
      </div>

      {showAnnounce && <SampleAnnounceModal shippingFees={fees} onClose={() => setShowAnnounce(false)} />}
      {showInvoice && <SampleInvoiceModal sample={sample} products={products} proposals={proposals} supplierLogo={supplierLogo} shippingFees={fees} shippingFeeNotes={shippingFeeNotes || DEFAULT_SAMPLE_SHIPPING_FEE_NOTES} onUpdate={onUpdate} onClose={() => setShowInvoice(false)} />}

    </div>
  );
}

function SampleStockModal({ stock, products, isAdmin, onAdd, onUpdate, onSaveEdits, onDelete, onClose }) {
  const [newName, setNewName] = useState("");
  const [newQty, setNewQty] = useState(1);
  const [newLocation, setNewLocation] = useState("본사 창고");
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [edits, setEdits] = useState({}); // { [재고id]: {productName?, quantity?, location?} } — [💾수정저장] 누르기 전까지의 임시 수정본
  const [saved, setSaved] = useState(false);
  // 제품 관리 DB에서 실시간 검색(다중키워드+유사도순 정렬은 기존 smartProductSearch 재사용) — 최대 6개만 노출
  const suggestions = newName.trim() ? smartProductSearch(products, newName).slice(0, 6) : [];
  const pickSuggestion = (p) => {
    setNewName([p.name, p.specSize].filter(Boolean).join(" / ")); // 정확한 전체 제품명+규격을 그대로 삽입(오기입 방지)
    setShowSuggestions(false);
  };
  const addRow = () => {
    if (!newName.trim()) return;
    onAdd({ productName: newName.trim(), quantity: Number(newQty) || 0, location: newLocation.trim() || "본사 창고" });
    setNewName(""); setNewQty(1);
  };
  const getVal = (s, field) => (edits[s.id] && edits[s.id][field] !== undefined ? edits[s.id][field] : s[field]);
  const setEditField = (id, field, value) => setEdits((prev) => ({ ...prev, [id]: { ...prev[id], [field]: value } }));
  const saveEdits = async () => {
    await onSaveEdits(edits);
    setEdits({});
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "980px", height: "80vh" }} onClick={(e) => e.stopPropagation()}>

                />
                {showSuggestions && suggestions.length > 0 && (
                  <div className="absolute z-50 left-0 top-full mt-1 w-full max-h-72 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-lg">
                    {suggestions.map((p) => (
                      <button key={p.id} type="button" onMouseDown={() => pickSuggestion(p)} className="w-full flex items-center gap-2.5 px-2.5 py-2 hover:bg-slate-50 text-left border-b border-slate-50 last:border-0">
                        <div className="w-9 h-9 rounded bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
                          {p.image ? <img src={p.image} loading="lazy" className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[9px]">사진</span>}

                        <div className="min-w-0 flex-1">
                          <div className="text-xs font-medium text-slate-800" style={{ whiteSpace: "normal", wordBreak: "break-all" }}>{p.name}</div>

                        </div>
                        {p.category && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-[#1E3A8A]/10 text-[#1E3A8A] font-medium shrink-0 whitespace-nowrap">{p.category}</span>}
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <input type="number" value={newQty} onChange={(e) => setNewQty(e.target.value)} className="w-20 text-xs px-2.5 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]" />
              <input value={newLocation} onChange={(e) => setNewLocation(e.target.value)} placeholder="위치" className="w-28 text-xs px-2.5 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]" />
              <button onClick={addRow} className="text-xs px-3 py-2 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 whitespace-nowrap">➕ 등록/입고</button>

              <thead><tr className="bg-slate-50 text-slate-500">

                <th className="text-left px-3 py-2 font-medium w-32">위치</th>
                {isAdmin && <th className="w-12"></th>}
              </tr></thead>
              <tbody>
                {(stock || []).length === 0 && <tr><td colSpan={4} className="text-center text-slate-400 py-8">등록된 재고가 없습니다.</td></tr>}
                {(stock || []).map((s) => (
                  <tr key={s.id} className={"border-t border-slate-100 " + (edits[s.id] ? "bg-amber-50/50" : "")}>
                    <td className="px-3 py-1.5">
                      {isAdmin ? <input className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={getVal(s, "productName")} onChange={(e) => setEditField(s.id, "productName", e.target.value)} /> : s.productName}
                    </td>
                    <td className="px-3 py-1.5 text-right">
                      {isAdmin ? <input type="number" className="w-20 text-right px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={getVal(s, "quantity")} onChange={(e) => setEditField(s.id, "quantity", Number(e.target.value) || 0)} /> : <span className="font-semibold">{s.quantity}</span>}
                    </td>
                    <td className="px-3 py-1.5">
                      {isAdmin ? <input className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={getVal(s, "location") || ""} onChange={(e) => setEditField(s.id, "location", e.target.value)} /> : (s.location || "-")}

                    {isAdmin && <td className="px-3 py-1.5 text-center"><button onClick={() => onDelete(s)} className="text-red-400 hover:text-red-600">🗑️</button></td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        {isAdmin && (
          <div className="px-6 py-4 border-t border-slate-200 flex items-center justify-end gap-2 shrink-0">
            {Object.keys(edits).length > 0 && <span className="text-[11px] text-amber-600 mr-auto">수정된 항목 {Object.keys(edits).length}건 — 저장 전입니다</span>}
            <button onClick={saveEdits} disabled={Object.keys(edits).length === 0} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed">{saved ? "✅ 저장됨" : "💾 수정 저장"}</button>
          </div>
        )}
      </div>
    </div>
  );
}

  const handleCreateSample = async (rec) => {

  const toggleFlag = (e, s, field) => { e.stopPropagation(); onUpdate(s, { [field]: !s[field] }); };
  const handleDeleteRow = (e, s) => {
    e.stopPropagation();
    onDelete(s); // deleteSample(App레벨)이 자체적으로 confirm을 띄운 뒤 삭제 처리(카드뷰/상세모달의 삭제버튼과 동일 로직 공유)

        </div>
        <div className="flex gap-2">
          <button onClick={() => setShowStockManage(true)} className="px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] text-sm font-medium hover:bg-[#1E3A8A]/5 whitespace-nowrap">📦 샘플관리</button>

              <th className="text-left px-3 py-3 font-medium">배송방식</th>
              <th className="text-center px-3 py-3 font-medium">진행 단계</th>
              <th className="text-center px-3 py-3 font-medium">고객확인</th>
              <th className="text-right px-3 py-3 font-medium">청구금액</th>
              <th className="text-center px-3 py-3 font-medium">입금확인</th>
              <th className="text-center px-3 py-3 font-medium">관리</th>

            <tbody>

                  <td className="px-3 py-3 whitespace-nowrap text-xs text-slate-500">{s.requestDate || "-"}</td>
                  <td className="px-3 py-3 font-medium" style={{ color: "#111827" }}>{s.clientName}</td>
                  <td className="px-3 py-3 text-slate-600 max-w-[220px] truncate">{s.productName}</td>
                  <td className="px-3 py-3 text-right text-slate-600">{s.invoiceQty || "-"}</td>
                  <td className="px-3 py-3 text-slate-500 max-w-[160px] truncate">{s.receiveAddress || "-"}</td>

                    <span className={"inline-block text-[10px] px-2 py-1 rounded-full font-semibold border " + (SAMPLE_STATUS_COLORS[s.status] || "bg-slate-50 text-slate-500 border-slate-200")}>{SAMPLE_STATUS_LABELS[s.status] || s.status}</span>
                    {s.orderConverted && <span className="ml-1 inline-block text-[10px] px-2 py-1 rounded-full font-semibold border bg-purple-50 text-purple-700 border-purple-200" title={`본품계약 전환 완료 (${s.orderConvertedBy || ""}, ${s.orderConvertedAt || ""})`}>📜 계약전환</span>}
                  </td>
                  <td className="px-3 py-3 text-center" onClick={(e) => toggleFlag(e, s, "customerConfirmed")}>
                    <span className={"inline-block w-5 h-5 rounded-full text-xs leading-5 " + (s.customerConfirmed ? "bg-emerald-500 text-white" : "bg-slate-100 text-slate-300")}>✓</span>
                  </td>
                  <td className="px-3 py-3 text-right font-semibold" style={{ color: "#111827" }}>{s.invoiceAmount ? won(s.invoiceAmount) : "-"}</td>
                  <td className="px-3 py-3 text-center" onClick={(e) => toggleFlag(e, s, "paymentConfirmed")}>

                  <td className="px-3 py-3 text-center whitespace-nowrap">
                    <button onClick={(e) => { e.stopPropagation(); setDetailSample(s); }} title="진행상황 보기" className="text-slate-400 hover:text-[#1E3A8A] mr-2">📋</button>
                    {isAdmin && <button onClick={(e) => handleDeleteRow(e, s)} title="삭제" className="text-red-400 hover:text-red-600">🗑️</button>}

      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}

      {showCreate && <SampleCreateModal accounts={accounts} proposals={proposals} sampleStock={sampleStock} initialProposalId={pendingProposalId} onClose={() => { setShowCreate(false); setPendingProposalId(null); }} onSave={handleCreateSample} />}
      {showStockManage && <SampleStockModal stock={sampleStock} products={products} isAdmin={isAdmin} onAdd={onAddStock} onUpdate={onUpdateStock} onSaveEdits={onSaveStockEdits} onDelete={onDeleteStock} onClose={() => setShowStockManage(false)} />}
      {showFeeSettings && (
        <ShippingFeeSettingsModal
          shippingFees={shippingFees}
          shippingFeeNotes={shippingFeeNotes}
          onSave={(f, n) => onSaveShippingFees && onSaveShippingFees(f, n)}
          onClose={() => setShowFeeSettings(false)}
        />
      )}
      {invoiceSample && (
        <SampleInvoiceModal sample={invoiceSample} products={products} proposals={proposals} supplierLogo={supplierLogo} shippingFees={shippingFees} shippingFeeNotes={shippingFeeNotes} onUpdate={onUpdate} onClose={() => setInvoiceSample(null)} />
      )}
      {detailSample && (
        <SampleDetailModal onClose={() => setDetailSample(null)}>
          <SampleCard sample={detailSample} accounts={accounts} products={products} proposals={proposals} supplierLogo={supplierLogo} shippingFees={shippingFees} shippingFeeNotes={shippingFeeNotes} onSaveShippingFees={onSaveShippingFees} currentUserName={currentUserName} isAdmin={isAdmin} onUpdate={onUpdate} onDelete={(s) => { onDelete(s); setDetailSample(null); }} onAddMemo={onAddMemo} onDeleteMemo={onDeleteMemo} />
        </SampleDetailModal>
      )}
    </main>
  );
}

function App({ currentUser, onLogout, roleUser, accounts, onSaveAccount, onDeleteAccount }) {
  const isAdmin = !roleUser || roleUser.role === "admin"; // roleUser 없는 로컬/과거 세션은 관리자로 간주(하위호환)
  const [accountModalOpen, setAccountModalOpen] = useState(() => parseKoreanHash().view === "계정관리");
  const [activeStep, setActiveStep] = useState(1);
  const [settingsOpen, setSettingsOpen] = useState(() => parseKoreanHash().view === "기준정보");
  const [showFinishingAnalysis, setShowFinishingAnalysis] = useState(false);
  const [manualMergeList, setManualMergeList] = useState(null);
  const [exSettingsOpen, setExSettingsOpen] = useState(false); // 상단 유틸리티바의 "환율 상세설정" 팝업 토글
  const [logistics, setLogistics] = useState(() => (loadPricingSettingsCache() || {}).logistics || DEFAULT_LOGISTICS);
  const [marginTable, setMarginTable] = useState(() => ({ ...DEFAULT_MARGIN_TABLE, ...((loadPricingSettingsCache() || {}).marginTable || {}) }));
  const [customsRates, setCustomsRates] = useState(() => ({ ...DEFAULT_CUSTOMS_RATES, ...((loadPricingSettingsCache() || {}).customsRates || {}) }));
  const [difficultyMargins, setDifficultyMargins] = useState(() => (loadPricingSettingsCache() || {}).difficultyMargins || DEFAULT_DIFFICULTY_MARGINS);
  const [finishingOptions, setFinishingOptions] = useState(() => (loadPricingSettingsCache() || {}).finishingOptions || {}); // { [카테고리]: [{id,name,rmbPrice,krwPrice}] }
  const [shippingFees, setShippingFees] = useState(() => (loadPricingSettingsCache() || {}).shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES); // 샘플 국내택배비/항공특송료 설정
  const [shippingFeeNotes, setShippingFeeNotes] = useState(() => (loadPricingSettingsCache() || {}).shippingFeeNotes || DEFAULT_SAMPLE_SHIPPING_FEE_NOTES); // 배송비별 비고 안내문구(인보이스 No3 비고란에 자동반영)
  const [clientsList, setClientsList] = useState([]);
  const [exRate, setExRate] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(EXRATE_SAVED_KEY) || "null");
      if (saved && saved.rmbToKrw) return { rmbToKrw: saved.rmbToKrw, rmbToUsd: saved.rmbToUsd, usdToKrw: saved.usdToKrw };
    } catch (e) { console.error(e); }
    return { rmbToKrw: DEFAULT_EXRATE.rmbToKrw.toFixed(2), rmbToUsd: DEFAULT_EXRATE.rmbToUsd.toFixed(2), usdToKrw: DEFAULT_EXRATE.usdToKrw.toFixed(2) };
  });
  const [exRateSavedAt, setExRateSavedAt] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(EXRATE_SAVED_KEY) || "null");
      return (saved && saved.savedAt) || null;
    } catch (e) { return null; }
  });
  const [exRateSuggestion, setExRateSuggestion] = useState(null); // API로 받아온 오늘의 추천 환율(안내문구+원클릭적용용, exRate 자체는 건드리지 않음)

  // 환율 입력창 하나가 포커스를 벗어날 때(onBlur) 소수점 둘째자리 ".00" 형식으로 강제 정돈
  const formatExRateField = (field) => {
    setExRate((prev) => ({ ...prev, [field]: (Number(prev[field]) || 0).toFixed(2) }));
  };
  // "💾 적용/저장" 버튼 — 3개 환율값을 전부 .toFixed(2)로 정돈하고 localStorage에 저장, 저장일시를 즉시 갱신.
  // exRate state 자체를 갱신하므로 제안가 계산식(useMemo가 exRate를 의존성으로 갖고 있음)에도 즉시 재계산 반영됨.
  const saveExRate = () => {
    const formatted = {
      rmbToKrw: (Number(exRate.rmbToKrw) || 0).toFixed(2),
      rmbToUsd: (Number(exRate.rmbToUsd) || 0).toFixed(2),
      usdToKrw: (Number(exRate.usdToKrw) || 0).toFixed(2),
    };
    const savedAt = nowDateTimeStr(); // "YYYY-MM-DD HH:mm:ss"
    setExRate(formatted);
    setExRateSavedAt(savedAt);
    try { localStorage.setItem(EXRATE_SAVED_KEY, JSON.stringify({ ...formatted, savedAt })); } catch (e) { console.error(e); }
    alert("환율 설정이 성공적으로 변경되었습니다."); // 확인 누르면 즉시 아래에서 모달을 닫음
    setExSettingsOpen(false);
  };

  // 페이지 로드시 캐시된 환율을 즉시 보여주고, 오늘 아직 갱신 안 됐으면 API를 호출해 하루 1회만 자동 갱신.
  // 이 API호출은 화면 렌더링에 필요한 작업이 아니므로 requestIdleCallback(브라우저가 한가할 때)으로 미뤄서
  // 첫 화면이 뜨는 속도와 경합하지 않도록 한다(미지원 브라우저는 setTimeout으로 대체).
  useEffect(() => {
    const runWhenIdle = (fn) => {
      if (typeof requestIdleCallback === "function") requestIdleCallback(fn, { timeout: 2000 });
      else setTimeout(fn, 200);
    };
    runWhenIdle(() => {
      try {
        const cached = JSON.parse(localStorage.getItem(EXRATE_CACHE_KEY) || "null");
        if (cached) setExRateSuggestion(cached);
        if (cached && cached.fetchedDate === todayStr()) return; // 오늘 이미 갱신됨
      } catch (e) { console.error(e); }
      fetchTodayExchangeRates().then((rates) => { if (rates) setExRateSuggestion(rates); });
    });
  }, []);

  // "🔄 오늘 환율 적용" 버튼 — API로 받아온 추천 환율을 입력창(exRate)에 즉시 반영해 제안가 계산식에 바로 연동
  const applyTodayExchangeRates = () => {
    if (!exRateSuggestion) { setToast("아직 환율 정보를 불러오지 못했습니다. 인터넷 연결을 확인해주세요."); return; }
    setExRate({
      rmbToKrw: Number(exRateSuggestion.rmbToKrw).toFixed(2),
      rmbToUsd: Number(exRateSuggestion.rmbToUsd).toFixed(2),
      usdToKrw: Number(exRateSuggestion.usdToKrw).toFixed(2),
    });
    setToast("오늘 기준 환율을 적용했습니다. (하단 '💾 적용/저장' 버튼을 눌러야 다음 접속에도 유지됩니다)");

  const [supplierLogo, setSupplierLogo] = useState(() => (loadPricingSettingsCache() || {}).supplierLogo || "");

  // 기준정보(물류비/마진율표/관세율/난이도차등율/로고)를 Firestore에서도 불러와 다른 기기와 동기화(최초 1회, 있으면 localStorage 캐시보다 우선 적용)
  useEffect(() => {
    if (!FIREBASE_ENABLED || !db) return;
    db.collection(COLLECTIONS.settings).doc("pricingConfig").get().then((doc) => {
      if (!doc.exists) return;
      const data = doc.data() || {};
      if (data.logistics) setLogistics(data.logistics);
      if (data.marginTable) setMarginTable((prev) => ({ ...prev, ...data.marginTable }));
      if (data.customsRates) setCustomsRates((prev) => ({ ...prev, ...data.customsRates }));
      if (data.difficultyMargins) setDifficultyMargins(data.difficultyMargins);
      if (data.supplierLogo) setSupplierLogo(data.supplierLogo);
      if (data.finishingOptions) setFinishingOptions(data.finishingOptions);
      if (data.shippingFees) setShippingFees(data.shippingFees);
      if (data.shippingFeeNotes) setShippingFeeNotes(data.shippingFeeNotes);
    }).catch((e) => console.error("기준정보 불러오기 실패:", e));
  }, []);

  // "저장하고 닫기" 버튼 — 기준정보 7종을 localStorage + Firestore에 함께 저장(다음 접속에도 유지, 다른 기기와도 동기화)
  const saveSettingsConfig = async () => {
    const payload = { logistics, marginTable, customsRates, difficultyMargins, supplierLogo, finishingOptions, shippingFees, shippingFeeNotes, savedAt: nowDateTimeStr() };
    try { localStorage.setItem(PRICING_SETTINGS_KEY, JSON.stringify(payload)); invalidatePricingSettingsCache(payload); } catch (e) { console.error(e); }
    try { if (FIREBASE_ENABLED && db) await db.collection(COLLECTIONS.settings).doc("pricingConfig").set(payload); } catch (e) { console.error(e); }
  };

  // 배송비 설정만 별도로 즉시 저장(⚙️ 배송비 설정 모달에서 사용) — 다른 기준정보 항목은 건드리지 않고 배송비만 갱신
  const saveShippingFees = async (fees, notes) => {
    setShippingFees(fees);
    setShippingFeeNotes(notes);
    const cache = loadPricingSettingsCache() || {};
    const payload = { ...cache, logistics, marginTable, customsRates, difficultyMargins, supplierLogo, finishingOptions, shippingFees: fees, shippingFeeNotes: notes, savedAt: nowDateTimeStr() };
    try { localStorage.setItem(PRICING_SETTINGS_KEY, JSON.stringify(payload)); invalidatePricingSettingsCache(payload); } catch (e) { console.error(e); }
    try { if (FIREBASE_ENABLED && db) await db.collection(COLLECTIONS.settings).doc("pricingConfig").set(payload); } catch (e) { console.error(e); }
    setToast("배송비 설정을 저장했습니다.");

  // 1단계: 가격조사 저장소

  const [productImage, setProductImage] = useState("");

  const [selectedFinishingQty, setSelectedFinishingQty] = useState({}); // { [후가공id]: 선택된 수량/도수 } — 가변형 항목에서만 의미있음
  const [guideSelectedIds, setGuideSelectedIds] = useState([]); // "미선택/별도안내" 모드에서 체크된 후가공id들
  const [guideTexts, setGuideTexts] = useState({}); // { [후가공id]: 사용자가 수정 가능한 안내문구 } — 체크시 기본문구로 자동채움
  const [finishingApplyMode, setFinishingApplyMode] = useState("apply"); // "apply"=선택한 후가공 단가를 원가에 합산 / "guide"=가격변동없이 안내문구만 노출
  const [costLocked, setCostLocked] = useState(true);

  const [leadTime, setLeadTime] = useState(30);

  const [marginClientSearch, setMarginClientSearch] = useState(""); // 고객사 자동완성 검색창 입력값
  const [showMarginClientSuggestions, setShowMarginClientSuggestions] = useState(false);

  useEffect(() => { setCustomsRate(customsRates[category] ?? 0); }, [category]);
  useEffect(() => { setMarginOverride(null); setSelectedFinishingIds([]); setSelectedFinishingQty({}); setGuideSelectedIds([]); setGuideTexts({}); }, [category]);

  const calc = useMemo(() => {
    const qty = Number(quantity) || 0;
    const boxPerUnit = qty > 0 ? (Number(rmbBox) || 0) / qty : 0;
    const inspectPerUnit = qty > 0 ? (Number(rmbInspect) || 0) / qty : 0;
    const shipPerUnit = qty > 0 ? (Number(rmbShip) || 0) / qty : 0;
    // "④ 후가공 선택"에서 가격반영 모드로 체크된 항목들의 위안화 단가 합산(개당) — 미선택/안내모드일 땐 가격에 영향 없음
    // 가변 수량/도수형은 선택한 수량만큼 배수로 가산, 고정 단가형은 수량과 무관하게 1회만 가산
    const selectedFinishingItems = finishingApplyMode === "apply"
      ? (finishingOptions[category] || [])
          .filter((f) => selectedFinishingIds.includes(f.id))
          .map((f) => ({ ...f, qty: f.optionType === "variable" ? (selectedFinishingQty[f.id] || 1) : 1 }))
      : [];
    const finishingRmbPerUnit = selectedFinishingItems.reduce((s, f) => s + (Number(f.rmbPrice) || 0) * (f.qty || 1), 0);
    const unitRmb = (Number(rmbBase) || 0) + boxPerUnit + inspectPerUnit + shipPerUnit + finishingRmbPerUnit;
    const totalRmbPayment = unitRmb * qty;
    const autoMarginRate = getMarginRate(marginTable, category, totalRmbPayment);
    const clientDifficulty = (clientsList.find((c) => c.name === marginClientName) || {}).difficulty || "표준";
    const difficultyAdjust = (difficultyMargins[clientDifficulty] || 0) / 100;
    const marginRate = (marginOverride != null ? marginOverride : autoMarginRate) + difficultyAdjust;
    const unitCostKrw = unitRmb * exRate.rmbToKrw;
    const pureFactoryCostKrw = (Number(rmbBase) || 0) * exRate.rmbToKrw;
    const logisticsTotal = (Number(cbm) || 0) * logistics.cbmRate + logistics.blFee + logistics.originFee + logistics.brokerFee;
    const logisticsPerUnit = qty > 0 ? logisticsTotal / qty : 0;
    const customsPerUnit = (unitCostKrw + logisticsPerUnit) * ((Number(customsRate) || 0) / 100);
    const totalCostPerUnit = unitCostKrw + logisticsPerUnit + customsPerUnit;
    const overheadPerUnit = (unitCostKrw - pureFactoryCostKrw) + logisticsPerUnit + customsPerUnit;
    const rawPrice = marginRate < 1 ? totalCostPerUnit / (1 - marginRate) : 0;
    const proposedPrice = Math.ceil(rawPrice / 10) * 10;
    const profitPerUnit = proposedPrice - totalCostPerUnit;
    const profitRate = proposedPrice > 0 ? (profitPerUnit / proposedPrice) * 100 : 0;
    return {
      unitRmb, boxPerUnit, inspectPerUnit, shipPerUnit, totalRmbPayment, marginRate, autoMarginRate,
      unitCostKrw, pureFactoryCostKrw, overheadPerUnit, logisticsPerUnit, customsPerUnit, totalCostPerUnit,
      proposedPrice, profitPerUnit, profitRate, totalProfit: profitPerUnit * qty, totalProposal: proposedPrice * qty,
      totalFactoryCost: pureFactoryCostKrw * qty, totalOverhead: overheadPerUnit * qty,
      selectedFinishingItems, finishingRmbPerUnit,
    };
  }, [category, quantity, cbm, customsRate, rmbBase, rmbBox, rmbInspect, rmbShip, marginTable, logistics, exRate, marginOverride, clientsList, difficultyMargins, marginClientName, finishingOptions, selectedFinishingIds, selectedFinishingQty, finishingApplyMode]);

  const [draftItems, setDraftItems] = useState([]);
  const [clientInfo, setClientInfo] = useState(() => ({ clientName: "", contact: "", channel: "카카오채널", employee: (roleUser && roleUser.displayName) || "", proposalTitle: "" }));
  const [proposalList, setProposalList] = useState([]);
  const [invoiceList, setInvoiceList] = useState([]); // INVOICE(인보이스) 발행 목록 — 제안서에서 파생, proposalId로 연결
  const [factoriesList, setFactoriesList] = useState([]);

  const [taskList, setTaskList] = useState([]);
  const [sampleList, setSampleList] = useState([]);
  const [sampleStockList, setSampleStockList] = useState([]);
  const [productToPick, setProductToPick] = useState(null);
  const [sampleInitProposalId, setSampleInitProposalId] = useState(null); // "🧪 샘플요청 등록"으로 4단계에 전달할 발송완료 제안서 id
  // 발송완료된 제안서 하나를 골라 4단계(샘플진행)로 "선택적" 전환 — 자동이관이 아니라 사용자가 명시적으로 누를 때만
  const createSampleFromProposal = (p) => {
    if (!window.confirm(`"${p.clientName}" 제안서를 바탕으로 샘플 진행(4단계)으로 이동하시겠습니까?`)) return;
    setSampleInitProposalId(p.id);
    setView("pipeline");
    setActiveStep(4);

  // 제안서를 기반으로 인보이스를 발행 — 품목/수량/단가/고객사 정보를 100% 그대로 가져오고, 미리보기를 바로 띄운다(버튼 한 번으로 자동입력)
  const [invoiceEditProposal, setInvoiceEditProposal] = useState(null); // "📄 인보이스 발행" 클릭시 열리는 후가공/수량 재선택 편집단계
  // 1단계: "📄 인보이스 발행" 클릭 → 편집 모달(InvoiceEditModal)을 연다 (제안서 작성처럼 후가공/수량을 다시 선택하는 단계)
  const openInvoiceEditor = (p) => {
    if (!window.confirm(`"${p.clientName}" 제안서를 바탕으로 본품계약(인보이스)을 진행하시겠습니까?\n제안서 원본은 그대로 유지되고, 완전히 독립된 인보이스 사본이 새로 만들어집니다.`)) return;

  // 2단계: 편집 모달에서 "확정"하면, 그 결과(editedItems)로 실제 인보이스를 발행하고 미리보기를 연다
  const finalizeInvoice = async (p, editedItems) => {

    const record = {

    const local = { id: Date.now() + Math.random(), ...record };

    setInvoiceEditProposal(null);
    setView("pipeline"); setActiveStep(5); // 5단계 본품계약 목록으로 즉시 이관 — 미리보기를 닫으면 바로 목록에서 확인 가능
    if (p.id) await updateReviewStatus(p, "인보이스"); // 원본 제안서의 검토상태를 자동으로 "인보이스"로 전환(제안서 데이터 자체는 그대로, 상태값만 갱신)
    try { await fsAdd(COLLECTIONS.invoices, record); setToast("📄 인보이스가 발행되어 5단계로 이관되었습니다."); } catch (e) { console.error(e); setToast("Firestore 저장 중 오류가 발생했습니다. (화면에는 반영됨)"); }
  };
  const deleteInvoiceRecord = async (iv) => {

  const [productToView, setProductToView] = useState(null);
  // 날짜별(YYYYMMDD) 제안번호 순번 카운터. useState가 아닌 ref를 쓰는 이유:
  // ZIP/일괄 업로드 루프 안에서 여러 파일을 연속 처리할 때 setState는 비동기라 같은 렌더 안에서는

  // 같은 배치 내에서도 -001,-002,-003... 순서대로 증가한다.
  const proposalSeqCounterRef = useRef({});

  // Firestore 연결 시 실시간 구독 — 미연결이면 로컬 state만 사용
  const [fsErrors, setFsErrors] = useState([]); // [{collection, message}] — 사라지는 토스트 대신 계속 화면에 남는 배너로 보여줄 오류 목록
  const [fsSlowWarning, setFsSlowWarning] = useState(false); // 일정 시간이 지나도 응답이 전혀 없을 때(네트워크/방화벽 차단 등 의심) 표시
  useEffect(() => {
    // 구독 오류(특히 권한거부)를 콘솔뿐 아니라 화면에도 "계속 남는 배너"로 노출 — "데이터가 0개로 보인다"는 문의가 실은
    // 필터링이 아니라 이 계정/네트워크에서 Firestore를 아예 못 읽어서 생기는 문제일 수 있어, 원인을 바로 확인할 수 있게 한다.
    const handleFsError = (collectionName, err) => {
      const denied = err && (err.code === "permission-denied" || /permission/i.test(err.message || ""));
      const message = denied
        ? `"${collectionName}" 데이터를 불러올 권한이 없습니다 (Firebase 보안 규칙에서 이 계정의 읽기 권한을 확인해주세요).`
        : `"${collectionName}" 데이터를 불러오는 중 오류가 발생했습니다: ${(err && err.message) || "알 수 없는 오류"}`;
      setFsErrors((prev) => (prev.some((e) => e.collection === collectionName) ? prev : [...prev, { collection: collectionName, message }]));
    };
    let gotAnyResponse = false;
    const markResponded = (setter) => (list) => { gotAnyResponse = true; setter(list); };
    const unsub1 = fsSubscribe(COLLECTIONS.sourcing, markResponded((list) => setSourcingItems(list)), handleFsError);
    const unsub2 = fsSubscribe(COLLECTIONS.proposals, markResponded((list) => setProposalList(list)), handleFsError);
    const unsub3 = fsSubscribe(COLLECTIONS.clients, markResponded((list) => setClientsList(list)), handleFsError);
    const unsub4 = fsSubscribe(COLLECTIONS.factories, markResponded((list) => setFactoriesList(list)), handleFsError);
    const unsub5 = fsSubscribe(COLLECTIONS.products, markResponded((list) => setProductsList(list)), handleFsError);
    const unsub6 = fsSubscribe(COLLECTIONS.excelArchive, markResponded((list) => setExcelArchiveList(list)), handleFsError);
    const unsub7 = fsSubscribe(COLLECTIONS.tasks, markResponded((list) => setTaskList(list)), handleFsError);
    const unsub8 = fsSubscribe(COLLECTIONS.samples, markResponded((list) => setSampleList(list)), handleFsError);
    const unsub9 = fsSubscribe(COLLECTIONS.sampleStock, markResponded((list) => setSampleStockList(list)), handleFsError);

  const addFactoryRecord = async (f) => {

  // ⭐ 주거래공장 지정/해제 — 지정 전용 토스트 문구를 위해 updateFactoryRecord와 별도 함수로 분리

  const mergeFactories = async (selectedFactories, primaryId) => {

    const subs = selectedFactories.filter((f) => f.id !== primaryId);

    setProductsList((prev) => prev.map((p) => (subNames.includes(p.factory) ? { ...p, factory: primary.name } : p)));
    for (const p of affectedProducts) {

    const mergedMainProducts = [...new Set([primary.mainProducts, ...subs.map((f) => f.mainProducts)].filter(Boolean).join(",").split(",").map((s) => s.trim()).filter(Boolean))].join(", ");
    setFactoriesList((prev) => prev.map((f) => (f.id === primaryId ? { ...f, mainProducts: mergedMainProducts } : f)).filter((f) => !subs.some((s) => s.id === f.id)));

  const syncParsedDataToDb = async (clientName, items, factories, factoryLinks, factoryHomepages) => {
