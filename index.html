              <th className="text-left px-3 py-3 font-medium">발행일시</th>
              <th className="text-left px-3 py-3 font-medium">고객사명</th>
              <th className="text-center px-3 py-3 font-medium">대표 제품명</th>
              <th className="text-right px-3 py-3 font-medium">총 금액</th>
              <th className="text-left px-3 py-3 font-medium">작성자</th>
              <th className="text-left px-3 py-3 font-medium">발송자</th>
              <th className="text-center px-3 py-3 font-medium">상태</th>
              <th className="text-center px-3 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {pagedList.map((iv) => {
                const reviewStatus = getReviewStatus(iv);
                return (
                  <tr key={iv.id} onClick={() => onOpenInvoice(iv)} className="border-t border-slate-100 hover:bg-slate-50/50 cursor-pointer">
                    <td className="px-3 py-3 text-xs whitespace-nowrap"><span className="text-[#1D4ED8] font-medium">{iv.code}</span></td>
                    <td className="px-3 py-3 text-xs text-slate-500 whitespace-nowrap">{formatCreatedAt(iv.sentAt || iv.createdAt)}</td>
                    <td className="px-3 py-3 text-xs font-medium text-slate-800" style={{ wordBreak: "keep-all" }}>{iv.clientName}</td>
                    <td className="px-3 py-3 text-xs text-slate-600 text-center" style={{ wordBreak: "keep-all" }}>{(iv.items || []).map((it) => it.productName).join(", ")}</td>
                    <td className="px-3 py-3 text-sm text-right font-semibold text-[#1E3A8A] whitespace-nowrap">{won(iv.totalAmount)}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{displayStaffName(iv.createdBy) || "-"}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{iv.sentBy ? displayStaffName(iv.sentBy) : <span className="text-slate-300">미발송</span>}</td>
                    <td className="px-3 py-3 text-center">
                      <span className={"text-xs px-2 py-1 rounded-full font-medium whitespace-nowrap " + (REVIEW_STATUS_COLORS[reviewStatus] || "bg-slate-100 text-slate-500")}>{REVIEW_STATUS_LABELS[reviewStatus] || reviewStatus}</span>
                    </td>
                    <td className="px-3 py-3 text-center" onClick={(e) => e.stopPropagation()}>
                      <div className="flex justify-center gap-1">
                        <button onClick={() => onOpenInvoice(iv)} className="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm">👁️</button>
                        {isAdmin && <button onClick={() => onDelete(iv)} className="w-8 h-8 rounded-lg border border-red-100 text-red-500 hover:bg-red-50 text-sm">🗑️</button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}
    </main>
  );
}

/* ===================== 📦 5단계 · 본품계약 & 공장 발주 목록 (인보이스 목록과 동일한 테이블 UI) ===================== */
function OrderStageListView({ orders, proposalList, invoiceList, onOpenProposal, onOpenInvoice }) {
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;

  // 5단계에 들어오는 두 가지 경로를 하나의 목록으로 합친다:
  // ① 4단계 샘플진행에서 "📜 본품계약 전환"된 건 ② 3단계 제안서에서 "📄 인보이스 확정(본품 전환)"으로 샘플 단계 없이 바로 넘어온 건
  const enriched = useMemo(() => {
    const fromSamples = orders.map((s) => ({
      key: `sample-${s.id}`, clientName: s.clientName, productName: s.productName,
      convertedAt: s.orderConvertedAt, convertedBy: s.orderConvertedBy,
      proposal: proposalList.find((p) => String(p.id) === String(s.linkedProposalId)),
      invoice: invoiceList.find((iv) => String(iv.proposalId) === String(s.linkedProposalId)),
    }));
    const sampleProposalIds = new Set(orders.map((s) => String(s.linkedProposalId)));
    const fromDirectInvoices = invoiceList
      .filter((iv) => !sampleProposalIds.has(String(iv.proposalId)))
      .map((iv) => ({
        key: `invoice-${iv.id}`, clientName: iv.clientName, productName: (iv.items || []).map((it) => it.productName).join(", "),
        convertedAt: iv.createdAt, convertedBy: iv.createdBy,
        proposal: proposalList.find((p) => String(p.id) === String(iv.proposalId)),
        invoice: iv,
      }));
    return [...fromSamples, ...fromDirectInvoices];
  }, [orders, proposalList, invoiceList]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    const base = !q ? enriched : enriched.filter((e) => (e.clientName || "").toLowerCase().includes(q) || (e.invoice && (e.invoice.code || "").toLowerCase().includes(q)));
    return [...base].sort((a, b) => (parseCreatedAt(b.convertedAt) || 0) - (parseCreatedAt(a.convertedAt) || 0));
  }, [enriched, search]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedList = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { setPage(1); }, [search]);

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-lg font-bold text-slate-800">📦 5단계 · 본품계약 & 공장 발주 (Order & Final Invoice)</h2>
          <p className="text-xs text-slate-400 mt-1">4단계에서 "📜 본품계약 전환"된 건이 여기 모입니다. 원본 제안서와 발행 인보이스를 바로 확인할 수 있습니다.</p>
        </div>
      </div>
      <input
        value={search} onChange={(e) => setSearch(e.target.value)}
        placeholder="🔍 고객사명, 인보이스번호 검색"
        className="w-full mb-4 px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
      />
      {pagedList.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-12 text-center text-slate-400 text-sm">아직 본품계약으로 전환된 건이 없습니다. 4단계 샘플 진행에서 "📜 본품계약 전환" 버튼을 눌러 등록해주세요.</div>
      ) : (
        <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full table-fixed" style={{ tableLayout: "fixed", width: "100%" }}>
            <colgroup>
              <col style={{ width: "13%" }} /><col style={{ width: "10%" }} /><col style={{ width: "15%" }} />
              <col style={{ width: "22%" }} /><col style={{ width: "12%" }} /><col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} /><col style={{ width: "10%" }} /><col style={{ width: "110px" }} />
            </colgroup>
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              <th className="text-left px-3 py-3 font-medium">인보이스/발주번호</th>
              <th className="text-left px-3 py-3 font-medium">발행일시</th>
              <th className="text-left px-3 py-3 font-medium">고객사명</th>
              <th className="text-center px-3 py-3 font-medium">대표 제품명</th>
              <th className="text-right px-3 py-3 font-medium">총 금액</th>
              <th className="text-left px-3 py-3 font-medium">작성자</th>
              <th className="text-left px-3 py-3 font-medium">발송자</th>
              <th className="text-center px-3 py-3 font-medium">상태</th>
              <th className="text-center px-3 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {pagedList.map(({ key, clientName, productName, convertedAt, convertedBy, proposal, invoice }) => {
                const reviewStatus = invoice ? getReviewStatus(invoice) : null;
                return (
                  <tr key={key} className="border-t border-slate-100 hover:bg-slate-50/50">
                    <td className="px-3 py-3 text-xs whitespace-nowrap">{invoice ? <span className="text-[#1D4ED8] font-medium">{invoice.code}</span> : <span className="text-slate-300">미발행</span>}</td>
                    <td className="px-3 py-3 text-xs text-slate-500 whitespace-nowrap">{formatCreatedAt((invoice && (invoice.sentAt || invoice.createdAt)) || convertedAt)}</td>
                    <td className="px-3 py-3 text-xs font-medium text-slate-800" style={{ wordBreak: "keep-all" }}>{clientName}</td>
                    <td className="px-3 py-3 text-xs text-slate-600 text-center" style={{ wordBreak: "keep-all" }}>{productName}</td>
                    <td className="px-3 py-3 text-sm text-right font-semibold text-[#1E3A8A] whitespace-nowrap">{invoice ? won(invoice.totalAmount) : "-"}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{displayStaffName(convertedBy) || "-"}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{invoice && invoice.sentBy ? displayStaffName(invoice.sentBy) : <span className="text-slate-300">미발송</span>}</td>
                    <td className="px-3 py-3 text-center">
                      {reviewStatus ? (
                        <span className={"text-xs px-2 py-1 rounded-full font-medium whitespace-nowrap " + (REVIEW_STATUS_COLORS[reviewStatus] || "bg-slate-100 text-slate-500")}>{REVIEW_STATUS_LABELS[reviewStatus] || reviewStatus}</span>
                      ) : (
                        <span className="text-xs px-2 py-1 rounded-full font-medium whitespace-nowrap bg-purple-50 text-purple-700">🎉 계약전환완료</span>
                      )}
                    </td>
                    <td className="px-3 py-3 text-center">
                      <div className="flex justify-center gap-1">
                        <button
                          onClick={() => proposal ? onOpenProposal(proposal) : window.alert("연결된 원본 제안서를 찾을 수 없습니다.")}
                          title="📋 원본 제안서" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm"
                        >
                          📋
                        </button>
                        <button
                          onClick={() => invoice ? onOpenInvoice(invoice) : window.alert("아직 발행된 인보이스가 없습니다. 원본 제안서에서 '📄 인보이스 확정(본품 전환)'을 먼저 진행해주세요.")}
                          title="📄 인보이스" className="w-8 h-8 rounded-lg border border-purple-200 text-purple-700 hover:bg-purple-50 text-sm"
                        >
                          📄
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}
    </main>
  );
}

/* ===================== PDF 제안서 미리보기 ===================== */

function EditField({ value, onChange, className, placeholder }) {
  return (
    <input
      value={value}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      className={"outline-none bg-transparent border-b border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors " + (className || "")}
    />
  );
}

function EditArea({ value, onChange, className, placeholder }) {
  const ref = useRef(null);
  const resize = (el) => { if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; };
  useEffect(() => { resize(ref.current); }, [value]);
  return (
    <textarea
      ref={ref}
      value={value}
      onChange={(e) => { onChange(e.target.value); resize(e.target); }}
      placeholder={placeholder}
      rows={1}
      style={{ overflow: "hidden", resize: "none" }}
      className={"outline-none bg-transparent border border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors w-full " + (className || "")}
    />
  );
}

function EditNumberField({ value, onChange, className, placeholder, readOnly }) {
  const display = value === "" || value === null || value === undefined ? "" : Number(value).toLocaleString("ko-KR");
  return (
    <input
      value={display}
      onChange={(e) => {
        if (readOnly) return;
        const raw = e.target.value.replace(/[^0-9.]/g, "");
        onChange(raw === "" ? 0 : Number(raw));
      }}
      placeholder={placeholder}
      inputMode="numeric"
      readOnly={readOnly}
      className={"outline-none bg-transparent border-b border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors " + (readOnly ? "bg-slate-50 text-slate-500 cursor-default " : "") + (className || "")}
    />
  );
}

const SEND_CHANNEL_OPTIONS = ["카카오톡", "카카오채널", "이메일", "팩스", "기타"];
function SendCompleteModal({ onConfirm, onClose }) {
  const [channel, setChannel] = useState(SEND_CHANNEL_OPTIONS[0]);
  const [customChannel, setCustomChannel] = useState("");
  const confirm = () => {
    const finalChannel = channel === "기타" ? (customChannel.trim() || "기타") : channel;
    onConfirm(finalChannel);
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[80] p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-sm overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">🚀 발송완료 처리</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3">
          <Field label="발송 채널">
            <div className="grid grid-cols-2 gap-2">
              {SEND_CHANNEL_OPTIONS.map((c) => (
                <button key={c} type="button" onClick={() => setChannel(c)} className={"text-xs px-3 py-2 rounded-lg font-medium border " + (channel === c ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "border-slate-200 text-slate-600")}>{c}</button>
              ))}
            </div>
            {channel === "기타" && (
              <input
                autoFocus
                value={customChannel}
                onChange={(e) => setCustomChannel(e.target.value)}
                placeholder="발송 수단/사유 입력 (예: 직접 전달, 위챗)"
                className="mt-2 w-full text-xs px-3 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]"
              />
            )}
          </Field>
          <p className="text-xs text-slate-400">확인을 누르면 현재 로그인한 계정 이름과 지금 시각이 발송자 정보로 함께 기록됩니다.</p>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={confirm} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">확인/발송완료 처리</button>
        </div>
      </div>
    </div>
  );
}

function PdfPreview({ open, onClose, data, supplierLogo, onSendComplete, onCreateSample, onCreateInvoice, mode }) {
  const isInvoice = mode === "invoice";
  const [showSendModal, setShowSendModal] = useState(false);
  const [greeting, setGreeting] = useState(GREETING);
  const [terms, setTerms] = useState(isInvoice ? INVOICE_TERMS : TERMS);
  const [supplier, setSupplier] = useState(SUPPLIER);
  const [clientName, setClientName] = useState("");
  const [validUntil, setValidUntil] = useState("");
  const [items, setItems] = useState([]);

  useEffect(() => {
    if (!data) return;
    setGreeting(GREETING);
    setTerms(isInvoice ? INVOICE_TERMS : TERMS);
    setSupplier(SUPPLIER);
    setClientName(data.clientName || "");
    setValidUntil(data.validUntil || "");
    setItems((data.items || []).map((it) => ({ ...it, productName: (data.proposalTitle && data.proposalTitle.trim()) ? data.proposalTitle : it.productName })));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data]);

  if (!open || !data) return null;
  const DARK = "#111827";
  const totalAmount = items.reduce((s, i) => s + (Number(i.totalPrice) || 0), 0);
  // 인보이스 하단 정산표: 공급가액합계 → 부가세(10%) → 총합계 → 계약금(30%) → 잔금(70%)
  const vat = Math.round(totalAmount * 0.1);
  const grandTotal = totalAmount + vat;
  const depositAmount = Math.round(grandTotal * 0.3);
  const balanceAmount = grandTotal - depositAmount;

  const updateItem = (id, field, value) => {
    setItems((prev) => prev.map((it) => {
      if (it.id !== id) return it;
      const next = { ...it, [field]: value };
      if (field === "quantity" || field === "unitPrice") {
        const q = field === "quantity" ? Number(value) || 0 : Number(it.quantity) || 0;
        const p = field === "unitPrice" ? Number(value) || 0 : Number(it.unitPrice) || 0;
        next.totalPrice = q * p;
      }
      return next;
    }));
  };
  const updateGreeting = (idx, v) => setGreeting((prev) => prev.map((g, i) => (i === idx ? v : g)));
  const updateTerm = (idx, v) => setTerms((prev) => prev.map((t, i) => (i === idx ? v : t)));

  // "PDF로 저장" 시 브라우저가 기본 제안하는 파일명은 보통 document.title을 그대로 따르므로,
  // 인쇄 다이얼로그를 열기 직전에만 제목을 "제안서_고객사명_작성일자"(인보이스는 "인보이스_...")로 바꿔뒀다가 되돌린다.
  const handlePrint = () => {
    const originalTitle = document.title;
    const safeClient = (clientName || "").trim().replace(/[\\/:*?"<>|]/g, "") || "고객사";
    document.title = `${isInvoice ? "인보이스" : "제안서"}_${safeClient}_${todayStr()}`;
    window.print();
    setTimeout(() => { document.title = originalTitle; }, 1000);
  };

  return (
    <div className="fixed inset-0 bg-black/50 z-50 overflow-y-auto py-8 px-4" id="pdf-preview-overlay">
      <div className="no-print flex items-center justify-between gap-2 mb-3 mx-auto" style={{ width: "880px", maxWidth: "880px" }}>
        <span className="text-xs text-white/90 bg-black/30 px-3 py-1.5 rounded-lg">{data.readOnly ? "🔒 조회 전용 — 수정할 수 없습니다" : "✏️ 텍스트를 클릭하면 바로 수정할 수 있습니다"}</span>
        <div className="flex items-center gap-2">
          {data.id && (
            data.sentBy ? (
              <span className="text-xs px-3 py-2 rounded-lg bg-emerald-50 text-emerald-700 font-medium whitespace-nowrap">
                [발송완료] {data.sentChannel || "-"} | {formatCreatedAt(data.sentAt)}
              </span>
            ) : (
              <span className="text-xs px-3 py-2 rounded-lg bg-slate-100 text-slate-500 font-medium whitespace-nowrap">[미발송]</span>
            )
          )}
          <button onClick={onClose} className="px-4 py-2 rounded-lg bg-white text-slate-600 text-sm font-medium hover:bg-slate-50">닫기</button>
          <button onClick={handlePrint} className="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">🖨 인쇄 / PDF로 저장</button>
          {onSendComplete && data.id && (
            <button onClick={() => setShowSendModal(true)} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:opacity-90">🚀 발송완료</button>
          )}
        </div>
      </div>
      {showSendModal && (
        <SendCompleteModal
          onClose={() => setShowSendModal(false)}
          onConfirm={(channel) => { onSendComplete(data.id, channel); setShowSendModal(false); }}
        />
      )}

      <div className="proposal-modal-content mx-auto bg-white shadow-xl p-10 text-sm" id="pdf-page" style={{ color: DARK, width: "880px", maxWidth: "880px" }}>
      <fieldset disabled={!!data.readOnly} className="contents" style={{ border: 0, margin: 0, padding: 0 }}>

        {/* 1) 대타이틀 + 로고 */}
        <div className="flex items-start justify-between border-b-2 pb-4 mb-5" style={{ borderColor: DARK }}>
          <h1 className="text-xl font-bold" style={{ color: DARK }}>{isInvoice ? "INVOICE" : "제품공급제안서"}</h1>
          <img src={supplierLogo || DEFAULT_LOGO} className="h-12 object-contain" />
        </div>

        {/* 2) 수신자 정보 & 공급자 정보 */}
        <div className="proposal-info-row flex justify-between items-start mb-5">
          <div className="text-sm" style={{ width: "48%" }}>
            <div className="font-semibold text-base mb-2 flex items-center gap-1" style={{ color: DARK }}>
              <EditField value={clientName} onChange={setClientName} placeholder="고객사명" className="font-semibold text-base" />
              <span>貴下</span>
            </div>
            <div style={{ color: DARK }}>제안금액: <b>{won(totalAmount)}</b> <span className="text-xs text-slate-500">(부가세 별도)</span></div>
            <div className="flex items-center gap-1 whitespace-nowrap" style={{ color: DARK }}>
              <span className="whitespace-nowrap">작성일자: {todayDisplay()}</span>
              <span className="text-xs text-slate-500 flex items-center gap-1 whitespace-nowrap">
                (유효기간: 30일, ~<EditField value={validUntil} onChange={setValidUntil} className="text-xs w-24" />)
              </span>
            </div>
          </div>
          <table className="pdf-supplier-table text-xs border border-slate-300" style={{ color: DARK, width: "48%", tableLayout: "fixed" }}>
            <colgroup>
              <col style={{ width: "60px" }} />
              <col style={{ width: "45%" }} />
              <col style={{ width: "44px" }} />
              <col />
            </colgroup>

function SourcingEditModal({ item, onClose, onSave }) {
  const [image, setImage] = useState(item.image || "");
  const [name, setName] = useState(item.name || "");
  const [rmbCost, setRmbCost] = useState(item.rmbCost || 0);
  const [quantity, setQuantity] = useState(item.quantity || 0);
  const [totalShippingRmb, setTotalShippingRmb] = useState(item.totalShippingRmb || 0);
  const [factory, setFactory] = useState(item.factory || "");
  const [factoryContact, setFactoryContact] = useState(item.factoryContact || "");
  const [wechatGroup, setWechatGroup] = useState(item.wechatGroup || "");
  const [link, setLink] = useState(item.link || "");
  const [factoryLink, setFactoryLink] = useState(item.factoryLink || "");
  const [spec, setSpec] = useState(item.spec || "");

  const save = () => {
    if (!name.trim()) return;
    const qty = Number(quantity) || 0;
    onSave(item.id, {
      image, name, rmbCost: Number(rmbCost) || 0, quantity: qty,
      totalShippingRmb: Number(totalShippingRmb) || 0,
      unitShippingRmb: qty > 0 ? (Number(totalShippingRmb) || 0) / qty : 0,
      factory, factoryContact, wechatGroup, link, factoryLink, spec,
    });
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-2xl overflow-hidden flex flex-col" style={{ maxHeight: "85vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">✏️ 가격조사 항목 수정</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          <Field label="제품 사진"><ImageUpload value={image} onChange={setImage} /></Field>
          <div className="grid grid-cols-2 gap-4 mt-4">
            <Field label="품명" span={2}><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} /></Field>
            <Field label="위안화 원가" hint="RMB/개"><input type="number" className={inputCls} value={rmbCost} onChange={(e) => setRmbCost(e.target.value)} /></Field>
            <Field label="수량" hint="개"><input type="number" className={inputCls} value={quantity} onChange={(e) => setQuantity(e.target.value)} /></Field>
            <Field label="중국 내 운송료" hint="총 RMB"><input type="number" className={inputCls} value={totalShippingRmb} onChange={(e) => setTotalShippingRmb(e.target.value)} /></Field>
            <Field label="위챗 단체방명"><input className={inputCls} value={wechatGroup} onChange={(e) => setWechatGroup(e.target.value)} /></Field>
            <Field label="공장명"><input className={inputCls} value={factory} onChange={(e) => setFactory(e.target.value)} /></Field>
            <Field label="공장 연락처"><input className={inputCls} value={factoryContact} onChange={(e) => setFactoryContact(e.target.value)} /></Field>
            <Field label="1688 링크" span={2}><input className={inputCls} value={link} onChange={(e) => setLink(e.target.value)} /></Field>
            <Field label="공장 홈페이지 링크" span={2}><input className={inputCls} value={factoryLink} onChange={(e) => setFactoryLink(e.target.value)} /></Field>
            <Field label="상세 스펙 / 비고" span={2}><AutoResizeTextarea value={spec} onChange={setSpec} minRows={3} /></Field>
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">✓ 수정 반영</button>
        </div>
      </div>
    </div>
  );
}

function SourcingStage({ items, onAdd, onUpdateItem, onDeleteItem, onSend, onSendBulk, products, pickedProduct, onConsumePicked, currentUserName }) {
  const [sourcingFilter, setSourcingFilter] = useState("mine"); // mine=내 조사건(기본) | others=직원 조사건 | all=전체 조사건
  const [editingSourcingItem, setEditingSourcingItem] = useState(null);
  const [image, setImage] = useState("");
  const [name, setName] = useState("");
  const [rmbCost, setRmbCost] = useState("");
  const [quantity, setQuantity] = useState("");
  const [totalShippingRmb, setTotalShippingRmb] = useState("");
  const [factory, setFactory] = useState("");
  const [factoryContact, setFactoryContact] = useState("");
  const [wechatGroup, setWechatGroup] = useState("");
  const [link, setLink] = useState("");
  const [factoryLink, setFactoryLink] = useState("");
  const [spec, setSpec] = useState("");
  const [category, setCategory] = useState(""); // 기존 제품 DB에서 불러온 제품의 카테고리(제안가 계산 화면으로 넘어갈 때 그대로 반영됨)
  const [selected, setSelected] = useState([]);
  const [productSearch, setProductSearch] = useState("");
  const [showProductPicker, setShowProductPicker] = useState(false);
  const [showRmbPicker, setShowRmbPicker] = useState(false);
  const [rmbPickerPos, setRmbPickerPos] = useState({ top: 0, left: 0 });
  const rmbInputRef = useRef(null);
  const openRmbPicker = () => {
    if (rmbInputRef.current) {
      const rect = rmbInputRef.current.getBoundingClientRect();
      setRmbPickerPos({ top: rect.bottom + 4, left: rect.left });
    }
    setShowRmbPicker(true);
  };

  const rmbPickerRows = (products || [])
    .filter((p) => name.trim() && (p.name || "").toLowerCase().includes(name.trim().toLowerCase()))
    .flatMap((p) => {
      const tiers = (p.priceTiers && p.priceTiers.length > 0) ? p.priceTiers : [{ qty: "", cbm: "", shippingRmb: "", factoryPriceRmb: p.rmbCost || "" }];
      return tiers.map((tier) => ({
        product: p,
        qty: tier.qty,
        cbm: tier.cbm,
        rmbCost: tier.factoryPriceRmb,
        shippingRmb: tier.shippingRmb,
        factory: p.factory || "",
        wechatGroup: p.wechatGroup || "",
      }));
    })
    .filter((r) => r.rmbCost !== "" && r.rmbCost !== undefined);

  const pickFromRmbPicker = (row) => {
    pickProduct(row.product);
    if (row.qty) setQuantity(row.qty);
    if (row.rmbCost) setRmbCost(row.rmbCost);
    if (row.shippingRmb) setTotalShippingRmb(row.shippingRmb);
    if (row.cbm) setSpec((prev) => (prev ? prev + `\n예상 CBM: ${row.cbm}` : `예상 CBM: ${row.cbm}`));
    setShowRmbPicker(false);
  };

  const productMatches = smartProductSearch(products, productSearch);

  const pickProduct = (p) => {
    setName(p.name || "");
    setImage(p.image || "");
    setSpec([p.specSize ? `사이즈: ${p.specSize}` : "", p.material ? `재질: ${p.material}` : ""].filter(Boolean).join("\n"));
    setCategory(p.category || ""); // 불러온 제품의 카테고리를 그대로 캡처 — 나중에 제안가 계산 화면으로 넘어갈 때 자동 반영됨
    setFactory(p.factory || "");
    setWechatGroup(p.wechatGroup || "");
    setFactoryLink(p.factoryLink || "");
    if (p.rmbCost) setRmbCost(p.rmbCost);
    if (p.totalShippingRmb) setTotalShippingRmb(p.totalShippingRmb);
    if (p.moqQuantity) setQuantity(p.moqQuantity); // 박스히어로 "(K)최소제작수량" 파싱값을 수량 기본값으로 자동 반영
    setShowProductPicker(false);
    setProductSearch("");
  };

  useEffect(() => {
    if (pickedProduct) {
      pickProduct(pickedProduct);
      if (onConsumePicked) onConsumePicked();
    }
  }, [pickedProduct]);

  const unitShippingPreview = Number(quantity) > 0 ? Number(totalShippingRmb || 0) / Number(quantity) : 0;

  const submit = () => {
    if (!name.trim() || !rmbCost) return;
    const qty = Number(quantity) || 0;
    onAdd({
      id: Date.now(), image, name, rmbCost: Number(rmbCost), quantity: qty,
      totalShippingRmb: Number(totalShippingRmb) || 0,
      unitShippingRmb: qty > 0 ? (Number(totalShippingRmb) || 0) / qty : 0,
      factory, factoryContact, wechatGroup, link, factoryLink, spec, category,
    });
    setImage(""); setName(""); setRmbCost(""); setQuantity(""); setTotalShippingRmb("");
    setFactory(""); setFactoryContact(""); setWechatGroup(""); setLink(""); setFactoryLink(""); setSpec(""); setCategory("");
  };

  const toggle = (id) => setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  const filteredItems = useMemo(() => items.filter((it) => {
    if (sourcingFilter === "mine") return it.createdBy === currentUserName;
    if (sourcingFilter === "others") return it.createdBy && it.createdBy !== currentUserName;
    return true;
  }), [items, sourcingFilter, currentUserName]);
  const allChecked = filteredItems.length > 0 && selected.length === filteredItems.length;
  const toggleAll = () => setSelected(allChecked ? [] : filteredItems.map((i) => i.id));
  const sendSelected = () => {
    const chosen = filteredItems.filter((i) => selected.includes(i.id));
    if (chosen.length === 0) return;
    onSendBulk(chosen);
    setSelected([]);
  };
  useEffect(() => { setSelected([]); }, [sourcingFilter]);

  return (
    <main className="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
      {editingSourcingItem && (
        <SourcingEditModal item={editingSourcingItem} onClose={() => setEditingSourcingItem(null)}
          onSave={(id, patch) => { onUpdateItem(id, patch); setEditingSourcingItem(null); }} />
      )}
      <div className="space-y-6">
        <div className="text-xs font-semibold text-slate-400 tracking-wide px-1">1단계 · 가격조사 등록</div>
        <Card title="신규 가격조사 건 등록">
          <div className="mb-4 pb-4 border-b border-dashed border-slate-200">
            <button
              type="button" onClick={() => setShowProductPicker((v) => !v)}
              className="w-full flex items-center justify-between px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50"
            >
              <span>🔍 기존 제품 DB에서 불러오기</span>

function HistoryBadge({ record, compact }) {
  const [show, setShow] = useState(false);
  if (!record || (!record.createdAt && !record.updatedAt)) return null;
  return (
    <div className="relative inline-block">
      <button onClick={() => setShow((v) => !v)} onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}
        title="수정 이력"
        className={compact ? "text-xs w-8 h-8 flex items-center justify-center rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50" : "text-xs px-2 py-1 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 whitespace-nowrap"}>
        {compact ? "📜" : "📜 수정 이력"}

      {show && (
        <div className="absolute z-30 top-full right-0 mt-1 w-72 bg-white border border-slate-300 rounded-lg shadow-xl p-3 text-xs space-y-1.5" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
          <div><span className="text-slate-400">최초 생성:</span> <b className="text-slate-700">{record.createdAt || "-"}</b>{record.createdBy ? ` (작성자: ${record.createdBy})` : ""}</div>
          <div><span className="text-slate-400">최근 수정:</span> <b className="text-slate-700">{record.updatedAt || "수정 이력 없음"}</b>{record.updatedBy ? ` (수정자: ${record.updatedBy})` : ""}</div>
        </div>
      )}
    </div>
  );
}

      if (field === "quantity" || field === "unitPrice") {
        const q = field === "quantity" ? Number(value) || 0 : it.quantity;
        const p = field === "unitPrice" ? Number(value) || 0 : it.unitPrice;
        next.quantity = q; next.unitPrice = p; next.totalPrice = q * p;
      }
      return next;
    }));

  const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
  const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);

    <main className="max-w-5xl mx-auto px-6 py-8 pb-28">

              <span className="text-slate-500">총 CBM <b className="text-slate-700">{totalCbm}</b></span>

      </Card>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-2px_8px_rgba(0,0,0,0.04)] no-print">

function ExcelArchiveView({ archive, onBack, onUpload, onUploadZip, onApplyAll, onDelete, onApply, onResetExcelData, onDeleteAllUploaded, onDedupe, onBulkDelete }) {
  const [busy, setBusy] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);
  const [page, setPage] = useState(1);
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const PAGE_SIZE = 20;

  const sortedArchive = useMemo(() => sortByKey(archive, sortKey, (a) => a.fileName, (a) => a.uploadedAt), [archive, sortKey]);
  const totalPages = Math.max(1, Math.ceil(sortedArchive.length / PAGE_SIZE));
  const pagedArchive = sortedArchive.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { if (page > totalPages) setPage(totalPages); }, [totalPages]);
  useEffect(() => { setSelectedIds([]); }, [page, sortKey]);
  const allPagedSelected = pagedArchive.length > 0 && pagedArchive.every((a) => selectedIds.includes(a.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : pagedArchive.map((a) => a.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  const processFile = async (file) => {
    if (!file) return;
    setBusy(true);
    try {
      if (/\.zip$/i.test(file.name)) await onUploadZip(file);
      else await onUpload(file);
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  };

  const handleFile = async (e) => { await processFile(e.target.files && e.target.files[0]); };
  const handleDrop = async (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    await processFile(file);
  };

  const download = (item) => {
    if (!item.fileData) { alert("이 파일은 용량이 커서 원본이 보관되지 않았습니다. (자동 분석된 데이터는 정상적으로 반영되어 있습니다)"); return; }
    const a = document.createElement("a");
    a.href = item.fileData;
    a.download = item.fileName;
    a.click();
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">📂 엑셀 보관함 (데이터룸)</h2>
        <div className="flex gap-2 items-center flex-wrap">
          <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]">
            {SORT_OPTIONS_COMMON.map(([k, label]) => <option key={k} value={k}>정렬: {label}</option>)}
          </select>
          {onApplyAll && <button onClick={onApplyAll} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">🔗 전체 파이프라인 적용</button>}
          {onDedupe && <button onClick={onDedupe} title="파일명이 같은 중복 항목을 찾아 파일명당 1건(적용완료/최신 우선)만 남기고 정리합니다" className="px-4 py-2 rounded-lg border border-amber-200 text-amber-700 bg-amber-50 text-sm font-medium hover:bg-amber-100 whitespace-nowrap">🧹 중복 파일 정리</button>}
          {onBulkDelete && (
            <React.Fragment>
              <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer whitespace-nowrap">
                <input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /> 전체 선택
              </label>
              <button
                onClick={async () => { await onBulkDelete(selectedIds); setSelectedIds([]); }}
                disabled={selectedIds.length === 0}
                className="text-xs px-3 py-2 rounded-lg border border-red-200 text-red-600 font-medium hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
              >
                🗑️ 선택 삭제 ({selectedIds.length}개)
              </button>
            </React.Fragment>
          )}
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={handleDrop}
        className={"bg-white border shadow-sm rounded-xl p-4 mb-6 transition-colors " + (dragOver ? "border-[#1E3A8A] bg-[#1E3A8A]/5" : "border-slate-300")}
      >
        <p className="text-xs text-slate-500 mb-3">
          견적 엑셀 파일(.xlsx) 또는 여러 엑셀을 묶은 ZIP 압축파일을 업로드(또는 이 영역에 드래그앤드롭)하면 '가격조사'/'제안가격'/'제안서(원화)' 시트를 자동으로 분석해서
          업체·공장·제품·제안서 목록에 <b>업로드 시 1회만</b> 자동 등록됩니다. ZIP 안에 PDF 등 다른 파일이 섞여 있어도 .xlsx만 골라서 처리합니다. "🔗 파이프라인 적용"을 처음 누르면 공장 홈페이지링크·제품 수량별 단가 등도 함께 심층 반영되고, 이후에는 데이터를 3단계로 다시 불러오기만 합니다.
        </p>
        <button onClick={() => fileRef.current && fileRef.current.click()} disabled={busy} className="text-sm px-4 py-2 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 disabled:opacity-50 whitespace-nowrap">
          {busy ? "분석 중..." : "📥 견적 엑셀/ZIP 업로드 (.xlsx, .zip)"}
        </button>
        <span className="text-xs text-slate-400 ml-2">또는 이 영역에 파일을 끌어다 놓으세요</span>
        <input ref={fileRef} type="file" accept=".xlsx,.zip" className="hidden" onChange={handleFile} />
      </div>

      {archive.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">아직 보관된 엑셀 파일이 없습니다.</div>
      ) : (
        <div className="bg-white border border-slate-300 shadow-sm rounded-xl overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              {onBulkDelete && <th className="text-center px-2 py-3 font-medium"><input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /></th>}
              <th className="text-left px-4 py-3 font-medium">파일명</th>
              <th className="text-left px-4 py-3 font-medium">업로드 일시</th>
              <th className="text-left px-4 py-3 font-medium">거래처명</th>
              <th className="text-right px-4 py-3 font-medium">총 금액</th>
              <th className="text-right px-4 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {pagedArchive.map((item, idx) => (
                <tr key={item.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  {onBulkDelete && <td className="px-2 py-3 text-center"><input type="checkbox" checked={selectedIds.includes(item.id)} onChange={() => toggleSelectOne(item.id)} /></td>}
                  <td className="px-4 py-3 font-medium" style={{ color: "#111827" }}>
                    {item.fileName}
                    <div className="text-xs text-slate-400 font-normal mt-0.5">품목 {item.itemCount || 0}건</div>
                  </td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{item.uploadedAt}</td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{item.clientName}</td>
                  <td className="px-4 py-3 text-right font-semibold whitespace-nowrap" style={{ color: "#1E293B" }}>{won(item.totalAmount)}</td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <div className="flex gap-1.5 justify-end">
                      <button onClick={() => onApply(item)} className={"text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap font-medium " + (item.pipelineApplied ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-[#1E3A8A] text-white hover:opacity-90")}>
                        {item.pipelineApplied ? "✅ 적용 완료" : "🔗 파이프라인 적용"}
                      </button>
                      <button onClick={() => download(item)} className="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 whitespace-nowrap">⬇ 다운로드</button>
                      <button onClick={() => onDelete(item)} className="text-xs px-2.5 py-1.5 rounded-lg border border-red-100 text-red-500 hover:bg-red-50">🗑️ 삭제</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={sortedArchive.length} />
    </main>
  );
}

function ClientFormModal({ client, onClose, onSave }) {
  const isEdit = !!(client && client.id);
  const [name, setName] = useState((client && client.name) || "");
  const [contact, setContact] = useState((client && client.contact) || "");
  const [channel, setChannel] = useState((client && client.channel) || "카카오채널");
  const [difficulty, setDifficulty] = useState((client && client.difficulty) || "표준");
  const [note, setNote] = useState((client && client.note) || "");
  const save = () => {
    if (!name.trim()) return;
    if (isEdit) onSave(client.id, { name, contact, channel, difficulty, note });
    else onSave(null, { id: Date.now(), name, contact, channel, difficulty, note });
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden">
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">{isEdit ? "✏️ 업체 정보 수정" : "➕ 신규 업체 등록"}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 grid grid-cols-2 gap-4">
          <Field label="업체명" span={2}><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 주식회사 닥터스칼프" /></Field>
          <Field label="담당자"><input className={inputCls} value={contact} onChange={(e) => setContact(e.target.value)} placeholder="담당자명" /></Field>
          <Field label="채널">
            <select className={inputCls} value={channel} onChange={(e) => setChannel(e.target.value)}><option>카카오채널</option><option>이메일</option><option>전화</option></select>
          </Field>
          <Field label="작업 난이도" span={2}>
            <select className={inputCls} value={difficulty} onChange={(e) => setDifficulty(e.target.value)}>
              {CLIENT_DIFFICULTY_LEVELS.map((l) => <option key={l} value={l}>{l}</option>)}
            </select>
          </Field>
          <Field label="특이사항" span={2}><AutoResizeTextarea value={note} onChange={setNote} minRows={2} placeholder="업체별 특징, 주의사항 등 자유 메모" /></Field>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">{isEdit ? "✓ 수정 반영" : "＋ 업체 등록"}</button>
        </div>
      </div>
    </div>
  );
}

// 범용 "선택 항목 병합" 모달 — 공장병합(FactoryMergeModal)과 동일한 패턴을 제품/업체에도 재사용
// 인보이스 발행 전 편집 단계 — 제안서 품목별로 수량/단가를 다시 확인하고, 카테고리별 후가공 옵션을 체크박스로 다시 선택할 수 있다.
// (2단계 계산화면의 전체 원가계산 엔진까지는 재사용하지 않고, "후가공 재선택 + 수량/단가 조정"에 집중한 경량 편집 단계)
function InvoiceEditModal({ proposal, finishingOptions, onCancel, onConfirm }) {
  const [items, setItems] = useState(() => (proposal.items || []).map((it) => ({ ...it, id: it.id || Date.now() + Math.random(), selectedFinishingIds: [] })));

  const updateItem = (id, patch) => setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
  const removeItem = (id) => setItems((prev) => prev.filter((it) => it.id !== id));
  // "품목 추가" — 제안서에 없던 항목도 인보이스에서만 자유롭게 새로 넣을 수 있다(원본 제안서는 절대 안 건드림)
  const addItem = () => setItems((prev) => [...prev, {
    id: Date.now() + Math.random(), image: "", productName: "", specSize: "", material: "", category: "",
    quantity: 0, unitPrice: 0, totalPrice: 0, notes: "", selectedFinishingIds: [],
  }]);

  // 체크/해제할 때마다 해당 항목의 "비고"란 맨 앞부분에 선택된 후가공 목록을 다시 구성해 넣는다(기존 비고의 나머지 문구는 보존)
  const toggleFinishing = (item, opt) => {
    const already = item.selectedFinishingIds.includes(opt.id);
    const nextIds = already ? item.selectedFinishingIds.filter((id) => id !== opt.id) : [...item.selectedFinishingIds, opt.id];
    const options = finishingOptions[item.category] || [];
    const chosen = options.filter((o) => nextIds.includes(o.id));
    const finishingLines = chosen.map((o) => `${o.name}: ${(o.krwPrice || 0).toLocaleString("ko-KR")}원${o.unitLabel ? `/${o.unitLabel}` : ""}`);
    const restNotes = (item.notes || "").split("\n").filter((line) => !options.some((o) => line.startsWith(`${o.name}:`))).join("\n");
    const nextNotes = [...finishingLines, restNotes].filter(Boolean).join("\n");
    updateItem(item.id, { selectedFinishingIds: nextIds, notes: nextNotes });
  };

  // 인보이스 화면에서도 부가세·계약금(30%)·잔금(70%)이 실시간으로 어떻게 나올지 바로 보여준다(최종 미리보기와 동일한 계산식)
  const totalAmount = items.reduce((s, it) => s + (Number(it.totalPrice) || 0), 0);
  const vat = Math.round(totalAmount * 0.1);
  const grandTotal = totalAmount + vat;
  const depositAmount = Math.round(grandTotal * 0.3);
  const balanceAmount = grandTotal - depositAmount;

  return (
    <div className="fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4">
      <div className="bg-white rounded-xl w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col">
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 className="text-base font-bold text-slate-800">📄 인보이스 작성 — {proposal.clientName}</h2>
            <p className="text-xs text-slate-400 mt-0.5">여기서 아무리 수정해도 3단계 원본 제안서는 전혀 바뀌지 않습니다(완전히 독립된 사본입니다).</p>
          </div>
          <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1 space-y-4">
          {items.map((it) => {
            const options = finishingOptions[it.category] || [];
            return (
              <div key={it.id} className="border border-slate-200 rounded-xl p-4">
                <div className="flex items-start gap-3 mb-3">
                  <div className="shrink-0">
                    <div className="text-[10px] text-slate-400 mb-1">실물 사진 교체</div>
                    <ImageUpload value={it.image} onChange={(v) => updateItem(it.id, { image: v })} />
                  </div>
                  <div className="min-w-0 flex-1 grid grid-cols-3 gap-2">
                    <Field label="제품명" span={3}><input className={inputCls} value={it.productName} onChange={(e) => updateItem(it.id, { productName: e.target.value })} /></Field>
                    <Field label="사이즈"><input className={inputCls} value={it.specSize || ""} onChange={(e) => updateItem(it.id, { specSize: e.target.value })} /></Field>
                    <Field label="재질"><input className={inputCls} value={it.material || ""} onChange={(e) => updateItem(it.id, { material: e.target.value })} /></Field>
                    <Field label="카테고리(후가공 목록 기준)">
                      <select className={inputCls} value={it.category || ""} onChange={(e) => updateItem(it.id, { category: e.target.value })}>
                        <option value="">선택 안 함</option>
                        {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </Field>
                  </div>
                  <button onClick={() => removeItem(it.id)} title="이 품목 삭제" className="shrink-0 w-8 h-8 rounded-lg border border-red-100 text-red-500 hover:bg-red-50 text-sm">🗑️</button>
                </div>
                <div className="grid grid-cols-3 gap-3 mb-3">
                  <Field label="수량"><input type="number" className={inputCls} value={it.quantity} onChange={(e) => { const q = Number(e.target.value) || 0; updateItem(it.id, { quantity: q, totalPrice: q * (Number(it.unitPrice) || 0) }); }} /></Field>
                  <Field label="단가(개당)"><input type="number" className={inputCls} value={it.unitPrice} onChange={(e) => { const u = Number(e.target.value) || 0; updateItem(it.id, { unitPrice: u, totalPrice: (Number(it.quantity) || 0) * u }); }} /></Field>
                  <Field label="금액(합계)"><input disabled className={inputCls + " bg-slate-50 text-slate-500"} value={Math.round(it.totalPrice || 0).toLocaleString("ko-KR")} /></Field>
                </div>
                {options.length > 0 ? (
                  <div>
                    <div className="text-xs font-medium text-slate-500 mb-1.5">후가공 선택 ({it.category})</div>
                    <div className="flex flex-wrap gap-1.5">
                      {options.map((opt) => (
                        <label key={opt.id} className={"flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg border cursor-pointer " + (it.selectedFinishingIds.includes(opt.id) ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "border-slate-200 text-slate-600")}>
                          <input type="checkbox" className="hidden" checked={it.selectedFinishingIds.includes(opt.id)} onChange={() => toggleFinishing(it, opt)} />
                          {opt.name} ({(opt.krwPrice || 0).toLocaleString("ko-KR")}원{opt.unitLabel ? `/${opt.unitLabel}` : ""})
                        </label>
                      ))}
                    </div>
                  </div>
                ) : (
                  <p className="text-xs text-slate-300">이 카테고리에 등록된 후가공 항목이 없습니다.</p>
                )}
                <Field label="비고" span={2}><textarea className={inputCls} rows={2} value={it.notes || ""} onChange={(e) => updateItem(it.id, { notes: e.target.value })} /></Field>
              </div>
            );
          })}
          <button onClick={addItem} className="w-full text-xs py-2.5 rounded-lg border-2 border-dashed border-slate-200 text-slate-500 hover:border-[#1E3A8A] hover:text-[#1E3A8A] font-medium">➕ 품목 추가</button>

          <div className="bg-slate-50 rounded-xl p-4 text-xs space-y-1.5">
            <div className="font-semibold text-slate-600 mb-1">💰 실시간 정산 요약</div>
            <div className="flex justify-between"><span className="text-slate-500">① 공급가액 합계</span><span className="font-medium">{Math.round(totalAmount).toLocaleString("ko-KR")}원</span></div>
            <div className="flex justify-between"><span className="text-slate-500">② 부가가치세 (10%)</span><span className="font-medium">{vat.toLocaleString("ko-KR")}원</span></div>
            <div className="flex justify-between border-t border-slate-200 pt-1.5"><span className="text-slate-700 font-semibold">③ 총 합계금액 (①+②)</span><span className="font-bold text-[#1E3A8A]">{grandTotal.toLocaleString("ko-KR")}원</span></div>
            <div className="flex justify-between"><span className="text-slate-500">④ 계약금 청구금액 (30%)</span><span className="font-medium">{depositAmount.toLocaleString("ko-KR")}원</span></div>
            <div className="flex justify-between"><span className="text-slate-500">⑤ 잔금 청구금액 (70%)</span><span className="font-medium">{balanceAmount.toLocaleString("ko-KR")}원</span></div>
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex items-center justify-between shrink-0">
          <span className="text-sm text-slate-500">품목 합계: <b className="text-[#1E3A8A]">{Math.round(totalAmount).toLocaleString("ko-KR")}원</b></span>
          <div className="flex gap-2">
            <button onClick={onCancel} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
            <button onClick={() => onConfirm(items)} className="px-5 py-2 rounded-lg bg-purple-600 text-white text-sm font-medium hover:opacity-90">확정하고 인보이스 미리보기 →</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function GenericMergeModal({ title, items, getLabel, getSubLabel, confirmText, onRun, onClose }) {
  const [primaryId, setPrimaryId] = useState(items[0] && items[0].id);
  const run = () => {
    if (!primaryId) return;
    if (!window.confirm(confirmText)) return;
    onRun(items, primaryId);
    onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-md overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">{title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3">
          <p className="text-xs text-slate-500">대표 항목으로 사용할 1개를 선택해주세요. 나머지는 삭제되고, 연결된 데이터는 전부 대표 항목으로 옮겨집니다.</p>
          <div className="space-y-2 max-h-72 overflow-y-auto">
            {items.map((it) => (
              <label key={it.id} className={"flex items-center gap-2.5 px-3 py-2.5 rounded-lg border cursor-pointer " + (primaryId === it.id ? "border-[#1E3A8A] bg-[#1E3A8A]/5" : "border-slate-200")}>
                <input type="radio" name="primaryMergeItem" checked={primaryId === it.id} onChange={() => setPrimaryId(it.id)} />
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-800 truncate">{getLabel(it)}</div>
                  {getSubLabel && <div className="text-xs text-slate-400 truncate">{getSubLabel(it)}</div>}
                </div>
              </label>
            ))}
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={run} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">병합 실행</button>
        </div>
      </div>
    </div>
  );
}

function ClientsView({ clients, proposals, onBack, onAdd, onUpdate, onDelete, onOpenProposal, onBulkDelete, onMergeClients, isAdmin }) {
  const [openClient, setOpenClient] = useState(null);
  const [search, setSearch] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingClient, setEditingClient] = useState(null);
  const [page, setPage] = useState(() => (parseKoreanHash().view === "업체관리" ? parseKoreanHash().page : 1));
  useHashPageSync("업체관리", page);
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const [keyClientFilter, setKeyClientFilter] = useState(false); // true면 ⭐주거래업체만 모아보기
  const [showClientMergeModal, setShowClientMergeModal] = useState(false);
  const PAGE_SIZE = 20;

  // 업체명이 동일한 중복 레코드를 하나로 병합 — 대표 카드는 먼저 등록된 값을 기준으로 하되 비어있는 필드는 나중 레코드 값으로 보강,
  // _mergedIds에 병합된 모든 원본 id를 모아두어 견적이력 합산·일괄삭제에 사용
  const mergedClients = useMemo(() => {
    const map = new Map();
    clients.forEach((c) => {
      const key = (c.name || "").trim();
      if (!key) { map.set("__unnamed_" + c.id, { ...c, _mergedIds: [c.id] }); return; }
      const existing = map.get(key);
      if (!existing) {
        map.set(key, { ...c, _mergedIds: [c.id] });
      } else {
        map.set(key, {
          ...existing,
          contact: existing.contact || c.contact,
          channel: existing.channel || c.channel,
          difficulty: existing.difficulty || c.difficulty,
          note: existing.note || c.note,
          source: existing.source || c.source,
          isKeyClient: existing.isKeyClient || c.isKeyClient,
          _mergedIds: [...existing._mergedIds, c.id],
        });
      }
    });
    return Array.from(map.values());
  }, [clients]);

  const filtered = useMemo(() => {
    const base = mergedClients.filter((c) => {
      if (keyClientFilter && !c.isKeyClient) return false;
      return !search.trim() || (c.name || "").toLowerCase().includes(search.trim().toLowerCase()) || (c.contact || "").toLowerCase().includes(search.trim().toLowerCase());
    });
    return sortByKey(base, sortKey, (c) => c.name, (c) => c.createdAt);
  }, [mergedClients, search, sortKey, keyClientFilter]);

  useEffect(() => { setPage(1); }, [search, sortKey, keyClientFilter]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedClients = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { setSelectedIds([]); }, [page, search, sortKey, keyClientFilter]);
  const allPagedSelected = pagedClients.length > 0 && pagedClients.every((c) => selectedIds.includes(c.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : pagedClients.map((c) => c.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  return (
    <main className="max-w-6xl mx-auto px-6 py-8">
      {showForm && <ClientFormModal onClose={() => setShowForm(false)} onSave={(id, c) => { onAdd(c); setShowForm(false); }} />}
      {editingClient && <ClientFormModal client={editingClient} onClose={() => setEditingClient(null)} onSave={(id, patch) => { onUpdate(id, patch); setEditingClient(null); }} />}
      {showClientMergeModal && onMergeClients && (
        <GenericMergeModal
          title="🔗 선택 업체 병합"
          items={mergedClients.filter((c) => selectedIds.includes(c.id))}
          getLabel={(c) => c.name}
          getSubLabel={(c) => `${c.channel || ""} · 견적이력 ${proposals.filter((p) => p.clientName === c.name).length}건`}
          confirmText={`선택한 ${selectedIds.length}개 업체를 대표 고객사 1개로 병합할까요? 나머지 업체는 삭제되고, 관련 제안서/샘플 데이터는 전부 대표 고객사로 이전됩니다.`}
          onRun={async (items, primaryId) => { await onMergeClients(items, primaryId); setSelectedIds([]); }}
          onClose={() => setShowClientMergeModal(false)}
        />
      )}
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">🏢 업체(고객사) 관리</h2>
        <div className="flex gap-2 items-center flex-wrap">
          <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]">
            {SORT_OPTIONS_COMMON.map(([k, label]) => <option key={k} value={k}>정렬: {label}</option>)}
          </select>
          {onBulkDelete && (
            <React.Fragment>
              <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer whitespace-nowrap">
                <input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /> 전체 선택
              </label>
              <button
                onClick={async () => { await onBulkDelete(pagedClients.filter((c) => selectedIds.includes(c.id))); setSelectedIds([]); }}
                disabled={selectedIds.length === 0}
                className="text-xs px-3 py-2 rounded-lg border border-red-200 text-red-600 font-medium hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
              >
                🗑️ 선택 삭제 ({selectedIds.length}개)
              </button>
              {onMergeClients && (
                <button
                  onClick={() => setShowClientMergeModal(true)}
                  disabled={selectedIds.length < 2}
                  title={selectedIds.length < 2 ? "병합하려면 업체를 2개 이상 선택해주세요" : ""}
                  className="text-xs px-3 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] font-medium hover:bg-[#1E3A8A]/5 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
                >
                  🔗 선택 업체 병합 ({selectedIds.length}개)
                </button>
              )}
            </React.Fragment>
          )}
          <button onClick={() => setShowForm(true)} className="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">➕ 신규 업체 등록</button>
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div className="flex gap-1.5 mb-3">
        <button onClick={() => setKeyClientFilter(false)} className={"text-xs px-3 py-1.5 rounded-full font-medium " + (!keyClientFilter ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>전체 업체</button>
        <button onClick={() => setKeyClientFilter(true)} className={"text-xs px-3 py-1.5 rounded-full font-medium " + (keyClientFilter ? "bg-amber-400 text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>⭐ 주거래업체</button>
      </div>
      <input
        value={search} onChange={(e) => setSearch(e.target.value)}
        placeholder="🔍 업체명 또는 담당자 검색"
        className="w-full mb-4 px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
      />

      <div className="space-y-3">
        {filtered.length === 0 && <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">{clients.length === 0 ? "등록된 업체가 없습니다. (제안서를 저장하면 거래한 업체가 자동으로도 등록됩니다)" : "검색 결과가 없습니다."}</div>}
        {pagedClients.map((c) => {
          const history = proposals.filter((p) => p.clientName === c.name).sort((a, b) => (parseCreatedAt(b.createdAt) || 0) - (parseCreatedAt(a.createdAt) || 0));
          const difficulty = c.difficulty || "표준";
          return (
            <div key={c.id} className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm">
              <div className="w-full flex items-center gap-2 px-5 py-4 hover:bg-slate-50">
                {onBulkDelete && <input type="checkbox" checked={selectedIds.includes(c.id)} onChange={() => toggleSelectOne(c.id)} className="shrink-0" />}
                <button onClick={() => setOpenClient(openClient === c.id ? null : c.id)} className="flex-1 flex items-center justify-between text-left min-w-0">
                <div className="text-left flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-slate-800 text-sm text-left">{c.name}</span>
                    <span className={"text-[10px] px-2 py-0.5 rounded-full font-medium " + DIFFICULTY_BADGE_STYLE[difficulty]}>{difficulty}</span>
                    {c.isKeyClient && <span className="text-[10px] px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700">⭐ 주거래</span>}
                    {c._mergedIds && c._mergedIds.length > 1 && <span className="text-[10px] px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-500" title="중복 등록된 동일 업체명을 하나로 병합해 표시 중">🔗 중복 {c._mergedIds.length}건 병합</span>}
                  </div>
                  <div className="text-xs text-slate-500 mt-0.5 text-left">{c.contact && `담당 ${c.contact} · `}{c.channel} · 견적이력 {history.length}건</div>
                  {c.note && <div className="text-xs text-slate-400 mt-0.5 text-left">📝 {c.note}</div>}
                </div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="text-xs text-slate-400">{openClient === c.id ? "접기 ▲" : "펼치기 ▼"}</span>
                  <span onClick={(e) => { e.stopPropagation(); onUpdate(c.id, { isKeyClient: !c.isKeyClient }); }} title={c.isKeyClient ? "주거래업체 해제" : "주거래업체로 지정"} className={"text-xs cursor-pointer " + (c.isKeyClient ? "text-amber-500 hover:text-amber-600" : "text-slate-300 hover:text-amber-400")}>{c.isKeyClient ? "⭐ 주거래" : "☆ 주거래지정"}</span>
                  <span onClick={(e) => { e.stopPropagation(); setEditingClient(c); }} className="text-xs text-slate-500 hover:text-[#1E3A8A]">✏️ 수정</span>
                  {isAdmin && <span onClick={(e) => { e.stopPropagation(); onDelete(c); }} className="text-xs text-red-400 hover:text-red-600">삭제</span>}
                </div>
                </button>
              </div>
              {openClient === c.id && (
                <div className="border-t border-slate-100 px-5 py-3">
                  {history.length === 0 ? (
                    <p className="text-xs text-slate-400 py-2">아직 견적 이력이 없습니다.</p>
                  ) : (
                    <table className="w-full text-xs">
                      <thead><tr className="text-slate-400 border-b border-slate-100"><th className="text-left py-1.5">제안번호</th><th className="text-left py-1.5">발송일시</th><th className="text-left py-1.5">품목</th><th className="text-right py-1.5">금액</th><th className="text-left py-1.5">상태</th></tr></thead>
                      <tbody>
                        {history.map((p) => (
                          <tr key={p.id} className="border-b border-slate-50">
                            <td className="py-1.5">
                              <button onClick={() => onOpenProposal(p)} className="text-[#1D4ED8] hover:underline font-medium" title="클릭하면 제안서 상세 내역을 조회 전용으로 확인할 수 있습니다">{p.code}</button>
                            </td>
                            <td className="py-1.5 text-slate-500">{formatCreatedAt(p.createdAt)}</td>
                            <td className="py-1.5">{p.itemSummary}</td>
                            <td className="py-1.5 text-right font-medium">{won(p.totalAmount)}</td>
                            <td className="py-1.5"><span className={"text-[10px] px-1.5 py-0.5 rounded-full " + (STATUS_COLORS[p.status] || "bg-slate-100")}>{p.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );
}

/* ===================== 공장(OEM) 관리 ===================== */

function Pagination({ page, totalPages, onChange, totalItems }) {
  if (totalPages <= 1 && !totalItems) return null;
  const BLOCK_SIZE = 10; // 한 블록에 보여줄 페이지 번호 개수(기존 5개 → 10개로 확대)
  const blockStart = Math.floor((page - 1) / BLOCK_SIZE) * BLOCK_SIZE + 1;
  const blockEnd = Math.min(totalPages, blockStart + BLOCK_SIZE - 1);
  const pages = [];
  for (let i = blockStart; i <= blockEnd; i++) pages.push(i);
  return (
    <div className="flex flex-wrap items-center justify-between gap-3 bg-blue-50 rounded-xl px-4 py-3 mt-2">
      <span className="text-sm font-medium" style={{ color: "#1E293B" }}>
        총 <b style={{ color: "#111827" }}>{(totalItems || 0).toLocaleString("ko-KR")}</b>건 · {page}/{totalPages} 페이지
      </span>
      <div className="flex items-center gap-1.5">
        <button onClick={() => onChange(1)} disabled={page === 1} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }} title="맨 처음으로">⏮️ 맨 처음으로</button>
        {/* "← 이전"/"다음 →"은 한 칸씩이 아니라 블록(10페이지) 단위로 이동 — 이전 블록 마지막 페이지 / 다음 블록 첫 페이지로 점프 */}
        <button onClick={() => onChange(Math.max(1, blockStart - 1))} disabled={blockStart === 1} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }}>← 이전</button>
        {blockStart > 1 && <span className="px-1 text-slate-400">…</span>}
        {pages.map((p) => (
          <button key={p} onClick={() => onChange(p)} className={"w-9 h-9 rounded-lg text-sm font-semibold " + (p === page ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-300 hover:bg-slate-50")} style={p === page ? {} : { color: "#1E293B" }}>{p}</button>
        ))}
        {blockEnd < totalPages && <span className="px-1 text-slate-400">…</span>}
        <button onClick={() => onChange(Math.min(totalPages, blockEnd + 1))} disabled={blockEnd === totalPages} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }}>다음 →</button>
      </div>
    </div>
  );
}
