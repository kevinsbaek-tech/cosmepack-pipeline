async function fsAdd(collectionName, data) {
  if (!db) return { id: "local-" + Date.now(), local: true };
  const payload = { ...data };
  if (!payload.createdAt) payload.createdAt = new Date().toISOString(); // orderBy 대상 필드는 항상 보장
  payload._serverCreatedAt = firebase.firestore.FieldValue.serverTimestamp();
  const ref = await db.collection(collectionName).add(payload);
  return { id: ref.id };
}
async function fsUpdate(collectionName, id, data) {
  if (!db) return;
  await db.collection(collectionName).doc(id).set(data, { merge: true });
}
async function fsDelete(collectionName, id) {
  if (!db) return;
  await db.collection(collectionName).doc(id).delete();
}
// 실시간 구독: onSnapshot으로 목록을 항상 최신 상태로 유지 (연결 안 됐으면 아무 것도 안 함 → 로컬 state만 사용)
// orderBy를 서버 쿼리에 걸지 않음(createdAt 필드가 없는 기존 문서가 결과에서 통째로 제외되는 것을 방지) — 대신 받은 뒤 클라이언트에서 정렬
function fsSubscribe(collectionName, onData) {
  if (!db) return () => {};
  return db.collection(collectionName).onSnapshot(
    (snap) => {
      const list = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
      list.sort((a, b) => {
        const da = parseCreatedAt(a.createdAt) || new Date(0);
        const db_ = parseCreatedAt(b.createdAt) || new Date(0);
        return db_ - da;
      });
      onData(list);
    },
    (err) => console.error(`${collectionName} 구독 오류:`, err)
  );
}

/* ===================== 구글 드라이브 썸네일 변환 ===================== */
// 구글 드라이브 공유 링크(파일 ID 포함)를 바로 <img>로 렌더 가능한 썸네일 URL로 변환
function driveLinkToThumbnail(url) {
  if (!url) return "";
  const m = url.match(/[-\w]{25,}/); // 구글 드라이브 파일 ID 추출 (25자 이상의 영숫자/-/_ 토큰)
  if (!m) return url; // 드라이브 링크가 아니면 원본 그대로 사용 (base64 등)
  return `https://drive.google.com/thumbnail?id=${m[0]}&sz=w400`;
}

/* ===================== 이미지 압축 (Storage 절약, 300KB 이하로 리사이즈) ===================== */
function compressDataUrl(dataUrl, maxBytes) {
  maxBytes = maxBytes || 250 * 1024;
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(dataUrl);
    img.onload = () => {
      let maxDim = 700;
      const attempt = (dim, quality) => {
        const scale = Math.min(1, dim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL("image/jpeg", quality);
      };
      let quality = 0.82;
      let out = attempt(maxDim, quality);
      let guard = 0;
      while (out.length * 0.75 > maxBytes && guard < 8) {
        if (quality > 0.4) quality -= 0.1; else maxDim = Math.round(maxDim * 0.8);
        out = attempt(maxDim, quality);
        guard++;
      }
      resolve(out);
    };
    img.src = dataUrl;
  });
}

function compressImageFile(file, maxBytes) {
  maxBytes = maxBytes || 300 * 1024;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let maxDim = 900;
        const attempt = (dim, quality) => {
          const scale = Math.min(1, dim / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          return canvas.toDataURL("image/jpeg", quality);
        };
        let quality = 0.85;
        let dataUrl = attempt(maxDim, quality);
        let guard = 0;
        while (dataUrl.length * 0.75 > maxBytes && guard < 8) {
          if (quality > 0.4) quality -= 0.1; else maxDim = Math.round(maxDim * 0.8);
          dataUrl = attempt(maxDim, quality);
          guard++;
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ===================== 견적 엑셀 통합 파서 (SheetJS 기반) ===================== */
function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function findHeaderRowIndex(rows, keywords) {
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (row.some((c) => typeof c === "string" && keywords.some((k) => c.includes(k)))) return i;
  }
  return -1;
}

// 예비용 범용 추출기 (제안서/가격조사 전용 파서가 실패했을 때의 폴백)
function extractItemsFromRows(rows) {
  const headerIdx = findHeaderRowIndex(rows, ["품명", "제품명", "단가", "규격"]);
  if (headerIdx < 0) return [];
  const header = rows[headerIdx].map((c) => String(c || "").trim());
  const colIndex = (keywords) => header.findIndex((h) => keywords.some((k) => h.includes(k)));
  const nameIdx = colIndex(["품명", "제품명"]);
  const priceIdx = colIndex(["단가", "RMB", "위안"]);
  const qtyIdx = colIndex(["수량"]);
  const specIdx = colIndex(["규격", "사이즈", "재원"]);
  const materialIdx = colIndex(["재질"]);
  const cbmIdx = colIndex(["CBM", "부피"]);
  const linkIdx = colIndex(["링크", "1688", "URL"]);
  const factoryIdx = colIndex(["공장", "회사명"]);
  const noteIdx = colIndex(["비고"]);
  if (nameIdx < 0) return [];
  const items = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[nameIdx];
    if (!name || String(name).trim() === "") continue;
    items.push({
      name: String(name).trim(),
      rmbCost: priceIdx >= 0 ? Number(String(row[priceIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      quantity: qtyIdx >= 0 ? Number(String(row[qtyIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      specSize: specIdx >= 0 ? String(row[specIdx] || "").trim() : "",
      material: materialIdx >= 0 ? String(row[materialIdx] || "").trim() : "",
      cbm: cbmIdx >= 0 ? Number(String(row[cbmIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      factoryLink: linkIdx >= 0 ? String(row[linkIdx] || "").trim() : "",
      factory: factoryIdx >= 0 ? String(row[factoryIdx] || "").trim() : "",
      note: noteIdx >= 0 ? String(row[noteIdx] || "").trim() : "",
      unitPrice: 0, totalPrice: 0,
    });
  }
  return items;
}

// "제안서(원화)" 시트: No/제품사진/제품명/재원/주문수량/단가(ea)/금액/비고 — 실제 최종 견적 품목의 1차 출처
function extractProposalItems(rows, imageMap) {
  const headerIdx = findHeaderRowIndex(rows, ["제품명"]);
  if (headerIdx < 0) return [];
  const header = rows[headerIdx].map((c) => String(c || "").trim());
  const colIndex = (keywords) => header.findIndex((h) => keywords.some((k) => h.includes(k)));
  const nameIdx = colIndex(["제품명", "품명"]);
  const specIdx = colIndex(["재원", "규격"]);
  const qtyIdx = colIndex(["주문", "수량"]);
  const priceIdx = colIndex(["단가"]);
  const amountIdx = colIndex(["금액"]);
  const noteIdx = colIndex(["비고"]);
  if (nameIdx < 0) return [];
  const items = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[nameIdx];
    if (!name || String(name).trim() === "") continue;
    const specRaw = specIdx >= 0 ? String(row[specIdx] || "") : "";
    const sizeMatch = specRaw.match(/사이즈\s*[:：]?\s*([^\n]+?)(?=\s*재질|$)/);
    const materialMatch = specRaw.match(/재질\s*[:：]?\s*([^\n]+)/);
    const noteRaw = noteIdx >= 0 ? String(row[noteIdx] || "").trim() : "";
    const noteSpec = extractSpecFromNote(noteRaw);
    items.push({
      name: String(name).replace(/\r?\n+/g, " ").trim(), // 2줄 이상 작성된 제품명도 줄바꿈만 공백으로 바꿔 잘림 없이 100% 보존
      specSize: sizeMatch ? sizeMatch[1].trim() : specRaw.split("\n")[0] || "",
      material: materialMatch ? materialMatch[1].trim() : "",
      quantity: qtyIdx >= 0 ? Number(String(row[qtyIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      unitPrice: priceIdx >= 0 ? Number(String(row[priceIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      totalPrice: amountIdx >= 0 ? Number(String(row[amountIdx]).replace(/[^\d.]/g, "")) || 0 : 0,
      notes: noteRaw, leadTimeDays: noteSpec.leadTimeDays, printFinishNote: noteSpec.printFinishNote,
      rmbCost: 0, factory: "", factoryLink: "", cbm: 0,
      image: (imageMap && (imageMap[i] || imageMap[i - 1] || imageMap[i + 1] || imageMap[i - 2] || imageMap[i + 2])) || "",
    });
  }
  return items;
}

// "가격조사" 시트: 품명/단가(위안화)/수량/운송비/비고/제품링크/회사명(공장)/연락처 — 원가·공장 보강용
// 자유텍스트(비고 등)에서 CBM/사이즈/재질을 최대한 뽑아내는 보조 파서
function extractSpecFromNote(note) {
  if (!note) return { cbm: 0, specSize: "", material: "", leadTimeDays: null, printFinishNote: "" };
  const text = String(note);
  const cbmMatch = text.match(/예상\s*부피\s*[:：]?\s*([\d.]+)\s*CBM/i) || text.match(/([\d.]+)\s*CBM/i);
  // 다음 라벨(사이즈/재질/예상/인쇄/후가공) 앞까지만 값으로 인식 — 뒤에 이어지는 다른 항목을 잘못 삼키지 않도록
  const stopAhead = "(?=\\s*(사이즈|재질|예상|인쇄|후가공)\\s*[:：]|\\n|$)";
  const sizeMatch = text.match(new RegExp(`사이즈\\s*[:：]?\\s*([^\\n]+?)${stopAhead}`));
  const materialMatch = text.match(new RegExp(`재질\\s*[:：]?\\s*([^\\n]+?)${stopAhead}`));
  const leadTimeMatch = text.match(/예상\s*(?:생산|제작)\s*기간\s*[:：]?\s*(?:약\s*)?(\d+(?:\.\d+)?)\s*일/);
  const printFinishMatch = text.match(new RegExp(`(?:인쇄|후가공)\\s*[:：]?\\s*([^\\n]+?)${stopAhead}`));
  return {
    cbm: cbmMatch ? Number(cbmMatch[1]) || 0 : 0,
    specSize: sizeMatch ? sizeMatch[1].trim() : "",
    material: materialMatch ? materialMatch[1].trim() : "",
    leadTimeDays: leadTimeMatch ? Math.round(parseFloat(leadTimeMatch[1])) : null,
    printFinishNote: printFinishMatch ? printFinishMatch[1].trim() : "",
  };
}

function extractSourcingMap(rows, imageMap) {
  const map = {};
  const headerIdx = findHeaderRowIndex(rows, ["품명", "단가"]);
  if (headerIdx < 0) return map;
  const header = rows[headerIdx].map((c) => String(c || "").trim());
  const colIndex = (keywords) => header.findIndex((h) => keywords.some((k) => h.includes(k)));
  const nameIdx = colIndex(["품명"]);
  const priceIdx = colIndex(["단가"]);
  const qtyIdx = colIndex(["수량"]);
  const noteIdx = colIndex(["비고"]);
  const linkIdx = colIndex(["제품링크"]);
  const homepageIdx = colIndex(["회사홈페이지링크", "홈페이지링크", "홈페이지"]);
  const factoryIdx = colIndex(["회사명", "공장"]);
  const contactIdx = colIndex(["연락처", "연럭처"]);
  const shipIdx = colIndex(["운송비", "운송료"]);
  if (nameIdx < 0) return map;
  let lastFactory = "", lastLink = "", lastHomepage = "", lastContact = "";
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = row[nameIdx];
    if (!name || String(name).trim() === "") continue;
    // 병합 셀 대응: 공장명/링크/연락처가 빈 값이면 직전 행 값을 그대로 이어받음
    const factoryVal = factoryIdx >= 0 ? String(row[factoryIdx] || "").trim() : "";
    const linkVal = linkIdx >= 0 ? String(row[linkIdx] || "").trim() : "";
    const homepageVal = homepageIdx >= 0 ? String(row[homepageIdx] || "").trim() : "";
    const contactVal = contactIdx >= 0 ? String(row[contactIdx] || "").trim() : "";
    if (factoryVal) lastFactory = factoryVal;
    if (linkVal) lastLink = linkVal;
    if (homepageVal) lastHomepage = homepageVal;
    if (contactVal) lastContact = contactVal;
    const note = noteIdx >= 0 ? String(row[noteIdx] || "").trim() : "";
    const noteSpec = extractSpecFromNote(note);
    const normalizedName = String(name).replace(/\r?\n+/g, " ").trim(); // 2줄 이상 작성된 품명도 줄바꿈만 공백으로 바꿔 잘림 없이 보존
    map[normalizedName] = {
      image: (imageMap && (imageMap[i] || imageMap[i - 1] || imageMap[i + 1] || imageMap[i - 2] || imageMap[i + 2])) || "",
      rmbCost: priceIdx >= 0 ? Number(row[priceIdx]) || 0 : 0,
      quantity: qtyIdx >= 0 ? Number(row[qtyIdx]) || 0 : 0,
      cbm: noteSpec.cbm, specSize: noteSpec.specSize, material: noteSpec.material, note,
      leadTimeDays: noteSpec.leadTimeDays, printFinishNote: noteSpec.printFinishNote,
      factoryLink: linkVal || lastLink,
      companyHomepageLink: homepageVal || lastHomepage,
      factory: factoryVal || lastFactory,
      contact: contactVal || lastContact,
      shippingRmb: shipIdx >= 0 ? Number(row[shipIdx]) || 0 : 0,
    };
  }
  return map;
}

// "제안가격" 시트: 헤더가 여러줄로 병합돼있어 정확한 표 구조를 잡기 어려우므로,
// 환율/관세율/CBM당물류비/마진율 라벨을 스캔해 바로 아래 행의 값을 최선노력으로 추출
function extractPricingSummary(rows) {
  const summary = {};
  const wanted = [
    ["exchangeRate", ["환율"]],
    ["customsRate", ["관세율"]],
    ["cbmRate", ["CBM당"]],
    ["marginRate", ["이익율", "마진율"]],
  ];
  for (const [key, keywords] of wanted) {
    outer: for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const cell = row[c];
        if (typeof cell === "string" && keywords.some((k) => cell.includes(k))) {
          // 바로 아래 행, 같은 열의 값을 데이터로 간주
          for (let rr = r + 1; rr < Math.min(rows.length, r + 4); rr++) {
            const v = rows[rr] && rows[rr][c];
            if (typeof v === "number" && v !== 0) { summary[key] = v; break outer; }
          }
        }
      }
    }
  }
  return summary;
}



// "貴下"(귀하) 셀 기준 — 같은 행에서 그 앞쪽의 첫 텍스트 셀을 고객사명으로 인식
function extractClientFromDuiXia(rows) {
  for (const row of rows) {
    const idx = row.findIndex((c) => typeof c === "string" && (c.includes("貴下") || c.includes("귀하")));
    if (idx >= 0) {
      for (let j = idx - 1; j >= 0; j--) {
        const v = row[j];
        if (typeof v === "string" && v.trim() && !v.includes("貴下") && !v.includes("귀하")) return v.trim();
      }
    }
  }
  return "";
}
// "제안서(원화)" 시트의 고정 위치(C3=고객사명, D6=작성일자)를 우선 시도하고, 없으면 기존 유연 탐색(貴下 기준)으로 폴백
function extractClientFromFixedCell(rows) {
  const v = rows[2] && rows[2][2]; // C3 (0-indexed: row 2, col 2)
  if (typeof v === "string" && v.trim()) return v.trim();
  return "";
}
function extractProposalDateFromFixedCell(rows) {
  const v = rows[5] && rows[5][3]; // D6 (0-indexed: row 5, col 3)
  if (!v) return null;
  if (v instanceof Date && !isNaN(v.getTime())) {
    const p = (n) => String(n).padStart(2, "0");
    return `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())} 00:00:00`;
  }
  const s = String(v).trim();
  const m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")} 00:00:00`;
  return null;
}

// 엑셀(.xlsx = zip) 안의 그림 개체를 zip 구조에서 직접 추출해 "몇 번째 행에 있는 그림인지" 매핑
async function extractSheetImages(zip, workbook, sheetName) {
  const result = {};
  if (!zip || !sheetName) return result;
  try {
    const escapedName = sheetName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const workbookXml = await zip.file("xl/workbook.xml").async("string");
    const sheetTagMatch = workbookXml.match(new RegExp(`<sheet[^>]*name="${escapedName}"[^>]*/>`));
    if (!sheetTagMatch) return result;
    const ridMatch = sheetTagMatch[0].match(/r:id="(rId\d+)"/);
    if (!ridMatch) return result;

    const workbookRelsXml = await zip.file("xl/_rels/workbook.xml.rels").async("string");
    const relMatch = workbookRelsXml.match(new RegExp(`<Relationship[^>]*Id="${ridMatch[1]}"[^>]*Target="([^"]+)"`));
    if (!relMatch) return result;
    const sheetPath = "xl/" + relMatch[1].replace(/^\/?/, "");
    const sheetFileName = sheetPath.split("/").pop();
    const sheetRelsPath = sheetPath.replace(/worksheets\/[^/]+$/, `worksheets/_rels/${sheetFileName}.rels`);
    const sheetRelsFile = zip.file(sheetRelsPath);
    if (!sheetRelsFile) return result;

    const sheetRelsXml = await sheetRelsFile.async("string");
    const drawingRelMatch = sheetRelsXml.match(/<Relationship[^>]*Target="([^"]*drawing[^"]*)"/);
    if (!drawingRelMatch) return result;
    const drawingFileName = drawingRelMatch[1].split("/").pop();
    const drawingPath = "xl/drawings/" + drawingFileName;
    const drawingFile = zip.file(drawingPath);
    if (!drawingFile) return result;
    const drawingXml = await drawingFile.async("string");

    const drawingRelsPath = `xl/drawings/_rels/${drawingFileName}.rels`;
    const drawingRelsFile = zip.file(drawingRelsPath);
    const drawingRelsXml = drawingRelsFile ? await drawingRelsFile.async("string") : "";
    const ridToMedia = {};
    const relRe = /<Relationship[^>]*Id="(rId\d+)"[^>]*Target="([^"]+)"/g;
    let relM;
    while ((relM = relRe.exec(drawingRelsXml))) {
      ridToMedia[relM[1]] = "xl/media/" + relM[2].split("/").pop();
    }

    const anchorRe = /<[\w]*:?(?:two|one)CellAnchor[\s\S]*?<\/[\w]*:?(?:two|one)CellAnchor>/g;
    let anchorMatch;
    while ((anchorMatch = anchorRe.exec(drawingXml))) {
      const block = anchorMatch[0];
      const rowMatch = block.match(/<[\w]*:?from>[\s\S]*?<[\w]*:?row>(\d+)<\/[\w]*:?row>/) || block.match(/<[\w]*:?row>(\d+)<\/[\w]*:?row>/);
      const embedMatch = block.match(/r:embed="(rId\d+)"/) || block.match(/[\w]*:embed="(rId\d+)"/);
      if (!rowMatch || !embedMatch) continue;
      const rowIdx = Number(rowMatch[1]);
      const mediaPath = ridToMedia[embedMatch[1]];
      if (!mediaPath || !zip.file(mediaPath)) continue;
      const ext = mediaPath.split(".").pop().toLowerCase();
      const mime = ext === "jpg" ? "jpeg" : ext;
      if (!["png", "jpeg", "gif", "bmp"].includes(mime)) continue;
      const base64 = await zip.file(mediaPath).async("base64");
      const rawDataUrl = `data:image/${mime};base64,${base64}`;
      result[rowIdx] = await compressDataUrl(rawDataUrl, 250 * 1024);
    }
  } catch (e) {
    console.error("엑셀 내 이미지 추출 실패:", e);
  }
  return result;
}

async function parseQuoteWorkbook(workbook, zip) {
  const sheetNames = workbook.SheetNames;
  const findSheet = (...keywords) => sheetNames.find((n) => keywords.some((k) => n.includes(k)));
  const proposalSheetName = findSheet("제안서(원화)", "제안서", "원화");
  const sourcingSheetName = findSheet("가격조사");
  const pricingSheetName = findSheet("제안가격");

  const toRows = (name) => {
    if (!name) return [];
    const ws = workbook.Sheets[name];
    return XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
  };

  const proposalRows = toRows(proposalSheetName);
  const sourcingRows = toRows(sourcingSheetName);
  const pricingRows = toRows(pricingSheetName);

  const clientName = extractClientFromFixedCell(proposalRows) || extractClientFromDuiXia(proposalRows);
  const proposalDate = extractProposalDateFromFixedCell(proposalRows);
  const pricingSummary = extractPricingSummary(pricingRows);

  const proposalImageMap = zip ? await extractSheetImages(zip, workbook, proposalSheetName) : {};
  const sourcingImageMap = zip ? await extractSheetImages(zip, workbook, sourcingSheetName) : {};
  let items = extractProposalItems(proposalRows, proposalImageMap);
  const sourcingMap = extractSourcingMap(sourcingRows, sourcingImageMap);
  if (items.length > 0) {
    items = items.map((it) => {
      const src = sourcingMap[it.name];
      if (!src) return it;
      return {
        ...it,
        rmbCost: src.rmbCost || it.rmbCost, factory: src.factory, factoryLink: src.factoryLink,
        companyHomepageLink: src.companyHomepageLink || "",
        shippingRmb: src.shippingRmb || 0,
        cbm: it.cbm || src.cbm || 0,
        specSize: it.specSize || src.specSize || "", material: it.material || src.material || "",
        image: it.image || src.image || "",
        leadTimeDays: it.leadTimeDays || src.leadTimeDays || null,
        printFinishNote: it.printFinishNote || src.printFinishNote || "",
      };
    });
  } else {
    // 제안서 시트 인식 실패시 가격조사 시트 자체를 폴백 품목 출처로 사용
    items = extractItemsFromRows(sourcingRows);
  }

  const totalAmount = items.reduce((s, it) => s + (it.totalPrice || 0), 0);
  const factories = Array.from(new Set(items.map((i) => i.factory).filter(Boolean)));
  const factoryLinks = {};
  const factoryHomepages = {};
  items.forEach((i) => {
    if (i.factory && i.factoryLink) factoryLinks[i.factory] = i.factoryLink;
    if (i.factory && i.companyHomepageLink) factoryHomepages[i.factory] = i.companyHomepageLink;
  });

  return { clientName, proposalDate, totalAmount, items, factories, factoryLinks, factoryHomepages, pricingSummary, sheetNames };
}



function parseCsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim() !== "");
  if (lines.length === 0) return [];
  const parseLine = (line) => {
    const cells = [];
    let cur = "", inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === "," && !inQuotes) { cells.push(cur); cur = ""; }
      else { cur += ch; }
    }
    cells.push(cur);
    return cells.map((c) => c.trim());
  };
  const header = parseLine(lines[0]);
  return lines.slice(1).map((line) => {
    const cells = parseLine(line);
    const row = {};
    header.forEach((h, i) => { row[h] = cells[i] || ""; });
    return row;
  });
}
function pickField(row, aliases) {
  const keys = Object.keys(row);
  for (const alias of aliases) {
    const found = keys.find((k) => k.toLowerCase().replace(/\s/g, "") === alias.toLowerCase().replace(/\s/g, ""));
    if (found) return row[found];
  }
  return "";
}

/* ===================== 박스히어로(BoxHero) HTML 일괄 다운로드 파서 ===================== */
function parseBoxHeroHtml(htmlText) {
  const doc = new DOMParser().parseFromString(htmlText, "text/html");
  const table = doc.querySelector("table");
  if (!table) return [];
  const headerCells = Array.from(table.querySelectorAll("thead th"));
  const headers = headerCells.map((th) => th.textContent.replace(/\s+/g, " ").trim());
  const rows = Array.from(table.querySelectorAll("tbody tr"));
  return rows.map((tr) => {
    const cells = Array.from(tr.querySelectorAll("td"));
    const row = {};
    headers.forEach((h, i) => {
      const cell = cells[i];
      if (!cell) { row[h] = ""; return; }
      const img = cell.querySelector("img");
      row[h] = img ? (img.getAttribute("src") || "") : cell.textContent.replace(/\s+/g, " ").trim();
    });
    return row;
  });
}
function extractNumber(str) {
  if (!str) return 0;
  const m = String(str).match(/\d+(\.\d+)?/);
  return m ? Number(m[0]) : 0;
}
// "3천개", "1만개", "500개", "3,000개" 등 한글 단위가 섞인 수량 텍스트에서 실제 개수를 숫자로 추출
// "(1만개기준)", "(5겹은 원단을...)" 같은 괄호 안 부연설명 때문에 숫자를 잘못 집어내는 문제를 막기 위해
// 괄호(반각/전각 모두) 안의 텍스트를 먼저 제거한 뒤 숫자를 찾는다.
function stripParens(text) {
  return String(text || "").replace(/[\(（][^\)）]*[\)）]/g, " ");
}
function extractKoreanQuantity(text) {
  if (!text) return null;
  const t = stripParens(text).replace(/,/g, "");
  let m = t.match(/(\d+(?:\.\d+)?)\s*만/);
  if (m) return Math.round(parseFloat(m[1]) * 10000);
  m = t.match(/(\d+(?:\.\d+)?)\s*천/);
  if (m) return Math.round(parseFloat(m[1]) * 1000);
  m = t.match(/(\d+(?:\.\d+)?)/);
  return m ? Math.round(parseFloat(m[1])) : null;
}
// "약 10일", "10 days" 등에서 리드타임 일수만 숫자로 추출
function extractLeadTimeDays(text) {
  if (!text) return null;
  const m = String(text).match(/(\d+(?:\.\d+)?)\s*(일|days?)/i);
  return m ? Math.round(parseFloat(m[1])) : null;
}
// 박스히어로 가격/운송료 필드는 "(1만개기준) 1.21 위안"처럼 수량 설명이 괄호로 앞에 붙는 경우가 많아
// 그냥 첫 숫자를 뽑으면 "1만개"의 "1"을 잘못 집어낸다. 괄호 안 텍스트를 먼저 제거한 뒤 숫자를 찾는다.
// (여러 구간이 "/"로 나열된 경우엔 첫 번째 구간 값을 대표값으로 사용 — 전체 원문은 별도 필드에 그대로 보존됨)
function extractPriceOutsideParens(text) {
  if (!text) return 0;
  const stripped = stripParens(text);
  const m = stripped.match(/\d+(\.\d+)?/);
  if (m) return Number(m[0]);
  return extractNumber(text);
}
// SKU-XXXXXXXX 형태의 토큰을 텍스트(파일명 등)에서 추출 (박스히어로 업로드, ZIP 일괄업로드 공용)
function extractSkuToken(text) {
  const m = String(text || "").match(/SKU-[A-Za-z0-9]+/i);
  return m ? m[0].toUpperCase() : null;
}
function boxHeroRowsToProducts(rows) {
  return rows.map((row) => {

      // (C) 중국 공장/원가 항목
      factory: pickField(row, ["(C)중국공장명"]),
      factoryLink: pickField(row, ["(C)제품URL"]),

      cbmText,

      rmbCost,
      factoryPriceNote: pickField(row, ["(C)공장단가설명"]),
      containerPrintPriceC: pickField(row, ["(C)용기인쇄단가"]),
      containerFinishPriceC: pickField(row, ["(C)용기후가공단가"]),
      capPrintPriceC: pickField(row, ["(C)캡/뚜껑인쇄단가"]),

      // 원본 전체 (테이블 헤더 그대로) — 화면에 없는 항목까지 전부 보존

// 제품명 "[코스메팩] 유리용기 / 크림용기 / ..." 형태에서 대괄호 뒤 첫 " / " 구간을 카테고리로 우선 매칭.
// 그래도 못 찾으면(엑셀 품명/비고에 카테고리명이 그냥 섞여 들어간 경우 등) extraText까지 합쳐서
// 전체 텍스트 어디에든 카테고리명이 포함돼 있는지 폴백으로 검사한다.
function guessCategoryFromName(name, extraText) {
  if (!name) return "";
  const withoutBracket = name.replace(/^\s*\[[^\]]*\]\s*/, ""); // 맨앞 [코스메팩] 등 제거
  const firstSegment = withoutBracket.split("/")[0].trim();
  const norm = (s) => s.replace(/\s/g, "");
  if (firstSegment) {
    // 1) 완전일치
    const exact = CATEGORIES.find((c) => c === firstSegment);
    if (exact) return exact;
    // 2) 포함관계(양방향) — 공백 제거 후 비교하여 표기 차이 허용
    const nSeg = norm(firstSegment);
    const partial = CATEGORIES.find((c) => norm(c) === nSeg || nSeg.includes(norm(c)) || norm(c).includes(nSeg));
    if (partial) return partial;
  }
  // 3) 폴백: 품명 전체 + 비고(extraText) 어디에든 카테고리명이 그대로 포함돼 있으면 그걸로 인식
  const fullText = norm(`${name} ${extraText || ""}`);
  const contained = CATEGORIES.find((c) => fullText.includes(norm(c)));
  return contained || "";
}

const TUBE_MATERIAL_TYPE_TOKENS = [
  "PE튜브", "라미튜브", "드로퍼튜브", "기능성튜브", "유리용기", "아크릴용기",
  "PS용기", "PP용기", "PET용기", "PETG용기", "PE용기", "AS용기", "에어리스용기",
  "PP펌프", "기타펌프", "기타용기", "용기소포자재", "단상자", "싸바리", "쇼핑백", "기타자재",
];
const INSERT_OPTION_KEYWORDS = ["드로퍼인서트", "오리피스인서트", "마개인서트", "이중구조캡", "역류방지인서트"];

function extractSizePhiToken(text) {
  const m = (text || "").match(/(\d+(?:\.\d+)?)\s*파이/);
  return m ? `${m[1]}파이` : "";
}

// 엑셀 품명/비고 원문에서 재질·인서트·캡형태·사이즈·용량을 뽑아 코스메팩 표준 형식으로 재조합.
// 재질/용량 둘 다 인식하지 못하면(정보가 너무 부족하면) 원문 그대로 두어 데이터 유실을 방지한다.
function buildStandardProductName(rawName, note) {
  const text = `${rawName || ""} ${note || ""}`;
  const materialType = extractFirstKeyword(text, TUBE_MATERIAL_TYPE_TOKENS);
  const insert = extractFirstKeyword(text, INSERT_OPTION_KEYWORDS);
  let cap = extractFirstKeyword(text, CAP_TYPE_KEYWORDS);
  if (cap && materialType && materialType.includes(cap)) cap = null; // "에어리스용기"/"PP펌프"처럼 재질명 안에 이미 캡단어가 들어있으면 중복표기 방지
  if (insert && cap && insert.startsWith(cap)) cap = null; // "드로퍼인서트"가 이미 잡히면 "드로퍼" 캡과 중복 표기하지 않음
  const size = extractSizePhiToken(text);
  const capacity = extractCapacityToken(text) || "";
  if (!materialType && !capacity) return (rawName || "").trim(); // 인식 실패시 원본 품명 유지
  const parts = [materialType, insert, cap, size, capacity].filter(Boolean);
  return `[코스메팩] ${parts.join(" / ")}`;
}

// 텍스트에서 용량(숫자+단위: ml/g/kg/L)을 추출 — 첫 매치만 사용
function extractCapacityToken(text) {
  const m = (text || "").match(/(\d+(?:\.\d+)?)\s*(ml|mL|ML|g|kg|KG|L|l)\b/);
  if (!m) return null;
  return `${m[1]}${m[2].toLowerCase()}`;
}
function extractFirstKeyword(text, list) {
  const hay = text || "";
  for (const k of list) { if (hay.includes(k)) return k; }
  return null;
}
function extractAllKeywords(text, list) {
  const hay = text || "";
  return list.filter((k) => hay.includes(k));
}

// 제품 하나에서 [기본 그룹키(용량+용기형태)] + [재질/캡타입/후가공 태그]를 파싱.
// 이름/규격/재질/기타옵션 필드를 모두 훑어서 최대한 폭넓게 인식(저장 시점이 아니라 조회 시점에 매번 파싱하므로
// 기존에 저장된 제품에도 별도 마이그레이션 없이 즉시 적용됨).
function deriveProductAttributes(p) {
  const text = [p.name, p.specSize, p.composition, p.material, p.otherOptionK, p.otherOptionC, p.proposalNotesK, p.productionNotesC].filter(Boolean).join(" ");
  const capacity = extractCapacityToken(text);
  const containerType = extractFirstKeyword(text, CONTAINER_TYPE_KEYWORDS);
  const baseGroupKey = capacity && containerType ? `${capacity} ${containerType}` : (containerType || capacity || null);
  return {
    baseGroupKey,
    capacity,
    containerType,
    materials: extractAllKeywords(text, MATERIAL_KEYWORDS),
    capTypes: extractAllKeywords(text, CAP_TYPE_KEYWORDS),
    finishes: extractAllKeywords(text, FINISH_KEYWORDS),
  };
}

// 옵션(후가공/인쇄) 관련 숫자 필드를 합산해 "기본단가 대비 옵션 추가금"을 근사 계산
function productOptionSurcharge(p) {
  const fields = ["containerPrintPriceK", "containerFinishPriceK", "capPrintPriceK", "capFinishPriceK", "otherFinishPriceK"];
  return fields.reduce((sum, f) => sum + (Number(p[f]) || 0), 0);
}

// 제품 목록 전체를 baseGroupKey 기준으로 그룹핑(2건 이상 묶인 그룹만 "유사군"으로 의미있음)
function buildProductGroups(products) {
  const map = new Map();
  products.forEach((p) => {
    const attrs = deriveProductAttributes(p);
    const key = attrs.baseGroupKey;
    if (!key) return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push({ ...p, _attrs: attrs });
  });
  return map;
}

const EXRATE_SAVED_KEY = "cosmepack_exrate_saved"; // 사용자가 직접 저장한 환율 + 저장일시
// 무료 환율 API(open.er-api.com, CORS 제한 없음)로 CNY->KRW, CNY->USD, USD->KRW 중간환율을 가져와
// 은행 송금(전신환매도율) 기준 근사 우대환율을 계산한다. 실제 은행 고시환율과는 소폭 차이가 있을 수 있는 "추천값"이다.
async function fetchTodayExchangeRates() {
  const BANK_SPREAD = 0.015; // 전신환매도율 근사 스프레드(중간환율 대비 약 1.5% 차감) — 실제 우대율은 은행/시점마다 다름
  try {
    const [cnyRes, usdRes] = await Promise.all([
      fetch("https://open.er-api.com/v6/latest/CNY"),
      fetch("https://open.er-api.com/v6/latest/USD"),
    ]);
    const cnyData = await cnyRes.json();
    const usdData = await usdRes.json();
    if (cnyData.result !== "success" || usdData.result !== "success") throw new Error("환율 API 응답 오류");
    const rates = {
      rmbToKrw: Number((cnyData.rates.KRW * (1 - BANK_SPREAD)).toFixed(2)),
      rmbToUsd: Number(cnyData.rates.USD.toFixed(2)),
      usdToKrw: Number((usdData.rates.KRW * (1 - BANK_SPREAD)).toFixed(2)),
      updatedAt: todayDisplay(),
      fetchedDate: todayStr(),
    };
    try { localStorage.setItem(EXRATE_CACHE_KEY, JSON.stringify(rates)); } catch (e) { console.error(e); }
    return rates;
  } catch (e) {
    console.error("환율 API 조회 실패, 캐시된 마지막 환율로 대체:", e);
    try {
      const cached = JSON.parse(localStorage.getItem(EXRATE_CACHE_KEY) || "null");
      return cached;
    } catch (e2) { return null; }
  }
}
// 환율 값을 "천단위 콤마 + 소수점 둘째자리 고정" 형식으로 표기
function fmtRate(n) {
  return (Number(n) || 0).toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function todayStr() { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`; }

// 엑셀 파일명 맨 앞의 8자리 숫자(YYYYMMDD)를 날짜로 추출. 없거나 유효하지 않으면 null 반환 (호출부에서 오늘 날짜로 폴백)
function extractDateFromFileName(fileName) {
  const base = (fileName || "").trim();
  const m = base.match(/^(\d{8})/);
  if (!m) return null;
  const y = Number(m[1].slice(0, 4)), mo = Number(m[1].slice(4, 6)), d = Number(m[1].slice(6, 8));
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo - 1, d);
  if (isNaN(dt.getTime())) return null;
  return m[1];
}
function addDays(days) { const d = new Date(); d.setDate(d.getDate() + days); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function nowDateTimeStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function todayDisplay() { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }

const won = (n) => "₩" + Math.round(n || 0).toLocaleString("ko-KR");
const rmb = (n) => "¥" + (n || 0).toLocaleString("ko-KR", { maximumFractionDigits: 2 });
const pct = (n) => (n || 0).toFixed(1) + "%";

function getMarginRate(marginTable, category, totalRmbAmount) {
  const rates = marginTable[category] || marginTable[CATEGORIES[0]];
  let idx = 0;
  for (let i = 0; i < MARGIN_TIER_BOUNDS.length; i++) { if (totalRmbAmount >= MARGIN_TIER_BOUNDS[i]) idx = i; }
  return rates[idx];
}

function composeNotes({ spec, printPrice, finishing, leadTime, cbm, extraOptions }) {
  const lines = [];
  if (spec) lines.push(spec);
  if (printPrice) lines.push(`실크 인쇄: 1도당 단가 ${printPrice}원/ea`);
  if (finishing) lines.push(`기타 후가공: ${finishing}`);
  lines.push(`예상 생산기간: 주문 확정 및 최종 사양 확인 후 약 ${leadTime || 30}일`);
  if (cbm) lines.push(`예상 부피: 약 ${cbm}CBM`);
  (extraOptions || []).forEach((opt) => { if (opt && opt.trim()) lines.push(`• ${opt.trim()}`); });
  return lines.join("\n");
}

function ImageUpload({ value, onChange }) {
  const fileRef = useRef(null);
  const [mode, setMode] = useState("upload"); // upload | drive
  const [driveUrl, setDriveUrl] = useState("");

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const compressed = await compressImageFile(file, 300 * 1024);
      onChange(compressed);
    } catch (err) {
      console.error(err);
      const reader = new FileReader();
      reader.onload = () => onChange(reader.result);
      reader.readAsDataURL(file);
    }
  };

  const applyDriveLink = (url) => {
    setDriveUrl(url);
    onChange(driveLinkToThumbnail(url));
  };

  return (
    <div>
      <div className="flex gap-1 mb-2">
        <button type="button" onClick={() => setMode("upload")} className={"text-[11px] px-2 py-1 rounded-md " + (mode === "upload" ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-500")}>파일 업로드</button>
        <button type="button" onClick={() => setMode("drive")} className={"text-[11px] px-2 py-1 rounded-md " + (mode === "drive" ? "bg-[#1E3A8A] text-white" : "bg-slate-100 text-slate-500")}>구글드라이브 링크</button>
      </div>
      <div className="flex items-center gap-3">
        <div className="w-16 h-16 rounded-lg border border-slate-200 bg-slate-50 flex items-center justify-center overflow-hidden shrink-0">
          {value ? <img src={value} className="w-full h-full object-cover" /> : <span className="text-slate-300 text-xs">사진</span>}
        </div>
        {mode === "upload" ? (
          <div className="flex flex-col gap-1">
            <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 w-fit">이미지 선택</button>
            {value && <button type="button" onClick={() => onChange("")} className="text-xs text-slate-400 hover:text-red-500 w-fit">제거</button>}
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />
          </div>

function AutoResizeTextarea({ value, onChange, placeholder, minRows, readOnly }) {
  const ref = useRef(null);
  const resize = (el) => {
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  };
  useEffect(() => { resize(ref.current); }, [value]);
  return (
    <textarea
      ref={ref}
      value={value}
      onChange={(e) => { if (readOnly) return; onChange(e.target.value); resize(e.target); }}
      placeholder={placeholder}
      rows={minRows || 3}
      readOnly={readOnly}
      style={{ overflow: "hidden", resize: "none" }}
      className={inputCls + (readOnly ? " bg-slate-50 text-slate-500 cursor-default" : "")}
    />
  );
}

function parseCreatedAt(val) {
  if (!val) return null;
  if (typeof val === "string") {
    const d = new Date(val.replace(" ", "T"));
    return isNaN(d.getTime()) ? null : d;
  }
  if (typeof val.toDate === "function") { try { return val.toDate(); } catch (e) { return null; } }
  if (typeof val.seconds === "number") return new Date(val.seconds * 1000);
  return null;
}
function formatCreatedAt(val) {
  const d = parseCreatedAt(val);
  if (!d) return "-";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function proposalMarginProfit(p) {
  const withSnap = (p.items || []).filter((it) => it.calcSnapshot);
  if (withSnap.length === 0) return { avgMargin: null, totalProfit: null };
  const avgMargin = withSnap.reduce((s, it) => s + (it.calcSnapshot.marginRate || 0), 0) / withSnap.length;
  const totalProfit = withSnap.reduce((s, it) => s + (it.calcSnapshot.totalProfit || 0), 0);
  return { avgMargin, totalProfit };
}

    if (pendingOnly && getReviewStatus(p) !== "검토대기") return false;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      const hay = `${p.clientName || ""} ${p.proposalTitle || ""} ${p.itemSummary || ""} ${p.code || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (statusFilter !== "전체" && p.status !== statusFilter) return false;
    const d = parseCreatedAt(p.createdAt);
    if (periodFilter !== "전체") {
      if (!d) return false;
      const now = new Date();
      if (periodFilter === "오늘") { if (d.toDateString() !== now.toDateString()) return false; }
      else if (periodFilter === "최근 1주일") { if (now - d > 7 * 24 * 60 * 60 * 1000) return false; }

      else if (periodFilter === "2026년 전체") { if (d.getFullYear() !== 2026) return false; }
      else if (periodFilter === "기간 직접 선택") {
        if (customFrom && d < new Date(customFrom)) return false;
        if (customTo && d > new Date(customTo + "T23:59:59")) return false;
      }
    }
    return true;

function EditField({ value, onChange, className, placeholder }) {
  return (
    <input
      value={value}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      className={"outline-none bg-transparent border-b border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors " + (className || "")}
    />
  );
}

function EditArea({ value, onChange, className, placeholder }) {
  const ref = useRef(null);
  const resize = (el) => { if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; };
  useEffect(() => { resize(ref.current); }, [value]);
  return (
    <textarea
      ref={ref}
      value={value}
      onChange={(e) => { onChange(e.target.value); resize(e.target); }}
      placeholder={placeholder}
      rows={1}
      style={{ overflow: "hidden", resize: "none" }}
      className={"outline-none bg-transparent border border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors w-full " + (className || "")}
    />
  );
}

function EditNumberField({ value, onChange, className, placeholder, readOnly }) {
  const display = value === "" || value === null || value === undefined ? "" : Number(value).toLocaleString("ko-KR");
  return (
    <input
      value={display}
      onChange={(e) => {
        if (readOnly) return;
        const raw = e.target.value.replace(/[^0-9.]/g, "");
        onChange(raw === "" ? 0 : Number(raw));
      }}
      placeholder={placeholder}
      inputMode="numeric"
      readOnly={readOnly}
      className={"outline-none bg-transparent border-b border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors " + (readOnly ? "bg-slate-50 text-slate-500 cursor-default " : "") + (className || "")}
    />
  );
}

function SourcingEditModal({ item, onClose, onSave }) {
  const [image, setImage] = useState(item.image || "");
  const [name, setName] = useState(item.name || "");
  const [rmbCost, setRmbCost] = useState(item.rmbCost || 0);
  const [quantity, setQuantity] = useState(item.quantity || 0);
  const [totalShippingRmb, setTotalShippingRmb] = useState(item.totalShippingRmb || 0);
  const [factory, setFactory] = useState(item.factory || "");
  const [factoryContact, setFactoryContact] = useState(item.factoryContact || "");
  const [wechatGroup, setWechatGroup] = useState(item.wechatGroup || "");
  const [link, setLink] = useState(item.link || "");
  const [factoryLink, setFactoryLink] = useState(item.factoryLink || "");
  const [spec, setSpec] = useState(item.spec || "");

  const save = () => {
    if (!name.trim()) return;
    const qty = Number(quantity) || 0;
    onSave(item.id, {
      image, name, rmbCost: Number(rmbCost) || 0, quantity: qty,
      totalShippingRmb: Number(totalShippingRmb) || 0,
      unitShippingRmb: qty > 0 ? (Number(totalShippingRmb) || 0) / qty : 0,
      factory, factoryContact, wechatGroup, link, factoryLink, spec,
    });
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-2xl overflow-hidden flex flex-col" style={{ maxHeight: "85vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">✏️ 가격조사 항목 수정</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          <Field label="제품 사진"><ImageUpload value={image} onChange={setImage} /></Field>
          <div className="grid grid-cols-2 gap-4 mt-4">
            <Field label="품명" span={2}><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} /></Field>
            <Field label="위안화 원가" hint="RMB/개"><input type="number" className={inputCls} value={rmbCost} onChange={(e) => setRmbCost(e.target.value)} /></Field>
            <Field label="수량" hint="개"><input type="number" className={inputCls} value={quantity} onChange={(e) => setQuantity(e.target.value)} /></Field>
            <Field label="중국 내 운송료" hint="총 RMB"><input type="number" className={inputCls} value={totalShippingRmb} onChange={(e) => setTotalShippingRmb(e.target.value)} /></Field>
            <Field label="위챗 단체방명"><input className={inputCls} value={wechatGroup} onChange={(e) => setWechatGroup(e.target.value)} /></Field>
            <Field label="공장명"><input className={inputCls} value={factory} onChange={(e) => setFactory(e.target.value)} /></Field>
            <Field label="공장 연락처"><input className={inputCls} value={factoryContact} onChange={(e) => setFactoryContact(e.target.value)} /></Field>
            <Field label="1688 링크" span={2}><input className={inputCls} value={link} onChange={(e) => setLink(e.target.value)} /></Field>
            <Field label="공장 홈페이지 링크" span={2}><input className={inputCls} value={factoryLink} onChange={(e) => setFactoryLink(e.target.value)} /></Field>
            <Field label="상세 스펙 / 비고" span={2}><AutoResizeTextarea value={spec} onChange={setSpec} minRows={3} /></Field>
          </div>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={save} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">✓ 수정 반영</button>
        </div>
      </div>
    </div>
  );
}

function SourcingCard({ item, checked, onToggle, onSend, onEdit, onDelete }) {
  return (
    <div className={"bg-white border rounded-xl p-4 flex gap-4 items-start " + (checked ? "border-[#1E3A8A]" : "border-slate-200")}>
      <input type="checkbox" checked={checked} onChange={() => onToggle(item.id)} className="mt-1 w-4 h-4 accent-[#1E3A8A] shrink-0" />
      <div className="w-16 h-16 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
        {item.image ? <img src={item.image} loading="lazy" className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[10px]">사진</span>}
      </div>
      <div className="flex-1 min-w-0 space-y-1.5">
        <div className="font-semibold text-slate-800 text-sm">{item.name}</div>
        <div className="text-xs text-slate-500 flex flex-wrap gap-x-3 gap-y-0.5">
          <span>단가 {rmb(item.rmbCost)}/개</span>
          <span>수량 {item.quantity.toLocaleString("ko-KR")}개</span>
          <span>운송비 {rmb(item.totalShippingRmb)} <span className="text-slate-400">(개당 {rmb(item.unitShippingRmb)})</span></span>
        </div>
        {(item.wechatGroup || item.factory || item.factoryContact) && (
          <div className="text-xs text-slate-500 flex flex-wrap gap-x-3">
            {item.wechatGroup && <span>💬 {item.wechatGroup}</span>}
            {item.factory && <span>🏭 {item.factory}</span>}
            {item.factoryContact && <span>☎️ {item.factoryContact}</span>}
          </div>
        )}
        {item.spec && <div className="text-xs text-slate-600 pre-line break-words bg-slate-50 rounded-lg px-3 py-2 mt-1">{item.spec}</div>}
        <div className="flex flex-col gap-0.5 pt-0.5">
          {item.link && <a href={item.link} target="_blank" className="text-xs text-[#1D4ED8] hover:underline break-all">1688: {item.link}</a>}
          {item.factoryLink && <a href={item.factoryLink} target="_blank" className="text-xs text-[#1D4ED8] hover:underline break-all">홈페이지: {item.factoryLink}</a>}
        </div>
      </div>
      <div className="flex flex-col gap-1.5 shrink-0">
        <button onClick={() => onSend(item)} className="text-xs px-3 py-2 rounded-lg bg-[#1E3A8A]/10 text-[#1E3A8A] font-medium hover:bg-[#1E3A8A]/20 whitespace-nowrap">
          제안서 작성 →
        </button>
        <button onClick={() => onEdit(item)} className="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 whitespace-nowrap">✏️ 수정</button>
        <button onClick={() => onDelete(item)} className="text-xs px-3 py-1.5 rounded-lg border border-red-100 text-red-500 hover:bg-red-50 whitespace-nowrap">🗑️ 삭제</button>
      </div>
    </div>
  );
}

function SourcingStage({ items, onAdd, onUpdateItem, onDeleteItem, onSend, onSendBulk, products, pickedProduct, onConsumePicked }) {
  const [editingSourcingItem, setEditingSourcingItem] = useState(null);
  const [image, setImage] = useState("");
  const [name, setName] = useState("");
  const [rmbCost, setRmbCost] = useState("");
  const [quantity, setQuantity] = useState("");
  const [totalShippingRmb, setTotalShippingRmb] = useState("");
  const [factory, setFactory] = useState("");
  const [factoryContact, setFactoryContact] = useState("");
  const [wechatGroup, setWechatGroup] = useState("");
  const [link, setLink] = useState("");
  const [factoryLink, setFactoryLink] = useState("");
  const [spec, setSpec] = useState("");
  const [selected, setSelected] = useState([]);
  const [productSearch, setProductSearch] = useState("");
  const [showProductPicker, setShowProductPicker] = useState(false);
  const [showRmbPicker, setShowRmbPicker] = useState(false);
  const [rmbPickerPos, setRmbPickerPos] = useState({ top: 0, left: 0 });
  const rmbInputRef = useRef(null);
  const openRmbPicker = () => {
    if (rmbInputRef.current) {
      const rect = rmbInputRef.current.getBoundingClientRect();
      setRmbPickerPos({ top: rect.bottom + 4, left: rect.left });
    }
    setShowRmbPicker(true);
  };

  const rmbPickerRows = (products || [])
    .filter((p) => name.trim() && (p.name || "").toLowerCase().includes(name.trim().toLowerCase()))
    .flatMap((p) => {
      const tiers = (p.priceTiers && p.priceTiers.length > 0) ? p.priceTiers : [{ qty: "", cbm: "", shippingRmb: "", factoryPriceRmb: p.rmbCost || "" }];
      return tiers.map((tier) => ({
        product: p,
        qty: tier.qty,
        cbm: tier.cbm,
        rmbCost: tier.factoryPriceRmb,
        shippingRmb: tier.shippingRmb,
        factory: p.factory || "",
        wechatGroup: p.wechatGroup || "",
      }));
    })
    .filter((r) => r.rmbCost !== "" && r.rmbCost !== undefined);

  const pickFromRmbPicker = (row) => {
    pickProduct(row.product);
    if (row.qty) setQuantity(row.qty);
    if (row.rmbCost) setRmbCost(row.rmbCost);
    if (row.shippingRmb) setTotalShippingRmb(row.shippingRmb);
    if (row.cbm) setSpec((prev) => (prev ? prev + `\n예상 CBM: ${row.cbm}` : `예상 CBM: ${row.cbm}`));
    setShowRmbPicker(false);
  };

  const productMatches = productSearch.trim()
    ? (products || []).filter((p) => (p.name || "").toLowerCase().includes(productSearch.trim().toLowerCase()))
    : (products || []).slice(0, 8);

  const pickProduct = (p) => {
    setName(p.name || "");
    setImage(p.image || "");
    setSpec([p.specSize ? `사이즈: ${p.specSize}` : "", p.material ? `재질: ${p.material}` : ""].filter(Boolean).join("\n"));
    setFactory(p.factory || "");
    setWechatGroup(p.wechatGroup || "");
    setFactoryLink(p.factoryLink || "");
    if (p.rmbCost) setRmbCost(p.rmbCost);
    if (p.totalShippingRmb) setTotalShippingRmb(p.totalShippingRmb);
    if (p.moqQuantity) setQuantity(p.moqQuantity); // 박스히어로 "(K)최소제작수량" 파싱값을 수량 기본값으로 자동 반영
    setShowProductPicker(false);
    setProductSearch("");
  };

  useEffect(() => {
    if (pickedProduct) {
      pickProduct(pickedProduct);
      if (onConsumePicked) onConsumePicked();
    }
  }, [pickedProduct]);

  const unitShippingPreview = Number(quantity) > 0 ? Number(totalShippingRmb || 0) / Number(quantity) : 0;

  const submit = () => {
    if (!name.trim() || !rmbCost) return;
    const qty = Number(quantity) || 0;
    onAdd({
      id: Date.now(), image, name, rmbCost: Number(rmbCost), quantity: qty,
      totalShippingRmb: Number(totalShippingRmb) || 0,
      unitShippingRmb: qty > 0 ? (Number(totalShippingRmb) || 0) / qty : 0,
      factory, factoryContact, wechatGroup, link, factoryLink, spec,
    });
    setImage(""); setName(""); setRmbCost(""); setQuantity(""); setTotalShippingRmb("");
    setFactory(""); setFactoryContact(""); setWechatGroup(""); setLink(""); setFactoryLink(""); setSpec("");
  };

  const toggle = (id) => setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  const allChecked = items.length > 0 && selected.length === items.length;
  const toggleAll = () => setSelected(allChecked ? [] : items.map((i) => i.id));
  const sendSelected = () => {
    const chosen = items.filter((i) => selected.includes(i.id));
    if (chosen.length === 0) return;
    onSendBulk(chosen);
    setSelected([]);
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
      {editingSourcingItem && (
        <SourcingEditModal item={editingSourcingItem} onClose={() => setEditingSourcingItem(null)}
          onSave={(id, patch) => { onUpdateItem(id, patch); setEditingSourcingItem(null); }} />
      )}
      <div className="space-y-6">
        <div className="text-xs font-semibold text-slate-400 tracking-wide px-1">1단계 · 가격조사 등록</div>
        <Card title="신규 가격조사 건 등록">
          <div className="mb-4 pb-4 border-b border-dashed border-slate-200">
            <button
              type="button" onClick={() => setShowProductPicker((v) => !v)}
              className="w-full flex items-center justify-between px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50"
            >
              <span>🔍 기존 제품 DB에서 불러오기</span>
              <span className="text-xs text-slate-400">{showProductPicker ? "닫기 ▲" : "열기 ▼"}</span>
            </button>
            {showProductPicker && (
              <div className="mt-2">
                <input
                  autoFocus value={productSearch} onChange={(e) => setProductSearch(e.target.value)}
                  placeholder="제품명으로 검색"
                  className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A] mb-2"
                />
                <div className="max-h-52 overflow-y-auto space-y-1">
                  {productMatches.length === 0 && <p className="text-xs text-slate-400 py-2 text-center">일치하는 제품이 없습니다.</p>}
                  {productMatches.map((p) => (
                    <button key={p.id} type="button" onClick={() => pickProduct(p)}
                      className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 text-left">
                      <div className="w-9 h-9 rounded bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
                        {p.image ? <img src={p.image} loading="lazy" className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[8px]">사진</span>}
                      </div>
                      <div className="min-w-0">
                        <div className="text-xs font-medium text-slate-700 truncate">{p.name}</div>
                        <div className="text-[10px] text-slate-400 truncate">{p.factory || "공장정보 없음"}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
          <Field label="제품 사진"><ImageUpload value={image} onChange={setImage} /></Field>
          <Field label="품명" hint="예: 40ml 유리 스포이드 용기"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="위안화 원가" hint="RMB/개 · 클릭하면 기존 데이터 불러오기">
              <div className="relative">
                <input ref={rmbInputRef} type="number" className={inputCls} value={rmbCost} onChange={(e) => setRmbCost(e.target.value)} onFocus={openRmbPicker} />
                {showRmbPicker && (
                  <>
                    <div className="fixed inset-0 z-10" onClick={() => setShowRmbPicker(false)} />
                    <div className="fixed z-20 bg-white border border-slate-300 rounded-lg shadow-xl max-h-[420px] overflow-y-auto" style={{ width: "760px", maxWidth: "92vw", top: rmbPickerPos.top, left: rmbPickerPos.left }}>
                    <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100 sticky top-0 bg-white">
                      <span className="text-sm font-semibold text-slate-600">"{name || "(품명 미입력)"}" 기존 데이터에서 선택</span>
                      <button onClick={() => setShowRmbPicker(false)} className="text-slate-300 hover:text-slate-500 text-lg leading-none">✕</button>
                    </div>
                    {!name.trim() ? (
                      <p className="text-sm text-slate-400 text-center py-8 px-4">먼저 위의 "품명"을 입력해주세요. 입력한 품명과 일치하는 제품의 기존 데이터만 여기에 표시됩니다.</p>
                    ) : rmbPickerRows.length === 0 ? (
                      <p className="text-sm text-slate-400 text-center py-8 px-4">"{name}"과(와) 일치하는 기존 데이터가 없습니다.</p>
                    ) : (
                      <table className="w-full text-sm">
                        <thead><tr className="text-slate-500 border-b border-slate-100 bg-slate-50">
                          <th className="text-left px-3 py-2 font-medium">제품명</th>
                          <th className="text-right px-3 py-2 font-medium">수량</th>
                          <th className="text-right px-3 py-2 font-medium">CBM</th>
                          <th className="text-right px-3 py-2 font-medium">단가(RMB)</th>
                          <th className="text-right px-3 py-2 font-medium">운송료</th>
                          <th className="text-left px-3 py-2 font-medium">공장명</th>
                          <th className="text-left px-3 py-2 font-medium">위챗 단체방명</th>
                          <th></th>
                        </tr></thead>
                        <tbody>
                          {rmbPickerRows.map((row, i) => (
                            <tr key={i} className="border-b border-slate-50 hover:bg-slate-50">
                              <td className="px-3 py-2">{row.product.name}</td>
                              <td className="px-3 py-2 text-right whitespace-nowrap">{row.qty || "-"}</td>
                              <td className="px-3 py-2 text-right whitespace-nowrap">{row.cbm || "-"}</td>
                              <td className="px-3 py-2 text-right whitespace-nowrap">{row.rmbCost}</td>
                              <td className="px-3 py-2 text-right whitespace-nowrap">{row.shippingRmb || "-"}</td>
                              <td className="px-3 py-2">{row.factory || "-"}</td>
                              <td className="px-3 py-2">{row.wechatGroup || "-"}</td>
                              <td className="px-3 py-2"><button onClick={() => pickFromRmbPicker(row)} className="text-[#1D4ED8] hover:underline font-medium whitespace-nowrap">선택 →</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                  </>
                )}
              </div>
            </Field>
            <Field label="수량" hint="개"><input type="number" className={inputCls} value={quantity} onChange={(e) => setQuantity(e.target.value)} /></Field>
          </div>
          <Field label="중국 내 운송료" hint={`총 RMB · 개당 자동환산 ${unitShippingPreview ? rmb(unitShippingPreview) + "/개" : ""}`}>
            <input type="number" className={inputCls} value={totalShippingRmb} onChange={(e) => setTotalShippingRmb(e.target.value)} placeholder="예: 200 (총액, RMB)" />
          </Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="위챗 단체방명" hint="발주 추적용"><input className={inputCls} value={wechatGroup} onChange={(e) => setWechatGroup(e.target.value)} placeholder="예: 潮迪塑料-BKBRO" /></Field>
            <Field label="공장명"><input className={inputCls} value={factory} onChange={(e) => setFactory(e.target.value)} placeholder="예: 广州潮迪塑料制品有限公司" /></Field>
          </div>
          <Field label="공장 연락처" hint="전화 / 위챗ID 등"><input className={inputCls} value={factoryContact} onChange={(e) => setFactoryContact(e.target.value)} placeholder="예: 138-xxxx-xxxx" /></Field>
          <Field label="1688 제품 링크"><input className={inputCls} value={link} onChange={(e) => setLink(e.target.value)} placeholder="https://detail.1688.com/..." /></Field>
          <Field label="공장 홈페이지 링크"><input className={inputCls} value={factoryLink} onChange={(e) => setFactoryLink(e.target.value)} placeholder="https://gzchaodi.1688.com/..." /></Field>
          <Field label="상세 스펙 및 비고" hint="사이즈, 재질, 사양, 인쇄단가, 후가공, 생산기간, CBM 등 자유 기재">
            <AutoResizeTextarea value={spec} onChange={setSpec} minRows={7}
              placeholder={"사이즈: 63.5*162.5mm(펌프 포함)\n재질: PE\n화이트 용기 / 화이트 캡 기본 사양\n펌프 가운데 색상 변경 포함\n실크 인쇄: 1도당 단가 0.1위안/ea\n기타 후가공은 별도 견적\n예상 생산기간: 약 30일\n예상 부피: 약 4.5CBM"} />
          </Field>
          <button onClick={submit} className="w-full mt-1 py-2.5 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">＋ 가격조사 등록</button>
        </Card>
      </div>

      <div className="space-y-4">
        <div className="flex items-center justify-between px-1">
          <span className="text-xs font-semibold text-slate-400 tracking-wide">등록된 가격조사 목록 ({items.length}건)</span>
        </div>

        {items.length > 0 && (
          <div className="flex items-center justify-between bg-white border border-slate-200 rounded-xl px-4 py-3">
            <label className="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer">
              <input type="checkbox" checked={allChecked} onChange={toggleAll} className="w-4 h-4 accent-[#1E3A8A]" />
              전체 선택
            </label>
            <button
              onClick={sendSelected}
              disabled={selected.length === 0}
              className={"text-xs px-4 py-2 rounded-lg font-medium whitespace-nowrap " + (selected.length > 0 ? "bg-[#1E3A8A] text-white hover:opacity-90" : "bg-slate-100 text-slate-400 cursor-not-allowed")}
            >
              선택한 {selected.length}개 항목으로 통합 제안서 작성 →
            </button>
          </div>
        )}

        {items.length === 0 ? (
          <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-12 text-center text-slate-400 text-sm">등록된 가격조사 건이 없습니다.</div>
        ) : (
          <div className="space-y-3">
            {items.map((it) => (
              <SourcingCard key={it.id} item={it} checked={selected.includes(it.id)} onToggle={toggle} onSend={onSend}
                onEdit={setEditingSourcingItem} onDelete={onDeleteItem} />
            ))}
          </div>
        )}
      </div>
    </main>
  );
}

/* ===================== 3·4단계 placeholder ===================== */

function PlaceholderStage({ icon, title, desc, points }) {
  return (
    <main className="max-w-3xl mx-auto px-6 py-16 text-center">
      <div className="w-14 h-14 rounded-2xl bg-[#1E3A8A]/10 text-2xl flex items-center justify-center mx-auto mb-4">{icon}</div>
      <h2 className="text-lg font-bold text-slate-800 mb-2">{title}</h2>
      <p className="text-sm text-slate-500 mb-6">{desc}</p>
      <div className="bg-white border border-slate-200 rounded-xl p-6 text-left">
        <div className="text-xs font-semibold text-slate-400 mb-3">다음 단계에서 구현 예정</div>
        <ul className="space-y-2 text-sm text-slate-600">
          {points.map((p, i) => <li key={i} className="flex gap-2"><span className="text-[#1D4ED8]">·</span>{p}</li>)}
        </ul>
      </div>
    </main>
  );
}

/* ===================== 3단계: 제안서 작성 (최종 확인 및 편집) ===================== */

function HistoryBadge({ record, compact }) {
  const [show, setShow] = useState(false);
  if (!record || (!record.createdAt && !record.updatedAt)) return null;
  return (
    <div className="relative inline-block">
      <button onClick={() => setShow((v) => !v)} onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}
        title="수정 이력"

          <div><span className="text-slate-400">최초 생성:</span> <b className="text-slate-700">{record.createdAt || "-"}</b>{record.createdBy ? ` (작성자: ${record.createdBy})` : ""}</div>
          <div><span className="text-slate-400">최근 수정:</span> <b className="text-slate-700">{record.updatedAt || "수정 이력 없음"}</b>{record.updatedBy ? ` (수정자: ${record.updatedBy})` : ""}</div>
        </div>
      )}
    </div>
  );
}

function ProposalEditStage({ draftItems, setDraftItems, removeDraftItem, clientInfo, setClientInfo, onBack, onSave, onPrint, readOnly, isEditingExisting, historyRecord, isAdmin }) {
  const updateItem = (id, field, value) => {
    if (readOnly) return;
    setDraftItems((prev) => prev.map((it) => {
      if (it.id !== id) return it;
      const next = { ...it, [field]: value };
      if (field === "quantity" || field === "unitPrice") {
        const q = field === "quantity" ? Number(value) || 0 : it.quantity;
        const p = field === "unitPrice" ? Number(value) || 0 : it.unitPrice;
        next.quantity = q; next.unitPrice = p; next.totalPrice = q * p;
      }
      return next;
    }));
  };

  const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
  const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);

  return (
    <main className="max-w-5xl mx-auto px-6 py-8 pb-28">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2">
          <div className="text-xs font-semibold text-slate-400 tracking-wide">3단계 · 제안서 작성 (최종 확인 · 편집)</div>
          {readOnly && <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">🔒 조회 전용</span>}
          {!readOnly && isEditingExisting && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 font-medium">✏️ 수정 중</span>}
          {historyRecord && <HistoryBadge record={historyRecord} />}
        </div>
        <button onClick={onBack} className="text-xs text-slate-500 hover:underline">← 이전 단계(제안가 계산)로</button>
      </div>

      <Card title="고객 정보">
        <Field label="제안서 제목" hint="예: 300ml/500ml PE 샴푸 용기 공급제안">
          <input disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.proposalTitle} onChange={(e) => setClientInfo({ ...clientInfo, proposalTitle: e.target.value })} placeholder="제안서 제목을 입력해주세요" />
        </Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="고객사명" hint="필수"><input disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.clientName} onChange={(e) => setClientInfo({ ...clientInfo, clientName: e.target.value })} placeholder="예: 주식회사 닥터스칼프" /></Field>
          <Field label="담당자명"><input disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.contact} onChange={(e) => setClientInfo({ ...clientInfo, contact: e.target.value })} placeholder="예: 홍길동" /></Field>
          <Field label="문의 채널">
            <select disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.channel} onChange={(e) => setClientInfo({ ...clientInfo, channel: e.target.value })}><option>카카오채널</option><option>이메일</option><option>전화</option></select>
          </Field>
          <Field label="담당 직원명" hint="필수"><input disabled={readOnly} className={inputCls + (readOnly ? " bg-slate-50 text-slate-500" : "")} value={clientInfo.employee} onChange={(e) => setClientInfo({ ...clientInfo, employee: e.target.value })} placeholder="예: 김직원" /></Field>
        </div>
      </Card>

      <div className="h-6" />

      <Card title={`품목 상세 (${draftItems.length}건)`} right={<span className="text-xs text-slate-400">{readOnly ? "조회 전용 — 수정하려면 목록에서 '불러오기/수정'을 이용해주세요" : "오탈자나 세부 내용을 셀에서 바로 수정할 수 있습니다"}</span>}>
        {draftItems.length === 0 ? (
          <p className="text-xs text-slate-400 py-6 text-center">담긴 품목이 없습니다. 이전 단계에서 품목을 추가해주세요.</p>
        ) : (
          <div className="space-y-4">
            {draftItems.map((it) => (
              <div key={it.id} className="border border-slate-200 rounded-xl p-4 flex gap-4">
                <div className="w-16 h-16 rounded-lg bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
                  {it.image ? <img src={it.image} loading="lazy" className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[10px]">사진</span>}

                  <Field label="단가(ea)"><EditNumberField value={it.unitPrice} onChange={(v) => updateItem(it.id, "unitPrice", v)} className={inputCls} readOnly={readOnly} /></Field>
                  <Field label="사이즈"><AutoResizeTextarea value={it.specSize} onChange={(v) => updateItem(it.id, "specSize", v)} minRows={1} readOnly={readOnly} /></Field>
                  <Field label="재질"><AutoResizeTextarea value={it.material} onChange={(v) => updateItem(it.id, "material", v)} minRows={1} readOnly={readOnly} /></Field>

                  <Field label="비고" span={4}><AutoResizeTextarea value={it.notes} onChange={(v) => updateItem(it.id, "notes", v)} minRows={3} readOnly={readOnly} /></Field>

              </div>
            ))}
            <div className="flex justify-end gap-6 pt-3 border-t border-slate-100 text-xs">
              <span className="text-slate-500">총 CBM <b className="text-slate-700">{totalCbm}</b></span>
              <span className="text-slate-500">총 제안금액 <b className="text-[#1E3A8A] text-sm">{won(totalAmount)}</b></span>
            </div>
          </div>
        )}
      </Card>

      <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-2px_8px_rgba(0,0,0,0.04)] no-print">
        <div className="max-w-5xl mx-auto px-6 py-4 flex justify-end gap-3">

function ExcelArchiveView({ archive, onBack, onUpload, onUploadZip, onApplyAll, onDelete, onApply, onResetExcelData, onDeleteAllUploaded }) {
  const [busy, setBusy] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef(null);
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;

  const sortedArchive = [...archive].sort((a, b) => (b.fileName || "").localeCompare(a.fileName || "", "ko"));
  const totalPages = Math.max(1, Math.ceil(sortedArchive.length / PAGE_SIZE));
  const pagedArchive = sortedArchive.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { if (page > totalPages) setPage(totalPages); }, [totalPages]);

  const processFile = async (file) => {
    if (!file) return;
    setBusy(true);
    try {
      if (/\.zip$/i.test(file.name)) await onUploadZip(file);
      else await onUpload(file);
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  };

  const handleFile = async (e) => { await processFile(e.target.files && e.target.files[0]); };
  const handleDrop = async (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    await processFile(file);
  };

  const download = (item) => {
    if (!item.fileData) { alert("이 파일은 용량이 커서 원본이 보관되지 않았습니다. (자동 분석된 데이터는 정상적으로 반영되어 있습니다)"); return; }
    const a = document.createElement("a");
    a.href = item.fileData;
    a.download = item.fileName;
    a.click();
  };

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">📂 엑셀 보관함 (데이터룸)</h2>
        <div className="flex gap-2">
          {onApplyAll && <button onClick={onApplyAll} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">🔗 전체 파이프라인 적용</button>}
          {onDeleteAllUploaded && <button onClick={onDeleteAllUploaded} className="px-4 py-2 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium hover:bg-red-100 whitespace-nowrap">🗑️ 업로드 제품 전체 삭제</button>}
          {onResetExcelData && <button onClick={onResetExcelData} className="px-4 py-2 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium hover:bg-red-100 whitespace-nowrap">🧹 엑셀 연동 데이터 전체 초기화</button>}
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={handleDrop}
        className={"bg-white border shadow-sm rounded-xl p-4 mb-6 transition-colors " + (dragOver ? "border-[#1E3A8A] bg-[#1E3A8A]/5" : "border-slate-300")}
      >
        <p className="text-xs text-slate-500 mb-3">
          견적 엑셀 파일(.xlsx) 또는 여러 엑셀을 묶은 ZIP 압축파일을 업로드(또는 이 영역에 드래그앤드롭)하면 '가격조사'/'제안가격'/'제안서(원화)' 시트를 자동으로 분석해서
          업체·공장·제품·제안서 목록에 <b>업로드 시 1회만</b> 자동 등록됩니다. ZIP 안에 PDF 등 다른 파일이 섞여 있어도 .xlsx만 골라서 처리합니다. "🔗 파이프라인 적용"을 처음 누르면 공장 홈페이지링크·제품 수량별 단가 등도 함께 심층 반영되고, 이후에는 데이터를 3단계로 다시 불러오기만 합니다.
        </p>
        <button onClick={() => fileRef.current && fileRef.current.click()} disabled={busy} className="text-sm px-4 py-2 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 disabled:opacity-50 whitespace-nowrap">
          {busy ? "분석 중..." : "📥 견적 엑셀/ZIP 업로드 (.xlsx, .zip)"}
        </button>
        <span className="text-xs text-slate-400 ml-2">또는 이 영역에 파일을 끌어다 놓으세요</span>
        <input ref={fileRef} type="file" accept=".xlsx,.zip" className="hidden" onChange={handleFile} />
      </div>

      {archive.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">아직 보관된 엑셀 파일이 없습니다.</div>
      ) : (
        <div className="bg-white border border-slate-300 shadow-sm rounded-xl overflow-hidden overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              <th className="text-left px-4 py-3 font-medium">파일명</th>
              <th className="text-left px-4 py-3 font-medium">업로드 일시</th>
              <th className="text-left px-4 py-3 font-medium">거래처명</th>
              <th className="text-right px-4 py-3 font-medium">총 금액</th>
              <th className="text-right px-4 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {pagedArchive.map((item, idx) => (
                <tr key={item.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  <td className="px-4 py-3 font-medium" style={{ color: "#111827" }}>
                    {item.fileName}
                    <div className="text-xs text-slate-400 font-normal mt-0.5">품목 {item.itemCount || 0}건</div>
                  </td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{item.uploadedAt}</td>
                  <td className="px-4 py-3" style={{ color: "#1E293B" }}>{item.clientName}</td>
                  <td className="px-4 py-3 text-right font-semibold whitespace-nowrap" style={{ color: "#1E293B" }}>{won(item.totalAmount)}</td>
                  <td className="px-4 py-3 text-right whitespace-nowrap">
                    <div className="flex gap-1.5 justify-end">
                      <button onClick={() => onApply(item)} className={"text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap font-medium " + (item.pipelineApplied ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-[#1E3A8A] text-white hover:opacity-90")}>
                        {item.pipelineApplied ? "✅ 적용 완료" : "🔗 파이프라인 적용"}
                      </button>
                      <button onClick={() => download(item)} className="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 whitespace-nowrap">⬇ 다운로드</button>
                      <button onClick={() => onDelete(item)} className="text-xs px-2.5 py-1.5 rounded-lg border border-red-100 text-red-500 hover:bg-red-50">🗑️ 삭제</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={sortedArchive.length} />
    </main>
  );
}

function ClientsView({ clients, proposals, onBack, onAdd, onUpdate, onDelete, onOpenProposal, isAdmin }) {
  const [openClient, setOpenClient] = useState(null);
  const [search, setSearch] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingClient, setEditingClient] = useState(null);
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;

  // 업체명이 동일한 중복 레코드를 하나로 병합 — 대표 카드는 먼저 등록된 값을 기준으로 하되 비어있는 필드는 나중 레코드 값으로 보강,
  // _mergedIds에 병합된 모든 원본 id를 모아두어 견적이력 합산·일괄삭제에 사용
  const mergedClients = useMemo(() => {
    const map = new Map();
    clients.forEach((c) => {
      const key = (c.name || "").trim();
      if (!key) { map.set("__unnamed_" + c.id, { ...c, _mergedIds: [c.id] }); return; }
      const existing = map.get(key);
      if (!existing) {
        map.set(key, { ...c, _mergedIds: [c.id] });
      } else {
        map.set(key, {
          ...existing,
          contact: existing.contact || c.contact,
          channel: existing.channel || c.channel,
          difficulty: existing.difficulty || c.difficulty,
          note: existing.note || c.note,
          source: existing.source || c.source,
          _mergedIds: [...existing._mergedIds, c.id],
        });
      }
    });
    return Array.from(map.values());
  }, [clients]);

  const filtered = mergedClients
    .filter((c) => !search.trim() || (c.name || "").toLowerCase().includes(search.trim().toLowerCase()) || (c.contact || "").toLowerCase().includes(search.trim().toLowerCase()))
    .sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko"));

  useEffect(() => { setPage(1); }, [search]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedClients = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  return (
    <main className="max-w-6xl mx-auto px-6 py-8">
      {showForm && <ClientFormModal onClose={() => setShowForm(false)} onSave={(id, c) => { onAdd(c); setShowForm(false); }} />}
      {editingClient && <ClientFormModal client={editingClient} onClose={() => setEditingClient(null)} onSave={(id, patch) => { onUpdate(id, patch); setEditingClient(null); }} />}
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-lg font-bold text-slate-800">🏢 업체(고객사) 관리</h2>
        <div className="flex gap-2">

                        ))}
                      </tbody>

                  )}

              )}
            </div>
          );
        })}
      </div>
      <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
    </main>
  );
}

/* ===================== 공장(OEM) 관리 ===================== */

function Pagination({ page, totalPages, onChange, totalItems }) {
  if (totalPages <= 1 && !totalItems) return null;
  const pages = [];
  const start = Math.max(1, page - 2);
  const end = Math.min(totalPages, start + 4);
  for (let i = start; i <= end; i++) pages.push(i);
  return (
    <div className="flex flex-wrap items-center justify-between gap-3 bg-blue-50 rounded-xl px-4 py-3 mt-2">
      <span className="text-sm font-medium" style={{ color: "#1E293B" }}>
        총 <b style={{ color: "#111827" }}>{(totalItems || 0).toLocaleString("ko-KR")}</b>건 · {page}/{totalPages} 페이지
      </span>
      <div className="flex items-center gap-1.5">
        <button onClick={() => onChange(1)} disabled={page === 1} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }} title="맨 처음으로">⏮️ 맨 처음으로</button>
        <button onClick={() => onChange(Math.max(1, page - 1))} disabled={page === 1} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }}>← 이전</button>
        {start > 1 && <span className="px-1 text-slate-400">…</span>}
        {pages.map((p) => (
          <button key={p} onClick={() => onChange(p)} className={"w-9 h-9 rounded-lg text-sm font-semibold " + (p === page ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-300 hover:bg-slate-50")} style={p === page ? {} : { color: "#1E293B" }}>{p}</button>
        ))}
        {end < totalPages && <span className="px-1 text-slate-400">…</span>}
        <button onClick={() => onChange(Math.min(totalPages, page + 1))} disabled={page === totalPages} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-medium disabled:opacity-40 hover:bg-slate-50 whitespace-nowrap" style={{ color: "#1E293B" }}>다음 →</button>
      </div>
    </div>
  );
}
