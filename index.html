/* 고객 승인 여부 판정 — 저장 필드가 여러 세대에 걸쳐 생겨서 전부 인정한다.
   isApproved/approvedAt(현행) · consentStatus/consentAt(고객 승인페이지가 쓰던 값) ·
   customerConfirmed(예전 "발송완료시 자동체크" 플래그). 하나라도 서면 승인완료로 본다. */
/* 5단계 본품 인보이스 목록의 "상태" 표준 배지 —
   기존엔 제안서용 REVIEW_STATUS(검토대기/승인완료/고객동의완료/고객승인완료…)가 그대로 흘러와
   같은 뜻인데 명칭이 여러 갈래로 보였다. 인보이스는 아래 4단계로만 정리한다.
   ⚠️ 판정 순서 주의: 긴급승인 > 고객승인 > 발송완료 > 검토대기 (뒤 조건이 앞을 덮지 않게) */
/* 고객 요청사항 상태 판정 —
   요청이 있고, 그 요청이 "확인 처리된 시각(customerRequestHandledAt)" 이후에 온 게 아니면 미처리로 본다.
   ⚠️ 단순 플래그(handled:true)로 두면 확인 후 고객이 추가 요청을 보내도 계속 처리완료로 남아 놓친다.
      그래서 "요청 시각 > 확인 시각"이면 다시 미처리로 돌아오도록 시각을 비교한다. */
function getRequestState(p) {
  const text = ((p && p.customerRequest) || "").trim();
  if (!text) return { has: false, pending: false, text: "" };
  const at = (p && p.customerRequestAt) || "";
  const handledAt = (p && p.customerRequestHandledAt) || "";
  const pending = !handledAt || (at && at > handledAt); // 문자열 일시는 사전순 비교가 곧 시간순
  return { has: true, pending, text, at, handledAt, handledBy: (p && p.customerRequestHandledBy) || "" };
}

function getInvoiceBadge(iv) {
  if (!iv) return { label: "검토대기", cls: "bg-slate-100 text-slate-600" };
  const st = iv.reviewStatus || iv.status || "";
  const customerApproved = iv.consentStatus === "승인완료" || iv.consentStatus === "동의완료" || st === "고객승인완료" || st === "고객동의완료";
  /* 고객이 최종 승인하면 그게 가장 확정된 상태이므로 긴급승인보다 앞선다.
     단, 긴급승인 이력은 사라지지 않는다 — 툴팁(HistoryBadge)의 "긴급승인일자"에 그대로 남아 사후 검증 가능. */
  if (customerApproved) {
    return { label: "고객승인", cls: "bg-emerald-100 text-emerald-800", at: iv.consentAt, by: iv.consentSignerName };
  }
  if (st === "긴급승인" || iv.emergencyApprovedAt) {
    return { label: "긴급승인", cls: "bg-purple-100 text-purple-800", at: iv.emergencyApprovedAt, by: iv.emergencyApprovedBy };
  }
  if (iv.sentBy || st === "발송완료") {
    return { label: "발송완료", cls: "bg-blue-100 text-blue-800", at: iv.sentAt, by: iv.sentBy };
  }
  return { label: "검토대기", cls: "bg-slate-100 text-slate-600" };
}

function getSampleApproval(s) {
  if (!s) return { approved: false, at: "" };
  const at = s.approvedAt || s.consentAt || "";
  const approved = !!(s.isApproved || at || s.consentStatus === "승인완료" || s.consentStatus === "동의완료" || s.customerConfirmed);
  return { approved, at };
}

/* 목록의 "배송방식" 표기 규칙.
   CT 맞춤샘플은 중국 공장에서 제작 후 항공 특송으로만 발송되므로 항상 "항공특송"으로 표기한다.
   ⚠️ 저장값(shippingMethod)은 이 시스템의 정식 키인 "항공"을 그대로 쓴다 — 배송비 설정 테이블(shippingFees)과
   상세모달의 배송방식 select가 전부 "일반"/"항공" 키를 기준으로 동작하기 때문에, 여기에 "항공특송"이라는
   문자열을 저장해버리면 금액 조회가 0원이 되고 select도 "미선택"으로 떨어진다. 표기만 바꾸는 이유가 이것.
   CT의 실제 특송비는 배송비 설정이 아니라 CT 인보이스의 "항공 특송비"에서 건별로 입력받으므로 금액은 붙이지 않는다. */
function sampleShippingText(s, shippingFees) {
  const fees = shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES;
  const method = s && s.shippingMethod;
  if (getSampleType(s) === "ct") return method === "일반" ? `일반 (${(fees["일반"] || 0).toLocaleString("ko-KR")}원)` : "항공특송";
  if (!method) return `일반 (${(fees["일반"] || 0).toLocaleString("ko-KR")}원)`; // 미지정 일반샘플은 기본 배송조건으로 안내
  return `${method} (${(fees[method] || 0).toLocaleString("ko-KR")}원)`;
}

};
const REVIEW_STATUS_COLORS = {

// 작성자/발송자 등 사람 이름 뒤에 직급이 붙어 저장된 경우(예: "이수림 과장") 화면에는 실명만 깔끔하게 보여준다.
// 저장된 원본 값은 건드리지 않고 표시할 때만 잘라내는 방식 — 계정관리에서 이름을 고치면 그게 바로 반영되고, 이 함수는 옛 기록에 남은 직급 접미사만 화면에서 정리해준다.
const STAFF_TITLE_SUFFIXES = ["사원", "주임", "대리", "과장", "차장", "부장", "팀장", "실장", "이사", "상무", "전무", "부사장", "사장", "대표", "회장", "반장", "소장"];
function displayStaffName(name) {
  if (!name) return name;
  const trimmed = name.trim();
  for (const title of STAFF_TITLE_SUFFIXES) {
    if (trimmed.endsWith(" " + title)) return trimmed.slice(0, -(title.length + 1)).trim();
  }
  return trimmed;
}
const getReviewStatus = (p) => p.reviewStatus || "검토대기";
// 직원 권한 기준으로, 이미 승인완료/발송완료된 제안서는 수정·삭제를 잠금
const isReviewLockedForStaff = (p, isAdmin) => !isAdmin && ["승인완료", "발송완료"].includes(getReviewStatus(p));

function parseCreatedAt(val) {
  if (!val) return null;
  if (typeof val === "string") {
    const d = new Date(val.replace(" ", "T"));
    return isNaN(d.getTime()) ? null : d;
  }
  if (typeof val.toDate === "function") { try { return val.toDate(); } catch (e) { return null; } }
  if (typeof val.seconds === "number") return new Date(val.seconds * 1000);
  return null;
}
function formatCreatedAt(val) {
  const d = parseCreatedAt(val);
  if (!d) return "-";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 제안서 목록의 "발송일시" 컬럼을 날짜/시간 2줄로 슬림하게 표시하기 위한 분리버전
function formatCreatedAtParts(val) {
  const d = parseCreatedAt(val);
  if (!d) return { date: "-", time: "" };
  const p = (n) => String(n).padStart(2, "0");
  return { date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`, time: `${p(d.getHours())}:${p(d.getMinutes())}` };
}

function proposalMarginProfit(p) {
  const withSnap = (p.items || []).filter((it) => it.calcSnapshot);
  if (withSnap.length === 0) return { avgMargin: null, totalProfit: null };
  const avgMargin = withSnap.reduce((s, it) => s + (it.calcSnapshot.marginRate || 0), 0) / withSnap.length;
  const totalProfit = withSnap.reduce((s, it) => s + (it.calcSnapshot.totalProfit || 0), 0);
  return { avgMargin, totalProfit };
}

function ProposalListView({ proposals, onBack, onNewProposal, onOpenPdf, onView, onLoad, onCopy, onDelete, onStatusChange, onReviewStatusChange, onCreateSample, onCreateInvoice, onHandleRequest, onBulkDelete, onBulkCompressImages, bulkCompressProgress, isAdmin }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("전체");
  const [sortKey, setSortKey] = useState("date_desc");
  const [selectedIds, setSelectedIds] = useState([]);
  const [groupByClient, setGroupByClient] = useState(false);
  const [openClient, setOpenClient] = useState(null);
  const [pendingOnly, setPendingOnly] = useState(false);
  const [page, setPage] = useState(() => (parseKoreanHash().view === "제안서목록" ? parseKoreanHash().page : 1));
  useHashPageSync("제안서목록", page);
  const PAGE_SIZE = 20;

  const pendingCount = useMemo(() => proposals.filter((p) => getReviewStatus(p) === "검토대기").length, [proposals]);
  // 💬 고객이 열람 링크에서 남긴 요청사항이 있는 건
  const [requestOnly, setRequestOnly] = useState(false);
  const [requestView, setRequestView] = useState(null); // 💬 클릭시 고객 요청 원문을 보여줄 제안서
  // 미처리(=아직 [✅ 확인] 안 누른) 건만 집계 — 확인 즉시 카운트에서 빠진다
  const requestCount = useMemo(() => proposals.filter((p) => getRequestState(p).pending).length, [proposals]);

  const filtered = useMemo(() => proposals.filter((p) => {
    if (pendingOnly && getReviewStatus(p) !== "검토대기") return false;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      const hay = `${p.clientName || ""} ${p.proposalTitle || ""} ${p.itemSummary || ""} ${p.code || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (statusFilter !== "전체" && getReviewStatus(p) !== statusFilter) return false;
    if (requestOnly && !getRequestState(p).pending) return false; // 💬 고객요청접수 필터(미처리만)
    return true;
  }), [proposals, pendingOnly, search, statusFilter, requestOnly]);
  const sortedFiltered = useMemo(() => sortByKey(filtered, sortKey, (p) => p.clientName, (p) => p.createdAt), [filtered, sortKey]);

  const grouped = useMemo(() => {
    const g = {};
    sortedFiltered.forEach((p) => {
      const key = p.clientName || "(고객사 미지정)";
      if (!g[key]) g[key] = [];
      g[key].push(p);
    });
    return g;
  }, [sortedFiltered]);

  useEffect(() => { setPage(1); }, [search, statusFilter, groupByClient, pendingOnly, requestOnly, sortKey]);
  useEffect(() => { setSelectedIds([]); }, [page, search, statusFilter, requestOnly, sortKey]);
  const totalPages = Math.max(1, Math.ceil(sortedFiltered.length / PAGE_SIZE));
  const pagedList = sortedFiltered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  const allPagedSelected = pagedList.length > 0 && pagedList.every((p) => selectedIds.includes(p.id));
  const toggleSelectAll = () => setSelectedIds(allPagedSelected ? [] : pagedList.map((p) => p.id));
  const toggleSelectOne = (id) => setSelectedIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  const ActionButtons = ({ p }) => {
    const locked = false; // 직원도 승인완료/발송완료 상태와 무관하게 수정할 수 있도록 완화됨(요청에 따름) — 삭제 권한은 그대로 제한됨(아래 onDelete는 isReviewLockedForStaff를 그대로 사용)
    const iconBtn = "w-8 h-8 shrink-0 flex items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm leading-none";
    return (
      <div className="grid grid-cols-4 gap-1 justify-items-center" style={{ width: "150px", minWidth: "150px" }}>
        <button onClick={() => onOpenPdf(p)} title="PDF 제안서" className={iconBtn}>👁️</button>
        {locked ? (
          <span className="w-8 h-8 shrink-0 flex items-center justify-center rounded-lg bg-slate-50 text-slate-400 text-sm" title="승인/발송완료된 제안서는 대표님만 수정할 수 있습니다">🔒</span>
        ) : (
          <button onClick={() => onLoad(p)} title="수정" className={iconBtn}>✏️</button>
        )}
        <button onClick={() => onCopy(p)} title="복사" className={iconBtn}>📋</button>
        {onCreateSample && (
          <button onClick={() => onCreateSample(p)} title="샘플신청 — 고객이 실제로 샘플을 요청한 경우에만 눌러주세요" className={iconBtn + " border-emerald-200 text-emerald-600 hover:bg-emerald-50"}>🧪</button>
        )}
        {onCreateInvoice && (
          <button onClick={() => onCreateInvoice(p)} title="인보이스요청" className={iconBtn + " border-purple-200 text-purple-600 hover:bg-purple-50"}>📄</button>
        )}
        {/* 💬 고객요청 — 휴지통 바로 왼쪽.
            미처리는 깜빡여서 눈에 띄게 하고, [✅ 확인] 처리한 건은 차분한 회색으로 가라앉힌다(내용은 계속 열람 가능) */}
        {(() => {
          const rq = getRequestState(p);
          if (!rq.has) return <span className={iconBtn + " border-slate-100 text-slate-200 cursor-default"} title="접수된 고객 요청사항이 없습니다">💬</span>;
          if (rq.pending) return (
            <button onClick={() => setRequestView(p)} title={`고객 요청사항 보기 (${rq.at || ""})`}
              className={iconBtn + " border-rose-300 text-rose-600 bg-rose-50 hover:bg-rose-100 animate-pulse"}>💬</button>
          );
          return (
            <button onClick={() => setRequestView(p)} title={`처리완료 — ${rq.handledAt}${rq.handledBy ? ` (${rq.handledBy})` : ""}\n요청내용 다시 보기`}
              className={iconBtn + " border-slate-200 text-slate-400 hover:bg-slate-50"}>💬</button>
          );
        })()}
        {isAdmin && <button onClick={() => onDelete(p)} title="삭제" className={iconBtn + " border-red-100 text-red-500 hover:bg-red-50"}>🗑️</button>}
        <HistoryBadge record={p} compact />
      </div>
    );
  };

  const ProposalRow = ({ p }) => {
    const reviewStatus = getReviewStatus(p);
    return (
      <tr className="border-t border-slate-100 hover:bg-slate-50/50">
        {isAdmin && onBulkDelete && (
          <td className="px-2 py-3 text-center" onClick={(e) => e.stopPropagation()}>
            <input type="checkbox" checked={selectedIds.includes(p.id)} onChange={() => toggleSelectOne(p.id)} />
          </td>
        )}
        <td className="px-3 py-3 text-xs whitespace-nowrap">
          <button onClick={() => onView(p)} className="text-[#1D4ED8] hover:underline font-medium" title="클릭하면 조회 전용으로 상세 내역을 확인할 수 있습니다">{p.code}</button>
        </td>
        <td className="px-3 py-3 text-xs text-slate-500 whitespace-nowrap leading-tight">
          <div>{formatCreatedAtParts(p.sentAt || p.createdAt).date}</div>
          <div>{formatCreatedAtParts(p.sentAt || p.createdAt).time}</div>
        </td>
        <td className="px-3 py-3 text-xs font-medium text-slate-800 leading-snug" style={{ wordBreak: "keep-all", overflowWrap: "break-word" }} title={p.clientName}>{p.clientName}</td>
        <td className="px-3 py-3 text-xs text-slate-600 text-center align-middle" title={(p.items || []).map((it) => it.productName).join(", ")}>
          <div className="flex flex-col items-center justify-center h-full gap-0.5">
            {(p.items && p.items.length > 0 ? p.items : [{ id: "x", productName: p.itemSummary }]).map((it, idx) => (
              <span key={it.id || idx} className="leading-snug" style={{ wordBreak: "keep-all" }}>{it.productName}</span>
            ))}
          </div>
        </td>
        <td className="px-3 py-3 text-sm text-right font-semibold text-[#1E3A8A] whitespace-nowrap">{won(p.totalAmount)}</td>
        <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{displayStaffName(p.createdBy) || "-"}</td>
        <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">
          {p.sentBy ? displayStaffName(p.sentBy) : <span className="text-slate-300">미발송</span>}
        </td>
        <td className="px-3 py-3" style={{ minWidth: "100px" }}>
          {(() => {
            /* 배지는 단계명 텍스트만 렌더링한다(날짜 결합 없음).
               고객 확인 일시는 배지에 붙이지 않고 title 툴팁으로만 확인한다. */
            const badge = <span title={p.customerCheckedAt ? `고객 확인 일시: ${p.customerCheckedAt}` : ""}
              className={"px-2.5 py-1 text-xs font-semibold rounded-full whitespace-nowrap " + (REVIEW_STATUS_COLORS[reviewStatus] || "bg-slate-100 text-slate-700")}>
              {REVIEW_STATUS_LABELS[reviewStatus] || reviewStatus}
            </span>;
            if (REVIEW_STATUS_AUTO_ONLY.includes(reviewStatus)) return badge; // 발송완료/샘플진행/인보이스는 그 누구도 드롭다운으로 되돌릴 수 없음 — 오직 해당 액션 버튼 경로로만 도달
            const myOptions = isAdmin ? REVIEW_STATUS_ADMIN_OPTIONS : REVIEW_STATUS_STAFF_OPTIONS;
            if (!isAdmin && !myOptions.includes(reviewStatus)) return badge; // 직원은 관리자가 다루는 중(수정중/승인완료)인 건은 손댈 수 없음, 조회만
            return (
              <select
                value={reviewStatus}
                onChange={(e) => onReviewStatusChange(p, e.target.value)}
                onClick={(e) => e.stopPropagation()}
                className={"text-xs px-2 py-1 rounded-full font-medium border-none outline-none cursor-pointer whitespace-nowrap " + (REVIEW_STATUS_COLORS[reviewStatus] || "bg-slate-100 text-slate-500")}
              >
                {myOptions.map((s) => <option key={s} value={s}>{REVIEW_STATUS_LABELS[s]}</option>)}
              </select>
            );
          })()}
        </td>
        <td className="px-2 py-3 align-top" style={{ minWidth: "165px" }}><ActionButtons p={p} /></td>
      </tr>
    );
  };

  return (
    <div className="max-w-7xl mx-auto px-6 py-8">
      {/* 💬 고객 요청사항 원문 조회 모달 */}
      {requestView && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={() => setRequestView(null)}>
          <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden flex flex-col" style={{ maxHeight: "85vh" }} onClick={(e) => e.stopPropagation()}>
            <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
              <div className="min-w-0">
                <h2 className="text-base font-bold text-slate-800">💬 고객 요청사항</h2>
                <p className="text-xs text-slate-500 mt-0.5 truncate">{requestView.clientName || "-"} · {requestView.customerRequestAt || ""}</p>
              </div>
              <button onClick={() => setRequestView(null)} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
            </div>
            <div className="p-6 overflow-y-auto flex-1 space-y-3">
              <div className={"rounded-xl p-4 text-sm text-slate-800 whitespace-pre-line leading-relaxed border " +
                (getRequestState(requestView).pending ? "bg-rose-50 border-rose-200" : "bg-slate-50 border-slate-200")}>
                {requestView.customerRequest}
              </div>
              {!getRequestState(requestView).pending && (
                <div className="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">
                  확인(처리완료) 됨 — {getRequestState(requestView).handledAt}
                  {getRequestState(requestView).handledBy ? ` (${displayStaffName(getRequestState(requestView).handledBy)})` : ""}
                </div>
              )}
            </div>
            <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
              <button
                onClick={() => {
                  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(requestView.customerRequest || "");
                  else window.prompt("아래 내용을 복사해 주세요.", requestView.customerRequest || "");
                }}
                className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">📋 복사</button>
              {onHandleRequest && getRequestState(requestView).pending && (
                <button
                  onClick={() => { onHandleRequest(requestView); setRequestView(null); }}
                  title="읽음·처리완료로 표시하고 접수 카운트에서 제외합니다"
                  className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold">✅ 확인</button>
              )}
              <button onClick={() => setRequestView(null)} className="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium">닫기</button>
            </div>
          </div>
        </div>
      )}

      <div className="flex items-center justify-between mb-6">
        <div><h2 className="text-lg font-bold text-slate-800">📋 제안서 관리 목록</h2><p className="text-xs text-slate-500 mt-1">전체 {proposals.length}건 · 검색결과 {filtered.length}건</p></div>
        <div className="flex items-center gap-2">
          {onNewProposal && (
            <button onClick={onNewProposal} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-indigo-700">+ 신규 제안서 작성</button>
          )}
          <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
        </div>
      </div>

      <div className="bg-white border border-slate-300 shadow-sm rounded-xl p-4 mb-6 flex flex-wrap gap-3 items-center">
        <input
          value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder="🔍 고객사명, 대표 제품명, 제안번호 검색"
          className="flex-1 min-w-[220px] px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
        />
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]">
          <option>전체</option>
          {["작성중", "검토대기", "수정중", "승인완료", "샘플진행", "인보이스"].map((o) => <option key={o}>{o}</option>)}
        </select>
        <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]">
          {SORT_OPTIONS_COMMON.map(([k, label]) => <option key={k} value={k}>정렬: {label}</option>)}
        </select>
        <button
          onClick={() => setPendingOnly((v) => !v)}
          className={"text-xs px-3 py-2 rounded-lg font-medium whitespace-nowrap " + (pendingOnly ? "bg-amber-500 text-white" : "border border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100")}
        >
          🔔 검토대기 제안서 ({pendingCount}건)
        </button>
        {(requestCount > 0 || requestOnly) && (
        <button
          onClick={() => setRequestOnly((v) => !v)}
          title="고객이 열람 링크에서 남긴 미처리 요청사항만 모아봅니다"
          className={"text-xs px-3 py-2 rounded-lg font-bold whitespace-nowrap " +
            (requestOnly ? "bg-rose-500 text-white" : "border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100") +
            (requestCount > 0 && !requestOnly ? " animate-pulse" : "")}
        >
          💬 고객요청접수 ({requestCount}건)
        </button>
        )}
        {isAdmin && onBulkCompressImages && (
          <button
            onClick={onBulkCompressImages}
            disabled={!!bulkCompressProgress}
            title="제안서·인보이스 안에 저장된 큰 사진을 다시 압축해서 목록 불러오는 속도를 개선합니다(화질은 거의 유지됩니다)"
            className="text-xs px-3 py-2 rounded-lg font-medium whitespace-nowrap border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            {bulkCompressProgress ? `🗜️ 압축 중... (${bulkCompressProgress.done}/${bulkCompressProgress.total})` : "🗜️ 제안서 사진 일괄 압축(속도 개선)"}
          </button>
        )}
        <button
          onClick={() => setGroupByClient((v) => !v)}
          className={"text-xs px-3 py-2 rounded-lg font-medium whitespace-nowrap " + (groupByClient ? "bg-[#1E3A8A] text-white" : "border border-slate-200 text-slate-600 hover:bg-slate-50")}
        >
          🏢 업체별 모아보기
        </button>
        {isAdmin && onBulkDelete && (
          <React.Fragment>
            <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer whitespace-nowrap">
              <input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /> 전체 선택
            </label>
            <button
              onClick={async () => { await onBulkDelete(selectedIds); setSelectedIds([]); }}
              disabled={selectedIds.length === 0}
              className="text-xs px-3 py-2 rounded-lg border border-red-200 text-red-600 font-medium hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap"
            >
              🗑️ 선택 삭제 ({selectedIds.length}개)
            </button>
          </React.Fragment>
        )}
      </div>

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-16 text-center text-slate-400 text-sm">
          {proposals.length === 0 ? "아직 저장된 제안서가 없습니다." : "검색 조건에 맞는 제안서가 없습니다."}
        </div>
      ) : groupByClient ? (
        <div className="space-y-3">
          {Object.entries(grouped).sort((a, b) => a[0].localeCompare(b[0], "ko")).map(([client, list]) => (
            <div key={client} className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm">
              <button onClick={() => setOpenClient(openClient === client ? null : client)} className="w-full flex items-center justify-between px-5 py-4 hover:bg-slate-50">
                <div className="flex items-center gap-2">
                  <span className="text-lg">📁</span>
                  <span className="font-semibold text-slate-800 text-sm">{client}</span>
                  <span className="text-xs text-slate-400">{list.length}건</span>
                </div>
                <span className="text-xs text-slate-400">{openClient === client ? "접기 ▲" : "펼치기 ▼"}</span>
              </button>
              {openClient === client && (
                <div className="overflow-x-auto border-t border-slate-100">
                  <table className="w-full table-fixed" style={{ tableLayout: "fixed", width: "100%" }}>
                    <ProposalTableColGroup withAction withCheckbox={isAdmin && !!onBulkDelete} />
                    <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
                      {isAdmin && onBulkDelete && (
                        <th className="text-center px-2 py-2 font-medium">
                          <input type="checkbox" checked={list.length > 0 && list.every((p) => selectedIds.includes(p.id))} onChange={() => {
                            const allIn = list.every((p) => selectedIds.includes(p.id));
                            setSelectedIds((prev) => allIn ? prev.filter((id) => !list.some((p) => p.id === id)) : [...new Set([...prev, ...list.map((p) => p.id)])]);
                          }} />
                        </th>
                      )}
                      <th className="text-left px-3 py-2 font-medium">제안번호</th><th className="text-left px-3 py-2 font-medium">발송일시</th>
                      <th className="text-left px-3 py-2 font-medium">고객사명</th><th className="text-left px-3 py-2 font-medium">대표 제품명</th>
                      <th className="text-right px-3 py-2 font-medium">총 제안금액</th><th className="text-left px-3 py-2 font-medium">작성자</th><th className="text-left px-3 py-2 font-medium">발송자</th><th className="text-left px-3 py-2 font-medium">검토상태</th><th className="text-right px-3 py-2 font-medium">작업</th>
                    </tr></thead>
                    <tbody>{list.map((p) => <ProposalRow key={p.id} p={p} />)}</tbody>
                  </table>
                </div>
              )}
            </div>
          ))}
        </div>
      ) : (
        <div>
          <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
            <table className="w-full table-fixed" style={{ tableLayout: "fixed", width: "100%" }}>
              <ProposalTableColGroup withAction withCheckbox={isAdmin && !!onBulkDelete} />
              <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
                {isAdmin && onBulkDelete && (
                  <th className="text-center px-2 py-3 font-medium"><input type="checkbox" checked={allPagedSelected} onChange={toggleSelectAll} /></th>
                )}
                <th className="text-left px-3 py-3 font-medium">제안번호</th><th className="text-left px-3 py-3 font-medium">발송일시</th>
                <th className="text-left px-3 py-3 font-medium">고객사명</th><th className="text-left px-3 py-3 font-medium">대표 제품명/품목요약</th>
                <th className="text-right px-3 py-3 font-medium">총 제안금액</th><th className="text-left px-3 py-3 font-medium">작성자</th><th className="text-left px-3 py-3 font-medium">발송자</th><th className="text-left px-3 py-3 font-medium">검토상태</th><th className="text-right px-3 py-3 font-medium">작업</th>
              </tr></thead>
              <tbody>{pagedList.map((p) => <ProposalRow key={p.id} p={p} />)}</tbody>
            </table>
          </div>
          <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />
        </div>
      )}
    </div>
  );
}

/* ===================== 📑 인보이스 목록 (본품계약/발주 데이터를 제안서목록과 같은 스타일로) ===================== */
function InvoiceListView({ invoices, onBack, onOpenInvoice, onDelete, onDuplicate, isAdmin }) {
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;

  /* 🏢 업체별 모아보기 state.
     ⚠️ 이전 커밋에서 토글 버튼만 들어가고 이 선언이 누락돼 #인보이스 진입시
        "isGroupByCompany is not defined" ReferenceError로 화면 전체가 빈 화면이 됐었다. */
  const [isGroupByCompany, setIsGroupByCompany] = useState(false);
  const [openClient, setOpenClient] = useState(null);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    const list = Array.isArray(invoices) ? invoices.filter(Boolean) : []; // null/비배열 방어
    const base = !q ? list : list.filter((iv) => ((iv && iv.clientName) || "").toLowerCase().includes(q) || ((iv && iv.code) || "").toLowerCase().includes(q));
    return [...base].sort((a, b) => (parseCreatedAt(b && b.createdAt) || 0) - (parseCreatedAt(a && a.createdAt) || 0));
  }, [invoices, search]);
  const grouped = useMemo(() => {
    const g = {};
    filtered.forEach((iv) => {
      const key = ((iv && iv.clientName) || "").trim() || "미지정 업체"; // 고객사명이 비어도 안전하게 분류
      if (!g[key]) g[key] = [];
      g[key].push(iv);
    });
    return g;
  }, [filtered]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedList = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { setPage(1); }, [search, isGroupByCompany]);

  const renderInvoiceTable = (list) => (
        <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full table-fixed" style={{ tableLayout: "fixed", width: "100%" }}>
            <colgroup>
              <col style={{ width: "13%" }} /><col style={{ width: "10%" }} /><col style={{ width: "15%" }} />
              <col style={{ width: "22%" }} /><col style={{ width: "12%" }} /><col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} /><col style={{ width: "10%" }} /><col style={{ width: "160px" }} />
            </colgroup>
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              <th className="text-left px-3 py-3 font-medium">인보이스번호</th>
              <th className="text-left px-3 py-3 font-medium">발행일시</th>
              <th className="text-left px-3 py-3 font-medium">고객사명</th>
              <th className="text-center px-3 py-3 font-medium">대표 제품명</th>
              <th className="text-right px-3 py-3 font-medium">총 금액</th>
              <th className="text-left px-3 py-3 font-medium">작성자</th>
              <th className="text-left px-3 py-3 font-medium">발송자</th>
              <th className="text-center px-3 py-3 font-medium">상태</th>
              <th className="text-center px-3 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {list.filter(Boolean).map((iv, idx) => {
                const reviewStatus = getReviewStatus(iv);
                return (
                  <tr key={iv.id || iv.code || idx} onClick={() => onOpenInvoice(iv, "view")} className="border-t border-slate-100 hover:bg-slate-50/50 cursor-pointer">
                    <td className="px-3 py-3 text-xs whitespace-nowrap"><span className="text-[#1D4ED8] font-medium">{iv.code || "-"}</span></td>
                    <td className="px-3 py-3 text-xs text-slate-500 whitespace-nowrap">{formatCreatedAt(iv.sentAt || iv.createdAt)}</td>
                    <td className="px-3 py-3 text-xs font-medium text-slate-800" style={{ wordBreak: "keep-all" }}>{iv.clientName || <span className="text-slate-300">미지정 업체</span>}</td>
                    {/* 품목 배열이 null이거나 productName이 빈 항목이 섞여 있어도 안전하게 표시 */}
                    <td className="px-3 py-3 text-xs text-slate-600 text-center" style={{ wordBreak: "keep-all" }}>
                      {(Array.isArray(iv.items) ? iv.items : []).map((it) => (it && it.productName) || "").filter(Boolean).join(", ") || <span className="text-slate-300">-</span>}
                    </td>
                    <td className="px-3 py-3 text-sm text-right font-semibold text-[#1E3A8A] whitespace-nowrap">{won(iv.totalAmount)}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{displayStaffName(iv.createdBy) || "-"}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{iv.sentBy ? displayStaffName(iv.sentBy) : <span className="text-slate-300">미발송</span>}</td>
                    <td className="px-3 py-3 text-center">
                      {(() => {
                        const b = getInvoiceBadge(iv);
                        return <span title={b.at ? `${b.label} ${b.at}${b.by ? ` (${b.by})` : ""}` : ""}
                          className={"px-2.5 py-1 text-xs font-bold rounded-full whitespace-nowrap " + b.cls}>{b.label}</span>;
                      })()}
                    </td>
                    <td className="px-3 py-3 text-center" onClick={(e) => e.stopPropagation()}>
                      <div className="flex justify-center gap-1">
                        <button onClick={() => onOpenInvoice(iv, "view")} title="상세 조회 및 PDF 인쇄" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm">👁️</button>
                        <button onClick={() => onOpenInvoice(iv, "edit")} title="인보이스 수정" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-[#1E3A8A]/5 hover:text-[#1E3A8A] text-sm">✏️</button>
                        {onDuplicate && <button onClick={() => onDuplicate(iv)} title="인보이스 복제(새로 작성)" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm">📑</button>}
                        {isAdmin && <button onClick={() => onDelete(iv)} title="인보이스 삭제" className="w-8 h-8 rounded-lg border border-red-100 text-red-500 hover:bg-red-50 text-sm">🗑️</button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
  );

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-lg font-bold text-slate-800">📑 인보이스</h2>
          <p className="text-xs text-slate-400 mt-1">5단계 · 본품계약/발주 목록입니다. 제안서에서 발행된 인보이스가 여기 모입니다.</p>
        </div>
        <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">← 돌아가기</button>
      </div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <input
          value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder="🔍 고객사명, 인보이스번호 검색"
          className="flex-1 min-w-[240px] px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
        />
        <button onClick={() => setIsGroupByCompany(!isGroupByCompany)}
          className={"flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-semibold whitespace-nowrap " +
            (isGroupByCompany ? "bg-indigo-50 border-indigo-300 text-indigo-700" : "bg-white border-slate-200 text-slate-700")}>
          🏢 업체별 모아보기
        </button>
      </div>
      {/* 테이블 본문 — 단일 목록과 업체별 그룹 아코디언이 같은 마크업을 공유한다(한쪽만 고쳐 어긋나는 일 방지) */}
      {pagedList.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-12 text-center text-slate-400 text-sm">발행된 인보이스가 없습니다. 제안서 미리보기에서 "📄 인보이스 발행"을 눌러 만들 수 있습니다.</div>
      ) : isGroupByCompany ? (
        <div className="space-y-3">
          {Object.entries(grouped).sort((a, b) => a[0].localeCompare(b[0], "ko")).map(([client, list]) => {
            const sum = list.reduce((s, iv) => s + (Number(iv && iv.totalAmount) || 0), 0);
            return (
              <div key={client} className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm">
                <button onClick={() => setOpenClient(openClient === client ? null : client)} className="w-full flex items-center justify-between px-5 py-4 hover:bg-slate-50">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-lg">🏢</span>
                    <span className="font-semibold text-slate-800 text-sm truncate">{client}</span>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold whitespace-nowrap">총 {list.length}건</span>
                    <span className="text-xs font-bold text-[#1E3A8A] whitespace-nowrap">합계 {won(sum)}</span>
                  </div>
                  <span className="text-xs text-slate-400 whitespace-nowrap">{openClient === client ? "접기 ▲" : "펼치기 ▼"}</span>
                </button>
                {openClient === client && <div className="border-t border-slate-100">{renderInvoiceTable(list)}</div>}
              </div>
            );
          })}
        </div>
      ) : (
        renderInvoiceTable(pagedList)
      )}
      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}
    </main>
  );
}

/* ===================== 📦 5단계 · 본품계약 & 공장 발주 목록 (인보이스 목록과 동일한 테이블 UI) ===================== */
function OrderStageListView({ orders, proposalList, invoiceList, onOpenProposal, onOpenInvoice }) {
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;

  // 5단계에 들어오는 두 가지 경로를 하나의 목록으로 합친다:
  // ① 4단계 샘플진행에서 "📜 본품계약 전환"된 건 ② 3단계 제안서에서 "📄 인보이스 확정(본품 전환)"으로 샘플 단계 없이 바로 넘어온 건
  const enriched = useMemo(() => {
    const fromSamples = orders.map((s) => ({
      key: `sample-${s.id}`, clientName: s.clientName, productName: s.productName,
      convertedAt: s.orderConvertedAt, convertedBy: s.orderConvertedBy,
      proposal: proposalList.find((p) => String(p.id) === String(s.linkedProposalId)),
      invoice: invoiceList.find((iv) => String(iv.proposalId) === String(s.linkedProposalId)),
    }));
    const sampleProposalIds = new Set(orders.map((s) => String(s.linkedProposalId)));
    const fromDirectInvoices = invoiceList
      .filter((iv) => !sampleProposalIds.has(String(iv.proposalId)))
      .map((iv) => ({
        key: `invoice-${iv.id}`, clientName: iv.clientName, productName: (iv.items || []).map((it) => it.productName).join(", "),
        convertedAt: iv.createdAt, convertedBy: iv.createdBy,
        proposal: proposalList.find((p) => String(p.id) === String(iv.proposalId)),
        invoice: iv,
      }));
    return [...fromSamples, ...fromDirectInvoices];
  }, [orders, proposalList, invoiceList]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    const base = !q ? enriched : enriched.filter((e) => (e.clientName || "").toLowerCase().includes(q) || (e.invoice && (e.invoice.code || "").toLowerCase().includes(q)));
    return [...base].sort((a, b) => (parseCreatedAt(b.convertedAt) || 0) - (parseCreatedAt(a.convertedAt) || 0));
  }, [enriched, search]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedList = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  // 🏢 업체별 모아보기 (인보이스 목록과 동일 방식)
  const [isGroupByCompany, setIsGroupByCompany] = useState(false);
  const [openClient, setOpenClient] = useState(null);
  const grouped = useMemo(() => {
    const g = {};
    filtered.forEach((e) => {
      const key = e.clientName || "(고객사 미지정)";
      if (!g[key]) g[key] = [];
      g[key].push(e);
    });
    return g;
  }, [filtered]);
  useEffect(() => { setPage(1); }, [search]);

  const renderOrderTable = (list) => (
        <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full table-fixed" style={{ tableLayout: "fixed", width: "100%" }}>
            <colgroup>
              <col style={{ width: "13%" }} /><col style={{ width: "10%" }} /><col style={{ width: "15%" }} />
              <col style={{ width: "22%" }} /><col style={{ width: "12%" }} /><col style={{ width: "9%" }} />
              <col style={{ width: "9%" }} /><col style={{ width: "10%" }} /><col style={{ width: "110px" }} />
            </colgroup>
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              <th className="text-left px-3 py-3 font-medium">인보이스/발주번호</th>
              <th className="text-left px-3 py-3 font-medium">발행일시</th>
              <th className="text-left px-3 py-3 font-medium">고객사명</th>
              <th className="text-center px-3 py-3 font-medium">대표 제품명</th>
              <th className="text-right px-3 py-3 font-medium">총 금액</th>
              <th className="text-left px-3 py-3 font-medium">작성자</th>
              <th className="text-left px-3 py-3 font-medium">발송자</th>
              <th className="text-center px-3 py-3 font-medium">상태</th>
              <th className="text-center px-3 py-3 font-medium">작업</th>
            </tr></thead>
            <tbody>
              {list.map(({ key, clientName, productName, convertedAt, convertedBy, proposal, invoice }) => {
                const reviewStatus = invoice ? getReviewStatus(invoice) : null;
                return (
                  <tr key={key} className="border-t border-slate-100 hover:bg-slate-50/50">
                    <td className="px-3 py-3 text-xs whitespace-nowrap">{invoice ? <span className="text-[#1D4ED8] font-medium">{invoice.code}</span> : <span className="text-slate-300">미발행</span>}</td>
                    <td className="px-3 py-3 text-xs text-slate-500 whitespace-nowrap">{formatCreatedAt((invoice && (invoice.sentAt || invoice.createdAt)) || convertedAt)}</td>
                    <td className="px-3 py-3 text-xs font-medium text-slate-800" style={{ wordBreak: "keep-all" }}>{clientName}</td>
                    <td className="px-3 py-3 text-xs text-slate-600 text-center" style={{ wordBreak: "keep-all" }}>{productName}</td>
                    <td className="px-3 py-3 text-sm text-right font-semibold text-[#1E3A8A] whitespace-nowrap">{invoice ? won(invoice.totalAmount) : "-"}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{displayStaffName(convertedBy) || "-"}</td>
                    <td className="px-3 py-3 text-xs text-slate-700 whitespace-nowrap">{invoice && invoice.sentBy ? displayStaffName(invoice.sentBy) : <span className="text-slate-300">미발송</span>}</td>
                    <td className="px-3 py-3 text-center">
                      {invoice ? (() => {
                        const b = getInvoiceBadge(invoice); // 인보이스 목록과 동일한 4단계 배지로 통일
                        return <span title={b.at ? `${b.label} ${b.at}${b.by ? ` (${b.by})` : ""}` : ""}
                          className={"px-2.5 py-1 text-xs font-bold rounded-full whitespace-nowrap " + b.cls}>{b.label}</span>;
                      })() : (
                        <span className="px-2.5 py-1 text-xs font-bold rounded-full whitespace-nowrap bg-purple-50 text-purple-700">계약전환완료</span>
                      )}
                    </td>
                    <td className="px-3 py-3 text-center">
                      <div className="flex justify-center gap-1">
                        <button
                          onClick={() => proposal ? onOpenProposal(proposal) : window.alert("연결된 원본 제안서를 찾을 수 없습니다.")}
                          title="📋 원본 제안서" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm"
                        >
                          📋
                        </button>
                        <button
                          onClick={() => invoice ? onOpenInvoice(invoice) : window.alert("아직 발행된 인보이스가 없습니다. 원본 제안서에서 '📄 인보이스 확정(본품 전환)'을 먼저 진행해주세요.")}
                          title="📄 인보이스" className="w-8 h-8 rounded-lg border border-purple-200 text-purple-700 hover:bg-purple-50 text-sm"
                        >
                          📄
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
  );

  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 className="text-lg font-bold text-slate-800">📦 5단계 · 본품계약 & 공장 발주 (Order & Final Invoice)</h2>
          <p className="text-xs text-slate-400 mt-1">4단계에서 "📜 본품계약 전환"된 건이 여기 모입니다. 원본 제안서와 발행 인보이스를 바로 확인할 수 있습니다.</p>
        </div>
      </div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <input
          value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder="🔍 고객사명, 인보이스번호 검색"
          className="flex-1 min-w-[240px] px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]"
        />
        <button onClick={() => setIsGroupByCompany(!isGroupByCompany)}
          className={"flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-semibold whitespace-nowrap " +
            (isGroupByCompany ? "bg-indigo-50 border-indigo-300 text-indigo-700" : "bg-white border-slate-200 text-slate-700")}>
          🏢 업체별 모아보기
        </button>
      </div>
      {pagedList.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-12 text-center text-slate-400 text-sm">아직 본품계약으로 전환된 건이 없습니다. 4단계 샘플 진행에서 "📜 본품계약 전환" 버튼을 눌러 등록해주세요.</div>
      ) : isGroupByCompany ? (
        <div className="space-y-3">
          {Object.entries(grouped).sort((a, b) => a[0].localeCompare(b[0], "ko")).map(([client, list]) => {
            const sum = list.reduce((s, e) => s + ((e.invoice && Number(e.invoice.totalAmount)) || 0), 0);
            return (
              <div key={client} className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm">
                <button onClick={() => setOpenClient(openClient === client ? null : client)} className="w-full flex items-center justify-between px-5 py-4 hover:bg-slate-50">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-lg">🏢</span>
                    <span className="font-semibold text-slate-800 text-sm truncate">{client}</span>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold whitespace-nowrap">총 {list.length}건</span>
                    <span className="text-xs font-bold text-[#1E3A8A] whitespace-nowrap">합계 {won(sum)}</span>
                  </div>
                  <span className="text-xs text-slate-400 whitespace-nowrap">{openClient === client ? "접기 ▲" : "펼치기 ▼"}</span>
                </button>
                {openClient === client && <div className="border-t border-slate-100">{renderOrderTable(list)}</div>}
              </div>
            );
          })}
        </div>
      ) : (
        renderOrderTable(pagedList)
      )}
      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}
    </main>
  );
}

/* ===================== PDF 제안서 미리보기 ===================== */

function EditField({ value, onChange, className, placeholder }) {
  return (
    <input
      value={value}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      className={"outline-none bg-transparent border-b border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors " + (className || "")}
    />
  );
}

function EditArea({ value, onChange, className, placeholder }) {
  const ref = useRef(null);
  const resize = (el) => { if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; };
  useEffect(() => { resize(ref.current); }, [value]);
  return (
    <textarea
      ref={ref}
      value={value}
      onChange={(e) => { onChange(e.target.value); resize(e.target); }}
      placeholder={placeholder}
      rows={1}
      style={{ overflow: "hidden", resize: "none" }}
      className={"outline-none bg-transparent border border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors w-full " + (className || "")}
    />
  );
}

function EditNumberField({ value, onChange, className, placeholder, readOnly }) {
  const display = value === "" || value === null || value === undefined ? "" : Number(value).toLocaleString("ko-KR");
  return (
    <input
      value={display}
      onChange={(e) => {
        if (readOnly) return;
        const raw = e.target.value.replace(/[^0-9.]/g, "");
        onChange(raw === "" ? 0 : Number(raw));
      }}
      placeholder={placeholder}
      inputMode="numeric"
      readOnly={readOnly}
      className={"outline-none bg-transparent border-b border-transparent hover:border-slate-300 focus:border-[#1D4ED8] focus:bg-amber-50/50 transition-colors " + (readOnly ? "bg-slate-50 text-slate-500 cursor-default " : "") + (className || "")}
    />
  );
}

const SEND_CHANNEL_OPTIONS = ["카카오톡", "카카오채널", "이메일", "팩스", "기타"];
function SendCompleteModal({ onConfirm, onClose }) {
  const [channel, setChannel] = useState(SEND_CHANNEL_OPTIONS[0]);
  const [customChannel, setCustomChannel] = useState("");
  const confirm = () => {
    const finalChannel = channel === "기타" ? (customChannel.trim() || "기타") : channel;
    onConfirm(finalChannel);
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[80] p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-sm overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800">🚀 발송완료 처리</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 space-y-3">
          <Field label="발송 채널">
            <div className="grid grid-cols-2 gap-2">
              {SEND_CHANNEL_OPTIONS.map((c) => (
                <button key={c} type="button" onClick={() => setChannel(c)} className={"text-xs px-3 py-2 rounded-lg font-medium border " + (channel === c ? "bg-[#1E3A8A] text-white border-[#1E3A8A]" : "border-slate-200 text-slate-600")}>{c}</button>
              ))}
            </div>
            {channel === "기타" && (
              <input
                autoFocus
                value={customChannel}
                onChange={(e) => setCustomChannel(e.target.value)}
                placeholder="발송 수단/사유 입력 (예: 직접 전달, 위챗)"
                className="mt-2 w-full text-xs px-3 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]"
              />
            )}
          </Field>
          <p className="text-xs text-slate-400">확인을 누르면 현재 로그인한 계정 이름과 지금 시각이 발송자 정보로 함께 기록됩니다.</p>
        </div>
        <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">취소</button>
          <button onClick={confirm} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">확인/발송완료 처리</button>
        </div>
      </div>
    </div>
  );
}

/* 인보이스 모드에서는 편집을 좌측 폼이 전담하므로, 우측 미리보기 안의 입력기를 정적 텍스트로 바꾼다.
   ⚠️ 이렇게 하는 결정적 이유: EditArea(textarea)는 scrollHeight로 높이를 잡는데, 탭 전환으로
   display:none 상태에서 마운트되면 높이가 0으로 접혀 본문이 통째로 사라진다(계약서에서 겪은 그 버그).
   제안서 모드(ro=false)는 기존처럼 미리보기에서 직접 편집 가능하다. */
function PvField({ ro, value, onChange, className, placeholder }) {
  if (ro) return <span className={className}>{value || ""}</span>;
  return <EditField value={value} onChange={onChange} className={className} placeholder={placeholder} />;
}
function PvArea({ ro, value, onChange, className }) {
  // pre-wrap: 줄바꿈·연속공백 그대로 / break-word: 긴 영문·숫자 문자열도 셀 밖으로 안 넘침
  if (ro) return <span className={className} style={{ whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{value || ""}</span>;
  return <EditArea value={value} onChange={onChange} className={className} />;
}
function PvNumber({ ro, value, onChange, className }) {
  if (ro) return <span className={className}>{value === "" || value === null || value === undefined ? "" : Number(value).toLocaleString("ko-KR")}</span>;
  return <EditNumberField value={value} onChange={onChange} className={className} />;
}

  const items = invoice.items || [];

  const totalQty = items.reduce((s, it) => s + (Number(it.quantity) || 0), 0);
  const itemsTotal = items.reduce((s, it) => s + (Number(it.totalPrice) || 0), 0);
  /* 차감(샘플비 등)이 있으면 공급가액에서 먼저 뺀다 — 안 그러면 고객에게 안내되는 청구 금액이

     옛 문서(차감 필드 없음)도 있으므로 없을 때는 품목 합계로 폴백한다. */
  const invDiscount = Math.min(Math.max(Number(invoice.discountAmount) || 0, 0), itemsTotal);
  const supplyTotal = invoice.totalAmount != null ? Number(invoice.totalAmount) : (itemsTotal - invDiscount);
  const grandTotal = supplyTotal + Math.floor(supplyTotal * 0.1); // 부가세 포함 총 청구금액

  /* 고객사에 그대로 나가는 표준 문구(대기업 B2B 서식) — 임의로 줄이거나 표현을 바꾸지 말 것.

    `• 공급 품목 : ${shortenForMessage(productLabel)}\n` +
    `• 청구 금액 : ₩${supplyTotal.toLocaleString()} (부가세 별도)\n` +
    `• 열람 기한 : 발행일로부터 30일\n` +

          </div>

          <Field label="승인 링크">

          </Field>

          {/* 복사 = 발송 처리 — 이 버튼을 눌러야 상태가 [발송완료]로 넘어가고 발송자(로그인 사용자)가 기록된다.
              예전엔 문구만 복사되고 상태가 [검토대기]에 머물러 있었다. */}

            className="w-full px-3 py-2.5 rounded-lg bg-amber-400 text-slate-900 text-sm font-bold">

          </p>

}

function PdfPreview({ open, onClose, data, supplierLogo, onSendComplete, onCreateSample, onCreateInvoice, onSave, onEmergencyApprove, mode }) {
  const isInvoice = mode === "invoice";
  const [showSendModal, setShowSendModal] = useState(false);
  const [greeting, setGreeting] = useState(isInvoice ? INVOICE_GREETING : GREETING);
  const [terms, setTerms] = useState(isInvoice ? INVOICE_TERMS : TERMS);
  const [supplier, setSupplier] = useState(SUPPLIER);
  // 인보이스 모드에서만 쓰는 문서 탭 — "invoice"(인보이스 서식) | "contract"(화장품용기 공급계약서)
  // 인보이스 모달은 인보이스 서식 하나만 보여준다(계약서는 업체 관리 전담).
  // 계약서 렌더링이 필요한 곳(업체관리 계약서 모달·고객 서명 페이지)은 data.docTabOverride로 지정한다.
  const [contractDate, setContractDate] = useState(todayDisplay()); // 계약체결일자
  const [clientCeo, setClientCeo] = useState(""); // (갑) 대표자명
  const [clientAddress, setClientAddress] = useState(""); // (갑) 주소 — 공급계약서 서명란에 연동
  /* 차감/할인 — 발행 단계(InvoiceEditModal)에서 넣은 값을 여기서도 고칠 수 있게 state로 관리.
     ⚠️ 훅이므로 반드시 아래 `if (!open || !data) return null;` 보다 위에 선언할 것
     초기값을 data에서 바로 읽는다(지연 초기화) — 상수로 두면 첫 렌더에서 차감이 0으로 그려졌다가
     useEffect 후에야 반영돼 정산표가 한 번 깜빡인다. */
  const [discountReasonInput, setDiscountReasonInput] = useState(() => (data && data.discountReason) || "샘플비용 차감");
  const [discountAmountInput, setDiscountAmountInput] = useState(() => Number(data && data.discountAmount) || 0);
  const [clientName, setClientName] = useState("");
  const [validUntil, setValidUntil] = useState("");
  const [items, setItems] = useState(() => ((data && data.items) || []).map((it) => ({ ...it }))); // 지연 초기화 — 상수 []로 두면 모달 열 때 빈 표가 한 프레임 보였다가 채워진다

  useEffect(() => {
    if (!data) return;
    setGreeting(isInvoice ? INVOICE_GREETING : GREETING);
    setTerms(isInvoice ? INVOICE_TERMS : TERMS);
    setSupplier(SUPPLIER);
    setClientName(data.clientName || "");
    setContractDate(data.contractDate || todayDisplay());
    setClientCeo(data.clientCeo || "");
    setClientAddress(data.clientAddress || "");
    setDiscountReasonInput(data.discountReason || "샘플비용 차감");
    setDiscountAmountInput(Number(data.discountAmount) || 0);
    setValidUntil(data.validUntil || "");
    setItems((data.items || []).map((it) => ({ ...it }))); // 각 품목의 고유 제품명(it.productName)을 그대로 쓴다 — 예전엔 제안서 제목으로 모든 행을 덮어써서 전 품목이 같은 이름으로 통일되어 보이는 버그가 있었음
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data]);
  const [showApprovalSend, setShowApprovalSend] = useState(false); // 🔗 고객 승인링크 발송 모달
  const [showProposalSend, setShowProposalSend] = useState(false); // 📲 제안서 링크 발송 모달
  const [savedFlash, setSavedFlash] = useState(false); // 훅은 반드시 조기 return(아래) 이전에 선언해야 한다 — 이전엔 이 줄이 return 뒤에 있어서 모달을 열 때(open/data가 바뀌는 순간) 훅 개수가 달라져 화면이 하얗게 깨지는 크래시가 있었음

  if (!open || !data) return null;
  const DARK = "#111827";
  const subtotal = items.reduce((s, i) => s + (Number(i.totalPrice) || 0), 0); // 품목 금액 합계(차감 전)
  /* 차감/할인 — 좌측 폼에서 실시간으로 고칠 수 있고, 발행 단계에서 넣은 값이 초기값으로 들어온다.
     공급가액에서 먼저 빼고 그 금액을 기준으로 부가세를 매긴다(세금계산서와 일치시키기 위함). */
  const discountAmount = Math.min(Math.max(Number(discountAmountInput) || 0, 0), subtotal);
  const discountReason = discountReasonInput || "차감";
  const totalAmount = subtotal - discountAmount; // 공급가액
  // 인보이스 하단 정산표: (합계 → 차감) → 공급가액 → 부가가치세 → 합계금액 → 계약금(30%) → 중도금(60%) → 잔금(10%)
  const vat = Math.floor(totalAmount * 0.1);
  const grandTotal = totalAmount + vat;
  // 3단계 분할 청구(계약금30% / 중도금60% / 잔금10%) — 잔금은 반올림 오차가 생기지 않도록 총액에서 앞의 둘을 뺀 나머지로 계산
  const depositAmount = Math.round(grandTotal * 0.3);
  const interimAmount = Math.round(grandTotal * 0.6);
  const balanceAmount = grandTotal - depositAmount - interimAmount;

  // 좌측 폼에서 품목 삭제(품목이 2개 이상일 때만 버튼 노출)
  const removeItem = (id) => setItems((prev) => prev.filter((it) => it.id !== id));
  const updateItem = (id, field, value) => {
    setItems((prev) => prev.map((it) => {
      if (it.id !== id) return it;
      const next = { ...it, [field]: value };
      if (field === "quantity" || field === "unitPrice") {
        const q = field === "quantity" ? Number(value) || 0 : Number(it.quantity) || 0;
        const p = field === "unitPrice" ? Number(value) || 0 : Number(it.unitPrice) || 0;
        next.totalPrice = q * p;
      }
      return next;
    }));
  };
  const updateGreeting = (idx, v) => setGreeting((prev) => prev.map((g, i) => (i === idx ? v : g)));
  const updateTerm = (idx, v) => setTerms((prev) => prev.map((t, i) => (i === idx ? v : t)));

  // "PDF로 저장" 시 브라우저가 기본 제안하는 파일명은 보통 document.title을 그대로 따르므로,
  // 인쇄 다이얼로그를 열기 직전에만 제목을 "제안서_고객사명_작성일자"(인보이스는 "인보이스_...")로 바꿔뒀다가 되돌린다.
  /* 인보이스/계약서 개별 출력 — 화면에 보이지 않는(display:none) 문서는 인쇄에도 포함되지 않으므로,
     탭을 먼저 해당 문서로 전환한 뒤 렌더가 끝나면 인쇄를 띄운다. 이 방식이 인쇄 CSS를 복잡하게
     늘리지 않으면서 "보이는 문서 = 출력되는 문서"를 확실히 보장한다. */
  const printDoc = (target) => {
    const originalTitle = document.title;
    const safeClient = (clientName || "").trim().replace(/[\\/:*?"<>|]/g, "") || "고객사";
    const docLabel = target === "contract" ? "화장품용기공급계약서" : (isInvoice ? "인보이스" : "제안서");
    // (탭 전환 없음 — 인보이스 모달은 인보이스 서식 하나만 렌더링한다)
    document.title = `${docLabel}_${safeClient}_${todayStr()}`;
    setTimeout(() => {
      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1000);
    }, 150);
  };
  const handlePrint = () => printDoc("invoice");
  // 계약서 하단 날짜 — "2026-08-15" → "2026 년 08 월 15 일" (계약서 서식 관례대로 자간을 띄워 표기)
  /* 고객 동의 페이지처럼 외부에서 어떤 서식을 보여줄지 지정할 수 있게 한다.
     "both"면 인보이스와 계약서를 위아래로 모두 펼쳐 한 번에 검토하게 된다. */
  const effDocTab = data.docTabOverride || "invoice";
  const formattedContractDate = (() => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(contractDate || "");
    return m ? `${m[1]} 년   ${m[2]} 월   ${m[3]} 일` : (contractDate || "");
  })();
  const handleSave = () => {
    if (!onSave || !data.id) return;
    // 인보이스는 여기서 품목·차감을 고칠 수 있으므로 재계산된 금액과 차감 정보도 함께 저장한다.
    onSave(data.id, { clientName, items, validUntil, greeting, terms, supplier, ...(isInvoice ? { contractDate, clientCeo, clientAddress, subtotal, totalAmount, discountReason: discountAmount > 0 ? discountReason : "", discountAmount } : {}) }, isInvoice ? "invoice" : "proposal");
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 2000);
  };

  return (
    <div className={data.consentView ? "w-full" : "fixed inset-0 bg-black/50 z-50 overflow-y-auto px-4 pb-8"} id="pdf-preview-overlay">
      {/* ── 상단 고정 헤더 바 ──────────────────────────────────────────────
          예전엔 [안내문구 + 버튼줄]과 [서식 탭줄]이 별개 블록이라 버튼이 많아지면
          880px 폭 안에서 줄바꿈되며 세로로 찌그러지고, 탭줄이 본문 위에 겹쳐 보였다.
          → 화면 폭 전체를 쓰는 sticky 단일 바로 통합하고, 모든 그룹에 flex-row +
          whitespace-nowrap + shrink-0을 걸어 어떤 폭에서도 가로 한 줄을 유지시킨다. */}
      <div className={"no-print sticky top-0 z-50 -mx-4 mb-4 bg-slate-900 text-white px-6 py-3 flex-row items-center justify-between gap-4 border-b border-slate-700 shadow-lg " + (data.consentView ? "hidden" : "flex")}>

        {/* 1) 좌측: 제목
             ※ 공급계약서 서식 탭은 제거됨 — 계약서 열람·발송·서명은 [🏢 업체 관리]가 전담한다.
                (계약서 마크업 자체는 업체관리 모달·고객 서명페이지가 docTabOverride로 재사용하므로 코드에는 남아있음) */}
        <div className="flex flex-row items-center gap-4 shrink-0 whitespace-nowrap">
          <span className="font-bold text-base text-slate-100 flex items-center gap-1.5">
            {isInvoice ? "📄 본품 인보이스 관리" : "📄 제품공급제안서"}
          </span>
        </div>

        {/* 2) 중앙: 발송상태 배지 + 편집 안내(폭이 부족하면 안내문구부터 숨겨 버튼을 보호) */}
        <div className="flex flex-row items-center gap-2 min-w-0">
          {!data.minimalHeader && data.id && (
            data.sentBy ? (
              <span className="text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-700 font-medium whitespace-nowrap">
                ✅ 발송완료 ({data.sentChannel || "-"} | {formatCreatedAt(data.sentAt)})
              </span>
            ) : (
              <span className="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-600 font-medium whitespace-nowrap">미발송</span>
            )
          )}
          {(data.reviewStatus === "긴급승인" || data.status === "긴급승인") && (
            <span className="text-xs px-2.5 py-1 rounded-full bg-purple-100 text-purple-800 font-bold whitespace-nowrap"
              title={`긴급승인 ${data.emergencyApprovedAt || ""} (${data.emergencyApprovedBy || "-"})`}>긴급승인</span>
          )}
          {isInvoice && data.id && (
            data.consentStatus === "승인완료" || data.consentStatus === "동의완료" ? (
              <span className="text-xs px-2.5 py-1 rounded-full bg-emerald-500 text-white font-semibold whitespace-nowrap">
                ✅ 고객승인완료 ({data.consentAt || "-"})
              </span>
            ) : (
              <span className="text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-semibold whitespace-nowrap">⏳ 고객승인대기</span>
            )
          )}
          <span className="text-xs text-slate-400 whitespace-nowrap hidden xl:inline">
            {data.readOnly ? "🔒 조회 전용 — 수정할 수 없습니다" : "✏️ 텍스트를 클릭하면 바로 수정할 수 있습니다"}
          </span>
        </div>

        {/* 3) 우측: 액션 버튼 그룹 */}
        <div className="flex flex-row items-center gap-2 whitespace-nowrap shrink-0">
          {!data.readOnly && onSave && data.id && (
            <button onClick={handleSave} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">
              {savedFlash ? "✅ 저장되었습니다" : "💾 저장"}
            </button>
          )}
          {/* 대표님 부재·출장 시 직원이 직접 승인 처리 — 확인창을 거쳐야 하고, 승인자·일시가 반드시 함께 기록된다 */}
          {!data.minimalHeader && data.id && onEmergencyApprove && (
            <button
              onClick={() => {
                if (!window.confirm("대표님 부재/긴급 상황에 따른 직원 승인 및 발송을 진행하시겠습니까?\n\n· 승인자·발송자에 '긴급승인 (담당직원명)'이 자동 기록됩니다.\n· 이력에 남아 사후 검증이 가능하며, 되돌리려면 관리자에게 요청해야 합니다.")) return;
                onEmergencyApprove(data);
              }}
              className="bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">
              긴급승인/발송
            </button>
          )}
          {!data.minimalHeader && !isInvoice && data.id && (
            <button onClick={() => setShowProposalSend(true)} className="bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">📲 제안서 링크 발송</button>
          )}
          {!data.minimalHeader && !isInvoice && (
            <button onClick={handlePrint} className="bg-blue-800 hover:bg-blue-900 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">🖨 인쇄 / PDF</button>
          )}
          {isInvoice && data.id && (
            <button onClick={() => setShowApprovalSend(true)}
              className="bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">
              🚀 고객 승인링크 발송
            </button>
          )}
          {!data.minimalHeader && isInvoice && (
            <button onClick={() => printDoc("invoice")} className="bg-blue-800 hover:bg-blue-900 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">🖨️ 인보이스 인쇄 / PDF</button>
          )}
          {!data.minimalHeader && onSendComplete && data.id && (
            <button onClick={() => setShowSendModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-sm">🚀 발송완료</button>
          )}
          <button onClick={onClose} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-600">✕ 닫기</button>
        </div>
      </div>

      {showSendModal && (
        <SendCompleteModal
          onClose={() => setShowSendModal(false)}
          onConfirm={(channel) => { onSendComplete(data.id, channel); setShowSendModal(false); }}
        />
      )}
      {showApprovalSend && (
        <InvoiceApprovalSendModal
          invoice={{ ...data, items }}
          onSent={() => { if (onSendComplete && data.id) onSendComplete(data.id, "카카오톡"); }} // 발송자·일시 자동기록 + [발송완료] 전환
          onClose={() => setShowApprovalSend(false)}
        />
      )}
      {showProposalSend && (
        <ProposalSendModal
          proposal={{ ...data, items }}
          onSent={() => { if (onSendComplete && data.id) onSendComplete(data.id, "카카오톡"); }} // 발송완료 상태로 갱신
          onClose={() => setShowProposalSend(false)}
        />
      )}

      {/* ===== 인보이스 모드: 좌측 편집 폼 + 우측 A4 미리보기 2열 레이아웃 ===== */}
      <div className={isInvoice && !data.consentView ? "flex flex-row gap-6 p-6 items-start overflow-hidden" : ""}>
      {isInvoice && !data.readOnly && (
        <aside className="pv-left no-print w-96 shrink-0 bg-white rounded-xl shadow-xl p-5 overflow-y-auto pr-3"
          style={{ maxHeight: "calc(100vh - 120px)", minHeight: 0 }}>
          <div className="text-sm font-bold text-slate-800 mb-3">📝 인보이스 편집</div>

          <div className="rounded-lg border border-slate-200 p-3 mb-4">
            <div className="text-xs font-semibold text-slate-500 mb-2">고객사 정보 <span className="font-normal text-slate-400">(공급계약서에도 연동)</span></div>
            <Field label="고객사명"><input className={inputCls} value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="예: 주식회사 더마" /></Field>
            <Field label="대표자명"><input className={inputCls} value={clientCeo} onChange={(e) => setClientCeo(e.target.value)} placeholder="계약서 (갑) 서명란에 표기" /></Field>
            <Field label="고객사 주소"><input className={inputCls} value={clientAddress} onChange={(e) => setClientAddress(e.target.value)} placeholder="계약서 (갑) 주소란에 표기" /></Field>
            <Field label="작성일자"><input type="date" className={inputCls} value={contractDate} onChange={(e) => setContractDate(e.target.value)} /></Field>
          </div>

          {items.map((it, idx) => (
            <div key={it.id} className="rounded-lg border border-slate-200 p-3 mb-3">
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs font-semibold text-slate-500">품목 {idx + 1}</div>
                {items.length > 1 && (
                  <button onClick={() => removeItem(it.id)} className="text-[11px] text-rose-500 hover:text-rose-700">삭제</button>
                )}
              </div>
              <Field label="📷 제품 사진"><ImageUpload value={it.image} onChange={(v) => updateItem(it.id, "image", v)} /></Field>
              <Field label="제품명"><input className={inputCls} value={it.productName || ""} onChange={(e) => updateItem(it.id, "productName", e.target.value)} /></Field>
              {/* ⚠️ 우측 인보이스 표의 "재원" 칸은 specSize(사이즈)+material(재질) 두 필드로 렌더링된다.
                  예전엔 여기서 존재하지 않는 it.spec을 편집해서 값이 항상 비어 보이고 입력해도 표에 반영되지 않았음 */}
              <Field label="제원 / 규격 및 사양" hint="표의 '사이즈' 줄에 표시됩니다">
                <textarea rows="4" className="w-full text-xs p-2.5 border border-slate-200 rounded-lg resize-y outline-none focus:border-[#1E3A8A]"
                  value={it.specSize || ""} onChange={(e) => updateItem(it.id, "specSize", e.target.value)} />
              </Field>
              <Field label="재질" hint="표의 '재질' 줄에 표시됩니다">
                <input className={inputCls} value={it.material || ""} onChange={(e) => updateItem(it.id, "material", e.target.value)} />
              </Field>
              <Field label="비고 (추가 메모)">
                <textarea rows="6" className="w-full text-xs p-2.5 border border-slate-200 rounded-lg resize-y outline-none focus:border-[#1E3A8A]"
                  value={it.notes || ""} onChange={(e) => updateItem(it.id, "notes", e.target.value)} />
              </Field>
              <div className="grid grid-cols-2 gap-2">
                <Field label="주문수량"><input type="number" className={inputCls} value={it.quantity} onChange={(e) => updateItem(it.id, "quantity", e.target.value)} /></Field>
                <Field label="단가(ea)"><input type="number" className={inputCls} value={it.unitPrice} onChange={(e) => updateItem(it.id, "unitPrice", e.target.value)} /></Field>
              </div>
              <div className="text-right text-xs font-semibold text-slate-700">금액 : {won(Number(it.totalPrice) || 0)}</div>
            </div>
          ))}

          {/* 차감 / 할인 — 발행 후에도 이 화면에서 바로 수정할 수 있다(저장 시 문서에 반영) */}
          <div className="rounded-lg bg-rose-50/60 border border-rose-100 p-3 text-xs space-y-2">
            <div className="font-semibold text-rose-700">🧾 차감 / 할인</div>
            <Field label="차감 사유">
              <select className={inputCls} value={["샘플비용 차감", "기타 차감"].includes(discountReasonInput) ? discountReasonInput : "직접입력"}
                onChange={(e) => setDiscountReasonInput(e.target.value === "직접입력" ? "" : e.target.value)}>
                <option value="샘플비용 차감">샘플비 차감</option>
                <option value="기타 차감">기타 차감</option>
                <option value="직접입력">직접 입력</option>
              </select>
              {!["샘플비용 차감", "기타 차감"].includes(discountReasonInput) && (
                <input className={`${inputCls} mt-1.5`} value={discountReasonInput} placeholder="샘플비용 차감" onChange={(e) => setDiscountReasonInput(e.target.value)} />
              )}
            </Field>
            <Field label="차감 금액 (원)">
              <input type="number" min="0" className={inputCls} value={discountAmountInput}
                onChange={(e) => setDiscountAmountInput(e.target.value === "" ? 0 : Number(e.target.value))} />
            </Field>
            <p className="text-[11px] text-slate-500 leading-relaxed">※ 차감된 금액은 공급가액에서 자동으로 마이너스(-) 처리됩니다.</p>
          </div>

          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3 text-xs space-y-1">
            {discountAmount > 0 && (
              <React.Fragment>
                <div className="flex justify-between"><span className="text-slate-500">합계 (품목 총액)</span><span>{won(Math.round(subtotal))}</span></div>
                <div className="flex justify-between"><span className="text-rose-600">차감 ({discountReason})</span><span className="font-semibold text-rose-600">- {won(discountAmount)}</span></div>
              </React.Fragment>
            )}
            <div className="flex justify-between"><span className="text-slate-500">공급가액 합계</span><span className="font-semibold">{won(Math.round(totalAmount))}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">부가가치세 (10%)</span><span>{won(vat)}</span></div>
            <div className="flex justify-between border-t border-slate-200 pt-1 mt-1"><span className="font-semibold text-slate-700">총 합계금액</span><span className="font-bold text-[#1E3A8A]">{won(grandTotal)}</span></div>
            <div className="flex justify-between pt-1"><span className="text-slate-500">계약금 (30%)</span><span>{won(depositAmount)}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">중도금 (60%)</span><span>{won(interimAmount)}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">잔금 (10%)</span><span>{won(balanceAmount)}</span></div>
          </div>
        </aside>
      )}

      {/* ⚠️ items-start 필수: flex 컨테이너의 기본 align-items는 stretch라 흰 용지(자식)의 높이가
          패널 높이로 고정돼버리고, 넘치는 본문이 용지 밖 회색 배경 위로 삐져나온다(계약서 배경 쪼개짐 버그의 원인) */}
      <div className={isInvoice && !data.consentView ? "pv-right flex-1 min-w-0 overflow-y-auto bg-slate-100 rounded-xl p-6 flex justify-center items-start" : (data.consentView ? "space-y-6" : "")}
        style={isInvoice && !data.consentView ? { maxHeight: "calc(100vh - 120px)", minHeight: 0 } : undefined}>

      <div className="proposal-modal-content w-full max-w-4xl min-h-full mx-auto bg-white text-black p-10 shadow-lg border border-slate-200 text-sm" id="pdf-page"
        style={{ color: DARK, display: isInvoice && effDocTab === "contract" ? "none" : "block" }}>
      <fieldset disabled={!!data.readOnly} className="contents" style={{ border: 0, margin: 0, padding: 0 }}>

        {/* 1) 대타이틀 + 로고 */}
        <div className="flex items-start justify-between border-b-2 pb-4 mb-5" style={{ borderColor: DARK }}>
          <h1 className="text-xl font-bold" style={{ color: DARK }}>{isInvoice ? "INVOICE" : "제품공급제안서"}</h1>
          <img src={supplierLogo || DEFAULT_LOGO} className="h-12 object-contain" />
        </div>

        {/* 2) 수신자 정보 & 공급자 정보 */}
        <div className="proposal-info-row flex justify-between items-start mb-5">
          <div className="text-sm" style={{ width: "48%" }}>
            <div className="font-semibold text-base mb-2 flex items-center gap-1" style={{ color: DARK }}>
              <PvField ro={isInvoice} value={clientName} onChange={setClientName} placeholder="고객사명" className="font-semibold text-base" />
              <span>貴下</span>
            </div>
            <div style={{ color: DARK }}>제안금액: <b>{won(totalAmount)}</b> <span className="text-xs text-slate-500">(부가세 별도)</span></div>
            <div className="flex items-center gap-1 whitespace-nowrap" style={{ color: DARK }}>
              <span className="whitespace-nowrap">작성일자: {isInvoice ? contractDate : todayDisplay()}</span>
              <span className="text-xs text-slate-500 flex items-center gap-1 whitespace-nowrap">
                (유효기간: 30일, ~<PvField ro={isInvoice} value={validUntil} onChange={setValidUntil} className="text-xs w-24" />)
              </span>
            </div>
          </div>
          <table className="pdf-supplier-table text-xs border border-slate-300" style={{ color: DARK, width: "48%", tableLayout: "fixed" }}>
            <colgroup>
              <col style={{ width: "60px" }} />
              <col style={{ width: "45%" }} />
              <col style={{ width: "44px" }} />
              <col />
            </colgroup>
            <tbody>
            <tr><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">사업자번호</td><td className="border border-slate-300 px-2 py-1" colSpan="3"><PvField ro={isInvoice} value={supplier.bizNo} onChange={(v) => setSupplier({ ...supplier, bizNo: v })} className="w-full" /></td></tr>
            <tr><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">업체명</td><td className="border border-slate-300 px-2 py-1"><PvField ro={isInvoice} value={supplier.company} onChange={(v) => setSupplier({ ...supplier, company: v })} className="w-full" /></td><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">대표</td><td className="border border-slate-300 px-2 py-1 whitespace-nowrap"><PvField ro={isInvoice} value={supplier.ceo} onChange={(v) => setSupplier({ ...supplier, ceo: v })} className="w-16" />&nbsp;(인)</td></tr>
            <tr><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">주소</td><td className="border border-slate-300 px-2 py-1" colSpan="3"><PvField ro={isInvoice} value={supplier.address} onChange={(v) => setSupplier({ ...supplier, address: v })} className="w-full" /></td></tr>
            <tr><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">업태</td><td className="border border-slate-300 px-2 py-1"><PvField ro={isInvoice} value={supplier.bizType} onChange={(v) => setSupplier({ ...supplier, bizType: v })} className="w-full" /></td><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">종목</td><td className="border border-slate-300 px-2 py-1"><PvField ro={isInvoice} value={supplier.bizItem} onChange={(v) => setSupplier({ ...supplier, bizItem: v })} className="w-full" /></td></tr>
            <tr><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">전화</td><td className="border border-slate-300 px-2 py-1"><PvField ro={isInvoice} value={supplier.tel} onChange={(v) => setSupplier({ ...supplier, tel: v })} className="w-full" /></td><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">팩스</td><td className="border border-slate-300 px-2 py-1"><PvField ro={isInvoice} value={supplier.fax} onChange={(v) => setSupplier({ ...supplier, fax: v })} className="w-full" /></td></tr>
            {isInvoice && (
              <tr><td className="border border-slate-300 py-1 px-1.5 bg-slate-50 whitespace-nowrap">입금계좌</td><td className="border border-slate-300 px-2 py-1" colSpan="3"><PvField ro={isInvoice} value={supplier.bank} onChange={(v) => setSupplier({ ...supplier, bank: v })} className="w-full" /></td></tr>
            )}
          </tbody></table>
        </div>

        {/* 3) 인사말 4줄 */}
        <div className="text-xs leading-relaxed mb-5 space-y-0.5" style={{ color: DARK }}>
          {greeting.map((g, i) => (
            <div key={i} className="flex gap-1"><span>◎</span><PvField ro={isInvoice} value={g} onChange={(v) => updateGreeting(i, v)} className="flex-1" /></div>
          ))}
        </div>

        {/* 4) 품목 상세 테이블 */}
        <table className="w-full text-xs border border-slate-300 mb-6" style={{ tableLayout: "fixed", width: "100%" }}>
          <thead><tr className="bg-slate-100" style={{ color: DARK }}>
            <th className="border border-slate-300 px-2 py-2" style={{ width: "5%" }}>No</th>
            <th className="border border-slate-300 px-2 py-2" style={{ width: "10%" }}>제품사진</th>
            <th className="border border-slate-300 px-2 py-2" style={{ width: "13%" }}>제품명</th>
            <th className="border border-slate-300 px-2 py-2" style={{ width: "15%" }}>재원</th>
            <th className="border border-slate-300 px-2 py-2" style={{ width: "9%" }}>주문수량</th>

              <div className="flex items-center relative mt-6">

                <img src={SEAL_IMAGE_DATA_URL} alt="비케이브로 직인"
                  className="w-12 h-12 object-contain inline-block ml-2 -my-2 select-none" />
              </div>
            </div>
          </div>
        </div>
      )}
      </div>{/* /pv-right */}
      </div>{/* /2열 컨테이너 */}
    </div>
  );
}
