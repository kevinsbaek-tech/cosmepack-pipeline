  const loadNextPending = () => {
    if (pendingQueue.length === 0) return;
    const [next, ...rest] = pendingQueue;
    loadSourcingIntoForm(next);
    setPendingQueue(rest);
  };

  const addClientRecord = async (c) => {
    setClientsList((prev) => [c, ...prev]);
    try { await fsAdd(COLLECTIONS.clients, c); } catch (e) { console.error(e); }
  };
  const updateClientRecord = async (id, patch) => {
    setClientsList((prev) => prev.map((c) => (c.id === id ? { ...c, ...patch } : c)));
    try {
      if (FIREBASE_ENABLED && typeof id === "string") await fsUpdate(COLLECTIONS.clients, id, patch);
      setToast("업체 정보가 수정되었습니다.");
    } catch (e) {
      console.error(e);
      setToast("Firestore 수정 중 오류가 발생했습니다. (화면에는 반영됨)");
    }
  };
  const deleteClientRecord = async (c) => {
    if (!window.confirm(`"${c.name}" 업체를 삭제할까요?`)) return;
    // 동일 업체명으로 병합되어 표시된 카드라면 밑에 깔린 중복 레코드 전부를 함께 삭제
    const idsToDelete = (c._mergedIds && c._mergedIds.length > 0) ? c._mergedIds : [c.id];
    setClientsList((prev) => prev.filter((x) => !idsToDelete.includes(x.id)));
    for (const id of idsToDelete) {
      try { if (FIREBASE_ENABLED && typeof id === "string") await fsDelete(COLLECTIONS.clients, id); } catch (e) { console.error(e); }
    }
  };
  const addFactoryRecord = async (f) => {
    setFactoriesList((prev) => [f, ...prev]);
    try { await fsAdd(COLLECTIONS.factories, f); } catch (e) { console.error(e); }
  };
  const updateFactoryRecord = async (id, patch) => {
    const oldFactory = factoriesList.find((f) => f.id === id);
    setFactoriesList((prev) => prev.map((f) => (f.id === id ? { ...f, ...patch } : f)));
    try {
      if (FIREBASE_ENABLED && typeof id === "string") await fsUpdate(COLLECTIONS.factories, id, patch);
    } catch (e) { console.error(e); }

    // 공장명이 바뀌면 연동된 모든 제품의 공장명도 함께 갱신 (실시간 동기화)
    if (oldFactory && patch.name && patch.name !== oldFactory.name) {
      const affected = productsList.filter((p) => p.factory === oldFactory.name);
      if (affected.length > 0) {
        setProductsList((prev) => prev.map((p) => (p.factory === oldFactory.name ? { ...p, factory: patch.name } : p)));
        for (const p of affected) {
          try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsUpdate(COLLECTIONS.products, p.id, { factory: patch.name }); } catch (e) { console.error(e); }
        }
        setToast(`공장명 변경에 따라 연동 제품 ${affected.length}건도 자동 갱신되었습니다.`);
      } else {
        setToast("공장 정보가 수정되었습니다.");
      }
    } else {
      setToast("공장 정보가 수정되었습니다.");
    }
  };
  const deleteFactoryRecord = async (f) => {
    if (!window.confirm(`"${f.name}" 공장을 삭제할까요?`)) return;
    setFactoriesList((prev) => prev.filter((x) => x.id !== f.id));
    try { if (FIREBASE_ENABLED && typeof f.id === "string") await fsDelete(COLLECTIONS.factories, f.id); } catch (e) { console.error(e); }
  };

  // 제품 DB(products)에 등록된 공장명을 모두 추출해 공장관리 DB에 없는 것만 자동 등록
  // 박스히어로 파싱 레코드(중국공장명/위챗단체방/1688링크)를 공장 관리 DB와 자동 연동:
  // 없는 공장명은 신규 등록, 이미 있는 공장은 홈페이지링크(1688)가 비어있을 때만 보강(기존 값은 덮어쓰지 않음)
  const syncFactoriesFromBoxHeroRecords = async (records) => {
    const newFactories = [];
    const seen = new Set();
    records.forEach((r) => {
      const fname = (r.factory || "").trim();
      if (!fname || seen.has(fname)) return;
      seen.add(fname);
      const existing = factoriesList.find((f) => f.name === fname);
      if (!existing) {
        newFactories.push({ id: Date.now() + Math.random(), name: fname, wechatGroup: r.wechatGroup || "", contact: "", mainProducts: "", websiteUrl: r.factoryLink || "", memo: "" });
      }
    });
    if (newFactories.length > 0) {
      setFactoriesList((prev) => [...newFactories, ...prev]);
      for (const f of newFactories) {
        try { await fsAdd(COLLECTIONS.factories, f); } catch (e) { console.error(e); }
      }
    }
    for (const r of records) {
      const fname = (r.factory || "").trim();
      if (!fname) continue;
      const existing = factoriesList.find((f) => f.name === fname);
      if (existing && !existing.websiteUrl && r.factoryLink) {
        updateFactoryRecord(existing.id, { websiteUrl: r.factoryLink });
      }
    }
  };

  const importFactoriesFromProducts = async () => {
    const known = new Set(factoriesList.map((f) => f.name));
    const found = new Map(); // name -> wechatGroup
    productsList.forEach((p) => {
      const fname = (p.factory || "").trim();
      if (!fname || known.has(fname) || found.has(fname)) return;
      found.set(fname, (p.wechatGroup || "").trim());
    });
    const newFactories = Array.from(found.entries()).map(([name, wechatGroup]) => ({
      id: Date.now() + Math.random(), name, wechatGroup, contact: "", mainProducts: "",
    }));
    if (newFactories.length === 0) { setToast("제품 DB의 공장명은 이미 전부 등록되어 있습니다."); return; }
    setFactoriesList((prev) => [...newFactories, ...prev]);
    for (const f of newFactories) {
      try { await fsAdd(COLLECTIONS.factories, f); } catch (e) { console.error(e); }
    }
    setToast(`제품 DB에서 공장 ${newFactories.length}곳을 자동 등록했습니다.`);
  };

  // 엑셀 보관함: 업로드 시 자동 파싱 + DB 연동
  // 업체/공장/제품 DB 동기화 (신규 업로드시 + "파이프라인 적용" 클릭시 둘 다 재사용)
  const syncParsedDataToDb = (clientName, items, factories, factoryLinks, factoryHomepages) => {
    if (clientName && !clientsList.some((c) => c.name === clientName)) {
      addClientRecord({ id: Date.now() + Math.random(), name: clientName, contact: "", channel: "카카오채널", difficulty: "표준", source: "excel" });
    }
    (factories || []).forEach((fname) => {
      if (!fname) return;
      const existing = factoriesList.find((f) => f.name === fname);
      const homepage = (factoryHomepages && factoryHomepages[fname]) || "";
      if (!existing) {
        addFactoryRecord({ id: Date.now() + Math.random(), name: fname, wechatGroup: "", contact: "", mainProducts: "", websiteUrl: homepage, memo: (factoryLinks && factoryLinks[fname]) ? `제품URL: ${factoryLinks[fname]}` : "", source: "excel" });
      } else if (homepage && !existing.websiteUrl) {
        // 기존 공장에 홈페이지 링크가 비어있으면 이번에 파악된 값으로 보강
        updateFactoryRecord(existing.id, { websiteUrl: homepage });
      }
    });
    if ((items || []).length > 0) {
      bulkAddProducts(items.map((it) => {
        const noteText = it.notes || it.note || it.printFinishNote || "";
        const rec = {
          name: buildStandardProductName(it.name, noteText), // 엑셀 원본 품명을 "[코스메팩] 재질/인서트/캡/사이즈/용량" 표준 형식으로 재조합
          specSize: it.specSize, material: it.material,
          factory: it.factory, factoryLink: it.factoryLink,
          rmbCost: it.rmbCost, lastUnitPrice: it.unitPrice || 0, image: it.image || "",
          category: guessCategoryFromName(it.name, noteText), // 품명/비고 텍스트에 카테고리명이 포함돼 있으면 자동 선택
          leadTimeDays: it.leadTimeDays || null, leadTimeText: it.leadTimeDays ? `약 ${it.leadTimeDays}일` : "",
          otherOptionK: it.printFinishNote || "",
          moqQuantity: it.quantity || null, moqText: it.quantity ? `${it.quantity.toLocaleString("ko-KR")}개` : "",
        };
        if (it.quantity && it.rmbCost) {
          rec.priceTiers = [{ qty: it.quantity, cbm: it.cbm || "", shippingRmb: it.shippingRmb || "", factoryPriceRmb: it.rmbCost }];
        }
        return rec;
      }), "excel");
    }
  };

  // 엑셀 파일 1개를 분석해서 보관함+DB에 반영. silent=true면 개별 토스트를 띄우지 않음(ZIP 일괄처리용)
  const processSingleExcelFile = async (file, silent) => {
    let parsed;
    try {
      const buf = await readFileAsArrayBuffer(file);
      const workbook = XLSX.read(buf, { type: "array" });
      let zip = null;
      try { zip = await JSZip.loadAsync(file); } catch (e) { console.error("zip 로드 실패(이미지 추출 생략):", e); }
      parsed = await parseQuoteWorkbook(workbook, zip);
    } catch (e) {
      console.error(e);
      if (!silent) setToast(`"${file.name}" 분석 중 오류가 발생했습니다. (.xlsx 형식인지 확인해주세요)`);
      return { ok: false, fileName: file.name };
    }

    // 파일 원본 보관 (700KB 이하일 때만 base64로 함께 저장 — Firestore 문서 용량 제한 때문)
    let fileData = "";
    try {
      if (file.size <= 700 * 1024) fileData = await readFileAsDataUrl(file);
    } catch (e) { console.error(e); }

    const record = {
      fileName: file.name,
      uploadedAt: nowDateTimeStr(),
      clientName: parsed.clientName || "(미확인)",
      totalAmount: parsed.totalAmount || 0,
      itemCount: parsed.items.length,
      parsedItems: parsed.items,
      parsedFactories: parsed.factories,
      parsedFactoryLinks: parsed.factoryLinks,
      parsedFactoryHomepages: parsed.factoryHomepages || {},
      parsedPricingSummary: parsed.pricingSummary || {},
      parsedProposalDate: parsed.proposalDate || null,
      sheetNames: parsed.sheetNames,
      fileData, // 큰 파일은 빈 문자열 — 다운로드 버튼에서 안내
      pipelineApplied: false,
    };
    const localRec = { id: Date.now() + Math.random(), ...record };
    setExcelArchiveList((prev) => [localRec, ...prev]);
    const imgCount = parsed.items.filter((it) => it.image).length;
    try {
      await fsAdd(COLLECTIONS.excelArchive, record);
      if (!silent) setToast(`"${file.name}" 업로드 및 자동 분석 완료 (품목 ${parsed.items.length}건 중 사진 ${imgCount}건 인식, 업체·공장·제품·제안서 목록에 자동 등록됨)`);
    } catch (e) {
      console.error(e);
      if (!silent) setToast("Firestore 저장 중 오류가 발생했습니다. (화면에는 반영됨)");
    }

    syncParsedDataToDb(parsed.clientName, parsed.items, parsed.factories, parsed.factoryLinks, parsed.factoryHomepages);
    await ensureExcelProposalRegistered(parsed.clientName, parsed.items, file.name, parsed.proposalDate);
    return { ok: true, fileName: file.name, itemCount: parsed.items.length };
  };

  const uploadExcelToArchive = async (file) => {
    await processSingleExcelFile(file, false);
  };

  // ZIP 압축파일 업로드: 내부의 .xlsx 파일만 골라내 하나씩 분석·등록(PDF 등 다른 확장자는 무시)
  const uploadZipToArchive = async (zipFile) => {
    let zip;
    try {
      zip = await JSZip.loadAsync(zipFile);
    } catch (e) {
      console.error(e);
      setToast("ZIP 파일을 여는 중 오류가 발생했습니다.");
      return;
    }
    const allEntries = Object.values(zip.files).filter((f) => !f.dir);
    const xlsxEntries = allEntries.filter((f) => /\.xlsx$/i.test(f.name));
    const imageEntries = allEntries.filter((f) => /\.(jpe?g|png|gif|webp)$/i.test(f.name));
    const htmlEntries = allEntries.filter((f) => /\.html?$/i.test(f.name));
    if (xlsxEntries.length === 0 && imageEntries.length === 0 && htmlEntries.length === 0) {
      setToast("ZIP 안에서 처리할 수 있는 파일(.xlsx/.html/이미지)을 찾지 못했습니다.");
      return;
    }
    let successCount = 0;
    for (const entry of xlsxEntries) {
      try {
        const blob = await entry.async("blob");
        const shortName = entry.name.split("/").pop();
        const asFile = new File([blob], shortName, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const result = await processSingleExcelFile(asFile, true);
        if (result.ok) successCount++;
      } catch (e) {
        console.error(`ZIP 내 "${entry.name}" 처리 실패:`, e);
      }
    }

    // ZIP 안에 이미지/HTML(박스히어로 스타일)이 함께 들어있으면, 파일명/표 안의 SKU를 기준으로 제품 사진만 보완 매핑
    const skuToImage = new Map();
    for (const entry of htmlEntries) {
      try {
        const text = await entry.async("string");
        const rows = parseBoxHeroHtml(text);
        rows.forEach((row) => {
          const sku = (pickField(row, ["SKU"]) || "").trim().toUpperCase();
          const image = pickField(row, ["사진"]);
          if (sku && image) skuToImage.set(sku, image);
        });
      } catch (e) { console.error(`ZIP 내 "${entry.name}" HTML 분석 실패:`, e); }
    }
    for (const entry of imageEntries) {
      const sku = extractSkuToken(entry.name.split("/").pop());
      if (!sku) continue;
      try {
        const blob = await entry.async("blob");
        const asFile = new File([blob], entry.name.split("/").pop());
        const compressed = await compressImageFile(asFile, 300 * 1024);
        skuToImage.set(sku, compressed);
      } catch (e) { console.error(`ZIP 내 "${entry.name}" 이미지 압축 실패:`, e); }
    }
    let restored = 0;
    for (const [sku, image] of skuToImage.entries()) {
      const target = productsList.find((p) => (p.sku || "").trim().toUpperCase() === sku);
      if (target) { await updateProductRecord(target.id, { image }); restored++; }
    }

    const parts = [];
    if (successCount > 0) parts.push(`엑셀 ${successCount}개 파일 등록`);
    if (restored > 0) parts.push(`이미지 ${restored}건 SKU매칭 복구`);
    setToast(parts.length > 0 ? `ZIP 일괄 업로드 완료: ${parts.join(" · ")} (업체·공장·제품·제안서 DB 자동 반영됨)` : "ZIP 안에서 유효한 데이터를 찾지 못했습니다.");
  };

  // 제품 DB를 (출처와 무관하게) 통째로 비우는 초기화 — 테스트 데이터를 정리하고 깔끔하게 재등록하고 싶을 때 사용. 관리자 전용.
  const deleteAllProducts = async () => {
    if (productsList.length === 0) { setToast("제품 DB가 이미 비어있습니다."); return; }
    if (!window.confirm(`제품 DB 전체(${productsList.length}건)를 초기화할까요? 수동/엑셀/박스히어로 출처를 가리지 않고 모두 삭제되며 되돌릴 수 없습니다.`)) return;
    if (!window.confirm("정말로 진행할까요? 마지막 확인입니다.")) return;
    const snapshot = [...productsList];
    setProductsList([]);
    for (const p of snapshot) {
      try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsDelete(COLLECTIONS.products, p.id); } catch (e) { console.error(e); }
    }
    setToast(`제품 DB ${snapshot.length}건을 전체 초기화했습니다.`);
  };

  // 엑셀/ZIP으로 업로드되어 잘못 쌓인 제품 데이터를 한번에 깨끗이 비우는 빠른 초기화(제품 DB + 엑셀 보관함).
  // 재업로드 전 초기화 용도라 권한 제한 없이 누구나 사용 가능(단, 확인창은 반드시 거침).
  const deleteAllUploadedProductData = async () => {
    if (productsList.length === 0 && excelArchiveList.length === 0) { setToast("이미 비어있습니다."); return; }
    if (!window.confirm("기존 업로드된 제품 데이터를 모두 삭제하시겠습니까?")) return;
    const productSnapshot = [...productsList];
    const archiveSnapshot = [...excelArchiveList];
    setProductsList([]);
    setExcelArchiveList([]);
    for (const p of productSnapshot) {
      try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsDelete(COLLECTIONS.products, p.id); } catch (e) { console.error(e); }
    }
    for (const a of archiveSnapshot) {
      try { if (FIREBASE_ENABLED && typeof a.id === "string") await fsDelete(COLLECTIONS.excelArchive, a.id); } catch (e) { console.error(e); }
    }
    setToast(`업로드된 제품 데이터를 모두 삭제했습니다. (제품 ${productSnapshot.length}건 · 엑셀 보관함 ${archiveSnapshot.length}건) 이제 새 ZIP/엑셀 파일을 다시 업로드해주세요.`);
  };

  const deleteExcelArchiveItem = async (item) => {
    if (!window.confirm(`"${item.fileName}"을(를) 보관함에서 삭제할까요?`)) return;
    setExcelArchiveList((prev) => prev.filter((x) => x.id !== item.id));
    try { if (FIREBASE_ENABLED && typeof item.id === "string") await fsDelete(COLLECTIONS.excelArchive, item.id); } catch (e) { console.error(e); }
  };

  // 엑셀 보관함 업로드로 자동 생성된 데이터 전체를 선택 초기화: 보관함 파일 + 엑셀자동등록 제안서 + 엑셀출처(source:"excel") 제품/공장/업체를 모두 삭제.
  // 수동으로 등록한 기준정보(마진율표·관세율 등)와, 엑셀출처 태그가 없는 기존 공장/업체/제품 데이터는 절대 건드리지 않음.
  const resetExcelUploadedData = async () => {
    if (excelArchiveList.length === 0) { setToast("엑셀 보관함이 이미 비어있습니다."); return; }
    const excelProposals = proposalList.filter((p) => p.employee === "(엑셀자동등록)");
    const excelProducts = productsList.filter((p) => p.source === "excel");
    const excelFactories = factoriesList.filter((f) => f.source === "excel");
    const excelClients = clientsList.filter((c) => c.source === "excel");
    if (!window.confirm(
      `엑셀 보관함 파일 ${excelArchiveList.length}건, 제안서 ${excelProposals.length}건, 제품 ${excelProducts.length}건, 공장 ${excelFactories.length}건, 업체 ${excelClients.length}건을 초기화할까요?\n(수동으로 등록한 기준정보·공장·업체·제품 데이터는 안전하게 유지됩니다)\n이 작업은 되돌릴 수 없습니다.`
    )) return;

    const archiveSnapshot = [...excelArchiveList];
    setExcelArchiveList([]);
    setProposalList((prev) => prev.filter((p) => p.employee !== "(엑셀자동등록)"));
    setProductsList((prev) => prev.filter((p) => p.source !== "excel"));
    setFactoriesList((prev) => prev.filter((f) => f.source !== "excel"));
    setClientsList((prev) => prev.filter((c) => c.source !== "excel"));
    proposalSeqCounterRef.current = {}; // 제안번호 날짜별 순번 카운터도 리셋 → 재업로드시 001부터 다시 시작

    for (const item of archiveSnapshot) {
      try { if (FIREBASE_ENABLED && typeof item.id === "string") await fsDelete(COLLECTIONS.excelArchive, item.id); } catch (e) { console.error(e); }
    }
    for (const p of excelProposals) {
      try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsDelete(COLLECTIONS.proposals, p.id); } catch (e) { console.error(e); }
    }
    for (const p of excelProducts) {
      try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsDelete(COLLECTIONS.products, p.id); } catch (e) { console.error(e); }
    }
    for (const f of excelFactories) {
      try { if (FIREBASE_ENABLED && typeof f.id === "string") await fsDelete(COLLECTIONS.factories, f.id); } catch (e) { console.error(e); }
    }
    for (const c of excelClients) {
      try { if (FIREBASE_ENABLED && typeof c.id === "string") await fsDelete(COLLECTIONS.clients, c.id); } catch (e) { console.error(e); }
    }
    setToast(`엑셀 연동 데이터를 초기화했습니다. (보관함 ${archiveSnapshot.length}건 · 제안서 ${excelProposals.length}건 · 제품 ${excelProducts.length}건 · 공장 ${excelFactories.length}건 · 업체 ${excelClients.length}건 삭제 / 수동 등록 기준정보·공장·업체·제품은 유지됨)`);
  };

  // 제안서 검토상태(reviewStatus)를 변경하는 공용 함수. extra로 수정이력(updatedAt/updatedBy) 등을 함께 반영 가능
  const updateReviewStatus = async (p, newReviewStatus, extra) => {
    const patch = { reviewStatus: newReviewStatus, ...(extra || {}) };
    setProposalList((prev) => prev.map((x) => (x.id === p.id ? { ...x, ...patch } : x)));
    try {
      if (FIREBASE_ENABLED && p.id && typeof p.id === "string") await fsUpdate(COLLECTIONS.proposals, p.id, patch);
    } catch (e) { console.error(e); }
  };
  // 관리자(대표님)가 제안서를 조회/수정 모드로 열었을 때, 아직 "검토대기" 상태면 자동으로 "검토중"으로 전환
  const markUnderReviewIfNeeded = (p) => {
    if (isAdmin && getReviewStatus(p) === "검토대기") updateReviewStatus(p, "검토중");
  };

  // "검토대기" 상태인 제안서를 전부 한번에 "승인완료"로 일괄 전환 (관리자 전용)
  const bulkApprovePendingProposals = async () => {
    const targets = proposalList.filter((p) => getReviewStatus(p) === "검토대기");
    if (targets.length === 0) { setToast("검토대기 중인 제안서가 없습니다."); return; }
    if (!window.confirm(`검토대기 중인 제안서 ${targets.length}건을 전부 승인완료로 변경할까요?`)) return;
    const actorName = (roleUser && roleUser.displayName) || "알 수 없음";
    const extra = { updatedAt: nowDateTimeStr(), updatedBy: actorName };
    for (const p of targets) {
      await updateReviewStatus(p, "승인완료", extra);
    }
    setToast(`검토대기 제안서 ${targets.length}건을 전부 승인완료로 변경했습니다.`);
  };

  // 날짜(YYYYMMDD) 기준 다음 제안번호를 계산. 같은 날짜로 여러 파일이 연속 처리될 때(ZIP 일괄 업로드 등)도
  // ref 카운터를 즉시 증가시키므로 -001,-002,-003...으로 정확히 순번이 매겨진다.
  // 해당 날짜를 처음 다루는 경우에만 현재 proposalList의 실제 등록 건수로 카운터를 시딩(seed)한다.
  const getNextProposalCode = (dateStr) => {
    const prefix = `PROP-${dateStr}-`;
    if (proposalSeqCounterRef.current[dateStr] == null) {
      const existingCount = proposalList.filter((p) => (p.code || "").startsWith(prefix)).length;
      proposalSeqCounterRef.current[dateStr] = existingCount;
    }
    proposalSeqCounterRef.current[dateStr] += 1;
    return `${prefix}${String(proposalSeqCounterRef.current[dateStr]).padStart(3, "0")}`;
  };

  // 파싱된 품목으로 제안서 레코드를 생성 (같은 파일명+거래처로 이미 등록돼 있으면 중복 생성하지 않음)
  const ensureExcelProposalRegistered = async (clientName, items, fileName, proposalDate) => {
    if (!items || items.length === 0) return;
    const proposalTitle = fileName.replace(/\.xlsx?$/i, "");
    const already = proposalList.some((p) => p.proposalTitle === proposalTitle && p.clientName === (clientName || "(미확인)"));
    if (already) return;
    const draftShapedItems = items.map((it) => ({
      id: Date.now() + Math.random(),
      image: it.image || "", productName: it.name, specSize: it.specSize, material: it.material,
      category: "", factory: it.factory, wechatGroup: "",
      quantity: it.quantity || 0, unitPrice: it.unitPrice || 0,
      totalPrice: it.totalPrice || (it.unitPrice || 0) * (it.quantity || 0),
      cbm: it.cbm || 0, notes: it.notes || it.note || "",
    }));
    const totalAmount = draftShapedItems.reduce((s, i) => s + i.totalPrice, 0);
    const totalCbm = draftShapedItems.reduce((s, i) => s + i.cbm, 0);
    const dateStr = extractDateFromFileName(fileName) || todayStr();
    const code = getNextProposalCode(dateStr);
    const itemSummary = draftShapedItems.length > 1 ? `${draftShapedItems[0].productName} 외 ${draftShapedItems.length - 1}건` : draftShapedItems[0].productName;
    const proposalRecord = {
      code, status: "견적제출", reviewStatus: "검토대기", createdAt: proposalDate || nowDateTimeStr(), // "제안서(원화)" D6셀 작성일자 우선 사용, 없으면 업로드 시각
      clientName: clientName || "(미확인)", contact: "", channel: "카카오채널", employee: "(엑셀자동등록)",
      proposalTitle, itemSummary, totalAmount, totalCbm,
      items: draftShapedItems, validUntil: addDays(30),
    };
    setProposalList((prev) => [{ id: Date.now() + Math.random(), ...proposalRecord }, ...prev]);
    try { await fsAdd(COLLECTIONS.proposals, proposalRecord); } catch (e) { console.error(e); }
  };

  // 보관함의 특정 파일 데이터로 파이프라인(1~3단계)을 세팅. 최초 1회에 한해 업체/공장/제품 DB에 심층 반영하고 "적용 완료" 상태로 표시
  const applyExcelToPipeline = async (item) => {
    const items = (item.parsedItems || []).map((it) => ({
      id: Date.now() + Math.random(),
      image: it.image || "", productName: it.name, specSize: it.specSize, material: it.material,
      category: "", factory: it.factory, wechatGroup: "",
      quantity: it.quantity || 0, unitPrice: it.unitPrice || 0, totalPrice: it.totalPrice || (it.unitPrice || 0) * (it.quantity || 0), cbm: it.cbm || 0,
      notes: it.notes || it.note || "",
    }));
    setDraftItems(items);
    setClientInfo({ clientName: item.clientName || "", contact: "", channel: "카카오채널", employee: "", proposalTitle: item.fileName.replace(/\.xlsx?$/i, "") });
    setEditingItemId(null);

    // 2단계 계산 입력값도 첫 품목 + 제안가격 시트 요약값 기준으로 자동 세팅
    const first = (item.parsedItems || [])[0];
    if (first) {
      setProductImage(first.image || "");
      setProductName(first.name || "");
      setSpecSize(first.specSize || "");
      setMaterial(first.material || "");
      setItemFactory(first.factory || "");
      setQuantity(first.quantity || 0);
      setCbm(first.cbm || 0);
      setRmbBase(first.rmbCost || 0);
      setRmbShip(first.shippingRmb || 0);
    }
    const summary = item.parsedPricingSummary || {};
    if (summary.exchangeRate) setExRate((prev) => ({ ...prev, rmbToKrw: Number(summary.exchangeRate).toFixed(2) }));
    if (summary.customsRate) setCustomsRate(summary.customsRate < 1 ? summary.customsRate * 100 : summary.customsRate);
    if (summary.cbmRate) setLogistics((prev) => ({ ...prev, cbmRate: summary.cbmRate }));
    if (summary.marginRate) setMarginOverride(summary.marginRate > 1 ? summary.marginRate / 100 : summary.marginRate);

    setView("pipeline");
    setActiveStep(3);

    if (!item.pipelineApplied) {
      // 최초 적용시에만 업체/공장/제품 DB 심층 반영(홈페이지링크, 수량별단가 등) + 제안서목록 등록 보장
      syncParsedDataToDb(item.clientName, item.parsedItems, item.parsedFactories, item.parsedFactoryLinks, item.parsedFactoryHomepages);
      await ensureExcelProposalRegistered(item.clientName, item.parsedItems, item.fileName, item.parsedProposalDate);
      setExcelArchiveList((prev) => prev.map((x) => (x.id === item.id ? { ...x, pipelineApplied: true } : x)));
      try { if (FIREBASE_ENABLED && typeof item.id === "string") await fsUpdate(COLLECTIONS.excelArchive, item.id, { pipelineApplied: true }); } catch (e) { console.error(e); }
      setToast(`"${item.fileName}" 데이터를 파이프라인에 적용하고, 업체·공장·제품 DB를 심층 반영했습니다.`);
    } else {
      setToast(`"${item.fileName}" 데이터를 파이프라인 3단계에 다시 불러왔습니다.`);
    }
  };

  // 엑셀 보관함에 있는 모든 파일을 한 번에 "파이프라인 적용"(DB 심층반영)만 순차 처리 — 화면 이동/개별 토스트 없이 일괄 진행
  const applyAllExcelToPipeline = async () => {
    const targets = excelArchiveList.filter((x) => !x.pipelineApplied);
    if (excelArchiveList.length === 0) { setToast("엑셀 보관함이 비어있습니다."); return; }
    if (targets.length === 0) { setToast("이미 모든 파일이 적용 완료 상태입니다."); return; }
    if (!window.confirm(`아직 적용되지 않은 ${targets.length}개 파일을 전부 파이프라인에 적용할까요? (업체·공장·제품 DB에 일괄 반영됩니다)`)) return;
    let count = 0;
    for (const item of targets) {
      try {
        syncParsedDataToDb(item.clientName, item.parsedItems, item.parsedFactories, item.parsedFactoryLinks, item.parsedFactoryHomepages);
        await ensureExcelProposalRegistered(item.clientName, item.parsedItems, item.fileName, item.parsedProposalDate);
        setExcelArchiveList((prev) => prev.map((x) => (x.id === item.id ? { ...x, pipelineApplied: true } : x)));
        try { if (FIREBASE_ENABLED && typeof item.id === "string") await fsUpdate(COLLECTIONS.excelArchive, item.id, { pipelineApplied: true }); } catch (e) { console.error(e); }
        count++;
      } catch (e) {
        console.error(`"${item.fileName}" 일괄 적용 실패:`, e);
      }
    }
    setToast(`총 ${count}개 파일을 파이프라인에 일괄 적용했습니다. (업체·공장·제품 DB 반영 완료)`);
  };

  const deleteProductRecord = async (p) => {
    if (!window.confirm(`"${p.name}" 제품을 삭제할까요?`)) return;
    setProductsList((prev) => prev.filter((x) => x.id !== p.id));
    try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsDelete(COLLECTIONS.products, p.id); } catch (e) { console.error(e); }
  };

  const addProductRecord = async (rec) => {
    setProductsList((prev) => [rec, ...prev]);
    try { await fsAdd(COLLECTIONS.products, rec); setToast("제품이 등록되었습니다."); } catch (e) { console.error(e); setToast("Firestore 저장 중 오류가 발생했습니다."); }
  };

  const updateProductRecord = async (id, patch) => {
    setProductsList((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
    try {
      if (FIREBASE_ENABLED && typeof id === "string") await fsUpdate(COLLECTIONS.products, id, patch);
      setToast("제품 정보가 수정되었습니다.");
    } catch (e) {
      console.error(e);
      setToast("Firestore 수정 중 오류가 발생했습니다. (화면에는 반영됨)");
    }
  };

  // 제품명("[코스메팩] 유리용기 / ...")과 비고류 텍스트에서 카테고리를 추출해 일괄 매칭
  const guessCategoryForProduct = (p) => guessCategoryFromName(p.name, [p.otherOptionK, p.proposalNotesK, p.productionNotesC, p.specSize].filter(Boolean).join(" "));
  const autoAssignCategories = async () => {
    const targets = productsList.filter((p) => !p.category && guessCategoryForProduct(p));
    if (targets.length === 0) { setToast("자동 매칭할 대상이 없습니다. (이미 카테고리가 있거나, 제품명에서 카테고리를 인식할 수 없습니다)"); return; }
    if (!window.confirm(`제품명/비고를 분석해서 ${targets.length}개 제품의 카테고리를 자동으로 채울까요?`)) return;
    setProductsList((prev) => prev.map((p) => {
      const guessed = guessCategoryForProduct(p);
      return (!p.category && guessed) ? { ...p, category: guessed } : p;
    }));
    for (const p of targets) {
      const guessed = guessCategoryForProduct(p);
      try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsUpdate(COLLECTIONS.products, p.id, { category: guessed }); } catch (e) { console.error(e); }
    }
    setToast(`${targets.length}개 제품의 카테고리를 자동으로 채웠습니다.`);
  };

  // 제품명 맨앞의 브랜드 대괄호(예: "[코스메팩] ...") 일괄 제거
  const stripBrandPrefixFromNames = async () => {
    const prefixRe = /^\s*\[[^\]]*\]\s*/;
    const targets = productsList.filter((p) => prefixRe.test(p.name || ""));
    if (targets.length === 0) { setToast("제품명 앞에 대괄호 표기가 있는 제품이 없습니다."); return; }
    if (!window.confirm(`${targets.length}개 제품명 앞의 "[코스메팩]" 등 대괄호 표기를 일괄로 제거할까요?`)) return;
    setProductsList((prev) => prev.map((p) => (prefixRe.test(p.name || "") ? { ...p, name: p.name.replace(prefixRe, "").trim() } : p)));
    for (const p of targets) {
      const newName = p.name.replace(prefixRe, "").trim();
      try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsUpdate(COLLECTIONS.products, p.id, { name: newName }); } catch (e) { console.error(e); }
    }
    setToast(`${targets.length}개 제품명에서 대괄호 표기를 제거했습니다.`);
  };

  const bulkAddProducts = async (records, source) => {
    let added = 0, updated = 0;
    const nextList = [...productsList];
    for (const rIn of records) {
      const guessExtra = [rIn.otherOptionK, rIn.proposalNotesK, rIn.productionNotesC].filter(Boolean).join(" ");
      let r = (!rIn.category && guessCategoryFromName(rIn.name, guessExtra)) ? { ...rIn, category: guessCategoryFromName(rIn.name, guessExtra) } : rIn;
      const key = (r.sku && r.sku.trim()) || null;
      const match = key
        ? nextList.find((p) => p.sku && p.sku.trim() === key)
        : nextList.find((p) => p.name === r.name && p.specSize === r.specSize);
      if (match && r.priceTiers && r.priceTiers.length > 0) {
        // 기존 수량별 단가 구간을 유지하면서, 같은 기준수량이면 새 값으로 갱신, 다르면 추가
        const merged = [...(match.priceTiers || [])];
        r.priceTiers.forEach((nt) => {
          const idx = merged.findIndex((ot) => String(ot.qty) === String(nt.qty));
          if (idx >= 0) merged[idx] = nt; else merged.push(nt);
        });
        r = { ...r, priceTiers: merged };
      }
      if (match) {
        const idx = nextList.indexOf(match);
        // 병합시 "빈 값"이 기존에 저장돼있던 값을 지워버리지 않도록 방어 처리.
        // (예: 박스히어로 XLSX 업로드는 사진 데이터가 없어 image:"" 로 들어오는데, 예전처럼 그대로 덮어쓰면
        //  이미 등록돼있던 제품 사진이 전부 사라지는 버그가 있었음 — 빈 문자열/null/undefined는 무시하고
        //  기존 값을 그대로 유지, 실제 값이 있는 필드만 갱신)
        const patch = {};
        Object.keys(r).forEach((k) => {
          const incoming = r[k];
          if (incoming === undefined || incoming === null) return;
          if (typeof incoming === "string" && incoming.trim() === "") return;
          patch[k] = incoming;
        });
        nextList[idx] = { ...match, ...patch };
        setProductsList((prev) => prev.map((p) => (p.id === match.id ? { ...p, ...patch } : p)));
        try { if (FIREBASE_ENABLED && typeof match.id === "string") await fsUpdate(COLLECTIONS.products, match.id, patch); } catch (e) { console.error(e); }
        updated++;
      } else {
        const rWithSource = source ? { ...r, source } : r;
        const rec = { id: Date.now() + Math.random(), ...rWithSource };
        nextList.push(rec);
        setProductsList((prev) => [rec, ...prev]);
        try { await fsAdd(COLLECTIONS.products, rWithSource); } catch (e) { console.error(e); }
        added++;
      }
    }
    setToast(`${added}개 신규 등록, ${updated}개 기존 제품 갱신 완료 (SKU/제품명 기준 중복 방지)`);
  };

  // 제품 관리: SKU 또는 (제품명+규격) 기준 중복 정리 — 가장 정보가 많은 항목만 남기고 나머지 삭제
  const dedupeProducts = async () => {
    const groups = {};
    productsList.forEach((p) => {
      const key = (p.sku && p.sku.trim()) || `${p.name}__${p.specSize || ""}`;
      if (!groups[key]) groups[key] = [];
      groups[key].push(p);
    });
    const toDelete = [];
    Object.values(groups).forEach((group) => {
      if (group.length <= 1) return;
      const scored = group.map((p) => ({ p, score: Object.values(p).filter((v) => v !== "" && v !== undefined && v !== null).length }));
      scored.sort((a, b) => b.score - a.score);
      scored.slice(1).forEach(({ p }) => toDelete.push(p));
    });
    if (toDelete.length === 0) { setToast("중복된 제품이 없습니다."); return; }
    if (!window.confirm(`중복 제품 ${toDelete.length}건을 삭제할까요? (각 그룹에서 정보가 가장 많은 1건만 남깁니다)`)) return;
    setProductsList((prev) => prev.filter((p) => !toDelete.some((d) => d.id === p.id)));
    for (const p of toDelete) {
      try { if (FIREBASE_ENABLED && typeof p.id === "string") await fsDelete(COLLECTIONS.products, p.id); } catch (e) { console.error(e); }
    }
    setToast(`중복 제품 ${toDelete.length}건을 정리했습니다.`);
  };

  // 제안서 품목 추가시 제품DB 자동 저장/갱신 (같은 제품명+사이즈 매칭시 최신단가로 업데이트)
  const upsertProductRecord = async (item) => {
    const match = productsList.find((p) => p.name === item.productName && p.specSize === item.specSize);
    const record = {
      name: item.productName, specSize: item.specSize, material: item.material, image: item.image,
      lastUnitPrice: item.unitPrice, factory: item.factory || "", wechatGroup: item.wechatGroup || "",
    };
    if (match) {
      setProductsList((prev) => prev.map((p) => (p.id === match.id ? { ...p, ...record } : p)));
      try { if (FIREBASE_ENABLED && typeof match.id === "string") await fsUpdate(COLLECTIONS.products, match.id, record); } catch (e) { console.error(e); }
    } else {
      const newRec = { id: Date.now() + Math.random(), ...record };
      setProductsList((prev) => [newRec, ...prev]);
      try { await fsAdd(COLLECTIONS.products, record); } catch (e) { console.error(e); }
    }
  };

  // 제안서 저장시 신규 업체 자동 등록
  const upsertClientRecord = async (info) => {
    if (!info.clientName.trim()) return;
    const exists = clientsList.some((c) => c.name === info.clientName);
    if (!exists) await addClientRecord({ id: Date.now(), name: info.clientName, contact: info.contact, channel: info.channel, difficulty: "표준" });
  };

  const addSourcingItem = async (item) => {
    setSourcingItems((prev) => [item, ...prev]); // 즉시 화면 반영 (로컬 캐시)
    try {
      await fsAdd(COLLECTIONS.sourcing, item);
      setToast(FIREBASE_ENABLED ? "가격조사 건이 Firestore에 저장되었습니다." : "가격조사 건이 등록되었습니다. (로컬 모드 — firebaseConfig 설정 필요)");
    } catch (e) {
      console.error(e);
      setToast("Firestore 저장 중 오류가 발생했습니다. (로컬에는 반영됨)");
    }
  };

  const updateSourcingItem = async (id, patch) => {
    setSourcingItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
    try {
      if (FIREBASE_ENABLED && typeof id === "string") await fsUpdate(COLLECTIONS.sourcing, id, patch);
      setToast("가격조사 항목이 수정되었습니다.");
    } catch (e) {
      console.error(e);
      setToast("Firestore 수정 중 오류가 발생했습니다. (화면에는 반영됨)");
    }
  };

  const deleteSourcingItem = async (item) => {
    if (!window.confirm(`"${item.name}" 가격조사 항목을 삭제할까요?`)) return;
    setSourcingItems((prev) => prev.filter((it) => it.id !== item.id));
    try { if (FIREBASE_ENABLED && typeof item.id === "string") await fsDelete(COLLECTIONS.sourcing, item.id); } catch (e) { console.error(e); }
  };

  const [editingItemId, setEditingItemId] = useState(null);
  const [proposalReadOnly, setProposalReadOnly] = useState(false);
  const [editingProposalId, setEditingProposalId] = useState(null);
  const [editingProposalHistory, setEditingProposalHistory] = useState(null);

  const loadDraftItemForEdit = (item) => {
    setEditingItemId(item.id);
    setProductImage(item.image || "");
    setProductName(item.productName || "");
    setSpecSize(item.specSize || "");
    setMaterial(item.material || "");
    setCategory(item.category || CATEGORIES[0]);
    setQuantity(item.quantity || 0);
    setCbm(item.cbm || 0);
    setSpec(item.notes || "");
    setPrintPrice(0);
    setFinishing("");
    setLeadTime(30);
    setExtraOptions([]);
    setItemFactory(item.factory || "");
    setItemWechatGroup(item.wechatGroup || "");
    const snap = item.calcSnapshot;
    if (snap) {
      setRmbBase(snap.rmbBase ?? 0);
      setRmbBox(snap.rmbBox ?? 0);
      setRmbInspect(snap.rmbInspect ?? 0);
      setRmbShip(snap.rmbShip ?? 0);
      setCustomsRate(snap.customsRate ?? (customsRates[item.category] ?? 0));
      setMarginOverride(snap.marginOverride ?? null);
      setToast(`품목 데이터를 불러왔습니다 (당시 마진율 ${pct((snap.marginRate || 0) * 100)}, 개당이익 ${won(snap.profitPerUnit || 0)}). 수정 후 [수정 반영]을 눌러주세요.`);
    } else {
      setMarginOverride(null);
      setToast("품목 데이터를 불러왔습니다. (이전 버전 저장건이라 원가 상세 내역은 없습니다) 수정 후 [수정 반영]을 눌러주세요.");
    }
  };

  const cancelEditItem = () => { setEditingItemId(null); resetItemForm(); };

  const addItemToDraft = () => {
    if (!productName.trim()) { setToast("제품명을 입력해주세요."); return; }
    const notes = composeNotes({ spec, printPrice, finishing, leadTime, cbm, extraOptions });
    const calcSnapshot = {
      rmbBase: Number(rmbBase) || 0, rmbBox: Number(rmbBox) || 0, rmbInspect: Number(rmbInspect) || 0, rmbShip: Number(rmbShip) || 0,
      customsRate: Number(customsRate) || 0, marginOverride, marginRate: calc.marginRate, autoMarginRate: calc.autoMarginRate,
      unitCostKrw: calc.unitCostKrw, logisticsPerUnit: calc.logisticsPerUnit, customsPerUnit: calc.customsPerUnit,
      totalCostPerUnit: calc.totalCostPerUnit, profitPerUnit: calc.profitPerUnit, profitRate: calc.profitRate,
      totalProfit: calc.totalProfit, totalRmbPayment: calc.totalRmbPayment,
      exRateSnapshot: { ...exRate },
    };
    const item = {
      image: productImage, productName, specSize, material, category,
      factory: itemFactory, wechatGroup: itemWechatGroup,
      quantity: Number(quantity) || 0, unitPrice: calc.proposedPrice, totalPrice: calc.totalProposal,
      cbm: Number(cbm) || 0, notes, calcSnapshot,
    };
    upsertProductRecord(item);

    if (editingItemId) {
      setDraftItems((prev) => prev.map((it) => (it.id === editingItemId ? { ...it, ...item } : it)));
      setEditingItemId(null);
      resetItemForm();
      setToast("품목이 수정 반영되었습니다.");
      return;
    }

    setDraftItems((prev) => [...prev, { id: Date.now(), ...item }]);
    resetItemForm();
    if (pendingQueue.length > 0) {
      loadNextPending();
      setToast(`품목이 추가되었습니다. 대기열의 다음 품목을 불러왔습니다 (${pendingQueue.length - 1}건 남음).`);
    } else {
      setToast("품목이 제안서에 추가되었습니다.");
    }
  };

  const removeDraftItem = (id) => setDraftItems((prev) => prev.filter((i) => i.id !== id));
  const openClientModal = (mode) => { if (draftItems.length === 0) { setToast("먼저 품목을 추가해주세요."); return; } setClientModal({ open: true, mode }); };

  const handleClientSubmit = (info) => {
    setClientInfo(info);
    const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
    const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);
    const record = { ...info, items: draftItems, totalAmount, totalCbm, validUntil: addDays(30) };
    if (clientModal.mode === "save") {
      const code = `PROP-${todayStr()}-${String(proposalList.length + 1).padStart(3, "0")}`;
      setProposalList((prev) => [{ id: Date.now(), code, status: "제안발송", createdAt: todayDisplay(), ...record }, ...prev]);
      setToast("제안서가 저장되었습니다.");
      setClientModal({ open: false, mode: "save" });
      setDraftItems([]);
    } else {
      setPdfData(record);
      setClientModal({ open: false, mode: "pdf" });
    }
  };

  return (
    <div className="min-h-screen pb-24">
      <style>{`
        @page { size: A4 portrait; margin: 8mm 12mm; }
        @media print {
        body * { visibility: hidden; }
        #pdf-page, #pdf-page * { visibility: visible; }
        #pdf-preview-overlay { position: static !important; overflow: visible !important; background: none !important; padding: 0 !important; }
        .proposal-modal-content, #pdf-page {
          position: static !important;
          width: 186mm !important; max-width: 186mm !important;
          transform: none !important; zoom: 1 !important;
          box-shadow: none !important; margin: 0 auto !important; padding: 0 !important;
          font-size: 12px;
        }
        .no-print { display: none !important; }
        #pdf-page table { table-layout: fixed !important; width: 100% !important; }
        #pdf-page input, #pdf-page textarea {
          border: none !important; background: transparent !important; padding: 0 !important;
          width: 100% !important; box-sizing: border-box !important; display: block !important;
        }
        #pdf-page .print-terms { font-size: 11px !important; line-height: 1.4 !important; }
        #pdf-page .proposal-info-row {
          display: flex !important; justify-content: space-between !important; align-items: flex-start !important;
        }
        #pdf-page .proposal-info-row > div { width: 48% !important; }
        #pdf-page .proposal-info-row > table { width: 48% !important; }
      }`}</style>
      {toast && <div className="fixed top-4 right-4 z-[60] bg-slate-800 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg no-print">✓ {toast}</div>}

      <ClientInfoModal open={clientModal.open} mode={clientModal.mode} initial={clientInfo} itemCount={draftItems.length}
        onClose={() => setClientModal({ open: false, mode: clientModal.mode })} onSubmit={handleClientSubmit} />
      <PdfPreview open={!!pdfData} data={pdfData} onClose={() => setPdfData(null)} supplierLogo={supplierLogo} />
      <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} logistics={logistics} setLogistics={setLogistics} marginTable={marginTable} setMarginTable={setMarginTable} customsRates={customsRates} setCustomsRates={setCustomsRates} difficultyMargins={difficultyMargins} setDifficultyMargins={setDifficultyMargins} supplierLogo={supplierLogo} setSupplierLogo={setSupplierLogo} />

      <header className="bg-[#1E3A8A] text-white relative">
        {/* 1단: 최상단 유틸리티 바 — 환율 요약 + 계정/시스템 상태 */}
        <div className="bg-black/20 border-b border-white/10">
          <div className="max-w-7xl mx-auto px-6 py-1.5 flex items-center justify-between gap-3 flex-wrap text-xs">
            <div className="flex items-center gap-2 relative">
              <span className="text-white/80">
                💡 1 CNY = {fmtRate((exRateSuggestion && exRateSuggestion.rmbToKrw) || exRate.rmbToKrw)}원 | 1 USD = {fmtRate((exRateSuggestion && exRateSuggestion.usdToKrw) || exRate.usdToKrw)}원
                <span className="text-white/50"> ({((exRateSuggestion && exRateSuggestion.updatedAt) || todayDisplay()).slice(5)})</span>
              </span>
              <button onClick={() => setExSettingsOpen((v) => !v)} className="px-2 py-0.5 rounded bg-white/15 hover:bg-white/25 font-medium whitespace-nowrap">⚙️ 환율 상세설정</button>

              {exSettingsOpen && (
                <React.Fragment>
                  <div className="fixed inset-0 z-40" onClick={() => setExSettingsOpen(false)} />
                  <div className="absolute top-full left-0 mt-2 z-50 bg-white text-slate-800 rounded-xl shadow-2xl border border-slate-200 p-4 w-[420px]">
                    <div className="text-xs font-semibold text-slate-500 mb-3">3대 환율 설정</div>
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-xs text-slate-500 w-20 shrink-0">위안→원화</span>
                      <input type="number" step="0.01" disabled={!isAdmin} value={exRate.rmbToKrw} onChange={(e) => setExRate({ ...exRate, rmbToKrw: e.target.value })} onBlur={() => formatExRateField("rmbToKrw")} className={"flex-1 px-2 py-1.5 rounded-md border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]" + (!isAdmin ? " opacity-60 cursor-not-allowed bg-slate-50" : "")} />
                    </div>
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-xs text-slate-500 w-20 shrink-0">위안→달러</span>
                      <input type="number" step="0.01" disabled={!isAdmin} value={exRate.rmbToUsd} onChange={(e) => setExRate({ ...exRate, rmbToUsd: e.target.value })} onBlur={() => formatExRateField("rmbToUsd")} className={"flex-1 px-2 py-1.5 rounded-md border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]" + (!isAdmin ? " opacity-60 cursor-not-allowed bg-slate-50" : "")} />
                    </div>
                    <div className="flex items-center gap-2 mb-3">
                      <span className="text-xs text-slate-500 w-20 shrink-0">달러→원화</span>
                      <input type="number" step="0.01" disabled={!isAdmin} value={exRate.usdToKrw} onChange={(e) => setExRate({ ...exRate, usdToKrw: e.target.value })} onBlur={() => formatExRateField("usdToKrw")} className={"flex-1 px-2 py-1.5 rounded-md border border-slate-200 text-sm outline-none focus:border-[#1E3A8A]" + (!isAdmin ? " opacity-60 cursor-not-allowed bg-slate-50" : "")} />
                    </div>
                    {exRateSavedAt && <div className="text-[11px] text-slate-400 mb-2">최종 저장: {exRateSavedAt}</div>}
                    {exRateSuggestion && (
                      <div className="text-[11px] text-slate-500 bg-slate-50 rounded-lg px-2.5 py-2 mb-3 leading-relaxed">
                        💡 오늘 기준 환율(송금보낼 때): 1 CNY = {fmtRate(exRateSuggestion.rmbToKrw)} KRW | 1 USD = {fmtRate(exRateSuggestion.usdToKrw)} KRW (업데이트: {exRateSuggestion.updatedAt})
                      </div>
                    )}
                    {isAdmin && (
                      <div className="flex gap-2">
                        {exRateSuggestion && <button onClick={applyTodayExchangeRates} className="flex-1 text-xs px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium whitespace-nowrap">🔄 오늘 환율 적용</button>}
                        <button onClick={() => { saveExRate(); setExSettingsOpen(false); }} className="flex-1 text-xs px-3 py-2 rounded-lg bg-[#1E3A8A] text-white hover:opacity-90 font-semibold whitespace-nowrap">💾 저장</button>
                      </div>
                    )}
                  </div>
                </React.Fragment>
              )}
            </div>

            <div className="flex items-center gap-3">
              <span className={"px-2.5 py-1 rounded-md font-semibold " + (FIREBASE_ENABLED ? "bg-emerald-500/20 text-emerald-200" : "bg-white/10 text-white/50")}>
                {FIREBASE_ENABLED ? "🟢 Firestore 연결됨" : "⚪ 로컬 모드"}
              </span>
              {roleUser && (
                <React.Fragment>
                  <span className="text-white/90 font-medium whitespace-nowrap">
                    {roleUser.role === "admin" ? "👑 " : "👤 "}{roleUser.displayName} {roleUser.role === "admin" ? "관리자" : "직원"}
                  </span>
                  <button onClick={onLogout} className="text-white/70 hover:text-white underline whitespace-nowrap">로그아웃</button>
                </React.Fragment>
              )}
            </div>
          </div>
        </div>

        {/* 2단: 메인 내비게이션 바 — 로고 + 메뉴 탭 */}
        <div className="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-3" title="가격조사 → 제안가계산 → 제안서작성 → 샘플진행 → 본품계약/발주">
            <div className="w-9 h-9 rounded-lg bg-white/15 flex items-center justify-center text-lg shrink-0">🧭</div>
            <h1 className="text-lg md:text-xl font-bold leading-tight whitespace-nowrap">CosmePack 파이프라인</h1>
          </div>
          <div className="flex items-center gap-1.5 flex-wrap">
            {[
              { key: "products", label: "📦 제품 관리" },
              { key: "proposals", label: "📄 제안서 목록" },
              { key: "excel", label: "📂 엑셀 보관함" },
              { key: "clients", label: "🏢 업체 관리" },
              { key: "factories", label: "🏭 공장 관리" },
            ].map((m) => (
              <button
                key={m.key}
                onClick={() => setView(m.key)}
                className={"text-sm font-semibold px-4 py-2.5 rounded-lg whitespace-nowrap transition-colors " + (view === m.key ? "bg-white text-[#1E3A8A] shadow-sm" : "bg-white/15 hover:bg-white/25")}
              >
                {m.label}
              </button>
            ))}
            {isAdmin && <button onClick={() => setSettingsOpen(true)} className="text-sm font-semibold px-4 py-2.5 rounded-lg whitespace-nowrap transition-colors bg-white/15 hover:bg-white/25">⚙️ 기준정보</button>}
            {isAdmin && <button onClick={() => setAccountModalOpen(true)} className="text-sm font-semibold px-4 py-2.5 rounded-lg whitespace-nowrap transition-colors bg-white/15 hover:bg-white/25">👥 계정 관리</button>}
          </div>
        </div>
      </header>
      {accountModalOpen && (
        <AccountManageModal accounts={accounts} onSave={onSaveAccount} onDelete={onDeleteAccount} onClose={() => setAccountModalOpen(false)} />
      )}

      {view === "pipeline" && <Stepper active={activeStep} onChange={setActiveStep} />}

      {view === "proposals" && (
        <ProposalListView
          isAdmin={isAdmin}
          proposals={proposalList}
          onBack={() => setView("pipeline")}
          onOpenPdf={(p) => setPdfData({ ...p, readOnly: true })}
          onView={(p) => {

          supplierLogo={supplierLogo} isAdmin={isAdmin}
          readOnly={proposalReadOnly} isEditingExisting={!!editingProposalId} historyRecord={editingProposalHistory}
          onBack={() => setActiveStep(2)}
          onSave={async () => {
            if (draftItems.length === 0) { setToast("먼저 품목을 추가해주세요."); return; }
            if (!clientInfo.clientName.trim() || !clientInfo.employee.trim()) { setToast("고객사명과 담당 직원명을 입력해주세요."); return; }
            if (editingProposalId && !isAdmin) {
              const original = proposalList.find((p) => p.id === editingProposalId);
              if (original && isReviewLockedForStaff(original, isAdmin)) {
                setToast("이미 승인완료/발송완료된 제안서는 대표님만 수정할 수 있습니다.");
                return;
              }
            }
            const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
            const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);
            const itemSummary = draftItems.length > 1 ? `${draftItems[0].productName} 외 ${draftItems.length - 1}건` : draftItems[0].productName;
            const proposalTitle = clientInfo.proposalTitle.trim() || itemSummary;
            const actorName = (roleUser && roleUser.displayName) || "알 수 없음";
            const nextReviewStatus = isAdmin ? "승인완료" : "검토대기";

            if (editingProposalId) {
              // 기존 제안서 수정 저장 — 새로 만들지 않고 덮어쓰기
              const patch = {
                clientName: clientInfo.clientName, contact: clientInfo.contact, channel: clientInfo.channel, employee: clientInfo.employee,
                proposalTitle, itemSummary, totalAmount, totalCbm, items: draftItems,
                reviewStatus: nextReviewStatus,
                updatedAt: nowDateTimeStr(), updatedBy: actorName,
              };
              setProposalList((prev) => prev.map((p) => (p.id === editingProposalId ? { ...p, ...patch } : p)));
              setEditingProposalHistory((prev) => ({ ...(prev || {}), updatedAt: patch.updatedAt, updatedBy: patch.updatedBy }));
              try {
                await fsUpdate(COLLECTIONS.proposals, editingProposalId, patch);
                setToast(isAdmin ? "최종 승인되어 저장되었습니다. (같은 제안번호로 갱신됨)" : "수정사항이 저장되어 대표님 검토 요청되었습니다.");
              } catch (e) {
                console.error(e);
                setToast("Firestore 저장 중 오류가 발생했습니다. (화면에는 반영됨)");
              }
              return;
            }

            const code = `PROP-${todayStr()}-${String(proposalList.length + 1).padStart(3, "0")}`;
            const record = {
              code, status: "견적제출", reviewStatus: nextReviewStatus, createdAt: nowDateTimeStr(), createdBy: actorName,
              clientName: clientInfo.clientName, contact: clientInfo.contact, channel: clientInfo.channel, employee: clientInfo.employee,
              proposalTitle, itemSummary, totalAmount, totalCbm,
              items: draftItems, validUntil: addDays(30),
            };
            setProposalList((prev) => [{ id: Date.now(), ...record }, ...prev]); // 즉시 화면 반영 (로컬 캐시)
            upsertClientRecord(clientInfo);
            try {
              await fsAdd(COLLECTIONS.proposals, record);
              setToast(isAdmin ? "제안서가 최종 승인되어 저장되었습니다." : "제안서가 저장되어 대표님 검토 요청되었습니다.");
            } catch (e) {
              console.error(e);
              setToast("Firestore 저장 중 오류가 발생했습니다. (로컬에는 반영됨)");
            }
            setDraftItems([]);
            setClientInfo({ clientName: "", contact: "", channel: "카카오채널", employee: "", proposalTitle: "" });
          }}
          onPrint={() => {
            if (draftItems.length === 0) { setToast("먼저 품목을 추가해주세요."); return; }
            if (!clientInfo.clientName.trim()) { setToast("고객사명을 입력해주세요."); return; }
            const totalAmount = draftItems.reduce((s, i) => s + i.totalPrice, 0);
            const totalCbm = draftItems.reduce((s, i) => s + i.cbm, 0);
            setPdfData({ ...clientInfo, items: draftItems, totalAmount, totalCbm, validUntil: addDays(30), readOnly: proposalReadOnly });
          }}
        />
      )}

      {view === "pipeline" && activeStep === 4 && (
        <PlaceholderStage icon="🧪" title="4단계 · 샘플 진행 (Sample Invoice)"
          desc="제안서 검토 후 샘플을 요청하면 이 단계에서 샘플비 인보이스를 발행합니다."
          points={[
            "샘플비 인보이스 (샘플단가 + 중국내 운송료 + 택배비, 원화/달러 선택)",
            "CT샘플(맞춤형 내용물 적합성 테스트) 인보이스 — 본 발주 시 전액 차감 안내 포함",
            "입금계좌 안내: " + SUPPLIER.bank,
            "인쇄/PDF 출력 기능",
          ]} />
      )}

      {view === "pipeline" && activeStep === 5 && (
        <PlaceholderStage icon="📦" title="5단계 · 본품계약 & 공장 발주 (Order & Final Invoice)"
          desc="계약이 확정되면 이 단계에서 정식 인보이스와 공장 발주서를 생성합니다."
          points={[
            "본품 인보이스 (원화/외환 선택 발행)",
            "중국 공장 전달용 발주서(订货单) — 제품명/수량/단가/합계, 정금(定金) 30% · 여관(余款) 70% 자동 구분",
            "정산내역서 — 상품대금/운송료/통관수수료/이익·이익율 자동 계산 후 DB 보관",
          ]} />
      )}
    </div>
  );
}

const DEFAULT_ACCOUNTS = [
  { id: "acc-admin", name: "대표님", username: "admin", password: "admin123", role: "admin" },
  { id: "acc-staff", name: "홍길동", username: "staff", password: "staff123", role: "staff" },
];
const ACCOUNTS_STORAGE_KEY = "cosmepack_accounts";
const ROLE_STORAGE_KEY = "cosmepack_role_user";

function loadAccounts() {
  try {
    const raw = localStorage.getItem(ACCOUNTS_STORAGE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed) && parsed.length > 0) return parsed; }
  } catch (e) { console.error(e); }
  return DEFAULT_ACCOUNTS;
}
function saveAccounts(list) {
  try { localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(list)); } catch (e) { console.error(e); }
}

function RoleLoginScreen({ accounts, onLogin }) {
  const [username, setUsername] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    const match = accounts.find((acc) => acc.username === username && acc.password === password);

  return (
    <div className="min-h-screen flex items-center justify-center bg-[#F5F7FA]">

        <label className="block text-xs font-medium text-slate-600 mb-1.5">비밀번호</label>

function AccountManageModal({ accounts, onSave, onDelete, onClose }) {
  const [editingId, setEditingId] = useState(null);
  const [name, setName] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [role, setRole] = useState("staff");

  const resetForm = () => { setEditingId(null); setName(""); setUsername(""); setPassword(""); setRole("staff"); };

  const startEdit = (acc) => {
    setEditingId(acc.id); setName(acc.name); setUsername(acc.username); setPassword(acc.password); setRole(acc.role);
  };

  const submit = () => {
    if (!name.trim() || !username.trim() || !password.trim()) return;
    if (!editingId && accounts.some((a) => a.username === username.trim())) { alert("이미 사용 중인 아이디입니다."); return; }
    onSave({ id: editingId || ("acc-" + Date.now()), name: name.trim(), username: username.trim(), password: password.trim(), role });
    resetForm();
  };

  const handleDelete = (acc) => {
    if (accounts.length <= 1) { alert("최소 1개의 계정은 남아있어야 합니다."); return; }
    if (!window.confirm(`"${acc.name}(${acc.username})" 계정을 삭제할까요?`)) return;
    onDelete(acc.id);
    if (editingId === acc.id) resetForm();
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl w-full max-w-2xl overflow-hidden flex flex-col" style={{ maxHeight: "88vh" }}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">👥 계정 관리</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-6 overflow-y-auto flex-1">
          <Card title={editingId ? "계정 정보 수정" : "신규 계정 추가"}>
            <div className="grid grid-cols-2 gap-4">
              <Field label="이름"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 홍길동" /></Field>
              <Field label="아이디"><input className={inputCls} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="로그인 아이디" disabled={!!editingId} /></Field>
              <Field label="비밀번호"><input className={inputCls} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="비밀번호" /></Field>
              <Field label="권한">
                <select className={inputCls} value={role} onChange={(e) => setRole(e.target.value)}>
                  <option value="admin">관리자</option>
                  <option value="staff">직원</option>
                </select>
              </Field>
            </div>
            <div className="flex gap-2">
              <button onClick={submit} className="mt-1 py-2.5 px-5 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90">{editingId ? "✓ 수정 반영" : "＋ 계정 추가"}</button>
              {editingId && <button onClick={resetForm} className="mt-1 py-2.5 px-5 rounded-lg border border-slate-200 text-slate-500 text-sm hover:bg-slate-50">취소</button>}
            </div>
          </Card>

          <div className="h-5" />

          <div className="bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm">
            <table className="w-full text-sm">
              <thead><tr className="bg-slate-50 text-xs font-semibold text-slate-600">
                <th className="text-left px-4 py-2.5">이름</th>
                <th className="text-left px-4 py-2.5">아이디</th>
                <th className="text-left px-4 py-2.5">비밀번호</th>
                <th className="text-left px-4 py-2.5">권한</th>
                <th className="text-right px-4 py-2.5">작업</th>
              </tr></thead>
              <tbody>
                {accounts.map((acc, idx) => (
                  <tr key={acc.id} className={"border-t border-slate-100 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                    <td className="px-4 py-2.5 font-medium text-slate-800">{acc.name}</td>
                    <td className="px-4 py-2.5 text-slate-600">{acc.username}</td>
                    <td className="px-4 py-2.5 text-slate-400 font-mono text-xs">{acc.password}</td>
                    <td className="px-4 py-2.5">
                      <span className={"text-[10px] px-2 py-0.5 rounded-full font-medium " + (acc.role === "admin" ? "bg-amber-100 text-amber-800" : "bg-blue-100 text-blue-700")}>
                        {acc.role === "admin" ? "관리자" : "직원"}
                      </span>
                    </td>
                    <td className="px-4 py-2.5 text-right whitespace-nowrap">
                      <button onClick={() => startEdit(acc)} className="text-xs px-2 py-1 text-slate-500 hover:text-[#1E3A8A] mr-2">✏️ 수정</button>
                      <button onClick={() => handleDelete(acc)} className="text-xs px-2 py-1 text-red-400 hover:text-red-600">🗑️ 삭제</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

      const map = {
        "auth/invalid-email": "이메일 형식이 올바르지 않습니다.",

        </button>

        <p className="text-[11px] text-slate-400 mt-4 leading-relaxed">
          계정이 없으신가요? Firebase 콘솔 → Authentication → Users 탭에서 관리자가 이메일/비밀번호 계정을 추가해드릴 수 있습니다.
        </p>
      </form>
    </div>
  );
}

function Root() {
  const [checking, setChecking] = useState(FIREBASE_ENABLED);
  const [user, setUser] = useState(null);
  const [authError, setAuthError] = useState("");
  const [roleUser, setRoleUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(ROLE_STORAGE_KEY)); } catch (e) { return null; }
  });
  const [accounts, setAccounts] = useState(loadAccounts);

  useEffect(() => {
    // 계정 목록(아이디/비번)을 이 브라우저의 localStorage에만 두면 다른 컴퓨터에서 로그인할 때 안 보이는 문제가 있어
    // Firestore로 실시간 공유한다. Firestore에 계정이 하나도 없으면(최초 1회) 이 브라우저의 기존 계정
    // (관리자가 이미 만들어둔 커스텀 계정 포함, 없으면 기본계정)을 그대로 업로드해서 이관한다.
    if (!FIREBASE_ENABLED || !db) return;
    const unsub = db.collection(COLLECTIONS.accounts).onSnapshot(
      (snap) => {
        if (snap.empty) {
          const seed = loadAccounts();
          seed.forEach((acc) => { db.collection(COLLECTIONS.accounts).doc(acc.id).set(acc).catch((e) => console.error(e)); });
          setAccounts(seed);
        } else {
          setAccounts(snap.docs.map((d) => ({ ...d.data(), id: d.id })));
        }
      },
      (err) => console.error("accounts 구독 오류:", err)
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!FIREBASE_ENABLED) return; // 로컬 모드에서는 로그인 없이 바로 진입
    const unsub = auth.onAuthStateChanged((u) => {
      if (u) {
        setUser(u);
        setChecking(false);
      } else {
        // 사용자에게는 이메일 로그인 화면을 보여주지 않고, Firestore 접근용으로만 백그라운드에서 익명 인증
        auth.signInAnonymously().catch((e) => {
          console.error(e);
          setAuthError(e.code === "auth/operation-not-allowed"
            ? "Firebase 콘솔 → Authentication → Sign-in method에서 '익명(Anonymous)' 로그인을 한 번만 켜주세요."
            : "Firebase 연결 오류: " + e.message);
          setChecking(false);
        });
      }
    });
    return () => unsub();
  }, []);

  const handleRoleLogin = (ru) => {
    try { localStorage.setItem(ROLE_STORAGE_KEY, JSON.stringify(ru)); } catch (e) { console.error(e); }
    setRoleUser(ru);
  };
  const handleFullLogout = () => {
    try { localStorage.removeItem(ROLE_STORAGE_KEY); } catch (e) { console.error(e); }
    setRoleUser(null);
  };
  const saveAccount = async (acc) => {
    setAccounts((prev) => {
      const exists = prev.some((a) => a.id === acc.id);
      const next = exists ? prev.map((a) => (a.id === acc.id ? acc : a)) : [...prev, acc];
      if (!FIREBASE_ENABLED) saveAccounts(next); // 로컬(오프라인) 모드 폴백
      return next;
    });
    if (FIREBASE_ENABLED && db) {
      try { await db.collection(COLLECTIONS.accounts).doc(acc.id).set(acc); } catch (e) { console.error(e); }
    }
  };
  const deleteAccount = async (id) => {
    setAccounts((prev) => {
      const next = prev.filter((a) => a.id !== id);
      if (!FIREBASE_ENABLED) saveAccounts(next);
      return next;
    });
    if (FIREBASE_ENABLED && db) {
      try { await db.collection(COLLECTIONS.accounts).doc(id).delete(); } catch (e) { console.error(e); }
    }
  };

  if (checking) {
    return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">불러오는 중...</div>;
  }
  if (FIREBASE_ENABLED && authError) {
    return <div className="min-h-screen flex items-center justify-center bg-[#F5F7FA] p-6"><div className="bg-white border border-red-200 rounded-xl p-6 max-w-md text-sm text-red-600">{authError}</div></div>;
  }
  if (!roleUser) {
    return <RoleLoginScreen accounts={accounts} onLogin={handleRoleLogin} />;
  }
  return <App currentUser={user} onLogout={handleFullLogout} roleUser={roleUser} accounts={accounts} onSaveAccount={saveAccount} onDeleteAccount={deleteAccount} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
