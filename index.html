  const [newLocation, setNewLocation] = useState("본사 창고");
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [edits, setEdits] = useState({}); // { [재고id]: {productName?, quantity?, location?} } — [💾수정저장] 누르기 전까지의 임시 수정본
  const [saved, setSaved] = useState(false);
  // 제품 관리 DB에서 실시간 검색(다중키워드+유사도순 정렬은 기존 smartProductSearch 재사용) — 최대 6개만 노출
  const suggestions = newName.trim() ? smartProductSearch(products, newName).slice(0, 6) : [];
  const pickSuggestion = (p) => {
    setNewName([p.name, p.specSize].filter(Boolean).join(" / ")); // 정확한 전체 제품명+규격을 그대로 삽입(오기입 방지)
    setShowSuggestions(false);
  };
  const addRow = () => {
    if (!newName.trim()) return;
    onAdd({ productName: newName.trim(), quantity: Number(newQty) || 0, location: newLocation.trim() || "본사 창고" });
    setNewName(""); setNewQty(1);
  };
  const getVal = (s, field) => (edits[s.id] && edits[s.id][field] !== undefined ? edits[s.id][field] : s[field]);
  const setEditField = (id, field, value) => setEdits((prev) => ({ ...prev, [id]: { ...prev[id], [field]: value } }));
  const saveEdits = async () => {
    await onSaveEdits(edits);
    setEdits({});
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl w-full overflow-hidden flex flex-col" style={{ width: "95vw", maxWidth: "980px", height: "80vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
          <h2 className="text-base font-bold text-slate-800">📦 한국 본사 샘플 재고 현황</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="p-5 overflow-y-auto flex-1">
          {isAdmin && (
            <div className="flex gap-2 mb-4 pb-4 border-b border-slate-100">
              <div className="relative" style={{ flex: "2 1 0%" }}>
                <input
                  value={newName}
                  onChange={(e) => { setNewName(e.target.value); setShowSuggestions(true); }}
                  onFocus={() => setShowSuggestions(true)}
                  onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
                  placeholder="제품명 (제품 DB에서 검색하거나 새 이름을 직접 입력)"
                  className="w-full text-xs px-2.5 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]"
                />
                {showSuggestions && suggestions.length > 0 && (
                  <div className="absolute z-50 left-0 top-full mt-1 w-full max-h-72 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-lg">
                    {suggestions.map((p) => (
                      <button key={p.id} type="button" onMouseDown={() => pickSuggestion(p)} className="w-full flex items-center gap-2.5 px-2.5 py-2 hover:bg-slate-50 text-left border-b border-slate-50 last:border-0">
                        <div className="w-9 h-9 rounded bg-slate-50 border border-slate-100 overflow-hidden shrink-0 flex items-center justify-center">
                          {p.image ? <img src={p.image} loading="lazy" className="w-full h-full object-cover" /> : <span className="text-slate-300 text-[9px]">사진</span>}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="text-xs font-medium text-slate-800" style={{ whiteSpace: "normal", wordBreak: "break-all" }}>{p.name}</div>
                          <div className="text-[10px] text-slate-400 truncate">{p.specSize || "규격 미상"}</div>
                        </div>
                        {p.category && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-[#1E3A8A]/10 text-[#1E3A8A] font-medium shrink-0 whitespace-nowrap">{p.category}</span>}
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <input type="number" value={newQty} onChange={(e) => setNewQty(e.target.value)} className="w-20 text-xs px-2.5 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]" />
              <input value={newLocation} onChange={(e) => setNewLocation(e.target.value)} placeholder="위치" className="w-28 text-xs px-2.5 py-2 rounded-lg border border-slate-200 outline-none focus:border-[#1E3A8A]" />
              <button onClick={addRow} className="text-xs px-3 py-2 rounded-lg bg-[#1E3A8A] text-white font-medium hover:opacity-90 whitespace-nowrap">➕ 등록/입고</button>
            </div>
          )}
          <div className="border border-slate-200 rounded-lg overflow-hidden">
            <table className="w-full text-xs">
              <thead><tr className="bg-slate-50 text-slate-500">
                <th className="text-left px-3 py-2 font-medium">제품명</th>
                <th className="text-right px-3 py-2 font-medium w-24">보유 수량</th>
                <th className="text-left px-3 py-2 font-medium w-32">위치</th>
                {isAdmin && <th className="w-12"></th>}
              </tr></thead>
              <tbody>
                {(stock || []).length === 0 && <tr><td colSpan={4} className="text-center text-slate-400 py-8">등록된 재고가 없습니다.</td></tr>}
                {(stock || []).map((s) => (
                  <tr key={s.id} className={"border-t border-slate-100 " + (edits[s.id] ? "bg-amber-50/50" : "")}>
                    <td className="px-3 py-1.5">
                      {isAdmin ? <input className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={getVal(s, "productName")} onChange={(e) => setEditField(s.id, "productName", e.target.value)} /> : s.productName}
                    </td>
                    <td className="px-3 py-1.5 text-right">
                      {isAdmin ? <input type="number" className="w-20 text-right px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={getVal(s, "quantity")} onChange={(e) => setEditField(s.id, "quantity", Number(e.target.value) || 0)} /> : <span className="font-semibold">{s.quantity}</span>}
                    </td>
                    <td className="px-3 py-1.5">
                      {isAdmin ? <input className="w-full px-1.5 py-1 rounded border border-slate-200 outline-none focus:border-[#1E3A8A]" value={getVal(s, "location") || ""} onChange={(e) => setEditField(s.id, "location", e.target.value)} /> : (s.location || "-")}
                    </td>
                    {isAdmin && <td className="px-3 py-1.5 text-center"><button onClick={() => onDelete(s)} className="text-red-400 hover:text-red-600">🗑️</button></td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        {isAdmin && (
          <div className="px-6 py-4 border-t border-slate-200 flex items-center justify-end gap-2 shrink-0">
            {Object.keys(edits).length > 0 && <span className="text-[11px] text-amber-600 mr-auto">수정된 항목 {Object.keys(edits).length}건 — 저장 전입니다</span>}
            <button onClick={saveEdits} disabled={Object.keys(edits).length === 0} className="px-5 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed">{saved ? "✅ 저장됨" : "💾 수정 저장"}</button>
          </div>
        )}
      </div>
    </div>
  );
}

// 리스트 행을 클릭하면 기존 SampleCard(진행바+단계별확인+인보이스/안내문 버튼 전부)를 모달 형태로 감싸서 보여준다.
function SampleDetailModal({ onClose, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-40 p-4" onClick={onClose}>
      {/* max-w-md(448px)는 5단계 스텝바·단계표를 담기엔 너무 좁아 글자가 잘리고 겹쳐 보였다 → 2xl(672px)로 확대 */}
      <div className="bg-white rounded-xl w-full max-w-2xl overflow-y-auto" style={{ maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-end px-3 pt-3">
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
        </div>
        <div className="px-4 pb-4">{children}</div>
      </div>
    </div>
  );
}

function SampleStageView({ samples, accounts, proposals, products, sampleStock, onDecrementStock, supplierLogo, shippingFees, shippingFeeNotes, onSaveShippingFees, currentUserName, isAdmin, onCreate, onUpdate, onDelete, onAddStock, onUpdateStock, onSaveStockEdits, onDeleteStock, onAddMemo, onDeleteMemo, initialProposalId, onConsumeInitialProposal, onBack }) {
  const [showCreate, setShowCreate] = useState(false);
  const [pendingProposalId, setPendingProposalId] = useState(null); // "🧪 샘플요청 등록"으로 넘어온 제안서 id를 등록모달에 넘겨주기 위한 로컬 보관
  // "🧪 샘플요청 등록"으로 특정(발송완료된) 제안서에서 넘어온 경우, 등록모달을 자동으로 열어준다.
  useEffect(() => {
    if (initialProposalId) {
      setPendingProposalId(initialProposalId);
      setShowCreate(true);
      if (onConsumeInitialProposal) onConsumeInitialProposal();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [initialProposalId]);
  const [showStockManage, setShowStockManage] = useState(false);
  const [showFeeSettings, setShowFeeSettings] = useState(false);
  const [filter, setFilter] = useState("전체");
  const [typeFilter, setTypeFilter] = useState("전체"); // "전체" | "general" | "ct" — 진행단계 필터와 독립적으로 동작(AND 조건)
  const [ctPreset, setCtPreset] = useState(null); // 🧪CT전환 버튼으로 등록모달을 열 때 넘겨줄 프리필 데이터
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;
  /* "📋" 진행상황 모달 — ⚠️ 객체가 아니라 **id만** 들고 있어야 한다.
     예전엔 클릭 시점의 객체 스냅샷을 저장해서, 메모를 등록하거나 단계를 확인해도
     모달이 보는 sample은 옛 스냅샷 그대로였다(=메모가 목록에 안 나타나 "등록이 안 된다"고 보임).
     아래 detailSample은 samples 배열에서 매 렌더마다 최신값을 다시 찾아 쓴다. */
  const [detailSampleId, setDetailSampleId] = useState(null);
  const detailSample = detailSampleId != null ? (samples || []).find((s) => s.id === detailSampleId) || null : null;
  const setDetailSample = (s) => setDetailSampleId(s ? s.id : null);
  const [invoiceSampleId, setInvoiceSampleId] = useState(null); // 객체가 아니라 id만 보관 — samples가 갱신될 때마다 최신 데이터를 다시 찾아 배지 등이 즉시 반영됨
  const [invoiceViewMode, setInvoiceViewMode] = useState("view"); // "view"(조회전용) | "edit"(수정가능) — 어떤 아이콘으로 열었는지
  const invoiceSample = invoiceSampleId ? (samples || []).find((s) => s.id === invoiceSampleId) : null;
  // 신규 샘플 발송 등록이 끝나면(재고차감 포함) 그 샘플 정보가 자동 반영된 인보이스 작성 모달을 연속으로 연다.
  const handleCreateSample = async (rec) => {
    const created = await onCreate(rec);
    if (created) { setInvoiceViewMode("edit"); setInvoiceSampleId(created.id); }
  };
  // 🧪 CT전환: 일반샘플 행의 업체정보/제품정보를 그대로 물려받아 CT샘플 등록모달을 연다(원본 일반샘플은 그대로 보존됨)
  const openCtConversion = (e, s) => {
    e.stopPropagation();
    setCtPreset({
      sampleType: "ct",
      clientName: s.clientName || "",
      productName: s.productName || "",
      image: s.image || "",
      assignee: s.assignee || "",
      linkedProposalId: s.linkedProposalId || "",
      convertedFromSampleId: s.id,
    });
    setShowCreate(true);
  };
  const filtered = (samples || []).filter((s) =>
    (filter === "전체" || s.status === filter) &&
    (typeFilter === "전체" || getSampleType(s) === typeFilter)
  );
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pagedFiltered = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  useEffect(() => { setPage(1); }, [filter, typeFilter]);
  useEffect(() => { if (page > totalPages) setPage(totalPages); }, [totalPages]);
  const toggleFlag = (e, s, field) => { e.stopPropagation(); onUpdate(s, { [field]: !s[field] }); };
  const handleDeleteRow = (e, s) => {
    e.stopPropagation();
    onDelete(s); // deleteSample(App레벨)이 자체적으로 confirm을 띄운 뒤 삭제 처리(카드뷰/상세모달의 삭제버튼과 동일 로직 공유)
  };
  return (
    <main className="max-w-7xl mx-auto px-6 py-8">
      <div className="bg-white rounded-xl border border-slate-200 p-5 mb-6">
        <div className="flex items-center justify-between gap-3 mb-2">
          <div className="flex items-center gap-3">
            <span className="text-2xl">🧪</span>
            <div>
              <h2 className="text-base font-bold text-slate-800">4단계 · 샘플 진행</h2>
              <p className="text-xs text-slate-500">재고 위치(국내/중국발주)에 따라 발송 경로를 구분하고, 요청→발주→입고→발송 4단계로 진행 상황을 관리합니다. 목록의 행을 클릭하면 자세한 인보이스·진행 내용을 확인할 수 있습니다.</p>
            </div>
          </div>
          {onBack && <button onClick={onBack} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 whitespace-nowrap">← 돌아가기</button>}
        </div>
      </div>

      <div className="flex items-center gap-1.5 mb-3">
        {["전체", ...SAMPLE_TYPE_OPTIONS].map((t) => {
          const count = t === "전체" ? (samples || []).length : (samples || []).filter((s) => getSampleType(s) === t).length;
          const active = typeFilter === t;
          const activeCls = t === "ct" ? "bg-purple-600 text-white border-purple-600" : "bg-[#1E3A8A] text-white border-[#1E3A8A]";
          return (
            <button key={t} onClick={() => setTypeFilter(t)} className={"text-xs px-4 py-2 rounded-lg font-semibold border " + (active ? activeCls : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
              {t === "전체" ? "전체" : SAMPLE_TYPE_LABELS[t]} <span className={"ml-1 font-normal " + (active ? "text-white/70" : "text-slate-400")}>{count}</span>
            </button>
          );
        })}
      </div>

      <div className="flex items-center justify-between mb-4">
        <div className="flex gap-1.5">
          {["전체", ...SAMPLE_STATUS_OPTIONS].map((f) => (
            <button key={f} onClick={() => setFilter(f)} className={"text-xs px-3 py-1.5 rounded-full font-medium " + (filter === f ? "bg-[#1E3A8A] text-white" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>{f === "전체" ? "전체" : SAMPLE_STATUS_LABELS[f]}</button>
          ))}
        </div>
        <div className="flex gap-2">
          <button onClick={() => setShowStockManage(true)} className="px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] text-sm font-medium hover:bg-[#1E3A8A]/5 whitespace-nowrap">📦 한국샘플재고</button>
          <button onClick={() => setShowFeeSettings(true)} className="px-4 py-2 rounded-lg border border-[#1E3A8A]/30 text-[#1E3A8A] text-sm font-medium hover:bg-[#1E3A8A]/5 whitespace-nowrap">⚙️ 배송비 설정</button>
          <button onClick={() => setShowCreate(true)} className="px-4 py-2 rounded-lg bg-[#1E3A8A] text-white text-sm font-medium hover:opacity-90 whitespace-nowrap">➕ 신규 샘플 발송 등록</button>
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">해당하는 샘플 진행 건이 없습니다.</div>
      ) : (
        <div className="bg-white border border-slate-300 shadow-sm rounded-xl overflow-hidden overflow-x-auto">
          <table className="w-full table-fixed divide-y divide-slate-200 text-xs">
            <colgroup>
              {/* 10열 고정폭 — '받을주소' 열 제거됨 (열 밀림 원천봉쇄) */}
              <col className="w-[96px]" />{/* 1 요청일자 */}
              <col className="w-[144px]" />{/* 2 업체명 */}
              <col className="w-[224px]" />{/* 3 제품명 */}
              <col className="w-[64px]" />{/* 4 수량 */}
              <col className="w-[112px]" />{/* 5 배송방식 */}
              <col className="w-[128px]" />{/* 6 진행 단계 */}
              <col className="w-[112px]" />{/* 7 고객승인 (배지 문구 수용) */}
              <col className="w-[112px]" />{/* 8 청구금액 */}
              <col className="w-[80px]" />{/* 9 입금확인 */}
              <col className="w-[132px]" />{/* 10 관리 */}
            </colgroup>
            <thead><tr className="bg-slate-50 text-xs font-semibold" style={{ color: "#1E293B" }}>
              <th className="text-center px-3 py-3 font-medium">요청일자</th>
              <th className="text-left px-3 py-3 font-medium">업체명</th>
              <th className="text-left px-3 py-3 font-medium">제품명</th>
              <th className="text-center px-3 py-3 font-medium">수량</th>
              <th className="text-center px-3 py-3 font-medium">배송방식</th>
              <th className="text-center px-3 py-3 font-medium">진행 단계</th>
              <th className="text-center px-3 py-3 font-medium">고객승인</th>
              <th className="text-right px-3 py-3 font-medium">청구금액</th>
              <th className="text-center px-3 py-3 font-medium">입금확인</th>
              <th className="text-center px-3 py-3 font-medium">관리</th>

            <tbody className="divide-y divide-slate-100">
              {pagedFiltered.map((s, idx) => (
                <tr key={s.id} onClick={() => { setInvoiceViewMode("view"); setInvoiceSampleId(s.id); }} className={"cursor-pointer hover:bg-[#1E3A8A]/5 " + (idx % 2 === 1 ? "bg-slate-50/40" : "")}>
                  <td className="px-3 py-3 align-middle text-center whitespace-nowrap text-slate-500">{s.requestDate || "-"}</td>
                  <td className="px-3 py-3 align-middle font-medium" style={{ color: "#111827" }} title={s.clientName}>

                  <td className="px-3 py-3 align-middle text-slate-600" title={s.productName}>
                    <div style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden", wordBreak: "keep-all" }}>
                      <span className={"inline-block text-[10px] px-1.5 py-0.5 rounded font-bold mr-1 align-middle " + SAMPLE_TYPE_BADGES[getSampleType(s)].cls}>{SAMPLE_TYPE_BADGES[getSampleType(s)].label}</span>
                      {s.productName}

                  </td>
                  <td className="px-3 py-3 align-middle text-center text-slate-600">{s.invoiceQty || "-"}</td>
                  <td className="px-3 py-3 align-middle text-center text-slate-500 truncate whitespace-nowrap" title={sampleShippingText(s, shippingFees)}>{sampleShippingText(s, shippingFees)}</td>
                  <td className="px-3 py-3 align-middle text-center" onClick={(e) => e.stopPropagation()}>
                    {/* ⚠️ 읽기 전용 배지 — 목록에서 직접 단계를 바꾸면 진행일·확인직원이 비어있는 채로 단계만 앞서간다.
                        단계 변경은 📋 진행상황 상세모달의 [확인] 버튼으로만 가능하다. */}
                    <span
                      title={`${sampleLastStatusText(s)}\n\n단계 변경은 📋 진행상황에서 [확인] 버튼으로 처리해 주세요`}
                      className={"inline-flex items-center justify-center px-3.5 py-1.5 text-xs font-bold rounded-full min-w-[70px] text-center shadow-sm whitespace-nowrap " + (SAMPLE_STATUS_COLORS[s.status] || "bg-slate-50 text-slate-500")}

                    {getSampleApproval(s).approved ? (
                      <span className="inline-flex items-center justify-center px-3.5 py-1.5 text-xs font-bold rounded-full min-w-[70px] text-center shadow-sm whitespace-nowrap bg-emerald-100 text-emerald-800">고객승인</span>

                  </td>
                  <td className="px-3 py-3 align-middle text-center whitespace-nowrap">
                    <button onClick={(e) => { e.stopPropagation(); setInvoiceViewMode("view"); setInvoiceSampleId(s.id); }} title="조회(읽기전용)" className="text-slate-400 hover:text-[#1E3A8A] mr-1">👁️</button>
                    <button onClick={(e) => { e.stopPropagation(); setInvoiceViewMode("edit"); setInvoiceSampleId(s.id); }} title="수정" className="text-slate-400 hover:text-[#1E3A8A] mr-1">✏️</button>
                    <button onClick={(e) => { e.stopPropagation(); setDetailSample(s); }} title="진행상황 보기" className="text-slate-400 hover:text-[#1E3A8A] mr-1">📋</button>
                    {getSampleType(s) === "general" && (
                      <button onClick={(e) => openCtConversion(e, s)} title="🧪 2차 CT맞춤제작 샘플로 전환 등록 (원본 일반샘플은 그대로 유지)" className="text-slate-400 hover:text-purple-600 mr-1">🧪</button>
                    )}
                    {isAdmin && <button onClick={(e) => handleDeleteRow(e, s)} title="삭제" className="text-red-400 hover:text-red-600">🗑️</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {filtered.length > 0 && <Pagination page={page} totalPages={totalPages} onChange={setPage} totalItems={filtered.length} />}

      {showCreate && <SampleCreateModal accounts={accounts} proposals={proposals} sampleStock={sampleStock} initialProposalId={pendingProposalId} presetData={ctPreset} onClose={() => { setShowCreate(false); setPendingProposalId(null); setCtPreset(null); }} onSave={handleCreateSample} />}
      {showStockManage && <SampleStockModal stock={sampleStock} products={products} isAdmin={isAdmin} onAdd={onAddStock} onUpdate={onUpdateStock} onSaveEdits={onSaveStockEdits} onDelete={onDeleteStock} onClose={() => setShowStockManage(false)} />}
      {showFeeSettings && (
        <ShippingFeeSettingsModal
          shippingFees={shippingFees}
          shippingFeeNotes={shippingFeeNotes}
          onSave={(f, n) => onSaveShippingFees && onSaveShippingFees(f, n)}
          onClose={() => setShowFeeSettings(false)}
        />
      )}
      {invoiceSample && (
        getSampleType(invoiceSample) === "ct" ? (
          <CtSampleInvoiceModal readOnly={invoiceViewMode === "view"} sample={invoiceSample} products={products} proposals={proposals} supplierLogo={supplierLogo} onUpdate={onUpdate} onClose={() => setInvoiceSampleId(null)} />
        ) : (
          <SampleInvoiceModal readOnly={invoiceViewMode === "view"} sample={invoiceSample} products={products} proposals={proposals} sampleStock={sampleStock} onDecrementStock={onDecrementStock} supplierLogo={supplierLogo} shippingFees={shippingFees} shippingFeeNotes={shippingFeeNotes} onUpdate={onUpdate} onClose={() => setInvoiceSampleId(null)} />
        )
      )}
      {detailSample && (
        <SampleDetailModal onClose={() => setDetailSample(null)}>
          <SampleCard sample={detailSample} accounts={accounts} products={products} proposals={proposals} sampleStock={sampleStock} onDecrementStock={onDecrementStock} supplierLogo={supplierLogo} shippingFees={shippingFees} shippingFeeNotes={shippingFeeNotes} onSaveShippingFees={onSaveShippingFees} currentUserName={currentUserName} isAdmin={isAdmin} onUpdate={onUpdate} onDelete={(s) => { onDelete(s); setDetailSample(null); }} onAddMemo={onAddMemo} onDeleteMemo={onDeleteMemo} />
        </SampleDetailModal>
      )}
    </main>
  );
}

/* ===================== 메인 앱 ===================== */

function App({ currentUser, onLogout, roleUser, accounts, onSaveAccount, onDeleteAccount }) {
  const isAdmin = !roleUser || roleUser.role === "admin"; // roleUser 없는 로컬/과거 세션은 관리자로 간주(하위호환)
  const [accountModalOpen, setAccountModalOpen] = useState(() => parseKoreanHash().view === "계정관리");
  const [activeStep, setActiveStep] = useState(1);
  const [settingsOpen, setSettingsOpen] = useState(() => parseKoreanHash().view === "기준정보");
  const [showFinishingAnalysis, setShowFinishingAnalysis] = useState(false);
  const [manualMergeList, setManualMergeList] = useState(null);
  const [exSettingsOpen, setExSettingsOpen] = useState(false); // 상단 유틸리티바의 "환율 상세설정" 팝업 토글
  const [logistics, setLogistics] = useState(() => (loadPricingSettingsCache() || {}).logistics || DEFAULT_LOGISTICS);
  const [marginTable, setMarginTable] = useState(() => ({ ...DEFAULT_MARGIN_TABLE, ...((loadPricingSettingsCache() || {}).marginTable || {}) }));
  const [customsRates, setCustomsRates] = useState(() => ({ ...DEFAULT_CUSTOMS_RATES, ...((loadPricingSettingsCache() || {}).customsRates || {}) }));
  const [difficultyMargins, setDifficultyMargins] = useState(() => (loadPricingSettingsCache() || {}).difficultyMargins || DEFAULT_DIFFICULTY_MARGINS);
  const [finishingOptions, setFinishingOptions] = useState(() => (loadPricingSettingsCache() || {}).finishingOptions || {}); // { [카테고리]: [{id,name,rmbPrice,krwPrice}] }
  const [shippingFees, setShippingFees] = useState(() => (loadPricingSettingsCache() || {}).shippingFees || DEFAULT_SAMPLE_SHIPPING_FEES); // 샘플 국내택배비/항공특송료 설정
  const [shippingFeeNotes, setShippingFeeNotes] = useState(() => (loadPricingSettingsCache() || {}).shippingFeeNotes || DEFAULT_SAMPLE_SHIPPING_FEE_NOTES); // 배송비별 비고 안내문구(인보이스 No3 비고란에 자동반영)
  const [clientsList, setClientsList] = useState([]);
  const [exRate, setExRate] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(EXRATE_SAVED_KEY) || "null");
      if (saved && saved.rmbToKrw) return { rmbToKrw: saved.rmbToKrw, rmbToUsd: saved.rmbToUsd, usdToKrw: saved.usdToKrw };
    } catch (e) { console.error(e); }
    return { rmbToKrw: DEFAULT_EXRATE.rmbToKrw.toFixed(2), rmbToUsd: DEFAULT_EXRATE.rmbToUsd.toFixed(2), usdToKrw: DEFAULT_EXRATE.usdToKrw.toFixed(2) };
  });
  const [exRateSavedAt, setExRateSavedAt] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(EXRATE_SAVED_KEY) || "null");
      return (saved && saved.savedAt) || null;
    } catch (e) { return null; }
  });
  const [exRateSuggestion, setExRateSuggestion] = useState(null); // API로 받아온 오늘의 추천 환율(안내문구+원클릭적용용, exRate 자체는 건드리지 않음)

  // 환율 입력창 하나가 포커스를 벗어날 때(onBlur) 소수점 둘째자리 ".00" 형식으로 강제 정돈
  const formatExRateField = (field) => {
    setExRate((prev) => ({ ...prev, [field]: (Number(prev[field]) || 0).toFixed(2) }));
  };
  // "💾 적용/저장" 버튼 — 3개 환율값을 전부 .toFixed(2)로 정돈하고 localStorage에 저장, 저장일시를 즉시 갱신.
  // exRate state 자체를 갱신하므로 제안가 계산식(useMemo가 exRate를 의존성으로 갖고 있음)에도 즉시 재계산 반영됨.
  const saveExRate = () => {
    const formatted = {
      rmbToKrw: (Number(exRate.rmbToKrw) || 0).toFixed(2),
      rmbToUsd: (Number(exRate.rmbToUsd) || 0).toFixed(2),
      usdToKrw: (Number(exRate.usdToKrw) || 0).toFixed(2),
    };
    const savedAt = nowDateTimeStr(); // "YYYY-MM-DD HH:mm:ss"
    setExRate(formatted);
    setExRateSavedAt(savedAt);
    try { localStorage.setItem(EXRATE_SAVED_KEY, JSON.stringify({ ...formatted, savedAt })); } catch (e) { console.error(e); }
    alert("환율 설정이 성공적으로 변경되었습니다."); // 확인 누르면 즉시 아래에서 모달을 닫음
    setExSettingsOpen(false);
  };

  // 페이지 로드시 캐시된 환율을 즉시 보여주고, 오늘 아직 갱신 안 됐으면 API를 호출해 하루 1회만 자동 갱신.
  // 이 API호출은 화면 렌더링에 필요한 작업이 아니므로 requestIdleCallback(브라우저가 한가할 때)으로 미뤄서
  // 첫 화면이 뜨는 속도와 경합하지 않도록 한다(미지원 브라우저는 setTimeout으로 대체).
  useEffect(() => {
    const runWhenIdle = (fn) => {
      if (typeof requestIdleCallback === "function") requestIdleCallback(fn, { timeout: 2000 });
      else setTimeout(fn, 200);
    };
    runWhenIdle(() => {
      try {
        const cached = JSON.parse(localStorage.getItem(EXRATE_CACHE_KEY) || "null");
        if (cached) setExRateSuggestion(cached);
        if (cached && cached.fetchedDate === todayStr()) return; // 오늘 이미 갱신됨
      } catch (e) { console.error(e); }
      fetchTodayExchangeRates().then((rates) => { if (rates) setExRateSuggestion(rates); });
    });
  }, []);

  // "🔄 오늘 환율 적용" 버튼 — API로 받아온 추천 환율을 입력창(exRate)에 즉시 반영해 제안가 계산식에 바로 연동
  const applyTodayExchangeRates = () => {
    if (!exRateSuggestion) { setToast("아직 환율 정보를 불러오지 못했습니다. 인터넷 연결을 확인해주세요."); return; }
    setExRate({
      rmbToKrw: Number(exRateSuggestion.rmbToKrw).toFixed(2),
      rmbToUsd: Number(exRateSuggestion.rmbToUsd).toFixed(2),
      usdToKrw: Number(exRateSuggestion.usdToKrw).toFixed(2),
    });
    setToast("오늘 기준 환율을 적용했습니다. (하단 '💾 적용/저장' 버튼을 눌러야 다음 접속에도 유지됩니다)");
  };
  const [supplierLogo, setSupplierLogo] = useState(() => (loadPricingSettingsCache() || {}).supplierLogo || "");

  // 기준정보(물류비/마진율표/관세율/난이도차등율/로고)를 Firestore에서도 불러와 다른 기기와 동기화(최초 1회, 있으면 localStorage 캐시보다 우선 적용)
  useEffect(() => {
    if (!FIREBASE_ENABLED || !db) return;
    db.collection(COLLECTIONS.settings).doc("pricingConfig").get().then((doc) => {
      if (!doc.exists) return;
      const data = doc.data() || {};
      if (data.logistics) setLogistics(data.logistics);
      if (data.marginTable) setMarginTable((prev) => ({ ...prev, ...data.marginTable }));
      if (data.customsRates) setCustomsRates((prev) => ({ ...prev, ...data.customsRates }));
      if (data.difficultyMargins) setDifficultyMargins(data.difficultyMargins);
      if (data.supplierLogo) setSupplierLogo(data.supplierLogo);
      if (data.finishingOptions) setFinishingOptions(data.finishingOptions);
      if (data.shippingFees) setShippingFees(data.shippingFees);
      if (data.shippingFeeNotes) setShippingFeeNotes(data.shippingFeeNotes);
    }).catch((e) => console.error("기준정보 불러오기 실패:", e));
  }, []);

  // "저장하고 닫기" 버튼 — 기준정보 7종을 localStorage + Firestore에 함께 저장(다음 접속에도 유지, 다른 기기와도 동기화)
  const saveSettingsConfig = async () => {
    const payload = { logistics, marginTable, customsRates, difficultyMargins, supplierLogo, finishingOptions, shippingFees, shippingFeeNotes, savedAt: nowDateTimeStr() };
    try { localStorage.setItem(PRICING_SETTINGS_KEY, JSON.stringify(payload)); invalidatePricingSettingsCache(payload); } catch (e) { console.error(e); }
    try { if (FIREBASE_ENABLED && db) await db.collection(COLLECTIONS.settings).doc("pricingConfig").set(payload); } catch (e) { console.error(e); }
  };

  // 배송비 설정만 별도로 즉시 저장(⚙️ 배송비 설정 모달에서 사용) — 다른 기준정보 항목은 건드리지 않고 배송비만 갱신
  const saveShippingFees = async (fees, notes) => {
    setShippingFees(fees);
    setShippingFeeNotes(notes);
    const cache = loadPricingSettingsCache() || {};
    const payload = { ...cache, logistics, marginTable, customsRates, difficultyMargins, supplierLogo, finishingOptions, shippingFees: fees, shippingFeeNotes: notes, savedAt: nowDateTimeStr() };
    try { localStorage.setItem(PRICING_SETTINGS_KEY, JSON.stringify(payload)); invalidatePricingSettingsCache(payload); } catch (e) { console.error(e); }
    try { if (FIREBASE_ENABLED && db) await db.collection(COLLECTIONS.settings).doc("pricingConfig").set(payload); } catch (e) { console.error(e); }
    setToast("배송비 설정을 저장했습니다.");
  };

  // 1단계: 가격조사 저장소
  const [sourcingItems, setSourcingItems] = useState([]);
  const [pendingQueue, setPendingQueue] = useState([]);

  // 2단계: 현재 입력 중인 품목
  const [productImage, setProductImage] = useState("");
  const [productName, setProductName] = useState("");
  const [specSize, setSpecSize] = useState("");
  const [material, setMaterial] = useState("");
  const [itemFactory, setItemFactory] = useState("");
  const [itemWechatGroup, setItemWechatGroup] = useState("");
  const [category, setCategory] = useState(CATEGORIES[0]);
  const [quantity, setQuantity] = useState(3000);
  const [cbm, setCbm] = useState(1);
  const [customsRate, setCustomsRate] = useState(DEFAULT_CUSTOMS_RATES[CATEGORIES[0]]);
  const [rmbBase, setRmbBase] = useState(2.95);
  const [rmbBox, setRmbBox] = useState(0);
  const [rmbInspect, setRmbInspect] = useState(0);
  const [rmbShip, setRmbShip] = useState(0);
  // "③ 위안화 원가 입력" 자동연동 — 제품명·주문수량이 바뀌면 제품DB에 등록된 수량별 스펙(priceTiers)에서
  // 지금 수량과 가장 가까운(또는 정확히 일치하는) 구간의 검품비용 총액(RMB)을 찾아 자동으로 채워넣는다.
  useEffect(() => {
    const matchedProduct = productsList.find((p) => p.name === productName);
    const tiers = matchedProduct && matchedProduct.priceTiers;
    if (!tiers || tiers.length === 0) return;
    const qtyNum = Number(quantity) || 0;
    if (qtyNum <= 0) return;
    let best = tiers.find((t) => Number(t.qty) === qtyNum);
    if (!best) {
      best = tiers.reduce((closest, t) => {
        if (!t.qty) return closest;
        const diff = Math.abs(Number(t.qty) - qtyNum);
        const closestDiff = closest ? Math.abs(Number(closest.qty) - qtyNum) : Infinity;
        return diff < closestDiff ? t : closest;
      }, null);
    }
    if (best && best.inspectionRmb !== undefined && best.inspectionRmb !== "") {
      setRmbInspect(Number(best.inspectionRmb) || 0);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [productName, quantity, productsList]);
  const [selectedFinishingIds, setSelectedFinishingIds] = useState([]); // "④ 후가공 선택"에서 체크된 항목 id들(가격반영모드)
  const [selectedFinishingQty, setSelectedFinishingQty] = useState({}); // { [후가공id]: 선택된 수량/도수 } — 가변형 항목에서만 의미있음
  const [guideSelectedIds, setGuideSelectedIds] = useState([]); // "미선택/별도안내" 모드에서 체크된 후가공id들
  const [guideTexts, setGuideTexts] = useState({}); // { [후가공id]: 사용자가 수정 가능한 안내문구 } — 체크시 기본문구로 자동채움
  const [finishingApplyMode, setFinishingApplyMode] = useState("apply"); // "apply"=선택한 후가공 단가를 원가에 합산 / "guide"=가격변동없이 안내문구만 노출
  const [costLocked, setCostLocked] = useState(true);
  const [spec, setSpec] = useState("화이트 용기 / 화이트 캡 기본 사양");
  const [printPrice, setPrintPrice] = useState(20);
  const [finishing, setFinishing] = useState("별도 견적");
  const [leadTime, setLeadTime] = useState(30);
  const [extraOptions, setExtraOptions] = useState([]);
  const [marginOverride, setMarginOverride] = useState(null);
  const [marginClientName, setMarginClientName] = useState("");
  const [marginClientSearch, setMarginClientSearch] = useState(""); // 고객사 자동완성 검색창 입력값
  const [showMarginClientSuggestions, setShowMarginClientSuggestions] = useState(false);

  useEffect(() => { setCustomsRate(customsRates[category] ?? 0); }, [category]);
  useEffect(() => { setMarginOverride(null); setSelectedFinishingIds([]); setSelectedFinishingQty({}); setGuideSelectedIds([]); setGuideTexts({}); }, [category]);

  const calc = useMemo(() => {
    const qty = Number(quantity) || 0;
    const boxPerUnit = qty > 0 ? (Number(rmbBox) || 0) / qty : 0;
    const inspectPerUnit = qty > 0 ? (Number(rmbInspect) || 0) / qty : 0;
    const shipPerUnit = qty > 0 ? (Number(rmbShip) || 0) / qty : 0;
    // "④ 후가공 선택"에서 가격반영 모드로 체크된 항목들의 위안화 단가 합산(개당) — 미선택/안내모드일 땐 가격에 영향 없음
    // 가변 수량/도수형은 선택한 수량만큼 배수로 가산, 고정 단가형은 수량과 무관하게 1회만 가산
    const selectedFinishingItems = finishingApplyMode === "apply"
      ? (finishingOptions[category] || [])
          .filter((f) => selectedFinishingIds.includes(f.id))
          .map((f) => ({ ...f, qty: f.optionType === "variable" ? (selectedFinishingQty[f.id] || 1) : 1 }))
      : [];
    const finishingRmbPerUnit = selectedFinishingItems.reduce((s, f) => s + (Number(f.rmbPrice) || 0) * (f.qty || 1), 0);
    const unitRmb = (Number(rmbBase) || 0) + boxPerUnit + inspectPerUnit + shipPerUnit + finishingRmbPerUnit;
    const totalRmbPayment = unitRmb * qty;
    const autoMarginRate = getMarginRate(marginTable, category, totalRmbPayment);
    const clientDifficulty = (clientsList.find((c) => c.name === marginClientName) || {}).difficulty || "표준";
    const difficultyAdjust = (difficultyMargins[clientDifficulty] || 0) / 100;
    const marginRate = (marginOverride != null ? marginOverride : autoMarginRate) + difficultyAdjust;
    const unitCostKrw = unitRmb * exRate.rmbToKrw;
    const pureFactoryCostKrw = (Number(rmbBase) || 0) * exRate.rmbToKrw;
    const logisticsTotal = (Number(cbm) || 0) * logistics.cbmRate + logistics.blFee + logistics.originFee + logistics.brokerFee;
    const logisticsPerUnit = qty > 0 ? logisticsTotal / qty : 0;
    const customsPerUnit = (unitCostKrw + logisticsPerUnit) * ((Number(customsRate) || 0) / 100);
    const totalCostPerUnit = unitCostKrw + logisticsPerUnit + customsPerUnit;
    const overheadPerUnit = (unitCostKrw - pureFactoryCostKrw) + logisticsPerUnit + customsPerUnit;
    const rawPrice = marginRate < 1 ? totalCostPerUnit / (1 - marginRate) : 0;
    const proposedPrice = Math.ceil(rawPrice / 10) * 10;
    const profitPerUnit = proposedPrice - totalCostPerUnit;
    const profitRate = proposedPrice > 0 ? (profitPerUnit / proposedPrice) * 100 : 0;
    return {
      unitRmb, boxPerUnit, inspectPerUnit, shipPerUnit, totalRmbPayment, marginRate, autoMarginRate,
      unitCostKrw, pureFactoryCostKrw, overheadPerUnit, logisticsPerUnit, customsPerUnit, totalCostPerUnit,
      proposedPrice, profitPerUnit, profitRate, totalProfit: profitPerUnit * qty, totalProposal: proposedPrice * qty,
      totalFactoryCost: pureFactoryCostKrw * qty, totalOverhead: overheadPerUnit * qty,
      selectedFinishingItems, finishingRmbPerUnit,
    };
  }, [category, quantity, cbm, customsRate, rmbBase, rmbBox, rmbInspect, rmbShip, marginTable, logistics, exRate, marginOverride, clientsList, difficultyMargins, marginClientName, finishingOptions, selectedFinishingIds, selectedFinishingQty, finishingApplyMode]);

  const [draftItems, setDraftItems] = useState([]);
  const [clientInfo, setClientInfo] = useState(() => ({ clientName: "", contact: "", channel: "카카오채널", employee: (roleUser && roleUser.displayName) || "", proposalTitle: "" }));
  const [proposalList, setProposalList] = useState([]);
  const [invoiceList, setInvoiceList] = useState([]); // INVOICE(인보이스) 발행 목록 — 제안서에서 파생, proposalId로 연결
  const [factoriesList, setFactoriesList] = useState([]);
  const [productsList, setProductsList] = useState([]);
  const [excelArchiveList, setExcelArchiveList] = useState([]);
  const [taskList, setTaskList] = useState([]);
  const [sampleList, setSampleList] = useState([]);
  const [sampleStockList, setSampleStockList] = useState([]);
  const [productToPick, setProductToPick] = useState(null);
  const [sampleInitProposalId, setSampleInitProposalId] = useState(null); // "🧪 샘플요청 등록"으로 4단계에 전달할 발송완료 제안서 id
  // 발송완료된 제안서 하나를 골라 4단계(샘플진행)로 "선택적" 전환 — 자동이관이 아니라 사용자가 명시적으로 누를 때만
  const createSampleFromProposal = (p) => {

  const [fsSlowWarning, setFsSlowWarning] = useState(false); // 일정 시간이 지나도 응답이 전혀 없을 때(네트워크/방화벽 차단 등 의심) 표시

    } catch (e) {
